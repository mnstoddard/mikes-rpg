# Render Blueprint: one free web service that runs the game server and
# serves the built 3D game from the same address (WebSockets included).
# (Set CLIENT=2d in the Render dashboard to show the older 2D game instead.)
# Render redeploys automatically every time new code lands on main.
services:
  - type: web
    name: mikes-rpg
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    # --include=dev: the build needs Vite and the server runs with tsx,
    # which are dev dependencies.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Neon Postgres connection string for accounts and saves. It's a secret,
      # so it isn't written here: set it in the Render dashboard (Environment tab).
      - key: DATABASE_URL
        sync: false
      # Password for the bug report review page (/admin/reports). Also a secret:
      # set it in the Render dashboard. Until it's set, the page stays locked.
      - key: ADMIN_PASSWORD
        sync: false
