<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-label="Map of Embervale" style="width:100%;height:auto;display:block;border-radius:10px">
<defs>
<radialGradient id="wm-sea" cx="50%" cy="50%" r="75%"><stop offset="0" stop-color="#e9dcb8"/><stop offset="1" stop-color="#cdb98a"/></radialGradient>
<pattern id="wm-sand" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e3c17a"/><circle cx="2" cy="2" r=".9" fill="#c79d4f"/><circle cx="6" cy="6" r=".7" fill="#c79d4f"/></pattern>
<pattern id="wm-trees" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#3f6b3a"/><path d="M7 2 L11 10 L3 10Z" fill="#2c4f2a"/></pattern>
<pattern id="wm-jungle" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#2f7d4a"/><circle cx="4" cy="5" r="3" fill="#1f6a3a"/><circle cx="11" cy="10" r="3" fill="#3d9a58"/></pattern>
<pattern id="wm-swamp" width="16" height="10" patternUnits="userSpaceOnUse"><rect width="16" height="10" fill="#4b5a44"/><path d="M1 7 h6 M9 3 h6" stroke="#2e3a2c" stroke-width="1.4"/></pattern>
<pattern id="wm-snow" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#e8f1f6"/><path d="M6 3v6M3 6h6" stroke="#b9cfdc" stroke-width="1"/></pattern>
<pattern id="wm-rock" width="18" height="14" patternUnits="userSpaceOnUse"><rect width="18" height="14" fill="#8a7f78"/><path d="M2 12 L8 3 L14 12" fill="#6f6560"/></pattern>
<filter id="wm-rough"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="14"/></filter>
</defs>
<rect width="1000" height="720" fill="#7fa7b8"/>
<g filter="url(#wm-rough)">
<path d="M60 70 C260 20 700 20 880 70 C900 220 930 400 880 520 C860 640 700 700 500 690 C300 700 120 660 70 560 C20 430 30 220 60 70Z" fill="url(#wm-sea)"/>
<!-- Frostfell -->
<path d="M150 70 C350 40 650 40 830 75 C820 120 780 150 700 150 C560 165 420 150 300 155 C220 150 160 125 150 70Z" fill="url(#wm-snow)" stroke="#9fb8c6" stroke-width="2"/>
<!-- Greyspine -->
<path d="M300 165 C420 150 600 155 700 160 C720 210 690 260 640 275 C560 290 450 290 370 275 C320 260 290 215 300 165Z" fill="url(#wm-rock)" stroke="#5e5550" stroke-width="2"/>
<!-- Barrens -->
<path d="M120 250 C200 235 290 250 360 285 C380 340 370 430 350 480 C290 500 200 495 140 470 C110 400 105 320 120 250Z" fill="url(#wm-sand)" stroke="#b08a43" stroke-width="2"/>
<!-- Sundered Crown -->
<path d="M50 300 C80 285 115 290 125 320 C135 360 125 410 100 430 C70 440 45 420 42 385 C38 350 40 320 50 300Z" fill="#b9b2a6" stroke="#6d6258" stroke-width="2"/>
<!-- Saltmere -->
<path d="M700 175 C760 190 830 230 870 290 C890 360 880 430 850 480 C800 490 740 470 705 440 C690 380 690 300 700 175Z" fill="#c9d8a0" stroke="#7d9a5a" stroke-width="2"/>
<!-- Thornwood -->
<path d="M360 470 C430 465 540 465 610 480 C630 530 610 600 560 625 C490 645 410 640 370 610 C340 570 340 510 360 470Z" fill="url(#wm-trees)" stroke="#2c4f2a" stroke-width="2"/>
<!-- Tangle -->
<path d="M615 480 C680 470 760 470 830 495 C850 560 810 640 730 660 C670 670 610 650 580 625 C620 590 630 530 615 480Z" fill="url(#wm-jungle)" stroke="#1f6a3a" stroke-width="2"/>
<!-- Blackfen -->
<path d="M140 475 C210 495 300 500 355 485 C340 540 365 600 370 615 C300 650 200 650 130 600 C100 560 110 510 140 475Z" fill="url(#wm-swamp)" stroke="#2e3a2c" stroke-width="2"/>
<!-- Heartvale -->
<circle cx="500" cy="375" r="105" fill="#9cc56a" stroke="#5f8a3a" stroke-width="3"/>
</g>
<!-- Hollow Heart below -->
<circle cx="500" cy="385" r="36" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="500" cy="385" r="10" fill="#e67e22" opacity=".85"/>
<!-- grey dust at the edge of Heartvale -->
<path d="M405 330 A105 105 0 0 0 402 420" fill="none" stroke="#a9a49a" stroke-width="10" opacity=".7"/>
<!-- King's Roads -->
<g fill="none" stroke="#8a5a2b" stroke-width="3.2" stroke-linecap="round">
<path d="M462 352 C420 340 330 345 250 360"/>
<path d="M250 360 C190 365 140 360 100 365" stroke-dasharray="7 6"/>
<path d="M470 320 C480 280 495 245 505 220"/>
<path d="M545 360 C620 345 700 335 780 330"/>
<path d="M480 470 C482 500 485 525 488 545"/>
<path d="M560 450 C610 500 670 540 720 560"/>
<path d="M430 450 C380 500 320 530 250 560"/>
<path d="M505 220 C510 180 505 140 500 105" stroke-dasharray="3 7"/>
</g>
<!-- Saltmere boat route to the Tangle -->
<path d="M850 400 C900 470 880 530 815 560" fill="none" stroke="#2f5d74" stroke-width="2" stroke-dasharray="2 6"/>
<!-- great shrine cities -->
<g font-family="Georgia,serif" font-size="15" fill="#2b2118" text-anchor="middle">
<g fill="#f6c453" stroke="#7a4a12" stroke-width="1.5">
<circle cx="462" cy="350" r="9"/><circle cx="505" cy="220" r="7"/><circle cx="250" cy="360" r="7"/><circle cx="780" cy="330" r="7"/><circle cx="488" cy="550" r="7"/><circle cx="725" cy="565" r="7"/><circle cx="250" cy="562" r="7"/>
</g>
<circle cx="500" cy="100" r="7" fill="#bcdff0" stroke="#4d7a93" stroke-width="1.5"/>
<path d="M78 352 l10 18 h-20z M98 375 l9 16 h-18z" fill="#7a6e62"/>
<text x="462" y="336" font-weight="bold">Emberhold</text>
<text x="462" y="320" font-size="11">The Heart Shrine</text>
</g>
<!-- region labels -->
<g font-family="Georgia,serif" text-anchor="middle" font-weight="bold" font-size="20" stroke="#fff8e6" stroke-width="4" paint-order="stroke" fill="#2b2118">
<text x="500" y="410">Heartvale</text>
<text x="500" y="75" fill="#24485c">Frostfell</text>
<text x="420" y="205">Greyspine Peaks</text>
<text x="235" y="420">The Ashen Barrens</text>
<text x="86" y="460" font-size="15">The Sundered</text><text x="86" y="478" font-size="15">Crown</text>
<text x="790" y="390">Saltmere</text><text x="790" y="412">Coast</text>
<text x="470" y="600">The Thornwood</text>
<text x="735" y="615">The Tangle</text>
<text x="240" y="610">Blackfen</text>
</g>
<g font-family="Georgia,serif" text-anchor="middle" font-size="12" fill="#2b2118" stroke="#fff8e6" stroke-width="3" paint-order="stroke">
<text x="500" y="440" fill="#8e2a1e">The Hollow Heart lies below</text>
<text x="500" y="122" fill="#24485c">Wick's frozen shrine</text>
<text x="575" y="272">Crystal Cave</text>
<text x="160" y="352">Whitestone road</text>
<text x="930" y="470" fill="#24485c">by boat</text>
</g>
<!-- cave markers for the Deeps -->
<g fill="#2b2118"><path d="M560 248 a10 8 0 0 1 20 0z"/><path d="M300 300 a10 8 0 0 1 20 0z"/><path d="M420 520 a10 8 0 0 1 20 0z"/><path d="M640 205 a10 8 0 0 1 20 0z"/></g>
<!-- legend -->
<g font-family="Georgia,serif" font-size="12" fill="#2b2118">
<rect x="12" y="10" width="220" height="100" rx="8" fill="#fff8e6" opacity=".9" stroke="#8a5a2b"/>
<circle cx="30" cy="30" r="6" fill="#f6c453" stroke="#7a4a12"/><text x="44" y="34">Great shrine and its city</text>
<path d="M22 52 h18" stroke="#8a5a2b" stroke-width="3"/><text x="44" y="56">King's Road (shrine road)</text>
<path d="M22 74 h18" stroke="#8a5a2b" stroke-width="3" stroke-dasharray="3 5"/><text x="44" y="78">Closed until Act 4</text>
<path d="M24 100 a8 6 0 0 1 16 0z" fill="#2b2118"/><text x="44" y="100">The Deeps (caves)</text>
</g>
</svg>
