>\n\u003cul>\u003cli>\u003cb>With Vale:\u003c/b> Crowe, Flint, Merrow and Dunn. They had grown used to the power their shrines brought them, and chose to keep it.\u003c/li>\u003cli>\u003cb>With Wick:\u003c/b> Ivy and Reed.\u003c/li>\u003c/ul>\n\u003cp>Vale's side won. Ivy and Reed were killed. Wick survived, but the victors took his shrine and cut him off from it, and Frostfell froze with it.\u003c/p>\n\u003cp>\u003cb>The impostors:\u003c/b> nobody outside the Circle ever learned that Ivy and Reed had died. Vale chose two of the most corrupt Emberguard and Emberborn to take their names and their shrines. Today's Warden Ivy and Warden Reed are those impostors, living on the siphon like the rest of \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>.\u003c/p>\n\u003cp>\u003cb>The rewrite:\u003c/b> at the end of the war Vale faked his death and began rewriting history, so that Wick became the one who caused the Emberfall too. The Emberguard took \u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">The Mages' Guild\u003c/a>'s records about the Emberheart around this time.\u003c/p>\u003c/div>","src":["wiki/pages/sundering-war.md"],"w":true,"r":false},{"s":"swiftness-potion","t":"Swiftness potion","c":"Items","i":"🧪","sum":"You walk faster for a while.","a":[],"ib":[["Alchemy level","15"],["Ingredients","Boar tusks + Ginseng roots"],["XP","20"],["First tries work","50%"]],"h":"\u003cp>You walk faster for a while. Brew it with \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> level 15 from \u003ca href=\"#boar-tusks\" data-to=\"boar-tusks\">Boar tusks\u003c/a> and \u003ca href=\"#ginseng-roots\" data-to=\"ginseng-roots\">Ginseng roots\u003c/a> in a vial. See \u003ca href=\"#potions\" data-to=\"potions\">Potions\u003c/a>.\u003c/p>","src":["shared/alchemy.ts"],"w":false,"r":false},{"s":"sword","t":"Sword","c":"Items","i":"🗡️","sum":"A melee weapon.","a":[],"ib":[["Style","Melee"],["Level","5"],["Biggest hit","3 + metal"],["Attacks every","2.4s"],["Range","1 tile"],["Hands","One"]],"h":"\u003cp>🗡️ The sword needs \u003ca href=\"#melee\" data-to=\"melee\">Melee\u003c/a> level 5. Its biggest hit is 3, plus its metal's bonus. It attacks every 2.4s and reaches 1 tile. See \u003ca href=\"#weapons\" data-to=\"weapons\">Weapons\u003c/a> and \u003ca href=\"#combat\" data-to=\"combat\">Combat\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"swordfish","t":"Swordfish","c":"Items","i":"🐬","sum":"Fish. Sells for 70 bronze.","a":[],"ib":[["Kind","Fish"],["Shop pays","70 bronze"],["Game id","\u003ccode>swordfish\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a> level 60 from a swordfish spot (36 XP each).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (fish): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"tamsin","t":"Tamsin","c":"People","i":"🧭","sum":"The Ashbound's best scout, a Rooted girl from the Barrens.","a":[],"ib":[],"h":"\u003cp>\u003cb>Tamsin\u003c/b> is a \u003ca href=\"#the-rooted\" data-to=\"the-rooted\">Rooted\u003c/a> girl whose village in \u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a> withered away. She's \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>'s best scout. She'll outlive every Emberborn friend she has, and knows it.\u003c/p>\n\u003cp>Not in the game yet.\u003c/p>","src":["wiki/pages/person-tamsin.md"],"w":true,"r":false},{"s":"the-ashbound","t":"The Ashbound","c":"Factions","i":"⚱️","sum":"Mad bandits who smash shrines and attack heroes. Or so everyone says.","a":["Ashbound"],"ib":[["Leader","\u003ca href=\"#sable\" data-to=\"sable\">Sable\u003c/a> (🔒 and \u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a>, in hiding)"],["Founded","About year 780"],["Home","A camp in the \u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">Barrens\u003c/a> (and one in the Thornwood)"],["Saying","&quot;Better ash than a thief.&quot;"]],"h":"\u003cp>\u003cb>The Ashbound\u003c/b> are known in \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a> as mad bandits who smash shrines and attack heroes. \u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">Captain Bryn\u003c/a> puts bounties on them because the Emberguard ask. In the game today you meet Ashbound scouts on the Westroad and Ashbound raiders deep in \u003ca href=\"#the-thornwood\" data-to=\"the-thornwood\">The Thornwood\u003c/a>.\u003c/p>\n\u003cp>They pass messages hidden inside the bases of \u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>'s shrine totems.\u003c/p>\n\u003ch2 id=\"s-what-the-emberguard-say\">What the Emberguard say\u003c/h2>\n\u003cp>The Ashbound have been around for about twenty years. They're led by \u003ca href=\"#sable\" data-to=\"sable\">Sable\u003c/a>, the champion who ran from her own Ceremony the night before it and went mad with shame. For years they were just &quot;bandits in the woods&quot;. Lately the Emberguard teach that they're the ones killing the land: poisoning the far fields, smashing shrines, spreading \u003ca href=\"#the-withering\" data-to=\"the-withering\">The Withering\u003c/a> and the grey sickness through the trees. Every dead field gets blamed on them. Some Keepers whisper that they serve \u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a>.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003ch2 id=\"s-how-they-were-founded\">How they were founded\u003c/h2>\n\u003cp>\u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a> spent three hundred years in hiding after the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>, too weak to fight \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a> alone, researching a way to heal the land. About twenty years ago he finally made his move. He reached Sable, the Emberguard's brightest champion, before her Ceremony and showed her the truth. She vanished the night before, and the two of them started the Ashbound, one Emberborn at a time.\u003c/p>\n\u003cp>Wick chooses who to approach: champions close to their Ceremony, Emberborn with doubts, Rooted families who lost someone to one. Sable leads in public. Wick stays hidden; almost no one in the Ashbound has met him.\u003c/p>\n\u003cp>The Withering began centuries before the Ashbound existed. Blaming them is the Emberguard's cover-up for what Vale is taking.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-why-theyre-called-the-ashbound\">Why they're called the Ashbound\u003c/h2>\n\u003cp>\u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> only exist because the shrines hold them together. Every Emberborn is tied to the Heart Shrine by a thread, and that thread is how the Tithe is taken. The Ashbound have had theirs cut. Without it, grey ash slowly creeps up their hands, and they rise at Ashbound hearths instead of shrines. They are bound for ash, and they chose it rather than feed the thief. Their saying is \u003ci>&quot;Better ash than a thief.&quot;\u003c/i>\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The Ashbound don't smash shrines. When they can reach a small shrine unseen, they cut its thread, so its warmth stays in the land around it. The shrine flickers and goes dark for a day, which is what the Emberguard call smashing. Then it comes back brighter, and the land around it slowly greens.\u003c/p>\n\u003cp>Wick knows how to do the same for a great shrine: \u003cb>free\u003c/b> it, so everything it draws goes back out to the land. But only someone who can get past an Emberwarden can try it. That's what the player does in Act 4 (see \u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a>).\u003c/p>\u003c/div>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>They're the good guys: Emberborn and \u003ca href=\"#the-rooted\" data-to=\"the-rooted\">The Rooted\u003c/a> who know the truth about \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a> and the Ceremony, trying to cut the Undying off from the land. Their hope is Wick's research, and the \u003ca href=\"#ember-seed\" data-to=\"ember-seed\">Ember Seed\u003c/a>. They live the \u003ca href=\"#the-tenders\" data-to=\"the-tenders\">Tender\u003c/a> way, with hearths that burn without a shrine.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-people\">People\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"#sable\" data-to=\"sable\">Sable\u003c/a>, their leader.\u003c/li>\u003cli>\u003ca href=\"#rhys\" data-to=\"rhys\">Rhys\u003c/a>, after his Joining.\u003c/li>\u003cli>The player, from the end of Act 3.\u003c/li>\u003cli>\u003ca href=\"#tamsin\" data-to=\"tamsin\">Tamsin\u003c/a>, their best scout.\u003c/li>\u003c/ul>","src":["wiki/pages/ashbound.md"],"w":true,"r":false},{"s":"the-ashen-barrens","t":"The Ashen Barrens","c":"Places","i":"🏜️","sum":"Desert of glass and sand, full of Aldmeran ruins, and the Ashbound camp.","a":["Barrens","The Barrens","Ashen Barrens"],"ib":[["Levels","20 to 60 (easy near the city, harder further out)"],["Home of","Gold, topaz and Aldmeran relics (see \u003ca href=\"#resources-by-region\" data-to=\"resources-by-region\">Resources by region\u003c/a>)"]],"h":"\u003cp>\u003cb>The Ashen Barrens\u003c/b> are a desert in the west: once Aldmera's richest farmland, now glass and sand. They hold ruins of \u003ca href=\"#aldmera\" data-to=\"aldmera\">Aldmera\u003c/a>, the King's Road, and \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>'s camp. Past its far western edge lies \u003ca href=\"#the-sundered-crown\" data-to=\"the-sundered-crown\">The Sundered Crown\u003c/a>, the ruins of \u003ca href=\"#whitestone\" data-to=\"whitestone\">Whitestone\u003c/a> and the endgame area. Warden Dunn keeps its great shrine, and the city around it (\u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwardens\u003c/a>).\u003c/p>\n\u003cp>It burned when the Emberfall's torrent tore through Whitestone, and \u003ca href=\"#the-withering\" data-to=\"the-withering\">The Withering\u003c/a> keeps turning what's left to glass and sand. \u003ca href=\"#tamsin\" data-to=\"tamsin\">Tamsin\u003c/a>'s village withered away here.\u003c/p>\n\u003cp>Not in the game yet; the road west is closed.\u003c/p>","src":["wiki/pages/barrens.md"],"w":true,"r":false},{"s":"the-blight","t":"The Blight","c":"Factions","i":"🦠","sum":"Sick, angry animals. A symptom, not a group.","a":["Blight","Blighted"],"ib":[],"h":"\u003cp>\u003cb>The Blight\u003c/b> is the name for sick, angry animals: grey, glowing and mean. The \u003ca href=\"#hollow-wolf\" data-to=\"hollow-wolf\">Hollow wolves\u003c/a> of Wolf Hollow are Blighted. Everyone believes \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a> keep the Blight back.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>Blighted creatures are living things the ember has drained out of. They're starving for ember, and that's what makes them angry. The Blight starts at the cold edges, furthest from any shrine, and creeps inward with the Withering. Blighted animals often come toward the shrines, drawn to the warmth they can't get enough of.\u003c/p>\u003c/div>","src":["wiki/pages/blight.md"],"w":true,"r":false},{"s":"the-crystal-cave","t":"The crystal cave","c":"Places","i":"💎","sum":"A deep cave full of ember crystal, and the closest you can get to the Emberheart on foot.","a":["Crystal Cave","The Crystal Cave"],"ib":[["Kind","Cave"],["Danger","Monsters attack on sight"],["Size","30 × 14 tiles"]],"h":"\u003cp>\u003cb>The Crystal Cave\u003c/b> is a deep cave full of ember crystal, reached through the spider cave past the quarry. Platinum, iridium and gem rocks are mined there.\u003c/p>\n\u003cp>It's the closest you can get to \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a> on foot: the rock is warm to the touch, and \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a> says it's colder than when she was a girl. A huge scorched shaft runs from it toward Heartvale, too straight to be natural (a planned quest, \u003ci>The Old Shaft\u003c/i>).\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"crystal_cave\">\u003c/figure>","src":["wiki/pages/crystal-cave.md","shared/world.ts","shared/npcs.ts"],"w":true,"r":false},{"s":"the-deeps","t":"The Deeps","c":"Places","i":"🕳️","sum":"The caves under the land, used as dungeons.","a":["Deeps"],"ib":[["Levels","Various"],["Home of","Platinum, amethyst and gems of every kind (see \u003ca href=\"#resources-by-region\" data-to=\"resources-by-region\">Resources by region\u003c/a>)"]],"h":"\u003cp>\u003cb>The Deeps\u003c/b> are the caves that run under every region: old mines, goblin tunnels, Aldmeran cellars and natural caverns. They're the game's dungeons. There are no shrines down here, so falling in the Deeps means waking at the nearest shrine above.\u003c/p>\n\u003cp>The spider cave and \u003ca href=\"#the-crystal-cave\" data-to=\"the-crystal-cave\">Crystal Cave\u003c/a> off the quarry in \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a> are the first of them, and the only ones in the game so far. The deepest caves lead toward \u003ca href=\"#the-hollow-heart\" data-to=\"the-hollow-heart\">The Hollow Heart\u003c/a>, the main story's final area.\u003c/p>","src":["wiki/pages/deeps.md"],"w":true,"r":false},{"s":"the-ember","t":"The ember","c":"Lore","i":"✨","sum":"The land's warmth, sent up by the Emberheart. Mana is just ember you can use.","a":["Ember","Mana"],"ib":[],"h":"\u003cp>\u003cb>The ember\u003c/b> is the land's own warmth. It rises from \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a>, deep under the land, and is in everything that grows.\u003c/p>\n\u003ch2 id=\"s-where-it-shows\">Where it shows\u003c/h2>\n\u003cp>Where the ember runs close to the surface, you can see it.\u003c/p>\n\u003cul>\u003cli>Ore glows. Emberstone is ember that cooled into crystal.\u003c/li>\u003cli>The old trees of \u003ca href=\"#the-thornwood\" data-to=\"the-thornwood\">The Thornwood\u003c/a> glowed softly at night.\u003c/li>\u003cli>A few people are born with more of it than others, and can shape it with their minds: they become mages. Mana is just ember you can use.\u003c/li>\u003cli>Embers that landed in rock during \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">the Emberfall\u003c/a> cooled into glowing shards worth more than gold.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-the-one-rule\">The one rule\u003c/h2>\n\u003cp>The land gives a little ember to everything, and takes it back when things die and rot. It's a circle. Take more than the land gives back, and that spot goes cold. Where it goes cold, things turn grey, sick and dark. That is \u003ca href=\"#the-withering\" data-to=\"the-withering\">The Withering\u003c/a>, \u003ca href=\"#the-blight\" data-to=\"the-blight\">The Blight\u003c/a>, and the spreading Dark Forest.\u003c/p>\n\u003cp>The old country folk of \u003ca href=\"#aldmera\" data-to=\"aldmera\">Aldmera\u003c/a> who lived by the rule were called \u003ca href=\"#the-tenders\" data-to=\"the-tenders\">The Tenders\u003c/a>. Their saying is still painted over a few old doorways: \u003ci>&quot;Take only what the land gives back.&quot;\u003c/i>\u003c/p>","src":["wiki/pages/ember.md"],"w":true,"r":false},{"s":"the-ember-circle","t":"The Ember Circle","c":"Factions","i":"⭕","sum":"Aldmera's greatest mages, led by the king. Their working caused the Emberfall, and they built the shrines.","a":["Ember Circle","The Circle"],"ib":[["Leader","\u003ca href=\"#king-aldemar-xviii\" data-to=\"king-aldemar-xviii\">King Aldemar XVIII\u003c/a>, then \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a>"],["Founded","Before year 0"],["Mark","A ring of fire"]],"h":"\u003cp>\u003cb>The Ember Circle\u003c/b> was a small group of \u003ca href=\"#aldmera\" data-to=\"aldmera\">Aldmera\u003c/a>'s greatest mages, led by \u003ca href=\"#king-aldemar-xviii\" data-to=\"king-aldemar-xviii\">King Aldemar XVIII\u003c/a> himself. They studied \u003ca href=\"#the-ember\" data-to=\"the-ember\">The ember\u003c/a>, found its source in \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a>, and set out to harness it for the whole kingdom. That working broke loose in year 0: \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">the Emberfall\u003c/a>.\u003c/p>\n\u003cp>The surviving members came out of the Fall filled with power and no longer ageing. Each raised a great shrine in their own region (see \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a>), and together they led \u003ca href=\"#the-rebuilding\" data-to=\"the-rebuilding\">The Rebuilding\u003c/a> and founded \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>.\u003c/p>\n\u003cp>Their mark is a ring of fire, the ring they stood in around the pit. It's on a ruined mage tower in the Barrens, and carved over \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>'s front door.\u003c/p>\n\u003ch2 id=\"s-the-members\">The members\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Member\u003c/th>\u003cth>Great shrine\u003c/th>\u003cth>What everyone is taught\u003c/th>\u003cth>🔒 The truth\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#king-aldemar-xviii\" data-to=\"king-aldemar-xviii\">King Aldemar XVIII\u003c/a>\u003c/td>\u003ctd>none\u003c/td>\u003ctd>Murdered by Wick on the night of the Fall\u003c/td>\u003ctd>Murdered by Vale\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a>\u003c/td>\u003ctd>Heartvale (\u003ca href=\"#the-heart-shrine\" data-to=\"the-heart-shrine\">The Heart Shrine\u003c/a>)\u003c/td>\u003ctd>The land's saviour. Died winning the Sundering War\u003c/td>\u003ctd>Alive, as \u003ca href=\"#enchanter-vale\" data-to=\"enchanter-vale\">Enchanter Vale\u003c/a>. Leads the Undying\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#frostfell\" data-to=\"frostfell\">Frostfell\u003c/a>\u003c/td>\u003ctd>The traitor who caused the Fall and the war\u003c/td>\u003ctd>Framed. In hiding, and behind \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Crowe\u003c/td>\u003ctd>\u003ca href=\"#the-thornwood\" data-to=\"the-thornwood\">The Thornwood\u003c/a>\u003c/td>\u003ctd>Long dead; Warden Crowe carries the name\u003c/td>\u003ctd>Alive. One of the Undying\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Flint\u003c/td>\u003ctd>\u003ca href=\"#greyspine-peaks\" data-to=\"greyspine-peaks\">Greyspine Peaks\u003c/a>\u003c/td>\u003ctd>Long dead; Warden Flint carries the name\u003c/td>\u003ctd>Alive. One of the Undying\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ivy\u003c/td>\u003ctd>\u003ca href=\"#the-tangle\" data-to=\"the-tangle\">The Tangle\u003c/a>\u003c/td>\u003ctd>Long dead; Warden Ivy carries the name\u003c/td>\u003ctd>Killed in the Sundering War on Wick's side. Warden Ivy is an impostor\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Merrow\u003c/td>\u003ctd>\u003ca href=\"#saltmere-coast\" data-to=\"saltmere-coast\">Saltmere Coast\u003c/a>\u003c/td>\u003ctd>Long dead; Warden Merrow carries the name\u003c/td>\u003ctd>Alive. One of the Undying\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dunn\u003c/td>\u003ctd>\u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a>\u003c/td>\u003ctd>Long dead; Warden Dunn carries the name\u003c/td>\u003ctd>Alive. One of the Undying\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reed\u003c/td>\u003ctd>\u003ca href=\"#blackfen\" data-to=\"blackfen\">Blackfen\u003c/a>\u003c/td>\u003ctd>Long dead; Warden Reed carries the name\u003c/td>\u003ctd>Killed in the Sundering War on Wick's side. Warden Reed is an impostor\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003ch2 id=\"s-what-really-happened-to-them\">What really happened to them\u003c/h2>\n\u003cp>The Circle meant well. Only Vale knew that he'd killed the king and twisted the working; the others believed it had simply gone terribly wrong, and built the shrines to make the Emberborn and put the land right.\u003c/p>\n\u003cp>But they lived on the power their shrines pulled in, and over two centuries it corrupted them. When Vale created the \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a> around year 200, the others looked away. Around year 400 Wick found out what the Ceremony really does, and the Circle split: the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>. Vale's side won. Ivy and Reed were killed, and Wick was cut off from his shrine and driven into hiding.\u003c/p>\n\u003cp>After the war the survivors became \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>. They let the world believe the Circle had passed into legend, and took up the Emberwardens' posts as if they were heirs carrying old titles. The impostors in Ivy's and Reed's places did the same, and nobody has ever known the difference.\u003c/p>\n\u003cp>All nine names are still carved on the frozen shrine in \u003ca href=\"#frostfell\" data-to=\"frostfell\">Frostfell\u003c/a>. Wick's shrine was the one place the victors never scratched them off.\u003c/p>\u003c/div>","src":["wiki/pages/ember-circle.md"],"w":true,"r":false},{"s":"the-emberfall-disaster","t":"The Emberfall (disaster)","c":"History","i":"☄️","sum":"Year 0. The Ember Circle's great working broke loose under Heartvale, and Aldmera fell. Everyone is taught that Wick did it.","a":["The Emberfall","The Fall"],"ib":[["When","Year 0 (the calendar counts from it)"],["Where","Under \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>, where \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a> now stands"],["Lasted","About a year of falling embers"],["Official cause","Wick murdered the king and broke the working"],["Real cause","🔒 \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a> (see below)"],["Led to","\u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a>, the \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a>, \u003ca href=\"#the-rebuilding\" data-to=\"the-rebuilding\">The Rebuilding\u003c/a>"]],"h":"\u003cp>\u003cb>The Emberfall\u003c/b> was the disaster that began the calendar: years in \u003ca href=\"#embervale\" data-to=\"embervale\">Embervale\u003c/a> are counted \u003ci>After the Fall\u003c/i>, and the game is set in year 800. The game itself is named after it.\u003c/p>\n\u003cp>There are two versions of what happened. The \u003cb>official story\u003c/b> is the one every child in Embervale is taught. The \u003cb>true story\u003c/b> is what players slowly uncover. Writers: anything an NPC says out loud should match the official story, unless that NPC knows the secret.\u003c/p>\n\u003ch2 id=\"s-what-everyone-agrees-on\">What everyone agrees on\u003c/h2>\n\u003cp>These parts are true in both versions:\u003c/p>\n\u003cul>\u003cli>Before the Fall, the land was \u003ca href=\"#aldmera\" data-to=\"aldmera\">Aldmera\u003c/a>, the kingdom of the \u003ca href=\"#aldmera\" data-to=\"aldmera\">Aldmere\u003c/a>, ruled from \u003ca href=\"#whitestone\" data-to=\"whitestone\">Whitestone\u003c/a> by \u003ca href=\"#king-aldemar-xviii\" data-to=\"king-aldemar-xviii\">King Aldemar XVIII\u003c/a>.\u003c/li>\u003cli>The king led \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a>, the kingdom's greatest mages. His two highest were \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a> and \u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a>.\u003c/li>\u003cli>The Circle spent years on a great working: to harness \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a>, the source of \u003ca href=\"#the-ember\" data-to=\"the-ember\">The ember\u003c/a>, so Aldmera would never know hunger, cold or sickness again.\u003c/li>\u003cli>On the night they finished it, deep under \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>, the king died and the working broke loose. A torrent of raw ember burst up out of the earth in a pillar of flame, and embers rained down across the land for about a year.\u003c/li>\u003cli>The ground around the pillar fell in, leaving the round valley that is Heartvale today. Whitestone burned, and Aldmera was gone within the year.\u003c/li>\u003cli>The surviving Circle came out of it changed: filled with power, and no longer ageing. They built \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a> to pin the torrent down, and the shrines began raising \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> about thirty years later.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-the-official-story\">The official story\u003c/h2>\n\u003cp>This is what \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a> teach, what the history books say, and what almost everyone in Embervale believes.\u003c/p>\n\u003col>\u003cli>\u003cb>Before:\u003c/b> Aldmera was a golden age, and the Circle its pride. Good King Aldemar led them, with Vale and Wick at his side.\u003c/li>\u003cli>\u003cb>The betrayal:\u003c/b> Wick was jealous of the king and hungry for the power the working would bring. At the last moment he struck the king down and seized the working for himself. It broke loose, and that was the Emberfall. \u003cb>Wick did this.\u003c/b>\u003c/li>\u003cli>\u003cb>The rescue:\u003c/b> Archmage Vale and the loyal Circle held the torrent back with the shrines, raised the first Emberborn, and spent two hundred years rebuilding the land.\u003c/li>\u003cli>\u003cb>Wick's second betrayal:\u003c/b> Wick hid his crime for four hundred years. When the Circle finally found him out, he turned half of them against the rest and tried to tear the shrines down. That was the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>. Vale won it, and gave his life doing so.\u003c/li>\u003cli>\u003cb>After:\u003c/b> Wick fled into the dark and was never seen again. The Circle's work passed to the \u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwardens\u003c/a>, who keep the great shrines and carry the old names as titles. Vale is remembered as the land's saviour. In \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>, Wick's plinth stands empty, his name scratched off.\u003c/li>\u003c/ol>\n\u003cp>The lesson people take from it: the shrines are what stands between them and another Fall, the Emberguard are the land's protectors, and anyone who wants the shrines torn down is doing Wick's work.\u003c/p>\n\u003ch3 id=\"s-where-players-hear-it\">Where players hear it\u003c/h3>\n\u003cul>\u003cli>The in-game books in \u003ca href=\"#books-in-the-game\" data-to=\"books-in-the-game\">Books in the game\u003c/a>.\u003c/li>\u003cli>\u003ci>A Child's Book of the Emberborn\u003c/i>, which \u003ca href=\"#sister-lisette\" data-to=\"sister-lisette\">Sister Lisette\u003c/a> reads to the town children (see \u003ca href=\"#side-quests\" data-to=\"side-quests\">Planned quests\u003c/a>).\u003c/li>\u003cli>\u003ca href=\"#brother-oren\" data-to=\"brother-oren\">Brother Oren\u003c/a>'s tour of the statues of \u003ca href=\"#the-extinguished\" data-to=\"the-extinguished\">The Extinguished\u003c/a>, which ends at Wick's empty plinth.\u003c/li>\u003cli>The Emberguard's welcome talk when you start as a \u003ca href=\"#hopefuls\" data-to=\"hopefuls\">Hopeful\u003c/a>.\u003c/li>\u003c/ul>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003ch2 id=\"s-the-true-story\">The true story\u003c/h2>\n\u003cp>Wick didn't kill the king. Vale did.\u003c/p>\n\u003col>\u003cli>\u003cb>The working:\u003c/b> the Circle really did mean well. Aldemar's plan was to harness the Emberheart gently, so its warmth would reach every corner of Aldmera. The \u003ca href=\"#ember-crown\" data-to=\"ember-crown\">Ember Crown\u003c/a> was the focus that let the king steer it, and the \u003ca href=\"#ember-seed\" data-to=\"ember-seed\">Ember Seed\u003c/a> was what the working was meant to make.\u003c/li>\u003cli>\u003cb>Vale's secret:\u003c/b> Vale alone suspected how much power the working could give one person, and he wanted it. As the work concluded, standing in the ring around the pit, he killed Aldemar XVIII and twisted the working so the power poured into the Circle instead of the land, the greatest share into himself.\u003c/li>\u003cli>\u003cb>The burst:\u003c/b> the twisted working couldn't hold. The Emberheart's fire burst up through the shaft and kept pouring out for a year. The Circle stood at the source and it poured through them. Every member was filled with power and stopped ageing. Vale got the most.\u003c/li>\u003cli>\u003cb>Only Vale knows:\u003c/b> the others had their eyes on the working, not on him. They believe it simply went terribly wrong, and that the king died in the burst. Wick believed it too, for four hundred years.\u003c/li>\u003cli>\u003cb>The shrines:\u003c/b> the Circle built a great shrine in each region, one per member, to catch the wild ember and turn it into Emberborn: protectors to stabilize and guard the ruined land. They meant it. Over the centuries, the power they lived on corrupted them, and they began using the shrines and the Emberborn for their own ends (see \u003ca href=\"#history\" data-to=\"history\">History\u003c/a>).\u003c/li>\u003cli>\u003cb>The cover-up:\u003c/b> after the Sundering War, Vale rewrote history. He took his own crime and gave it to Wick. He faked his death, and the Undying took on new faces as the Emberwardens. The shaft is still there today, sealed under \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>.\u003c/li>\u003c/ol>\n\u003ch3 id=\"s-how-the-lie-works\">How the lie works\u003c/h3>\n\u003cp>The official story isn't all made up. It's the true story with Vale and Wick swapped.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Question\u003c/th>\u003cth>Official story\u003c/th>\u003cth>Truth\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Who killed King Aldemar?\u003c/td>\u003ctd>Wick\u003c/td>\u003ctd>Vale\u003c/td>\u003c/tr>\u003ctr>\u003ctd>What caused the Emberfall?\u003c/td>\u003ctd>Wick seized the working\u003c/td>\u003ctd>Vale twisted the working to take its power\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Did the Circle know?\u003c/td>\u003ctd>They found Wick out four hundred years later\u003c/td>\u003ctd>No one but Vale has ever known\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Who are the shrines for?\u003c/td>\u003ctd>Everyone; they hold the torrent back\u003c/td>\u003ctd>They were. Now they feed \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>What started the Sundering War?\u003c/td>\u003ctd>Wick tried to tear the shrines down\u003c/td>\u003ctd>Wick found out what the \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a> really does\u003c/td>\u003c/tr>\u003ctr>\u003ctd>What happened to Vale?\u003c/td>\u003ctd>Died winning the war\u003c/td>\u003ctd>Faked his death. He is \u003ca href=\"#enchanter-vale\" data-to=\"enchanter-vale\">Enchanter Vale\u003c/a>, and he runs the Emberguard\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Who are the Emberwardens?\u003c/td>\u003ctd>Heirs who carry the old Circle names as titles\u003c/td>\u003ctd>The same immortals, or impostors who took dead members' names\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Is it over?\u003c/td>\u003ctd>Yes, long ago\u003c/td>\u003ctd>No. The land far from the shrines is still withering\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"s-clues-players-can-find\">Clues players can find\u003c/h3>\n\u003cul>\u003cli>The Circle's mark, a ring of fire, carved over the Emberhall's front door and on a ruined mage tower in \u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a>. It's the ring they stood in around the pit.\u003c/li>\u003cli>The frozen shrine in \u003ca href=\"#frostfell\" data-to=\"frostfell\">Frostfell\u003c/a>, Wick's own shrine, with every member's name carved on it, Wick's included and unscratched.\u003c/li>\u003cli>A page cut from the oldest book in the Emberhall library: an account of the working written before the Sundering War, that never mentions Wick doing anything wrong.\u003c/li>\u003cli>The \u003ci>Old Shaft\u003c/i> Memory Echo: robed mages in a ring around a pit of fire, and one of them stepping toward the king.\u003c/li>\u003cli>\u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">The Mages' Guild\u003c/a>'s records about the Emberheart, which stop around the end of the Sundering War.\u003c/li>\u003cli>Nobody knows where Vale is buried, and the Emberhall's Enchanter Vale is &quot;very old, some say older than the Guild&quot;.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-when-players-learn-it\">When players learn it\u003c/h3>\n\u003cp>Hopefuls only hear the official story. Players piece the truth together through quests, books and Memory Echoes. At the end of Act 3, after Rhys is drained, Wick tells them his side: the Circle lives, the shrines feed them, and Wick was framed. At their Joining, Vale confirms it himself. Even Wick has only guessed who killed the king; players prove it in the endgame (see \u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a>).\u003c/p>\u003c/div>","src":["wiki/pages/emberfall-disaster.md"],"w":true,"r":false},{"s":"the-emberguard","t":"The Emberguard","c":"Factions","i":"🛡️","sum":"Noble protectors of the ember shrines. Only the worthy are let in.","a":["Emberguard","Lightkeepers"],"ib":[["Home","\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>, \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>"],["Leader","The hooded High Keeper"],["Runs","\u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a>"],["Old name","The Lightkeepers"]],"h":"\u003cp>\u003cb>The Emberguard\u003c/b> keep \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a> lit across the land. They describe themselves as &quot;keepers of the shrines that saved us after the Emberfall&quot;. \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a> founded the order around year 50, during \u003ca href=\"#the-rebuilding\" data-to=\"the-rebuilding\">The Rebuilding\u003c/a>. Their temple is \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a> in \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>, built right over the place the Emberfall began. Embers drift through its great hall, one for every hero honoured with a Ceremony. Only the worthy are let in: new \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> start as \u003ca href=\"#hopefuls\" data-to=\"hopefuls\">Hopefuls\u003c/a> and have to earn their way through the Emberguard's trials.\u003c/p>\n\u003cp>Most members are honest and believe every word of it.\u003c/p>\n\u003ch2 id=\"s-their-rule\">Their rule\u003c/h2>\n\u003cp>Their order's rule (from a book in the Emberhall library):\u003c/p>\n\u003col>\u003cli>Welcome every Emberborn who wakes.\u003c/li>\u003cli>Keep every shrine lit.\u003c/li>\u003cli>Write down every deed, so the light remembers.\u003c/li>\u003cli>Ask nothing of \u003ca href=\"#the-rooted\" data-to=\"the-rooted\">The Rooted\u003c/a> (the ordinary folk) but their trust.\u003c/li>\u003cli>Honour the worthy with Radiance.\u003c/li>\u003cli>The ledgers are for the Keepers alone. (Someone has underlined this one twice.)\u003c/li>\u003c/ol>\n\u003ch2 id=\"s-people\">People\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a> welcomes every new Emberborn and decides who's ready for the trials.\u003c/li>\u003cli>\u003ca href=\"#sister-celene\" data-to=\"sister-celene\">Sister Celene\u003c/a>, the shrine healer.\u003c/li>\u003cli>\u003ca href=\"#enchanter-vale\" data-to=\"enchanter-vale\">Enchanter Vale\u003c/a>, the gentle enchanter.\u003c/li>\u003cli>\u003ca href=\"#brother-oren\" data-to=\"brother-oren\">Brother Oren\u003c/a>, \u003ca href=\"#sister-lisette\" data-to=\"sister-lisette\">Sister Lisette\u003c/a>, \u003ca href=\"#brother-tomas\" data-to=\"brother-tomas\">Brother Tomas\u003c/a> and \u003ca href=\"#sister-wynne\" data-to=\"sister-wynne\">Sister Wynne\u003c/a>, the Emberhall's staff.\u003c/li>\u003cli>The six \u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwardens\u003c/a>, each keeping a region's great shrine.\u003c/li>\u003c/ul>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The Emberguard's leaders are what's left of \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a>. They never passed into legend: they became \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>, living on ember the shrines pull from the land and from every Emberborn. \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a>, who caused the Emberfall, leads them as the hooded High Keeper. After the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a> they rewrote the history books and took \u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">The Mages' Guild\u003c/a>'s old records, until everyone believed Wick was the villain.\u003c/p>\u003c/div>","src":["wiki/pages/emberguard.md"],"w":true,"r":false},{"s":"the-emberhall","t":"The Emberhall","c":"Places","i":"🏛️","sum":"The Emberguard's great white temple, where you wake.","a":["Emberhall","Lighthall","The Lighthall"],"ib":[["Owner","\u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>"],["Kind","Indoors"],["Danger","Safe"],["Size","37 × 27 tiles"]],"h":"\u003cp>\u003cb>The Emberhall\u003c/b> is \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>'s great white temple in \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>, and where every new \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> wakes, on the steps of \u003ca href=\"#the-heart-shrine\" data-to=\"the-heart-shrine\">The Heart Shrine\u003c/a>. The great hall in the middle holds the Heart Shrine's flame, four burning braziers and a long red carpet to the front door. The statues of \u003ca href=\"#the-extinguished\" data-to=\"the-extinguished\">The Extinguished\u003c/a> line its walls, with \u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a>'s empty plinth near the doors, and small embers drift through the air, one for every hero honoured with a \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a>, like the embers on the game's title screen. Doors lead off it to the other rooms:\u003c/p>\n\u003cul>\u003cli>\u003cb>The library\u003c/b> (west, north side): shelves of books, \u003ca href=\"#sister-lisette\" data-to=\"sister-lisette\">Sister Lisette\u003c/a> and Scholar Quill.\u003c/li>\u003cli>\u003cb>The stores\u003c/b> (west, south side): \u003ca href=\"#brother-tomas\" data-to=\"brother-tomas\">Brother Tomas\u003c/a> by the locked ledger room, and \u003ca href=\"#enchanter-vale\" data-to=\"enchanter-vale\">Enchanter Vale\u003c/a>'s corner.\u003c/li>\u003cli>\u003cb>The infirmary\u003c/b> (east): \u003ca href=\"#sister-wynne\" data-to=\"sister-wynne\">Sister Wynne\u003c/a> and Healer Rosa, with a corridor and four bedrooms, one for each patient.\u003c/li>\u003c/ul>\n\u003cp>Acolytes Bram and Mira sweep the floor and keep the braziers lit, and Pilgrim Ennis comes to pray at the shrine (see \u003ca href=\"#townsfolk\" data-to=\"townsfolk\">Townsfolk\u003c/a>). Kevin MacLeod's &quot;Gregorian Chant&quot; plays softly inside.\u003c/p>\n\u003cp>A ring-of-fire mark is carved over its front door.\u003c/p>\n\u003cp>The floating embers aren't in the game yet.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>It's built right over \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a>'s old shaft, where the working broke loose. Its sealed stair leads down to the Undying's Sanctum, and further down to \u003ca href=\"#the-hollow-heart\" data-to=\"the-hollow-heart\">The Hollow Heart\u003c/a>. At their Joining, at the end of Act 3, players go down that stair and meet Vale. The drifting embers are scraps of sparks the Ceremonies couldn't fully drain.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"lighthall\">\u003c/figure>\n\u003cp>\u003cb>People here:\u003c/b> \u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>, \u003ca href=\"#sister-celene\" data-to=\"sister-celene\">Sister Celene\u003c/a>, \u003ca href=\"#enchanter-vale\" data-to=\"enchanter-vale\">Enchanter Vale\u003c/a>, \u003ca href=\"#brother-oren\" data-to=\"brother-oren\">Brother Oren\u003c/a>, \u003ca href=\"#sister-lisette\" data-to=\"sister-lisette\">Sister Lisette\u003c/a>, \u003ca href=\"#brother-tomas\" data-to=\"brother-tomas\">Brother Tomas\u003c/a>, \u003ca href=\"#sister-wynne\" data-to=\"sister-wynne\">Sister Wynne\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Things to use:\u003c/b> The Heart Shrine, Empty plinth, Halric the Dawnbringer, Ida of the Saltmere, Tilda Ashwalker, Orla the Kind.\u003c/p>","src":["wiki/pages/lighthall.md","shared/world.ts","shared/npcs.ts"],"w":true,"r":false},{"s":"the-emberheart","t":"The Emberheart","c":"Lore","i":"❤️‍🔥","sum":"The source of the land's warmth, deep under Heartvale.","a":["Emberheart","Heartfire","The Heartfire"],"ib":[["Kind","The source of \u003ca href=\"#the-ember\" data-to=\"the-ember\">The ember\u003c/a>"],["Where","Deep under \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>, in \u003ca href=\"#the-hollow-heart\" data-to=\"the-hollow-heart\">The Hollow Heart\u003c/a>"],["Old name","The Heartfire (before that, the Wellspring)"]],"h":"\u003cp>\u003cb>The Emberheart\u003c/b> is what people call the source of the land's warmth: a deep fire far under \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a> that sends \u003ca href=\"#the-ember\" data-to=\"the-ember\">ember\u003c/a> up through the rock and soil into everything that grows. It isn't a heart in the literal sense. The name is old, from the \u003ca href=\"#aldmera\" data-to=\"aldmera\">Aldmere\u003c/a>, who thought of it as the heart of the land.\u003c/p>\n\u003cp>\u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a> found it and tried to harness it for all \u003ca href=\"#aldmera\" data-to=\"aldmera\">Aldmera\u003c/a>, and that working broke loose as \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">the Emberfall\u003c/a>. It burns in \u003ca href=\"#the-hollow-heart\" data-to=\"the-hollow-heart\">The Hollow Heart\u003c/a>, a lake of living fire with thousands of thin threads rising from it toward \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a>. The closest you can get to it on foot without going that deep is the \u003ca href=\"#the-crystal-cave\" data-to=\"the-crystal-cave\">Crystal Cave\u003c/a>, where the rock is warm to the touch.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>Eight hundred years of \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a> drinking from the shrines' threads have left it weaker. It isn't going out, but the land far from the shrines is going cold (\u003ca href=\"#the-withering\" data-to=\"the-withering\">The Withering\u003c/a>), and \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a> says the Crystal Cave's rock isn't as warm as when she was a girl. \u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a>'s research is about giving back what was taken.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-in-the-game-today\">In the game today\u003c/h2>","src":["wiki/pages/emberheart.md"],"w":true,"r":false},{"s":"the-extinguished","t":"The Extinguished","c":"People","i":"🕯️","sum":"The great heroes of the past, who laid their flame down so new heroes could wake. Their statues stand in the Emberhall.","a":["Extinguished","Radiants","The Radiants","Hall of Champions"],"ib":[["Who","The greatest Emberborn champions"],["How","A \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a>, every few decades since about year 200"],["Statues","In \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>"],["Old name","The Radiants"]],"h":"\u003cp>\u003cb>The Extinguished\u003c/b> are the greatest \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> heroes of the past. Each one was honoured with a \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a>, where they burned brighter than ever and then went out like a candle. Their statues line the walls of the great hall in \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>, where \u003ca href=\"#brother-oren\" data-to=\"brother-oren\">Brother Oren\u003c/a> tells their stories, and small embers drift through the hall in their honour. One plinth near the doors stands empty: \u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a>'s.\u003c/p>\n\u003cp>Every one of the Extinguished went through a Radiance Ceremony: that's what makes someone one of them. None of them died any other way.\u003c/p>\n\u003cp>They used to be called the Radiants, and their statues had a room of their own, the Hall of Champions. Since version 0.14 the statues line the walls of the Emberhall's great hall instead, and the game calls them the Extinguished too.\u003c/p>\n\u003ch2 id=\"s-the-official-story\">The official story\u003c/h2>\n\u003cp>This is what the Emberguard teach, and what every Hopeful hears on their first day.\u003c/p>\n\u003cul>\u003cli>\u003cb>Every Emberborn fades.\u003c/b> After a few hundred years, every fall and every rebirth has worn them thin (see \u003ca href=\"#the-fading\" data-to=\"the-fading\">The Fading\u003c/a>). Everyone has watched an old champion grow grey and forgetful.\u003c/li>\u003cli>\u003cb>The Ceremony is rest.\u003c/b> When a champion has carried the flame long enough, the Emberguard invite them to lay it down. They lay their hands on the Heart Shrine, blaze up one last time, and go out gently, \u003ci>&quot;like falling asleep by the fire&quot;\u003c/i>, with their friends watching.\u003c/li>\u003cli>\u003cb>One flame lights many.\u003c/b> Their ember doesn't go to waste: the Heart Shrine uses it to raise several new heroes. Every new Emberborn, the Emberguard say, carries a little of the Extinguished inside them.\u003c/li>\u003cli>\u003cb>It's a choice, and the highest honour.\u003c/b> Most champions ask for it themselves when they feel ready. To be found worthy means a statue in the Emberhall, their name in the great ledger, and an ember in the hall that never goes out.\u003c/li>\u003cli>\u003cb>Refusing is shameful.\u003c/b> It's allowed, but it means saying &quot;I'm not done yet&quot; while everyone you love says it's your time. Almost no one ever has. The one everyone knows about is \u003ca href=\"#sable\" data-to=\"sable\">Sable\u003c/a>.\u003c/li>\u003c/ul>\n\u003cp>The Emberguard's sayings: \u003ci>&quot;Burn bright, go out kind.&quot;\u003c/i> \u003ci>&quot;One flame goes out so many can be lit.&quot;\u003c/i>\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003ch2 id=\"s-the-true-story\">The true story\u003c/h2>\n\u003cp>The Extinguished chose the Ceremony, believed in it, and went in peace. That's what makes it so cruel.\u003c/p>\n\u003cul>\u003cli>\u003cb>Their ember didn't raise new heroes.\u003c/b> It went down the Heart Shrine's thread to \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a>. Vale created the Ceremony around year 200 for exactly this. One Ceremony feeds him for years.\u003c/li>\u003cli>\u003cb>The Emberguard decide who's &quot;ready&quot;, and speed it up.\u003c/b> Blessings, Tithes and praise are tuned to wear the brightest down faster, so they feel the Fading early. The dim and ordinary are never invited. &quot;Ready&quot; really means &quot;ripe&quot;.\u003c/li>\u003cli>\u003cb>It isn't gentle.\u003c/b> The thread pulls everything out at once. A few champions fought it at the last moment, and the Ceremony calendar marks them \u003ci>&quot;spark flawed&quot;\u003c/i>.\u003c/li>\u003cli>\u003cb>The floating embers aren't tributes.\u003c/b> They're scraps of sparks the Ceremony couldn't fully drain, still drifting in the hall. Some sparks are trapped in old refined emberstones too, and the ghosts in \u003ca href=\"#the-graveyard\" data-to=\"the-graveyard\">The Graveyard\u003c/a> are the oldest of them.\u003c/li>\u003cli>\u003cb>Tilda knew.\u003c/b> Tilda Ashwalker found out the truth before her Ceremony. She went anyway, because she believed nobody would listen, but her last cairn in the Barrens says \u003ci>&quot;Don't go down the stair.&quot;\u003c/i>\u003c/li>\u003c/ul>\n\u003cp>Why it matters: every Hopeful is being raised to become one of the Extinguished. The more a player levels up, the brighter they burn, and the closer they are to their own invitation. That's what the player realises at their Joining (see \u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a>).\u003c/p>\u003c/div>\n\u003ch2 id=\"s-the-statues\">The statues\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Hero\u003c/th>\u003cth>Known for\u003c/th>\u003cth>🔒 What really happened\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Halric the Dawnbringer\u003c/td>\u003ctd>One of the first Emberborn. Held the Greyspine pass alone for three days, falling and rising eleven times. The first of the Extinguished, about year 200.\u003c/td>\u003ctd>The first Ceremony. Vale tested it on the oldest, most faded champion he had.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ida of the Saltmere\u003c/td>\u003ctd>Rowed the Saltmere coast lighting dark shrines. The fisherfolk still leave shells at her feet.\u003c/td>\u003ctd>Her ember drifts in the hall still; it never fully drained.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tilda Ashwalker\u003c/td>\u003ctd>Walked into the Withering around year 650 and led two hundred people home.\u003c/td>\u003ctd>Learned the truth and left warnings in stone piles across the Barrens. Went to her Ceremony anyway.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#orla-the-kind\" data-to=\"orla-the-kind\">Orla the Kind\u003c/a>\u003c/td>\u003ctd>Nursed the sick through the Grey Fever, rising nine times. Honoured in year 761.\u003c/td>\u003ctd>Each rising wore her thin, and the Emberguard made sure of it; by the end she was &quot;almost see-through&quot;.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>(the empty plinth)\u003c/td>\u003ctd>Not one of the Extinguished. It's \u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a>'s: his statue was pulled down after the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>, and his name scratched off. One letter is left under the dust: W.\u003c/td>\u003ctd>Wick was framed (see \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">The Emberfall (disaster)\u003c/a>).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>In the game today the plinth's letter is still an S, from the older story where it was Sable's.\u003c/p>","src":["wiki/pages/extinguished.md"],"w":true,"r":false},{"s":"the-fading","t":"The Fading","c":"Lore","i":"🌫️","sum":"Emberborn don't age, but after centuries they wear thin. It's real, and it's why the Ceremony exists.","a":["Fading","Fade"],"ib":[],"h":"\u003cp>\u003cb>The Fading\u003c/b> is what happens to \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> who live long enough. They don't age, but they wear thin. Every fall, every rebirth and every \u003ca href=\"#the-tithe\" data-to=\"the-tithe\">Tithe\u003c/a> takes a little. After a few hundred years an Emberborn grows tired, colours look grey, and old memories slip. Everyone in Embervale has watched an old champion fade, and nobody wants to end that way.\u003c/p>\n\u003cp>It first showed in the earliest Emberborn around year 200, and it's why \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a> created the \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a>: a way to lay the flame down with honour before the Fading takes you.\u003c/p>\n\u003cp>The Fading is real. That's what makes the Ceremony easy to believe in.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The Emberguard speed it up for the champions they want. Blessings, Tithes and praise are tuned to wear the brightest down faster, so a champion full of ember &quot;feels the Fading&quot; a century early. The dim and ordinary are never invited to a Ceremony; their ember isn't worth the harvest.\u003c/p>\u003c/div>","src":["wiki/pages/fading.md"],"w":true,"r":false},{"s":"the-first-tithe","t":"The First Tithe","c":"Quests","i":"📜","sum":"Act 1 from Keeper Aldric.","a":[],"ib":[["Part of","Act 1"],["Given by","Keeper Aldric"],["Where","in the Emberhall, the great white temple on Ember Hill, in the middle of Emberhold"],["Steps","1"]],"h":"\u003cp>\u003cb>The First Tithe\u003c/b> is part of the Act 1 from \u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>, found in the Emberhall, the great white temple on Ember Hill, in the middle of Emberhold.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#lantern-rounds\" data-to=\"lantern-rounds\">Lantern Rounds\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-keeper-aldric-about-the-tithe\">Step 1: Talk to Keeper Aldric about the Tithe\u003c/h3>\n\u003cp>\u003cb>Keeper Aldric:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>I promised I'd explain the tithe. Sit down a moment.\u003c/p>\u003cp>When an Emberborn falls, the shrine raises them. That takes ember. So, after the Oath, each time you're knocked out the shrine puts a Tithe mark on you: a gold link by your health bar. You can have up to five.\u003c/p>\u003cp>While you carry marks, a fifth of what you learn goes to the shrine, to keep it bright for the next hero. Once it's had enough, the mark fades on its own. You never lose a level, or a single thing you own.\u003c/p>\u003cp>A small tithe, so the shrines can keep raising heroes. And if you're in a hurry, a Tithe tonic clears a mark at once. Here, take two.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> 2 × \u003ca href=\"#potions\" data-to=\"potions\">Tithe tonic\u003c/a>.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> 2 × \u003ca href=\"#potions\" data-to=\"potions\">Tithe tonic\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#lantern-rounds\" data-to=\"lantern-rounds\">Lantern Rounds\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#blessing-the-fields\" data-to=\"blessing-the-fields\">Blessing the Fields\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"the-general-store","t":"The General Store","c":"Places","i":"🏠","sum":"","a":[],"ib":[["Kind","Indoors"],["Danger","Safe"],["Size","11 × 8 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"tam\">\u003c/figure>\n\u003cp>\u003cb>People here:\u003c/b> \u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>.\u003c/p>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"the-graveyard","t":"The Graveyard","c":"Places","i":"🪦","sum":"Night herbs and ghosts, deep in the Thornwood.","a":[],"ib":[],"h":"\u003cp>\u003cb>The Graveyard\u003c/b> lies in \u003ca href=\"#the-thornwood\" data-to=\"the-thornwood\">The Thornwood\u003c/a>. It's a place for night herbs, and ghosts.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The ghosts are drained \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a>, still tied to the old Thornwood shrine. One counts to eleven over and over: she was Halric the Dawnbringer's friend (see \u003ca href=\"#the-extinguished\" data-to=\"the-extinguished\">The Extinguished\u003c/a>).\u003c/p>\u003c/div>","src":["wiki/pages/graveyard.md"],"w":true,"r":false},{"s":"the-hall-of-embers","t":"The Hall of Embers","c":"Quests","i":"📜","sum":"Prologue from Keeper Aldric.","a":[],"ib":[["Part of","Prologue"],["Given by","Keeper Aldric"],["Where","in the Emberhall, the great white temple on Ember Hill, in the middle of Emberhold"],["Steps","4"]],"h":"\u003cp>\u003cb>The Hall of Embers\u003c/b> is part of the Prologue from \u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>, found in the Emberhall, the great white temple on Ember Hill, in the middle of Emberhold.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#awakening\" data-to=\"awakening\">Awakening\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-keeper-aldric\">Step 1: Talk to Keeper Aldric\u003c/h3>\n\u003cp>\u003cb>Keeper Aldric:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Now, let me tell you about our home. The Emberhall is the Emberguard's temple, built round the Heart Shrine: the brightest flame in all Embervale.\u003c/p>\u003cp>The statues along these walls are the Extinguished, the greatest heroes the shrines ever raised. Brother Oren keeps them, and he's waiting to show you round. He's just down the hall on the left.\u003c/p>\u003cp>Then meet the rest of my brothers and sisters: Sister Lisette keeps the library, through the door on the west side, Brother Tomas the stores, through the other west door, and Sister Wynne the infirmary, through the east door. Come back to me when you've met them all.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-step-2-take-brother-orens-tour-of-the-statues-oren-the-4-extinguished-and-the-empty-plinth\">Step 2: Take Brother Oren's tour of the statues: Oren, the 4 Extinguished and the empty plinth\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Brother Oren is waiting by the statues on the west side of the great hall. Talk to him, then click each statue with a ❗ along both walls, and the empty plinth near the doors, and he'll tell you about it.\u003c/li>\u003c/ul>\n\u003cp>\u003cb>What they say when you visit:\u003c/b>\u003c/p>\n\u003cul>\u003cli>Brother Oren: Welcome, welcome! I'm Brother Oren. I keep the statues of the Extinguished, the greatest heroes the shrines ever raised. Every one of them woke where you woke. Come, I'll walk you round right now. Every new Emberborn ought to know whose footsteps they're following. Click each statue with a ❗ and I'll tell you about them.\u003c/li>\u003cli>Halric the Dawnbringer: Let's start at the beginning. Five hundred years ago came the Emberfall: the land's fire burst up out of the earth in anger, and embers rained down for a whole year. No one was to blame. That's why we count the years After the Fall. Then the lords fought over the glowing shards it left, and the Sundering War nearly ended Embervale. The Old Kingdom fell, and there was almost no one left to fight. So the Archmage Vale built the shrines, and the shrines raised the first Emberborn: heroes made of ember, who came back every time they fell. This is Halric the Dawnbringer, one of those very first. He held the Greyspine pass on his own for three days. He fell eleven times, and the shrine raised him eleven times. On the twelfth morning the enemy simply ran out of courage.\u003c/li>\u003cli>Ida of the Saltmere: Ida of the Saltmere. When the war ended, the Archmage was gone, and someone had to look after his shrines. That someone is us: the Emberguard. We aren't soldiers. We keep the shrines lit, we welcome every Emberborn who wakes, and we write down every deed, so the Emberheart remembers you even when you can't. Ida rowed the whole Saltmere coast in a fishing boat, lighting shrines in villages that had been dark for a hundred years. The fisherfolk still leave shells at her feet.\u003c/li>\u003cli>Tilda Ashwalker: Tilda Ashwalker. When the Withering first crept out of the Barrens, she walked straight into it and brought a whole village home. Two hundred people, on foot, through the dust. The Withering is still out there, friend. That's why the land needs heroes like you, and why the shrines raise more of you every year.\u003c/li>\u003cli>Orla the Kind: And Orla the Kind. A healer, not a fighter. Through the Grey Fever she went from house to house, and every time the fever took her, the shrine sent her back to keep working. When an Emberborn has done enough, we honor them with a Radiance Ceremony. They burn brighter than ever, and then their ember goes back into the Heart Shrine, to raise the heroes who come after. That's why we call them the Extinguished. There's no higher honor. Every statue in this hall is someone who was given it. None of them are with us now, of course. That's what it means. One flame goes out so a hundred can be lit.\u003c/li>\u003cli>Empty plinth: (Brother Oren hurries you past the empty plinth. Someone has scratched the name off the stone, very carefully, letter by letter. You can just make out the first letter, under the dust. It might be an S.) That? An old mistake. A name that didn't deserve to be kept. Don't trouble yourself with it. Now go and meet the others: Sister Lisette in the library, Brother Tomas in the stores and Sister Wynne in the infirmary.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-3-meet-three-more-emberguard-lisette-tomas-and-wynne\">Step 3: Meet three more Emberguard: Lisette, Tomas and Wynne\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Sister Lisette is in the library (through the north-west door), Brother Tomas in the stores (the south-west door) and Sister Wynne in the infirmary (the east door).\u003c/li>\u003c/ul>\n\u003cp>\u003cb>What they say when you visit:\u003c/b>\u003c/p>\n\u003cul>\u003cli>Sister Lisette: Welcome to the library! Every Emberborn's deeds are written down here, so the Emberheart remembers them even if you don't. The oldest books are older than the town. The very oldest are in the ledger room, and only the Keepers read those.\u003c/li>\u003cli>Brother Tomas: The stores, yes, and that gold-locked door is the ledger room. Keepers only, I'm afraid. Just old accounts. Very dull. Now, if you ever need anything, you only have to ask. The Emberhall gives freely.\u003c/li>\u003cli>Sister Wynne: Welcome to the infirmary. Every patient gets a room of their own here, with a proper bed and a door that shuts. The Emberhall's doors never close to an Emberborn. Let me tell you what happens when you fall out there, so it doesn't frighten you. When your health runs out, the shrine's embers gather you up and make you again, on the shrine's steps. You'll wake up weak and dizzy, and we'll bring you in here and nurse you back onto your feet. Nobody is left alone on the cold stone. But it isn't free. Each time the Emberheart remakes you, it keeps a little piece back. Once you've taken the Oath, every fall leaves a Tithe mark, and a share of everything you learn goes to the shrine until it's paid. So try not to fall too often, hm?\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-4-go-back-to-keeper-aldric\">Step 4: Go back to Keeper Aldric\u003c/h3>\n\u003cp>\u003cb>Keeper Aldric:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>You've met everyone? Good, good. And you found the empty plinth, I see. Every family has its black sheep, friend.\u003c/p>\u003cp>Here, a little something to start you off. The Emberhall pays its own.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> 30 bronze.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> 30 bronze.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#awakening\" data-to=\"awakening\">Awakening\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#light-the-way\" data-to=\"light-the-way\">Light the Way\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"the-heart-shrine","t":"The Heart Shrine","c":"Places","i":"⛩️","sum":"The brightest shrine, in the Emberhall. Where new Emberborn wake and come back to.","a":[],"ib":[],"h":"\u003cp>\u003cb>The Heart Shrine\u003c/b> is the brightest of \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a>, inside \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>. It's the great shrine of \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>, raised by \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a> right after the Emberfall, over the place the working broke loose. New \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> wake on its steps, and fallen ones come back to it. \u003ca href=\"#sister-celene\" data-to=\"sister-celene\">Sister Celene\u003c/a> tends it.\u003c/p>\n\u003cp>It looks like a tall flame burning in a wide stone bowl on a stepped base, with embers drifting up from it. Every brazier in the Emberhall is lit from it.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>It's the deepest pool of stolen ember in the land. Every \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a> pours a champion's ember down its thread to Vale.\u003c/p>\u003c/div>","src":["wiki/pages/heart-shrine.md"],"w":true,"r":false},{"s":"the-hearthstone-inn","t":"The Hearthstone Inn","c":"Places","i":"🏠","sum":"","a":[],"ib":[["Kind","Indoors"],["Danger","Safe"],["Size","13 × 9 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"inn\">\u003c/figure>\n\u003cp>\u003cb>Things to use:\u003c/b> Enchanted chest.\u003c/p>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"the-hollow-heart","t":"The Hollow Heart","c":"Places","i":"🌋","sum":"The main story's final area: the cavern deep under Heartvale where the Emberheart burns. No shrine.","a":[],"ib":[["Levels","65 to 75"],["Region","Under \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>"],["Home of","Iridium (see \u003ca href=\"#resources-by-region\" data-to=\"resources-by-region\">Resources by region\u003c/a>)"]],"h":"\u003cp>\u003cb>The Hollow Heart\u003c/b> is the main story's final area: a vast cavern deep under \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>, reached from the bottom of the old shaft under \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>. There's no shrine here, and nothing to bring you back but your own strength. It's where \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a> burns: a lake of living fire with thousands of thin threads rising from it, one for every \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a>.\u003c/p>\n\u003cp>It's where \u003ca href=\"#king-aldemar-xviii\" data-to=\"king-aldemar-xviii\">King Aldemar XVIII\u003c/a> died, and where the Circle's working broke loose. In the planned quest \u003ci>The Living Fire\u003c/i>, you put your hand in the flame and feel how much the land has lost.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>Act 4 ends down here, at the Emberheart, where players fight Vale beside Wick (see \u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a>). It's also where the \u003ca href=\"#ember-seed\" data-to=\"ember-seed\">Ember Seed\u003c/a> would be planted.\u003c/p>\u003c/div>","src":["wiki/pages/hollow-heart.md"],"w":true,"r":false},{"s":"the-hollow-wolves","t":"The Hollow Wolves","c":"Quests","i":"📜","sum":"Act 1 from Huntmaster Kael.","a":[],"ib":[["Part of","Act 1"],["Given by","Huntmaster Kael"],["Where","in his lodge in the Lower Town"],["Steps","3"]],"h":"\u003cp>\u003cb>The Hollow Wolves\u003c/b> is part of the Act 1 from \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>, found in his lodge in the Lower Town.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#oath-of-the-flame\" data-to=\"oath-of-the-flame\">Oath of the Flame\u003c/a>, \u003ca href=\"#standing-your-ground\" data-to=\"standing-your-ground\">Standing your ground\u003c/a>.\u003c/p>\n\u003cdiv class=\"box note\">\u003cdiv class=\"box-label\">Planned change\u003c/div>\u003cp>Move the pack from Wolf Hollow (Thornwood) to the grey-dust edge of the valley, raiding the pasture.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-huntmaster-kael\">Step 1: Talk to Huntmaster Kael\u003c/h3>\n\u003cp>\u003cb>Huntmaster Kael:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>You've heard about the grey wolves? Blighted, the Emberguard call them. Hollow-eyed, glowing, and mean.\u003c/p>\u003cp>There's a pack of them at Wolf Hollow, south-west through the Thornwood. Clear 5. Take a friend if you can.\u003c/p>\u003cp>And here's a funny thing. The Blight is always worst downhill of a shrine. Always.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-step-2-defeat-5-hollow-wolves-at-wolf-hollow-thornwood-south-west\">Step 2: Defeat 5 hollow wolves at Wolf Hollow (Thornwood, south-west)\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Wolf Hollow is south-west through the Thornwood: take the gate path south, then the west track. They run in a pack: fight them one at a time if you can.\u003c/li>\u003cli>\u003cb>Fight with:\u003c/b> any weapon.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-3-go-back-to-huntmaster-kael\">Step 3: Go back to Huntmaster Kael\u003c/h3>\n\u003cp>\u003cb>Huntmaster Kael:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Five! You've earned this. It was mine, when I was a Warden of the Thornwood, before the Emberhall took the Wardens over.\u003c/p>\u003cp>Look after it. And keep your eyes open out there.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> 2 silver.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> 2 silver.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#odos-stubborn-field\" data-to=\"odos-stubborn-field\">Odo's Stubborn Field\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#marens-question\" data-to=\"marens-question\">Maren's Question\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"the-mages-guild","t":"The Mages' Guild","c":"Factions","i":"🔮","sum":"Scholars of magic and emberstone, south-west of Emberhold's square.","a":["Mages' Guild","Mages Guild"],"ib":[["Head","\u003ca href=\"#archmage-rowan\" data-to=\"archmage-rowan\">Archmage Rowan\u003c/a>"],["Where","\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>, south-west of the square"],["Kind","Indoors"],["Danger","Safe"],["Size","19 × 11 tiles"]],"h":"\u003cp>\u003cb>The Mages' Guild\u003c/b> are scholars of magic and emberstone. Their hall in \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a> has the enchanting altar, the alchemy table, enchanted chests you can rent, and a board of magic jobs (see \u003ca href=\"#bounties\" data-to=\"bounties\">Bounties\u003c/a>). \u003ca href=\"#archmage-rowan\" data-to=\"archmage-rowan\">Archmage Rowan\u003c/a> runs it and teaches \u003ca href=\"#enchanting\" data-to=\"enchanting\">Enchanting\u003c/a>; \u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">Alchemist Moss\u003c/a> teaches \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> there.\u003c/p>\n\u003cp>Its records about \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a> and \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a> stop around year 500, at the end of the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>. Scholars find that odd.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The Guild is honest, but the emberstone it sells ends up feeding \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>. Its missing records were taken by the Emberguard, because they told the story of the Emberfall before Wick was blamed for it.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"guild\">\u003c/figure>\n\u003cp>\u003cb>People here:\u003c/b> \u003ca href=\"#repairer-oswin\" data-to=\"repairer-oswin\">Repairer Oswin\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Things to use:\u003c/b> Guild board, Enchanted chest.\u003c/p>","src":["wiki/pages/mages-guild.md","shared/world.ts","shared/npcs.ts"],"w":true,"r":false},{"s":"the-mending","t":"The Mending","c":"Story","i":"🌱","sum":"Repeatable quests in every region, at every level, to fight the Withering and help the land heal.","a":["Mending","Mending quests"],"ib":[],"h":"\u003cp>\u003cb>The Mending\u003c/b> is the work of healing the land, and it never really ends. Every region has repeatable Mending quests at every level, open to everyone, wherever they are in the \u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-what-players-do\">What players do\u003c/h2>\n\u003cul>\u003cli>Clear Blighted beasts from the withering lands.\u003c/li>\u003cli>Plant \u003ca href=\"#the-tenders\" data-to=\"the-tenders\">Tender\u003c/a> gardens and tend them.\u003c/li>\u003cli>Break \u003ca href=\"#the-withering\" data-to=\"the-withering\">The Withering\u003c/a>'s hold on a ruin, a grove or a stretch of shore.\u003c/li>\u003cli>Each region has its own kind: cutting back the vines in \u003ca href=\"#the-tangle\" data-to=\"the-tangle\">The Tangle\u003c/a>, clearing the fog in \u003ca href=\"#blackfen\" data-to=\"blackfen\">Blackfen\u003c/a>, shoring up villages against the tides on \u003ca href=\"#saltmere-coast\" data-to=\"saltmere-coast\">Saltmere Coast\u003c/a>, and so on.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-the-land-comes-back\">The land comes back\u003c/h2>\n\u003cp>Each player has a Mending score in each region. As it grows, that region visibly heals for them: grass returns, trees glow again, the fog lifts, the ice pulls back.\u003c/p>\n\u003cp>Before Act 4, the Emberguard hand out the Mending as &quot;fighting the Blight&quot;. After Act 4, when the great shrines have been freed, the land heals faster, and Mending quests also gather what the \u003ca href=\"#ember-seed\" data-to=\"ember-seed\">Ember Seed\u003c/a> needs.\u003c/p>\n\u003cp>Not in the game yet.\u003c/p>","src":["wiki/pages/mending.md"],"w":true,"r":false},{"s":"the-old-mine","t":"The old mine","c":"Places","i":"🕳️","sum":"","a":[],"ib":[["Kind","Cave"],["Danger","Safe"],["Size","32 × 16 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"old_mine\">\u003c/figure>\n\u003cp>\u003cb>Monsters:\u003c/b> \u003ca href=\"#rat\" data-to=\"rat\">Rat\u003c/a> (3).\u003c/p>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"the-rebuilding","t":"The Rebuilding","c":"History","i":"🧱","sum":"Years 0 to 200. The Circle and the first Emberborn take back the ruined land, and cities grow around the great shrines.","a":["Rebuilding","The age of heroes"],"ib":[["When","Years 0 to 200"]],"h":"\u003cp>\u003cb>The Rebuilding\u003c/b> is the two hundred years after \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">the Emberfall\u003c/a>, when the land was taken back from the wild ember. People also call it the age of heroes.\u003c/p>\n\u003cul>\u003cli>\u003cb>The great shrines (0 to 10):\u003c/b> each member of \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a> raised a great shrine in their own region to pin the torrent down (see \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a>).\u003c/li>\u003cli>\u003cb>The first Emberborn (about 30):\u003c/b> the shrines began catching the wild ember and giving it bodies. The first \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a>, Halric the Dawnbringer among them, fought the burning beasts and stabilized the land around each shrine.\u003c/li>\u003cli>\u003cb>The Emberguard (about 50):\u003c/b> the Circle founded \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a> to keep the shrines lit and train the new Emberborn.\u003c/li>\u003cli>\u003cb>The cities:\u003c/b> survivors gathered where the land was warm and safe, around the great shrines, and each shrine became the heart of a city. \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a> grew up around \u003ca href=\"#the-heart-shrine\" data-to=\"the-heart-shrine\">The Heart Shrine\u003c/a>.\u003c/li>\u003c/ul>\n\u003cp>By about year 200 the land was under control again. That's also when the first Emberborn began to fade (\u003ca href=\"#the-fading\" data-to=\"the-fading\">The Fading\u003c/a>), and the first \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a> was held.\u003c/p>\n\u003cp>The Rebuilding is the one part of history where the official story and the truth mostly agree: the Circle really were heroes then.\u003c/p>","src":["wiki/pages/rebuilding.md"],"w":true,"r":false},{"s":"the-rooted","t":"The Rooted","c":"Factions","i":"🌳","sum":"Ordinary townsfolk who can't come back from death.","a":["Rooted"],"ib":[],"h":"\u003cp>\u003cb>The Rooted\u003c/b> are the ordinary folk of the land: people born the usual way, who can't come back from death. Most of Emberhold's townsfolk are Rooted, and they trust \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a> completely. \u003ca href=\"#sister-celene\" data-to=\"sister-celene\">Sister Celene\u003c/a>, \u003ca href=\"#repairer-oswin\" data-to=\"repairer-oswin\">Repairer Oswin\u003c/a> and \u003ca href=\"#tamsin\" data-to=\"tamsin\">Tamsin\u003c/a> are Rooted.\u003c/p>","src":["wiki/pages/rooted.md"],"w":true,"r":false},{"s":"the-shrines","t":"The shrines","c":"Lore","i":"⛩️","sum":"Where Emberborn wake and come back to. Everyone believes they hold back another Emberfall.","a":["Shrines","Shrine","The siphon","Siphon","Great shrines"],"ib":[],"h":"\u003cp>\u003cb>The shrines\u003c/b> stand all across the land, kept lit by \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>
