ory.ts"],"w":true,"r":false},{"s":"buying-and-selling","t":"Buying and selling","c":"Quests","i":"📜","sum":"Lessons from Shopkeeper Tam.","a":[],"ib":[["Part of","Lessons"],["Given by","Shopkeeper Tam"],["Where","in the General Store, at the top of Market Square"],["Steps","4"]],"h":"\u003cp>\u003cb>Buying and selling\u003c/b> is a lesson from \u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>, found in the General Store, at the top of Market Square.\u003c/p>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-shopkeeper-tam-at-the-general-store\">Step 1: Talk to Shopkeeper Tam at the General Store\u003c/h3>\n\u003cp>\u003cb>Shopkeeper Tam:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Ah, a customer! I'm Tam. I'll buy anything you bring me, but the trainers only buy what their own trade makes: logs for Holt, ore for Greta, and so on. They all pay the same price.\u003c/p>\u003cp>Every coin you earn selling trains your Trading skill. Trading is part of Charisma, and the higher your Charisma, the more shops pay you and the less they charge.\u003c/p>\u003cp>Let's see you haggle. Buy something from me first: open my Buy tab. A potato will do.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> the \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a> skill.\u003c/p>\n\u003ch3 id=\"s-step-2-buy-something-from-any-shop-open-its-buy-tab\">Step 2: Buy something from any shop (open its Buy tab)\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Click me, open the Buy tab, and buy something cheap, like a potato.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-3-sell-3-things-to-any-shop\">Step 3: Sell 3 things to any shop\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Click me (or a trainer), then tap things in your bag to sell them. A stack asks how many: try the slider to sell just part of it.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-4-go-back-to-shopkeeper-tam-for-your-reward\">Step 4: Go back to Shopkeeper Tam for your reward\u003c/h3>\n\u003cp>\u003cb>Shopkeeper Tam:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>A natural trader! Remember: tap 🔒 on your bag to keep things safe from Sell all.\u003c/p>\u003cp>Here's a little something for your trouble. Come back any time.\u003c/p>\u003cp>Mind you, trade's not what it was. The routes west have all closed since the Barrens went bad.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> 50 bronze.\u003c/p>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a>.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> 50 bronze.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#living-off-the-land\" data-to=\"living-off-the-land\">Living off the land\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#the-woodcutters-start\" data-to=\"the-woodcutters-start\">The woodcutter's start\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"captain-bryn","t":"Captain Bryn","c":"People","i":"📋","sum":"Runs the bounty board and hands out Renown ranks.","a":[],"ib":[["Found in","Emberhold"],["Shop","Yes"],["Game id","\u003ccode>bryn\u003c/code>"]],"h":"\u003cp>\u003cb>Captain Bryn\u003c/b> runs the bounty board in the square and hands out \u003ca href=\"#renown\" data-to=\"renown\">Renown\u003c/a> ranks. He puts bounties on \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a> because the Emberguard ask. Later in the story he has to decide whether to believe you. His grandfather swore he saw a fish in the square's well.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;Folk round here need a hand with all sorts. Check the board.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#odd-jobs\" data-to=\"odd-jobs\">Odd jobs\u003c/a> (lessons)\u003c/li>\u003cli>\u003ca href=\"#highway-robbery\" data-to=\"highway-robbery\">Highway robbery\u003c/a> (side quest)\u003c/li>\u003cli>\u003ca href=\"#ash-on-the-road\" data-to=\"ash-on-the-road\">Ash on the Road\u003c/a> (Act 1)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Shop:\u003c/b> buys monster drops. Sells: \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>. See \u003ca href=\"#shops\" data-to=\"shops\">Shops\u003c/a>.\u003c/p>","src":["wiki/pages/person-bryn.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"carrot-seeds","t":"Carrot seeds","c":"Items","i":"🌱","sum":"Seed. Sells for 1 bronze.","a":["carrot seed"],"ib":[["Kind","Seeds"],["Shop pays","1 bronze"],["Game id","\u003ccode>seed_carrot\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"carrots","t":"Carrots","c":"Items","i":"🥕","sum":"Herbs, roots and crop. Sells for 1 bronze.","a":["carrot"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","1 bronze"],["Game id","\u003ccode>carrot\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Grown with \u003ca href=\"#farming\" data-to=\"farming\">Farming\u003c/a> level 4: ripe after 15 minutes, 3 to 5 a tile.\u003c/li>\u003cli>Sold by \u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (vegetables): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"cave-spider","t":"Cave spider","c":"Monsters","i":"🕷️","sum":"A level 14 monster. Attacks on sight.","a":[],"ib":[["Level","14"],["Health","34"],["Biggest hit","5"],["Attacks every","1.8s"],["Temper","Attacks on sight"],["Out","Day and night"],["Comes back after","66s"],["Coins","2 to 10 bronze"]],"h":"\u003cp>The \u003cb>Cave spider\u003c/b> is a level 14 monster with 34 health. Attacks on sight.\u003c/p>\n\u003cp>Defeating one gives 14 bonus XP on top of 1 XP per point of damage, plus 28 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>The spider cave (3).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🕸️ \u003ca href=\"#spider-silk\" data-to=\"spider-silk\">Spider silk\u003c/a>\u003c/td>\u003ctd>50%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧪 \u003ca href=\"#venom-sacs\" data-to=\"venom-sacs\">Venom sacs\u003c/a>\u003c/td>\u003ctd>30%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>It also drops 2 to 10 bronze coins.\u003c/p>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"charisma","t":"Charisma","c":"Skills","i":"🤝","sum":"Dealing with people. Better shop prices.","a":[],"ib":[["Kind","Discipline"],["Skills","Trading, Leadership, Renown"]],"h":"\u003cp>🤝 \u003cb>Charisma\u003c/b> is one of the five \u003ca href=\"#disciplines\" data-to=\"disciplines\">Disciplines\u003c/a>. Dealing with people. Better shop prices. Its level is the average of the levels of its skills you've learned, rounded down.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Skill\u003c/th>\u003cth>What it is\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>💰 \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a>\u003c/td>\u003ctd>Trained by selling things to any shop (the more it's worth, the more XP). Each level makes prices a little better, and trainers sell you rarer things as it goes up.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🚩 \u003ca href=\"#leadership\" data-to=\"leadership\">Leadership\u003c/a>\u003c/td>\u003ctd>Trained by leading a party (click another player to invite them): the leader earns it when the party finishes quest steps and defeats monsters together. Party members near the leader get a little extra XP from kills. Huntmaster Kael teaches it in his Wolf Hunt.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📋 \u003ca href=\"#renown\" data-to=\"renown\">Renown\u003c/a>\u003c/td>\u003ctd>Trained by finishing bounties, on the bounty board and the Mages' Guild board. Bounties get bigger and pay more as it goes up, and Captain Bryn gives you ranks and titles (Wanderer at 5, Trusted at 15, Champion at 30).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/stats.ts"],"w":false,"r":false},{"s":"chicken","t":"Chicken","c":"Monsters","i":"🐔","sum":"A level 1 monster. Never fights back.","a":[],"ib":[["Level","1"],["Health","4"],["Biggest hit","0"],["Attacks every","2.4s"],["Temper","Never fights back"],["Out","Day and night"],["Comes back after","30s"],["Coins","None"]],"h":"\u003cp>The \u003cb>Chicken\u003c/b> is a level 1 monster with 4 health. Never fights back.\u003c/p>\n\u003cp>Defeating one gives 1 bonus XP on top of 1 XP per point of damage, plus 2 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>Heartvale, near the Emberhall (5), Heartvale, near the lake (1), The Thornwood, near Ashbound camp (5).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🪶 \u003ca href=\"#feathers\" data-to=\"feathers\">Feathers\u003c/a>\u003c/td>\u003ctd>60%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍗 \u003ca href=\"#raw-chicken\" data-to=\"raw-chicken\">Raw chicken\u003c/a>\u003c/td>\u003ctd>70%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"chum-bait","t":"Chum bait","c":"Items","i":"🪣","sum":"Materials and food. Sells for 3 bronze.","a":[],"ib":[["Kind","Materials and food"],["Shop pays","3 bronze"],["Game id","\u003ccode>bait_chum\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#food-scraps\" data-to=\"food-scraps\">Food scraps\u003c/a>, \u003ca href=\"#food-scraps\" data-to=\"food-scraps\">Food scraps\u003c/a>, \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cp>Nowhere in the game yet.\u003c/p>","src":["shared/items.ts"],"w":false,"r":false},{"s":"cloth","t":"Cloth","c":"Items","i":"🧶","sum":"Materials and food. Sells for 93 bronze.","a":["piece of cloth"],"ib":[["Kind","Materials and food"],["Shop pays","93 bronze"],["Game id","\u003ccode>cloth\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#thread\" data-to=\"thread\">Thread\u003c/a>, \u003ca href=\"#thread\" data-to=\"thread\">Thread\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cp>Nowhere in the game yet.\u003c/p>","src":["shared/items.ts"],"w":false,"r":false},{"s":"coal","t":"Coal","c":"Items","i":"🪨","sum":"Ore. Sells for 18 bronze.","a":[],"ib":[["Kind","Ore"],["Shop pays","18 bronze"],["Game id","\u003ccode>coal\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a> level 30 from a coal rock (14 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#steel-bar\" data-to=\"steel-bar\">Steel bar\u003c/a>.\u003c/li>\u003cli>Goes into \u003ca href=\"#mithril-bar\" data-to=\"mithril-bar\">Mithril bar\u003c/a>.\u003c/li>\u003cli>Goes into \u003ca href=\"#iridium-bar\" data-to=\"iridium-bar\">Iridium bar\u003c/a>.\u003c/li>\u003cli>Smelted into \u003ca href=\"#steel-bar\" data-to=\"steel-bar\">Steel bar\u003c/a>.\u003c/li>\u003cli>Smelted into \u003ca href=\"#mithril-bar\" data-to=\"mithril-bar\">Mithril bar\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"combat","t":"Combat","c":"Mechanics","i":"⚔️","sum":"How fighting works.","a":[],"ib":[],"h":"\u003cp>Hold a \u003ca href=\"#weapons\" data-to=\"weapons\">weapon\u003c/a> and click a monster. Every hit gives XP to the skill you used (\u003ca href=\"#melee\" data-to=\"melee\">Melee\u003c/a>, \u003ca href=\"#ranged\" data-to=\"ranged\">Ranged\u003c/a> or \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a>), to that weapon's or spell's \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>, and to that monster's Mastery. Getting attacked trains \u003ca href=\"#defense\" data-to=\"defense\">Defense\u003c/a>. With nothing in your hand you punch.\u003c/p>\n\u003cul>\u003cli>Each weapon attack costs 1 stamina; spells cost mana.\u003c/li>\u003cli>Mana comes back 1 every 6 seconds.\u003c/li>\u003cli>Health comes back 1 a minute (1 min); potions are the quick way. A \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a> gives 30.\u003c/li>\u003cli>One game tick is 0.6 seconds.\u003c/li>\u003c/ul>\n\u003cp>Mastery of a weapon or monster makes you hit more often and harder, and Mastery of a monster makes it drop things more often. When you fall, you wake at a shrine (see \u003ca href=\"#the-tithe\" data-to=\"the-tithe\">The Tithe\u003c/a>).\u003c/p>","src":["shared/combat.ts"],"w":false,"r":false},{"s":"cooking","t":"Cooking","c":"Skills","i":"🍲","sum":"Use the stove in the town square, by Old Maren on the Emberhall's steps, to cook meals (stew, stir fry, curry, roast) from fish, meat and vegetables. Meals give back lots of stamina.","a":[],"ib":[["Discipline","🤲 Dexterity"],["Taught by","\u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>"],["Max level","99"]],"h":"\u003cp>🍲 \u003cb>Cooking\u003c/b> is a skill in \u003ca href=\"#dexterity\" data-to=\"dexterity\">Dexterity\u003c/a>. Use the stove in the town square, by Old Maren on the Emberhall's steps, to cook meals (stew, stir fry, curry, roast) from fish, meat and vegetables. Meals give back lots of stamina.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#living-off-the-land\" data-to=\"living-off-the-land\">Living off the land\u003c/a>, from \u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🍲 Bigger pot\u003c/td>\u003ctd>+1 ingredient slot\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🎯 Steady hands\u003c/td>\u003ctd>6% fewer failures\u003c/td>\u003c/tr>\u003ctr>\u003ctd>💪 Hearty meals\u003c/td>\u003ctd>meals give 5% more stamina\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-dishes\">Dishes\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Dish\u003c/th>\u003cth>Level\u003c/th>\u003cth>Good with\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🍲 Stew\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Takes anything, and gets the most from a good fire\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🥘 Stir fry\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Best with chicken and beef. No fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍛 Curry\u003c/td>\u003ctd>5\u003c/td>\u003ctd>Best with fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🥩 Steak\u003c/td>\u003ctd>4\u003c/td>\u003ctd>Just meat (beef or boar), with a little veg on the side\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍖 Roast\u003c/td>\u003ctd>7\u003c/td>\u003ctd>Best with beef, then chicken. No fish\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>See \u003ca href=\"#meals\" data-to=\"meals\">Meals\u003c/a>.\u003c/p>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"copper-ore","t":"Copper ore","c":"Items","i":"🪨","sum":"Ore. Sells for 4 bronze.","a":[],"ib":[["Kind","Ore"],["Shop pays","4 bronze"],["Game id","\u003ccode>copper_ore\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a> level 1 from a copper rock (4 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#hammer-and-fire\" data-to=\"hammer-and-fire\">Hammer and fire\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#bronze-bar\" data-to=\"bronze-bar\">Bronze bar\u003c/a>.\u003c/li>\u003cli>Smelted into \u003ca href=\"#bronze-bar\" data-to=\"bronze-bar\">Bronze bar\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"cow","t":"Cow","c":"Monsters","i":"🐄","sum":"A level 3 monster. Never fights back.","a":[],"ib":[["Level","3"],["Health","12"],["Biggest hit","0"],["Attacks every","2.4s"],["Temper","Never fights back"],["Out","Day and night"],["Comes back after","42s"],["Coins","None"]],"h":"\u003cp>The \u003cb>Cow\u003c/b> is a level 3 monster with 12 health. Never fights back.\u003c/p>\n\u003cp>Defeating one gives 4 bonus XP on top of 1 XP per point of damage, plus 7 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>Heartvale, near Pasture (5).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🐮 \u003ca href=\"#cowhides\" data-to=\"cowhides\">Cowhides\u003c/a>\u003c/td>\u003ctd>60%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🥩 \u003ca href=\"#raw-beef\" data-to=\"raw-beef\">Raw beef\u003c/a>\u003c/td>\u003ctd>70%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"cowhides","t":"Cowhides","c":"Items","i":"🐮","sum":"Monster drop. Sells for 4 bronze.","a":["cowhide"],"ib":[["Kind","Monster drops"],["Shop pays","4 bronze"],["Game id","\u003ccode>cowhide\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#cow\" data-to=\"cow\">Cow\u003c/a> (60%).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#leather\" data-to=\"leather\">Leather\u003c/a>.\u003c/li>\u003cli>Tanned into \u003ca href=\"#leather\" data-to=\"leather\">Leather\u003c/a> at Woodworker Rook's rack (\u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a> level 3).\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"crops","t":"Crops","c":"Items","i":"🌾","sum":"What you can grow at the farm.","a":[],"ib":[],"h":"\u003cp>Plant Farmer Odo's seeds on your plot. Crops grow even while you're logged out. See \u003ca href=\"#farming\" data-to=\"farming\">Farming\u003c/a>.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Crop\u003c/th>\u003cth>Farming level\u003c/th>\u003cth>Ripe after\u003c/th>\u003cth>Harvest\u003c/th>\u003cth>Seed price\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#potatoes\" data-to=\"potatoes\">Potatoes\u003c/a>\u003c/td>\u003ctd>1\u003c/td>\u003ctd>10 min\u003c/td>\u003ctd>3–5\u003c/td>\u003ctd>1 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#carrots\" data-to=\"carrots\">Carrots\u003c/a>\u003c/td>\u003ctd>4\u003c/td>\u003ctd>15 min\u003c/td>\u003ctd>3–5\u003c/td>\u003ctd>1 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#onions\" data-to=\"onions\">Onions\u003c/a>\u003c/td>\u003ctd>8\u003c/td>\u003ctd>25 min\u003c/td>\u003ctd>2–4\u003c/td>\u003ctd>2 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#wheat\" data-to=\"wheat\">Wheat\u003c/a>\u003c/td>\u003ctd>12\u003c/td>\u003ctd>40 min\u003c/td>\u003ctd>3–5\u003c/td>\u003ctd>2 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#ginseng-roots\" data-to=\"ginseng-roots\">Ginseng roots\u003c/a>\u003c/td>\u003ctd>20\u003c/td>\u003ctd>120 min\u003c/td>\u003ctd>1–2\u003c/td>\u003ctd>8 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#blue-lotus\" data-to=\"blue-lotus\">Blue lotus\u003c/a>\u003c/td>\u003ctd>30\u003c/td>\u003ctd>180 min\u003c/td>\u003ctd>1–2\u003c/td>\u003ctd>12 bronze\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-plot-sizes\">Plot sizes\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Size\u003c/th>\u003cth>Price\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>2 × 2\u003c/td>\u003ctd>2 gold\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3 × 2\u003c/td>\u003ctd>3 gold\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3 × 3\u003c/td>\u003ctd>5 gold\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4 × 4\u003c/td>\u003ctd>8 gold\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5 × 5\u003c/td>\u003ctd>12 gold\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6 × 5\u003c/td>\u003ctd>18 gold\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6 × 6\u003c/td>\u003ctd>25 gold\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/farming.ts"],"w":false,"r":false},{"s":"dagger","t":"Dagger","c":"Items","i":"🔪","sum":"A melee weapon.","a":[],"ib":[["Style","Melee"],["Level","1"],["Biggest hit","2 + metal"],["Attacks every","1.8s"],["Range","1 tile"],["Hands","One"]],"h":"\u003cp>🔪 The dagger needs \u003ca href=\"#melee\" data-to=\"melee\">Melee\u003c/a> level 1. Its biggest hit is 2, plus its metal's bonus. It attacks every 1.8s and reaches 1 tile. See \u003ca href=\"#weapons\" data-to=\"weapons\">Weapons\u003c/a> and \u003ca href=\"#combat\" data-to=\"combat\">Combat\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"darts","t":"Darts","c":"Items","i":"🎯","sum":"A ranged weapon.","a":[],"ib":[["Style","Ranged"],["Level","5"],["Biggest hit","2 + metal"],["Attacks every","1.2s"],["Range","3 tiles"],["Hands","One"]],"h":"\u003cp>🎯 The darts needs \u003ca href=\"#ranged\" data-to=\"ranged\">Ranged\u003c/a> level 5. Its biggest hit is 2, plus its metal's bonus. It attacks every 1.2s and reaches 3 tiles. See \u003ca href=\"#weapons\" data-to=\"weapons\">Weapons\u003c/a> and \u003ca href=\"#combat\" data-to=\"combat\">Combat\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"day-and-night","t":"Day and night","c":"Mechanics","i":"🌙","sum":"A day lasts 40 minutes, a night 10.","a":[],"ib":[],"h":"\u003cp>A full day is 40 minutes of daylight and 10 minutes of night, with 2 minutes of dusk and dawn between. Some monsters (like the \u003ca href=\"#giant-bat\" data-to=\"giant-bat\">Giant bat\u003c/a>) and some finds (like \u003ca href=\"#moonpetal\" data-to=\"moonpetal\">Moonpetal\u003c/a>) only come out at night. Your \u003ca href=\"#your-lantern\" data-to=\"your-lantern\">lantern\u003c/a> makes nights less dark.\u003c/p>","src":["shared/daynight.ts"],"w":false,"r":false},{"s":"defense","t":"Defense","c":"Skills","i":"🛡️","sum":"Trained by being attacked. Higher Defense means monsters miss more, and you can wear better armor.","a":[],"ib":[["Discipline","💪 Strength"],["Taught by","\u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>"],["Max level","99"]],"h":"\u003cp>🛡️ \u003cb>Defense\u003c/b> is a skill in \u003ca href=\"#strength\" data-to=\"strength\">Strength\u003c/a>. Trained by being attacked. Higher Defense means monsters miss more, and you can wear better armor.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#standing-your-ground\" data-to=\"standing-your-ground\">Standing your ground\u003c/a>, from \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>❤️ Toughness\u003c/td>\u003ctd>+5 max health\u003c/td>\u003c/tr>\u003ctr>\u003ctd>💨 Footwork\u003c/td>\u003ctd>monsters hit you 2% less\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📖 Quick learner\u003c/td>\u003ctd>10% more XP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"dexterity","t":"Dexterity","c":"Skills","i":"🤲","sum":"Making things. Raises how much you can carry and how fast you walk.","a":[],"ib":[["Kind","Discipline"],["Skills","Cooking, Handicraft, Smithing, Smelting"]],"h":"\u003cp>🤲 \u003cb>Dexterity\u003c/b> is one of the five \u003ca href=\"#disciplines\" data-to=\"disciplines\">Disciplines\u003c/a>. Making things. Raises how much you can carry and how fast you walk. Its level is the average of the levels of its skills you've learned, rounded down.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Skill\u003c/th>\u003cth>What it is\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🍲 \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>\u003c/td>\u003ctd>Use the stove in the town square, by Old Maren on the Emberhall's steps, to cook meals (stew, stir fry, curry, roast) from fish, meat and vegetables. Meals give back lots of stamina.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧵 \u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a>\u003c/td>\u003ctd>Use Woodworker Rook's workshop: fishing bait, bows, arrows and staffs at the workbench, leather at the tanning rack (outside), thread and cloth at the spinning wheel, and leather and cloth armor.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🔨 \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>\u003c/td>\u003ctd>Use the anvil in Smith Brann's smithy to make tools from a metal bar, plus a log.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🔥 \u003ca href=\"#smelting\" data-to=\"smelting\">Smelting\u003c/a>\u003c/td>\u003ctd>Use the furnace in Smith Brann's smithy to turn ore into bars.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/stats.ts"],"w":false,"r":false},{"s":"disciplines","t":"Disciplines","c":"Mechanics","i":"📊","sum":"The five big areas you level up, and what each raises.","a":[],"ib":[],"h":"\u003cp>There are five disciplines. Each holds skills, and each raises one of your stats. A discipline's level is the average of the skills in it that you've learned (rounded down), so it rises as they do.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Discipline\u003c/th>\u003cth>Raises\u003c/th>\u003cth>Skills\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>💪 \u003ca href=\"#strength\" data-to=\"strength\">Strength\u003c/a>\u003c/td>\u003ctd>Raises your max health.\u003c/td>\u003ctd>\u003ca href=\"#melee\" data-to=\"melee\">Melee\u003c/a>, \u003ca href=\"#defense\" data-to=\"defense\">Defense\u003c/a>, \u003ca href=\"#ranged\" data-to=\"ranged\">Ranged\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🌿 \u003ca href=\"#endurance\" data-to=\"endurance\">Endurance\u003c/a>\u003c/td>\u003ctd>Raises your max stamina.\u003c/td>\u003ctd>\u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a>, \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a>, \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a>, \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a>, \u003ca href=\"#farming\" data-to=\"farming\">Farming\u003c/a>, \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🔮 \u003ca href=\"#wisdom\" data-to=\"wisdom\">Wisdom\u003c/a>\u003c/td>\u003ctd>Raises your max mana.\u003c/td>\u003ctd>\u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a>, \u003ca href=\"#enchanting\" data-to=\"enchanting\">Enchanting\u003c/a>, \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🤲 \u003ca href=\"#dexterity\" data-to=\"dexterity\">Dexterity\u003c/a>\u003c/td>\u003ctd>Raises how much you can carry and how fast you walk.\u003c/td>\u003ctd>\u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>, \u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a>, \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>, \u003ca href=\"#smelting\" data-to=\"smelting\">Smelting\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🤝 \u003ca href=\"#charisma\" data-to=\"charisma\">Charisma\u003c/a>\u003c/td>\u003ctd>Better shop prices.\u003c/td>\u003ctd>\u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a>, \u003ca href=\"#leadership\" data-to=\"leadership\">Leadership\u003c/a>, \u003ca href=\"#renown\" data-to=\"renown\">Renown\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-stats-at-each-level\">Stats at each level\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Health (Strength)\u003c/th>\u003cth>Stamina (Endurance)\u003c/th>\u003cth>Mana (Wisdom)\u003c/th>\u003cth>Carry (Dexterity)\u003c/th>\u003cth>Walk speed (Dexterity)\u003c/th>\u003cth>Prices (Charisma)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>50\u003c/td>\u003ctd>100\u003c/td>\u003ctd>50\u003c/td>\u003ctd>45 kg\u003c/td>\u003ctd>+0%\u003c/td>\u003ctd>0% better\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>95\u003c/td>\u003ctd>145\u003c/td>\u003ctd>95\u003c/td>\u003ctd>54 kg\u003c/td>\u003ctd>+9%\u003c/td>\u003ctd>2.7% better\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20\u003c/td>\u003ctd>145\u003c/td>\u003ctd>195\u003c/td>\u003ctd>145\u003c/td>\u003ctd>64 kg\u003c/td>\u003ctd>+19%\u003c/td>\u003ctd>5.7% better\u003c/td>\u003c/tr>\u003ctr>\u003ctd>31\u003c/td>\u003ctd>200\u003c/td>\u003ctd>250\u003c/td>\u003ctd>200\u003c/td>\u003ctd>75 kg\u003c/td>\u003ctd>+30%\u003c/td>\u003ctd>9% better\u003c/td>\u003c/tr>\u003ctr>\u003ctd>50\u003c/td>\u003ctd>295\u003c/td>\u003ctd>345\u003c/td>\u003ctd>295\u003c/td>\u003ctd>94 kg\u003c/td>\u003ctd>+30%\u003c/td>\u003ctd>14.7% better\u003c/td>\u003c/tr>\u003ctr>\u003ctd>75\u003c/td>\u003ctd>420\u003c/td>\u003ctd>470\u003c/td>\u003ctd>420\u003c/td>\u003ctd>119 kg\u003c/td>\u003ctd>+30%\u003c/td>\u003ctd>22.2% better\u003c/td>\u003c/tr>\u003ctr>\u003ctd>99\u003c/td>\u003ctd>540\u003c/td>\u003ctd>590\u003c/td>\u003ctd>540\u003c/td>\u003ctd>143 kg\u003c/td>\u003ctd>+30%\u003c/td>\u003ctd>29.4% better\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a> adds another 0.2% better prices per level above 1.\u003c/p>","src":["shared/disciplines.ts","shared/stats.ts"],"w":false,"r":false},{"s":"eel","t":"Eel","c":"Items","i":"🐍","sum":"Fish. Sells for 120 bronze.","a":[],"ib":[["Kind","Fish"],["Shop pays","120 bronze"],["Game id","\u003ccode>eel\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a> level 75 from a eel spot (50 XP each).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (fish): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"elderwood-logs","t":"Elderwood logs","c":"Items","i":"🪵","sum":"Log. Sells for 100 bronze.","a":["elderwood log"],"ib":[["Kind","Logs"],["Shop pays","100 bronze"],["Game id","\u003ccode>elderwood_logs\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a> level 70 from a elderwood tree (45 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Used for tool handles, bows, staffs and arrows, and burned as cooking fuel.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"ember-crown","t":"Ember Crown","c":"History","i":"👑","sum":"King Aldemar XVIII's crown, the focus of the Circle's great working. Lost in the Emberfall.","a":["The Ember Crown","Crown of Aurel"],"ib":[],"h":"\u003cp>\u003cb>The Ember Crown\u003c/b> was the crown of \u003ca href=\"#king-aldemar-xviii\" data-to=\"king-aldemar-xviii\">King Aldemar XVIII\u003c/a>, set with a stone of pure ember. It was the focus of \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a>'s great working: wearing it, the king could steer the power of \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a>. It was lost on the night of \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">the Emberfall\u003c/a>, and is said to have shattered with the king.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>\u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a> took it from the king's body. The Crown cracked in two in the burst. One half is set in Vale's staff (he never lets anyone touch it). The king's guard found the other half as the fire rose, carried it back to Whitestone as the city burned, and sealed it in the royal Crown Vault under \u003ca href=\"#the-sundered-crown\" data-to=\"the-sundered-crown\">The Sundered Crown\u003c/a>, where it lies still. Whole, it would let its wearer command the Emberheart itself.\u003c/p>\n\u003cp>When Vale falls at the end of Act 4, his spark flees into his half of the Crown. The impostor wardens Ivy and Reed escape with it, and in the endgame they hunt the other half in Whitestone's ruins, to make the Crown whole and bring Vale back.\u003c/p>\u003c/div>","src":["wiki/pages/ember-crown.md"],"w":true,"r":false},{"s":"ember-seed","t":"Ember Seed","c":"Lore","i":"🌱","sum":"What the Circle's working was meant to make. The Ashbound's one hope.","a":["The Ember Seed","Heart Seed","The Heart Seed","Aurel Seed"],"ib":[],"h":"\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>\u003cb>The Ember Seed\u003c/b> is what \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a>'s great working was meant to make: a seed of pure ember that, planted in the land, would warm it gently forever, giving without taking. It was \u003ca href=\"#king-aldemar-xviii\" data-to=\"king-aldemar-xviii\">King Aldemar XVIII\u003c/a>'s dream for \u003ca href=\"#aldmera\" data-to=\"aldmera\">Aldmera\u003c/a>, and the sign of his house (a seed under a crown) is on every Aldmeran coin.\u003c/p>\n\u003cp>The working broke before the Seed was planted. The half-made Seed was kept in the royal vault at \u003ca href=\"#whitestone\" data-to=\"whitestone\">Whitestone\u003c/a>, and it's still there, in the Crown Vault under \u003ca href=\"#the-sundered-crown\" data-to=\"the-sundered-crown\">The Sundered Crown\u003c/a>.\u003c/p>\n\u003cp>\u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a> has spent three hundred years working out how to finish it. Planted at \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a>, it would heal the land, and let \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> live on their own fire without the shrines. After Vale falls in Act 4, it's the only way to save the Emberborn for good.\u003c/p>\n\u003ch2 id=\"s-in-the-endgame\">In the endgame\u003c/h2>\n\u003col>\u003cli>\u003cb>Find it:\u003c/b> players fight their way into the Crown Vault, the first big endgame dungeon.\u003c/li>\u003cli>\u003cb>Finish it:\u003c/b> Wick's research says it needs a piece of each region's healed land, such as Thornwood heartwood, Greyspine fire-glass and Saltmere pearl, each from hard endgame content in that region.\u003c/li>\u003cli>\u003cb>Plant it\u003c/b> at the Emberheart. This can be saved for a later update. Wick may have to give up what's left of his power to make it take root.\u003c/li>\u003c/ol>\n\u003cp>See \u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a>.\u003c/p>\n\u003cp>Hints: \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>'s jar of seed from before the Emberfall, and Aldmeran coins showing a seed under a crown.\u003c/p>\u003c/div>\n\u003cp>This is a first idea, and Mike may change it.\u003c/p>","src":["wiki/pages/ember-seed.md"],"w":true,"r":false},{"s":"ember-trap","t":"Ember trap","c":"Spells","i":"👻","sum":"Traps a monster's ember. Defeat it before the glow fades and its ember fills one of your refined emberstones.","a":[],"ib":[["Spellcasting level","6"],["Mana","8"],["Kind","On a monster"],["Learned from","Levelling up"]],"h":"\u003cp>👻 Traps a monster's ember. Defeat it before the glow fades and its ember fills one of your refined emberstones.\u003c/p>\n\u003cp>It needs \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a> level 6 and costs 8 mana at Mastery 1 (Mastery lowers the cost). It lasts 60 seconds at Mastery 1.\u003c/p>","src":["shared/combat.ts","shared/spells.ts"],"w":false,"r":false},{"s":"ember-trap-potion","t":"Ember trap potion","c":"Items","i":"🧪","sum":"Your Ember trap spell lasts longer, for a while.","a":[],"ib":[["Alchemy level","25"],["Ingredients","Venom sacs + Moonpetal"],["XP","32"],["First tries work","40%"]],"h":"\u003cp>Your Ember trap spell lasts longer, for a while. Brew it with \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> level 25 from \u003ca href=\"#venom-sacs\" data-to=\"venom-sacs\">Venom sacs\u003c/a> and \u003ca href=\"#moonpetal\" data-to=\"moonpetal\">Moonpetal\u003c/a> in a vial. See \u003ca href=\"#potions\" data-to=\"potions\">Potions\u003c/a>.\u003c/p>","src":["shared/alchemy.ts"],"w":false,"r":false},{"s":"emberborn","t":"Emberborn","c":"Factions","i":"🔥","sum":"Heroes the shrines make from ember. No past, no family, and they come back when they fall. The players.","a":["The Emberborn","Kindled","Players"],"ib":[["Who","Every player character"],["Made at","\u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a>"],["First","About year 30, Halric the Dawnbringer among them"],["Old name","Kindled"]],"h":"\u003cp>\u003cb>Emberborn\u003c/b> are heroes \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a> make from \u003ca href=\"#the-ember\" data-to=\"the-ember\">ember\u003c/a>. They wake on a shrine's steps with no past and no family, and when they fall they come back at a shrine. Every player is one. There are hundreds of them.\u003c/p>\n\u003cp>Every Emberborn wakes holding a pebble of emberstone.\u003c/p>\n\u003cp>New Emberborn start as \u003ca href=\"#hopefuls\" data-to=\"hopefuls\">Hopefuls\u003c/a>: they aren't members of \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>, and have to prove themselves worthy through the Emberguard's trials.\u003c/p>\n\u003cp>The ordinary folk who can't come back from death are called \u003ca href=\"#the-rooted\" data-to=\"the-rooted\">The Rooted\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-where-they-came-from\">Where they came from\u003c/h2>\n\u003cp>After \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">the Emberfall\u003c/a>, wild ember was still tearing through the land. \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a>'s great shrines caught it, and about thirty years after the Fall they began giving it bodies: the first Emberborn, protectors to stabilize and guard the ruined land. They fought through \u003ca href=\"#the-rebuilding\" data-to=\"the-rebuilding\">The Rebuilding\u003c/a> and made the land safe again.\u003c/p>\n\u003cp>Emberborn don't age, but after centuries they wear thin (\u003ca href=\"#the-fading\" data-to=\"the-fading\">The Fading\u003c/a>). When a great champion has carried the flame long enough, they may be invited to a \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a>.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The Emberborn were made for a good reason, and are used for a bad one. Each time one falls, the shrine skims a little ember off them (\u003ca href=\"#the-tithe\" data-to=\"the-tithe\">The Tithe\u003c/a>). A bright Emberborn can be drained all at once in a \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a>, which feeds \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a> for years. And if the shrines go dark, every Emberborn turns to ash. The emberstone pebble they wake holding is their thread's anchor.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-how-it-looks-in-play\">How it looks in play\u003c/h2>\n\u003cp>In Act 4, Wick cuts the player's thread from the Heart Shrine. Grey ash marks slowly spread up their hands, the Tithe ends, and they rise at Ashbound hearths, then at the great shrines they've freed. (Planned; not in the game yet.)\u003c/p>","src":["wiki/pages/emberborn.md"],"w":true,"r":false},{"s":"emberhall-training-ground","t":"Emberhall Training Ground","c":"Places","i":"🎯","sum":"The yard beside the Emberhall where every trainer teaches new Emberborn their skills.","a":["Training Ground","The Training Ground"],"ib":[["Where","\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>, just east of \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>"],["Built","Version 0.18"]],"h":"\u003cp>The \u003cb>Emberhall Training Ground\u003c/b> is a hedged yard just east of \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>, in \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>. \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a> pay every trainer in the city to teach the new \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> here, so every lesson is a gift from the Emberhall.\u003c/p>\n\u003cp>It was added in version 0.18 to make the Prologue shorter and take every player through every skill in one place.\u003c/p>\n\u003ch2 id=\"s-whats-there\">What's there\u003c/h2>\n\u003cul>\u003cli>A pond (minnows by hand, trout with a rod): \u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a> teaches Fishing and Cooking at the stove beside it.\u003c/li>\u003cli>A grove of practice pines and oaks: \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a> (Woodcutting).\u003c/li>\u003cli>Practice rocks (copper, tin, iron and coal): \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a> (Mining).\u003c/li>\u003cli>A furnace and anvil: \u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a> (Smelting and Smithing).\u003c/li>\u003cli>A workbench, spinning wheel and tanning rack: \u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a> (Handicraft).\u003c/li>\u003cli>Dig patches: \u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a> (Foraging).\u003c/li>\u003cli>An alchemy table: \u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">Alchemist Moss\u003c/a> (Alchemy).\u003c/li>\u003cli>An enchanting altar: \u003ca href=\"#archmage-rowan\" data-to=\"archmage-rowan\">Archmage Rowan\u003c/a> (Magic and Enchanting).\u003c/li>\u003cli>A chicken coop and a rat pit: \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a> (fighting and Hunting).\u003c/li>\u003cli>Two farm plots: \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a> (Farming).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-in-the-prologue\">In the Prologue\u003c/h2>\n\u003cp>After &quot;Light the Way&quot;, Keeper Aldric sends you here (&quot;The Training Ground&quot; chapter). Old Maren's lessons come first; then the other trainers open up, one skill leading to the next (Brann after Greta, Rook after Holt, Moss after Wren, Rowan after Kael). The Oath of the Flame opens once you've learned from every trainer.\u003c/p>\n\u003ch2 id=\"s-later-skill-challenges-planned\">Later: skill challenges (planned)\u003c/h2>\n\u003cp>Once you've sworn the Oath, the trainers can also be found in the Emberhall, where they'll give \u003cb>skill challenge quests\u003c/b>: harder jobs in their skill that give bonus XP in it. Some need you to level up other skills first. See \u003ca href=\"#side-quests\" data-to=\"side-quests\">Side quests\u003c/a>.\u003c/p>","src":["wiki/pages/emberhall-training-ground.md"],"w":true,"r":false},{"s":"emberhold","t":"Emberhold","c":"Places","i":"🏰","sum":"The walled capital, built around the Emberhall, and where every player starts.","a":[],"ib":[["Levels","1 to 10"],["Region","\u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>"],["Gates","North, West, Saltmere and River (shut for now)"],["Kind","Outdoors"],["Danger","Safe"],["Size","150 × 112 tiles"]],"h":"\u003cp>\u003cb>Emberhold\u003c/b> is the capital: a walled city on the edge of \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>, built around \u003ca href=\"#the-heart-shrine\" data-to=\"the-heart-shrine\">The Heart Shrine\u003c/a> during \u003ca href=\"#the-rebuilding\" data-to=\"the-rebuilding\">The Rebuilding\u003c/a>. A great stone wall with towers runs all the way round it. \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a> stands on Ember Hill in the middle, its spire and flame visible from every street.\u003c/p>\n\u003cp>In version 0.18 (on the dev test server first) the whole game happens inside the walls. The four gates are shut for now; they'll open as the world outside is rebuilt. Later, homes in the city will be enterable too.\u003c/p>\n\u003ch2 id=\"s-districts\">Districts\u003c/h2>\n\u003cul>\u003cli>\u003cb>Ember Hill\u003c/b>: \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a> and its garden, with a plaza below the great steps (the six lanterns of the Prologue's &quot;Light the Way&quot; stand on the steps and round the plaza).\u003c/li>\u003cli>\u003cb>The \u003ca href=\"#emberhall-training-ground\" data-to=\"emberhall-training-ground\">Emberhall Training Ground\u003c/a>\u003c/b>, just east of the Emberhall behind a hedge, where every trainer teaches.\u003c/li>\u003cli>\u003cb>Market Square\u003c/b>: market stalls, the warm well (heated from below), the bell tower, \u003ca href=\"#the-general-store\" data-to=\"the-general-store\">The General Store\u003c/a> (\u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>) and Captain Bryn's bounty board.\u003c/li>\u003cli>\u003cb>Forge Row\u003c/b>, to the west: Forester Holt's and Miner Greta's houses, \u003ca href=\"#smith-branns-smithy\" data-to=\"smith-branns-smithy\">Smith Brann's smithy\u003c/a> and \u003ca href=\"#woodworker-rooks-workshop\" data-to=\"woodworker-rooks-workshop\">Woodworker Rook's workshop\u003c/a>.\u003c/li>\u003cli>\u003cb>The Glass River and the docks\u003c/b>, to the east: the river runs through the city under the wall, with wharves, a fish market and trout and salmon to catch. Old Maren's cottage is on the far bank.\u003c/li>\u003cli>\u003cb>The Lower Town\u003c/b>, to the south: \u003ca href=\"#the-hearthstone-inn\" data-to=\"the-hearthstone-inn\">The Hearthstone Inn\u003c/a>, \u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">The Mages' Guild\u003c/a>, \u003ca href=\"#huntmaster-kaels-lodge\" data-to=\"huntmaster-kaels-lodge\">Huntmaster Kael's lodge\u003c/a>, \u003ca href=\"#herbalist-wrens-hut\" data-to=\"herbalist-wrens-hut\">Herbalist Wren's hut\u003c/a> and the allotments, where anyone can rent a farm plot from Farmer Odo.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-gates\">Gates\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Gate\u003c/th>\u003cth>Where\u003c/th>\u003cth>Leads to\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>North Gate\u003c/td>\u003ctd>top of the city\u003c/td>\u003ctd>the road north into \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>West Gate\u003c/td>\u003ctd>west wall, past Forge Row\u003c/td>\u003ctd>the Westroad\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Saltmere Gate\u003c/td>\u003ctd>east wall, over the river\u003c/td>\u003ctd>the coast road to \u003ca href=\"#saltmere-coast\" data-to=\"saltmere-coast\">Saltmere\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>River Gate\u003c/td>\u003ctd>south wall, by the Lower Town\u003c/td>\u003ctd>the river road and the south\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-people\">People\u003c/h2>\n\u003cp>Ordinary townsfolk (Baker Hanna, little Pip, Guard Dunstan and others) walk the streets. Everyone in the game: see \u003ca href=\"#people-in-the-game\" data-to=\"people-in-the-game\">People in the game\u003c/a>.\u003c/p>\n\u003cp>People in the game call it Emberhold, and the town history book is &quot;Emberhold: a Town History&quot;.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"emberhold\">\u003c/figure>\n\u003cp>\u003cb>People here:\u003c/b> \u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>, \u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">Captain Bryn\u003c/a>, \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>, \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>, \u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a>, \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>, \u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>, \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>, \u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a>, \u003ca href=\"#archmage-rowan\" data-to=\"archmage-rowan\">Archmage Rowan\u003c/a>, \u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">Alchemist Moss\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Things to use:\u003c/b> Stove, Bounty board, Furnace, Anvil, Workbench, Tanning rack, Spinning wheel, Alchemy table, Enchanting altar, Farm chest, Lantern.\u003c/p>\n\u003cp>\u003cb>Monsters:\u003c/b> \u003ca href=\"#chicken\" data-to=\"chicken\">Chicken\u003c/a> (5), \u003ca href=\"#rat\" data-to=\"rat\">Rat\u003c/a> (4).\u003c/p>\n\u003cp>\u003cb>On the map:\u003c/b> The Greyspine Peaks, Quarry, The lake, The Emberhall, Trainer Row, Pasture, The farm, Saltmere Coast, To the Barrens (closed), The Thornwood (Dark Forest), Goblin camp, Spider hollow, Wolf Hollow, Ashbound camp, Graveyard.\u003c/p>","src":["wiki/pages/emberhold.md","shared/world.ts","shared/npcs.ts"],"w":true,"r":false},{"s":"embervale","t":"Embervale","c":"Lore","i":"🔥","sum":"The land the game is set in.","a":["The land","Emberfall (the land)","Elderra"],"ib":[["Kind","The land"],["Old name","Elderra"],["Capital","\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>"],["Year","800 After the Fall"],["Ruled by","Nobody; \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a> run the shrines"]],"h":"\u003cp>\u003cb>Embervale\u003c/b> is the land the game is set in. The game itself is called \u003cb>Emberfall\u003c/b>, after \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">the Emberfall\u003c/a>, the disaster 800 years ago that rained fire across the land and destroyed the kingdom of \u003ca href=\"#aldmera\" data-to=\"aldmera\">Aldmera\u003c/a>.\u003c/p>\n\u003cp>Deep under the land lies the source of its warmth, which people call \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a>. That warmth, \u003ca href=\"#the-ember\" data-to=\"the-ember\">the ember\u003c/a>, is in everything that grows.\u003c/p>\n\u003ch2 id=\"s-the-story-in-one-paragraph\">The story in one paragraph\u003c/h2>\n\u003cp>Eight hundred years ago, King Aldemar XVIII and his \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">Ember Circle\u003c/a> tried to harness the Emberheart for the whole kingdom. As they finished, \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a> murdered the king and twisted the working to fill himself with power. It broke loose, and Aldmera fell. The Circle, believing it had simply gone wrong, built \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a> to make the \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a>, protectors to save the land. But the power corrupted them. Vale created a Ceremony that drains the oldest heroes into himself, destroyed the members who found out, and rewrote history so that \u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a>, his old friend, is blamed for everything. Today the Circle rules in secret as \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>, behind \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>.\u003c/p>\n\u003cp>Players are Emberborn. They start as \u003ca href=\"#hopefuls\" data-to=\"hopefuls\">Hopefuls\u003c/a>, trying to prove themselves worthy of joining the Emberguard. On the day they're invited in, they learn the truth, refuse Vale's offer of forever, and join Wick and \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>. They bring down the Emberwardens and Vale and turn the shrines to give back to the land, and then search for the \u003ca href=\"#ember-seed\" data-to=\"ember-seed\">Ember Seed\u003c/a>, the one way to save the Emberborn for good.\u003c/p>\n\u003ch2 id=\"s-the-regions\">The regions\u003c/h2>\n\u003cp>See the \u003ca href=\"#world-map\" data-to=\"world-map\">World map\u003c/a> for where they are, and how people travel between them.\u003c/p>\n\u003cp>Each region has a great shrine with a city around it, and its own way of withering as the land far from the shrine goes cold (see \u003ca href=\"#the-withering\" data-to=\"the-withering\">The Withering\u003c/a>). The six outer regions all open after Act 1 and can be done in any order: each is safe around its city and harder further out (see \u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a>).\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Region\u003c/th>\u003cth>Levels\u003c/th>\u003cth>Land\u003c/th>\u003cth>Great shrine\u003c/th>\u003cth>How it withers\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>\u003c/td>\u003ctd>1 to 20\u003c/td>\u003ctd>Grassland: farms, rivers, and the capital \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#the-heart-shrine\" data-to=\"the-heart-shrine\">The Heart Shrine\u003c/a> (Vale)\u003c/td>\u003ctd>Grass turns to grey dust\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-thornwood\" data-to=\"the-thornwood\">The Thornwood\u003c/a>\u003c/td>\u003ctd>20 to 60\u003c/td>\u003ctd>Temperate forest\u003c/td>\u003ctd>Crowe\u003c/td>\u003ctd>The forest rots and goes dark\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#greyspine-peaks\" data-to=\"greyspine-peaks\">Greyspine Peaks\u003c/a>\u003c/td>\u003ctd>20 to 60\u003c/td>\u003ctd>Volcanic mountains\u003c/td>\u003ctd>Flint\u003c/td>\u003ctd>Eruptions, and the grey sickness\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-tangle\" data-to=\"the-tangle\">The Tangle\u003c/a>\u003c/td>\u003ctd>20 to 60\u003c/td>\u003ctd>Jungle\u003c/td>\u003ctd>Ivy\u003c/td>\u003ctd>Strangling vines\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#saltmere-coast\" data-to=\"saltmere-coast\">Saltmere Coast\u003c/a>\u003c/td>\u003ctd>20 to 60\u003c/td>\u003ctd>Coast and islands\u003c/td>\u003ctd>Merrow\u003c/td>\u003ctd>Drowning tides\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a>\u003c/td>\u003ctd>20 to 60\u003c/td>\u003ctd>Desert, full of Aldmeran ruins\u003c/td>\u003ctd>Dunn\u003c/td>\u003ctd>Glass and sand\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#blackfen\" data-to=\"blackfen\">Blackfen\u003c/a>\u003c/td>\u003ctd>20 to 60\u003c/td>\u003ctd>Swamp\u003c/td>\u003ctd>Reed\u003c/td>\u003ctd>Black water and fog\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#frostfell\" data-to=\"frostfell\">Frostfell\u003c/a>\u003c/td>\u003ctd>60 to 70 (Act 4)\u003c/td>\u003ctd>Tundra\u003c/td>\u003ctd>Wick's, now frozen\u003c/td>\u003ctd>Ice creeping south\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-deeps\" data-to=\"the-deeps\">The Deeps\u003c/a>\u003c/td>\u003ctd>various\u003c/td>\u003ctd>Caves, used as dungeons\u003c/td>\u003ctd>none\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-hollow-heart\" data-to=\"the-hollow-heart\">The Hollow Heart\u003c/a>\u003c/td>\u003ctd>65 to 75\u003c/td>\u003ctd>The main story's final area, deep under Heartvale\u003c/td>\u003ctd>none\u003c/td>\u003ctd>It's the source\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-sundered-crown\" data-to=\"the-sundered-crown\">The Sundered Crown\u003c/a>\u003c/td>\u003ctd>75+\u003c/td>\u003ctd>The endgame: the ruins of \u003ca href=\"#whitestone\" data-to=\"whitestone\">Whitestone\u003c/a>, the old capital, in the far west\u003c/td>\u003ctd>none\u003c/td>\u003ctd>Glass, ash and broken stone\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>For what each region is home to, see \u003ca href=\"#resources-by-region\" data-to=\"resources-by-region\">Resources by region\u003c/a>. Only Heartvale (with Emberhold and the edge of the Thornwood) is in the game so far.\u003c/p>","src":["wiki/pages/embervale.md"],"w":true,"r":false},{"s":"emberwardens","t":"Emberwardens","c":"Factions","i":"🏰","sum":"The six Emberguard leaders who each keep a region's great shrine, carrying the old Circle names as titles.","a":["Emberwarden","Lightwardens"],"ib":[],"h":"\u003cp>The six \u003cb>Emberwardens\u003c/b> each keep a region's great shrine, and each gives the player a quest chain in Acts 2 and 3, ending in a trial (see \u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a>). In Act 4 the player hunts all six down. Each carries the name of the \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">Ember Circle\u003c/a> member who first raised that shrine. Everyone believes the names are titles, handed down from warden to warden since the Circle passed into legend.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Emberwarden\u003c/th>\u003cth>Region\u003c/th>\u003cth>🔒 Who they really are\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Warden Crowe\u003c/td>\u003ctd>\u003ca href=\"#the-thornwood\" data-to=\"the-thornwood\">The Thornwood\u003c/a>\u003c/td>\u003ctd>Crowe of the Circle\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Warden Flint\u003c/td>\u003ctd>\u003ca href=\"#greyspine-peaks\" data-to=\"greyspine-peaks\">Greyspine Peaks\u003c/a>\u003c/td>\u003ctd>Flint of the Circle\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Warden Ivy\u003c/td>\u003ctd>\u003ca href=\"#the-tangle\" data-to=\"the-tangle\">The Tangle\u003c/a>\u003c/td>\u003ctd>An impostor. The real Ivy died in the Sundering War\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Warden Merrow\u003c/td>\u003ctd>\u003ca href=\"#saltmere-coast\" data-to=\"saltmere-coast\">Saltmere Coast\u003c/a>\u003c/td>\u003ctd>Merrow of the Circle\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Warden Dunn\u003c/td>\u003ctd>\u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a>\u003c/td>\u003ctd>Dunn of the Circle\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Warden Reed\u003c/td>\u003ctd>\u003ca href=\"#blackfen\" data-to=\"blackfen\">Blackfen\u003c/a>\u003c/td>\u003ctd>An impostor. The real Reed died in the Sundering War\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ca href=\"#the-heart-shrine\" data-to=\"the-heart-shrine\">The Heart Shrine\u003c/a> in Heartvale is kept by the Emberguard's High Keeper. \u003ca href=\"#frostfell\" data-to=\"frostfell\">Frostfell\u003c/a>'s shrine is frozen, and has no warden.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>All six are \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>. Four are the original Circle members who sided with \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a> in the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>. The other two were chosen by Vale from the most corrupt of the Emberguard and Emberborn to take the dead members' names and shrines. Nobody outside the Undying knows.\u003c/p>\n\u003cp>They collect anything with ember in it: every glowing fish was taken from Warden Merrow's feast before cooking, and Warden Flint's emberstone carts to the Emberhall don't add up.\u003c/p>\u003c/div>\n\u003cp>None of them are in the game yet.\u003c/p>","src":["wiki/pages/emberwardens.md"],"w":true,"r":false},{"s":"empty-vials","t":"Empty vials","c":"Items","i":"🫙","sum":"Materials and food. Sells for 2 bronze.","a":["empty vial"],"ib":[["Kind","Materials and food"],["Shop pays","2 bronze"],["Game id","\u003ccode>vial\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">Alchemist Moss\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#a-drop-of-something\" data-to=\"a-drop-of-something\">A drop of something\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"enchanter-vale","t":"Enchanter Vale","c":"People","i":"✨","sum":"The gentle enchanter in the Emberhall, named after the great Archmage.","a":[],"ib":[["Found in","The Emberhall"],["Game id","\u003ccode>vale\u003c/code>"]],"h":"\u003cp>\u003cb>Enchanter Vale\u003c/b> is the gentle enchanter in \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>. People say he was named after the great \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a>. He never lets anyone touch his staff.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>He \u003cb>is\u003c/b> Archmage Vale, over 800 years old, the man who murdered \u003ca href=\"#king-aldemar-xviii\" data-to=\"king-aldemar-xviii\">King Aldemar XVIII\u003c/a>, hiding in plain sight. He's also the hooded High Keeper who leads \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>. Half of the \u003ca href=\"#ember-crown\" data-to=\"ember-crown\">Ember Crown\u003c/a> is set in his staff.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;Hm? Oh, a new spark. How bright you are. Come back when you know a little magic.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>.\u003c/p>","src":["wiki/pages/person-vale.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"enchanting","t":"Enchanting","c":"Skills","i":"✨","sum":"Use the enchanting altar in the Mages' Guild: a refined emberstone with ember in it adds magic to a staff, a piece of armor or a tool. Archmage Rowan teaches it.","a":[],"ib":[["Discipline","🔮 Wisdom"],["Taught by","\u003ca href=\"#archmage-rowan\" data-to=\"archmage-rowan\">Archmage Rowan\u003c/a>"],["Max level","99"]],"h":"\u003cp>✨ \u003cb>Enchanting\u003c/b> is a skill in \u003ca href=\"#wisdom\" data-to=\"wisdom\">Wisdom\u003c/a>. Use the enchanting altar in the Mages' Guild: a refined emberstone with ember in it adds magic to a staff, a piece of armor or a tool. Archmage Rowan teaches it.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#sparks-and-spells\" data-to=\"sparks-and-spells\">Sparks and spells\u003c/a>, from \u003ca href=\"#archmage-rowan\" data-to=\"archmage-rowan\">Archmage Rowan\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 1 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>➕ Second slot\u003c/td>\u003ctd>a second enchantment\u003c/td>\u003c/tr>\u003ctr>\u003ctd>💥 Potency\u003c/td>\u003ctd>10% stronger enchantments\u003c/td>\u003c/tr>\u003ctr>\u003ctd>♻️ Re-enchant\u003c/td>\u003ctd>enchant again after taking one off\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Enchantments you can put on things at the altar in the Mages' Guild, using a refined emberstone with ember in it (trap ember with \u003ca href=\"#ember-trap\" data-to=\"ember-trap\">Ember trap\u003c/a>). Staff enchantments also need a cut gem of the right kind.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Enchantment\u003c/th>\u003cth>Goes on\u003c/th>\u003cth>Gem\u003c/th>\u003cth>Does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🔥 Fire\u003c/td>\u003ctd>staff\u003c/td>\u003ctd>Ruby\u003c/td>\u003ctd>bolts burn for +5 damage, +4 hit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>❄️ Frost\u003c/td>\u003ctd>staff\u003c/td>\u003ctd>Sapphire\u003c/td>\u003ctd>bolts slow the monster for 4.8s, +4 hit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>☠️ Poison\u003c/td>\u003ctd>staff\u003c/td>\u003ctd>Emerald\u003c/td>\u003ctd>bolts poison for 3 damage 4 times, +4 hit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>⚡ Lightning\u003c/td>\u003ctd>staff\u003c/td>\u003ctd>Topaz\u003c/td>\u003ctd>bolts jump to a second monster for 60% damage, +4 hit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🩸 Life steal\u003c/td>\u003ctd>staff\u003c/td>\u003ctd>Amethyst\u003c/td>\u003ctd>bolts heal you 34% of the damage, +4 hit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>❤️ Vitality\u003c/td>\u003ctd>armor\u003c/td>\u003ctd>—\u003c/td>\u003ctd>+10 max health\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🔮 Mana flow\u003c/td>\u003ctd>armor\u003c/td>\u003ctd>—\u003c/td>\u003ctd>mana comes back 20% faster\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🛡️ Guard\u003c/td>\u003ctd>armor\u003c/td>\u003ctd>—\u003c/td>\u003ctd>7% less damage\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🌵 Thorns\u003c/td>\u003ctd>armor\u003c/td>\u003ctd>—\u003c/td>\u003ctd>monsters that hit you take 4 damage\u003c/td>\u003c/tr>\u003ctr>\u003ctd>⏩ Swiftness\u003c/td>\u003ctd>tool (gathering only)\u003c/td>\u003ctd>—\u003c/td>\u003ctd>20% faster gathering\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍀 Bounty\u003c/td>\u003ctd>tool\u003c/td>\u003ctd>—\u003c/td>\u003ctd>10% chance of an extra one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪶 Tireless\u003c/td>\u003ctd>tool\u003c/td>\u003ctd>—\u003c/td>\u003ctd>20% chance it costs no stamina\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📖 Wisdom\u003c/td>\u003ctd>tool\u003c/td>\u003ctd>—\u003c/td>\u003ctd>+10% XP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The numbers shown are for power 20 and a 3 carat gem.\u003c/p>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts","shared/enchanting.ts"],"w":false,"r":false},{"s":"endurance","t":"Endurance","c":"Skills","i":"🌿","sum":"Gathering from the wild. Raises your max stamina.","a":[],"ib":[["Kind","Discipline"],["Skills","Fishing, Woodcutting, Mining, Foraging, Farming, Hunting"]],"h":"\u003cp>🌿 \u003cb>Endurance\u003c/b> is one of the five \u003ca href=\"#disciplines\" data-to=\"disciplines\">Disciplines\u003c/a>. Gathering from the wild. Raises your max stamina. Its level is the average of the levels of its skills you've learned, rounded down.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Skill\u003c/th>\u003cth>What it is\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🎣 \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a>\u003c/td>\u003ctd>Click the water's edge to fish.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪓 \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a>\u003c/td>\u003ctd>Click a tree to chop logs.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>⛏️ \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a>\u003c/td>\u003ctd>Click a rock to mine ore.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🌱 \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a>\u003c/td>\u003ctd>Click a glinting dig patch to dig it up with a shovel: roots, mushrooms, worms, herbs, old bones, truffles, and moonpetal at night. Herbalist Wren teaches it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🌾 \u003ca href=\"#farming\" data-to=\"farming\">Farming\u003c/a>\u003c/td>\u003ctd>Buy a plot at the farm (east of the island, over the second bridge) from Farmer Odo, plant his seeds, and come back to harvest. Crops grow even while you're logged out. Farmer Odo teaches it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐾 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a>\u003c/td>\u003ctd>Trained by defeating monsters. Everyone who hurt it shares the XP by how much damage they did. Higher Hunting makes monsters drop things more often.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/stats.ts"],"w":false,"r":false},{"s":"farmer-odo","t":"Farmer Odo","c":"People","i":"🌾","sum":"Teaches Farming. His fields stay green.","a":[],"ib":[["Found in","Emberhold"],["Shop","Yes"],["Game id","\u003ccode>odo\u003c/code>"]],"h":"\u003cp>\u003cb>Farmer Odo\u003c/b> teaches \u003ca href=\"#farming\" data-to=\"farming\">Farming\u003c/a> and sells seeds and plots at the farm east of town. He won't take blessings: in his gran's day one lasted a season, and now it barely lasts a week. &quot;The shrines have less to give every year. I'd rather not lean on 'em.&quot; (\u003ca href=\"#odos-stubborn-field\" data-to=\"odos-stubborn-field\">Odo's Stubborn Field\u003c/a>) He keeps a jar of seed from before the Emberfall.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;Seeds for sale, and land if you want it. Everyone's crops grow while they sleep!&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#something-to-grow\" data-to=\"something-to-grow\">Something to grow\u003c/a> (lessons)\u003c/li>\u003cli>\u003ca href=\"#odos-stubborn-field\" data-to=\"odos-stubborn-field\">Odo's Stubborn Field\u003c/a> (Act 1)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Shop:\u003c/b> buys seeds, potatoes, carrots, onions and wheat. Sells: \u003ca href=\"#seed-potatoes\" data-to=\"seed-potatoes\">Seed potatoes\u003c/a>, \u003ca href=\"#carrot-seeds\" data-to=\"carrot-seeds\">Carrot seeds\u003c/a>, \u003ca href=\"#onion-sets\" data-to=\"onion-sets\">Onion sets\u003c/a>, \u003ca href=\"#wheat-seeds\" data-to=\"wheat-seeds\">Wheat seeds\u003c/a>, \u003ca href=\"#ginseng-seeds\" data-to=\"ginseng-seeds\">Ginseng seeds\u003c/a>, \u003ca href=\"#blue-lotus-seeds\" data-to=\"blue-lotus-seeds\">Blue lotus seeds\u003c/a>. See \u003ca href=\"#shops\" data-to=\"shops\">Shops\u003c/a>.\u003c/p>","src":["wiki/pages/person-odo.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"farming","t":"Farming","c":"Skills","i":"🌾","sum":"Buy a plot at the farm (east of the island, over the second bridge) from Farmer Odo, plant his seeds, and come back to harvest. Crops grow even while you're logged out. Farmer Odo teaches it.","a":[],"ib":[["Discipline","🌿 Endurance"],["Taught by","\u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>"],["Max level","99"]],"h":"\u003cp>🌾 \u003cb>Farming\u003c/b> is a skill in \u003ca href=\"#endurance\" data-to=\"endurance\">Endurance\u003c/a>. Buy a plot at the farm (east of the island, over the second bridge) from Farmer Odo, plant his seeds, and come back to harvest. Crops grow even while you're logged out. Farmer Odo teaches it.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#something-to-grow\" data-to=\"something-to-grow\">Something to grow\u003c/a>, from \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🌱 Green thumb\u003c/td>\u003ctd>crops ripen 5% sooner\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍀 Bumper crop\u003c/td>\u003ctd>5% chance of an extra one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪶 Light work\u003c/td>\u003ctd>10% chance it costs no stamina\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>See \u003ca href=\"#crops\" data-to=\"crops\">Crops\u003c/a> for what grows, and how long it takes.\u003c/p>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"feathers","t":"Feathers","c":"Items","i":"🪶","sum":"Monster drop. Sells for 1 bronze.","a":["feather"],"ib":[["Kind","Monster drops"],["Shop pays","1 bronze"],["Game id","\u003ccode>feather\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#chicken\" data-to=\"chicken\">Chicken\u003c/a> (60%).\u003c/li>\u003cli>Sold by \u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#glow-bait\" data-to=\"glow-bait\">Glow bait\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"firebolt","t":"Firebolt","c":"Spells","i":"🔥","sum":"A bolt of flame from your staff.","a":[],"ib":[["Spellcasting level","1"],["Mana","4"],["Kind","Bolt (from a staff)"],["Learned from","Levelling up"]],"h":"\u003cp>🔥 A bolt of flame from your staff.\u003c/p>\n\u003cp>It needs \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a> level 1 and costs 4 mana at Mastery 1 (Mastery lowers the cost). Its biggest hit is 4, plus your staff's bonus.\u003c/p>","src":["shared/combat.ts","shared/spells.ts"],"w":false,"r":false},{"s":"fishing","t":"Fishing","c":"Skills","i":"🎣","sum":"Click the water's edge to fish.","a":[],"ib":[["Discipline","🌿 Endurance"],["Taught by","\u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>"],["Max level","99"]],"h":"\u003cp>🎣 \u003cb>Fishing\u003c/b> is a skill in \u003ca href=\"#endurance\" data-to=\"endurance\">Endurance\u003c/a>. Click the water's edge to fish.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#living-off-the-land\" data-to=\"living-off-the-land\">Living off the land\u003c/a>, from \u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>⏩ Quick hands\u003c/td>\u003ctd>5% faster\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍀 Lucky find\u003c/td>\u003ctd>4% chance of an extra one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📖 Quick learner\u003c/td>\u003ctd>10% more XP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-what-you-can-gather\">What you can gather\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>From\u003c/th>\u003cth>Gives\u003c/th>\u003cth>XP\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Shallow water\u003c/td>\u003ctd>\u003ca href=\"#minnow\" data-to=\"minnow\">Minnow\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Trout spot\u003c/td>\u003ctd>\u003ca href=\"#trout\" data-to=\"trout\">Trout\u003c/a>\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>Perch spot\u003c/td>\u003ctd>\u003ca href=\"#perch\" data-to=\"perch\">Perch\u003c/a>\u003c/td>\u003ctd>6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20\u003c/td>\u003ctd>Salmon spot\u003c/td>\u003ctd>\u003ca href=\"#salmon\" data-to=\"salmon\">Salmon\u003c/a>\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>30\u003c/td>\u003ctd>Pike spot\u003c/td>\u003ctd>\u003ca href=\"#pike\" data-to=\"pike\">Pike\u003c/a>\u003c/td>\u003ctd>15\u003c/td>\u003c/tr>\u003ctr>\u003ctd>45\u003c/td>\u003ctd>Tuna spot\u003c/td>\u003ctd>\u003ca href=\"#tuna\" data-to=\"tuna\">Tuna\u003c/a>\u003c/td>\u003ctd>24\u003c/td>\u003c/tr>\u003ctr>\u003ctd>60\u003c/td>\u003ctd>Swordfish spot\u003c/td>\u003ctd>\u003ca href=\"#swordfish\" data-to=\"swordfish\">Swordfish\u003c/a>\u003c/td>\u003ctd>36\u003c/td>\u003c/tr>\u003ctr>\u003ctd>75\u003c/td>\u003ctd>Eel spot\u003c/td>\u003ctd>\u003ca href=\"#eel\" data-to=\"eel\">Eel\u003c/a>\u003c/td>\u003ctd>50\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"fishing-rod","t":"Fishing rod","c":"Items","i":"🎣","sum":"A tool for Fishing.","a":[],"ib":[["Helps","Fishing"],["Effect","Faster"]],"h":"\u003cp>The fishing rod helps \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a>: you gather faster. Better metal and better wood make it stronger and last longer. See \u003ca href=\"#tools\" data-to=\"tools\">Tools\u003c/a> for every metal and wood. Smiths make them at the anvil with \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>.\u003c/p>","src":["shared/tools.ts"],"w":false,"r":false},{"s":"folded-note","t":"Folde
