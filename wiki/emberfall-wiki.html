 pays","3 bronze"],["Game id","\u003ccode>minnow\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a> level 1 from a shallow water (2 XP each).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (fish): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"mithril-bar","t":"Mithril bar","c":"Items","i":"🧈","sum":"Bar. Sells for 172 bronze.","a":[],"ib":[["Kind","Bars"],["Shop pays","172 bronze"],["Game id","\u003ccode>mithril_bar\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#mithril-ore\" data-to=\"mithril-ore\">Mithril ore\u003c/a>, \u003ca href=\"#coal\" data-to=\"coal\">Coal\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"mithril-ore","t":"Mithril ore","c":"Items","i":"🪨","sum":"Ore. Sells for 120 bronze.","a":[],"ib":[["Kind","Ore"],["Shop pays","120 bronze"],["Game id","\u003ccode>mithril_ore\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a> level 70 from a mithril rock (45 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#mithril-bar\" data-to=\"mithril-bar\">Mithril bar\u003c/a>.\u003c/li>\u003cli>Smelted into \u003ca href=\"#mithril-bar\" data-to=\"mithril-bar\">Mithril bar\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"money","t":"Money","c":"Mechanics","i":"🪙","sum":"Coins, from bronze up to iridium.","a":[],"ib":[],"h":"\u003cp>Coins come in 5 kinds: bronze, silver, gold, platinum, iridium. Each is worth 100 of the one below it (100 bronze = 1 silver, 100 silver = 1 gold, and so on).\u003c/p>","src":["shared/money.ts"],"w":false,"r":false},{"s":"monsters","t":"Monsters","c":"Monsters","i":"🐺","sum":"Every monster in the game.","a":[],"ib":[],"h":"\u003cp>Every monster in the game today, from the code. Monsters wander a few tiles from home, chase you for a while, then give up and go home.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Monster\u003c/th>\u003cth>Level\u003c/th>\u003cth>Health\u003c/th>\u003cth>Biggest hit\u003c/th>\u003cth>Temper\u003c/th>\u003cth>Where\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🐔 \u003ca href=\"#chicken\" data-to=\"chicken\">Chicken\u003c/a>\u003c/td>\u003ctd>1\u003c/td>\u003ctd>4\u003c/td>\u003ctd>0\u003c/td>\u003ctd>Never fights back\u003c/td>\u003ctd>Heartvale, near the Emberhall; Heartvale, near the lake; The Thornwood, near Ashbound camp\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐀 \u003ca href=\"#rat\" data-to=\"rat\">Rat\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003ctd>6\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Fights back if you hit it\u003c/td>\u003ctd>Heartvale, near Quarry; The Thornwood, near Ashbound camp; The old mine\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐄 \u003ca href=\"#cow\" data-to=\"cow\">Cow\u003c/a>\u003c/td>\u003ctd>3\u003c/td>\u003ctd>12\u003c/td>\u003ctd>0\u003c/td>\u003ctd>Never fights back\u003c/td>\u003ctd>Heartvale, near Pasture\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🟢 \u003ca href=\"#slime\" data-to=\"slime\">Slime\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003ctd>8\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Fights back if you hit it\u003c/td>\u003ctd>Heartvale, near the lake; Heartvale, near the Emberhall\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐗 \u003ca href=\"#boar\" data-to=\"boar\">Boar\u003c/a>\u003c/td>\u003ctd>7\u003c/td>\u003ctd>22\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Fights back if you hit it\u003c/td>\u003ctd>Heartvale, near Pasture\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🦇 \u003ca href=\"#giant-bat\" data-to=\"giant-bat\">Giant bat\u003c/a>\u003c/td>\u003ctd>6\u003c/td>\u003ctd>14\u003c/td>\u003ctd>2\u003c/td>\u003ctd>Attacks on sight, night only\u003c/td>\u003ctd>Heartvale, near the lake; Heartvale, near the Emberhall; Heartvale, near Pasture; The Thornwood, near Graveyard; The Thornwood\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐺 \u003ca href=\"#wolf\" data-to=\"wolf\">Wolf\u003c/a>\u003c/td>\u003ctd>8\u003c/td>\u003ctd>20\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Attacks on sight, pack\u003c/td>\u003ctd>The Thornwood; The wolf den\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🕷️ \u003ca href=\"#cave-spider\" data-to=\"cave-spider\">Cave spider\u003c/a>\u003c/td>\u003ctd>14\u003c/td>\u003ctd>34\u003c/td>\u003ctd>5\u003c/td>\u003ctd>Attacks on sight\u003c/td>\u003ctd>The spider cave\u003c/td>\u003c/tr>\u003ctr>\u003ctd>👺 \u003ca href=\"#goblin\" data-to=\"goblin\">Goblin\u003c/a>\u003c/td>\u003ctd>12\u003c/td>\u003ctd>30\u003c/td>\u003ctd>4\u003c/td>\u003ctd>Attacks on sight\u003c/td>\u003ctd>The Thornwood, near Goblin camp\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🕷️ \u003ca href=\"#giant-spider\" data-to=\"giant-spider\">Giant spider\u003c/a>\u003c/td>\u003ctd>18\u003c/td>\u003ctd>42\u003c/td>\u003ctd>6\u003c/td>\u003ctd>Attacks on sight\u003c/td>\u003ctd>The Thornwood, near Spider hollow\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐺 \u003ca href=\"#alpha-wolf\" data-to=\"alpha-wolf\">Alpha wolf\u003c/a>\u003c/td>\u003ctd>22\u003c/td>\u003ctd>160\u003c/td>\u003ctd>9\u003c/td>\u003ctd>Attacks on sight, pack\u003c/td>\u003ctd>The wolf den\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🥷 \u003ca href=\"#ashbound-scout\" data-to=\"ashbound-scout\">Ashbound scout\u003c/a>\u003c/td>\u003ctd>9\u003c/td>\u003ctd>24\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Fights back if you hit it\u003c/td>\u003ctd>Heartvale, near To the Barrens (closed)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐺 \u003ca href=\"#hollow-wolf\" data-to=\"hollow-wolf\">Hollow wolf\u003c/a>\u003c/td>\u003ctd>13\u003c/td>\u003ctd>32\u003c/td>\u003ctd>4\u003c/td>\u003ctd>Attacks on sight, pack\u003c/td>\u003ctd>The Thornwood, near Wolf Hollow\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🦹 \u003ca href=\"#ashbound-raider\" data-to=\"ashbound-raider\">Ashbound raider\u003c/a>\u003c/td>\u003ctd>25\u003c/td>\u003ctd>60\u003c/td>\u003ctd>8\u003c/td>\u003ctd>Attacks on sight\u003c/td>\u003ctd>The Thornwood, near Ashbound camp\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Monsters wander up to 3 tiles from home, notice you within 4 tiles (if they attack on sight), and give up the chase 8 tiles from home.\u003c/p>\n\u003cp>See also \u003ca href=\"#combat\" data-to=\"combat\">Combat\u003c/a>, \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and \u003ca href=\"#the-blight\" data-to=\"the-blight\">The Blight\u003c/a>.\u003c/p>","src":["shared/combat.ts"],"w":false,"r":false},{"s":"moonpetal","t":"Moonpetal","c":"Items","i":"🌼","sum":"Herbs, roots and crop. Sells for 14 bronze.","a":[],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","14 bronze"],["Game id","\u003ccode>moonpetal\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dug up with \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> level 10, only at night (9 XP).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Half of the recipe for the \u003ca href=\"#night-sight-potion\" data-to=\"night-sight-potion\">Night sight potion\u003c/a>.\u003c/li>\u003cli>Half of the recipe for the \u003ca href=\"#ember-trap-potion\" data-to=\"ember-trap-potion\">Ember trap potion\u003c/a>.\u003c/li>\u003cli>A bonus third ingredient in \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a>: 60% stronger.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"mushrooms","t":"Mushrooms","c":"Items","i":"🍄","sum":"Herbs, roots and crop. Sells for 3 bronze.","a":["mushroom"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","3 bronze"],["Game id","\u003ccode>mushroom\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dug up with \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> level 3 (3 XP).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A bonus third ingredient in \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a>: also heals 10.\u003c/li>\u003cli>A cooking ingredient (vegetables): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"mysteries-and-twists","t":"Mysteries and twists","c":"Story","i":"🕵️","sum":"Each twist is hinted at early and revealed later, so a careful player can guess it first.","a":["Twists","Mysteries"],"ib":[],"h":"\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret: The whole page\u003c/div>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>The twist\u003c/th>\u003cth>Early hints\u003c/th>\u003cth>Revealed in\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>The Withering isn't bad luck, and the shrines aren't failing. Something is drinking from them.\u003c/td>\u003ctd>Holt's count: trees near shrines are fine, trees at the edge are dying, and the edge is moving in; Odo's blessings fade faster every year; \u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a>'s maps show a tightening ring; a relit shrine's warmth is pulled away down a thread.\u003c/td>\u003ctd>Act 1 (hinted), Act 3 (proved)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>The \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a> doesn't light new heroes. It drains champions into Vale.\u003c/td>\u003ctd>Old champions &quot;feel the Fading&quot; suspiciously early; &quot;spark flawed&quot; in the Ceremony calendar; Tilda's cairn: &quot;Don't go down the stair.&quot;\u003c/td>\u003ctd>Act 2 (hinted), end of Act 3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>The Emberguard's leaders are the old \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">Ember Circle\u003c/a>, alive as \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>.\u003c/td>\u003ctd>&quot;THE FLAME EATS&quot; painted on a wall; the Tithe mark; Emberwardens who carry the same names as the Circle.\u003c/td>\u003ctd>End of Act 3, from Wick\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Two of the \u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwardens\u003c/a>, Ivy and Reed, are impostors. The real ones died on Wick's side.\u003c/td>\u003ctd>Warden Ivy doesn't know an old Tangle song every child there knows; the Blackfen shrine's carving uses a name Warden Reed doesn't answer to.\u003c/td>\u003ctd>Act 3 (hinted), Act 4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>\u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a> didn't cause the Emberfall, and he's behind \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>.\u003c/td>\u003ctd>The unscratched names on the frozen shrine; an old account of the working that never blames him; Rook's note &quot;The W was never his crime.&quot;\u003c/td>\u003ctd>End of Act 3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>\u003ca href=\"#enchanter-vale\" data-to=\"enchanter-vale\">Enchanter Vale\u003c/a> is \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a>.\u003c/td>\u003ctd>&quot;Named after the Archmage&quot;; &quot;older than the Guild&quot;; no one knows where Vale is buried.\u003c/td>\u003ctd>The Joining, end of Act 3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>Vale killed \u003ca href=\"#king-aldemar-xviii\" data-to=\"king-aldemar-xviii\">King Aldemar XVIII\u003c/a>, and nobody, not even the Circle, knows.\u003c/td>\u003ctd>The \u003ci>Old Shaft\u003c/i> Memory Echo; half a crown in Vale's staff.\u003c/td>\u003ctd>Endgame\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>\u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a> is losing its warmth, and the land far from the shrines is going cold.\u003c/td>\u003ctd>The Crystal Cave's rock is colder than it was; Frostfell's ice moves south.\u003c/td>\u003ctd>Act 4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>The \u003ca href=\"#ember-seed\" data-to=\"ember-seed\">Ember Seed\u003c/a> could heal the land, and let Emberborn live without the shrines.\u003c/td>\u003ctd>Odo's old seed jar; Aldmeran coins show a seed.\u003c/td>\u003ctd>Endgame\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>The \u003ca href=\"#ember-crown\" data-to=\"ember-crown\">Ember Crown\u003c/a> is in two halves; one is in Vale's staff.\u003c/td>\u003ctd>Vale never lets anyone touch his staff.\u003c/td>\u003ctd>End of Act 4\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>","src":["wiki/pages/twists.md"],"w":true,"r":false},{"s":"names","t":"Names","c":"Wiki","i":"🏷️","sum":"Old names from earlier versions of the game, and the names everything uses now.","a":[],"ib":[],"h":"\u003cp>The game and the wiki both use the lore bible's names. Until version 0.10 the game had some older names, listed here so old notes and bug reports still make sense. When the wiki renames something before the game does (like the Radiants, now the Extinguished), or an old name slips back into the game's text, the wiki swaps it for the new one, and the page it's on says so at the bottom.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Old name\u003c/th>\u003cth>Name now\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Lightkeepers'\u003c/td>\u003ctd>Emberguard's\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lightkeepers\u003c/td>\u003ctd>Emberguard\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lightkeeper\u003c/td>\u003ctd>Emberguard\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lightwardens\u003c/td>\u003ctd>Emberwarden\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Kindled\u003c/td>\u003ctd>Emberborn\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Elderra\u003c/td>\u003ctd>Embervale\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Wellspring\u003c/td>\u003ctd>Emberheart\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Aurelite\u003c/td>\u003ctd>Embersteel\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Crown of Aurel\u003c/td>\u003ctd>Ember Crown\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Aurel Seed\u003c/td>\u003ctd>Ember Seed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>the kingdom of Aurel\u003c/td>\u003ctd>the Old Kingdom\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Aurel's\u003c/td>\u003ctd>the Old Kingdom's\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Aurel\u003c/td>\u003ctd>the Old Kingdom\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Vael\u003c/td>\u003ctd>Vale\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ysolde\u003c/td>\u003ctd>Rowan\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ysra\u003c/td>\u003ctd>Ida\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lighthall\u003c/td>\u003ctd>Emberhall\u003c/td>\u003c/tr>\u003ctr>\u003ctd>the Radiants\u003c/td>\u003ctd>the Extinguished\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Radiants\u003c/td>\u003ctd>Extinguished\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Soul gems\u003c/td>\u003ctd>Refined emberstones\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Soul gem\u003c/td>\u003ctd>Refined emberstone\u003c/td>\u003c/tr>\u003ctr>\u003ctd>soul gems\u003c/td>\u003ctd>refined emberstones\u003c/td>\u003c/tr>\u003ctr>\u003ctd>soul gem\u003c/td>\u003ctd>refined emberstone\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Soul trap\u003c/td>\u003ctd>Ember trap\u003c/td>\u003c/tr>\u003ctr>\u003ctd>soul trap\u003c/td>\u003ctd>ember trap\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Soul Debt\u003c/td>\u003ctd>Ember Debt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Souls\u003c/td>\u003ctd>Ember\u003c/td>\u003c/tr>\u003ctr>\u003ctd>souls\u003c/td>\u003ctd>ember\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Ids inside the code (like \u003ccode>lighthall\u003c/code> or \u003ccode>soul_trap\u003c/code>) keep their old spelling so saved games keep working. Players never see them.\u003c/p>","src":["wiki/build.ts"],"w":false,"r":false},{"s":"night-sight-potion","t":"Night sight potion","c":"Items","i":"🧪","sum":"You see clearly at night, for a while.","a":[],"ib":[["Alchemy level","20"],["Ingredients","Moonpetal + Blue lotus"],["XP","26"],["First tries work","45%"]],"h":"\u003cp>You see clearly at night, for a while. Brew it with \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> level 20 from \u003ca href=\"#moonpetal\" data-to=\"moonpetal\">Moonpetal\u003c/a> and \u003ca href=\"#blue-lotus\" data-to=\"blue-lotus\">Blue lotus\u003c/a> in a vial. See \u003ca href=\"#potions\" data-to=\"potions\">Potions\u003c/a>.\u003c/p>","src":["shared/alchemy.ts"],"w":false,"r":false},{"s":"oak-logs","t":"Oak logs","c":"Items","i":"🪵","sum":"Log. Sells for 3 bronze.","a":["oak log"],"ib":[["Kind","Logs"],["Shop pays","3 bronze"],["Game id","\u003ccode>oak_logs\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a> level 5 from a oak tree (3 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Used for tool handles, bows, staffs and arrows, and burned as cooking fuel.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"oath-of-the-flame","t":"Oath of the Flame","c":"Quests","i":"📜","sum":"Prologue from Keeper Aldric.","a":[],"ib":[["Part of","Prologue"],["Given by","Keeper Aldric"],["Where","in the Emberhall, the great white temple on Ember Hill, in the middle of Emberhold"],["Steps","3"]],"h":"\u003cp>\u003cb>Oath of the Flame\u003c/b> is part of the Prologue from \u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>, found in the Emberhall, the great white temple on Ember Hill, in the middle of Emberhold.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#a-blessing\" data-to=\"a-blessing\">A Blessing\u003c/a>, \u003ca href=\"#living-off-the-land\" data-to=\"living-off-the-land\">Living off the land\u003c/a>, \u003ca href=\"#buying-and-selling\" data-to=\"buying-and-selling\">Buying and selling\u003c/a>, \u003ca href=\"#the-woodcutters-start\" data-to=\"the-woodcutters-start\">The woodcutter's start\u003c/a>, \u003ca href=\"#into-the-rocks\" data-to=\"into-the-rocks\">Into the rocks\u003c/a>, \u003ca href=\"#hammer-and-fire\" data-to=\"hammer-and-fire\">Hammer and fire\u003c/a>, \u003ca href=\"#handy-work\" data-to=\"handy-work\">Handy work\u003c/a>, \u003ca href=\"#standing-your-ground\" data-to=\"standing-your-ground\">Standing your ground\u003c/a>, \u003ca href=\"#what-the-ground-gives\" data-to=\"what-the-ground-gives\">What the ground gives\u003c/a>, \u003ca href=\"#sparks-and-spells\" data-to=\"sparks-and-spells\">Sparks and spells\u003c/a>, \u003ca href=\"#a-drop-of-something\" data-to=\"a-drop-of-something\">A drop of something\u003c/a>, \u003ca href=\"#odd-jobs\" data-to=\"odd-jobs\">Odd jobs\u003c/a>, \u003ca href=\"#something-to-grow\" data-to=\"something-to-grow\">Something to grow\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-keeper-aldric\">Step 1: Talk to Keeper Aldric\u003c/h3>\n\u003cp>\u003cb>Keeper Aldric:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>You've learned so much, friend. It's time.\u003c/p>\u003cp>Every Emberborn who means to stay swears the Oath of the Flame at the Heart Shrine, so the shrine knows you, and can always bring you home.\u003c/p>\u003cp>Go and stand before the shrine, and put your hand in its flame. Don't be afraid: it won't burn you.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-step-2-swear-the-oath-at-the-heart-shrine\">Step 2: Swear the Oath at the Heart Shrine\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> The Heart Shrine is at the top of the hall, on the golden floor. Click it.\u003c/li>\u003c/ul>\n\u003cp>\u003cb>What they say when you visit:\u003c/b>\u003c/p>\n\u003cul>\u003cli>The Heart Shrine: You put your hand in the flame. It's warm, not hot. &quot;I am Emberborn. I carry the flame. Where I fall, the Emberheart will raise me.&quot; The flame flares white. For a moment you feel a tug deep in your chest, like a thread pulled tight. Then it's gone, and you feel warm all over.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-3-go-back-to-keeper-aldric\">Step 3: Go back to Keeper Aldric\u003c/h3>\n\u003cp>\u003cb>Keeper Aldric:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>It knows you now. Welcome, Ember of the Emberhall!\u003c/p>\u003cp>Wear this cloak with pride: everyone in Emberhold will know you're one of us. And here's your first silver.\u003c/p>\u003cp>Oh, one thing. Now that the shrine knows you, falling has a small cost: the shrine takes a little tithe to raise you. Nothing to worry about. I'll explain when it matters.\u003c/p>\u003cp>Come and see me when you're ready for real work. There's a lot to do.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> 1 silver.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> 1 silver.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#a-blessing\" data-to=\"a-blessing\">A Blessing\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#lantern-rounds\" data-to=\"lantern-rounds\">Lantern Rounds\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"odd-jobs","t":"Odd jobs","c":"Quests","i":"📜","sum":"Lessons from Captain Bryn.","a":[],"ib":[["Part of","Lessons"],["Given by","Captain Bryn"],["Where","by the bounty board in Market Square"],["Steps","4"]],"h":"\u003cp>\u003cb>Odd jobs\u003c/b> is a lesson from \u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">Captain Bryn\u003c/a>, found by the bounty board in Market Square.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#buying-and-selling\" data-to=\"buying-and-selling\">Buying and selling\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-captain-bryn-by-the-bounty-board\">Step 1: Talk to Captain Bryn by the bounty board\u003c/h3>\n\u003cp>\u003cb>Captain Bryn:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Captain Bryn, at your service. I keep the bounty board. Folk pin up jobs there: bring the full amount and they pay double what a shop would, plus XP.\u003c/p>\u003cp>Every bounty you finish trains Renown, part of Charisma. The more folk know your name, the better.\u003c/p>\u003cp>Open the 📜 Quests tab, bottom right. It shows your lessons and every bounty on the board. Tap a bounty to track it, and it shows up next to your health.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> the \u003ca href=\"#renown\" data-to=\"renown\">Renown\u003c/a> skill.\u003c/p>\n\u003ch3 id=\"s-step-2-track-a-bounty-tap-quests-then-tap-a-bounty\">Step 2: Track a bounty (tap 📜 Quests, then tap a bounty)\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Tap the 📜 Quests tab at the bottom right, then tap one of the bounties in it. It'll show up next to your health.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-3-finish-a-bounty-and-hand-it-in-at-the-board\">Step 3: Finish a bounty and hand it in at the board\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Gather or make what your bounty asks for, then click the bounty board and press Hand in. Too hard? Press Refresh on the board for new ones.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-4-go-back-to-captain-bryn-for-your-reward\">Step 4: Go back to Captain Bryn for your reward\u003c/h3>\n\u003cp>\u003cb>Captain Bryn:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Your first bounty! See? Honest work, and good pay.\u003c/p>\u003cp>The board always has 5 jobs, and a new one goes up for every one you finish. Tap a quest or a bounty in the 📜 tab any time to switch what you're tracking.\u003c/p>\u003cp>You'll see Ashbound posters on the board now. The Emberhall pays for those bounties.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> 1 silver.\u003c/p>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#renown\" data-to=\"renown\">Renown\u003c/a>.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> 1 silver.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#a-drop-of-something\" data-to=\"a-drop-of-something\">A drop of something\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#something-to-grow\" data-to=\"something-to-grow\">Something to grow\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"odos-stubborn-field","t":"Odo's Stubborn Field","c":"Quests","i":"📜","sum":"Act 1 from Farmer Odo.","a":[],"ib":[["Part of","Act 1"],["Given by","Farmer Odo"],["Where","at the farm: follow the road east, over the river bridge"],["Steps","4"]],"h":"\u003cp>\u003cb>Odo's Stubborn Field\u003c/b> is part of the Act 1 from \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>, found at the farm: follow the road east, over the river bridge.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#oath-of-the-flame\" data-to=\"oath-of-the-flame\">Oath of the Flame\u003c/a>, \u003ca href=\"#something-to-grow\" data-to=\"something-to-grow\">Something to grow\u003c/a>.\u003c/p>\n\u003cdiv class=\"box note\">\u003cdiv class=\"box-label\">Planned change\u003c/div>\u003cp>Reword Odo's last line.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-farmer-odo\">Step 1: Talk to Farmer Odo\u003c/h3>\n\u003cp>\u003cb>Farmer Odo:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>You again. Come to bless my turnips? No? Then what?\u003c/p>\u003cp>Hm. You want to know why I won't take their blessings. I'll show you. Grow a crop on your plot, start to finish, with no blessing on you. Not one.\u003c/p>\u003cp>Plant 4 seeds and harvest 4 crops, unblessed. If you read a scroll, it doesn't count.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-step-2-plant-4-seeds-on-your-plot\">Step 2: Plant 4 seeds on your plot\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Click your plot's soil with seeds in your bag. I sell seeds.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-3-harvest-4-crops-with-no-blessing-on-you\">Step 3: Harvest 4 crops with no blessing on you\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Wait till they're ripe, then click them. Not while you're blessed, mind!\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-4-go-back-to-farmer-odo\">Step 4: Go back to Farmer Odo\u003c/h3>\n\u003cp>\u003cb>Farmer Odo:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Grew just fine, didn't they? No shrine needed.\u003c/p>\u003cp>In the old days, before the Emberhall, every farm grew like this. Then the shrines came, and the blessings, and the ground got tired. Funny, that.\u003c/p>\u003cp>Here: my grandmother's blue lotus seeds. Never been blessed in a hundred years. Look after them.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> 5 × \u003ca href=\"#blue-lotus-seeds\" data-to=\"blue-lotus-seeds\">Blue lotus seeds\u003c/a>, 80 Farming XP.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> 5 × \u003ca href=\"#blue-lotus-seeds\" data-to=\"blue-lotus-seeds\">Blue lotus seeds\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#what-holt-saw\" data-to=\"what-holt-saw\">What Holt Saw\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#the-hollow-wolves\" data-to=\"the-hollow-wolves\">The Hollow Wolves\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"old-bones","t":"Old bones","c":"Items","i":"🦴","sum":"Herbs, roots and crop. Sells for 6 bronze.","a":["old bone"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","6 bronze"],["Game id","\u003ccode>old_bone\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dug up with \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> level 8 (7 XP).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A bonus third ingredient in \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a>: buffs last half as long again, and 10% stronger.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"old-maren","t":"Old Maren","c":"People","i":"👵","sum":"A kindly old woman by the lake who looks after new Emberborn.","a":[],"ib":[["Found in","Emberhold"],["Game id","\u003ccode>maren\u003c/code>"]],"h":"\u003cp>\u003cb>Old Maren\u003c/b> lives in \u003ca href=\"#old-marens-cottage\" data-to=\"old-marens-cottage\">her cottage\u003c/a> by the Glass River in \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>, and teaches by the pond in the \u003ca href=\"#emberhall-training-ground\" data-to=\"emberhall-training-ground\">Emberhall Training Ground\u003c/a>. She's a kindly old woman, \u003ca href=\"#the-rooted\" data-to=\"the-rooted\">Rooted\u003c/a>, who looks out for the new \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a>: a warm meal, a bit of advice, a place to sit when the Emberhall feels too big. Everyone in town has a Maren story.\u003c/p>\n\u003cp>She is not an Emberborn. Her own story is still being decided.\u003c/p>\n\u003cp>In the game today she's the fishing and cooking teacher. That role came from the older story, and may change in Mike's next update.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>Found in \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#living-off-the-land\" data-to=\"living-off-the-land\">Living off the land\u003c/a> (lessons)\u003c/li>\u003cli>\u003ca href=\"#marens-question\" data-to=\"marens-question\">Maren's Question\u003c/a> (Act 1)\u003c/li>\u003c/ul>","src":["wiki/pages/person-maren.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"old-marens-cottage","t":"Old Maren's cottage","c":"Places","i":"🏠","sum":"","a":[],"ib":[["Kind","Indoors"],["Danger","Safe"],["Size","9 × 7 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"maren\">\u003c/figure>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"onion-sets","t":"Onion sets","c":"Items","i":"🌱","sum":"Seed. Sells for 2 bronze.","a":["onion set"],"ib":[["Kind","Seeds"],["Shop pays","2 bronze"],["Game id","\u003ccode>seed_onion\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"onions","t":"Onions","c":"Items","i":"🧅","sum":"Herbs, roots and crop. Sells for 2 bronze.","a":["onion"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","2 bronze"],["Game id","\u003ccode>onion\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Grown with \u003ca href=\"#farming\" data-to=\"farming\">Farming\u003c/a> level 8: ripe after 25 minutes, 2 to 4 a tile.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"orla-the-kind","t":"Orla the Kind","c":"People","i":"🕯️","sum":"One of the Extinguished. A healer who rose nine times through the Grey Fever, then was honoured with a Radiance Ceremony.","a":[],"ib":[],"h":"\u003cp>\u003cb>Orla the Kind\u003c/b> was one of \u003ca href=\"#the-extinguished\" data-to=\"the-extinguished\">The Extinguished\u003c/a>. Through the Grey Fever of year 760 she went from door to door nursing the sick. The fever took her nine times, and nine times the shrine sent her back to keep working. When the fever had passed, in year 761, the Emberguard honoured her with a \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a>. People remember her as a saint. In the planned quest \u003ci>Lanterns for the Dead\u003c/i>, the lantern at her statue keeps going out.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>Orla's spark isn't resting: it's trapped in an old refined emberstone. In the planned quest \u003ci>Orla's Rest\u003c/i>, you use \u003ca href=\"#ember-trap\" data-to=\"ember-trap\">Ember trap\u003c/a> to free it and carry it to \u003ca href=\"#the-graveyard\" data-to=\"the-graveyard\">The Graveyard\u003c/a>, and her lantern finally stays lit.\u003c/p>\u003c/div>","src":["wiki/pages/orla.md"],"w":true,"r":false},{"s":"parties","t":"Parties","c":"Mechanics","i":"🚩","sum":"Up to 4 players.","a":[],"ib":[],"h":"\u003cp>Click another player to invite them. A party holds up to 4. Members within 15 tiles of the leader share in kills and quest steps, and the leader trains \u003ca href=\"#leadership\" data-to=\"leadership\">Leadership\u003c/a>.\u003c/p>","src":["shared/party.ts"],"w":false,"r":false},{"s":"people-in-the-game","t":"People in the game","c":"People","i":"🧑","sum":"Everyone you can talk to in the game today.","a":[],"ib":[],"h":"\u003cp>Everyone you can talk to in the game today. The \u003ca href=\"#groups-and-people\" data-to=\"groups-and-people\">Groups and people\u003c/a> page lists the story's characters too, including ones not in the game yet.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Person\u003c/th>\u003cth>Where\u003c/th>\u003cth>Quests\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">Captain Bryn\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#the-general-store\" data-to=\"the-general-store\">The General Store\u003c/a>\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#archmage-rowan\" data-to=\"archmage-rowan\">Archmage Rowan\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">Alchemist Moss\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#repairer-oswin\" data-to=\"repairer-oswin\">Repairer Oswin\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">The Mages' Guild\u003c/a>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>\u003c/td>\u003ctd>8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#sister-celene\" data-to=\"sister-celene\">Sister Celene\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#enchanter-vale\" data-to=\"enchanter-vale\">Enchanter Vale\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#brother-oren\" data-to=\"brother-oren\">Brother Oren\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#sister-lisette\" data-to=\"sister-lisette\">Sister Lisette\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#brother-tomas\" data-to=\"brother-tomas\">Brother Tomas\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#sister-wynne\" data-to=\"sister-wynne\">Sister Wynne\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#rhys\" data-to=\"rhys\">Rhys\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Ordinary people also walk about town and the Emberhall: see \u003ca href=\"#townsfolk\" data-to=\"townsfolk\">Townsfolk\u003c/a>.\u003c/p>","src":["shared/npcs.ts"],"w":false,"r":false},{"s":"perch","t":"Perch","c":"Items","i":"🐠","sum":"Fish. Sells for 7 bronze.","a":[],"ib":[["Kind","Fish"],["Shop pays","7 bronze"],["Game id","\u003ccode>perch\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a> level 10 from a perch spot (6 XP each).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (fish): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"pickaxe","t":"Pickaxe","c":"Items","i":"⛏️","sum":"A tool for Mining.","a":[],"ib":[["Helps","Mining"],["Effect","Faster"]],"h":"\u003cp>The pickaxe helps \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a>: you gather faster. Better metal and better wood make it stronger and last longer. See \u003ca href=\"#tools\" data-to=\"tools\">Tools\u003c/a> for every metal and wood. Smiths make them at the anvil with \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>.\u003c/p>","src":["shared/tools.ts"],"w":false,"r":false},{"s":"pike","t":"Pike","c":"Items","i":"🐟","sum":"Fish. Sells for 22 bronze.","a":[],"ib":[["Kind","Fish"],["Shop pays","22 bronze"],["Game id","\u003ccode>pike\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a> level 30 from a pike spot (15 XP each).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (fish): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"pine-logs","t":"Pine logs","c":"Items","i":"🪵","sum":"Log. Sells for 1 bronze.","a":["pine log"],"ib":[["Kind","Logs"],["Shop pays","1 bronze"],["Game id","\u003ccode>pine_logs\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a> level 1 from a pine tree (1 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#living-off-the-land\" data-to=\"living-off-the-land\">Living off the land\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#hammer-and-fire\" data-to=\"hammer-and-fire\">Hammer and fire\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Used for tool handles, bows, staffs and arrows, and burned as cooking fuel.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"platebody","t":"Platebody","c":"Items","i":"🦺","sum":"Armor for the body slot.","a":[],"ib":[["Slot","body"],["Bars to make","3"],["Armor (bronze)","3"]],"h":"\u003cp>🦺 A platebody goes in your body slot. A bronze one gives 3 armor and takes 3 bars to make with \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>; better metal multiplies it. Leather and cloth versions are made with \u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a>. See \u003ca href=\"#armor\" data-to=\"armor\">Armor\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"platelegs","t":"Platelegs","c":"Items","i":"👖","sum":"Armor for the legs slot.","a":[],"ib":[["Slot","legs"],["Bars to make","2"],["Armor (bronze)","2"]],"h":"\u003cp>👖 A platelegs goes in your legs slot. A bronze one gives 2 armor and takes 2 bars to make with \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>; better metal multiplies it. Leather and cloth versions are made with \u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a>. See \u003ca href=\"#armor\" data-to=\"armor\">Armor\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"platinum-bar","t":"Platinum bar","c":"Items","i":"🧈","sum":"Bar. Sells for 400 bronze.","a":[],"ib":[["Kind","Bars"],["Shop pays","400 bronze"],["Game id","\u003ccode>platinum_bar\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#platinum-ore\" data-to=\"platinum-ore\">Platinum ore\u003c/a>, \u003ca href=\"#platinum-ore\" data-to=\"platinum-ore\">Platinum ore\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cp>Nowhere in the game yet.\u003c/p>","src":["shared/items.ts"],"w":false,"r":false},{"s":"platinum-ore","t":"Platinum ore","c":"Items","i":"🪨","sum":"Ore. Sells for 160 bronze.","a":[],"ib":[["Kind","Ore"],["Shop pays","160 bronze"],["Game id","\u003ccode>platinum_ore\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a> level 75 from a platinum rock (55 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#platinum-bar\" data-to=\"platinum-bar\">Platinum bar\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"pot","t":"Pot","c":"Items","i":"🛠️","sum":"A tool for Cooking.","a":[],"ib":[["Helps","Cooking"],["Effect","Fewer failures"]],"h":"\u003cp>The pot helps \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>: your tries fail less often. Better metal and better wood make it stronger and last longer. See \u003ca href=\"#tools\" data-to=\"tools\">Tools\u003c/a> for every metal and wood. Smiths make them at the anvil with \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>.\u003c/p>","src":["shared/tools.ts"],"w":false,"r":false},{"s":"potatoes","t":"Potatoes","c":"Items","i":"🥔","sum":"Herbs, roots and crop. Sells for 1 bronze.","a":["potato"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","1 bronze"],["Game id","\u003ccode>potato\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Grown with \u003ca href=\"#farming\" data-to=\"farming\">Farming\u003c/a> level 1: ripe after 10 minutes, 3 to 5 a tile.\u003c/li>\u003cli>Sold by \u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (vegetables): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"potions","t":"Potions","c":"Items","i":"🧪","sum":"Every potion and how to brew it.","a":[],"ib":[],"h":"\u003cp>Potions are brewed with \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> at the alchemy table in the Mages' Guild: two ingredients and an empty \u003ca href=\"#empty-vials\" data-to=\"empty-vials\">vial\u003c/a>, and maybe a third ingredient for a bonus. You can drink one every 10 seconds; buffs last 5 minutes.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Potion\u003c/th>\u003cth>Alchemy level\u003c/th>\u003cth>Ingredients\u003c/th>\u003cth>Does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>\u003c/td>\u003ctd>1\u003c/td>\u003ctd>\u003ca href=\"#red-cap-mushrooms\" data-to=\"red-cap-mushrooms\">Red cap mushrooms\u003c/a> + \u003ca href=\"#slime-goo\" data-to=\"slime-goo\">Slime goo\u003c/a>\u003c/td>\u003ctd>Restores health\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#stamina-potion\" data-to=\"stamina-potion\">Stamina potion\u003c/a>\u003c/td>\u003ctd>3\u003c/td>\u003ctd>\u003ca href=\"#ginseng-roots\" data-to=\"ginseng-roots\">Ginseng roots\u003c/a> + \u003ca href=\"#wild-honeycomb\" data-to=\"wild-honeycomb\">Wild honeycomb\u003c/a>\u003c/td>\u003ctd>Restores stamina\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#mana-potion\" data-to=\"mana-potion\">Mana potion\u003c/a>\u003c/td>\u003ctd>5\u003c/td>\u003ctd>\u003ca href=\"#blue-lotus\" data-to=\"blue-lotus\">Blue lotus\u003c/a> + \u003ca href=\"#bat-wings\" data-to=\"bat-wings\">Bat wings\u003c/a>\u003c/td>\u003ctd>Restores mana\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#restoration-draught\" data-to=\"restoration-draught\">Restoration draught\u003c/a>\u003c/td>\u003ctd>8\u003c/td>\u003ctd>\u003ca href=\"#slime-goo\" data-to=\"slime-goo\">Slime goo\u003c/a> + \u003ca href=\"#blue-lotus\" data-to=\"blue-lotus\">Blue lotus\u003c/a>\u003c/td>\u003ctd>Restores some health and some mana (secret recipe)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#strength-potion\" data-to=\"strength-potion\">Strength potion\u003c/a>\u003c/td>\u003ctd>10\u003c/td>\u003ctd>\u003ca href=\"#wolf-fangs\" data-to=\"wolf-fangs\">Wolf fangs\u003c/a> + \u003ca href=\"#sage\" data-to=\"sage\">Sage\u003c/a>\u003c/td>\u003ctd>Your weapon hits harder for a while\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#swiftness-potion\" data-to=\"swiftness-potion\">Swiftness potion\u003c/a>\u003c/td>\u003ctd>15\u003c/td>\u003ctd>\u003ca href=\"#boar-tusks\" data-to=\"boar-tusks\">Boar tusks\u003c/a> + \u003ca href=\"#ginseng-roots\" data-to=\"ginseng-roots\">Ginseng roots\u003c/a>\u003c/td>\u003ctd>You walk faster for a while\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#hunters-brew\" data-to=\"hunters-brew\">Hunter's brew\u003c/a>\u003c/td>\u003ctd>18\u003c/td>\u003ctd>\u003ca href=\"#wolf-fangs\" data-to=\"wolf-fangs\">Wolf fangs\u003c/a> + \u003ca href=\"#boar-tusks\" data-to=\"boar-tusks\">Boar tusks\u003c/a>\u003c/td>\u003ctd>A little stronger and a little faster, for a while (secret recipe)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#night-sight-potion\" data-to=\"night-sight-potion\">Night sight potion\u003c/a>\u003c/td>\u003ctd>20\u003c/td>\u003ctd>\u003ca href=\"#moonpetal\" data-to=\"moonpetal\">Moonpetal\u003c/a> + \u003ca href=\"#blue-lotus\" data-to=\"blue-lotus\">Blue lotus\u003c/a>\u003c/td>\u003ctd>You see clearly at night, for a while\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#tithe-tonic\" data-to=\"tithe-tonic\">Tithe tonic\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003ctd>\u003ca href=\"#red-cap-mushrooms\" data-to=\"red-cap-mushrooms\">Red cap mushrooms\u003c/a> + \u003ca href=\"#wild-roots\" data-to=\"wild-roots\">Wild roots\u003c/a>\u003c/td>\u003ctd>Clears one Tithe mark (secret recipe)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#ember-trap-potion\" data-to=\"ember-trap-potion\">Ember trap potion\u003c/a>\u003c/td>\u003ctd>25\u003c/td>\u003ctd>\u003ca href=\"#venom-sacs\" data-to=\"venom-sacs\">Venom sacs\u003c/a> + \u003ca href=\"#moonpetal\" data-to=\"moonpetal\">Moonpetal\u003c/a>\u003c/td>\u003ctd>Your Ember trap spell lasts longer, for a while\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-bonus-ingredients\">Bonus ingredients\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Third ingredient\u003c/th>\u003cth>Adds\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#sage\" data-to=\"sage\">Sage\u003c/a>\u003c/td>\u003ctd>30% stronger\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#moonpetal\" data-to=\"moonpetal\">Moonpetal\u003c/a>\u003c/td>\u003ctd>60% stronger\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#wild-honeycomb\" data-to=\"wild-honeycomb\">Wild honeycomb\u003c/a>\u003c/td>\u003ctd>also gives 15 stamina\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#mushrooms\" data-to=\"mushrooms\">Mushrooms\u003c/a>\u003c/td>\u003ctd>also heals 10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#old-bones\" data-to=\"old-bones\">Old bones\u003c/a>\u003c/td>\u003ctd>buffs last half as long again, and 10% stronger\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/alchemy.ts"],"w":false,"r":false},{"s":"quests","t":"Quests","c":"Quests","i":"📜","sum":"Every quest built so far.","a":[],"ib":[],"h":"\u003cp>Every quest in the game today, in the order they're listed. The story's plan for later acts is on \u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a> and \u003ca href=\"#side-quests\" data-to=\"side-quests\">Side quests\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-prologue\">Prologue\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Quest\u003c/th>\u003cth>From\u003c/th>\u003cth>Steps\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#awakening\" data-to=\"awakening\">Awakening\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#sister-celene\" data-to=\"sister-celene\">Sister Celene\u0 003c/td>\u003ctd>\u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#a-flame-in-the-thornwood\" data-to=\"a-flame-in-the-thornwood\">A Flame in the Thornwood\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>\u003c/td>\u003ctd>6\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"radiance-ceremony","t":"Radiance Ceremony","c":"Lore","i":"🌞","sum":"The great honour: a weary champion lays their flame down so new heroes can wake.","a":["Radiance","Radiance Ceremonies","The Ceremony","Ceremony"],"ib":[["Since","About year 200"],["Created by","\u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a>"]],"h":"\u003cp>A \u003cb>Radiance Ceremony\u003c/b> is the Emberguard's highest honour. \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a> created it around year 200, when the first \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> began to fade (\u003ca href=\"#the-fading\" data-to=\"the-fading\">The Fading\u003c/a>). Every few decades a great champion who has carried the flame long enough is invited to lay it down. At the Ceremony they blaze up one last time and go out, and their ember, the Emberguard say, raises several new heroes: \u003ci>one flame lights many\u003c/i>. From then on they are one of \u003ca href=\"#the-extinguished\" data-to=\"the-extinguished\">The Extinguished\u003c/a>, and their statue stands in \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>.\u003c/p>\n\u003cp>Most champions ask for it themselves. Refusing is allowed, but shameful.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The champion's ember goes to Vale. The Ceremony is how he became, and stays, the most powerful being in the land. \u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a> found this out around year 400, and it started the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>.\u003c/p>\n\u003cp>The Emberguard decide who's ready, and quietly speed up the brightest champions' Fading so they ask sooner. A few sparks never fully drain: they're the embers drifting in the Emberhall, and some are trapped in old refined emberstones.\u003c/p>\u003c/div>","src":["wiki/pages/radiance.md"],"w":true,"r":false},{"s":"ranged","t":"Ranged","c":"Skills","i":"🏹","sum":"Hold a sling, darts or a bow and hit monsters from a distance.","a":[],"ib":[["Discipline","💪 Strength"],["Taught by","\u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>"],["Max level","99"]],"h":"\u003cp>🏹 \u003cb>Ranged\u003c/b> is a skill in \u003ca href=\"#strength\" data-to=\"strength\">Strength\u003c/a>. Hold a sling, darts or a bow and hit monsters from a distance.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#standing-your-ground\" data-to=\"standing-your-ground\">Standing your ground\u003c/a>, from \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🎯 Steady aim\u003c/td>\u003ctd>hit 2% more often\u003c/td>\u003c/tr>\u003ctr>\u003ctd>💥 Sharp tips\u003c/td>\u003ctd>hit 5% harder\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪶 Second wind\u003c/td>\u003ctd>10% chance it costs no stamina\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"rat","t":"Rat","c":"Monsters","i":"🐀","sum":"A level 2 monster. Fights back if you hit it.","a":[],"ib":[["Level","2"],["Health","6"],["Biggest hit","1"],["Attacks every","2.4s"],["Temper","Fights back if you hit it"],["Out","Day and night"],["Comes back after","30s"],["Coins","0 to 2 bronze"]],"h":"\u003cp>The \u003cb>Rat\u003c/b> is a level 2 monster with 6 health. Fights back if you hit it.\u003c/p>\n\u003cp>Defeating one gives 2 bonus XP on top of 1 XP per point of damage, plus 4 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>Heartvale, near Quarry (6), The Thornwood, near Ashbound camp (4), The old mine (3).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🐁 \u003ca href=\"#rat-tails\" data-to=\"rat-tails\">Rat tails\u003c/a>\u003c/td>\u003ctd>50%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>It also drops 0 to 2 bronze coins.\u003c/p>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"rat-tails","t":"Rat tails","c":"Items","i":"🐁","sum":"Monster drop. Sells for 2 bronze.","a":["rat tail"],"ib":[["Kind","Monster drops"],["Shop pays","2 bronze"],["Game id","\u003ccode>rat_tail\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#rat\" data-to=\"rat\">Rat\u003c/a> (50%).\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"raw-beef","t":"Raw beef","c":"Items","i":"🥩","sum":"Monster drop. Sells for 4 bronze.","a":[],"ib":[["Kind","Monster drops"],["Shop pays","4 bronze"],["Game id","\u003ccode>raw_beef\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#cow\" data-to=\"cow\">Cow\u003c/a> (70%).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (meat): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"raw-boar","t":"Raw boar","c":"Items","i":"🥩","sum":"Monster drop. Sells for 7 bronze.","a":[],"ib":[["Kind","Monster drops"],["Shop pays","7 bronze"],["Game id","\u003ccode>raw_boar\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#boar\" data-to=\"boar\">Boar\u003c/a> (80%).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (meat): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"raw-chicken","t":"Raw chicken","c":"Items","i":"🍗","sum":"Monster drop. Sells for 2 bronze.","a":[],"ib":[["Kind","Monster drops"],["Shop pays","2 bronze"],["Game id","\u003ccode>raw_chicken\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#chicken\" data-to=\"chicken\">Chicken\u003c/a> (70%).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (chicken): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"rebuild-the-shrine","t":"Rebuild the Shrine","c":"Quests","i":"📜","sum":"Act 1 from Keeper Aldric.","a":[],"ib":[["Part of","Act 1"],["Given by","Keeper Aldric"],["Where","in the Emberhall, the great white temple on Ember Hill, in the middle of Emberhold"],["Steps","5"]],"h":"\u003cp>\u003cb>Rebuild the Shrine\u003c/b> is part of the Act 1 from \u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>, found in the Emberhall, the great white temple on Ember Hill, in the middle of Emberhold.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#the-first-tithe\" data-to=\"the-first-tithe\">The First Tithe\u003c/a>, \u003ca href=\"#the-totem\" data-to=\"the-totem\">The Totem\u003c/a>, \u003ca href=\"#ash-on-the-road\" data-to=\"ash-on-the-road\">Ash on the Road\u003c/a>, \u003ca href=\"#into-the-rocks\" data-to=\"into-the-rocks\">Into the rocks\u003c/a>, \u003ca href=\"#hammer-and-fire\" data-to=\"hammer-and-fire\">Hammer and fire\u003c/a>.\u003c/p>\n\u003cdiv class=\"box note\">\u003cdiv class=\"box-label\">Planned change\u003c/div>\u003cp>Change the shrine's lit line: green grass, not brown, and the thread.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-keeper-aldric\">Step 1: Talk to Keeper Aldric\u003c/h3>\n\u003cp>\u003cb>Keeper Aldric:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>The Westroad is clear, Rook's totem is ready, and you've learned to mine and smelt. Let's rebuild that shrine!\u003c/p>\u003cp>The Emberguard have the stone cut already. Bring 6 oak logs for the frame and 2 bronze bars to bind it. I'll have Rook carve a second totem for the top: pick it up from him on your way.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-step-2-get-6-oak-logs-and-2-bronze-bars\">Step 2: Get 6 oak logs and 2 bronze bars\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Chop oak trees (the round ones), mine copper and tin up at the quarry, and smelt bronze bars at Brann's furnace. Aldric's blessing steadies your hand: the two bars you need won't fail.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-3-pick-up-the-new-totem-from-woodworker-rook\">Step 3: Pick up the new totem from Woodworker Rook\u003c/h3>\n\u003cul>\u003cli>\u003cb>Talk to:\u003c/b> Woodworker Rook.\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Woodworker Rook:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Another totem for the Westroad? Already done. Here.\u003c/p>\u003cp>No note in this one. Just wood.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> \u003ca href=\"#shrine-totems\" data-to=\"shrine-totems\">Shrine totems\u003c/a>.\u003c/p>\n\u003ch3 id=\"s-step-4-rebuild-the-westroad-shrine-far-west-along-the-main-road\">Step 4: Rebuild the Westroad shrine (far west, along the main road)\u003c/h3>\n\u003cul>\u003cli>\u003cb>Talk to:\u003c/b> Westroad shrine.\u003c/li>\u003cli>\u003cb>Bring:\u003c/b> 6 × \u003ca href=\"#oak-logs\" data-to=\"oak-logs\">Oak logs\u003c/a>, 2 × \u003ca href=\"#bronze-bar\" data-to=\"bronze-bar\">Bronze bar\u003c/a>, \u003ca href=\"#shrine-totems\" data-to=\"shrine-totems\">Shrine totems\u003c/a>.\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Westroad shrine:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>You raise the oak frame, the Emberguard stack their white stone around it, you bind it with bronze, and set Rook's totem on top. Two Emberguard arrive and say a prayer, and the shrine lights up gold.\u003c/p>\u003cp>Then you notice the grass. All round the shrine, in a ring, it's turning brown.\u003c/p>\u003cp>Maybe it was always like that.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-step-5-go-back-to-keeper-aldric\">Step 5: Go back to Keeper Aldric\u003c/h3>\n\u003cp>\u003cb>Keeper Aldric:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>It's lit! I felt it from here. The Westroad shrine will raise heroes again: if you fall out west, you'll wake there now.\u003c/p>\u003cp>Here: health potions, and the Emberhall's thanks.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> 3 × \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>, 1.2 silver.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> \u003ca href=\"#shrine-totems\" data-to=\"shrine-totems\">Shrine totems\u003c/a>, 3 × \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>, 1.2 silver.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#ash-on-the-road\" data-to=\"ash-on-the-road\">Ash on the Road\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#what-holt-saw\" data-to=\"what-holt-saw\">What Holt Saw\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"red-cap-mushrooms","t":"Red cap mushrooms","c":"Items","i":"🍄","sum":"Herbs, roots and crop. Sells for 4 bronze.","a":["red cap mushroom"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","4 bronze"],["Game id","\u003ccode>red_cap\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dug up with \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> level 2 (3 XP).\u003c/li>\u003cli>Dropped by the \u003ca href=\"#ashbound-scout\" data-to=\"ashbound-scout\">Ashbound scout\u003c/a> (30%).\u003c/li>\u003cli>Given in the quest \u003ca href=\"#a-drop-of-something\" data-to=\"a-drop-of-something\">A drop of something\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Half of the recipe for the \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>.\u003c/li>\u003cli>Half of the recipe for the \u003ca href=\"#tithe-tonic\" data-to=\"tithe-tonic\">Tithe tonic\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"renown","t":"Renown","c":"Skills","i":"📋","sum":"Trained by finishing bounties, on the bounty board and the Mages' Guild board. Bounties get bigger and pay more as it goes up, and Captain Bryn gives you ranks and titles (Wanderer at 5, Trusted at 15, Champion at 30).","a":[],"ib":[["Discipline","🤝 Charisma"],["Taught by","\u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">Captain Bryn\u003c/a>"],["Max level","99"]],"h":"\u003cp>📋 \u003cb>Renown\u003c/b> is a skill in \u003ca href=\"#charisma\" data-to=\"charisma\">Charisma\u003c/a>. Trained by finishing bounties, on the bounty board and the Mages' Guild board. Bounties get bigger and pay more as it goes up, and Captain Bryn gives you ranks and titles (Wanderer at 5, Trusted at 15, Champion at 30).\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#odd-jobs\" data-to=\"odd-jobs\">Odd jobs\u003c/a>, from \u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">Captain Bryn\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>📖 Quick learner\u003c/td>\u003ctd>10% more XP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-ranks\">Ranks\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Renown level\u003c/th>\u003cth>Title\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Wanderer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>15\u003c/td>\u003ctd>Trusted\u003c/td>\u003c/tr>\u003ctr>\u003ctd>30\u003c/td>\u003ctd>Champion\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"repairer-oswin","t":"Repairer Oswin","c":"People","i":"🧰","sum":"Mends worn tools and gear, for a few coins.","a":[],"ib":[["Found in","The Mages' Guild"],["Game id","\u003ccode>repairer\u003c/code>"]],"h":"\u003cp>\u003cb>Repairer Oswin\u003c/b> mends worn tools, weapons and armor for a few coins. \u003ci>&quot;Mending always costs something.&quot;\u003c/i> He's \u003ca href=\"#the-rooted\" data-to=\"the-rooted\">Rooted\u003c/a>.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>He has loved \u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a> for 50 years. An old lantern he asks you to fix holds a note in Maren's writing (the planned quest \u003ci>Mending Costs\u003c/i>). What it says is waiting on Maren's new story.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;Worn out? Broken? I'll make it good as new, for a few coins.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">The Mages' Guild\u003c/a>.\u003c/p>","src":["wiki/pages/person-oswin.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"resources-by-region","t":"Resources by region","c":"Places","i":"⛏️","sum":"Which region is home to the higher-level materials for each gathering skill.","a":["Resources","Regional resources"],"ib":[],"h":"\u003cp>\u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a> has the starter tier of every gathering skill, so new players can train everything at home. Each other region is the only place to find the higher tiers for one or two skills. Crafting skills (Smithing, Cooking, Alchemy, Enchanting, Handicraft, Jewelry) can be trained anywhere, but their best materials come from these regions, which gives players a reason to travel.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Region\u003c/th>\u003cth>Main skill\u003c/th>\u003cth>Only found here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a> (1 to 20)\u003c/td>\u003ctd>Every skill, starter tier. Best home for Farming\u003c/td>\u003ctd>Pine, oak and birch trees. Copper and tin. Minnow, trout and perch. Basic forage. Your farm plot\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-thornwood\" data-to=\"the-thornwood\">The Thornwood\u003c/a> (forest)\u003c/td>\u003ctd>Woodcutting\u003c/td>\u003ctd>Maple (level 20), yew (35), and elderwood (70) deep in the old wood. Truffles and night mushrooms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#greyspine-peaks\" data-to=\"greyspine-peaks\">Greyspine Peaks\u003c/a> (volcanic)\u003c/td>\u003ctd>Mining\u003c/td>\u003ctd>Iron (20), coal (30), silver (40), emberstone veins (25), and rubies (50) in the lava rock\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-tangle\" data-to=\"the-tangle\">The Tangle\u003c/a> (jungle)\u003c/td>\u003ctd>Foraging and Hunting\u003c/td>\u003ctd>Ironwood trees (50), rare jungle herbs for top Alchemy, emeralds (30), big game hides\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#saltmere-coast\" data-to=\"saltmere-coast\">Saltmere Coast\u003c/a>\u003c/td>\u003ctd>Fishing\u003c/td>\u003ctd>Tuna (45) and swordfish (60), and pike (30) in the river mouths\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a> (desert)\u003c/td>\u003ctd>Mining (treasure)\u003c/td>\u003ctd>Gold (55), topaz (20), and Aldmeran relics dug from the sand, for Trading or Enchanting\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#blackfen\" data-to=\"blackfen\">Blackfen\u003c/a> (swamp)\u003c/td>\u003ctd>Alchemy ingredients\u003c/td>\u003ctd>Eels (75), and swamp and night herbs for the strongest potions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#frostfell\" data-to=\"frostfell\">Frostfell\u003c/a> (tundra)\u003c/td>\u003ctd>Mining and Hunting\u003c/td>\u003ctd>Mithril (70), sapphires (40), and thick furs for the best leather armor\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-deeps\" data-to=\"the-deeps\">The Deeps\u003c/a> (caves)\u003c/td>\u003ctd>Mining (gems)\u003c/td>\u003ctd>Platinum (75), amethyst (10), and gem rocks of every kind as dungeon rewards\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-hollow-heart\" data-to=\"the-hollow-heart\">The Hollow Heart\u003c/a>\u003c/td>\u003ctd>Mining\u003c/td>\u003ctd>Iridium (85), the rarest ore\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-sundered-crown\" data-to=\"the-sundered-crown\">The Sundered Crown\u003c/a> (endgame)\u003c/td>\u003ctd>\u003c/td>\u003ctd>Ancient Aldmeran seeds for top Farming crops, and royal treasure\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-differences-from-the-game-today\">Differences from the game today\u003c/h2>\n\u003cul>\u003cli>In the game, the higher ores, gems and trees can all be found around Heartvale: the \u003ca href=\"#the-crystal-cave\" data-to=\"the-crystal-cave\">Crystal Cave\u003c/a> has platinum, iridium and gem rocks. Following this plan means moving them out in a future update, or treating the Crystal Cave as the first of the Deeps.\u003c/li>\u003cli>Jungle herbs, swamp herbs, furs and Aldmeran relics don't exist in the game yet.\u003c/li>\u003c/ul>","src":["wiki/pages/resources.md"],"w":true,"r":false},{"s":"restoration-draught","t":"Restoration draught","c":"Items","i":"⚗️","sum":"Restores some health and some mana.","a":[],"ib":[["Alchemy level","8"],["Ingredients","Slime goo + Blue lotus"],["XP","14"],["First tries work","50%"]],"h":"\u003cp>Restores some health and some mana. Brew it with \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> level 8 from \u003ca href=\"#slime-goo\" data-to=\"slime-goo\">Slime goo\u003c/a> and \u003ca href=\"#blue-lotus\" data-to=\"blue-lotus\">Blue lotus\u003c/a> in a vial. It isn't listed at the table until you've brewed one: someone has to tell you the recipe. See \u003ca href=\"#potions\" data-to=\"potions\">Potions\u003c/a>.\u003c/p>","src":["shared/alchemy.ts"],"w":false,"r":false},{"s":"rhys","t":"Rhys","c":"People","i":"😏","sum":"An Emberborn who woke just before you. Your friendly rival.","a":[],"ib":[["Found in","Heartvale"],["Game id","\u003ccode>rhys\u003c/code>"]],"h":"\u003cp>\u003cb>Rhys\u003c/b> is an \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> who woke just before you, and your friendly rival, always one step ahead. You meet him at the end of Act 1, when you light the shrine at the valley's edge. He lost the emberstone he woke up holding.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>In Act 3, after four great-shrine trials, Rhys is invited to join first. At his Joining he goes down the Emberhall stair and comes back up drained, grey, and back to level 1. &quot;His spark was flawed.&quot; In truth he was shown the truth and said no. He joins \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;Ha! Still at it? I'm going to have a statue in the Emberhall before you do, you know.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>.\u003c/p>","src":["wiki/pages/person-rhys.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"running","t":"Running","c":"Mechanics","i":"🏃","sum":"Hold Shift or tap 🏃.","a":[],"ib":[],"h":"\u003cp>Hold Shift or tap 🏃 to run 80% faster (see \u003ca href=\"#walking\" data-to=\"walking\">Walking\u003c/a>). Each tile's length you run uses 1 stamina for the moment; stop for 2.5 seconds and it all comes back. Running never costs stamina for good.\u003c/p>","src":["shared/stats.ts"],"w":false,"r":false},{"s":"sable","t":"Sable","c":"People","i":"⚱️","sum":"Leader of the Ashbound. Once the Emberguard's brightest champion, who vanished the night before her Ceremony. Her hands are grey with ash.","a":[],"ib":[["Leads","\u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>"],["Once","The Emberguard's brightest champion"],["Ceremony","Chosen about year 780; she never came"]],"h":"\u003cp>\u003cb>Sable\u003c/b> leads \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>. Her hands are grey with ash. She's the one who takes the player to Wick after Rhys is drained, and who gets them out of the Emberhall after they refuse Vale.\u003c/p>\n\u003ch2 id=\"s-what-the-emberguard-say-about-her\">What the Emberguard say about her\u003c/h2>\n\u003cul>\u003cli>About twenty years ago, Sable was the brightest champion the shrines had raised in a century, and she was chosen for a \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a>: the highest honour there is.\u003c/li>\u003cli>\u003cb>She ran.\u003c/b> The night before her Ceremony, she vanished. Her friends had gathered and the Emberhall was decorated for her. She simply wasn't there in the morning.\u003c/li>\u003cli>\u003cb>Her shame drove her mad.\u003c/b> She fled her honour, and couldn't live with it. Now she leads bandits in the woods, smashing the shrines that raised her.\u003c/li>\u003cli>\u003cb>She's killing the land.\u003c/b> The Withering, the dying trees, the grey ground: the Emberguard say that's the Ashbound's doing.\u003c/li>\u003c/ul>\n\u003cp>People say her name the way they'd spit. Refusing a Ceremony is the most shameful thing an Emberborn can do, and Sable is the only one most people have ever heard of. Brother Oren calls her &quot;every family's black sheep&quot;.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003ch2 id=\"s-what-really-happened\">What really happened\u003c/h2>\n\u003cp>\u003cb>Wick found her first.\u003c/b> Sable had no doubts. She was proud to be chosen, and ready. A few weeks before her Ceremony, a stranger with an old, tired face found her alone and told her what a Ceremony really does. She didn't believe him. He showed her: a ledger page, a trapped spark in an old emberstone, and the Fading the Emberguard had been speeding up in her.\u003c/p>\n\u003cp>\u003cb>The night before:\u003c/b> she went to the Emberhall that night to see for herself, and found the stair under the Heart Shrine. What she saw down there was enough. She walked out of Emberhold before dawn and never came back.\u003c/p>\n\u003cp>\u003cb>The Ashbound:\u003c/b> the stranger was \u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a>. Together they started the Ashbound. She's its face and its leader; he stays hidden, researching. With his help she cut her own thread so the shrines could never pull her back in, and since then ash has been creeping up her hands. She knows what that means, and she chose it.\u003c/p>\n\u003cp>\u003cb>The lies are the cover-up.\u003c/b> The Withering began centuries before the Ashbound existed. Blaming them hides what Vale is taking from the shrines, and turns Sable's name into a warning for every champion who might wonder what a Ceremony really is.\u003c/p>\u003c/div>\n\u003cp>Not in the game yet.\u003c/p>","src":["wiki/pages/person-sable.md"],"w":true,"r":false},{"s":"sage","t":"Sage","c":"Items","i":"🌿","sum":"Herbs, roots and crop. Sells for 4 bronze.","a":["sprig of sage"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","4 bronze"],["Game id","\u003ccode>sage\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dug up with \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> level 5 (5 XP).\u003c/li>\u003cli>Sold by \u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a> once your \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a> is 6.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Half of the recipe for the \u003ca href=\"#strength-potion\" data-to=\"strength-potion\">Strength potion\u003c/a>.\u003c/li>\u003cli>A bonus third ingredient in \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a>: 30% stronger.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"salmon","t":"Salmon","c":"Items","i":"🐟","sum":"Fish. Sells for 14 bronze.","a":[],"ib":[["Kind","Fish"],["Shop pa
