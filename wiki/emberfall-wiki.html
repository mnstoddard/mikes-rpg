<!--

<style>
/* Layout: a reference book. Sticky search bar on top, a contents rail on the left, the article in a readable column with its fact box on the right. */
:root {
  --bg: #f5f6f8;
  --paper: #ffffff;
  --ink: #1b2029;
  --muted: #5a6373;
  --line: #dfe3ea;
  --soft: #eef1f5;
  --link: #1d5aa6;
  --link-visited: #5b3fa0;
  --new: #b4232a;
  --ember: #c2410c;
  --ember-soft: #fff1e8;
  --secret-bg: #fbeff0;
  --secret-line: #d9a3a8;
  --secret-ink: #8c1d27;
  --note-bg: #eef5fd;
  --note-line: #a9c6ea;
  --display: "Spectral", "Iowan Old Style", Georgia, serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --paper: #181b22; --ink: #e5e8ee; --muted: #9aa3b2; --line: #2b303b; --soft: #20242d;
    --link: #82b2ff; --link-visited: #b9a2f2; --new: #ff8a8f; --ember: #f39257; --ember-soft: #2a1d16;
    --secret-bg: #2a1a1d; --secret-line: #6b3a41; --secret-ink: #ffb3ba; --note-bg: #172231; --note-line: #2f4a6e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --paper: #181b22; --ink: #e5e8ee; --muted: #9aa3b2; --line: #2b303b; --soft: #20242d;
  --link: #82b2ff; --link-visited: #b9a2f2; --new: #ff8a8f; --ember: #f39257; --ember-soft: #2a1d16;
  --secret-bg: #2a1a1d; --secret-line: #6b3a41; --secret-ink: #ffb3ba; --note-bg: #172231; --note-line: #2f4a6e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font: 16px/1.6 var(--body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; border-radius: 3px; }
a.new { color: var(--new); cursor: help; }

/* ---- top bar ---- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 8px; color: var(--ink); white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand b { font: 700 22px/1 var(--display); letter-spacing: .01em; }
.brand b span { color: var(--ember); }
.brand small { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }
.menu-btn { display: none; }
.search { position: relative; flex: 1; max-width: 520px; margin-left: auto; }
.search input { width: 100%; font: inherit; font-size: 15px; padding: 8px 12px 8px 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; }
.results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.14); overflow: hidden; }
.results a { display: flex; gap: 10px; padding: 8px 12px; color: var(--ink); border-top: 1px solid var(--soft); }
.results a:first-child { border-top: 0; }
.results a.on, .results a:hover { background: var(--soft); text-decoration: none; }
.results .ri { width: 22px; text-align: center; flex: none; }
.results .rt { font-weight: 600; }
.results .rc { color: var(--muted); font-size: 13px; margin-left: auto; white-space: nowrap; }
.toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--ember); }

/* ---- frame ---- */
.frame { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 32px; max-width: 1320px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; max-height: calc(100vh - 96px); overflow: auto; font-size: 14px; }
.side h3 { font: 600 11px/1 var(--body); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin: 18px 0 8px; }
.side h3:first-child { margin-top: 0; }
.side a { display: flex; justify-content: space-between; gap: 8px; padding: 3px 8px; margin: 0 -8px; border-radius: 6px; color: var(--ink); }
.side a:hover { background: var(--soft); text-decoration: none; }
.side a.on { background: var(--ember-soft); color: var(--ember); font-weight: 600; }
.side a span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }

/* ---- article ---- */
article { min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 28px 32px 32px; }
.crumb { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
h1 { font: 600 34px/1.15 var(--display); margin: 0 0 4px; text-wrap: balance; }
.lede { color: var(--muted); margin: 0 0 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.content { display: flow-root; }
.content h2 { font: 600 24px/1.25 var(--display); margin: 30px 0 10px; padding-bottom: 4px; border-bottom: 1px solid var(--line); text-wrap: balance; }
.content h3 { font: 600 19px/1.3 var(--display); margin: 22px 0 6px; }
.content h4 { font-size: 16px; margin: 18px 0 4px; }
.content p, .content ul, .content ol { max-width: 72ch; }
.content p { margin: 0 0 12px; }
.content ul, .content ol { padding-left: 22px; margin: 0 0 12px; }
.content li { margin: 3px 0; }
.content blockquote { margin: 0 0 12px; padding: 4px 0 4px 16px; border-left: 3px solid var(--line); color: var(--muted); font-style: italic; max-width: 70ch; }
.content blockquote p { margin: 6px 0; }
code { font: 500 .86em var(--mono); background: var(--soft); padding: 1px 5px; border-radius: 4px; }
.tw { overflow-x: auto; margin: 0 0 16px; }
.content table { border-collapse: collapse; font-size: 14.5px; min-width: 50%; }
.content th, .content td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; font-variant-numeric: tabular-nums; }
.content th { background: var(--soft); font-weight: 600; }
.content td { min-width: 7em; }
.box { border: 1px solid; border-radius: 8px; padding: 10px 14px 4px; margin: 0 0 14px; max-width: 72ch; }
.box-label { font: 700 11px/1 var(--body); text-transform: uppercase; letter-spacing: .12em; margin: 2px 0 8px; }
.box.secret { background: var(--secret-bg); border-color: var(--secret-line); }
.box.secret .box-label { color: var(--secret-ink); }
.box.note { background: var(--note-bg); border-color: var(--note-line); }
body.no-secrets .box.secret { display: none; }
body.no-secrets .secret-only { display: none; }

.infobox { float: right; width: 290px; margin: 0 0 16px 24px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 14px; overflow: hidden; }
.infobox .ib-head { text-align: center; padding: 14px 12px 10px; border-bottom: 1px solid var(--line); }
.infobox .ib-icon { font-size: 46px; line-height: 1.1; }
.infobox .ib-title { font: 600 18px/1.25 var(--display); margin-top: 4px; }
.infobox .ib-cat { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.infobox dl { margin: 0; display: grid; grid-template-columns: auto 1fr; }
.infobox dt, .infobox dd { margin: 0; padding: 6px 12px; border-top: 1px solid var(--line); }
.infobox dt { font-weight: 600; color: var(--muted); }
.infobox dl > :nth-child(-n+2) { border-top: 0; }

.toc { display: inline-block; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 10px 16px 10px 14px; margin: 0 0 18px; font-size: 14px; }
.toc b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 4px; }
.toc ol { margin: 0; padding-left: 20px; }

.foot { clear: both; margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--muted); display: grid; gap: 8px; }
.foot .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-block; padding: 2px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; background: var(--bg); }
.made { display: inline-flex; gap: 6px; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
.made.game { background: var(--note-bg); color: var(--link); }
.made.written { background: var(--ember-soft); color: var(--ember); }

/* ---- main page and lists ---- */
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin: 10px 0 20px; }
.cat { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--bg); min-width: 0; }
.cat h3 { margin: 0 0 4px; font: 600 18px/1.2 var(--display); display: flex; justify-content: space-between; gap: 8px; }
.cat h3 span { font: 400 13px var(--body); color: var(--muted); }
.cat p { margin: 0; font-size: 14px; color: var(--muted); }
.list { columns: 2 260px; column-gap: 28px; }
.list .letter { font: 600 18px var(--display); color: var(--ember); margin: 8px 0 4px; break-after: avoid; }
.list .row { break-inside: avoid; padding: 3px 0; }
.list .row small { display: block; color: var(--muted); font-size: 13px; line-height: 1.35; }
.hit mark { background: var(--ember-soft); color: inherit; padding: 0 1px; border-radius: 2px; }


/* ---- maps (drawn from the game's map data) ---- */
.map { margin: 0 0 18px; clear: both; }
.map .mw { overflow: auto; width: fit-content; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; background: #000; max-height: 80vh; }
.map canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; cursor: zoom-in; }
.map.zoomed canvas { width: auto; max-width: none; cursor: zoom-out; }
.map figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.map .tip { position: fixed; z-index: 40; pointer-events: none; background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.2); }

@media (max-width: 900px) {
  .frame { grid-template-columns: minmax(0, 1fr); padding-top: 14px; }
  .side { position: fixed; z-index: 25; top: calc(env(safe-area-inset-top, 0px) + 58px); left: 0; bottom: 0; width: min(290px, 85vw); max-height: none; background: var(--paper); border-right: 1px solid var(--line); padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); transform: translateX(-105%); transition: transform .2s; }
  body.menu-open .side { transform: none; box-shadow: 10px 0 30px rgba(0,0,0,.2); }
  .menu-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 18px; cursor: pointer; flex: none; }
  .brand small, .toggle .tl { display: none; }
  article { padding: 18px 16px 22px; }
  h1 { font-size: 28px; }
  .infobox { float: none; width: 100%; margin: 0 0 16px; }
}
@media (max-width: 520px) { .brand b { font-size: 19px; } .top-in { gap: 10px; } }
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }
</style>

0000000000010000000000000000","00000000000000070000000000000000"],"marks":[{"x":6,"y":11,"kind":"monster","text":"Rat","to":"rat"},{"x":24,"y":11,"kind":"monster","text":"Rat","to":"rat"},{"x":16,"y":8,"kind":"monster","text":"Rat","to":"rat"},{"x":15,"y":15,"kind":"door","text":"Heartvale","to":"heartvale"}]},"wolf_den":{"id":"wolf_den","name":"The wolf den","w":20,"h":13,"palette":["#1f1b24","#3d3846","#ffd84a"],"rows":["00000000000000000000","00000000010110000000","00000011111111100000","00011111111111111000","00011111111111111100","00011111111111111110","00011111111111111110","00011111111111111110","00011111111111111100","00001111111111111000","00000101111111100000","00000000101010000000","00000000002000000000"],"marks":[{"x":10,"y":4,"kind":"monster","text":"Alpha wolf","to":"alpha-wolf"},{"x":6,"y":5,"kind":"monster","text":"Wolf","to":"wolf"},{"x":14,"y":5,"kind":"monster","text":"Wolf","to":"wolf"},{"x":7,"y":8,"kind":"monster","text":"Wolf","to":"wolf"},{"x":13,"y":8,"kind":"monster","text":"Wolf","to":"wolf"},{"x":10,"y":12,"kind":"door","text":"Heartvale","to":"heartvale"}]}},"built":"2026-11-25","version":"0.13","categories":["Wiki","Lore","History","Story","Places","Factions","People","Quests","Skills","Spells","Monsters","Items","Mechanics","Books","Updates"],"pages":[{"s":"a-blessing","t":"A Blessing","c":"Quests","i":"📜","sum":"Prologue from Sister Celene.","a":[],"ib":[["Part of","Prologue"],["Given by","Sister Celene"],["Where","in the Emberhall, the great white temple in the town square"],["Steps","3"]],"h":"\u003cp>\u003cb>A Blessing\u003c/b> is part of the Prologue from \u003ca href=\"#sister-celene\" data-to=\"sister-celene\">Sister Celene\u003c/a>, found in the Emberhall, the great white temple in the town square.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#living-off-the-land\" data-to=\"living-off-the-land\">Living off the land\u003c/a>, and 4 trainers' lessons.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Sister Celene\u003c/li>\u003cli>Gather 20 of anything (logs, ore, fish, herbs...)\u003c/li>\u003cli>Go back to Sister Celene \u003ci>(you get: 3 × \u003ca href=\"#blessing-scrolls\" data-to=\"blessing-scrolls\">Blessing scrolls\u003c/a>)\u003c/i>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#blessing-scrolls\" data-to=\"blessing-scrolls\">Blessing scrolls\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> Look at you! Four trainers already. Aldric is so proud, and so am I. Kneel a moment. There. That's a blessing of the Heart Shrine: for half an hour, everything you learn sticks better. You'll earn half as much XP again. Use it well! Gather 20 of anything: logs, ore, fish, herbs. I want to see you shine.\u003c/p>\n\u003cp>\u003cb>Step 3.\u003c/b> Twenty! You see how the light helps you? Take these blessing scrolls. Read one whenever you want a blessing of your own. The Emberhall makes them for every Emberborn. Keeper Aldric wants to see you. I think it's time you swore the Oath.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"a-drop-of-something","t":"A drop of something","c":"Quests","i":"📜","sum":"Lessons from Alchemist Moss.","a":[],"ib":[["Part of","Lessons"],["Given by","Alchemist Moss"],["Where","at the Mages' Guild, south-west of town"],["Steps","4"]],"h":"\u003cp>\u003cb>A drop of something\u003c/b> is a lesson from \u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">Alchemist Moss\u003c/a>, found at the Mages' Guild, south-west of town.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#what-the-ground-gives\" data-to=\"what-the-ground-gives\">What the ground gives\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Alchemist Moss at the Mages' Guild \u003ci>(you get: \u003ca href=\"#red-cap-mushrooms\" data-to=\"red-cap-mushrooms\">Red cap mushrooms\u003c/a>, \u003ca href=\"#slime-goo\" data-to=\"slime-goo\">Slime goo\u003c/a>, \u003ca href=\"#empty-vials\" data-to=\"empty-vials\">Empty vials\u003c/a>)\u003c/i>\u003c/li>\u003cli>Brew a health potion at the alchemy table\u003c/li>\u003cli>Drink a potion (click it in your bag, then Drink)\u003c/li>\u003cli>Go back to Alchemist Moss for your reward \u003ci>(you get: 5 × \u003ca href=\"#empty-vials\" data-to=\"empty-vials\">Empty vials\u003c/a>)\u003c/i>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#red-cap-mushrooms\" data-to=\"red-cap-mushrooms\">Red cap mushrooms\u003c/a>, \u003ca href=\"#slime-goo\" data-to=\"slime-goo\">Slime goo\u003c/a>, \u003ca href=\"#empty-vials\" data-to=\"empty-vials\">Empty vials\u003c/a>, \u003ca href=\"#empty-vials\" data-to=\"empty-vials\">Empty vials\u003c/a>, 1.2 silver.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> Careful, that one bubbles. I'm Moss. Rowan lets me keep my table in the corner of the guild, as long as nothing explodes. Alchemy is part of Wisdom. Two ingredients make a potion: a red cap mushroom and some slime goo make a health potion. A third, like sage, adds something extra. Every potion needs an empty vial, and I sell those. Here's a red cap, some slime goo and a vial. Use the alchemy table next to me: tap the two ingredients to put them in, then brew.\u003c/p>\n\u003cp>\u003cb>Step 4.\u003c/b> Not bad! The better you get at Alchemy, the stronger your potions are when you drink them. Stamina, mana, strength, swiftness, night sight... the recipes are all at the table, as you learn them. And between you and me, a few aren't written down anywhere. Try mixing things and see what happens. Herbalist Wren digs up most of what you need, and the rest comes off monsters. Here are some vials to get you going. Now if you'll excuse me, I've a big order of Tithe tonics to brew for the Emberhall.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"a-light-in-the-thornwood","t":"A Light in the Thornwood","c":"Quests","i":"📜","sum":"Act 1 from Keeper Aldric.","a":[],"ib":[["Part of","Act 1"],["Given by","Keeper Aldric"],["Where","in the Emberhall, the great white temple in the town square"],["Steps","6"]],"h":"\u003cp>\u003cb>A Light in the Thornwood\u003c/b> is part of the Act 1 from \u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>, found in the Emberhall, the great white temple in the town square.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#rebuild-the-shrine\" data-to=\"rebuild-the-shrine\">Rebuild the Shrine\u003c/a>, \u003ca href=\"#the-hollow-wolves\" data-to=\"the-hollow-wolves\">The Hollow Wolves\u003c/a>, \u003ca href=\"#marens-question\" data-to=\"marens-question\">Maren's Question\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Keeper Aldric\u003c/li>\u003cli>Lead the Emberguard to the clearing past Kael's gate\u003c/li>\u003cli>Keep the Emberguard safe: defeat 4 wolves\u003c/li>\u003cli>Light the Thornwood shrine\u003c/li>\u003cli>Meet the stranger by the shrine\u003c/li>\u003cli>Go back to Keeper Aldric\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Rewards:\u003c/b> 3 silver.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> This is the day, friend. The Thornwood has never had a shrine. Today it gets one. Two of our Emberguard will go with you to the clearing just past Kael's gate. Keep them safe while they work, then light the shrine yourself.\u003c/p>\n\u003cp>\u003cb>Step 5.\u003c/b> Nicely done! I'm Rhys. Emberborn, same as you: woke up at the Heart Shrine a few weeks before you did. They made me a Flame last week. I'm going for Radiant next. Statue in the Hall of Champions and everything. Race you there! Ha!\u003c/p>\n\u003cp>\u003cb>Step 6.\u003c/b> The Thornwood shrine is lit! You'll wake there now, if you fall in the forest. That's your work, friend. Kneel. By the light of the Heart Shrine, I name you a Flame of the Emberhall. You've met Rhys, I hear? He's very keen. Between the two of you, the Thornwood won't know what hit it. Rest a while. Bigger things are coming.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"alchemist-moss","t":"Alchemist Moss","c":"People","i":"⚗️","sum":"Teaches Alchemy at the Mages' Guild.","a":[],"ib":[["Found in","The Mages' Guild"],["Shop","Yes"],["Game id","\u003ccode>moss\u003c/code>"]],"h":"\u003cp>\u003cb>Alchemist Moss\u003c/b> teaches \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> at the Mages' Guild. He brews &quot;Tithe tonics&quot; for the Emberhall (\u003ca href=\"#tithe-tonics\" data-to=\"tithe-tonics\">Tithe Tonics\u003c/a>), and later learns what's in them.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;I buy potions, herbs and monster parts, and I sell empty vials.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">The Mages' Guild\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#a-drop-of-something\" data-to=\"a-drop-of-something\">A drop of something\u003c/a> (lessons)\u003c/li>\u003cli>\u003ca href=\"#tithe-tonics\" data-to=\"tithe-tonics\">Tithe Tonics\u003c/a> (Act 1)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Shop:\u003c/b> buys potions, vials, herbs, monster parts and spell books. Sells: \u003ca href=\"#empty-vials\" data-to=\"empty-vials\">Empty vials\u003c/a>, \u003ca href=\"#spell-book-haste\" data-to=\"spell-book-haste\">Spell book: Haste\u003c/a>, \u003ca href=\"#spell-book-frost-nova\" data-to=\"spell-book-frost-nova\">Spell book: Frost nova\u003c/a>. See \u003ca href=\"#shops\" data-to=\"shops\">Shops\u003c/a>.\u003c/p>","src":["wiki/pages/person-moss.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"alchemy","t":"Alchemy","c":"Skills","i":"⚗️","sum":"Brew potions at the alchemy table in the Mages' Guild: pick 2 ingredients (and maybe a third for a bonus) and an empty vial. Alchemist Moss teaches it.","a":[],"ib":[["Discipline","🔮 Wisdom"],["Taught by","\u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">Alchemist Moss\u003c/a>"],["Max level","99"]],"h":"\u003cp>⚗️ \u003cb>Alchemy\u003c/b> is a skill in \u003ca href=\"#wisdom\" data-to=\"wisdom\">Wisdom\u003c/a>. Brew potions at the alchemy table in the Mages' Guild: pick 2 ingredients (and maybe a third for a bonus) and an empty vial. Alchemist Moss teaches it.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#a-drop-of-something\" data-to=\"a-drop-of-something\">A drop of something\u003c/a>, from \u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">Alchemist Moss\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🎯 Steady hands\u003c/td>\u003ctd>6% fewer failures\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧪 Extra dose\u003c/td>\u003ctd>5% chance to make an extra one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📖 Quick learner\u003c/td>\u003ctd>10% more XP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>See \u003ca href=\"#potions\" data-to=\"potions\">Potions\u003c/a> for every recipe.\u003c/p>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"alpha-wolf","t":"Alpha wolf","c":"Monsters","i":"🐺","sum":"A level 22 monster. Attacks on sight.","a":[],"ib":[["Level","22"],["Health","160"],["Biggest hit","9"],["Attacks every","2.4s"],["Temper","Attacks on sight"],["Out","Day and night"],["Comes back after","300s"],["Coins","40 to 90 bronze"]],"h":"\u003cp>The \u003cb>Alpha wolf\u003c/b> is a level 22 monster with 160 health. Attacks on sight, and it runs in a pack: when one goes for you, the others nearby join in.\u003c/p>\n\u003cp>Defeating one gives 90 bonus XP on top of 1 XP per point of damage, plus 112 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>The wolf den (1).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🐺 \u003ca href=\"#alpha-wolf-pelts\" data-to=\"alpha-wolf-pelts\">Alpha wolf pelts\u003c/a>\u003c/td>\u003ctd>100%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🦷 \u003ca href=\"#wolf-fangs\" data-to=\"wolf-fangs\">Wolf fangs\u003c/a>\u003c/td>\u003ctd>100%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧪 \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>\u003c/td>\u003ctd>30%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>It also drops 40 to 90 bronze coins.\u003c/p>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"alpha-wolf-pelts","t":"Alpha wolf pelts","c":"Items","i":"🐺","sum":"Monster drop. Sells for 150 bronze.","a":["alpha wolf pelt"],"ib":[["Kind","Monster drops"],["Shop pays","150 bronze"],["Game id","\u003ccode>alpha_pelt\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#alpha-wolf\" data-to=\"alpha-wolf\">Alpha wolf\u003c/a> (100%).\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"archmage-rowan","t":"Archmage Rowan","c":"People","i":"🔮","sum":"Head of the Mages' Guild. Teaches Enchanting.","a":[],"ib":[["Found in","The Mages' Guild"],["Game id","\u003ccode>archmage\u003c/code>"]],"h":"\u003cp>\u003cb>Archmage Rowan\u003c/b> is the head of \u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">The Mages' Guild\u003c/a> and teaches \u003ca href=\"#enchanting\" data-to=\"enchanting\">Enchanting\u003c/a>. She admires the Emberguard, until she learns the truth. Then she becomes your strongest ally.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;Welcome to the Mages' Guild. Rent space in our enchanted chest, or help the guild to rise in rank.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">The Mages' Guild\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#sparks-and-spells\" data-to=\"sparks-and-spells\">Sparks and spells\u003c/a> (lessons)\u003c/li>\u003c/ul>","src":["wiki/pages/person-rowan.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"archmage-vale","t":"Archmage Vale","c":"People","i":"🧙","sum":"The great mage who built the first shrines. He died soon after the war, or so everyone says.","a":["Vale (the Archmage)","Vael"],"ib":[["Known for","Building the first shrines"],["Died","Year 60, people say"],["Buried","No one knows where"]],"h":"\u003cp>\u003cb>Archmage Vale\u003c/b> led \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a> and, the story goes, built the first \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">shrines\u003c/a> in year 40, ending the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>. Everyone believes he died soon after the war. No one knows where he's buried. The gentle \u003ca href=\"#enchanter-vale\" data-to=\"enchanter-vale\">Enchanter Vale\u003c/a> in the Emberhall is said to be named after him.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>Vale never died. He faked his death in year 60 and has lived on the siphon ever since. \u003cb>He is \u003ca href=\"#enchanter-vale\" data-to=\"enchanter-vale\">Enchanter Vale\u003c/a>\u003c/b>, over 500 years old, hiding in plain sight, and also the hooded High Keeper of the Emberguard. Half of the \u003ca href=\"#ember-crown\" data-to=\"ember-crown\">Ember Crown\u003c/a> is set in his staff. He's the final enemy for Ashbound players, and the one who offers you a place among \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a> at your Joining: \u003ci>&quot;Join us, and you'll never fall again.&quot;\u003c/i>\u003c/p>\u003c/div>","src":["wiki/pages/archmage-vale.md"],"w":true,"r":false},{"s":"armor","t":"Armor","c":"Items","i":"🛡️","sum":"Helmets, platebodies, platelegs, boots and shields.","a":[],"ib":[],"h":"\u003cp>Armor makes monsters miss you more. Metal armor slows your attacks a tiny bit (1% per bar in it); cloth adds mana and spell damage instead.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Piece\u003c/th>\u003cth>Slot\u003c/th>\u003cth>Bars\u003c/th>\u003cth>Armor (bronze)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>⛑️ \u003ca href=\"#helmet\" data-to=\"helmet\">Helmet\u003c/a>\u003c/td>\u003ctd>head\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🦺 \u003ca href=\"#platebody\" data-to=\"platebody\">Platebody\u003c/a>\u003c/td>\u003ctd>body\u003c/td>\u003ctd>3\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>👖 \u003ca href=\"#platelegs\" data-to=\"platelegs\">Platelegs\u003c/a>\u003c/td>\u003ctd>legs\u003c/td>\u003ctd>2\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🥾 \u003ca href=\"#boots\" data-to=\"boots\">Boots\u003c/a>\u003c/td>\u003ctd>feet\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🛡️ \u003ca href=\"#shield\" data-to=\"shield\">Shield\u003c/a>\u003c/td>\u003ctd>offhand\u003c/td>\u003ctd>2\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-materials\">Materials\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Material\u003c/th>\u003cth>Armor ×\u003c/th>\u003cth>Defense level\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Bronze\u003c/td>\u003ctd>2\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Iron\u003c/td>\u003ctd>3\u003c/td>\u003ctd>15\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Steel\u003c/td>\u003ctd>4\u003c/td>\u003ctd>30\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mithril\u003c/td>\u003ctd>6\u003c/td>\u003ctd>60\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Leather\u003c/td>\u003ctd>2.5\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cloth\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/gear.ts","shared/combat.ts"],"w":false,"r":false},{"s":"arrows","t":"Arrows","c":"Items","i":"🏹","sum":"Ammunition for bows.","a":[],"ib":[],"h":"\u003cp>Arrows are made with \u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a> at Woodworker Rook's workbench, 10 at a time, and fired from a \u003ca href=\"#bow\" data-to=\"bow\">Bow\u003c/a>. About a third of them can be picked back up.\u003c/p>","src":["shared/handicraft.ts"],"w":false,"r":false},{"s":"ash-on-the-road","t":"Ash on the Road","c":"Quests","i":"📜","sum":"Act 1 from Captain Bryn.","a":[],"ib":[["Part of","Act 1"],["Given by","Captain Bryn"],["Where","by the bounty board in the square"],["Steps","3"]],"h":"\u003cp>\u003cb>Ash on the Road\u003c/b> is part of the Act 1 from \u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">Captain Bryn\u003c/a>, found by the bounty board in the square.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#oath-of-the-flame\" data-to=\"oath-of-the-flame\">Oath of the Flame\u003c/a>, \u003ca href=\"#odd-jobs\" data-to=\"odd-jobs\">Odd jobs\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Captain Bryn\u003c/li>\u003cli>Defeat 4 Ashbound scouts at the Westroad shrine (far west)\u003c/li>\u003cli>Report to Captain Bryn \u003ci>(you get: \u003ca href=\"#scrawled-note\" data-to=\"scrawled-note\">Scrawled note\u003c/a>)\u003c/i>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#scrawled-note\" data-to=\"scrawled-note\">Scrawled note\u003c/a>, 1.5 silver.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> Ember! Good timing. The Emberhall's paying for this one. Ashbound scouts are smashing the old shrine on the Westroad, at the far west end of the main road, by the barricade. Drive them off: four of them should do it. Watch yourself. They're not much in a fight, but they don't stay down long.\u003c/p>\n\u003cp>\u003cb>Step 3.\u003c/b> Driven off? Good work. They'll be back, they always are. What's that? One of them dropped a note? &quot;They aren't what they seem.&quot; Who, I wonder. Ha! Ashbound nonsense. Keep it if you like. Here's your bounty pay, from the Emberhall's own purse.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"ashbound-raider","t":"Ashbound raider","c":"Monsters","i":"🦹","sum":"A level 25 monster. Attacks on sight.","a":[],"ib":[["Level","25"],["Health","60"],["Biggest hit","8"],["Attacks every","2.4s"],["Temper","Attacks on sight"],["Out","Day and night"],["Comes back after","90s"],["Coins","15 to 45 bronze"]],"h":"\u003cp>The \u003cb>Ashbound raider\u003c/b> is a level 25 monster with 60 health. Attacks on sight.\u003c/p>\n\u003cp>Defeating one gives 26 bonus XP on top of 1 XP per point of damage, plus 51 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>The Thornwood, near Ashbound camp (3).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>💍 \u003ca href=\"#stolen-rings\" data-to=\"stolen-rings\">Stolen rings\u003c/a>\u003c/td>\u003ctd>25%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧪 \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>\u003c/td>\u003ctd>25%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📘 \u003ca href=\"#spell-book-invisibility\" data-to=\"spell-book-invisibility\">Spell book: Invisibility\u003c/a>\u003c/td>\u003ctd>3%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>It also drops 15 to 45 bronze coins.\u003c/p>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"ashbound-scout","t":"Ashbound scout","c":"Monsters","i":"🥷","sum":"A level 9 monster. Fights back if you hit it.","a":[],"ib":[["Level","9"],["Health","24"],["Biggest hit","3"],["Attacks every","2.4s"],["Temper","Fights back if you hit it"],["Out","Day and night"],["Comes back after","36s"],["Coins","2 to 8 bronze"]],"h":"\u003cp>The \u003cb>Ashbound scout\u003c/b> is a level 9 monster with 24 health. Fights back if you hit it.\u003c/p>\n\u003cp>Defeating one gives 10 bonus XP on top of 1 XP per point of damage, plus 19 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>Heartvale, near To the Barrens (closed) (4).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🧪 \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>\u003c/td>\u003ctd>8%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍄 \u003ca href=\"#red-cap-mushrooms\" data-to=\"red-cap-mushrooms\">Red cap mushrooms\u003c/a>\u003c/td>\u003ctd>30%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>It also drops 2 to 8 bronze coins.\u003c/p>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"awakening","t":"Awakening","c":"Quests","i":"📜","sum":"Prologue from Sister Celene.","a":[],"ib":[["Part of","Prologue"],["Given by","Sister Celene"],["Where","in the Emberhall, the great white temple in the town square"],["Steps","2"]],"h":"\u003cp>\u003cb>Awakening\u003c/b> is part of the Prologue from \u003ca href=\"#sister-celene\" data-to=\"sister-celene\">Sister Celene\u003c/a>, found in the Emberhall, the great white temple in the town square.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Sister Celene, beside the Heart Shrine \u003ci>(you get: \u003ca href=\"#platebody\" data-to=\"platebody\">Robe top\u003c/a>)\u003c/i>\u003c/li>\u003cli>Talk to Keeper Aldric, beside the Heart Shrine\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#platebody\" data-to=\"platebody\">Robe top\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> Easy, easy. Take my hand. There you are. You've just woken on the steps of the Heart Shrine. Light poured out of it, and there you were. That's how all of you come to us. Do you remember your name? Anything at all? No? Don't be frightened. None of you ever do. Here, put this robe on. Click it in your bag and press Equip. Then come and meet Keeper Aldric. He'll want to welcome you himself.\u003c/p>\n\u003cp>\u003cb>Step 2.\u003c/b> Welcome, friend! Welcome to the Emberhall, and to Emberhold. The light made you for a reason. You won't remember anything; none of you do. We call you the Emberborn: heroes the shrines make from the land's own ember, when the land needs them. Until you've proven yourself, you're a Hopeful. And the land does need you. The Withering creeps out of the west, the Ashbound smash our shrines, and the Thornwood grows darker every year. But not today. Today you're safe, and everything here is yours to learn.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"axe","t":"Axe","c":"Items","i":"🪓","sum":"A tool for Woodcutting.","a":[],"ib":[["Helps","Woodcutting"],["Effect","Faster"]],"h":"\u003cp>The axe helps \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a>: you gather faster. Better metal and better wood make it stronger and last longer. See \u003ca href=\"#tools\" data-to=\"tools\">Tools\u003c/a> for every metal and wood. Smiths make them at the anvil with \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>.\u003c/p>","src":["shared/tools.ts"],"w":false,"r":false},{"s":"bat-wings","t":"Bat wings","c":"Items","i":"🦇","sum":"Monster drop. Sells for 9 bronze.","a":["bat wing"],"ib":[["Kind","Monster drops"],["Shop pays","9 bronze"],["Game id","\u003ccode>bat_wing\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#giant-bat\" data-to=\"giant-bat\">Giant bat\u003c/a> (60%).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Half of the recipe for the \u003ca href=\"#mana-potion\" data-to=\"mana-potion\">Mana potion\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"birch-logs","t":"Birch logs","c":"Items","i":"🪵","sum":"Log. Sells for 5 bronze.","a":["birch log"],"ib":[["Kind","Logs"],["Shop pays","5 bronze"],["Game id","\u003ccode>birch_logs\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a> level 10 from a birch tree (5 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Used for tool handles, bows, staffs and arrows, and burned as cooking fuel.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"blessing-scrolls","t":"Blessing scrolls","c":"Items","i":"📜","sum":"Read it for an Emberguard blessing: +50% XP for 30 minutes.","a":["blessing scroll"],"ib":[["Kind","Story items"],["Shop pays","Can't be sold"],["Game id","\u003ccode>blessing_scroll\u003c/code>"]],"h":"\u003cp>Read it for an Emberguard blessing: +50% XP for 30 minutes.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Given in the quest \u003ca href=\"#a-blessing\" data-to=\"a-blessing\">A Blessing\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#lantern-rounds\" data-to=\"lantern-rounds\">Lantern Rounds\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#blessing-the-fields\" data-to=\"blessing-the-fields\">Blessing the Fields\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"blessing-the-fields","t":"Blessing the Fields","c":"Quests","i":"📜","sum":"Act 1 from Sister Celene.","a":[],"ib":[["Part of","Act 1"],["Given by","Sister Celene"],["Where","in the Emberhall, the great white temple in the town square"],["Steps","4"]],"h":"\u003cp>\u003cb>Blessing the Fields\u003c/b> is part of the Act 1 from \u003ca href=\"#sister-celene\" data-to=\"sister-celene\">Sister Celene\u003c/a>, found in the Emberhall, the great white temple in the town square.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#oath-of-the-flame\" data-to=\"oath-of-the-flame\">Oath of the Flame\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Sister Celene\u003c/li>\u003cli>Bless Odo's three fields with Celene\u003c/li>\u003cli>Speak to Farmer Odo\u003c/li>\u003cli>Go back to Sister Celene \u003ci>(you get: 2 × \u003ca href=\"#blessing-scrolls\" data-to=\"blessing-scrolls\">Blessing scrolls\u003c/a>)\u003c/i>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#blessing-scrolls\" data-to=\"blessing-scrolls\">Blessing scrolls\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> Will you walk with me? Every season I bless the farmers' fields, and I'd love the company. The fields are at Farmer Odo's farm, east along the road over the river. We'll bless the north, middle and south fields. The 🗺️ map shows where.\u003c/p>\n\u003cp>\u003cb>Step 3.\u003c/b> Oi! You! And you, Sister! Off my land! I've told you every season: no blessings on my fields. My grandmother never had one, my mother never had one, and our crops grew fine. Go on, the pair of you. Shoo!\u003c/p>\n\u003cp>\u003cb>Step 4.\u003c/b> Poor Odo. He's been like that for years. Some people are frightened of anything they don't understand. Thank you for coming with me. Take these, and bless something of your own.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"blessings","t":"Blessings","c":"Mechanics","i":"📜","sum":"","a":[],"ib":[],"h":"\u003cp>A blessing gives +50% XP for 30 minutes. Read a \u003ca href=\"#blessing-scrolls\" data-to=\"blessing-scrolls\">blessing scroll\u003c/a> to get one.\u003c/p>","src":["shared/story.ts"],"w":false,"r":false},{"s":"blue-lotus","t":"Blue lotus","c":"Items","i":"🪷","sum":"Herbs, roots and crop. Sells for 9 bronze.","a":[],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","9 bronze"],["Game id","\u003ccode>blue_lotus\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dug up with \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> level 10 (8 XP).\u003c/li>\u003cli>Grown with \u003ca href=\"#farming\" data-to=\"farming\">Farming\u003c/a> level 30: ripe after 180 minutes, 1 to 2 a tile.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Half of the recipe for the \u003ca href=\"#mana-potion\" data-to=\"mana-potion\">Mana potion\u003c/a>.\u003c/li>\u003cli>Half of the recipe for the \u003ca href=\"#restoration-draught\" data-to=\"restoration-draught\">Restoration draught\u003c/a>.\u003c/li>\u003cli>Half of the recipe for the \u003ca href=\"#night-sight-potion\" data-to=\"night-sight-potion\">Night sight potion\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"blue-lotus-seeds","t":"Blue lotus seeds","c":"Items","i":"🌱","sum":"Seed. Sells for 12 bronze.","a":["blue lotus seed"],"ib":[["Kind","Seeds"],["Shop pays","12 bronze"],["Game id","\u003ccode>seed_blue_lotus\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#odos-stubborn-field\" data-to=\"odos-stubborn-field\">Odo's Stubborn Field\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"boar","t":"Boar","c":"Monsters","i":"🐗","sum":"A level 7 monster. Fights back if you hit it.","a":[],"ib":[["Level","7"],["Health","22"],["Biggest hit","3"],["Attacks every","2.4s"],["Temper","Fights back if you hit it"],["Out","Day and night"],["Comes back after","54s"],["Coins","None"]],"h":"\u003cp>The \u003cb>Boar\u003c/b> is a level 7 monster with 22 health. Fights back if you hit it.\u003c/p>\n\u003cp>Defeating one gives 7 bonus XP on top of 1 XP per point of damage, plus 14 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>Heartvale, near Pasture (3).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🥩 \u003ca href=\"#raw-boar\" data-to=\"raw-boar\">Raw boar\u003c/a>\u003c/td>\u003ctd>80%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🦷 \u003ca href=\"#boar-tusks\" data-to=\"boar-tusks\">Boar tusks\u003c/a>\u003c/td>\u003ctd>40%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐗 \u003ca href=\"#boar-hides\" data-to=\"boar-hides\">Boar hides\u003c/a>\u003c/td>\u003ctd>50%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"boar-hides","t":"Boar hides","c":"Items","i":"🐗","sum":"Monster drop. Sells for 5 bronze.","a":["boar hide"],"ib":[["Kind","Monster drops"],["Shop pays","5 bronze"],["Game id","\u003ccode>boar_hide\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#boar\" data-to=\"boar\">Boar\u003c/a> (50%).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Tanned into \u003ca href=\"#leather\" data-to=\"leather\">Leather\u003c/a> at Woodworker Rook's rack (\u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a> level 6).\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"boar-tusks","t":"Boar tusks","c":"Items","i":"🦷","sum":"Monster drop. Sells for 8 bronze.","a":["boar tusk"],"ib":[["Kind","Monster drops"],["Shop pays","8 bronze"],["Game id","\u003ccode>boar_tusk\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#boar\" data-to=\"boar\">Boar\u003c/a> (40%).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Half of the recipe for the \u003ca href=\"#swiftness-potion\" data-to=\"swiftness-potion\">Swiftness potion\u003c/a>.\u003c/li>\u003cli>Half of the recipe for the \u003ca href=\"#hunters-brew\" data-to=\"hunters-brew\">Hunter's brew\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"books-in-the-game","t":"Books in the game","c":"Books","i":"📚","sum":"Every book you can take off a shelf.","a":[],"ib":[],"h":"\u003cp>Click a bookshelf to take down a book. None of them are needed for a quest. A few of them don't quite agree with each other, on purpose: the Emberguard's books tell their side of the story. Compare them with \u003ca href=\"#history\" data-to=\"history\">History\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-in-the-emberhall-library\">In the Emberhall library\u003c/h2>\n\u003ch3 id=\"s-the-emberfall\">The Emberfall\u003c/h3>\n\u003cblockquote>\u003cp>Five hundred years ago the land's fire burst up out of the earth under Heartvale, in anger. Embers rained down across the Old Kingdom for a whole year, and the ground fell in where the valley is now. We count the years from it: this is the five hundredth year After the Fall.\u003c/p>\u003cp>No one was to blame. The land's fire is wild, as all fire is. The shrines keep it calm now, and the Emberguard keep the shrines.\u003c/p>\u003cp>Pressed between the last pages, a dry leaf and a note in an old hand: &quot;Fire does not burst up on its own. Ask what was dug.&quot;\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-the-sundering-war-a-short-history-for-new-emberborn\">The Sundering War (a short history for new Emberborn)\u003c/h3>\n\u003cblockquote>\u003cp>Before the war, Embervale was the Old Kingdom: green from the Greyspine to the sea, ruled from a city of white stone in what is now the Barrens.\u003c/p>\u003cp>No one now living remembers how the war began. It ended with the Old Kingdom's crown lost, its city in ruins, and barely enough people left to bury the dead.\u003c/p>\u003cp>It was then that the Archmage Vale built the first shrines, and the first Emberborn woke. The Emberguard have kept his shrines lit ever since.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-on-the-shrines-by-keeper-aldric\">On the Shrines, by Keeper Aldric\u003c/h3>\n\u003cblockquote>\u003cp>A shrine is a door the light comes through. It finds a spark in the Emberheart, deep under Heartvale, and gives it a body.\u003c/p>\u003cp>When an Emberborn falls, the shrine nearest them gathers up what's left of the spark and makes them again. We do not fully understand it. We tend it, as a gardener tends what he did not plant.\u003c/p>\u003cp>Every shrine must be lit by hand, and kept lit. A dark shrine raises no one.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-the-order-of-the-emberguard-its-rule\">The Order of the Emberguard: its Rule\u003c/h3>\n\u003cblockquote>\u003cp>1. Welcome every Emberborn who wakes. 2. Keep every shrine lit. 3. Write down every deed, so the light remembers.\u003c/p>\u003cp>4. Ask nothing of the Rooted (the ordinary folk) but their trust. 5. Honor the worthy with Radiance.\u003c/p>\u003cp>6. The ledgers are for the Keepers alone. (Someone has underlined this one twice.)\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-a-calendar-of-radiance-ceremonies\">A Calendar of Radiance Ceremonies\u003c/h3>\n\u003cblockquote>\u003cp>A long list of names and years, one every few decades. Halric. Ida. Tilda. Orla. Dozens more.\u003c/p>\u003cp>Beside each name, in a neat hand: &quot;light returned to the Heart Shrine&quot;. Beside a few, in a different ink: &quot;spark flawed&quot;.\u003c/p>\u003cp>One line near the end has been cut out of the page with a very sharp knife.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-halric-the-dawnbringer-a-ballad\">Halric the Dawnbringer: a Ballad\u003c/h3>\n\u003cblockquote>\u003cp>Eleven times he fell upon the stone, / eleven times the morning brought him home...\u003c/p>\u003cp>The rest is mostly about his shield, which seems to have been very large.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-the-withering-notes-from-the-barrens\">The Withering: notes from the Barrens\u003c/h3>\n\u003cblockquote>\u003cp>It began in the far west, where the Old Kingdom's city stood. Grass greys, then crumbles. Animals grow thin and angry. Wells taste of ash.\u003c/p>\u003cp>The Ashbound blame the shrines. This is, of course, nonsense. The shrines are the only light the Barrens have left.\u003c/p>\u003cp>Note in the margin, in pencil: &quot;Then why is it worst where the shrines are brightest?&quot; It has been rubbed half out.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-an-emberborns-first-week-a-guide\">An Emberborn's First Week (a guide)\u003c/h3>\n\u003cblockquote>\u003cp>Do not be frightened that you remember nothing. None of you do. A new spark has no past, only a future.\u003c/p>\u003cp>Learn a trade. Eat well. Light a lantern when you can. And when you fall, as you will, the shrine brings you home.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-the-grey-fever-and-orla-the-kind\">The Grey Fever, and Orla the Kind\u003c/h3>\n\u003cblockquote>\u003cp>Forty winters ago a fever came down the Westroad and emptied whole villages. Orla went from door to door with nothing but a basket and a kettle.\u003c/p>\u003cp>She caught the fever nine times. Nine times the shrine sent her back, a little paler each time. Folk say that by the end she was almost see-through.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"s-in-the-mages-guild\">In the Mages' Guild\u003c/h2>\n\u003ch3 id=\"s-emberstone-its-nature-and-uses\">Emberstone: its Nature and Uses\u003c/h3>\n\u003cblockquote>\u003cp>Emberstone grows only where the Emberheart's warmth runs close under the rock: the crystal caves above all.\u003c/p>\u003cp>It holds power the way a sponge holds water. Cut into gems, it feeds enchantments. The Emberguard buy every cartload we can dig; what they do with it, they don't say.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-first-spells-by-archmage-rowan\">First Spells, by Archmage Rowan\u003c/h3>\n\u003cblockquote>\u003cp>A spell is a shape you make with your mind, and mana is what you fill it with. Small shapes first: a spark, a bolt.\u003c/p>\u003cp>Cloth helps. Nobody is sure why. Metal hinders. Everybody is sure why: try thinking clearly in a helmet.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-vale-archmage-builder-of-shrines\">Vale: Archmage, Builder of Shrines\u003c/h3>\n\u003cblockquote>\u003cp>The greatest mage Embervale ever had. He tapped the Emberheart itself to build the shrines, and saved what was left of the land.\u003c/p>\u003cp>He is said to have died soon after the war. Oddly, no one knows where he is buried.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-on-enchanting\">On Enchanting\u003c/h3>\n\u003cblockquote>\u003cp>An enchantment is a little piece of a refined emberstone's power, woven into a thing. Weapons take fire and frost; armor takes warding.\u003c/p>\u003cp>Enchanter Vale of the Emberhall is the finest enchanter living. He is very old. Some say older than the Guild.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-the-emberheart\">The Emberheart\u003c/h3>\n\u003cblockquote>\u003cp>Deep under Heartvale there is said to be a cavern where a great fire burns, beating as slow as a heart: the Emberheart, where every living thing's spark comes from.\u003c/p>\u003cp>It is not endless. Old Guild records say it was brighter once. The records stop saying anything about it at all, about three hundred years ago.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"s-in-town-houses-and-the-inn\">In town houses and the inn\u003c/h2>\n\u003ch3 id=\"s-emberhold-a-town-history\">Emberhold: a Town History\u003c/h3>\n\u003cblockquote>\u003cp>Emberhold grew up around the Emberhall after the war: first tents, then timber, then stone. The square was a sheep market before it was a square.\u003c/p>\u003cp>The well in the square has never run dry. Captain Bryn's grandfather swore he saw a fish in it once.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-the-fishers-almanac\">The Fisher's Almanac\u003c/h3>\n\u003cblockquote>\u003cp>Minnows in the shallows, trout by the town, perch to the south, pike out west. Salmon in the river, if you're patient.\u003c/p>\u003cp>Never fish with a borrowed rod. Never whistle on the water. Always thank the lake.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-herbs-of-the-valley\">Herbs of the Valley\u003c/h3>\n\u003cblockquote>\u003cp>Wild root: dig it near the lake. Red cap: find it under oaks. Moonpetal: only at night, and only if you're lucky.\u003c/p>\u003cp>Herbalist Wren adds, in her own hand: the plants by the shrines are dying first. Why?\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-tams-ledger-old-for-reference\">Tam's Ledger (old, for 'reference')\u003c/h3>\n\u003cblockquote>\u003cp>Rods: 12. Pots: 8. Stew: 30 bowls (Maren's recipe). Potions: 6 (don't ask Moss where he gets the slime).\u003c/p>\u003cp>Owed by Captain Bryn: one bottle, one favour, and an apology.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-a-childs-book-of-the-emberborn\">A Child's Book of the Emberborn\u003c/h3>\n\u003cblockquote>\u003cp>&quot;Where do heroes come from?&quot; asked little Pip. &quot;From the light,&quot; said his mother. &quot;And where do they go?&quot; &quot;Back to the light, when they're done.&quot;\u003c/p>\u003cp>Pip thought about this for a long time. &quot;That's sad,&quot; he said. His mother didn't answer.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-old-marens-recipes\">Old Maren's Recipes\u003c/h3>\n\u003cblockquote>\u003cp>Stew: anything you've got, a good fire, and patience. The more you put in, the easier it is to burn, so watch it close.\u003c/p>\u003cp>On the last page, in a shaky hand: &quot;Some fires should go out. Remember that.&quot;\u003c/p>\u003c/blockquote>","src":["shared/lore.ts"],"w":false,"r":false},{"s":"boots","t":"Boots","c":"Items","i":"🥾","sum":"Armor for the feet slot.","a":[],"ib":[["Slot","feet"],["Bars to make","1"],["Armor (bronze)","1"]],"h":"\u003cp>🥾 A boots goes in your feet slot. A bronze one gives 1 armor and takes 1 bar to make with \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>; better metal multiplies it. Leather and cloth versions are made with \u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a>. See \u003ca href=\"#armor\" data-to=\"armor\">Armor\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"bounties","t":"Bounties","c":"Mechanics","i":"📋","sum":"Jobs on the bounty board that pay double.","a":[],"ib":[],"h":"\u003cp>The bounty board in the square shows 5 jobs a day. Bring the full amount and they pay double what a shop would, plus \u003ca href=\"#renown\" data-to=\"renown\">Renown\u003c/a>. A new job costs 50 bronze.\u003c/p>\n\u003cp>The \u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">Mages' Guild\u003c/a> has its own board of magic jobs (trap ember, brew, enchant), and its own ranks:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Guild rank\u003c/th>\u003cth>Points\u003c/th>\u003cth>Chest size\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Initiate\u003c/td>\u003ctd>0\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Apprentice\u003c/td>\u003ctd>5\u003c/td>\u003ctd>8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Adept\u003c/td>\u003ctd>15\u003c/td>\u003ctd>12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Conjurer\u003c/td>\u003ctd>30\u003c/td>\u003ctd>16\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Enchanter\u003c/td>\u003ctd>50\u003c/td>\u003ctd>20\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Magus\u003c/td>\u003ctd>80\u003c/td>\u003ctd>24\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Archmage\u003c/td>\u003ctd>120\u003c/td>\u003ctd>28\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Enchanted chests: 4 slots to start, 4 more each time you expand (2, 4, 7, 12, 20, 30 gold), rent 1 gold.\u003c/p>","src":["shared/bounties.ts","shared/guild.ts"],"w":false,"r":false},{"s":"bow","t":"Bow","c":"Items","i":"🏹","sum":"A ranged weapon.","a":[],"ib":[["Style","Ranged"],["Level","10"],["Biggest hit","4 + metal"],["Attacks every","3s"],["Range","6 tiles"],["Hands","Two (no shield)"]],"h":"\u003cp>🏹 The bow needs \u003ca href=\"#ranged\" data-to=\"ranged\">Ranged\u003c/a> level 10. Its biggest hit is 4, plus its metal's bonus. It attacks every 3s and reaches 6 tiles. It takes both hands, so no shield. See \u003ca href=\"#weapons\" data-to=\"weapons\">Weapons\u003c/a> and \u003ca href=\"#combat\" data-to=\"combat\">Combat\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"brightcrown","t":"Brightcrown","c":"Places","i":"🏛️","sum":"The Old Kingdom's capital, destroyed in the Sundering War. Now the Sundered Crown.","a":[],"ib":[],"h":"\u003cp>\u003cb>Brightcrown\u003c/b> was the capital of the \u003ca href=\"#old-kingdom\" data-to=\"old-kingdom\">Old Kingdom\u003c/a>, a city of white stone in the west. The \u003ca href=\"#ember-crown\" data-to=\"ember-crown\">Ember Crown\u003c/a>'s blast tore it apart in the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>, leaving the crater called \u003ca href=\"#the-sundered-crown\" data-to=\"the-sundered-crown\">The Sundered Crown\u003c/a>. A broken milestone on the King's Road in the Barrens still reads \u003ci>&quot;Brightcrown, 40 miles.&quot;\u003c/i>\u003c/p>","src":["wiki/pages/brightcrown.md"],"w":true,"r":false},{"s":"bronze-bar","t":"Bronze bar","c":"Items","i":"🧈","sum":"Bar. Sells for 11 bronze.","a":[],"ib":[["Kind","Bars"],["Shop pays","11 bronze"],["Game id","\u003ccode>bronze_bar\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#copper-ore\" data-to=\"copper-ore\">Copper ore\u003c/a>, \u003ca href=\"#tin-ore\" data-to=\"tin-ore\">Tin ore\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#hammer-and-fire\" data-to=\"hammer-and-fire\">Hammer and fire\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"brother-oren","t":"Brother Oren","c":"People","i":"🗿","sum":"Gives tours of the statues of the Extinguished.","a":[],"ib":[["Found in","The Emberhall"],["Game id","\u003ccode>oren\u003c/code>"]],"h":"\u003cp>\u003cb>Brother Oren\u003c/b> gives tours of the statues in \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>: each of \u003ca href=\"#the-extinguished\" data-to=\"the-extinguished\">The Extinguished\u003c/a>, and the empty plinth. He tells the Emberguard's story of the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>. Honest.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;These are the Extinguished: the greatest heroes the shrines ever raised. Perhaps one day, you.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>.\u003c/p>","src":["wiki/pages/person-oren.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":true},{"s":"brother-tomas","t":"Brother Tomas","c":"People","i":"🗝️","sum":"Keeper of the Emberhall's keys.","a":[],"ib":[["Found in","The Emberhall"],["Game id","\u003ccode>tomas\u003c/code>"]],"h":"\u003cp>\u003cb>Brother Tomas\u003c/b> keeps the keys of \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>, including the locked ledger room that's only for the Keepers. Honest. He has noticed the ledger room is opened at night.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;The ledger room? Only for the Keepers, I'm afraid. Just old accounts. Very dull.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>.\u003c/p>","src":["wiki/pages/person-tomas.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"buying-and-selling","t":"Buying and selling","c":"Quests","i":"📜","sum":"Lessons from Shopkeeper Tam.","a":[],"ib":[["Part of","Lessons"],["Given by","Shopkeeper Tam"],["Where","in the General Store, just west of the square"],["Steps","4"]],"h":"\u003cp>\u003cb>Buying and selling\u003c/b> is a lesson from \u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>, found in the General Store, just west of the square.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Shopkeeper Tam at the General Store\u003c/li>\u003cli>Buy something from any shop (open its Buy tab)\u003c/li>\u003cli>Sell 3 things to any shop\u003c/li>\u003cli>Go back to Shopkeeper Tam for your reward\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Rewards:\u003c/b> 50 bronze.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> Ah, a customer! I'm Tam. I'll buy anything you bring me, but the trainers only buy what their own trade makes: logs for Holt, ore for Greta, and so on. They all pay the same price. Every coin you earn selling trains your Trading skill. Trading is part of Charisma, and the higher your Charisma, the more shops pay you and the less they charge. Let's see you haggle. Buy something from me first: open my Buy tab. A potato will do.\u003c/p>\n\u003cp>\u003cb>Step 4.\u003c/b> A natural trader! Remember: tap 🔒 on your bag to keep things safe from Sell all. Here's a little something for your trouble. Come back any time. Mind you, trade's not what it was. The routes west have all closed since the Barrens went bad.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"captain-bryn","t":"Captain Bryn","c":"People","i":"📋","sum":"Runs the bounty board and hands out Renown ranks.","a":[],"ib":[["Found in","Heartvale"],["Shop","Yes"],["Game id","\u003ccode>bryn\u003c/code>"]],"h":"\u003cp>\u003cb>Captain Bryn\u003c/b> runs the bounty board in the square and hands out \u003ca href=\"#renown\" data-to=\"renown\">Renown\u003c/a> ranks. He puts bounties on \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a> because the Emberguard ask. Later in the story he has to pick a side. His grandfather swore he saw a fish in the square's well.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;Folk round here need a hand with all sorts. Check the board.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#odd-jobs\" data-to=\"odd-jobs\">Odd jobs\u003c/a> (lessons)\u003c/li>\u003cli>\u003ca href=\"#highway-robbery\" data-to=\"highway-robbery\">Highway robbery\u003c/a> (side quest)\u003c/li>\u003cli>\u003ca href=\"#ash-on-the-road\" data-to=\"ash-on-the-road\">Ash on the Road\u003c/a> (Act 1)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Shop:\u003c/b> buys monster drops. Sells: \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>. See \u003ca href=\"#shops\" data-to=\"shops\">Shops\u003c/a>.\u003c/p>","src":["wiki/pages/person-bryn.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"carrot-seeds","t":"Carrot seeds","c":"Items","i":"🌱","sum":"Seed. Sells for 1 bronze.","a":["carrot seed"],"ib":[["Kind","Seeds"],["Shop pays","1 bronze"],["Game id","\u003ccode>seed_carrot\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"carrots","t":"Carrots","c":"Items","i":"🥕","sum":"Herbs, roots and crop. Sells for 1 bronze.","a":["carrot"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","1 bronze"],["Game id","\u003ccode>carrot\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Grown with \u003ca href=\"#farming\" data-to=\"farming\">Farming\u003c/a> level 4: ripe after 15 minutes, 3 to 5 a tile.\u003c/li>\u003cli>Sold by \u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (vegetables): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"cave-spider","t":"Cave spider","c":"Monsters","i":"🕷️","sum":"A level 14 monster. Attacks on sight.","a":[],"ib":[["Level","14"],["Health","34"],["Biggest hit","5"],["Attacks every","1.8s"],["Temper","Attacks on sight"],["Out","Day and night"],["Comes back after","66s"],["Coins","2 to 10 bronze"]],"h":"\u003cp>The \u003cb>Cave spider\u003c/b> is a level 14 monster with 34 health. Attacks on sight.\u003c/p>\n\u003cp>Defeating one gives 14 bonus XP on top of 1 XP per point of damage, plus 28 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>The spider cave (3).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🕸️ \u003ca href=\"#spider-silk\" data-to=\"spider-silk\">Spider silk\u003c/a>\u003c/td>\u003ctd>50%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧪 \u003ca href=\"#venom-sacs\" data-to=\"venom-sacs\">Venom sacs\u003c/a>\u003c/td>\u003ctd>30%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>It also drops 2 to 10 bronze coins.\u003c/p>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"charisma","t":"Charisma","c":"Skills","i":"🤝","sum":"Dealing with people. Better shop prices.","a":[],"ib":[["Kind","Discipline"],["Skills","Trading, Leadership, Renown"]],"h":"\u003cp>🤝 \u003cb>Charisma\u003c/b> is one of the five \u003ca href=\"#disciplines\" data-to=\"disciplines\">Disciplines\u003c/a>. Dealing with people. Better shop prices. Its level is the average of the levels of its skills you've learned, rounded down.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Skill\u003c/th>\u003cth>What it is\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>💰 \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a>\u003c/td>\u003ctd>Trained by selling things to any shop (the more it's worth, the more XP). Each level makes prices a little better, and trainers sell you rarer things as it goes up.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🚩 \u003ca href=\"#leadership\" data-to=\"leadership\">Leadership\u003c/a>\u003c/td>\u003ctd>Trained by leading a party (click another player to invite them): the leader earns it when the party finishes quest steps and defeats monsters together. Party members near the leader get a little extra XP from kills. Huntmaster Kael teaches it in his Wolf Hunt.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📋 \u003ca href=\"#renown\" data-to=\"renown\">Renown\u003c/a>\u003c/td>\u003ctd>Trained by finishing bounties, on the bounty board and the Mages' Guild board. Bounties get bigger and pay more as it goes up, and Captain Bryn gives you ranks and titles (Wanderer at 5, Trusted at 15, Champion at 30).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/stats.ts"],"w":false,"r":false},{"s":"chicken","t":"Chicken","c":"Monsters","i":"🐔","sum":"A level 1 monster. Never fights back.","a":[],"ib":[["Level","1"],["Health","4"],["Biggest hit","0"],["Attacks every","2.4s"],["Temper","Never fights back"],["Out","Day and night"],["Comes back after","30s"],["Coins","None"]],"h":"\u003cp>The \u003cb>Chicken\u003c/b> is a level 1 monster with 4 health. Never fights back.\u003c/p>\n\u003cp>Defeating one gives 1 bonus XP on top of 1 XP per point of damage, plus 2 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>Heartvale, near the Emberhall (5), Heartvale, near the lake (1).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🪶 \u003ca href=\"#feathers\" data-to=\"feathers\">Feathers\u003c/a>\u003c/td>\u003ctd>60%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍗 \u003ca href=\"#raw-chicken\" data-to=\"raw-chicken\">Raw chicken\u003c/a>\u003c/td>\u003ctd>70%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"chum-bait","t":"Chum bait","c":"Items","i":"🪣","sum":"Materials and food. Sells for 3 bronze.","a":[],"ib":[["Kind","Materials and food"],["Shop pays","3 bronze"],["Game id","\u003ccode>bait_chum\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#food-scraps\" data-to=\"food-scraps\">Food scraps\u003c/a>, \u003ca href=\"#food-scraps\" data-to=\"food-scraps\">Food scraps\u003c/a>, \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cp>Nowhere in the game yet.\u003c/p>","src":["shared/items.ts"],"w":false,"r":false},{"s":"cloth","t":"Cloth","c":"Items","i":"🧶","sum":"Materials and food. Sells for 93 bronze.","a":["piece of cloth"],"ib":[["Kind","Materials and food"],["Shop pays","93 bronze"],["Game id","\u003ccode>cloth\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#thread\" data-to=\"thread\">Thread\u003c/a>, \u003ca href=\"#thread\" data-to=\"thread\">Thread\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cp>Nowhere in the game yet.\u003c/p>","src":["shared/items.ts"],"w":false,"r":false},{"s":"coal","t":"Coal","c":"Items","i":"🪨","sum":"Ore. Sells for 18 bronze.","a":[],"ib":[["Kind","Ore"],["Shop pays","18 bronze"],["Game id","\u003ccode>coal\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a> level 30 from a coal rock (14 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#steel-bar\" data-to=\"steel-bar\">Steel bar\u003c/a>.\u003c/li>\u003cli>Goes into \u003ca href=\"#mithril-bar\" data-to=\"mithril-bar\">Mithril bar\u003c/a>.\u003c/li>\u003cli>Goes into \u003ca href=\"#iridium-bar\" data-to=\"iridium-bar\">Iridium bar\u003c/a>.\u003c/li>\u003cli>Smelted into \u003ca href=\"#steel-bar\" data-to=\"steel-bar\">Steel bar\u003c/a>.\u003c/li>\u003cli>Smelted into \u003ca href=\"#mithril-bar\" data-to=\"mithril-bar\">Mithril bar\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"combat","t":"Combat","c":"Mechanics","i":"⚔️","sum":"How fighting works.","a":[],"ib":[],"h":"\u003cp>Hold a \u003ca href=\"#weapons\" data-to=\"weapons\">weapon\u003c/a> and click a monster. Every hit gives XP to the skill you used (\u003ca href=\"#melee\" data-to=\"melee\">Melee\u003c/a>, \u003ca href=\"#ranged\" data-to=\"ranged\">Ranged\u003c/a> or \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a>), to that weapon's or spell's \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>, and to that monster's Mastery. Getting attacked trains \u003ca href=\"#defense\" data-to=\"defense\">Defense\u003c/a>. With nothing in your hand you punch.\u003c/p>\n\u003cul>\u003cli>Each weapon attack costs 1 stamina; spells cost mana.\u003c/li>\u003cli>Mana comes back 1 every 6 seconds.\u003c/li>\u003cli>Health comes back 1 a minute (1 min); potions are the quick way. A \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a> gives 30.\u003c/li>\u003cli>One game tick is 0.6 seconds.\u003c/li>\u003c/ul>\n\u003cp>Mastery of a weapon or monster makes you hit more often and harder, and Mastery of a monster makes it drop things more often. When you fall, you wake at a shrine (see \u003ca href=\"#the-tithe\" data-to=\"the-tithe\">The Tithe\u003c/a>).\u003c/p>","src":["shared/combat.ts"],"w":false,"r":false},{"s":"cooking","t":"Cooking","c":"Skills","i":"🍲","sum":"Use the stove in the town square, by Old Maren on the Emberhall's steps, to cook meals (stew, stir fry, curry, roast) from fish, meat and vegetables. Meals give back lots of stamina.","a":[],"ib":[["Discipline","🤲 Dexterity"],["Taught by","\u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>"],["Max level","99"]],"h":"\u003cp>🍲 \u003cb>Cooking\u003c/b> is a skill in \u003ca href=\"#dexterity\" data-to=\"dexterity\">Dexterity\u003c/a>. Use the stove in the town square, by Old Maren on the Emberhall's steps, to cook meals (stew, stir fry, curry, roast) from fish, meat and vegetables. Meals give back lots of stamina.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#living-off-the-land\" data-to=\"living-off-the-land\">Living off the land\u003c/a>, from \u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🍲 Bigger pot\u003c/td>\u003ctd>+1 ingredient slot\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🎯 Steady hands\u003c/td>\u003ctd>6% fewer failures\u003c/td>\u003c/tr>\u003ctr>\u003ctd>💪 Hearty meals\u003c/td>\u003ctd>meals give 5% more stamina\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-dishes\">Dishes\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Dish\u003c/th>\u003cth>Level\u003c/th>\u003cth>Good with\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🍲 Stew\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Takes anything, and gets the most from a good fire\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🥘 Stir fry\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Best with chicken and beef. No fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍛 Curry\u003c/td>\u003ctd>5\u003c/td>\u003ctd>Best with fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🥩 Steak\u003c/td>\u003ctd>4\u003c/td>\u003ctd>Just meat (beef or boar), with a little veg on the side\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍖 Roast\u003c/td>\u003ctd>7\u003c/td>\u003ctd>Best with beef, then chicken. No fish\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>See \u003ca href=\"#meals\" data-to=\"meals\">Meals\u003c/a>.\u003c/p>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"copper-ore","t":"Copper ore","c":"Items","i":"🪨","sum":"Ore. Sells for 4 bronze.","a":[],"ib":[["Kind","Ore"],["Shop pays","4 bronze"],["Game i
