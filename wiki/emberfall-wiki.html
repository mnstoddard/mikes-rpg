,"ib":[["Kind","Ore"],["Shop pays","12 bronze"],["Game id","\u003ccode>iron_ore\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a> level 20 from a iron rock (10 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#iron-bar\" data-to=\"iron-bar\">Iron bar\u003c/a>.\u003c/li>\u003cli>Goes into \u003ca href=\"#steel-bar\" data-to=\"steel-bar\">Steel bar\u003c/a>.\u003c/li>\u003cli>Smelted into \u003ca href=\"#iron-bar\" data-to=\"iron-bar\">Iron bar\u003c/a>.\u003c/li>\u003cli>Smelted into \u003ca href=\"#steel-bar\" data-to=\"steel-bar\">Steel bar\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"ironwood-logs","t":"Ironwood logs","c":"Items","i":"🪵","sum":"Log. Sells for 50 bronze.","a":["ironwood log"],"ib":[["Kind","Logs"],["Shop pays","50 bronze"],["Game id","\u003ccode>ironwood_logs\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a> level 50 from a ironwood tree (28 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Used for tool handles, bows, staffs and arrows, and burned as cooking fuel.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"items","t":"Items","c":"Items","i":"🎒","sum":"Every item, grouped.","a":[],"ib":[],"h":"\u003cp>Every item with its own page, grouped by kind, with what a shop pays for one (before Mastery and Charisma). Tools, weapons, armor, meals, potions and gems come in many versions, so each has a page of its own instead: \u003ca href=\"#tools\" data-to=\"tools\">Tools\u003c/a>, \u003ca href=\"#weapons\" data-to=\"weapons\">Weapons\u003c/a>, \u003ca href=\"#armor\" data-to=\"armor\">Armor\u003c/a>, \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>, \u003ca href=\"#potions\" data-to=\"potions\">Potions\u003c/a>, \u003ca href=\"#gems-and-jewelry\" data-to=\"gems-and-jewelry\">Gems and jewelry\u003c/a>, \u003ca href=\"#enchanting\" data-to=\"enchanting\">Enchanting\u003c/a>, \u003ca href=\"#arrows\" data-to=\"arrows\">Arrows\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-logs\">Logs\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Shop pays\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🪵 \u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>\u003c/td>\u003ctd>1 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪵 \u003ca href=\"#oak-logs\" data-to=\"oak-logs\">Oak logs\u003c/a>\u003c/td>\u003ctd>3 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪵 \u003ca href=\"#birch-logs\" data-to=\"birch-logs\">Birch logs\u003c/a>\u003c/td>\u003ctd>5 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪵 \u003ca href=\"#maple-logs\" data-to=\"maple-logs\">Maple logs\u003c/a>\u003c/td>\u003ctd>10 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪵 \u003ca href=\"#yew-logs\" data-to=\"yew-logs\">Yew logs\u003c/a>\u003c/td>\u003ctd>25 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪵 \u003ca href=\"#ironwood-logs\" data-to=\"ironwood-logs\">Ironwood logs\u003c/a>\u003c/td>\u003ctd>50 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪵 \u003ca href=\"#elderwood-logs\" data-to=\"elderwood-logs\">Elderwood logs\u003c/a>\u003c/td>\u003ctd>100 bronze\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-ore\">Ore\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Shop pays\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🪨 \u003ca href=\"#copper-ore\" data-to=\"copper-ore\">Copper ore\u003c/a>\u003c/td>\u003ctd>4 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪨 \u003ca href=\"#tin-ore\" data-to=\"tin-ore\">Tin ore\u003c/a>\u003c/td>\u003ctd>5 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪨 \u003ca href=\"#iron-ore\" data-to=\"iron-ore\">Iron ore\u003c/a>\u003c/td>\u003ctd>12 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪨 \u003ca href=\"#coal\" data-to=\"coal\">Coal\u003c/a>\u003c/td>\u003ctd>18 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪨 \u003ca href=\"#silver-ore\" data-to=\"silver-ore\">Silver ore\u003c/a>\u003c/td>\u003ctd>30 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪨 \u003ca href=\"#gold-ore\" data-to=\"gold-ore\">Gold ore\u003c/a>\u003c/td>\u003ctd>60 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪨 \u003ca href=\"#platinum-ore\" data-to=\"platinum-ore\">Platinum ore\u003c/a>\u003c/td>\u003ctd>160 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪨 \u003ca href=\"#iridium-ore\" data-to=\"iridium-ore\">Iridium ore\u003c/a>\u003c/td>\u003ctd>220 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪨 \u003ca href=\"#mithril-ore\" data-to=\"mithril-ore\">Mithril ore\u003c/a>\u003c/td>\u003ctd>120 bronze\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-bars\">Bars\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Shop pays\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🧈 \u003ca href=\"#bronze-bar\" data-to=\"bronze-bar\">Bronze bar\u003c/a>\u003c/td>\u003ctd>11 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧈 \u003ca href=\"#iron-bar\" data-to=\"iron-bar\">Iron bar\u003c/a>\u003c/td>\u003ctd>30 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧈 \u003ca href=\"#steel-bar\" data-to=\"steel-bar\">Steel bar\u003c/a>\u003c/td>\u003ctd>37 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧈 \u003ca href=\"#mithril-bar\" data-to=\"mithril-bar\">Mithril bar\u003c/a>\u003c/td>\u003ctd>172 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧈 \u003ca href=\"#silver-bar\" data-to=\"silver-bar\">Silver bar\u003c/a>\u003c/td>\u003ctd>75 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧈 \u003ca href=\"#gold-bar\" data-to=\"gold-bar\">Gold bar\u003c/a>\u003c/td>\u003ctd>150 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧈 \u003ca href=\"#platinum-bar\" data-to=\"platinum-bar\">Platinum bar\u003c/a>\u003c/td>\u003ctd>400 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧈 \u003ca href=\"#iridium-bar\" data-to=\"iridium-bar\">Iridium bar\u003c/a>\u003c/td>\u003ctd>572 bronze\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-fish\">Fish\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Shop pays\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🐟 \u003ca href=\"#minnow\" data-to=\"minnow\">Minnow\u003c/a>\u003c/td>\u003ctd>3 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐟 \u003ca href=\"#trout\" data-to=\"trout\">Trout\u003c/a>\u003c/td>\u003ctd>5 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐠 \u003ca href=\"#perch\" data-to=\"perch\">Perch\u003c/a>\u003c/td>\u003ctd>7 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐟 \u003ca href=\"#salmon\" data-to=\"salmon\">Salmon\u003c/a>\u003c/td>\u003ctd>14 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐟 \u003ca href=\"#pike\" data-to=\"pike\">Pike\u003c/a>\u003c/td>\u003ctd>22 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐡 \u003ca href=\"#tuna\" data-to=\"tuna\">Tuna\u003c/a>\u003c/td>\u003ctd>40 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐬 \u003ca href=\"#swordfish\" data-to=\"swordfish\">Swordfish\u003c/a>\u003c/td>\u003ctd>70 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐍 \u003ca href=\"#eel\" data-to=\"eel\">Eel\u003c/a>\u003c/td>\u003ctd>120 bronze\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-herbs-roots-and-crops\">Herbs, roots and crops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Shop pays\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🌿 \ \u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Shop pays\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>📜 \u003ca href=\"#blessing-scrolls\" data-to=\"blessing-scrolls\">Blessing scrolls\u003c/a>\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🏮 \u003ca href=\"#your-lantern\" data-to=\"your-lantern\">Your lantern\u003c/a>\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🗿 \u003ca href=\"#shrine-totems\" data-to=\"shrine-totems\">Shrine totems\u003c/a>\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>✉️ \u003ca href=\"#folded-note\" data-to=\"folded-note\">Folded note\u003c/a>\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📝 \u003ca href=\"#scrawled-note\" data-to=\"scrawled-note\">Scrawled note\u003c/a>\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪬 \u003ca href=\"#marens-worn-charm\" data-to=\"marens-worn-charm\">Maren's worn charm\u003c/a>\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📒 \u003ca href=\"#holts-notes\" data-to=\"holts-notes\">Holt's notes\u003c/a>\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/items.ts"],"w":false,"r":false},{"s":"keeper-aldric","t":"Keeper Aldric","c":"People","i":"🕯️","sum":"Welcomes every new Emberborn, and decides who's ready for the trials.","a":[],"ib":[["Found in","The Emberhall"],["Game id","\u003ccode>aldric\u003c/code>"]],"h":"\u003cp>\u003cb>Keeper Aldric\u003c/b> is warm and cheerful. He welcomes every new \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> at \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>, gives the Prologue and Act 1 quests, and decides who is ready for \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>'s trials. He wrote \u003ci>On the Shrines\u003c/i> (see \u003ca href=\"#books-in-the-game\" data-to=\"books-in-the-game\">Books in the game\u003c/a>).\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>He's one of \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>: not a member of the old Circle, but one of the Emberguard Vale rewarded after the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a> with a share of the siphon. He has been welcoming Hopefuls, and judging which of them will burn brightest, for three hundred years.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;Welcome, friend! The Emberheart made you for a reason. Everything here is yours to learn.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#the-hall-of-embers\" data-to=\"the-hall-of-embers\">The Hall of Embers\u003c/a> (Prologue)\u003c/li>\u003cli>\u003ca href=\"#light-the-way\" data-to=\"light-the-way\">Light the Way\u003c/a> (Prologue)\u003c/li>\u003cli>\u003ca href=\"#the-training-ground\" data-to=\"the-training-ground\">The Training Ground\u003c/a> (Prologue)\u003c/li>\u003cli>\u003ca href=\"#oath-of-the-flame\" data-to=\"oath-of-the-flame\">Oath of the Flame\u003c/a> (Prologue)\u003c/li>\u003cli>\u003ca href=\"#lantern-rounds\" data-to=\"lantern-rounds\">Lantern Rounds\u003c/a> (Act 1)\u003c/li>\u003cli>\u003ca href=\"#the-first-tithe\" data-to=\"the-first-tithe\">The First Tithe\u003c/a> (Act 1)\u003c/li>\u003cli>\u003ca href=\"#rebuild-the-shrine\" data-to=\"rebuild-the-shrine\">Rebuild the Shrine\u003c/a> (Act 1)\u003c/li>\u003cli>\u003ca href=\"#a-flame-in-the-thornwood\" data-to=\"a-flame-in-the-thornwood\">A Flame in the Thornwood\u003c/a> (Act 1)\u003c/li>\u003c/ul>","src":["wiki/pages/person-aldric.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"king-aldemar-xviii","t":"King Aldemar XVIII","c":"People","i":"🤴","sum":"The last king of Aldmera, and the leader of the Ember Circle. Murdered on the night of the Emberfall.","a":["King Aldemar","Aldemar","Aldemar XVIII"],"ib":[["Ruled","\u003ca href=\"#aldmera\" data-to=\"aldmera\">Aldmera\u003c/a>, from \u003ca href=\"#whitestone\" data-to=\"whitestone\">Whitestone\u003c/a>"],["Led","\u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a>"],["Died","Year 0"]],"h":"\u003cp>\u003cb>King Aldemar XVIII\u003c/b> was the eighteenth and last king of \u003ca href=\"#aldmera\" data-to=\"aldmera\">Aldmera\u003c/a>, and the leader of \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a>. He was a mage as well as a king, and the great working to harness \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a> was his plan: to send its warmth into every corner of the kingdom, so no one in Aldmera would go hungry or cold again. He wore the \u003ca href=\"#ember-crown\" data-to=\"ember-crown\">Ember Crown\u003c/a>, which let him steer the working.\u003c/p>\n\u003cp>He died on the night the working broke loose, and his kingdom died with him.\u003c/p>\n\u003cp>\u003cb>What everyone is taught:\u003c/b> \u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a>, his own second, struck him down and seized the working. That was the Emberfall.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>\u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a> killed him, and twisted the working so its power poured into the Circle instead of the land. Vale took the Ember Crown from his body. The rest of the Circle believe the king died in the burst.\u003c/p>\u003c/div>\n\u003cp>His statue lies buried in \u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a>, holding a crown with a glowing stone in it (a planned side quest, \u003ci>Aldemar's Statue\u003c/i>).\u003c/p>","src":["wiki/pages/king-aldemar.md"],"w":true,"r":false},{"s":"lantern-rounds","t":"Lantern Rounds","c":"Quests","i":"📜","sum":"Act 1 from Keeper Aldric.","a":[],"ib":[["Part of","Act 1"],["Given by","Keeper Aldric"],["Where","in the Emberhall, the great white temple on Ember Hill, in the middle of Emberhold"],["Steps","3"]],"h":"\u003cp>\u003cb>Lantern Rounds\u003c/b> is part of the Act 1 from \u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>, found in the Emberhall, the great white temple on Ember Hill, in the middle of Emberhold.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#oath-of-the-flame\" data-to=\"oath-of-the-flame\">Oath of the Flame\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-keeper-aldric\">Step 1: Talk to Keeper Aldric\u003c/h3>\n\u003cp>\u003cb>Keeper Aldric:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Your first job as an Ember: the lantern rounds. There are six shrine lanterns round Heartvale, and they need lighting.\u003c/p>\u003cp>By the quarry road up north, by the lake, by the Hearthstone Inn on Trainer Row, at the farm over the river, on the coast, and by Kael's gate. The 🗺️ map marks them.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-step-2-light-the-6-shrine-lanterns-round-heartvale\">Step 2: Light the 6 shrine lanterns round Heartvale\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Quarry road (north), the lake (west), the Hearthstone Inn (Trainer Row), the farm (east, over the river), the coast (far east) and Kael's gate (south). Open the 🗺️ map to see them.\u003c/li>\u003c/ul>\n\u003cp>\u003cb>What they say when you visit:\u003c/b>\u003c/p>\n\u003cul>\u003cli>Shrine lantern: You light the lantern by the quarry road. The miners wave.\u003c/li>\u003cli>Shrine lantern: You light the lantern by the lake. Its light shivers on the water.\u003c/li>\u003cli>Shrine lantern: You light the lantern by the inn. In its light you see red paint on the inn's wall, still wet: THE FLAME EATS You'd better tell Aldric.\u003c/li>\u003cli>Shrine lantern: You light the lantern at the farm. Farmer Odo watches you from his field, and doesn't wave.\u003c/li>\u003cli>Shrine lantern: You light the lantern on the coast. Far out at sea, a light answers.\u003c/li>\u003cli>Shrine lantern: You light the lantern by Kael's gate. The Thornwood looks darker beside it, not lighter.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-3-go-back-to-keeper-aldric\">Step 3: Go back to Keeper Aldric\u003c/h3>\n\u003cp>\u003cb>Keeper Aldric:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>All six! Well done. And... the inn wall. Yes. I've heard.\u003c/p>\u003cp>The Ashbound, I expect. They hate the shrines. They hate anything that helps people. I've sent Brother Tomas to scrub it off.\u003c/p>\u003cp>Don't let it trouble you, friend. Here: your pay, and a blessing scroll for your trouble.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> \u003ca href=\"#blessing-scrolls\" data-to=\"blessing-scrolls\">Blessing scrolls\u003c/a>, 80 bronze.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> \u003ca href=\"#blessing-scrolls\" data-to=\"blessing-scrolls\">Blessing scrolls\u003c/a>, 80 bronze.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#oath-of-the-flame\" data-to=\"oath-of-the-flame\">Oath of the Flame\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#the-first-tithe\" data-to=\"the-first-tithe\">The First Tithe\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"leadership","t":"Leadership","c":"Skills","i":"🚩","sum":"Trained by leading a party (click another player to invite them): the leader earns it when the party finishes quest steps and defeats monsters together. Party members near the leader get a little extra XP from kills. Huntmaster Kael teaches it in his Wolf Hunt.","a":[],"ib":[["Discipline","🤝 Charisma"],["Taught by","\u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>"],["Max level","99"]],"h":"\u003cp>🚩 \u003cb>Leadership\u003c/b> is a skill in \u003ca href=\"#charisma\" data-to=\"charisma\">Charisma\u003c/a>. Trained by leading a party (click another player to invite them): the leader earns it when the party finishes quest steps and defeats monsters together. Party members near the leader get a little extra XP from kills. Huntmaster Kael teaches it in his Wolf Hunt.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#the-wolf-hunt\" data-to=\"the-wolf-hunt\">The Wolf Hunt\u003c/a>, from \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>📖 Quick learner\u003c/td>\u003ctd>10% more XP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"leather","t":"Leather","c":"Items","i":"🟫","sum":"Materials and food. Sells for 5 bronze.","a":["piece of leather"],"ib":[["Kind","Materials and food"],["Shop pays","5 bronze"],["Game id","\u003ccode>leather\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#cowhides\" data-to=\"cowhides\">Cowhides\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a> once your \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a> is 8.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"levels-and-xp","t":"Levels and XP","c":"Mechanics","i":"📈","sum":"Skills go from 1 to 99.","a":[],"ib":[],"h":"\u003cp>Every skill has its own XP and level, up to 99. It gets steeper as you go.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Total XP needed\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>34\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>121\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>521\u003c/td>\u003c/tr>\u003ctr>\u003ctd>15\u003c/td>\u003ctd>1,156\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20\u003c/td>\u003ctd>2,003\u003c/td>\u003c/tr>\u003ctr>\u003ctd>30\u003c/td>\u003ctd>4,288\u003c/td>\u003c/tr>\u003ctr>\u003ctd>40\u003c/td>\u003ctd>7,309\u003c/td>\u003c/tr>\u003ctr>\u003ctd>50\u003c/td>\u003ctd>11,024\u003c/td>\u003c/tr>\u003ctr>\u003ctd>60\u003c/td>\u003ctd>15,400\u003c/td>\u003c/tr>\u003ctr>\u003ctd>70\u003c/td>\u003ctd>20,414\u003c/td>\u003c/tr>\u003ctr>\u003ctd>80\u003c/td>\u003ctd>26,045\u003c/td>\u003c/tr>\u003ctr>\u003ctd>90\u003c/td>\u003ctd>32,277\u003c/td>\u003c/tr>\u003ctr>\u003ctd>99\u003c/td>\u003ctd>38,389\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts"],"w":false,"r":false},{"s":"light-the-way","t":"Light the Way","c":"Quests","i":"📜","sum":"Prologue from Keeper Aldric.","a":[],"ib":[["Part of","Prologue"],["Given by","Keeper Aldric"],["Where","in the Emberhall, the great white temple on Ember Hill, in the middle of Emberhold"],["Steps","3"]],"h":"\u003cp>\u003cb>Light the Way\u003c/b> is part of the Prologue from \u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>, found in the Emberhall, the great white temple on Ember Hill, in the middle of Emberhold.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#the-hall-of-embers\" data-to=\"the-hall-of-embers\">The Hall of Embers\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-keeper-aldric\">Step 1: Talk to Keeper Aldric\u003c/h3>\n\u003cp>\u003cb>Keeper Aldric:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Now, a small job, but an important one. Every evening we light the lanterns on the Emberhall's steps and round the plaza below them, so no one in the city walks in the dark.\u003c/p>\u003cp>Walk out through the great doors at the bottom of the hall and light all six: click each lantern. The ❗ marks show you which are still dark.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-step-2-light-the-6-lanterns-on-the-steps-and-round-the-plaza\">Step 2: Light the 6 lanterns on the steps and round the plaza\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Go out through the great doors at the bottom of the hall. The lanterns stand on the steps and round the plaza: click each one with a ❗.\u003c/li>\u003c/ul>\n\u003cp>\u003cb>What they say when you visit:\u003c/b>\u003c/p>\n\u003cul>\u003cli>Lantern: You light the lantern. Warm light spills across the white steps.\u003c/li>\u003cli>Lantern: You light the lantern. Its glow catches the gold on the Emberhall's doors.\u003c/li>\u003cli>Lantern: You light the lantern. A cat stretches out in the warm light under it.\u003c/li>\u003cli>Lantern: You light the lantern. A guard on the plaza nods to you.\u003c/li>\u003cli>Lantern: You light the lantern. Someone on the plaza claps.\u003c/li>\u003cli>Lantern: You light the last lantern. The whole plaza glows gold.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-3-go-back-to-keeper-aldric\">Step 3: Go back to Keeper Aldric\u003c/h3>\n\u003cp>\u003cb>Keeper Aldric:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>I saw the plaza light up from here! Beautiful. A flame shared is a gift, friend, and you've just given some.\u003c/p>\u003cp>Take this lantern for yourself. With it in your bag, the nights won't be so dark for you.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> \u003ca href=\"#your-lantern\" data-to=\"your-lantern\">Your lantern\u003c/a>.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> \u003ca href=\"#your-lantern\" data-to=\"your-lantern\">Your lantern\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#the-hall-of-embers\" data-to=\"the-hall-of-embers\">The Hall of Embers\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#the-training-ground\" data-to=\"the-training-ground\">The Training Ground\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"living-off-the-land","t":"Living off the land","c":"Quests","i":"📜","sum":"Lessons from Old Maren.","a":[],"ib":[["Part of","Lessons"],["Given by","Old Maren"],["Where","by the pond in the Emberhall Training Ground, just east of the Emberhall"],["Steps","19"]],"h":"\u003cp>\u003cb>Living off the land\u003c/b> is a lesson from \u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>, found by the pond in the Emberhall Training Ground, just east of the Emberhall.\u003c/p>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-old-maren-by-the-pond-in-the-emberhall-training-ground-east-of-the-emberhall\">Step 1: Talk to Old Maren by the pond in the Emberhall Training Ground (east of the Emberhall)\u003c/h3>\n\u003cp>\u003cb>Old Maren:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Well now, a fresh face! I'm Maren. I fished the Glass River for forty years before my knees gave out. Now I teach here, with the other trainers.\u003c/p>\u003cp>Everyone starts with empty hands, so let's begin with the oldest skill there is: fishing.\u003c/p>\u003cp>This pond is stocked for practice. Click the water's edge. You've no rod, so it'll be slow. Bring me back one minnow.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> the \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a> skill.\u003c/p>\n\u003ch3 id=\"s-step-2-catch-a-minnow-by-hand-at-the-training-grounds-pond\">Step 2: Catch a minnow by hand at the training ground's pond\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> The pond is right here beside me: click the water at its edge. By hand it takes a while, so be patient.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-3-bring-your-minnow-back-to-old-maren\">Step 3: Bring your minnow back to Old Maren\u003c/h3>\n\u003cul>\u003cli>\u003cb>Needs:\u003c/b> Where's my minnow? Catch one at the pond, then bring it here.\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Old Maren:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Ha! Took you a while, didn't it? That's fishing by hand.\u003c/p>\u003cp>Here, take my old rod. It's nearly worn out, but any tool on your belt makes you much faster at its job: rods for fishing, axes for chopping, pickaxes for mining.\u003c/p>\u003cp>Click the rod in your bag and press &quot;Equip&quot;. A tool only works when it's on your belt.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> \u003ca href=\"#fishing-rod\" data-to=\"fishing-rod\">Pine fishing rod\u003c/a>.\u003c/p>\n\u003ch3 id=\"s-step-4-equip-the-rod-click-it-in-your-bag-then-equip\">Step 4: Equip the rod (click it in your bag, then Equip)\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Click the rod in your bag, then press &quot;Equip&quot;. It'll show up in the tool belt above your bag.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-5-fish-until-the-rod-breaks-watch-the-bar-under-it\">Step 5: Fish until the rod breaks (watch the bar under it)\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Keep fishing with the rod on your belt until it snaps. The little bar under it shows how much it has left.\u003c/li>\u003cli>\u003cb>You need:\u003c/b> a rod.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-6-tell-old-maren-your-rod-broke\">Step 6: Tell Old Maren your rod broke\u003c/h3>\n\u003cp>\u003cb>Old Maren:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Snapped, did it? Every tool wears down a little each time you use it: tools when you use them, weapons when you hit, armor when you get hit. It works just as well right up until it breaks.\u003c/p>\u003cp>A broken tool isn't gone, though. It's in your bag, and Oswin the Repairer can fix it. He works at the Mages' Guild, the purple hall in Lower Town, in the south-west of the city. Walk onto its door to go in. It's a good walk, so you'll see a bit of Emberhold on the way.\u003c/p>\u003cp>Take my rod to him. He's an old friend, so this first one's free. After that he charges a few coins, more for finer things.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-step-7-get-your-rod-repaired-at-the-mages-guild-lower-town-south-west-of-the-city\">Step 7: Get your rod repaired at the Mages' Guild (Lower Town, south-west of the city)\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Oswin the Repairer is inside the Mages' Guild, the purple hall in Lower Town: go down the hill road to Market Square, take the south street, then turn west along Lower Town's long street. Click him, then Repair. The first one's free.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-8-bring-your-mended-rod-back-to-old-maren\">Step 8: Bring your mended rod back to Old Maren\u003c/h3>\n\u003cp>\u003cb>Old Maren:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Good as new! Better tools last longer: bronze is where everyone starts, iron lasts twice as long, and the finer metals longer still. A better wooden handle helps too. Fishing rods are all wood, so for those, the better the wood, the better the rod.\u003c/p>\u003cp>Look at you, though: all that fishing raised your Minnow Mastery. Every kind of fish, log and ore has its own Mastery, and every time one goes up a level, you earn a Mastery point.\u003c/p>\u003cp>Spend your points on upgrades, like faster fishing or a bigger cooking pot. Open the 📊 panel (bottom right), tap the 🌳 next to any skill, and pick an upgrade. Go on, spend your first point now.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-step-9-spend-a-mastery-point-tap-then-a\">Step 9: Spend a Mastery point (tap 📊, then a 🌳)\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Open the 📊 panel at the bottom right, tap the 🌳 next to a skill, and pick an upgrade. No points yet? Catch a few more minnows: each Mastery level gives you one.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-10-tell-old-maren-what-you-picked\">Step 10: Tell Old Maren what you picked\u003c/h3>\n\u003cp>\u003cb>Old Maren:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Good choice! And don't fret about picking wrong: resetting a tree is free, and all your points come back. Here's a few coins for learning that.\u003c/p>\u003cp>Now, raw minnows won't keep you going for long. Take this pine log to the stove, right here beside me, and cook your fish into a stew. Pick Stew, tap your minnow to put it in the pot, and pick the Pine log to burn.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> \u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>, 25 bronze, the \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a> skill.\u003c/p>\n\u003ch3 id=\"s-step-11-cook-a-stew-at-the-stove-stew-put-in-your-minnow-pine-log\">Step 11: Cook a stew at the stove (Stew, put in your minnow, Pine log)\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Click the stove (the black one with the pot, right next to me). Pick Stew, tap your minnow to put it in the pot, pick the Pine log, then press Make 1.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-12-tell-old-maren-what-happened\">Step 12: Tell Old Maren what happened\u003c/h3>\n\u003cp>\u003cb>Old Maren:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Burned it to a crisp, eh? Don't feel bad: everyone burns their first stew. When you fail, the fish and the log are gone, but you still learn a little.\u003c/p>\u003cp>Here's the secret. Some tools make you faster, others make you succeed more often. Rods, axes and pickaxes are about speed. A pot, a hammer and tongs are about success.\u003c/p>\u003cp>Cooking without a pot halves your chance. Take my old bronze pot and equip it, just like the rod. It's seen better days, but it'll do. Here's another log.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> \u003ca href=\"#pot\" data-to=\"pot\">Bronze pot\u003c/a>, \u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>.\u003c/p>\n\u003ch3 id=\"s-step-13-equip-the-pot-click-it-in-your-bag-then-equip\">Step 13: Equip the pot (click it in your bag, then Equip)\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Click the pot in your bag, then press &quot;Equip&quot;.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-14-cook-a-stew-with-the-pot-equipped\">Step 14: Cook a stew with the pot equipped\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Cook a stew at the stove with the pot on your belt. I'll keep an eye on it this time.\u003c/li>\u003cli>\u003cb>You need:\u003c/b> a pot.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-15-show-old-maren-your-stew-dont-eat-it-yet\">Step 15: Show Old Maren your stew (don't eat it yet!)\u003c/h3>\n\u003cul>\u003cli>\u003cb>Needs:\u003c/b> Where's your stew? Cook one at the stove and bring it to me.\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Old Maren:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Now that's a stew! Smells like my mother's kitchen.\u003c/p>\u003cp>See the ⚡ bar at the top left? That's your stamina. Everything you do costs some: a fish costs 1, cooking 2, and chopping or mining 10.\u003c/p>\u003cp>It comes back on its own, 1 every 30 seconds, but food is much faster. A raw minnow gives 2. A stew gives three times what its fish would, plus a bit from the fire. Go on, eat your stew, then come back to me.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-step-16-eat-your-stew-click-it-in-your-bag-then-eat\">Step 16: Eat your stew (click it in your bag, then Eat)\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Click the stew in your bag and press Eat.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-17-go-back-to-old-maren-for-your-reward\">Step 17: Go back to Old Maren for your reward\u003c/h3>\n\u003cp>\u003cb>Old Maren:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>You've got the hang of living off the land: fish, cook, eat, and sell what you don't need.\u003c/p>\u003cp>Here's your reward: an oak fishing rod and a brand new bronze pot. Faster fishing, and they'll last you a good long while. And some coins and a couple of stews for the road.\u003c/p>\u003cp>Equip them both. My old pot goes back in your bag when you do.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> \u003ca href=\"#fishing-rod\" data-to=\"fishing-rod\">Oak fishing rod\u003c/a>, \u003ca href=\"#pot\" data-to=\"pot\">Bronze pot\u003c/a>, 2 × \u003ca href=\"#cooking\" data-to=\"cooking\">Minnow stew (3 minnow · pine)\u003c/a>, 50 bronze.\u003c/p>\n\u003ch3 id=\"s-step-18-equip-the-oak-rod-and-the-bronze-pot\">Step 18: Equip the oak rod and the bronze pot\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Click the oak fishing rod in your bag and press &quot;Equip&quot;, then the same for the bronze pot.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-19-talk-to-old-maren\">Step 19: Talk to Old Maren\u003c/h3>\n\u003cp>\u003cb>Old Maren:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>There, you've got the hang of living off the land: fish, cook, eat. Every skill belongs to a Discipline. Fishing is part of Endurance, which raises your max stamina, and Cooking is Dexterity, which lets you carry more and walk faster.\u003c/p>\u003cp>Now meet the others. Every trainer in Emberhold teaches right here in the training ground: Forester Holt by the trees, Miner Greta by the rocks, Smith Brann at the furnace, Woodworker Rook at the workbench, Herbalist Wren by the dig patches, Alchemist Moss and Archmage Rowan by the alchemy table and the altar, Huntmaster Kael by the pens and Farmer Odo by his plots.\u003c/p>\u003cp>Shopkeeper Tam keeps the General Store, at the top of Market Square, just down the hill road. Captain Bryn stands by the bounty board in the square.\u003c/p>\u003cp>Anyone with a ❗ over their head has a lesson for you, and each one ends with a reward. Learn them all, and Keeper Aldric will want a word. Your 📜 Quests tab keeps track.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> 50 bronze.\u003c/p>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a>, \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> \u003ca href=\"#fishing-rod\" data-to=\"fishing-rod\">Pine fishing rod\u003c/a>, \u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>, \u003ca href=\"#pot\" data-to=\"pot\">Bronze pot\u003c/a>, \u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>, \u003ca href=\"#fishing-rod\" data-to=\"fishing-rod\">Oak fishing rod\u003c/a>, \u003ca href=\"#pot\" data-to=\"pot\">Bronze pot\u003c/a>, 2 × \u003ca href=\"#cooking\" data-to=\"cooking\">Minnow stew (3 minnow · pine)\u003c/a>, 1.3 silver.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#the-training-ground\" data-to=\"the-training-ground\">The Training Ground\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#buying-and-selling\" data-to=\"buying-and-selling\">Buying and selling\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"mace","t":"Mace","c":"Items","i":"🏏","sum":"A melee weapon.","a":[],"ib":[["Style","Melee"],["Level","10"],["Biggest hit","5 + metal"],["Attacks every","3s"],["Range","1 tile"],["Hands","One"]],"h":"\u003cp>🏏 The mace needs \u003ca href=\"#melee\" data-to=\"melee\">Melee\u003c/a> level 10. Its biggest hit is 5, plus its metal's bonus. It attacks every 3s and reaches 1 tile. See \u003ca href=\"#weapons\" data-to=\"weapons\">Weapons\u003c/a> and \u003ca href=\"#combat\" data-to=\"combat\">Combat\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"main-page","t":"Main page","c":"Wiki","i":"🔥","sum":"The team's book of everything in Emberfall and its land, Embervale: the story, the world, and how the game actually works.","a":[],"ib":[],"h":"\u003cp>Welcome to the \u003cb>Emberfall Wiki\u003c/b>. It's the place to look things up and keep the game consistent: who someone is, what an item does, where a monster lives, what really happened 800 years ago.\u003c/p>\n\u003cp>Pages come in two kinds, and each page says which it is at the bottom:\u003c/p>\n\u003cul>\u003cli>\u003cb>Written pages\u003c/b> hold the story: the lore, places, factions and people. They follow the lore bible.\u003c/li>\u003cli>\u003cb>Pages made from the game's code\u003c/b> hold the facts: every monster, item, skill, spell, quest, shop and book, with the real numbers. They're rebuilt from the game every time, so they always match what's live.\u003c/li>\u003c/ul>\n\u003cp>Red links are pages that don't exist yet. Secrets (the twists players shouldn't learn early) are in red boxes; turn off 🔒 \u003ci>Show secrets\u003c/i> at the top to read the wiki the way a player would.\u003c/p>\n\u003ch2 id=\"s-start-here\">Start here\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"#embervale\" data-to=\"embervale\">Embervale\u003c/a>: the land, and the one-paragraph story.\u003c/li>\u003cli>\u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a> and \u003ca href=\"#the-ember\" data-to=\"the-ember\">The ember\u003c/a>: what everything runs on.\u003c/li>\u003cli>\u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a> and \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>: the protectors, and the rebels.\u003c/li>\u003cli>\u003ca href=\"#world-map\" data-to=\"world-map\">World map\u003c/a>: all the regions of Embervale, and how to travel between them.\u003c/li>\u003cli>\u003ca href=\"#maps\" data-to=\"maps\">Maps\u003c/a>: the game world today and every building, drawn from the game.\u003c/li>\u003cli>\u003ca href=\"#history\" data-to=\"history\">History\u003c/a>: 800 years, as it happened and as people tell it.\u003c/li>\u003cli>\u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a>: the acts, from waking up as a Hopeful to the fall of Vale and the endgame.\u003c/li>\u003cli>\u003ca href=\"#version-history\" data-to=\"version-history\">Version history\u003c/a>: what changed in each game update.\u003c/li>\u003cli>\u003ca href=\"#how-to-update-the-wiki\" data-to=\"how-to-update-the-wiki\">How to update the wiki\u003c/a>: keeping it current.\u003c/li>\u003c/ul>","src":["wiki/pages/main-page.md"],"w":true,"r":false},{"s":"main-story","t":"Main story","c":"Story","i":"🎭","sum":"From waking as a Hopeful to the fall of Vale and the search for the Ember Seed: the acts of the main quest.","a":["Main quest","Acts"],"ib":[],"h":"\u003cp>You start as a \u003ca href=\"#hopefuls\" data-to=\"hopefuls\">Hopeful\u003c/a>, not a member. \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>'s trials take you across the land, and each act ends with a new trial mark: Ember, Flame, Blaze, Radiant. When you've earned Radiant, the Emberguard invite you to join, and that's when you learn the truth. There is no choosing sides: every player ends up fighting the Undying beside \u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a> and \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Act\u003c/th>\u003cth>Where, levels\u003c/th>\u003cth>What happens\u003c/th>\u003cth>Trial mark\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Prologue: Awakening\u003c/b> (built)\u003c/td>\u003ctd>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a> and \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>, 1 to 10\u003c/td>\u003ctd>The tutorial. You wake at \u003ca href=\"#the-heart-shrine\" data-to=\"the-heart-shrine\">The Heart Shrine\u003c/a>, take Brother Oren's tour, and learn every skill from the townsfolk. Then you swear the Oath of the Flame to be allowed to try for the Emberguard.\u003c/td>\u003ctd>Ember\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Act 1: The First Trial\u003c/b> (built, changes planned)\u003c/td>\u003ctd>\u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a> only, 5 to 20\u003c/td>\u003ctd>You learn the base story and prove yourself around home. Small things feel off: the land at the valley's edge is dying, and the edge is creeping closer every year.\u003c/td>\u003ctd>Flame\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Act 2: The Outer Shrines\u003c/b>\u003c/td>\u003ctd>All six outer regions, 20 to 40\u003c/td>\u003ctd>The roads open. You travel to every region's city, meet its \u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwarden\u003c/a>, and do the first tier of its quests (the \u003ci>Arrival\u003c/i> stage).\u003c/td>\u003ctd>Blaze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Act 3: The Far Reaches\u003c/b>\u003c/td>\u003ctd>The outer reaches of all six regions, 40 to 60\u003c/td>\u003ctd>You head into the withering wilds far from the cities (the \u003ci>Wilds\u003c/i> stage), then take each Emberwarden's trial and relight their great shrine (the \u003ci>Trial\u003c/i> stage). It ends with your invitation, and the truth.\u003c/td>\u003ctd>Radiant\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Act 4: The Truth\u003c/b>\u003c/td>\u003ctd>All six regions, \u003ca href=\"#frostfell\" data-to=\"frostfell\">Frostfell\u003c/a>, \u003ca href=\"#the-hollow-heart\" data-to=\"the-hollow-heart\">The Hollow Heart\u003c/a>, 60 to 75\u003c/td>\u003ctd>You hunt down the Emberwardens one by one and free their great shrines. You thaw Wick's shrine in Frostfell, then face Vale at the Emberheart.\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Endgame: The Seed\u003c/b>\u003c/td>\u003ctd>\u003ca href=\"#the-sundered-crown\" data-to=\"the-sundered-crown\">The Sundered Crown\u003c/a> and every region, 75+\u003c/td>\u003ctd>You search Whitestone's ruins for the \u003ca href=\"#ember-seed\" data-to=\"ember-seed\">Ember Seed\u003c/a>, gather what it needs to be finished, and stop Vale coming back. Alongside it runs \u003ca href=\"#the-mending\" data-to=\"the-mending\">The Mending\u003c/a>.\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The Prologue and Act 1 are in the game: see \u003ca href=\"#quests\" data-to=\"quests\">Quests\u003c/a> for every built quest, step by step.\u003c/p>\n\u003ch2 id=\"s-act-1-in-detail-heartvale-only\">Act 1 in detail (Heartvale only)\u003c/h2>\n\u003cp>Act 1 stays inside \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>. Keeper Aldric gives most of it. These are the quests in the game today, with the changes planned to keep everything in Heartvale and in line with the new story.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Quest\u003c/th>\u003cth>Giver\u003c/th>\u003cth>What you do\u003c/th>\u003cth>Story beat\u003c/th>\u003cth>Planned change\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Lantern Rounds\u003c/td>\u003ctd>\u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>\u003c/td>\u003ctd>Light six shrine lanterns around Heartvale.\u003c/td>\u003ctd>&quot;THE FLAME EATS&quot; painted on the inn wall. Aldric blames the Ashbound.\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The First Tithe\u003c/td>\u003ctd>Keeper Aldric\u003c/td>\u003ctd>Hear how the Tithe works; get two Tithe tonics.\u003c/td>\u003ctd>Falling now costs you.\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Blessing the Fields\u003c/td>\u003ctd>\u003ca href=\"#sister-celene\" data-to=\"sister-celene\">Sister Celene\u003c/a>\u003c/td>\u003ctd>Bless Farmer Odo's three fields.\u003c/td>\u003ctd>Odo refuses blessings.\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tithe Tonics\u003c/td>\u003ctd>\u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">Alchemist Moss\u003c/a>\u003c/td>\u003ctd>Brew five Tithe tonics.\u003c/td>\u003ctd>&quot;They sell the cure for a debt they put on you.&quot;\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Totem\u003c/td>\u003ctd>\u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>\u003c/td>\u003ctd>Chop oak for a shrine totem and deliver it.\u003c/td>\u003ctd>Rook hides a note in it.\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ash on the Road\u003c/td>\u003ctd>\u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">Captain Bryn\u003c/a>\u003c/td>\u003ctd>Drive Ashbound scouts off the Westroad shrine.\u003c/td>\u003ctd>A dropped note: &quot;They aren't what they seem.&quot;\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rebuild the Shrine\u003c/td>\u003ctd>Keeper Aldric\u003c/td>\u003ctd>Bring oak and bronze and rebuild the Westroad shrine.\u003c/td>\u003ctd>The grass around it greens in a ring, but the ring is small. A thin thread of light runs from the flame east along the road toward Emberhold.\u003c/td>\u003ctd>Change the shrine's lit line: green grass, not brown, and the thread.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>What Holt Saw\u003c/td>\u003ctd>\u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>\u003c/td>\u003ctd>Count dead trees in six places.\u003c/td>\u003ctd>2 dead near shrines, 28 out at the valley's edge, where his father counted almost none forty years ago. The edge is moving in.\u003c/td>\u003ctd>Flip the numbers. Move the Thornwood gate and Greyspine foothill spots to Heartvale: three near shrines, three at the valley's edge.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Odo's Stubborn Field\u003c/td>\u003ctd>\u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>\u003c/td>\u003ctd>Grow four crops with no blessing.\u003c/td>\u003ctd>A blessing lasted a season in his gran's day, and barely a week now. The shrines have less to give every year: where's it going?\u003c/td>\u003ctd>Reword Odo's last line.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Hollow Wolves\u003c/td>\u003ctd>\u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>\u003c/td>\u003ctd>Clear five Blighted wolves.\u003c/td>\u003ctd>&quot;The Blight is always worst furthest from a shrine, and the line gets closer every year.&quot;\u003c/td>\u003ctd>Move the pack from Wolf Hollow (Thornwood) to the grey-dust edge of the valley, raiding the pasture.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Maren's Question\u003c/td>\u003ctd>\u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>\u003c/td>\u003ctd>Talk to Maren.\u003c/td>\u003ctd>She asks if you felt something was taken when you came back.\u003c/td>\u003ctd>Reword: she isn't an Emberborn, but after decades of caring for them she's noticed they come back &quot;a little less&quot;. She asks out of worry.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A Flame at the Valley's Edge\u003c/td>\u003ctd>Keeper Aldric\u003c/td>\u003ctd>Escort two Emberguard to the edge of the valley, protect them, and light a new roadside shrine.\u003c/td>\u003ctd>You meet \u003ca href=\"#rhys\" data-to=\"rhys\">Rhys\u003c/a>. Aldric names you a Flame.\u003c/td>\u003ctd>Replaces \u003ci>A Flame in the Thornwood\u003c/i>, which is outside Heartvale and says &quot;the Thornwood has never had a shrine&quot;.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-acts-2-and-3-the-regions-in-parallel\">Acts 2 and 3: the regions in parallel\u003c/h2>\n\u003cp>There's no fixed order. When Act 1 ends, all six outer regions open at once: \u003ca href=\"#the-thornwood\" data-to=\"the-thornwood\">The Thornwood\u003c/a>, \u003ca href=\"#greyspine-peaks\" data-to=\"greyspine-peaks\">Greyspine Peaks\u003c/a>, \u003ca href=\"#the-tangle\" data-to=\"the-tangle\">The Tangle\u003c/a>, \u003ca href=\"#saltmere-coast\" data-to=\"saltmere-coast\">Saltmere Coast\u003c/a>, \u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a> and \u003ca href=\"#blackfen\" data-to=\"blackfen\">Blackfen\u003c/a>. Each region's Emberwarden gives a quest chain in three stages:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Stage\u003c/th>\u003cth>Act\u003c/th>\u003cth>Levels\u003c/th>\u003cth>What it is\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Arrival\u003c/b>\u003c/td>\u003ctd>Act 2\u003c/td>\u003ctd>about 20 to 40\u003c/td>\u003ctd>Reach the region's city, meet the Emberwarden, help the town, learn the local trouble, and work the region's edge.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Wilds\u003c/b>\u003c/td>\u003ctd>Act 3\u003c/td>\u003ctd>about 40 to 55\u003c/td>\u003ctd>Go out into the withering lands far from the city and deal with the region's problem: the rot, the eruptions, the vines, the tides, the glass, the fog. Most clues and side quests live here.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Trial\u003c/b>\u003c/td>\u003ctd>Act 3\u003c/td>\u003ctd>about 50 to 60\u003c/td>\u003ctd>The Emberwarden's trial: go to the heart of the region, beat its boss and relight the great shrine.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Each region is a ring: safe around its great shrine, and more dangerous the further out you go, where \u003ca href=\"#the-withering\" data-to=\"the-withering\">The Withering\u003c/a> is worst. Players pick their own path, and \u003ca href=\"#resources-by-region\" data-to=\"resources-by-region\">Resources by region\u003c/a> gives each player a reason to go somewhere different first.\u003c/p>\n\u003cp>\u003cb>Story beats follow your count, not the region.\u003c/b> The story moves on when you've finished a number of stages, whichever regions they were in:\u003c/p>\n\u003cul>\u003cli>\u003cb>Act 2, after 3 Arrivals:\u003c/b> a Radiance Ceremony is announced in Emberhold, and you watch a champion you know go into the light.\u003c/li>\u003cli>\u003cb>Act 2, after all 6 Arrivals:\u003c/b> you earn Blaze, and the outer reaches open (Act 3).\u003c/li>\u003cli>\u003cb>Act 3, after 2 Trials:\u003c/b> you relight a great shrine and warmth rolls out across the land, then is pulled back down a thread of light toward Heartvale. Something is drinking from the shrines.\u003c/li>\u003cli>\u003cb>Act 3, after 4 Trials:\u003c/b> Rhys is invited to his Joining first. He comes back up the Emberhall stair drained, grey and back to level 1. You go looking for him, and find him with the Ashbound.\u003c/li>\u003cli>\u003cb>Act 3, after all 6 Trials:\u003c/b> you earn Radiant, and your own invitation comes.\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Rhys\u003c/b> is always one step ahead. The game counts your stages and puts him one past you; he mentions the region he just finished, always one you haven't done.\u003c/p>\n\u003cp>Each region also holds one secret only it can reveal, such as Ivy and Reed being impostors, or Tilda's cairns in the Barrens. By the Joining, a player who explored has pieced most of the truth together, whatever order they went in.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003ch2 id=\"s-the-joining-end-of-act-3\">The Joining (end of Act 3)\u003c/h2>\n\u003cp>After Rhys is drained, Sable takes you to meet Wick, and you hear the true history: the Ceremony, the Undying, the Sundering War. Then your invitation comes. You go down the Emberhall stair anyway. Vale reveals himself and makes his offer: \u003ci>&quot;Join us, and you'll never fall again.&quot;\u003c/i> You refuse, and Sable and the Ashbound get you out.\u003c/p>\n\u003ch2 id=\"s-act-4-the-truth\">Act 4: The Truth\u003c/h2>\n\u003cul>\u003cli>\u003cb>Cut free:\u003c/b> Wick cuts your thread from the Heart Shrine so the Undying can't drain you. Ash starts to creep up your hands, the Tithe ends, and you rise at Ashbound hearths until you've freed a shrine of your own.\u003c/li>\u003cli>\u003cb>The Emberwardens:\u003c/b> you hunt down all six, in any order. Each time one falls, Wick shows you how to \u003cb>free\u003c/b> their great shrine: cut its thread to the Heart Shrine, so everything it draws goes back out to the land. The warmth spreads outward from the shrine, and the region's edges start to heal. Unmasking Ivy and Reed as impostors is part of it.\u003c/li>\u003cli>\u003cb>Frostfell:\u003c/b> the last stop before Vale. You thaw Wick's frozen shrine and free it, which gives Wick back enough strength to face Vale beside you.\u003c/li>\u003cli>\u003cb>Vale:\u003c/b> you unmask \u003ca href=\"#enchanter-vale\" data-to=\"enchanter-vale\">Enchanter Vale\u003c/a> and fight him in \u003ca href=\"#the-hollow-heart\" data-to=\"the-hollow-heart\">The Hollow Heart\u003c/a>, at the Emberheart.\u003c/li>\u003cli>\u003cb>The catch:\u003c/b> when Vale falls, every shrine shudders. The shrines are what hold the Emberborn together. Freed shrines keep them alive for now, but Wick warns it won't last: without a lasting fix, every Emberborn will slowly fade. That sets up the endgame.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-endgame-the-seed\">Endgame: The Seed\u003c/h2>\n\u003col>\u003cli>\u003cb>Find the Seed.\u003c/b> The half-made \u003ca href=\"#ember-seed\" data-to=\"ember-seed\">Ember Seed\u003c/a> lies in the royal Crown Vault under \u003ca href=\"#the-sundered-crown\" data-to=\"the-sundered-crown\">The Sundered Crown\u003c/a>. Reaching it is the first big endgame dungeon.\u003c/li>\u003cli>\u003cb>Finish the Seed.\u003c/b> Wick's research says it needs a piece of each region's healed land, such as Thornwood heartwood, Greyspine fire-glass and Saltmere pearl, each from hard endgame content in that region.\u003c/li>\u003cli>\u003cb>Vale isn't quite gone.\u003c/b> As he died, his spark fled into his half of the \u003ca href=\"#ember-crown\" data-to=\"ember-crown\">Ember Crown\u003c/a>. The impostor wardens Ivy and Reed escaped with it, and are hunting the other half in Whitestone to bring him back. They're the recurring endgame villains.\u003c/li>\u003cli>\u003cb>Plant the Seed.\u003c/b> Planted at the Emberheart, it lets the Emberborn live on their own fire, without the shrines. This can be saved for a later update. Wick may have to give up what's left of his power to make it take root.\u003c/li>\u003c/ol>\u003c/div>\n\u003ch2 id=\"s-the-mending\">The Mending\u003c/h2>\n\u003cp>Alongside the story, every region has repeatable quests at every level to fight \u003ca href=\"#the-withering\" data-to=\"the-withering\">The Withering\u003c/a>. They're open to everyone, wherever they are in the story. See \u003ca href=\"#the-mending\" data-to=\"the-mending\">The Mending\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-how-the-ash-marks-work-in-play\">How the ash marks work in play\u003c/h2>\n\u003cp>After Wick cuts your thread in Act 4, grey ash marks slowly spread up your character's hands, Ember Debt ends, and you rise at Ashbound hearths, then at the great shrines you've freed. You never actually crumble away.\u003c/p>\n\u003ch2 id=\"s-changes-still-to-make-in-the-game\">Changes still to make in the game\u003c/h2>\n\u003cul>\u003cli>The Oath of the Flame today says you join and become an Ember. It should become an oath to \u003ci>try\u003c/i> for the Emberguard, with Ember, Flame, Blaze and Radiant as trial marks, not ranks (see \u003ca href=\"#trial-marks\" data-to=\"trial-marks\">Trial marks\u003c/a>).\u003c/li>\u003cli>Act 1's title, &quot;The Light Welcomes You&quot;, should become &quot;The First Trial&quot;.\u003c/li>\u003cli>The Act 1 changes in the table above.\u003c/li>\u003cli>The game's outdoor map includes the edge of the Thornwood (the Goblin camp, Spider hollow, Wolf Hollow, an Ashbound camp and the Graveyard). With Act 1 kept to Heartvale, that content belongs to the Thornwood's Arrival stage in Act 2.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-open-questions\">Open questions\u003c/h2>\n\u003cul>\u003cli>Does Act 3 need all six Trials before the Joining, or only four, so players can leave their two least favourite regions for later?\u003c/li>\u003c/ul>","src":["wiki/pages/main-story.md"],"w":true,"r":false},{"s":"mana-potion","t":"Mana potion","c":"Items","i":"🧪","sum":"Restores mana.","a":[],"ib":[["Alchemy level","5"],["Ingredients","Blue lotus + Bat wings"],["XP","12"],["First tries work","60%"]],"h":"\u003cp>Restores mana. Brew it with \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> level 5 from \u003ca href=\"#blue-lotus\" data-to=\"blue-lotus\">Blue lotus\u003c/a> and \u003ca href=\"#bat-wings\" data-to=\"bat-wings\">Bat wings\u003c/a> in a vial. See \u003ca href=\"#potions\" data-to=\"potions\">Potions\u003c/a>.\u003c/p>","src":["shared/alchemy.ts"],"w":false,"r":false},{"s":"maple-logs","t":"Maple logs","c":"Items","i":"🪵","sum":"Log. Sells for 10 bronze.","a":["maple log"],"ib":[["Kind","Logs"],["Shop pays","10 bronze"],["Game id","\u003ccode>maple_logs\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a> level 20 from a maple tree (9 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Used for tool handles, bows, staffs and arrows, and burned as cooking fuel.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"maps","t":"Maps","c":"Places","i":"🗺️","sum":"Every map in the game, drawn tile by tile from the game itself.","a":["Map","World map"],"ib":[],"h":"\u003cp>These maps are drawn from the game's own map, tile by tile, so they always match the game. Tap a map to zoom in. Tap a dot to open its page: ⚪ people, 🔴 monsters, 🟡 doors into buildings and caves. Darker green is the danger zone, where monsters attack on sight.\u003c/p>\n\u003ch2 id=\"s-heartvale-outdoors\">Heartvale (outdoors)\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"heartvale\">\u003c/figure>\n\u003ch2 id=\"s-the-emberhall\">\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"lighthall\">\u003c/figure>\n\u003ch2 id=\"s-old-marens-cottage\">\u003ca href=\"#old-marens-cottage\" data-to=\"old-marens-cottage\">Old Maren's cottage\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"maren\">\u003c/figure>\n\u003ch2 id=\"s-the-general-store\">\u003ca href=\"#the-general-store\" data-to=\"the-general-store\">The General Store\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"tam\">\u003c/figure>\n\u003ch2 id=\"s-forester-holts-house\">\u003ca href=\"#forester-holts-house\" data-to=\"forester-holts-house\">Forester Holt's house\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"holt\">\u003c/figure>\n\u003ch2 id=\"s-miner-gretas-house\">\u003ca href=\"#miner-gretas-house\" data-to=\"miner-gretas-house\">Miner Greta's house\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"greta\">\u003c/figure>\n\u003ch2 id=\"s-smith-branns-smithy\">\u003ca href=\"#smith-branns-smithy\" data-to=\"smith-branns-smithy\">Smith Brann's smithy\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"smithy\">\u003c/figure>\n\u003ch2 id=\"s-woodworker-rooks-workshop\">\u003ca href=\"#woodworker-rooks-workshop\" data-to=\"woodworker-rooks-workshop\">Woodworker Rook's workshop\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"rook\">\u003c/figure>\n\u003ch2 id=\"s-huntmaster-kaels-lodge\">\u003ca href=\"#huntmaster-kaels-lodge\" data-to=\"huntmaster-kaels-lodge\">Huntmaster Kael's lodge\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"kael\">\u003c/figure>\n\u003ch2 id=\"s-herbalist-wrens-hut\">\u003ca href=\"#herbalist-wrens-hut\" data-to=\"herbalist-wrens-hut\">Herbalist Wren's hut\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"wren\">\u003c/figure>\n\u003ch2 id=\"s-the-hearthstone-inn\">\u003ca href=\"#the-hearthstone-inn\" data-to=\"the-hearthstone-inn\">The Hearthstone Inn\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"inn\">\u003c/figure>\n\u003ch2 id=\"s-the-mages-guild\">\u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">The Mages' Guild\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"guild\">\u003c/figure>\n\u003ch2 id=\"s-the-spider-cave\">\u003ca href=\"#the-spider-cave\" data-to=\"the-spider-cave\">The spider cave\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"spider_cave\">\u003c/figure>\n\u003ch2 id=\"s-the-crystal-cave\">\u003ca href=\"#the-crystal-cave\" data-to=\"the-crystal-cave\">The crystal cave\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"crystal_cave\">\u003c/figure>\n\u003ch2 id=\"s-the-old-mine\">\u003ca href=\"#the-old-mine\" data-to=\"the-old-mine\">The old mine\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"old_mine\">\u003c/figure>\n\u003ch2 id=\"s-the-wolf-den\">\u003ca href=\"#the-wolf-den\" data-to=\"the-wolf-den\">The wolf den\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"wolf_den\">\u003c/figure>","src":["shared/world.ts","shared/npcs.ts","client/src/mapDraw.ts"],"w":false,"r":false},{"s":"marens-question","t":"Maren's Question","c":"Quests","i":"📜","sum":"Act 1 from Old Maren.","a":[],"ib":[["Part of","Act 1"],["Given by","Old Maren"],["Where","in her cottage on the lake shore, west along the road from the square"],["Steps","1"]],"h":"\u003cp>\u003cb>Maren's Question\u003c/b> is part of the Act 1 from \u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>, found in her cottage on the lake shore, west along the road from the square.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#the-first-tithe\" data-to=\"the-first-tithe\">The First Tithe\u003c/a>.\u003c/p>\n\u003cdiv class=\"box note\">\u003cdiv class=\"box-label\">Planned change\u003c/div>\u003cp>Reword: she isn't an Emberborn, but after decades of caring for them she's noticed they come back &quot;a little less&quot;. She asks out of worry.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-old-maren\">Step 1: Talk to Old Maren\u003c/h3>\n\u003cp>\u003cb>Old Maren:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Come here, child. Closer. Quietly now.\u003c/p>\u003cp>Have you died yet? Since the Oath, I mean. Have they put their gold on you?\u003c/p>\u003cp>When you woke... did it feel like something was taken? Like you came back a little less?\u003c/p>\u003cp>No. Don't answer. Not here, not even with the door shut. Just keep this, and remember I asked.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> \u003ca href=\"#marens-worn-charm\" data-to=\"marens-worn-charm\">Maren's worn charm\u003c/a>.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> \u003ca href=\"#marens-worn-charm\" data-to=\"marens-worn-charm\">Maren's worn charm\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#the-hollow-wolves\" data-to=\"the-hollow-wolves\">The Hollow Wolves\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#a-flame-in-the-thornwood\" data-to=\"a-flame-in-the-thornwood\">A Flame in the Thornwood\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"marens-worn-charm","t":"Maren's worn charm","c":"Items","i":"🪬","sum":"A little wooden flame, worn smooth by years of fingers. Maren gave it to you.","a":["worn charm"],"ib":[["Kind","Story items"],["Shop pays","Can't be sold"],["Game id","\u003ccode>marens_charm\u003c/code>"]],"h":"\u003cp>A little wooden flame, worn smooth by years of fingers. Maren gave it to you.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Given in the quest \u003ca href=\"#marens-question\" data-to=\"marens-question\">Maren's Question\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"mastery","t":"Mastery","c":"Mechanics","i":"⭐","sum":"Your experience with one type of thing.","a":[],"ib":[],"h":"\u003cp>Mastery is your experience with one kind of thing: Oak, Trout, Wolf, Firebolt, Stew. Each Mastery levels separately (the first level takes 10 XP, each one 10% more than the last) and makes that thing faster, more reliable or more valuable.\u003c/p>\n\u003cp>Every Mastery level you earn gives 1 Mastery point to spend in any skill's tree (see each skill's page). Rank 1 costs 1 point, rank 2 costs 2 more, rank 3 costs 3 more. Resetting a tree is free for now.\u003c/p>","src":["shared/mastery.ts","shared/skilltree.ts"],"w":false,"r":false},{"s":"meals","t":"Meals","c":"Items","i":"🍲","sum":"Dishes you cook at a stove.","a":[],"ib":[],"h":"\u003cp>Meals are cooked with \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>: pick a dish, put ingredients in the pot, and pick a log to burn. Every mix is its own meal. Meals give back stamina.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Dish\u003c/th>\u003cth>Cooking level\u003c/th>\u003cth>Good with\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🍲 Stew\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Takes anything, and gets the most from a good fire\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🥘 Stir fry\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Best with chicken and beef. No fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍛 Curry\u003c/td>\u003ctd>5\u003c/td>\u003ctd>Best with fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🥩 Steak\u003c/td>\u003ctd>4\u003c/td>\u003ctd>Just meat (beef or boar), with a little veg on the side\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍖 Roast\u003c/td>\u003ctd>7\u003c/td>\u003ctd>Best with beef, then chicken. No fish\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-ingredients\">Ingredients\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Ingredient\u003c/th>\u003cth>Kind\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#minnow\" data-to=\"minnow\">Minnow\u003c/a>\u003c/td>\u003ctd>Fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#trout\" data-to=\"trout\">Trout\u003c/a>\u003c/td>\u003ctd>Fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#perch\" data-to=\"perch\">Perch\u003c/a>\u003c/td>\u003ctd>Fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#salmon\" data-to=\"salmon\">Salmon\u003c/a>\u003c/td>\u003ctd>Fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#pike\" data-to=\"pike\">Pike\u003c/a>\u003c/td>\u003ctd>Fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#tuna\" data-to=\"tuna\">Tuna\u003c/a>\u003c/td>\u003ctd>Fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#swordfish\" data-to=\"swordfish\">Swordfish\u003c/a>\u003c/td>\u003ctd>Fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#eel\" data-to=\"eel\">Eel\u003c/a>\u003c/td>\u003ctd>Fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#raw-chicken\" data-to=\"raw-chicken\">Raw chicken\u003c/a>\u003c/td>\u003ctd>Chicken\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#raw-beef\" data-to=\"raw-beef\">Raw beef\u003c/a>\u003c/td>\u003ctd>Meat\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#raw-boar\" data-to=\"raw-boar\">Raw boar\u003c/a>\u003c/td>\u003ctd>Meat\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#potatoes\" data-to=\"potatoes\">Potatoes\u003c/a>\u003c/td>\u003ctd>Vegetables\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#carrots\" data-to=\"carrots\">Carrots\u003c/a>\u003c/td>\u003ctd>Vegetables\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#mushrooms\" data-to=\"mushrooms\">Mushrooms\u003c/a>\u003c/td>\u003ctd>Vegetables\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#wild-roots\" data-to=\"wild-roots\">Wild roots\u003c/a>\u003c/td>\u003ctd>Vegetables\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#truffles\" data-to=\"truffles\">Truffles\u003c/a>\u003c/td>\u003ctd>Vegetables\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/cooking.ts"],"w":false,"r":false},{"s":"melee","t":"Melee","c":"Skills","i":"🗡️","sum":"Hold a dagger, sword, mace, spear or two-handed sword and click a monster.","a":[],"ib":[["Discipline","💪 Strength"],["Taught by","\u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>"],["Max level","99"]],"h":"\u003cp>🗡️ \u003cb>Melee\u003c/b> is a skill in \u003ca href=\"#strength\" data-to=\"strength\">Strength\u003c/a>. Hold a dagger, sword, mace, spear or two-handed sword and click a monster.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#standing-your-ground\" data-to=\"standing-your-ground\">Standing your ground\u003c/a>, from \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🎯 Precise strikes\u003c/td>\u003ctd>hit 2% more often\u003c/td>\u003c/tr>\u003ctr>\u003ctd>💥 Heavy blows\u003c/td>\u003ctd>hit 5% harder\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪶 Second wind\u003c/td>\u003ctd>10% chance it costs no stamina\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"memory-echoes","t":"Memory Echoes","c":"Story","i":"🧩","sum":"Glimpses of the past that some quests show you.","a":[],"ib":[],"h":"\u003cp>\u003cb>Memory Echoes\u003c/b> (🧩) are short glimpses of the past that some quests show you, so players can see history for themselves instead of being told. Planned echoes include the Circle in a ring around a pit of fire on the night of the Emberfall, and one of them stepping toward the king (\u003ci>The Old Shaft\u003c/i>), and Halric the Dawnbringer's first day, around year 30, with a young, smiling Vale (\u003ci>The First One\u003c/i>).\u003c/p>","src":["wiki/pages/memory-echoes.md"],"w":true,"r":false},{"s":"mend","t":"Mend","c":"Spells","i":"🪡","sum":"Repairs your most worn tool, weapon or armor piece good as new. It also uses 1 of what it's made of (a bar, or a log).","a":[],"ib":[["Spellcasting level","18"],["Mana","20"],["Kind","On yourself"],["Learned from","Levelling up"]],"h":"\u003cp>🪡 Repairs your most worn tool, weapon or armor piece good as new. It also uses 1 of what it's made of (a bar, or a log).\u003c/p>\n\u003cp>It needs \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a> level 18 and costs 20 mana at Mastery 1 (Mastery lowers the cost).\u003c/p>","src":["shared/combat.ts","shared/spells.ts"],"w":false,"r":false},{"s":"miner-greta","t":"Miner Greta","c":"People","i":"⛏️","sum":"Teaches Mining. Finds that emberstone veins flow toward the shrines.","a":[],"ib":[["Found in","Emberhold"],["Shop","Yes"],["Game id","\u003ccode>greta\u003c/code>"]],"h":"\u003cp>\u003cb>Miner Greta\u003c/b> teaches \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a> at the practice rocks in the \u003ca href=\"#emberhall-training-ground\" data-to=\"emberhall-training-ground\">Emberhall Training Ground\u003c/a>. She's found that emberstone veins flow toward \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a>, and that the rock of the \u003ca href=\"#the-crystal-cave\" data-to=\"the-crystal-cave\">Crystal Cave\u003c/a> is colder than when she was a girl.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;I buy ore and pickaxes, and I sell bronze pickaxes and ore.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#into-the-rocks\" data-to=\"into-the-rocks\">Into the rocks\u003c/a> (lessons)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Shop:\u003c/b> buys ore and pickaxes. Sells: \u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Bronze pickaxe (Pine)\u003c/a>, \u003ca href=\"#copper-ore\" data-to=\"copper-ore\">Copper ore\u003c/a>, \u003ca href=\"#tin-ore\" data-to=\"tin-ore\">Tin ore\u003c/a>, \u003ca href=\"#iron-ore\" data-to=\"iron-ore\">Iron ore\u003c/a>, \u003ca href=\"#coal\" data-to=\"coal\">Coal\u003c/a>, \u003ca href=\"#silver-ore\" data-to=\"silver-ore\">Silver ore\u003c/a>, \u003ca href=\"#gold-ore\" data-to=\"gold-ore\">Gold ore\u003c/a>, \u003ca href=\"#platinum-ore\" data-to=\"platinum-ore\">Platinum ore\u003c/a>, \u003ca href=\"#iridium-ore\" data-to=\"iridium-ore\">Iridium ore\u003c/a>, \u003ca href=\"#mithril-ore\" data-to=\"mithril-ore\">Mithril ore\u003c/a>. With more \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a>: \u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Iron pickaxe (Oak)\u003c/a> (Trading 10), \u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Steel pickaxe (Maple)\u003c/a> (Trading 25), \u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Mithril pickaxe (Yew)\u003c/a> (Trading 40). See \u003ca href=\"#shops\" data-to=\"shops\">Shops\u003c/a>.\u003c/p>","src":["wiki/pages/person-greta.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"miner-gretas-house","t":"Miner Greta's house","c":"Places","i":"🏠","sum":"","a":[],"ib":[["Kind","Indoors"],["Danger","Safe"],["Size","9 × 8 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"greta\">\u003c/figure>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"mining","t":"Mining","c":"Skills","i":"⛏️","sum":"Click a rock to mine ore.","a":[],"ib":[["Discipline","🌿 Endurance"],["Taught by","\u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>"],["Max level","99"]],"h":"\u003cp>⛏️ \u003cb>Mining\u003c/b> is a skill in \u003ca href=\"#endurance\" data-to=\"endurance\">Endurance\u003c/a>. Click a rock to mine ore.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#into-the-rocks\" data-to=\"into-the-rocks\">Into the rocks\u003c/a>, from \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>⏩ Quick hands\u003c/td>\u003ctd>5% faster\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍀 Lucky find\u003c/td>\u003ctd>4% chance of an extra one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪶 Light work\u003c/td>\u003ctd>8% chance it costs no stamina\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-what-you-can-gather\">What you can gather\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>From\u003c/th>\u003cth>Gives\u003c/th>\u003cth>XP\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Copper rock\u003c/td>\u003ctd>\u003ca href=\"#copper-ore\" data-to=\"copper-ore\">Copper ore\u003c/a>\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Tin rock\u003c/td>\u003ctd>\u003ca href=\"#tin-ore\" data-to=\"tin-ore\">Tin ore\u003c/a>\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20\u003c/td>\u003ctd>Iron rock\u003c/td>\u003ctd>\u003ca href=\"#iron-ore\" data-to=\"iron-ore\">Iron ore\u003c/a>\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>30\u003c/td>\u003ctd>Coal rock\u003c/td>\u003ctd>\u003ca href=\"#coal\" data-to=\"coal\">Coal\u003c/a>\u003c/td>\u003ctd>14\u003c/td>\u003c/tr>\u003ctr>\u003ctd>40\u003c/td>\u003ctd>Silver rock\u003c/td>\u003ctd>\u003ca href=\"#silver-ore\" data-to=\"silver-ore\">Silver ore\u003c/a>\u003c/td>\u003ctd>20\u003c/td>\u003c/tr>\u003ctr>\u003ctd>55\u003c/td>\u003ctd>Gold rock\u003c/td>\u003ctd>\u003ca href=\"#gold-ore\" data-to=\"gold-ore\">Gold ore\u003c/a>\u003c/td>\u003ctd>30\u003c/td>\u003c/tr>\u003ctr>\u003ctd>70\u003c/td>\u003ctd>Mithril rock\u003c/td>\u003ctd>\u003ca href=\"#mithril-ore\" data-to=\"mithril-ore\">Mithril ore\u003c/a>\u003c/td>\u003ctd>45\u003c/td>\u003c/tr>\u003ctr>\u003ctd>75\u003c/td>\u003ctd>Platinum rock\u003c/td>\u003ctd>\u003ca href=\"#platinum-ore\" data-to=\"platinum-ore\">Platinum ore\u003c/a>\u003c/td>\u003ctd>55\u003c/td>\u003c/tr>\u003ctr>\u003ctd>85\u003c/td>\u003ctd>Iridium rock\u003c/td>\u003ctd>\u003ca href=\"#iridium-ore\" data-to=\"iridium-ore\">Iridium ore\u003c/a>\u003c/td>\u003ctd>70\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>Amethyst rock\u003c/td>\u003ctd>Rough amethyst, 0.1 ct\u003c/td>\u003ctd>8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20\u003c/td>\u003ctd>Topaz rock\u003c/td>\u003ctd>Rough topaz, 0.1 ct\u003c/td>\u003ctd>12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>25\u003c/td>\u003ctd>Emberstone vein\u003c/td>\u003ctd>Emberstone, 0.1 ct\u003c/td>\u003ctd>15\u003c/td>\u003c/tr>\u003ctr>\u003ctd>30\u003c/td>\u003ctd>Emerald rock\u003c/td>\u003ctd>Rough emerald, 0.1 ct\u003c/td>\u003ctd>18\u003c/td>\u003c/tr>\u003ctr>\u003ctd>40\u003c/td>\u003ctd>Sapphire rock\u003c/td>\u003ctd>Rough sapphire, 0.1 ct\u003c/td>\u003ctd>25\u003c/td>\u003c/tr>\u003ctr>\u003ctd>50\u003c/td>\u003ctd>Ruby rock\u003c/td>\u003ctd>Rough ruby, 0.1 ct\u003c/td>\u003ctd>33\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"minnow","t":"Minnow","c":"Items","i":"🐟","sum":"Fish. Sells for 3 bronze.","a":[],"ib":[["Kind","Fish"],["Shop
