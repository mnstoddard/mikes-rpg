ap-potion\">Ember trap potion\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"version-history","t":"Version history","c":"Updates","i":"🆕","sum":"Every game update. The game is at version 0.13.","a":[],"ib":[],"h":"\u003cp>The game is at \u003cb>version 0.13\u003c/b>. Every update adds 0.1; version 1.0 is saved for the finished game.\u003c/p>\n\u003ch2 id=\"s-0-13-2026-11-25-a-faster-smoother-game\">0.13 · 2026-11-25 · A faster, smoother game\u003c/h2>\n\u003cul>\u003cli>The game draws about half as much in town, so it runs smoother, especially on laptops and phones. Nothing looks different: roofs now skip the hidden sides of each roof tile, hair skips the part tucked inside the head, and the Emberhall's stone statues are shaped a little more simply (they look the same).\u003c/li>\u003cli>On slower computers with very sharp screens, the game now draws a little softer when it starts to slow down, and goes back to full sharpness when there's time to spare. Computers that keep up see no change.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-12-2026-11-25-training-the-new-quest-menu-and-fixes\">0.12 · 2026-11-25 · Training, the new quest menu and fixes\u003c/h2>\n\u003cul>\u003cli>Training: new players stay in town until Old Maren's lessons are done. Try to walk out past the lake, the river or the edges of town and you're turned back with a note saying what to do next.\u003c/li>\u003cli>The 📜 Quests menu is new. At the top: what you're on now, then everything you can start right now (who to see, and where). Then 🎓 Training, a master quest with every skill's lesson, the skills each one teaches, and a bar for how many you've done. Then the story, side quests and bounties. Tap a heading to fold it away; finished story chapters fold into one line.\u003c/li>\u003cli>Skill lessons now come in a sensible order: Miner Greta before Smith Brann, Forester Holt before Woodworker Rook, Herbalist Wren before Alchemist Moss, Huntmaster Kael before Archmage Rowan, and Shopkeeper Tam before Captain Bryn. Talk to a trainer too early and they tell you who to see first. A lesson you've already started carries on as normal.\u003c/li>\u003cli>Brother Oren's tour now comes first in The Hall of Light: Keeper Aldric sends you straight to him, then you meet Lisette, Tomas and Wynne. \u003ci>(report #26)\u003c/i>\u003c/li>\u003cli>Cooking has levels that matter: harder meals and better firewood (oak, birch, maple...) need a higher Cooking level, and meals well above your level burn more often. The stove tells you the level you need. \u003ci>(report #25)\u003c/i>\u003c/li>\u003cli>Carrying too much now slows you down instead of stopping you: over your limit you walk at half speed, then a quarter, then an eighth (the 🐢 by your weight shows it). Past four times your limit you can't pick up any more, and you can't run while overloaded. \u003ci>(report #31)\u003c/i>\u003c/li>\u003cli>Little paths now lead from house doors out to the nearest road. \u003ci>(report #28)\u003c/i>\u003c/li>\u003cli>Other players show up as blue dots with their names on the minimap and the big map, and the big map names the key people (quest givers and the repairer) by their doors. \u003ci>(report #29)\u003c/i>\u003c/li>\u003cli>The guide arrow and map marks now point at the next thing for every quest step: the nearest fishing spot, tree or rock you have the level for, the right stove, furnace or anvil, the shop, the board, or the nearest monster to fight. \u003ci>(report #30)\u003c/i>\u003c/li>\u003cli>Every early quest was checked for ways to get stuck. Old Maren now hands you firewood and minnows if you've run out for her cooking lesson, Smith Brann won't let you sell or lose the platelegs he wants to see, and items you've equipped now count when a quest asks for them. \u003ci>(report #32)\u003c/i>\u003c/li>\u003cli>Buttons and quest lines say Equip and Unequip everywhere now (no more Wear, Hold or Put on belt). \u003ci>(report #22)\u003c/i>\u003c/li>\u003cli>Walking through a door shows a short loading sign so the new room doesn't pop in. \u003ci>(report #27)\u003c/i>\u003c/li>\u003cli>Chopped trees fall and sink into the ground instead of shrinking, and the stump shows its rings. Catching a fish has a proper two-handed heave, and the rod bends toward the bobber. \u003ci>(reports #23, #24)\u003c/i>\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-11-2026-11-25-smooth-movement\">0.11 · 2026-11-25 · Smooth movement\u003c/h2>\n\u003cul>\u003cli>Walking is smooth now, not tile by tile. You can stand anywhere and walk in any direction, and you glide instead of hopping from square to square.\u003c/li>\u003cli>Clicking the ground walks you straight to the exact spot you clicked. The path cuts the corners, so you head straight there instead of zig-zagging.\u003c/li>\u003cli>W A S D walks the way the camera faces at any angle, not just 8 directions. Turn the camera while you walk and you turn with it.\u003c/li>\u003cli>Walking into a wall at an angle slides you along it, and walking at the edge of a doorway or a gap between trees eases you into it instead of getting stuck.\u003c/li>\u003cli>Other players glide smoothly too, and footsteps keep an even beat whichever way you walk.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-10-2026-11-25-the-emberguard-embervale-and-the-emberheart\">0.10 · 2026-11-25 · The Emberguard, Embervale and the Emberheart\u003c/h2>\n\u003cul>\u003cli>New names, to match the Emberfall story: the Lighthall is now the Emberhall, the Lightkeepers are the Emberguard, the Kindled are the Emberborn, and the land is Embervale. Its heart, deep under Heartvale, is the Emberheart.\u003c/li>\u003cli>Soul gems are now refined emberstones, the Soul trap spell (and its potion) is now Ember trap, and Soul Debt is now Ember Debt. Gems you already have keep working and keep their ember; only the names changed.\u003c/li>\u003cli>The town is called Emberhold. Archmage Ysolde is now Archmage Rowan, Ysra of the Saltmere is now Ida, and the Archmage of old is Vale.\u003c/li>\u003cli>New players start as Hopefuls, and earn the Ember and Flame ranks from there.\u003c/li>\u003cli>A new book in the Emberhall library tells the Emberfall as every child learns it, and Brother Oren's tour now starts with it. Someone has left a note in the back of the book.\u003c/li>\u003cli>Books about the Emberheart now agree that it burns under Heartvale.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-9-2026-11-25-sound-effects\">0.9 · 2026-11-25 · Sound effects\u003c/h2>\n\u003cul>\u003cli>Sound effects! Chopping, mining, smithing, smelting, cooking and fighting each have their own sounds: a swoosh as you swing, a thunk when the tool lands, and a little reward sound when something goes into your bag.\u003c/li>\u003cli>Cooking makes stirring and chopping sounds, picked at random from three so it never sounds like a loop.\u003c/li>\u003cli>Footsteps change with the ground: grass, dirt paths, wooden floors and bridges, stone, and carpet.\u003c/li>\u003cli>Level ups play a 16-bit treasure fanfare (once, even when a skill and its mastery go up together), and finishing a quest plays a victory tune.\u003c/li>\u003cli>Hitting a monster, a monster getting hurt, a monster going down, and a monster hitting you all have sounds.\u003c/li>\u003cli>Settings has a new 🔔 Sound effects switch and a volume slider. The game remembers both.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-8-2026-11-25-soul-stone-is-now-called-emberstone\">0.8 · 2026-11-25 · Soul stone is now called emberstone\u003c/h2>\n\u003cul>\u003cli>Soul stone has a new name: emberstone. The rocks in the crystal cave, the raw stones in your bag, and everything people and books say about it all use the new name. Stones you already have keep working; only the name changed. Soul gems keep their name.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-7-2026-11-25-an-emberfall-login-screen\">0.7 · 2026-11-25 · An Emberfall login screen\u003c/h2>\n\u003cul>\u003cli>The login screen matches the title screen: the same night sky with rising embers and falling stars, and an ember-glow login box.\u003c/li>\u003cli>The health bars, bag, buttons and the rest of the game stay hidden until you've logged in.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-6-2026-11-25-emberfall-the-games-name-and-title-screen\">0.6 · 2026-11-25 · Emberfall: the game's name and title screen\u003c/h2>\n\u003cul>\u003cli>The game has a name: Emberfall. It's on the title screen, the login box and the browser tab.\u003c/li>\u003cli>A title screen: the glowing Emberfall logo over a night sky, with embers rising from a burning glow and stars falling across it. Tap it (or press any key) to start.\u003c/li>\u003cli>That first tap also starts Mike's song straight away, so the music is already playing when the login box appears.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-5-2026-11-25-title-music-mikes-own-song\">0.5 · 2026-11-25 · Title music: Mike's own song\u003c/h2>\n\u003cul>\u003cli>The login screen now plays Mike's own song, on a loop. It starts on your first click, tap or key press (browsers don't allow sound before that), and fades out when you log in.\u003c/li>\u003cli>Tap 🔊 at the top right of the login box to turn the music off (🔇) or back on. The game remembers your choice.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-4-2026-11-24-play-by-listening-read-aloud-and-quest-pictures\">0.4 · 2026-11-24 · Play by listening: read-aloud and quest pictures\u003c/h2>\n\u003cul>\u003cli>Read aloud: tap 🔊 next to anything people say, books, your quest, the 📜 Quests list and the chat to hear it spoken. Tap it again to stop.\u003c/li>\u003cli>Turn on 🔊 Read everything out loud for me in ⚙️ Settings, and the game reads what people say, books, gifts, warnings and each new quest step as soon as they appear.\u003c/li>\u003cli>A gold arrow on the ground by your feet points the way to your quest's next ❗ person or 📍 place (or the door that leads there). It goes away when you're close.\u003c/li>\u003cli>The quest box shows pictures of what you need, with how many you have (like 🐟 1 / 3, then ✓ once you have them all), so you can follow a quest without reading.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-3-2026-11-23-the-lighthall-tour-running-and-a-minimap\">0.3 · 2026-11-23 · The Lighthall tour, running, and a minimap\u003c/h2>\n\u003cul>\u003cli>The Lighthall carpet is one even, symmetrical rug. \u003ci>(report #3)\u003c/i>\u003c/li>\u003cli>The Lighthall library has proper rows of bookshelves, with books on both sides. \u003ci>(report #4)\u003c/i>\u003c/li>\u003cli>Click a bookshelf to take down a book and read it: the history of Elderra, the shrines, the towns and the people. None of it is needed for a quest; it's there if you're curious. \u003ci>(report #5)\u003c/i>\u003c/li>\u003cli>Brother Oren now gives you a tour of the Hall of Champions: each Radiant's statue, and the empty plinth. It tells the story of the Sundering War and who the Lightkeepers are. \u003ci>(report #6)\u003c/i>\u003c/li>\u003cli>A minimap in the top left, turned the way you're facing. It shows ❗ and 📍 quest targets, and an arrow on its edge points the way to ones further off. Tap it for the big map. \u003ci>(report #7)\u003c/i>\u003c/li>\u003cli>Sister Wynne's dormitory has beds instead of crates, and she explains what happens when you fall and what it costs. \u003ci>(report #8)\u003c/i>\u003c/li>\u003cli>When someone gives you something, the chat says exactly what it was and that it's in your 🎒 bag. \u003ci>(report #9)\u003c/i>\u003c/li>\u003cli>The camera no longer goes inside buildings and walls: it moves in closer instead. \u003ci>(report #10)\u003c/i>\u003c/li>\u003cli>Clicking anywhere on a door works, not just the tile in front of it. \u003ci>(report #11)\u003c/i>\u003c/li>\u003cli>Walls no longer poke through doors. \u003ci>(report #12)\u003c/i>\u003c/li>\u003cli>Old Maren now lives in her own cottage by the lake, with her stove inside, instead of cooking out in the square. \u003ci>(report #13)\u003c/i>\u003c/li>\u003cli>Hedges and bushes are rounder, tighter clumps, with no green box showing. \u003ci>(report #14)\u003c/i>\u003c/li>\u003cli>Trees no longer look cut through; the stump only shows once a tree is chopped down. \u003ci>(report #15)\u003c/i>\u003c/li>\u003cli>The fishing line comes from the tip of the rod. \u003ci>(report #16)\u003c/i>\u003c/li>\u003cli>When a fish bites, the rod bends and you pull the fish out of the water. \u003ci>(report #17)\u003c/i>\u003c/li>\u003cli>No fighting until Huntmaster Kael has taught you combat. With no weapon you fight with your fists. \u003ci>(report #18)\u003c/i>\u003c/li>\u003cli>Running: tap 🏃 or hold Shift. It uses up your breath while you run, and your breath comes back a few seconds after you stop. \u003ci>(report #19)\u003c/i>\u003c/li>\u003cli>Meals that give a lot of stamina are harder to cook without burning. \u003ci>(report #20)\u003c/i>\u003c/li>\u003cli>The General Store has goods on its shelves and things for sale on its tables. \u003ci>(report #21)\u003c/i>\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-2-2026-11-23-robes-that-move-and-phones-that-fit\">0.2 · 2026-11-23 · Robes that move, and phones that fit\u003c/h2>\n\u003cul>\u003cli>Robes and long skirts now stretch around the legs when you walk, so legs no longer poke out through the cloth. \u003ci>(report #1)\u003c/i>\u003c/li>\u003cli>Making your character works on phones: the options scroll, and Start my adventure always stays on screen. \u003ci>(report #2)\u003c/i>\u003c/li>\u003cli>Phones held sideways: the bag scrolls instead of running off the top of the screen. \u003ci>(report #2)\u003c/i>\u003c/li>\u003cli>The game's version now shows at the bottom of Settings, and every bug report records it.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-1-2026-11-23-where-we-start-counting\">0.1 · 2026-11-23 · Where we start counting\u003c/h2>\n\u003cul>\u003cli>Everything built so far: the 3D world, skills, quests, shops, armor and the 🐞 report button.\u003c/li>\u003c/ul>","src":["shared/version.ts"],"w":false,"r":false},{"s":"walking","t":"Walking","c":"Mechanics","i":"🚶","sum":"Smooth, free movement: walk anywhere, any direction.","a":["Movement","WASD"],"ib":[],"h":"\u003cp>You can stand anywhere, not just in the middle of a tile, and walk in any direction. You walk about 1.7 tiles a second; \u003ca href=\"#dexterity\" data-to=\"dexterity\">Dexterity\u003c/a>, swiftness potions and \u003ca href=\"#running\" data-to=\"running\">Running\u003c/a> make you faster.\u003c/p>\n\u003cul>\u003cli>\u003cb>Click\u003c/b> the ground to walk straight to that exact spot. The game finds a way round walls, trees and water, then cuts the corners so you head straight there instead of zig-zagging.\u003c/li>\u003cli>\u003cb>W A S D\u003c/b> walks the way the camera faces, at any angle (turn the camera with Q / E or by dragging, and you turn with it). Walking into a wall at an angle slides you along it, and walking at the edge of a doorway or a gap between trees eases you into it.\u003c/li>\u003cli>People are about 0.56 tiles wide, so you don't clip into walls and trees.\u003c/li>\u003cli>The tile you're standing on is what counts for talking, gathering, fighting, doors and quests. Walking onto a door takes you through it.\u003c/li>\u003cli>Everyone else sees you glide smoothly too.\u003c/li>\u003c/ul>","src":["shared/pathfinding.ts","server/src/WorldRoom.ts"],"w":false,"r":false},{"s":"ward","t":"Ward","c":"Spells","i":"🛡️","sum":"A shield of light that soaks up damage until it breaks or runs out.","a":[],"ib":[["Spellcasting level","3"],["Mana","10"],["Kind","On yourself"],["Learned from","Levelling up"]],"h":"\u003cp>🛡️ A shield of light that soaks up damage until it breaks or runs out.\u003c/p>\n\u003cp>It needs \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a> level 3 and costs 10 mana at Mastery 1 (Mastery lowers the cost). It lasts 120 seconds at Mastery 1.\u003c/p>","src":["shared/combat.ts","shared/spells.ts"],"w":false,"r":false},{"s":"weapons","t":"Weapons","c":"Items","i":"🗡️","sum":"Melee, ranged and magic weapons.","a":[],"ib":[],"h":"\u003cp>Hold a weapon in your gear strip's Weapon slot. With nothing in your hand you punch. Better metal adds to the biggest hit.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Weapon\u003c/th>\u003cth>Style\u003c/th>\u003cth>Level\u003c/th>\u003cth>Biggest hit\u003c/th>\u003cth>Speed\u003c/th>\u003cth>Range\u003c/th>\u003cth>Hands\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🔪 \u003ca href=\"#dagger\" data-to=\"dagger\">Dagger\u003c/a>\u003c/td>\u003ctd>Melee\u003c/td>\u003ctd>1\u003c/td>\u003ctd>2\u003c/td>\u003ctd>1.8s\u003c/td>\u003ctd>1\u003c/td>\u003ctd>One\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🗡️ \u003ca href=\"#sword\" data-to=\"sword\">Sword\u003c/a>\u003c/td>\u003ctd>Melee\u003c/td>\u003ctd>5\u003c/td>\u003ctd>3\u003c/td>\u003ctd>2.4s\u003c/td>\u003ctd>1\u003c/td>\u003ctd>One\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🏏 \u003ca href=\"#mace\" data-to=\"mace\">Mace\u003c/a>\u003c/td>\u003ctd>Melee\u003c/td>\u003ctd>10\u003c/td>\u003ctd>5\u003c/td>\u003ctd>3s\u003c/td>\u003ctd>1\u003c/td>\u003ctd>One\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🔱 \u003ca href=\"#spear\" data-to=\"spear\">Spear\u003c/a>\u003c/td>\u003ctd>Melee\u003c/td>\u003ctd>15\u003c/td>\u003ctd>5\u003c/td>\u003ctd>2.4s\u003c/td>\u003ctd>2\u003c/td>\u003ctd>One\u003c/td>\u003c/tr>\u003ctr>\u003ctd>⚔️ \u003ca href=\"#two-handed-sword\" data-to=\"two-handed-sword\">Two-handed sword\u003c/a>\u003c/td>\u003ctd>Melee\u003c/td>\u003ctd>20\u003c/td>\u003ctd>8\u003c/td>\u003ctd>3.6s\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Two\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪃 \u003ca href=\"#sling\" data-to=\"sling\">Sling\u003c/a>\u003c/td>\u003ctd>Ranged\u003c/td>\u003ctd>1\u003c/td>\u003ctd>2\u003c/td>\u003ctd>2.4s\u003c/td>\u003ctd>4\u003c/td>\u003ctd>One\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🎯 \u003ca href=\"#darts\" data-to=\"darts\">Darts\u003c/a>\u003c/td>\u003ctd>Ranged\u003c/td>\u003ctd>5\u003c/td>\u003ctd>2\u003c/td>\u003ctd>1.2s\u003c/td>\u003ctd>3\u003c/td>\u003ctd>One\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🏹 \u003ca href=\"#bow\" data-to=\"bow\">Bow\u003c/a>\u003c/td>\u003ctd>Ranged\u003c/td>\u003ctd>10\u003c/td>\u003ctd>4\u003c/td>\u003ctd>3s\u003c/td>\u003ctd>6\u003c/td>\u003ctd>Two\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪄 \u003ca href=\"#staff\" data-to=\"staff\">Staff\u003c/a>\u003c/td>\u003ctd>Magic\u003c/td>\u003ctd>1\u003c/td>\u003ctd>spells\u003c/td>\u003ctd>3s\u003c/td>\u003ctd>5\u003c/td>\u003ctd>One\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-metal-bonus\">Metal bonus\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Metal\u003c/th>\u003cth>Adds to biggest hit\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Bronze\u003c/td>\u003ctd>+1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Iron\u003c/td>\u003ctd>+2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Steel\u003c/td>\u003ctd>+3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mithril\u003c/td>\u003ctd>+5\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Bows and staffs are wooden: their wood adds damage instead: Pine +0, Oak +1, Birch +2, Maple +3, Yew +4, Ironwood +6, Elderwood +8.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"what-holt-saw","t":"What Holt Saw","c":"Quests","i":"📜","sum":"Act 1 from Forester Holt.","a":[],"ib":[["Part of","Act 1"],["Given by","Forester Holt"],["Where","on Trainer Row, east of the square"],["Steps","3"]],"h":"\u003cp>\u003cb>What Holt Saw\u003c/b> is part of the Act 1 from \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>, found on Trainer Row, east of the square.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#oath-of-the-flame\" data-to=\"oath-of-the-flame\">Oath of the Flame\u003c/a>, \u003ca href=\"#the-woodcutters-start\" data-to=\"the-woodcutters-start\">The woodcutter's start\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Forester Holt\u003c/li>\u003cli>Count dead trees in 6 places\u003c/li>\u003cli>Go back to Forester Holt \u003ci>(you get: \u003ca href=\"#holts-notes\" data-to=\"holts-notes\">Holt's notes\u003c/a>)\u003c/i>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#holts-notes\" data-to=\"holts-notes\">Holt's notes\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> You've got the Emberhall's ear now. Can I ask you something, quiet-like? I've been a forester forty years, and I swear the trees nearest the shrines die first. Nobody believes me. Count the dead trees in six places for me: three near shrines (the Emberhall's garden, the Westroad shrine and the Thornwood gate) and three far from any (north of the lake, the Greyspine foothills, and the north coast woods). The 🗺️ map marks them.\u003c/p>\n\u003cp>\u003cb>Step 3.\u003c/b> Twenty-eight dead near the shrines, and two far away? I knew it. I knew it! Now, it could be the Ashbound, poisoning the ground round the shrines to spite the Emberhall. That's what the Keepers would say. Keep those notes. And keep it under your hat, eh?\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"what-the-ground-gives","t":"What the ground gives","c":"Quests","i":"📜","sum":"Lessons from Herbalist Wren.","a":[],"ib":[["Part of","Lessons"],["Given by","Herbalist Wren"],["Where","in the little hut by the lake, east of the Mages' Guild"],["Steps","4"]],"h":"\u003cp>\u003cb>What the ground gives\u003c/b> is a lesson from \u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a>, found in the little hut by the lake, east of the Mages' Guild.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Herbalist Wren in the hut by the lake \u003ci>(you get: \u003ca href=\"#shovel\" data-to=\"shovel\">Bronze shovel (Pine)\u003c/a>)\u003c/i>\u003c/li>\u003cli>Equip the shovel (click it in your bag, then Equip)\u003c/li>\u003cli>Dig up 3 things from glinting dig patches\u003c/li>\u003cli>Show Herbalist Wren what you found\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#shovel\" data-to=\"shovel\">Bronze shovel (Pine)\u003c/a>, 1 silver.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> Oh! Mind the drying herbs. I'm Wren. Everyone else round here chops and mines and fishes, but the best things grow under your feet. See the little patches of turned earth that glint in the grass? Those are dig patches. Dig one with a shovel and you'll turn up roots, worms and mushrooms, and herbs once you know what to look for. That's Foraging, part of Endurance. Here's a bronze shovel. Equip it like any other tool.\u003c/p>\n\u003cp>\u003cb>Step 4.\u003c/b> Not bad for a first dig! Worms make good bait, and roots and mushrooms go in the pot. The better you get, the better the finds: sage, ginseng, wild honeycomb, blue lotus, even truffles. And moonpetal only opens at night, so dig after dark. I'll buy anything you dig up, and I sell shovels. Smith Brann can make you a better one, just like an axe. I've been marking the dying patches on my map. There are more every season, and they spread out from the shrines like spilled ink.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"wheat","t":"Wheat","c":"Items","i":"🌾","sum":"Herbs, roots and crop. Sells for 2 bronze.","a":["sheaf of wheat"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","2 bronze"],["Game id","\u003ccode>wheat\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Grown with \u003ca href=\"#farming\" data-to=\"farming\">Farming\u003c/a> level 12: ripe after 40 minutes, 3 to 5 a tile.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"wheat-seeds","t":"Wheat seeds","c":"Items","i":"🌱","sum":"Seed. Sells for 2 bronze.","a":["wheat seed"],"ib":[["Kind","Seeds"],["Shop pays","2 bronze"],["Game id","\u003ccode>seed_wheat\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"wild-honeycomb","t":"Wild honeycomb","c":"Items","i":"🍯","sum":"Herbs, roots and crop. Sells for 7 bronze.","a":["piece of wild honeycomb"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","7 bronze"],["Game id","\u003ccode>honey\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dug up with \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> level 8 (7 XP).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Half of the recipe for the \u003ca href=\"#stamina-potion\" data-to=\"stamina-potion\">Stamina potion\u003c/a>.\u003c/li>\u003cli>A bonus third ingredient in \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a>: also gives 15 stamina.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"wild-roots","t":"Wild roots","c":"Items","i":"🥕","sum":"Herbs, roots and crop. Sells for 2 bronze.","a":["wild root"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","2 bronze"],["Game id","\u003ccode>wild_root\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dug up with \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> level 1 (2 XP).\u003c/li>\u003cli>Sold by \u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Half of the recipe for the \u003ca href=\"#tithe-tonic\" data-to=\"tithe-tonic\">Tithe tonic\u003c/a>.\u003c/li>\u003cli>A cooking ingredient (vegetables): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"wisdom","t":"Wisdom","c":"Skills","i":"🔮","sum":"Magic. Raises your max mana.","a":[],"ib":[["Kind","Discipline"],["Skills","Spellcasting, Enchanting, Alchemy"]],"h":"\u003cp>🔮 \u003cb>Wisdom\u003c/b> is one of the five \u003ca href=\"#disciplines\" data-to=\"disciplines\">Disciplines\u003c/a>. Magic. Raises your max mana. Its level is the average of the levels of its skills you've learned, rounded down.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Skill\u003c/th>\u003cth>What it is\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🪄 \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a>\u003c/td>\u003ctd>Cast spells from your spell bar (bolts fly from a staff in your hand). Spells use mana.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>✨ \u003ca href=\"#enchanting\" data-to=\"enchanting\">Enchanting\u003c/a>\u003c/td>\u003ctd>Use the enchanting altar in the Mages' Guild: a refined emberstone with ember in it adds magic to a staff, a piece of armor or a tool. Archmage Rowan teaches it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>⚗️ \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a>\u003c/td>\u003ctd>Brew potions at the alchemy table in the Mages' Guild: pick 2 ingredients (and maybe a third for a bonus) and an empty vial. Alchemist Moss teaches it.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/stats.ts"],"w":false,"r":false},{"s":"wolf","t":"Wolf","c":"Monsters","i":"🐺","sum":"A level 8 monster. Attacks on sight.","a":[],"ib":[["Level","8"],["Health","20"],["Biggest hit","3"],["Attacks every","2.4s"],["Temper","Attacks on sight"],["Out","Day and night"],["Comes back after","60s"],["Coins","1 to 5 bronze"]],"h":"\u003cp>The \u003cb>Wolf\u003c/b> is a level 8 monster with 20 health. Attacks on sight, and it runs in a pack: when one goes for you, the others nearby join in.\u003c/p>\n\u003cp>Defeating one gives 8 bonus XP on top of 1 XP per point of damage, plus 16 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>The Thornwood (7), The wolf den (4).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🐺 \u003ca href=\"#wolf-pelts\" data-to=\"wolf-pelts\">Wolf pelts\u003c/a>\u003c/td>\u003ctd>50%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🦷 \u003ca href=\"#wolf-fangs\" data-to=\"wolf-fangs\">Wolf fangs\u003c/a>\u003c/td>\u003ctd>40%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>It also drops 1 to 5 bronze coins.\u003c/p>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"wolf-fangs","t":"Wolf fangs","c":"Items","i":"🦷","sum":"Monster drop. Sells for 10 bronze.","a":["wolf fang"],"ib":[["Kind","Monster drops"],["Shop pays","10 bronze"],["Game id","\u003ccode>wolf_fang\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#wolf\" data-to=\"wolf\">Wolf\u003c/a> (40%).\u003c/li>\u003cli>Dropped by the \u003ca href=\"#alpha-wolf\" data-to=\"alpha-wolf\">Alpha wolf\u003c/a> (100%).\u003c/li>\u003cli>Dropped by the \u003ca href=\"#hollow-wolf\" data-to=\"hollow-wolf\">Hollow wolf\u003c/a> (60%).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Half of the recipe for the \u003ca href=\"#strength-potion\" data-to=\"strength-potion\">Strength potion\u003c/a>.\u003c/li>\u003cli>Half of the recipe for the \u003ca href=\"#hunters-brew\" data-to=\"hunters-brew\">Hunter's brew\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"wolf-pelts","t":"Wolf pelts","c":"Items","i":"🐺","sum":"Monster drop. Sells for 12 bronze.","a":["wolf pelt"],"ib":[["Kind","Monster drops"],["Shop pays","12 bronze"],["Game id","\u003ccode>wolf_pelt\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#wolf\" data-to=\"wolf\">Wolf\u003c/a> (50%).\u003c/li>\u003cli>Dropped by the \u003ca href=\"#hollow-wolf\" data-to=\"hollow-wolf\">Hollow wolf\u003c/a> (50%).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Tanned into \u003ca href=\"#leather\" data-to=\"leather\">Leather\u003c/a> at Woodworker Rook's rack (\u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a> level 10).\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"woodcutting","t":"Woodcutting","c":"Skills","i":"🪓","sum":"Click a tree to chop logs.","a":[],"ib":[["Discipline","🌿 Endurance"],["Taught by","\u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>"],["Max level","99"]],"h":"\u003cp>🪓 \u003cb>Woodcutting\u003c/b> is a skill in \u003ca href=\"#endurance\" data-to=\"endurance\">Endurance\u003c/a>. Click a tree to chop logs.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#the-woodcutters-start\" data-to=\"the-woodcutters-start\">The woodcutter's start\u003c/a>, from \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>⏩ Quick hands\u003c/td>\u003ctd>5% faster\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍀 Lucky find\u003c/td>\u003ctd>4% chance of an extra one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪶 Light work\u003c/td>\u003ctd>8% chance it costs no stamina\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-what-you-can-gather\">What you can gather\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>From\u003c/th>\u003cth>Gives\u003c/th>\u003cth>XP\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Pine tree\u003c/td>\u003ctd>\u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Oak tree\u003c/td>\u003ctd>\u003ca href=\"#oak-logs\" data-to=\"oak-logs\">Oak logs\u003c/a>\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>Birch tree\u003c/td>\u003ctd>\u003ca href=\"#birch-logs\" data-to=\"birch-logs\">Birch logs\u003c/a>\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20\u003c/td>\u003ctd>Maple tree\u003c/td>\u003ctd>\u003ca href=\"#maple-logs\" data-to=\"maple-logs\">Maple logs\u003c/a>\u003c/td>\u003ctd>9\u003c/td>\u003c/tr>\u003ctr>\u003ctd>35\u003c/td>\u003ctd>Yew tree\u003c/td>\u003ctd>\u003ca href=\"#yew-logs\" data-to=\"yew-logs\">Yew logs\u003c/a>\u003c/td>\u003ctd>16\u003c/td>\u003c/tr>\u003ctr>\u003ctd>50\u003c/td>\u003ctd>Ironwood tree\u003c/td>\u003ctd>\u003ca href=\"#ironwood-logs\" data-to=\"ironwood-logs\">Ironwood logs\u003c/a>\u003c/td>\u003ctd>28\u003c/td>\u003c/tr>\u003ctr>\u003ctd>70\u003c/td>\u003ctd>Elderwood tree\u003c/td>\u003ctd>\u003ca href=\"#elderwood-logs\" data-to=\"elderwood-logs\">Elderwood logs\u003c/a>\u003c/td>\u003ctd>45\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"woodworker-rook","t":"Woodworker Rook","c":"People","i":"🪚","sum":"Teaches Handicraft. Carves shrine totems for the Emberguard.","a":[],"ib":[["Found in","Woodworker Rook's workshop"],["Shop","Yes"],["Game id","\u003ccode>rook\u003c/code>"]],"h":"\u003cp>\u003cb>Woodworker Rook\u003c/b> teaches \u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a> in his workshop west of the square. He carves shrine totems for the Emberguard (\u003ca href=\"#the-totem\" data-to=\"the-totem\">The Totem\u003c/a>).\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>He hides \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>'s notes inside the totems' bases. One note says \u003ci>&quot;Ask Maren about the first one.&quot;\u003c/i>\u003c/p>\u003c/div>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;Bows, arrows, staffs, leather and cloth: it all starts at my bench. I buy hides, silk and what you make, and sell worms, feathers and thread.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#woodworker-rooks-workshop\" data-to=\"woodworker-rooks-workshop\">Woodworker Rook's workshop\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#handy-work\" data-to=\"handy-work\">Handy work\u003c/a> (lessons)\u003c/li>\u003cli>\u003ca href=\"#the-totem\" data-to=\"the-totem\">The Totem\u003c/a> (Act 1)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Shop:\u003c/b> buys bait, worms, feathers, hides, silk, leather, cloth, arrows, bows, staffs and leather or cloth armor. Sells: \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>, \u003ca href=\"#feathers\" data-to=\"feathers\">Feathers\u003c/a>, \u003ca href=\"#thread\" data-to=\"thread\">Thread\u003c/a>. With more \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a>: \u003ca href=\"#leather\" data-to=\"leather\">Leather\u003c/a> (Trading 8), \u003ca href=\"#arrows\" data-to=\"arrows\">Iron arrows\u003c/a> (Trading 12), \u003ca href=\"#bow\" data-to=\"bow\">Maple bow\u003c/a> (Trading 25), \u003ca href=\"#staff\" data-to=\"staff\">Yew staff\u003c/a> (Trading 35). See \u003ca href=\"#shops\" data-to=\"shops\">Shops\u003c/a>.\u003c/p>","src":["wiki/pages/person-rook.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"woodworker-rooks-workshop","t":"Woodworker Rook's workshop","c":"Places","i":"🏠","sum":"","a":[],"ib":[["Kind","Indoors"],["Danger","Safe"],["Size","11 × 8 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"rook\">\u003c/figure>\n\u003cp>\u003cb>People here:\u003c/b> \u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Things to use:\u003c/b> Workbench, Spinning wheel.\u003c/p>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"worm-bait","t":"Worm bait","c":"Items","i":"🪱","sum":"Materials and food. Sells for 2 bronze.","a":[],"ib":[["Kind","Materials and food"],["Shop pays","2 bronze"],["Game id","\u003ccode>bait_worm\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>, \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cp>Nowhere in the game yet.\u003c/p>","src":["shared/items.ts"],"w":false,"r":false},{"s":"worms","t":"Worms","c":"Items","i":"🪱","sum":"Herbs, roots and crop. Sells for 1 bronze.","a":["worm"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","1 bronze"],["Game id","\u003ccode>worm\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dug up with \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> level 1 (2 XP).\u003c/li>\u003cli>Sold by \u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>.\u003c/li>\u003cli>Sold by \u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#handy-work\" data-to=\"handy-work\">Handy work\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#worm-bait\" data-to=\"worm-bait\">Worm bait\u003c/a>.\u003c/li>\u003cli>Goes into \u003ca href=\"#chum-bait\" data-to=\"chum-bait\">Chum bait\u003c/a>.\u003c/li>\u003cli>Goes into \u003ca href=\"#glow-bait\" data-to=\"glow-bait\">Glow bait\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"yew-logs","t":"Yew logs","c":"Items","i":"🪵","sum":"Log. Sells for 25 bronze.","a":["yew log"],"ib":[["Kind","Logs"],["Shop pays","25 bronze"],["Game id","\u003ccode>yew_logs\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a> level 35 from a yew tree (16 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Used for tool handles, bows, staffs and arrows, and burned as cooking fuel.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"your-lantern","t":"Your lantern","c":"Items","i":"🏮","sum":"Keeper Aldric's gift. While it's in your bag, nights are less dark for you.","a":["lantern"],"ib":[["Kind","Story items"],["Shop pays","Can't be sold"],["Game id","\u003ccode>lantern\u003c/code>"]],"h":"\u003cp>Keeper Aldric's gift. While it's in your bag, nights are less dark for you.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Given in the quest \u003ca href=\"#light-the-way\" data-to=\"light-the-way\">Light the Way\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false}]};

// Links between pages, for "What links here".
const backlinks = new Map();
for (const p of WIKI.pages) for (const m of p.h.matchAll(/data-to="([^"]+)"/g)) { if (m[1] === p.s) continue; if (!backlinks.has(m[1])) backlinks.set(m[1], new Set()); backlinks.get(m[1]).add(p.s); }
const textOf = new Map(WIKI.pages.map((p) => [p.s, (p.t + " " + p.a.join(" ") + " " + strip(p.sum) + " " + strip(p.h)).toLowerCase()]));

// ---- sidebar ----
const side = document.getElementById("side");
function drawSide(current) {
  const counts = {}; for (const p of WIKI.pages) counts[p.c] = (counts[p.c] || 0) + 1;
  side.innerHTML = `<h3>Start</h3><a href="#main-page" class="${current === "main-page" ? "on" : ""}"><span>Main page</span></a><a href="#maps" class="${current === "maps" ? "on" : ""}"><span>🗺️ Maps</span></a><a href="#random"><span>Random page</span></a>` +
    `<h3>Categories</h3>` + WIKI.categories.map((c) => `<a href="#${catSlug(c)}" class="${current === catSlug(c) ? "on" : ""}"><span>${CAT_ICONS[c] || ""} ${esc(c)}</span><span>${counts[c]}</span></a>`).join("") +
    `<h3>This wiki</h3><a href="#how-to-update-the-wiki"><span>How to update it</span></a><a href="#names"><span>Names</span></a><a href="#version-history"><span>Game version ${esc(WIKI.version)}</span></a>`;
}

// ---- pages ----
const view = document.getElementById("page");
function infobox(p) {
  if (!p.ib.length) return "";
  return `<aside class="infobox"><div class="ib-head">${p.i ? `<div class="ib-icon">${p.i}</div>` : ""}<div class="ib-title">${esc(p.t)}</div><div class="ib-cat">${esc(p.c)}</div></div>` +
    (p.ib.length ? `<dl>${p.ib.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>` : "") + `</aside>`;
}
function toc(html) {
  const hs = [...html.matchAll(/<h2 id="([^"]+)">(.*?)<\/h2>/g)];
  if (hs.length < 3) return "";
  return `<nav class="toc" aria-label="Contents"><b>Contents</b><ol>${hs.map((h) => `<li><a href="#" data-jump="${h[1]}">${strip(h[2])}</a></li>`).join("")}</ol></nav>`;
}
function showPage(p) {
  const links = [...(backlinks.get(p.s) || [])].map((s) => bySlug.get(s)).filter(Boolean).sort((a, b) => a.t.localeCompare(b.t));
  const made = p.w
    ? `<span class="made written">✍️ Written page</span> Edit <code>${esc(p.src[0])}</code>${p.src.length > 1 ? `; the "In the game" part comes from ${p.src.slice(1).map((s) => `<code>${esc(s)}</code>`).join(", ")}` : ""}.`
    : `<span class="made game">⚙️ Made from the game's code</span> ${p.src.map((s) => `<code>${esc(s)}</code>`).join(", ")}. Change the game, then rebuild the wiki.`;
  let extra = "";
  if (p.s === "main-page") extra = mainExtras();
  view.innerHTML = `<div class="crumb"><a href="#${catSlug(p.c)}">${CAT_ICONS[p.c] || ""} ${esc(p.c)}</a></div><h1>${esc(p.t)}</h1>` +
    (p.sum ? `<p class="lede">${p.sum}</p>` : `<div class="lede"></div>`) +
    `<div class="content">${infobox(p)}${toc(p.h)}${p.h}${extra}</div>` +
    `<div class="foot"><div>${made}${p.r ? ` Some names here were swapped from the game's old ones (see <a href="#names">Names</a>).` : ""}</div>` +
    `<div class="chips">Category: <a class="chip" href="#${catSlug(p.c)}">${esc(p.c)}</a></div>` +
    (links.length ? `<div><b>What links here:</b> ${links.map((l) => `<a href="#${l.s}">${esc(l.t)}</a>`).join(", ")}</div>` : "") + `</div>`;
  document.title = p.s === "main-page" ? "Emberfall Wiki" : `${p.t} · Emberfall Wiki`;
}
function mainExtras() {
  const counts = {}; for (const p of WIKI.pages) counts[p.c] = (counts[p.c] || 0) + 1;
  return `<h2 id="s-browse">Browse</h2><div class="cats">` + WIKI.categories.filter((c) => c !== "Wiki").map((c) =>
    `<a class="cat" href="#${catSlug(c)}"><h3>${CAT_ICONS[c] || ""} ${esc(c)} <span>${counts[c]}</span></h3><p>${esc(CAT_BLURBS[c] || "")}</p></a>`).join("") + `</div>` +
    `<p style="color:var(--muted);font-size:14px">${WIKI.pages.length} pages. Built ${esc(WIKI.built)} from game version ${esc(WIKI.version)}.</p>`;
}
function rows(list, q) {
  let letter = "";
  return `<div class="list">` + list.map((p) => {
    const L = p.t.replace(/^(The|A) /, "")[0].toUpperCase();
    const head = !q && L !== letter ? `<div class="letter">${(letter = L)}</div>` : "";
    return `${head}<div class="row"><a href="#${p.s}">${p.i ? p.i + " " : ""}${esc(p.t)}</a>${p.sum ? `<small>${q ? snippet(p, q) : strip(p.sum)}</small>` : q ? `<small>${snippet(p, q)}</small>` : ""}</div>`;
  }).join("") + `</div>`;
}
function showCategory(c) {
  const list = WIKI.pages.filter((p) => p.c === c).sort((a, b) => a.t.replace(/^(The|A) /, "").localeCompare(b.t.replace(/^(The|A) /, "")));
  view.innerHTML = `<div class="crumb"><a href="#main-page">Main page</a></div><h1>${CAT_ICONS[c] || ""} ${esc(c)}</h1><p class="lede">${esc(CAT_BLURBS[c] || "")} ${list.length} pages.</p><div class="content">${rows(list)}</div>`;
  document.title = `${c} · Emberfall Wiki`;
}
function snippet(p, q) {
  const t = strip(p.sum + " " + p.h); const i = t.toLowerCase().indexOf(q);
  if (i < 0) return esc(t.slice(0, 120));
  const s = Math.max(0, i - 50);
  return `<span class="hit">${s ? "…" : ""}${esc(t.slice(s, i))}<mark>${esc(t.slice(i, i + q.length))}</mark>${esc(t.slice(i + q.length, i + q.length + 80))}…</span>`;
}
function search(q) {
  q = q.trim().toLowerCase(); if (!q) return [];
  const scored = [];
  for (const p of WIKI.pages) {
    const t = p.t.toLowerCase();
    let s = t === q ? 100 : t.startsWith(q) ? 80 : t.includes(q) ? 60 : p.a.some((a) => a.toLowerCase().includes(q)) ? 50 : 0;
    if (!s) { const n = textOf.get(p.s).split(q).length - 1; if (n) s = Math.min(40, 10 + n * 3); }
    if (s) scored.push([s, p]);
  }
  return scored.sort((a, b) => b[0] - a[0] || a[1].t.localeCompare(b[1].t)).map((x) => x[1]);
}
let lastQuery = "";
function showSearch(q) {
  const list = search(q);
  view.innerHTML = `<div class="crumb"><a href="#main-page">Main page</a></div><h1>Search: ${esc(q)}</h1><p class="lede">${list.length ? `${list.length} page${list.length > 1 ? "s" : ""} mention it.` : "No page mentions that yet."}</p><div class="content">${rows(list, q.trim().toLowerCase())}</div>`;
}


// ---- maps: drawn tile by tile from the game's own map ----
const MARK_STYLE = { person: ["#ffffff", "#1b2029"], monster: ["#ff5a5a", "#3a0d0d"], door: ["#ffd84a", "#3a2a00"] };
function drawMaps() {
  for (const fig of view.querySelectorAll(".map[data-area]")) {
    const m = WIKI.maps[fig.dataset.area];
    if (!m) continue;
    const px = Math.max(4, Math.min(24, Math.floor(1200 / m.w)));
    const c = document.createElement("canvas");
    c.width = m.w * px; c.height = m.h * px;
    const g = c.getContext("2d");
    for (let y = 0; y < m.h; y++) {
      const row = m.rows[y];
      for (let x = 0; x < m.w; x++) { g.fillStyle = m.palette[row.charCodeAt(x) - 48]; g.fillRect(x * px, y * px, px, px); }
    }
    const r = Math.max(3, px * 0.45);
    const dots = m.marks.filter((k) => MARK_STYLE[k.kind]);
    for (const k of dots) {
      const [fill, ring] = MARK_STYLE[k.kind];
      g.beginPath(); g.arc((k.x + .5) * px, (k.y + .5) * px, r, 0, Math.PI * 2);
      g.fillStyle = fill; g.fill(); g.lineWidth = Math.max(1.5, px / 6); g.strokeStyle = ring; g.stroke();
    }
    g.textAlign = "center"; g.textBaseline = "middle"; g.lineJoin = "round";
    const text = (t, x, y, size, color) => { g.font = `600 ${size}px "Source Sans 3", sans-serif`; g.lineWidth = Math.max(3, size / 4); g.strokeStyle = "rgba(0,0,0,.85)"; g.strokeText(t, x, y); g.fillStyle = color; g.fillText(t, x, y); };
    for (const k of m.marks) if (k.kind === "label" || k.kind === "big") text(k.text, k.x * px, k.y * px, k.kind === "big" ? px * 4.2 : px * 3.2, k.kind === "big" ? "#ffe9a8" : "#ffffff");
    if (px >= 10) for (const k of dots) if (k.kind !== "monster") text(k.text, (k.x + .5) * px, (k.y - .6) * px, Math.max(11, px * .75), k.kind === "door" ? "#ffe9a8" : "#ffffff");
    if (m.w < 120) c.style.maxWidth = m.w * 16 + "px"; // small rooms stay small
    const wrap = document.createElement("div"); wrap.className = "mw"; wrap.appendChild(c);
    const cap = document.createElement("figcaption");
    cap.innerHTML = `<span>${esc(m.name)}: ${m.w} × ${m.h} tiles</span><span>⚪ people</span><span>🔴 monsters</span><span>🟡 doors</span><span>Tap to zoom; tap a dot to open its page.</span>`;
    fig.replaceChildren(wrap, cap);
    const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; fig.appendChild(tip);
    const hit = (e) => {
      const b = c.getBoundingClientRect(), s = b.width / c.width;
      const tx = (e.clientX - b.left) / s / px, ty = (e.clientY - b.top) / s / px;
      let best = null, bd = Infinity;
      for (const k of dots) { const d = Math.hypot(k.x + .5 - tx, k.y + .5 - ty); if (d < bd) { bd = d; best = k; } }
      const reach = Math.max(1.2, 10 / (s * px));
      return bd <= reach ? best : null;
    };
    c.addEventListener("mousemove", (e) => { const k = hit(e); tip.hidden = !k; if (k) { tip.textContent = k.text; tip.style.left = e.clientX + 12 + "px"; tip.style.top = e.clientY + 12 + "px"; } c.style.cursor = k ? "pointer" : ""; });
    c.addEventListener("mouseleave", () => { tip.hidden = true; });
    c.addEventListener("click", (e) => { const k = hit(e); if (k && k.to && bySlug.has(k.to)) location.hash = k.to; else fig.classList.toggle("zoomed"); });
  }
}

// ---- routing (plain #slug links) ----
function route() {
  let h = decodeURIComponent(location.hash.slice(1)) || "main-page";
  if (h === "random") { const p = WIKI.pages[Math.floor(Math.random() * WIKI.pages.length)]; location.replace("#" + p.s); return; }
  if (h === "search") { showSearch(lastQuery); drawSide(h); return; }
  const cat = WIKI.categories.find((c) => catSlug(c) === h);
  if (cat) showCategory(cat); else showPage(bySlug.get(h) || bySlug.get("main-page"));
  drawSide(h);
  drawMaps();
  document.body.classList.remove("menu-open");
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
view.addEventListener("click", (e) => {
  const j = e.target.closest("[data-jump]");
  if (j) { e.preventDefault(); document.getElementById(j.dataset.jump)?.scrollIntoView({ behavior: "smooth", block: "start" }); }
});

// ---- search box ----
const q = document.getElementById("q"), results = document.getElementById("results");
let sel = -1;
function drawResults() {
  const list = search(q.value).slice(0, 8);
  sel = -1;
  if (!q.value.trim()) { results.hidden = true; return; }
  results.innerHTML = list.map((p) => `<a href="#${p.s}"><span class="ri">${p.i || "📄"}</span><span class="rt">${esc(p.t)}</span><span class="rc">${esc(p.c)}</span></a>`).join("") +
    `<a href="#search" data-all="1"><span class="ri">🔎</span><span>Every page that mentions “${esc(q.value.trim())}”</span></a>`;
  results.hidden = false;
}
q.addEventListener("input", drawResults);
q.addEventListener("keydown", (e) => {
  const items = [...results.querySelectorAll("a")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; items.forEach((a, i) => a.classList.toggle("on", i === sel)); }
  else if (e.key === "Enter") { e.preventDefault(); const a = items[sel] || items[items.length - 1]; if (a) a.click(); }
  else if (e.key === "Escape") { results.hidden = true; q.blur(); }
});
results.addEventListener("click", (e) => {
  const a = e.target.closest("a"); if (!a) return;
  lastQuery = q.value;
  if (a.dataset.all) { e.preventDefault(); if (location.hash === "#search") route(); else location.hash = "search"; }
  results.hidden = true; q.value = ""; q.blur();
});
document.addEventListener("click", (e) => { if (!e.target.closest(".search")) results.hidden = true; if (!e.target.closest(".side, #menuBtn")) document.body.classList.remove("menu-open"); });
document.addEventListener("keydown", (e) => { if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); } });
document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.toggle("menu-open"));

// ---- secrets toggle (remembered in this browser only) ----
const secrets = document.getElementById("secrets");
try { if (localStorage.getItem("emberfall-wiki-secrets") === "off") secrets.checked = false; } catch {}
const applySecrets = () => { document.body.classList.toggle("no-secrets", !secrets.checked); try { localStorage.setItem("emberfall-wiki-secrets", secrets.checked ? "on" : "off"); } catch {} };
secrets.addEventListener("change", applySecrets);
applySecrets();
route();
</script>
