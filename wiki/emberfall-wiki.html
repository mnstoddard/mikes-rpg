ooth by years of fingers. Maren gave it to you.","a":["worn charm"],"ib":[["Kind","Story items"],["Shop pays","Can't be sold"],["Game id","\u003ccode>marens_charm\u003c/code>"]],"h":"\u003cp>A little wooden flame, worn smooth by years of fingers. Maren gave it to you.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Given in the quest \u003ca href=\"#marens-question\" data-to=\"marens-question\">Maren's Question\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"mastery","t":"Mastery","c":"Mechanics","i":"⭐","sum":"Your experience with one type of thing.","a":[],"ib":[],"h":"\u003cp>Mastery is your experience with one kind of thing: Oak, Trout, Wolf, Firebolt, Stew. Each Mastery levels separately (the first level takes 10 XP, each one 10% more than the last) and makes that thing faster, more reliable or more valuable.\u003c/p>\n\u003cp>Every Mastery level you earn gives 1 Mastery point to spend in any skill's tree (see each skill's page). Rank 1 costs 1 point, rank 2 costs 2 more, rank 3 costs 3 more. Resetting a tree is free for now.\u003c/p>","src":["shared/mastery.ts","shared/skilltree.ts"],"w":false,"r":false},{"s":"meals","t":"Meals","c":"Items","i":"🍲","sum":"Dishes you cook at a stove.","a":[],"ib":[],"h":"\u003cp>Meals are cooked with \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>: pick a dish, put ingredients in the pot, and pick a log to burn. Every mix is its own meal. Meals give back stamina.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Dish\u003c/th>\u003cth>Cooking level\u003c/th>\u003cth>Good with\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🍲 Stew\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Takes anything, and gets the most from a good fire\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🥘 Stir fry\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Best with chicken and beef. No fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍛 Curry\u003c/td>\u003ctd>5\u003c/td>\u003ctd>Best with fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🥩 Steak\u003c/td>\u003ctd>4\u003c/td>\u003ctd>Just meat (beef or boar), with a little veg on the side\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍖 Roast\u003c/td>\u003ctd>7\u003c/td>\u003ctd>Best with beef, then chicken. No fish\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-ingredients\">Ingredients\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Ingredient\u003c/th>\u003cth>Kind\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#minnow\" data-to=\"minnow\">Minnow\u003c/a>\u003c/td>\u003ctd>Fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#trout\" data-to=\"trout\">Trout\u003c/a>\u003c/td>\u003ctd>Fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#perch\" data-to=\"perch\">Perch\u003c/a>\u003c/td>\u003ctd>Fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#salmon\" data-to=\"salmon\">Salmon\u003c/a>\u003c/td>\u003ctd>Fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#pike\" data-to=\"pike\">Pike\u003c/a>\u003c/td>\u003ctd>Fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#tuna\" data-to=\"tuna\">Tuna\u003c/a>\u003c/td>\u003ctd>Fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#swordfish\" data-to=\"swordfish\">Swordfish\u003c/a>\u003c/td>\u003ctd>Fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#eel\" data-to=\"eel\">Eel\u003c/a>\u003c/td>\u003ctd>Fish\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#raw-chicken\" data-to=\"raw-chicken\">Raw chicken\u003c/a>\u003c/td>\u003ctd>Chicken\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#raw-beef\" data-to=\"raw-beef\">Raw beef\u003c/a>\u003c/td>\u003ctd>Meat\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#raw-boar\" data-to=\"raw-boar\">Raw boar\u003c/a>\u003c/td>\u003ctd>Meat\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#potatoes\" data-to=\"potatoes\">Potatoes\u003c/a>\u003c/td>\u003ctd>Vegetables\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#carrots\" data-to=\"carrots\">Carrots\u003c/a>\u003c/td>\u003ctd>Vegetables\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#mushrooms\" data-to=\"mushrooms\">Mushrooms\u003c/a>\u003c/td>\u003ctd>Vegetables\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#wild-roots\" data-to=\"wild-roots\">Wild roots\u003c/a>\u003c/td>\u003ctd>Vegetables\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#truffles\" data-to=\"truffles\">Truffles\u003c/a>\u003c/td>\u003ctd>Vegetables\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/cooking.ts"],"w":false,"r":false},{"s":"melee","t":"Melee","c":"Skills","i":"🗡️","sum":"Hold a dagger, sword, mace, spear or two-handed sword and click a monster.","a":[],"ib":[["Discipline","💪 Strength"],["Taught by","\u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>"],["Max level","99"]],"h":"\u003cp>🗡️ \u003cb>Melee\u003c/b> is a skill in \u003ca href=\"#strength\" data-to=\"strength\">Strength\u003c/a>. Hold a dagger, sword, mace, spear or two-handed sword and click a monster.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#standing-your-ground\" data-to=\"standing-your-ground\">Standing your ground\u003c/a>, from \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🎯 Precise strikes\u003c/td>\u003ctd>hit 2% more often\u003c/td>\u003c/tr>\u003ctr>\u003ctd>💥 Heavy blows\u003c/td>\u003ctd>hit 5% harder\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪶 Second wind\u003c/td>\u003ctd>10% chance it costs no stamina\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"memory-echoes","t":"Memory Echoes","c":"Story","i":"🧩","sum":"Glimpses of the past that some quests show you.","a":[],"ib":[],"h":"\u003cp>\u003cb>Memory Echoes\u003c/b> (🧩) are short glimpses of the past that some quests show you, so players can see history for themselves instead of being told. Planned echoes include robed mages chanting around a pit of fire (\u003ci>The Old Shaft\u003c/i>), and \u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>'s first day in year 40, with a young, smiling Vale (\u003ci>Maren's First Day\u003c/i>).\u003c/p>","src":["wiki/pages/memory-echoes.md"],"w":true,"r":false},{"s":"mend","t":"Mend","c":"Spells","i":"🪡","sum":"Repairs your most worn tool, weapon or armor piece good as new. It also uses 1 of what it's made of (a bar, or a log).","a":[],"ib":[["Spellcasting level","18"],["Mana","20"],["Kind","On yourself"],["Learned from","Levelling up"]],"h":"\u003cp>🪡 Repairs your most worn tool, weapon or armor piece good as new. It also uses 1 of what it's made of (a bar, or a log).\u003c/p>\n\u003cp>It needs \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a> level 18 and costs 20 mana at Mastery 1 (Mastery lowers the cost).\u003c/p>","src":["shared/combat.ts","shared/spells.ts"],"w":false,"r":false},{"s":"miner-greta","t":"Miner Greta","c":"People","i":"⛏️","sum":"Teaches Mining. Finds that emberstone veins flow toward the shrines.","a":[],"ib":[["Found in","Miner Greta's house"],["Shop","Yes"],["Game id","\u003ccode>greta\u003c/code>"]],"h":"\u003cp>\u003cb>Miner Greta\u003c/b> teaches \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a> on Trainer Row. She's found that emberstone veins flow toward \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a>, and that the heartbeat in the rock of the \u003ca href=\"#the-crystal-cave\" data-to=\"the-crystal-cave\">Crystal Cave\u003c/a> is slower than when she was a girl.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;I buy ore and pickaxes, and I sell bronze pickaxes and ore.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#miner-gretas-house\" data-to=\"miner-gretas-house\">Miner Greta's house\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#into-the-rocks\" data-to=\"into-the-rocks\">Into the rocks\u003c/a> (lessons)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Shop:\u003c/b> buys ore and pickaxes. Sells: \u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Bronze pickaxe (Pine)\u003c/a>, \u003ca href=\"#copper-ore\" data-to=\"copper-ore\">Copper ore\u003c/a>, \u003ca href=\"#tin-ore\" data-to=\"tin-ore\">Tin ore\u003c/a>, \u003ca href=\"#iron-ore\" data-to=\"iron-ore\">Iron ore\u003c/a>, \u003ca href=\"#coal\" data-to=\"coal\">Coal\u003c/a>, \u003ca href=\"#silver-ore\" data-to=\"silver-ore\">Silver ore\u003c/a>, \u003ca href=\"#gold-ore\" data-to=\"gold-ore\">Gold ore\u003c/a>, \u003ca href=\"#platinum-ore\" data-to=\"platinum-ore\">Platinum ore\u003c/a>, \u003ca href=\"#iridium-ore\" data-to=\"iridium-ore\">Iridium ore\u003c/a>, \u003ca href=\"#mithril-ore\" data-to=\"mithril-ore\">Mithril ore\u003c/a>. With more \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a>: \u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Iron pickaxe (Oak)\u003c/a> (Trading 10), \u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Steel pickaxe (Maple)\u003c/a> (Trading 25), \u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Mithril pickaxe (Yew)\u003c/a> (Trading 40). See \u003ca href=\"#shops\" data-to=\"shops\">Shops\u003c/a>.\u003c/p>","src":["wiki/pages/person-greta.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"miner-gretas-house","t":"Miner Greta's house","c":"Places","i":"🏠","sum":"","a":[],"ib":[["Kind","Indoors"],["Danger","Safe"],["Size","9 × 8 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"greta\">\u003c/figure>\n\u003cp>\u003cb>People here:\u003c/b> \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>.\u003c/p>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"mining","t":"Mining","c":"Skills","i":"⛏️","sum":"Click a rock to mine ore.","a":[],"ib":[["Discipline","🌿 Endurance"],["Taught by","\u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>"],["Max level","99"]],"h":"\u003cp>⛏️ \u003cb>Mining\u003c/b> is a skill in \u003ca href=\"#endurance\" data-to=\"endurance\">Endurance\u003c/a>. Click a rock to mine ore.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#into-the-rocks\" data-to=\"into-the-rocks\">Into the rocks\u003c/a>, from \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>⏩ Quick hands\u003c/td>\u003ctd>5% faster\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍀 Lucky find\u003c/td>\u003ctd>4% chance of an extra one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪶 Light work\u003c/td>\u003ctd>8% chance it costs no stamina\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-what-you-can-gather\">What you can gather\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>From\u003c/th>\u003cth>Gives\u003c/th>\u003cth>XP\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Copper rock\u003c/td>\u003ctd>\u003ca href=\"#copper-ore\" data-to=\"copper-ore\">Copper ore\u003c/a>\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Tin rock\u003c/td>\u003ctd>\u003ca href=\"#tin-ore\" data-to=\"tin-ore\">Tin ore\u003c/a>\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20\u003c/td>\u003ctd>Iron rock\u003c/td>\u003ctd>\u003ca href=\"#iron-ore\" data-to=\"iron-ore\">Iron ore\u003c/a>\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>30\u003c/td>\u003ctd>Coal rock\u003c/td>\u003ctd>\u003ca href=\"#coal\" data-to=\"coal\">Coal\u003c/a>\u003c/td>\u003ctd>14\u003c/td>\u003c/tr>\u003ctr>\u003ctd>40\u003c/td>\u003ctd>Silver rock\u003c/td>\u003ctd>\u003ca href=\"#silver-ore\" data-to=\"silver-ore\">Silver ore\u003c/a>\u003c/td>\u003ctd>20\u003c/td>\u003c/tr>\u003ctr>\u003ctd>55\u003c/td>\u003ctd>Gold rock\u003c/td>\u003ctd>\u003ca href=\"#gold-ore\" data-to=\"gold-ore\">Gold ore\u003c/a>\u003c/td>\u003ctd>30\u003c/td>\u003c/tr>\u003ctr>\u003ctd>70\u003c/td>\u003ctd>Mithril rock\u003c/td>\u003ctd>\u003ca href=\"#mithril-ore\" data-to=\"mithril-ore\">Mithril ore\u003c/a>\u003c/td>\u003ctd>45\u003c/td>\u003c/tr>\u003ctr>\u003ctd>75\u003c/td>\u003ctd>Platinum rock\u003c/td>\u003ctd>\u003ca href=\"#platinum-ore\" data-to=\"platinum-ore\">Platinum ore\u003c/a>\u003c/td>\u003ctd>55\u003c/td>\u003c/tr>\u003ctr>\u003ctd>85\u003c/td>\u003ctd>Iridium rock\u003c/td>\u003ctd>\u003ca href=\"#iridium-ore\" data-to=\"iridium-ore\">Iridium ore\u003c/a>\u003c/td>\u003ctd>70\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>Amethyst rock\u003c/td>\u003ctd>Rough amethyst, 0.1 ct\u003c/td>\u003ctd>8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20\u003c/td>\u003ctd>Topaz rock\u003c/td>\u003ctd>Rough topaz, 0.1 ct\u003c/td>\u003ctd>12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>25\u003c/td>\u003ctd>Emberstone vein\u003c/td>\u003ctd>Emberstone, 0.1 ct\u003c/td>\u003ctd>15\u003c/td>\u003c/tr>\u003ctr>\u003ctd>30\u003c/td>\u003ctd>Emerald rock\u003c/td>\u003ctd>Rough emerald, 0.1 ct\u003c/td>\u003ctd>18\u003c/td>\u003c/tr>\u003ctr>\u003ctd>40\u003c/td>\u003ctd>Sapphire rock\u003c/td>\u003ctd>Rough sapphire, 0.1 ct\u003c/td>\u003ctd>25\u003c/td>\u003c/tr>\u003ctr>\u003ctd>50\u003c/td>\u003ctd>Ruby rock\u003c/td>\u003ctd>Rough ruby, 0.1 ct\u003c/td>\u003ctd>33\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"minnow","t":"Minnow","c":"Items","i":"🐟","sum":"Fish. Sells for 3 bronze.","a":[],"ib":[["Kind","Fish"],["Shop pays","3 bronze"],["Game id","\u003ccode>minnow\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a> level 1 from a shallow water (2 XP each).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (fish): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"mithril-bar","t":"Mithril bar","c":"Items","i":"🧈","sum":"Bar. Sells for 172 bronze.","a":[],"ib":[["Kind","Bars"],["Shop pays","172 bronze"],["Game id","\u003ccode>mithril_bar\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#mithril-ore\" data-to=\"mithril-ore\">Mithril ore\u003c/a>, \u003ca href=\"#coal\" data-to=\"coal\">Coal\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"mithril-ore","t":"Mithril ore","c":"Items","i":"🪨","sum":"Ore. Sells for 120 bronze.","a":[],"ib":[["Kind","Ore"],["Shop pays","120 bronze"],["Game id","\u003ccode>mithril_ore\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a> level 70 from a mithril rock (45 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#mithril-bar\" data-to=\"mithril-bar\">Mithril bar\u003c/a>.\u003c/li>\u003cli>Smelted into \u003ca href=\"#mithril-bar\" data-to=\"mithril-bar\">Mithril bar\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"money","t":"Money","c":"Mechanics","i":"🪙","sum":"Coins, from bronze up to iridium.","a":[],"ib":[],"h":"\u003cp>Coins come in 5 kinds: bronze, silver, gold, platinum, iridium. Each is worth 100 of the one below it (100 bronze = 1 silver, 100 silver = 1 gold, and so on).\u003c/p>","src":["shared/money.ts"],"w":false,"r":false},{"s":"monsters","t":"Monsters","c":"Monsters","i":"🐺","sum":"Every monster in the game.","a":[],"ib":[],"h":"\u003cp>Every monster in the game today, from the code. Monsters wander a few tiles from home, chase you for a while, then give up and go home.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Monster\u003c/th>\u003cth>Level\u003c/th>\u003cth>Health\u003c/th>\u003cth>Biggest hit\u003c/th>\u003cth>Temper\u003c/th>\u003cth>Where\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🐔 \u003ca href=\"#chicken\" data-to=\"chicken\">Chicken\u003c/a>\u003c/td>\u003ctd>1\u003c/td>\u003ctd>4\u003c/td>\u003ctd>0\u003c/td>\u003ctd>Never fights back\u003c/td>\u003ctd>Heartvale, near the Emberhall; Heartvale, near the lake\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐀 \u003ca href=\"#rat\" data-to=\"rat\">Rat\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003ctd>6\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Fights back if you hit it\u003c/td>\u003ctd>Heartvale, near Quarry; The old mine\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐄 \u003ca href=\"#cow\" data-to=\"cow\">Cow\u003c/a>\u003c/td>\u003ctd>3\u003c/td>\u003ctd>12\u003c/td>\u003ctd>0\u003c/td>\u003ctd>Never fights back\u003c/td>\u003ctd>Heartvale, near Pasture\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🟢 \u003ca href=\"#slime\" data-to=\"slime\">Slime\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003ctd>8\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Fights back if you hit it\u003c/td>\u003ctd>Heartvale, near the lake; Heartvale, near the Emberhall\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐗 \u003ca href=\"#boar\" data-to=\"boar\">Boar\u003c/a>\u003c/td>\u003ctd>7\u003c/td>\u003ctd>22\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Fights back if you hit it\u003c/td>\u003ctd>Heartvale, near Pasture\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🦇 \u003ca href=\"#giant-bat\" data-to=\"giant-bat\">Giant bat\u003c/a>\u003c/td>\u003ctd>6\u003c/td>\u003ctd>14\u003c/td>\u003ctd>2\u003c/td>\u003ctd>Attacks on sight, night only\u003c/td>\u003ctd>Heartvale, near the lake; Heartvale, near the Emberhall; Heartvale, near Pasture; The Thornwood, near Graveyard; The Thornwood\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐺 \u003ca href=\"#wolf\" data-to=\"wolf\">Wolf\u003c/a>\u003c/td>\u003ctd>8\u003c/td>\u003ctd>20\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Attacks on sight, pack\u003c/td>\u003ctd>The Thornwood; The wolf den\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🕷️ \u003ca href=\"#cave-spider\" data-to=\"cave-spider\">Cave spider\u003c/a>\u003c/td>\u003ctd>14\u003c/td>\u003ctd>34\u003c/td>\u003ctd>5\u003c/td>\u003ctd>Attacks on sight\u003c/td>\u003ctd>The spider cave\u003c/td>\u003c/tr>\u003ctr>\u003ctd>👺 \u003ca href=\"#goblin\" data-to=\"goblin\">Goblin\u003c/a>\u003c/td>\u003ctd>12\u003c/td>\u003ctd>30\u003c/td>\u003ctd>4\u003c/td>\u003ctd>Attacks on sight\u003c/td>\u003ctd>The Thornwood, near Goblin camp\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🕷️ \u003ca href=\"#giant-spider\" data-to=\"giant-spider\">Giant spider\u003c/a>\u003c/td>\u003ctd>18\u003c/td>\u003ctd>42\u003c/td>\u003ctd>6\u003c/td>\u003ctd>Attacks on sight\u003c/td>\u003ctd>The Thornwood, near Spider hollow\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐺 \u003ca href=\"#alpha-wolf\" data-to=\"alpha-wolf\">Alpha wolf\u003c/a>\u003c/td>\u003ctd>22\u003c/td>\u003ctd>160\u003c/td>\u003ctd>9\u003c/td>\u003ctd>Attacks on sight, pack\u003c/td>\u003ctd>The wolf den\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🥷 \u003ca href=\"#ashbound-scout\" data-to=\"ashbound-scout\">Ashbound scout\u003c/a>\u003c/td>\u003ctd>9\u003c/td>\u003ctd>24\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Fights back if you hit it\u003c/td>\u003ctd>Heartvale, near To the Barrens (closed)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐺 \u003ca href=\"#hollow-wolf\" data-to=\"hollow-wolf\">Hollow wolf\u003c/a>\u003c/td>\u003ctd>13\u003c/td>\u003ctd>32\u003c/td>\u003ctd>4\u003c/td>\u003ctd>Attacks on sight, pack\u003c/td>\u003ctd>The Thornwood, near Wolf Hollow\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🦹 \u003ca href=\"#ashbound-raider\" data-to=\"ashbound-raider\">Ashbound raider\u003c/a>\u003c/td>\u003ctd>25\u003c/td>\u003ctd>60\u003c/td>\u003ctd>8\u003c/td>\u003ctd>Attacks on sight\u003c/td>\u003ctd>The Thornwood, near Ashbound camp\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Monsters wander up to 3 tiles from home, notice you within 4 tiles (if they attack on sight), and give up the chase 8 tiles from home.\u003c/p>\n\u003cp>See also \u003ca href=\"#combat\" data-to=\"combat\">Combat\u003c/a>, \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and \u003ca href=\"#the-blight\" data-to=\"the-blight\">The Blight\u003c/a>.\u003c/p>","src":["shared/combat.ts"],"w":false,"r":false},{"s":"moonpetal","t":"Moonpetal","c":"Items","i":"🌼","sum":"Herbs, roots and crop. Sells for 14 bronze.","a":[],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","14 bronze"],["Game id","\u003ccode>moonpetal\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dug up with \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> level 10, only at night (9 XP).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Half of the recipe for the \u003ca href=\"#night-sight-potion\" data-to=\"night-sight-potion\">Night sight potion\u003c/a>.\u003c/li>\u003cli>Half of the recipe for the \u003ca href=\"#ember-trap-potion\" data-to=\"ember-trap-potion\">Ember trap potion\u003c/a>.\u003c/li>\u003cli>A bonus third ingredient in \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a>: 60% stronger.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"mushrooms","t":"Mushrooms","c":"Items","i":"🍄","sum":"Herbs, roots and crop. Sells for 3 bronze.","a":["mushroom"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","3 bronze"],["Game id","\u003ccode>mushroom\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dug up with \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> level 3 (3 XP).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A bonus third ingredient in \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a>: also heals 10.\u003c/li>\u003cli>A cooking ingredient (vegetables): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"mysteries-and-twists","t":"Mysteries and twists","c":"Story","i":"🕵️","sum":"Each twist is hinted at early and revealed later, so a careful player can guess it first.","a":["Twists","Mysteries"],"ib":[],"h":"\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret: The whole page\u003c/div>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>The twist\u003c/th>\u003cth>Early hints\u003c/th>\u003cth>Revealed in\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a> cause the Blight they claim to fight.\u003c/td>\u003ctd>Trees die nearest the shrines; the grass around a relit shrine goes brown; \u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a>'s maps.\u003c/td>\u003ctd>Act 1 (hinted), Act 2 (proved)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">The Emberfall\u003c/a> wasn't natural. Mages caused it.\u003c/td>\u003ctd>Old coins and statues from before the Fall; a scorched shaft under the Emberhall; books that &quot;don't quite agree&quot;.\u003c/td>\u003ctd>Act 2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>The Emberguard's leaders are those same mages, \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>.\u003c/td>\u003ctd>&quot;THE LIGHT EATS&quot; painted on a wall; the Tithe mark; heroes who are Extinguished and never come back.\u003c/td>\u003ctd>Act 3, the Joining\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> are made of stolen ember, and ending the siphon will turn them to ash.\u003c/td>\u003ctd>Maren's ash; Sable's grey hands; Ashbound who whisper &quot;better ash&quot;.\u003c/td>\u003ctd>Act 3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>\u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a> was the first Emberborn, and she's dying by choice.\u003c/td>\u003ctd>She's &quot;been here forever&quot;; ash on her sleeves; Rook's note &quot;Ask Maren about the first one.&quot;\u003c/td>\u003ctd>Act 3, Maren's Story\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>\u003ca href=\"#enchanter-vale\" data-to=\"enchanter-vale\">Enchanter Vale\u003c/a> is \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a>.\u003c/td>\u003ctd>&quot;Named after the Archmage&quot;; &quot;older than the Guild&quot;; no one knows where Vale is buried.\u003c/td>\u003ctd>Act 4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>The empty plinth is \u003ca href=\"#sable\" data-to=\"sable\">Sable\u003c/a>'s.\u003c/td>\u003ctd>One letter left under the dust: S.\u003c/td>\u003ctd>Act 2 side quest\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>\u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a> is weakening, and if it goes out the land dies.\u003c/td>\u003ctd>The heartbeat in the Crystal Cave slows each year; Frostfell's ice moves south.\u003c/td>\u003ctd>Act 4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>The \u003ca href=\"#ember-seed\" data-to=\"ember-seed\">Ember Seed\u003c/a> might let Emberborn live without the siphon.\u003c/td>\u003ctd>Odo's old seed jar; Old Kingdom coins show a seed.\u003c/td>\u003ctd>Endgame\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>The \u003ca href=\"#ember-crown\" data-to=\"ember-crown\">Ember Crown\u003c/a> is in two halves; one is in Vale's staff.\u003c/td>\u003ctd>Vale never lets anyone touch his staff.\u003c/td>\u003ctd>Endgame\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>","src":["wiki/pages/twists.md"],"w":true,"r":false},{"s":"names","t":"Names","c":"Wiki","i":"🏷️","sum":"Old names from earlier versions of the game, and the names everything uses now.","a":[],"ib":[],"h":"\u003cp>The game and the wiki both use the lore bible's names. Until version 0.10 the game had some older names, listed here so old notes and bug reports still make sense. When the wiki renames something before the game does (like the Radiants, now the Extinguished), or an old name slips back into the game's text, the wiki swaps it for the new one, and the page it's on says so at the bottom.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Old name\u003c/th>\u003cth>Name now\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Lightkeepers'\u003c/td>\u003ctd>Emberguard's\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lightkeepers\u003c/td>\u003ctd>Emberguard\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lightkeeper\u003c/td>\u003ctd>Emberguard\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lightwardens\u003c/td>\u003ctd>Emberwarden\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Kindled\u003c/td>\u003ctd>Emberborn\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Elderra\u003c/td>\u003ctd>Embervale\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Wellspring\u003c/td>\u003ctd>Emberheart\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Aurelite\u003c/td>\u003ctd>Embersteel\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Crown of Aurel\u003c/td>\u003ctd>Ember Crown\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Aurel Seed\u003c/td>\u003ctd>Ember Seed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>the kingdom of Aurel\u003c/td>\u003ctd>the Old Kingdom\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Aurel's\u003c/td>\u003ctd>the Old Kingdom's\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Aurel\u003c/td>\u003ctd>the Old Kingdom\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Vael\u003c/td>\u003ctd>Vale\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ysolde\u003c/td>\u003ctd>Rowan\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ysra\u003c/td>\u003ctd>Ida\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lighthall\u003c/td>\u003ctd>Emberhall\u003c/td>\u003c/tr>\u003ctr>\u003ctd>the Radiants\u003c/td>\u003ctd>the Extinguished\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Radiants\u003c/td>\u003ctd>Extinguished\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Soul gems\u003c/td>\u003ctd>Refined emberstones\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Soul gem\u003c/td>\u003ctd>Refined emberstone\u003c/td>\u003c/tr>\u003ctr>\u003ctd>soul gems\u003c/td>\u003ctd>refined emberstones\u003c/td>\u003c/tr>\u003ctr>\u003ctd>soul gem\u003c/td>\u003ctd>refined emberstone\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Soul trap\u003c/td>\u003ctd>Ember trap\u003c/td>\u003c/tr>\u003ctr>\u003ctd>soul trap\u003c/td>\u003ctd>ember trap\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Soul Debt\u003c/td>\u003ctd>Ember Debt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Souls\u003c/td>\u003ctd>Ember\u003c/td>\u003c/tr>\u003ctr>\u003ctd>souls\u003c/td>\u003ctd>ember\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Ids inside the code (like \u003ccode>lighthall\u003c/code> or \u003ccode>soul_trap\u003c/code>) keep their old spelling so saved games keep working. Players never see them.\u003c/p>","src":["wiki/build.ts"],"w":false,"r":false},{"s":"night-sight-potion","t":"Night sight potion","c":"Items","i":"🧪","sum":"You see clearly at night, for a while.","a":[],"ib":[["Alchemy level","20"],["Ingredients","Moonpetal + Blue lotus"],["XP","26"],["First tries work","45%"]],"h":"\u003cp>You see clearly at night, for a while. Brew it with \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> level 20 from \u003ca href=\"#moonpetal\" data-to=\"moonpetal\">Moonpetal\u003c/a> and \u003ca href=\"#blue-lotus\" data-to=\"blue-lotus\">Blue lotus\u003c/a> in a vial. See \u003ca href=\"#potions\" data-to=\"potions\">Potions\u003c/a>.\u003c/p>","src":["shared/alchemy.ts"],"w":false,"r":false},{"s":"oak-logs","t":"Oak logs","c":"Items","i":"🪵","sum":"Log. Sells for 3 bronze.","a":["oak log"],"ib":[["Kind","Logs"],["Shop pays","3 bronze"],["Game id","\u003ccode>oak_logs\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a> level 5 from a oak tree (3 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Used for tool handles, bows, staffs and arrows, and burned as cooking fuel.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"oath-of-the-flame","t":"Oath of the Flame","c":"Quests","i":"📜","sum":"Prologue from Keeper Aldric.","a":[],"ib":[["Part of","Prologue"],["Given by","Keeper Aldric"],["Where","in the Emberhall, the great white temple in the town square"],["Steps","3"]],"h":"\u003cp>\u003cb>Oath of the Flame\u003c/b> is part of the Prologue from \u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>, found in the Emberhall, the great white temple in the town square.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#a-blessing\" data-to=\"a-blessing\">A Blessing\u003c/a>, \u003ca href=\"#standing-your-ground\" data-to=\"standing-your-ground\">Standing your ground\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Keeper Aldric\u003c/li>\u003cli>Swear the Oath at the Heart Shrine\u003c/li>\u003cli>Go back to Keeper Aldric\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Rewards:\u003c/b> 1 silver.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> You've learned so much, friend. It's time. Every Emberborn who means to stay swears the Oath of the Flame at the Heart Shrine, so the shrine knows you, and can always bring you home. Go and stand before the shrine, and put your hand in the light.\u003c/p>\n\u003cp>\u003cb>Step 3.\u003c/b> It knows you now. Welcome, Ember of the Emberhall! Wear this cloak with pride: everyone in Emberhold will know you're one of us. And here's your first silver. Oh, one thing. Now that the shrine knows you, falling has a small cost: the shrine takes a little tithe to raise you. Nothing to worry about. I'll explain when it matters. Come and see me when you're ready for real work. There's a lot to do.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"odd-jobs","t":"Odd jobs","c":"Quests","i":"📜","sum":"Lessons from Captain Bryn.","a":[],"ib":[["Part of","Lessons"],["Given by","Captain Bryn"],["Where","by the bounty board in the square"],["Steps","4"]],"h":"\u003cp>\u003cb>Odd jobs\u003c/b> is a lesson from \u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">Captain Bryn\u003c/a>, found by the bounty board in the square.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#buying-and-selling\" data-to=\"buying-and-selling\">Buying and selling\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Captain Bryn by the bounty board\u003c/li>\u003cli>Track a bounty (tap 📜 Quests, then tap a bounty)\u003c/li>\u003cli>Finish a bounty and hand it in at the board\u003c/li>\u003cli>Go back to Captain Bryn for your reward\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#renown\" data-to=\"renown\">Renown\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Rewards:\u003c/b> 1 silver.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> Captain Bryn, at your service. I keep the bounty board. Folk pin up jobs there: bring the full amount and they pay double what a shop would, plus XP. Every bounty you finish trains Renown, part of Charisma. The more folk know your name, the better. Open the 📜 Quests tab, bottom right. It shows your lessons and every bounty on the board. Tap a bounty to track it, and it shows up next to your health.\u003c/p>\n\u003cp>\u003cb>Step 4.\u003c/b> Your first bounty! See? Honest work, and good pay. The board always has 5 jobs, and a new one goes up for every one you finish. Tap a quest or a bounty in the 📜 tab any time to switch what you're tracking. You'll see Ashbound posters on the board now. The Emberhall pays for those bounties.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"odos-stubborn-field","t":"Odo's Stubborn Field","c":"Quests","i":"📜","sum":"Act 1 from Farmer Odo.","a":[],"ib":[["Part of","Act 1"],["Given by","Farmer Odo"],["Where","at the farm: follow the road east, over the river bridge"],["Steps","4"]],"h":"\u003cp>\u003cb>Odo's Stubborn Field\u003c/b> is part of the Act 1 from \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>, found at the farm: follow the road east, over the river bridge.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#oath-of-the-flame\" data-to=\"oath-of-the-flame\">Oath of the Flame\u003c/a>, \u003ca href=\"#something-to-grow\" data-to=\"something-to-grow\">Something to grow\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Farmer Odo\u003c/li>\u003cli>Plant 4 seeds on your plot\u003c/li>\u003cli>Harvest 4 crops with no blessing on you\u003c/li>\u003cli>Go back to Farmer Odo \u003ci>(you get: 5 × \u003ca href=\"#blue-lotus-seeds\" data-to=\"blue-lotus-seeds\">Blue lotus seeds\u003c/a>)\u003c/i>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#blue-lotus-seeds\" data-to=\"blue-lotus-seeds\">Blue lotus seeds\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> You again. Come to bless my turnips? No? Then what? Hm. You want to know why I won't take their blessings. I'll show you. Grow a crop on your plot, start to finish, with no blessing on you. Not one. Plant 4 seeds and harvest 4 crops, unblessed. If you read a scroll, it doesn't count.\u003c/p>\n\u003cp>\u003cb>Step 4.\u003c/b> Grew just fine, didn't they? No light needed. In the old days, before the Emberhall, every farm grew like this. Then the shrines came, and the blessings, and the ground got tired. Funny, that. Here: my grandmother's blue lotus seeds. Never been blessed in a hundred years. Look after them.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"old-bones","t":"Old bones","c":"Items","i":"🦴","sum":"Herbs, roots and crop. Sells for 6 bronze.","a":["old bone"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","6 bronze"],["Game id","\u003ccode>old_bone\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dug up with \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> level 8 (7 XP).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A bonus third ingredient in \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a>: buffs last half as long again, and 10% stronger.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"old-kingdom","t":"Old Kingdom","c":"History","i":"👑","sum":"The kingdom that ruled the land before the Emberfall, from Brightcrown in the west.","a":["The Old Kingdom"],"ib":[["Capital","\u003ca href=\"#brightcrown\" data-to=\"brightcrown\">Brightcrown\u003c/a>"],["Last king","\u003ca href=\"#king-aldemar\" data-to=\"king-aldemar\">King Aldemar\u003c/a>"],["Fell","Years 1 to 40, in the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>"],["Old name","Aurel"]],"h":"\u003cp>\u003cb>The Old Kingdom\u003c/b> ruled the whole land before \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">the Emberfall\u003c/a>: green from the Greyspine to the sea, ruled from \u003ca href=\"#brightcrown\" data-to=\"brightcrown\">Brightcrown\u003c/a>, a city of white stone in what is now \u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a>. People remember it as a golden age. \u003ca href=\"#the-hearthwise\" data-to=\"the-hearthwise\">The Hearthwise\u003c/a> lived there.\u003c/p>\n\u003cp>It fell in the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>. Its ruins are scattered across the Barrens, and its capital is the crater called \u003ca href=\"#the-sundered-crown\" data-to=\"the-sundered-crown\">The Sundered Crown\u003c/a>.\u003c/p>\n\u003cp>Old Kingdom coins dug up in the Barrens show a seed under a crown: the first hint of the \u003ca href=\"#ember-seed\" data-to=\"ember-seed\">Ember Seed\u003c/a>.\u003c/p>","src":["wiki/pages/old-kingdom.md"],"w":true,"r":false},{"s":"old-maren","t":"Old Maren","c":"People","i":"🎣","sum":"The town's fisher and teacher, who's been here forever.","a":[],"ib":[["Found in","Old Maren's cottage"],["Game id","\u003ccode>maren\u003c/code>"]],"h":"\u003cp>\u003cb>Old Maren\u003c/b> lives in \u003ca href=\"#old-marens-cottage\" data-to=\"old-marens-cottage\">her cottage\u003c/a> on the lake shore. She teaches every new hero the basics of living off the land (fishing, cooking, gathering), and everyone in town says she's been here forever. Her grey hair drifts like ash.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>Maren is the very first \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a>, woken in year 40. Around year 430 she learned the truth about \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a> and cut her own thread. Since then she's been slowly ageing and turning to ash: her grey hair is ash, and it drifts off her fingertips. She quietly warns the heroes who are ready (\u003ca href=\"#marens-question\" data-to=\"marens-question\">Maren's Question\u003c/a>). \u003ca href=\"#repairer-oswin\" data-to=\"repairer-oswin\">Repairer Oswin\u003c/a> has loved her for 50 years and helps her. Her old cookbook ends: \u003ci>&quot;Some fires should go out. Remember that.&quot;\u003c/i>\u003c/p>\u003c/div>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>Found in \u003ca href=\"#old-marens-cottage\" data-to=\"old-marens-cottage\">Old Maren's cottage\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#living-off-the-land\" data-to=\"living-off-the-land\">Living off the land\u003c/a> (lessons)\u003c/li>\u003cli>\u003ca href=\"#marens-question\" data-to=\"marens-question\">Maren's Question\u003c/a> (Act 1)\u003c/li>\u003c/ul>","src":["wiki/pages/person-maren.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"old-marens-cottage","t":"Old Maren's cottage","c":"Places","i":"🏠","sum":"","a":[],"ib":[["Kind","Indoors"],["Danger","Safe"],["Size","9 × 7 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"maren\">\u003c/figure>\n\u003cp>\u003cb>People here:\u003c/b> \u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Things to use:\u003c/b> Stove.\u003c/p>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"onion-sets","t":"Onion sets","c":"Items","i":"🌱","sum":"Seed. Sells for 2 bronze.","a":["onion set"],"ib":[["Kind","Seeds"],["Shop pays","2 bronze"],["Game id","\u003ccode>seed_onion\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"onions","t":"Onions","c":"Items","i":"🧅","sum":"Herbs, roots and crop. Sells for 2 bronze.","a":["onion"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","2 bronze"],["Game id","\u003ccode>onion\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Grown with \u003ca href=\"#farming\" data-to=\"farming\">Farming\u003c/a> level 8: ripe after 25 minutes, 2 to 4 a tile.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"orla-the-kind","t":"Orla the Kind","c":"People","i":"🕯️","sum":"One of the Extinguished, who died of the Grey Fever after rising nine times.","a":[],"ib":[],"h":"\u003cp>\u003cb>Orla the Kind\u003c/b> was one of \u003ca href=\"#the-extinguished\" data-to=\"the-extinguished\">The Extinguished\u003c/a>. She died of the Grey Fever in year 460 after rising nine times, and people remember her as a saint. In the planned quest \u003ci>Lanterns for the Dead\u003c/i>, the lantern at her statue keeps going out.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>Orla's spark isn't resting: it's trapped in an old refined emberstone. In the planned quest \u003ci>Orla's Rest\u003c/i>, you use \u003ca href=\"#ember-trap\" data-to=\"ember-trap\">Ember trap\u003c/a> to free it and carry it to \u003ca href=\"#the-graveyard\" data-to=\"the-graveyard\">The Graveyard\u003c/a>, and her lantern finally stays lit.\u003c/p>\u003c/div>","src":["wiki/pages/orla.md"],"w":true,"r":false},{"s":"parties","t":"Parties","c":"Mechanics","i":"🚩","sum":"Up to 4 players.","a":[],"ib":[],"h":"\u003cp>Click another player to invite them. A party holds up to 4. Members within 15 tiles of the leader share in kills and quest steps, and the leader trains \u003ca href=\"#leadership\" data-to=\"leadership\">Leadership\u003c/a>.\u003c/p>","src":["shared/party.ts"],"w":false,"r":false},{"s":"people-in-the-game","t":"People in the game","c":"People","i":"🧑","sum":"Everyone you can talk to in the game today.","a":[],"ib":[],"h":"\u003cp>Everyone you can talk to in the game today. The \u003ca href=\"#groups-and-people\" data-to=\"groups-and-people\">Groups and people\u003c/a> page lists the story's characters too, including ones not in the game yet.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Person\u003c/th>\u003cth>Where\u003c/th>\u003cth>Quests\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#old-marens-cottage\" data-to=\"old-marens-cottage\">Old Maren's cottage\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">Captain Bryn\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#the-general-store\" data-to=\"the-general-store\">The General Store\u003c/a>\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#forester-holts-house\" data-to=\"forester-holts-house\">Forester Holt's house\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u00 oswin\">Repairer Oswin\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">The Mages' Guild\u003c/a>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>\u003c/td>\u003ctd>8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#sister-celene\" data-to=\"sister-celene\">Sister Celene\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#enchanter-vale\" data-to=\"enchanter-vale\">Enchanter Vale\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#brother-oren\" data-to=\"brother-oren\">Brother Oren\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#sister-lisette\" data-to=\"sister-lisette\">Sister Lisette\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#brother-tomas\" data-to=\"brother-tomas\">Brother Tomas\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#sister-wynne\" data-to=\"sister-wynne\">Sister Wynne\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#rhys\" data-to=\"rhys\">Rhys\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/npcs.ts"],"w":false,"r":false},{"s":"perch","t":"Perch","c":"Items","i":"🐠","sum":"Fish. Sells for 7 bronze.","a":[],"ib":[["Kind","Fish"],["Shop pays","7 bronze"],["Game id","\u003ccode>perch\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a> level 10 from a perch spot (6 XP each).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (fish): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"pickaxe","t":"Pickaxe","c":"Items","i":"⛏️","sum":"A tool for Mining.","a":[],"ib":[["Helps","Mining"],["Effect","Faster"]],"h":"\u003cp>The pickaxe helps \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a>: you gather faster. Better metal and better wood make it stronger and last longer. See \u003ca href=\"#tools\" data-to=\"tools\">Tools\u003c/a> for every metal and wood. Smiths make them at the anvil with \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>.\u003c/p>","src":["shared/tools.ts"],"w":false,"r":false},{"s":"pike","t":"Pike","c":"Items","i":"🐟","sum":"Fish. Sells for 22 bronze.","a":[],"ib":[["Kind","Fish"],["Shop pays","22 bronze"],["Game id","\u003ccode>pike\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a> level 30 from a pike spot (15 XP each).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (fish): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"pine-logs","t":"Pine logs","c":"Items","i":"🪵","sum":"Log. Sells for 1 bronze.","a":["pine log"],"ib":[["Kind","Logs"],["Shop pays","1 bronze"],["Game id","\u003ccode>pine_logs\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a> level 1 from a pine tree (1 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#living-off-the-land\" data-to=\"living-off-the-land\">Living off the land\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#hammer-and-fire\" data-to=\"hammer-and-fire\">Hammer and fire\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Used for tool handles, bows, staffs and arrows, and burned as cooking fuel.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"platebody","t":"Platebody","c":"Items","i":"🦺","sum":"Armor for the body slot.","a":[],"ib":[["Slot","body"],["Bars to make","3"],["Armor (bronze)","3"]],"h":"\u003cp>🦺 A platebody goes in your body slot. A bronze one gives 3 armor and takes 3 bars to make with \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>; better metal multiplies it. Leather and cloth versions are made with \u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a>. See \u003ca href=\"#armor\" data-to=\"armor\">Armor\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"platelegs","t":"Platelegs","c":"Items","i":"👖","sum":"Armor for the legs slot.","a":[],"ib":[["Slot","legs"],["Bars to make","2"],["Armor (bronze)","2"]],"h":"\u003cp>👖 A platelegs goes in your legs slot. A bronze one gives 2 armor and takes 2 bars to make with \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>; better metal multiplies it. Leather and cloth versions are made with \u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a>. See \u003ca href=\"#armor\" data-to=\"armor\">Armor\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"platinum-bar","t":"Platinum bar","c":"Items","i":"🧈","sum":"Bar. Sells for 400 bronze.","a":[],"ib":[["Kind","Bars"],["Shop pays","400 bronze"],["Game id","\u003ccode>platinum_bar\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#platinum-ore\" data-to=\"platinum-ore\">Platinum ore\u003c/a>, \u003ca href=\"#platinum-ore\" data-to=\"platinum-ore\">Platinum ore\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cp>Nowhere in the game yet.\u003c/p>","src":["shared/items.ts"],"w":false,"r":false},{"s":"platinum-ore","t":"Platinum ore","c":"Items","i":"🪨","sum":"Ore. Sells for 160 bronze.","a":[],"ib":[["Kind","Ore"],["Shop pays","160 bronze"],["Game id","\u003ccode>platinum_ore\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a> level 75 from a platinum rock (55 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#platinum-bar\" data-to=\"platinum-bar\">Platinum bar\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"pot","t":"Pot","c":"Items","i":"🛠️","sum":"A tool for Cooking.","a":[],"ib":[["Helps","Cooking"],["Effect","Fewer failures"]],"h":"\u003cp>The pot helps \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>: your tries fail less often. Better metal and better wood make it stronger and last longer. See \u003ca href=\"#tools\" data-to=\"tools\">Tools\u003c/a> for every metal and wood. Smiths make them at the anvil with \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>.\u003c/p>","src":["shared/tools.ts"],"w":false,"r":false},{"s":"potatoes","t":"Potatoes","c":"Items","i":"🥔","sum":"Herbs, roots and crop. Sells for 1 bronze.","a":["potato"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","1 bronze"],["Game id","\u003ccode>potato\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Grown with \u003ca href=\"#farming\" data-to=\"farming\">Farming\u003c/a> level 1: ripe after 10 minutes, 3 to 5 a tile.\u003c/li>\u003cli>Sold by \u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (vegetables): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"potions","t":"Potions","c":"Items","i":"🧪","sum":"Every potion and how to brew it.","a":[],"ib":[],"h":"\u003cp>Potions are brewed with \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> at the alchemy table in the Mages' Guild: two ingredients and an empty \u003ca href=\"#empty-vials\" data-to=\"empty-vials\">vial\u003c/a>, and maybe a third ingredient for a bonus. You can drink one every 10 seconds; buffs last 5 minutes.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Potion\u003c/th>\u003cth>Alchemy level\u003c/th>\u003cth>Ingredients\u003c/th>\u003cth>Does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>\u003c/td>\u003ctd>1\u003c/td>\u003ctd>\u003ca href=\"#red-cap-mushrooms\" data-to=\"red-cap-mushrooms\">Red cap mushrooms\u003c/a> + \u003ca href=\"#slime-goo\" data-to=\"slime-goo\">Slime goo\u003c/a>\u003c/td>\u003ctd>Restores health\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#stamina-potion\" data-to=\"stamina-potion\">Stamina potion\u003c/a>\u003c/td>\u003ctd>3\u003c/td>\u003ctd>\u003ca href=\"#ginseng-roots\" data-to=\"ginseng-roots\">Ginseng roots\u003c/a> + \u003ca href=\"#wild-honeycomb\" data-to=\"wild-honeycomb\">Wild honeycomb\u003c/a>\u003c/td>\u003ctd>Restores stamina\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#mana-potion\" data-to=\"mana-potion\">Mana potion\u003c/a>\u003c/td>\u003ctd>5\u003c/td>\u003ctd>\u003ca href=\"#blue-lotus\" data-to=\"blue-lotus\">Blue lotus\u003c/a> + \u003ca href=\"#bat-wings\" data-to=\"bat-wings\">Bat wings\u003c/a>\u003c/td>\u003ctd>Restores mana\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#restoration-draught\" data-to=\"restoration-draught\">Restoration draught\u003c/a>\u003c/td>\u003ctd>8\u003c/td>\u003ctd>\u003ca href=\"#slime-goo\" data-to=\"slime-goo\">Slime goo\u003c/a> + \u003ca href=\"#blue-lotus\" data-to=\"blue-lotus\">Blue lotus\u003c/a>\u003c/td>\u003ctd>Restores some health and some mana (secret recipe)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#strength-potion\" data-to=\"strength-potion\">Strength potion\u003c/a>\u003c/td>\u003ctd>10\u003c/td>\u003ctd>\u003ca href=\"#wolf-fangs\" data-to=\"wolf-fangs\">Wolf fangs\u003c/a> + \u003ca href=\"#sage\" data-to=\"sage\">Sage\u003c/a>\u003c/td>\u003ctd>Your weapon hits harder for a while\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#swiftness-potion\" data-to=\"swiftness-potion\">Swiftness potion\u003c/a>\u003c/td>\u003ctd>15\u003c/td>\u003ctd>\u003ca href=\"#boar-tusks\" data-to=\"boar-tusks\">Boar tusks\u003c/a> + \u003ca href=\"#ginseng-roots\" data-to=\"ginseng-roots\">Ginseng roots\u003c/a>\u003c/td>\u003ctd>You walk faster for a while\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#hunters-brew\" data-to=\"hunters-brew\">Hunter's brew\u003c/a>\u003c/td>\u003ctd>18\u003c/td>\u003ctd>\u003ca href=\"#wolf-fangs\" data-to=\"wolf-fangs\">Wolf fangs\u003c/a> + \u003ca href=\"#boar-tusks\" data-to=\"boar-tusks\">Boar tusks\u003c/a>\u003c/td>\u003ctd>A little stronger and a little faster, for a while (secret recipe)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#night-sight-potion\" data-to=\"night-sight-potion\">Night sight potion\u003c/a>\u003c/td>\u003ctd>20\u003c/td>\u003ctd>\u003ca href=\"#moonpetal\" data-to=\"moonpetal\">Moonpetal\u003c/a> + \u003ca href=\"#blue-lotus\" data-to=\"blue-lotus\">Blue lotus\u003c/a>\u003c/td>\u003ctd>You see clearly at night, for a while\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#tithe-tonic\" data-to=\"tithe-tonic\">Tithe tonic\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003ctd>\u003ca href=\"#red-cap-mushrooms\" data-to=\"red-cap-mushrooms\">Red cap mushrooms\u003c/a> + \u003ca href=\"#wild-roots\" data-to=\"wild-roots\">Wild roots\u003c/a>\u003c/td>\u003ctd>Clears one Tithe mark (secret recipe)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#ember-trap-potion\" data-to=\"ember-trap-potion\">Ember trap potion\u003c/a>\u003c/td>\u003ctd>25\u003c/td>\u003ctd>\u003ca href=\"#venom-sacs\" data-to=\"venom-sacs\">Venom sacs\u003c/a> + \u003ca href=\"#moonpetal\" data-to=\"moonpetal\">Moonpetal\u003c/a>\u003c/td>\u003ctd>Your Ember trap spell lasts longer, for a while\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-bonus-ingredients\">Bonus ingredients\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Third ingredient\u003c/th>\u003cth>Adds\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#sage\" data-to=\"sage\">Sage\u003c/a>\u003c/td>\u003ctd>30% stronger\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#moonpetal\" data-to=\"moonpetal\">Moonpetal\u003c/a>\u003c/td>\u003ctd>60% stronger\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#wild-honeycomb\" data-to=\"wild-honeycomb\">Wild honeycomb\u003c/a>\u003c/td>\u003ctd>also gives 15 stamina\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#mushrooms\" data-to=\"mushrooms\">Mushrooms\u003c/a>\u003c/td>\u003ctd>also heals 10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#old-bones\" data-to=\"old-bones\">Old bones\u003c/a>\u003c/td>\u003ctd>buffs last half as long again, and 10% stronger\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/alchemy.ts"],"w":false,"r":false},{"s":"quests","t":"Quests","c":"Quests","i":"📜","sum":"Every quest built so far.","a":[],"ib":[],"h":"\u003cp>Every quest in the game today, in the order they're listed. The story's plan for later acts is on \u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a> and \u003ca href=\"#side-quests\" data-to=\"side-quests\">Side quests\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-prologue\">Prologue\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Quest\u003c/th>\u003cth>From\u003c/th>\u003cth>Steps\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#awakening\" data-to=\"awakening\">Awakening\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#sister-celene\" data-to=\"sister-celene\">Sister Celene\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-hall-of-light\" data-to=\"the-hall-of-light\">The Hall of Light\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#light-the-way\" data-to=\"light-the-way\">Light the Way\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-old-sweeper\" data-to=\"the-old-sweeper\">The Old Sweeper\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#a-blessing\" data-to=\"a-blessing\">A Blessing\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#sister-celene\" data-to=\"sister-celene\">Sister Celene\u003c/a>\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u c/td>\u003ctd>\u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#what-holt-saw\" data-to=\"what-holt-saw\">What Holt Saw\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#odos-stubborn-field\" data-to=\"odos-stubborn-field\">Odo's Stubborn Field\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-hollow-wolves\" data-to=\"the-hollow-wolves\">The Hollow Wolves\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#marens-question\" data-to=\"marens-question\">Maren's Question\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#a-light-in-the-thornwood\" data-to=\"a-light-in-the-thornwood\">A Light in the Thornwood\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>\u003c/td>\u003ctd>6\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"radiance-ceremony","t":"Radiance Ceremony","c":"Lore","i":"🌞","sum":"The great honour: the Emberguard's champion &quot;goes into the light&quot;.","a":["Radiance","Radiance Ceremonies"],"ib":[],"h":"\u003cp>A \u003cb>Radiance Ceremony\u003c/b> is the Emberguard's highest honour. Every few decades their greatest champion is chosen, and at the Ceremony they blaze up one last time and go out, giving their ember back to the Heart Shrine so new heroes can wake. From then on they are one of the Extinguished, and their statue stands in \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a> (see \u003ca href=\"#the-extinguished\" data-to=\"the-extinguished\">The Extinguished\u003c/a>).\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The champion is drained. Their whole spark is poured into \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>, which feeds them for years. A few sparks are still trapped in old refined emberstones. Only \u003ca href=\"#sable\" data-to=\"sable\">Sable\u003c/a> ever survived it.\u003c/p>\u003c/div>","src":["wiki/pages/radiance.md"],"w":true,"r":false},{"s":"ranged","t":"Ranged","c":"Skills","i":"🏹","sum":"Hold a sling, darts or a bow and hit monsters from a distance.","a":[],"ib":[["Discipline","💪 Strength"],["Taught by","\u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>"],["Max level","99"]],"h":"\u003cp>🏹 \u003cb>Ranged\u003c/b> is a skill in \u003ca href=\"#strength\" data-to=\"strength\">Strength\u003c/a>. Hold a sling, darts or a bow and hit monsters from a distance.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#standing-your-ground\" data-to=\"standing-your-ground\">Standing your ground\u003c/a>, from \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🎯 Steady aim\u003c/td>\u003ctd>hit 2% more often\u003c/td>\u003c/tr>\u003ctr>\u003ctd>💥 Sharp tips\u003c/td>\u003ctd>hit 5% harder\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪶 Second wind\u003c/td>\u003ctd>10% chance it costs no stamina\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"rat","t":"Rat","c":"Monsters","i":"🐀","sum":"A level 2 monster. Fights back if you hit it.","a":[],"ib":[["Level","2"],["Health","6"],["Biggest hit","1"],["Attacks every","2.4s"],["Temper","Fights back if you hit it"],["Out","Day and night"],["Comes back after","30s"],["Coins","0 to 2 bronze"]],"h":"\u003cp>The \u003cb>Rat\u003c/b> is a level 2 monster with 6 health. Fights back if you hit it.\u003c/p>\n\u003cp>Defeating one gives 2 bonus XP on top of 1 XP per point of damage, plus 4 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>Heartvale, near Quarry (6), The old mine (3).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🐁 \u003ca href=\"#rat-tails\" data-to=\"rat-tails\">Rat tails\u003c/a>\u003c/td>\u003ctd>50%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>It also drops 0 to 2 bronze coins.\u003c/p>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"rat-tails","t":"Rat tails","c":"Items","i":"🐁","sum":"Monster drop. Sells for 2 bronze.","a":["rat tail"],"ib":[["Kind","Monster drops"],["Shop pays","2 bronze"],["Game id","\u003ccode>rat_tail\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#rat\" data-to=\"rat\">Rat\u003c/a> (50%).\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"raw-beef","t":"Raw beef","c":"Items","i":"🥩","sum":"Monster drop. Sells for 4 bronze.","a":[],"ib":[["Kind","Monster drops"],["Shop pays","4 bronze"],["Game id","\u003ccode>raw_beef\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#cow\" data-to=\"cow\">Cow\u003c/a> (70%).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (meat): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"raw-boar","t":"Raw boar","c":"Items","i":"🥩","sum":"Monster drop. Sells for 7 bronze.","a":[],"ib":[["Kind","Monster drops"],["Shop pays","7 bronze"],["Game id","\u003ccode>raw_boar\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#boar\" data-to=\"boar\">Boar\u003c/a> (80%).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (meat): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"raw-chicken","t":"Raw chicken","c":"Items","i":"🍗","sum":"Monster drop. Sells for 2 bronze.","a":[],"ib":[["Kind","Monster drops"],["Shop pays","2 bronze"],["Game id","\u003ccode>raw_chicken\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#chicken\" data-to=\"chicken\">Chicken\u003c/a> (70%).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (chicken): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"rebuild-the-shrine","t":"Rebuild the Shrine","c":"Quests","i":"📜","sum":"Act 1 from Keeper Aldric.","a":[],"ib":[["Part of","Act 1"],["Given by","Keeper Aldric"],["Where","in the Emberhall, the great white temple in the town square"],["Steps","5"]],"h":"\u003cp>\u003cb>Rebuild the Shrine\u003c/b> is part of the Act 1 from \u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>, found in the Emberhall, the great white temple in the town square.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#the-first-tithe\" data-to=\"the-first-tithe\">The First Tithe\u003c/a>, \u003ca href=\"#the-totem\" data-to=\"the-totem\">The Totem\u003c/a>, \u003ca href=\"#ash-on-the-road\" data-to=\"ash-on-the-road\">Ash on the Road\u003c/a>, \u003ca href=\"#into-the-rocks\" data-to=\"into-the-rocks\">Into the rocks\u003c/a>, \u003ca href=\"#hammer-and-fire\" data-to=\"hammer-and-fire\">Hammer and fire\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Keeper Aldric\u003c/li>\u003cli>Get 6 oak logs and 2 bronze bars\u003c/li>\u003cli>Pick up the new totem from Woodworker Rook \u003ci>(you get: \u003ca href=\"#shrine-totems\" data-to=\"shrine-totems\">Shrine totems\u003c/a>)\u003c/i>\u003c/li>\u003cli>Rebuild the Westroad shrine (far west, along the main road)\u003c/li>\u003cli>Go back to Keeper Aldric \u003ci>(you get: 3 × \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>)\u003c/i>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#shrine-totems\" data-to=\"shrine-totems\">Shrine totems\u003c/a>, \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>, 1.2 silver.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> The Westroad is clear, Rook's totem is ready, and you've learned to mine and smelt. Let's rebuild that shrine! The Emberguard have the stone cut already. Bring 6 oak logs for the frame and 2 bronze bars to bind it. I'll have Rook carve a second totem for the top: pick it up from him on your way.\u003c/p>\n\u003cp>\u003cb>Step 3.\u003c/b> Another totem for the Westroad? Already done. Here. No note in this one. Just wood.\u003c/p>\n\u003cp>\u003cb>Step 4.\u003c/b> You raise the oak frame, the Emberguard stack their white stone around it, you bind it with bronze, and set Rook's totem on top. Two Emberguard arrive and say a prayer, and the shrine lights up gold. Then you notice the grass. All round the shrine, in a ring, it's turning brown. Maybe it was always like that.\u003c/p>\n\u003cp>\u003cb>Step 5.\u003c/b> It's lit! I felt it from here. The Westroad shrine will raise heroes again: if you fall out west, you'll wake there now. Here: health potions, and the Emberhall's thanks.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"red-cap-mushrooms","t":"Red cap mushrooms","c":"Items","i":"🍄","sum":"Herbs, roots and crop. Sells for 4 bronze.","a":["red cap mushroom"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","4 bronze"],["Game id","\u003ccode>red_cap\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dug up with \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> level 2 (3 XP).\u003c/li>\u003cli>Dropped by the \u003ca href=\"#ashbound-scout\" data-to=\"ashbound-scout\">Ashbound scout\u003c/a> (30%).\u003c/li>\u003cli>Given in the quest \u003ca href=\"#a-drop-of-something\" data-to=\"a-drop-of-something\">A drop of something\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Half of the recipe for the \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>.\u003c/li>\u003cli>Half of the recipe for the \u003ca href=\"#tithe-tonic\" data-to=\"tithe-tonic\">Tithe tonic\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"renown","t":"Renown","c":"Skills","i":"📋","sum":"Trained by finishing bounties, on the bounty board and the Mages' Guild board. Bounties get bigger and pay more as it goes up, and Captain Bryn gives you ranks and titles (Wanderer at 5, Trusted at 15, Champion at 30).","a":[],"ib":[["Discipline","🤝 Charisma"],["Taught by","\u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">Captain Bryn\u003c/a>"],["Max level","99"]],"h":"\u003cp>📋 \u003cb>Renown\u003c/b> is a skill in \u003ca href=\"#charisma\" data-to=\"charisma\">Charisma\u003c/a>. Trained by finishing bounties, on the bounty board and the Mages' Guild board. Bounties get bigger and pay more as it goes up, and Captain Bryn gives you ranks and titles (Wanderer at 5, Trusted at 15, Champion at 30).\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#odd-jobs\" data-to=\"odd-jobs\">Odd jobs\u003c/a>, from \u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">Captain Bryn\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>📖 Quick learner\u003c/td>\u003ctd>10% more XP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-ranks\">Ranks\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Renown level\u003c/th>\u003cth>Title\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Wanderer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>15\u003c/td>\u003ctd>Trusted\u003c/td>\u003c/tr>\u003ctr>\u003ctd>30\u003c/td>\u003ctd>Champion\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"repairer-oswin","t":"Repairer Oswin","c":"People","i":"🧰","sum":"Mends worn tools and gear, for a few coins.","a":[],"ib":[["Found in","The Mages' Guild"],["Game id","\u003ccode>repairer\u003c/code>"]],"h":"\u003cp>\u003cb>Repairer Oswin\u003c/b> mends worn tools, weapons and armor for a few coins. \u003ci>&quot;Mending always costs something.&quot;\u003c/i> He's \u003ca href=\"#the-rooted\" data-to=\"the-rooted\">Rooted\u003c/a>.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>He has loved \u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a> for 50 years, and helps her. An old lantern he asks you to fix holds a 70-year-old note in Maren's writing: \u003ci>&quot;I've done it. I'm free. It's started.&quot;\u003c/i>\u003c/p>\u003c/div>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;Worn out? Broken? I'll make it good as new, for a few coins.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">The Mages' Guild\u003c/a>.\u003c/p>","src":["wiki/pages/person-oswin.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"restoration-draught","t":"Restoration draught","c":"Items","i":"⚗️","sum":"Restores some health and some mana.","a":[],"ib":[["Alchemy level","8"],["Ingredients","Slime goo + Blue lotus"],["XP","14"],["First tries work","50%"]],"h":"\u003cp>Restores some health and some mana. Brew it with \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> level 8 from \u003ca href=\"#slime-goo\" data-to=\"slime-goo\">Slime goo\u003c/a> and \u003ca href=\"#blue-lotus\" data-to=\"blue-lotus\">Blue lotus\u003c/a> in a vial. It isn't listed at the table until you've brewed one: someone has to tell you the recipe. See \u003ca href=\"#potions\" data-to=\"potions\">Potions\u003c/a>.\u003c/p>","src":["shared/alchemy.ts"],"w":false,"r":false},{"s":"rhys","t":"Rhys","c":"People","i":"😏","sum":"An Emberborn who woke just before you. Your friendly rival.","a":[],"ib":[["Found in","Heartvale"],["Game id","\u003ccode>rhys\u003c/code>"]],"h":"\u003cp>\u003cb>Rhys\u003c/b> is an \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> who woke just before you, and your friendly rival, always one trial ahead. He lost the emberstone he woke up holding.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>In Act 3 Rhys is invited to join first. At his Joining he goes down the Emberhall stair and comes back up drained, grey, and back to level 1. &quot;His spark was flawed.&quot; In truth he was shown the truth and said no. He joins \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;Ha! Still at it? I'm going to be a Radiant before you, you know.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>.\u003c/p>","src":["wiki/pages/person-rhys.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"running","t":"Running","c":"Mechanics","i":"🏃","sum":"Hold Shift or tap 🏃.","a":[],"ib":[],"h":"\u003cp>Hold Shift or tap 🏃 to run 80% faster (see \u003ca href=\"#walking\" data-to=\"walking\">Walking\u003c/a>). Each tile's length you run uses 1 stamina for the moment; stop for 2.5 seconds and it all comes back. Running never costs stamina for good.\u003c/p>","src":["shared/stats.ts"],"w":false,"r":false},{"s":"sable","t":"Sable","c":"People","i":"⚱️","sum":"Leader of the Ashbound. Her hands are grey with ash.","a":[],"ib":[["Leads","\u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>"],["Once","The brightest of the Extinguished"]],"h":"\u003cp>\u003cb>Sable\u003c/b> leads \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>. People in town say she went mad. Her hands are grey with ash. To the player at their Joining, she offers nothing but the truth: \u003ci>&quot;Better ash than a thief.&quot;\u003c/i>\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u0
