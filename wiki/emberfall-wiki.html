me\">In the game\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"crystal_cave\">\u003c/figure>","src":["wiki/pages/crystal-cave.md","shared/world.ts","shared/npcs.ts"],"w":true,"r":false},{"s":"the-ember","t":"The ember","c":"Lore","i":"✨","sum":"The land's warmth, sent up by the Emberheart. Mana is just ember you can use.","a":["Ember","Mana"],"ib":[],"h":"\u003cp>\u003cb>The ember\u003c/b> is the land's own warmth. It comes from \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a> and is in everything that grows.\u003c/p>\n\u003ch2 id=\"s-where-it-shows\">Where it shows\u003c/h2>\n\u003cp>Where the ember runs close to the surface, you can see it.\u003c/p>\n\u003cul>\u003cli>Ore glows. Emberstone is ember that cooled into crystal.\u003c/li>\u003cli>The old trees of \u003ca href=\"#the-thornwood\" data-to=\"the-thornwood\">The Thornwood\u003c/a> glowed softly at night.\u003c/li>\u003cli>A few people are born with more of it than others, and can shape it with their minds: they become mages. Mana is just ember you can use.\u003c/li>\u003cli>Embers that landed in rock during \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">the Emberfall\u003c/a> cooled into glowing shards worth more than gold.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-the-one-rule\">The one rule\u003c/h2>\n\u003cp>The land gives a little ember to everything, and takes it back when things die and rot. It's a circle. Take more than the land gives back, and that spot goes cold. Where it goes cold, things turn grey, sick and dark. That is \u003ca href=\"#the-withering\" data-to=\"the-withering\">The Withering\u003c/a>, \u003ca href=\"#the-blight\" data-to=\"the-blight\">The Blight\u003c/a>, and the spreading Dark Forest.\u003c/p>\n\u003cp>The old folk who lived by the rule were called \u003ca href=\"#the-hearthwise\" data-to=\"the-hearthwise\">The Hearthwise\u003c/a>. Their saying is still painted over a few old doorways: \u003ci>&quot;Take only what the land gives back.&quot;\u003c/i>\u003c/p>","src":["wiki/pages/ember.md"],"w":true,"r":false},{"s":"the-ember-circle","t":"The Ember Circle","c":"Factions","i":"⭕","sum":"The secret circle of great mages of the Old Kingdom, led by Archmage Vale.","a":["Ember Circle"],"ib":[["Leader","\u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a>"],["Founded","Before year 0"],["Mark","A ring of fire"]],"h":"\u003cp>\u003cb>The Ember Circle\u003c/b> was a secret group of the greatest mages of the \u003ca href=\"#old-kingdom\" data-to=\"old-kingdom\">Old Kingdom\u003c/a>, led by \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a>. History remembers them, when it remembers them at all, as the mages who built \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a> and saved the land after the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>.\u003c/p>\n\u003cp>Their mark is a ring of fire. It can still be found on a ruined mage tower in the Barrens, and it's carved over \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>'s front door.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The Circle had power, but they were growing old. They wanted to live forever, and to be stronger than any king. In year 0 they dug a shaft down to \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a> to drink from it, and caused \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">the Emberfall\u003c/a>. Drinking straight from it nearly killed them too, so in year 40 they built the shrines: a gentler, sneakier way to drink. In year 60 they renamed themselves \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>, and their leaders became \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>.\u003c/p>\n\u003cp>Their names are on the frozen shrine in \u003ca href=\"#frostfell\" data-to=\"frostfell\">Frostfell\u003c/a>, Vale's first, dated year 40, and on a page cut from the oldest book in the Emberhall library.\u003c/p>\u003c/div>","src":["wiki/pages/ember-circle.md"],"w":true,"r":false},{"s":"the-emberfall-disaster","t":"The Emberfall (disaster)","c":"History","i":"☄️","sum":"Year 0. Fire burst up from under Heartvale and rained embers across the land for a year. Everyone is taught it was nobody's fault.","a":["The Emberfall","The Fall"],"ib":[["When","Year 0 (the calendar counts from it)"],["Where","Under \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>, where \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a> now stands"],["Lasted","About a year of falling embers"],["Official cause","&quot;The land's fire burst in anger&quot;"],["Real cause","🔒 \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a> (see below)"],["Led to","The \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>, the shrines, \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>"]],"h":"\u003cp>\u003cb>The Emberfall\u003c/b> was the disaster that began the calendar: years in \u003ca href=\"#embervale\" data-to=\"embervale\">Embervale\u003c/a> are counted \u003ci>After the Fall\u003c/i>, and the game is set in year 500. The game itself is named after it.\u003c/p>\n\u003cp>There are two versions of what happened. The \u003cb>official story\u003c/b> is the one every child in Embervale is taught. The \u003cb>true story\u003c/b> is what players slowly uncover. Writers: anything an NPC says out loud should match the official story, unless that NPC knows the secret.\u003c/p>\n\u003ch2 id=\"s-what-everyone-agrees-on\">What everyone agrees on\u003c/h2>\n\u003cp>These parts are true in both versions:\u003c/p>\n\u003cul>\u003cli>Fire burst up out of the earth under \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a> in a great pillar of flame.\u003c/li>\u003cli>Burning embers rained down across the \u003ca href=\"#old-kingdom\" data-to=\"old-kingdom\">Old Kingdom\u003c/a> for about a year.\u003c/li>\u003cli>The ground around the pillar fell in, leaving the round valley that is Heartvale today.\u003c/li>\u003cli>Embers that landed in rock cooled into glowing shards worth more than gold. The kingdom's lords went to war over them: the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>.\u003c/li>\u003cli>In year 40, \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a> and his mages built \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a>, the first \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> woke, and the war was won.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-the-official-story\">The official story\u003c/h2>\n\u003cp>This is what the Emberguard teach, what the history books say, and what almost everyone in Emberhold believes.\u003c/p>\n\u003col>\u003cli>\u003cb>Before:\u003c/b> the Old Kingdom was a golden age. The \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">land's fire\u003c/a> burned quietly far below, and nobody thought about it.\u003c/li>\u003cli>\u003cb>The Fall:\u003c/b> one day, with no warning, the land's fire \u003ci>&quot;burst in anger&quot;\u003c/i>. Nobody knows why. Some say the old kingdom had grown proud, some say the land just does that. The point every teacher makes is the same: \u003cb>no one was to blame.\u003c/b>\u003c/li>\u003cli>\u003cb>The war:\u003c/b> greedy lords fought over the shards. \u003ci>&quot;No one now living remembers how the war began.&quot;\u003c/i> It ended with the king's crown lost, \u003ca href=\"#brightcrown\" data-to=\"brightcrown\">Brightcrown\u003c/a> in ruins, and almost no one left.\u003c/li>\u003cli>\u003cb>The rescue:\u003c/b> Archmage Vale, \u003ci>&quot;the greatest mage the land ever had&quot;\u003c/i>, tapped the land's fire to build the shrines and gave the first heroes their bodies. The shrines tamed the land's anger and drove back \u003ca href=\"#the-blight\" data-to=\"the-blight\">The Blight\u003c/a>.\u003c/li>\u003cli>\u003cb>After:\u003c/b> Vale died soon after the war. Nobody knows where he's buried. His loyal followers took up the work of keeping the shrines lit, and became \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>.\u003c/li>\u003c/ol>\n\u003cp>The lesson people take from it: the land's fire is dangerous, the shrines keep it calm, and the Emberguard are the land's protectors. Questioning the shrines is like asking for another Fall.\u003c/p>\n\u003ch3 id=\"s-where-players-hear-it\">Where players hear it\u003c/h3>\n\u003cul>\u003cli>The in-game book \u003ci>The Sundering War (a short history for new Emberborn)\u003c/i> and the other books in \u003ca href=\"#books-in-the-game\" data-to=\"books-in-the-game\">Books in the game\u003c/a>.\u003c/li>\u003cli>\u003ci>A Child's Book of the Emberborn\u003c/i>, which \u003ca href=\"#sister-lisette\" data-to=\"sister-lisette\">Sister Lisette\u003c/a> reads to the town children (see \u003ca href=\"#side-quests\" data-to=\"side-quests\">Planned quests\u003c/a>).\u003c/li>\u003cli>\u003ca href=\"#brother-oren\" data-to=\"brother-oren\">Brother Oren\u003c/a>'s tour of the statues of \u003ca href=\"#the-extinguished\" data-to=\"the-extinguished\">The Extinguished\u003c/a>.\u003c/li>\u003cli>The Emberguard's welcome talk when you start as a \u003ca href=\"#hopefuls\" data-to=\"hopefuls\">Hopeful\u003c/a>.\u003c/li>\u003c/ul>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003ch2 id=\"s-the-true-story\">The true story\u003c/h2>\n\u003cp>The Emberfall wasn't natural, and it wasn't the land's anger. It was the first theft.\u003c/p>\n\u003col>\u003cli>\u003cb>Why:\u003c/b> \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a> were the greatest mages of the Old Kingdom, led by \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a>. They had power, but they were growing old. They wanted to live forever, and to be stronger than any king.\u003c/li>\u003cli>\u003cb>The shaft:\u003c/b> in secret, they dug a great shaft down under Heartvale, all the way to \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a>. The shaft is still there today, sealed under \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>.\u003c/li>\u003cli>\u003cb>The ritual:\u003c/b> standing in a ring around the pit, they cast a spell to drink from the Emberheart directly. This is the scene in the \u003ci>Old Shaft\u003c/i> \u003ca href=\"#memory-echoes\" data-to=\"memory-echoes\">Memory Echo\u003c/a>: robed mages chanting around a pit of fire.\u003c/li>\u003cli>\u003cb>The burst:\u003c/b> the Emberheart can't be drunk from like a well. Its fire burst up out of their shaft and kept pouring out for a year. That's the pillar of flame and the rain of embers. The Circle nearly died, and the drink they did get was enough to keep them alive but not enough to make them immortal.\u003c/li>\u003cli>\u003cb>The war:\u003c/b> the Circle let the lords fight over the shards and stayed quiet about who had started it all. They spent forty years working out a safer way to drink.\u003c/li>\u003cli>\u003cb>The shrines (year 40):\u003c/b> their answer was the shrines: small, gentle taps all over the land that each draw a little ember and send it to them. To make it look like a gift, the shrines also shaped stolen ember into bodies, the first Emberborn. The Emberborn won the war, and the Circle became heroes.\u003c/li>\u003cli>\u003cb>The cover-up (year 60 onwards):\u003c/b> Vale faked his death. The Circle renamed themselves the Emberguard, and their leaders became \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>. They built the Emberhall over the shaft, wrote the history books, and around year 200 took \u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">The Mages' Guild\u003c/a>'s records about the Emberheart. Five hundred years later, almost no one knows the Fall had a cause at all.\u003c/li>\u003c/ol>\n\u003ch3 id=\"s-how-the-lie-works\">How the lie works\u003c/h3>\n\u003cp>The official story isn't all made up. It's the true story with the people taken out.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Question\u003c/th>\u003cth>Official story\u003c/th>\u003cth>Truth\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>What caused it?\u003c/td>\u003ctd>The land's fire burst in anger\u003c/td>\u003ctd>The Ember Circle broke the earth open to drink the Emberheart\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Who was to blame?\u003c/td>\u003ctd>No one\u003c/td>\u003ctd>Vale and the Circle\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Why does nobody remember how the war began?\u003c/td>\u003ctd>It was too long ago\u003c/td>\u003ctd>The Circle made sure of it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Who are the shrines for?\u003c/td>\u003ctd>Everyone; they calm the land's fire\u003c/td>\u003ctd>The Undying; they drain the land's fire\u003c/td>\u003c/tr>\u003ctr>\u003ctd>What happened to Vale?\u003c/td>\u003ctd>Died soon after the war, grave unknown\u003c/td>\u003ctd>Faked his death in year 60. He is \u003ca href=\"#enchanter-vale\" data-to=\"enchanter-vale\">Enchanter Vale\u003c/a>, and he runs the Emberguard\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Who are the Emberguard?\u003c/td>\u003ctd>Vale's loyal followers, the land's protectors\u003c/td>\u003ctd>The same Circle that caused the Fall, under a new name\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Is it over?\u003c/td>\u003ctd>Yes, 500 years ago\u003c/td>\u003ctd>No. The shrines are a slow Emberfall. The \u003ca href=\"#the-blight\" data-to=\"the-blight\">Blight\u003c/a> is the land running dry\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"s-clues-players-can-find\">Clues players can find\u003c/h3>\n\u003cul>\u003cli>The Circle's mark, a ring of fire, carved over the Emberhall's front door and on a ruined mage tower in \u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a>. It's the same ring the mages stood in around the pit.\u003c/li>\u003cli>The Circle's names, Vale's first, on the frozen shrine in \u003ca href=\"#frostfell\" data-to=\"frostfell\">Frostfell\u003c/a>, dated year 40.\u003c/li>\u003cli>A page cut from the oldest book in the Emberhall library.\u003c/li>\u003cli>The \u003ci>Old Shaft\u003c/i> Memory Echo, and \u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>'s memory of a young, smiling Vale in year 40.\u003c/li>\u003cli>The Mages' Guild records about the Emberheart that stop around year 200.\u003c/li>\u003cli>The carving on the Drowned Shrine off \u003ca href=\"#saltmere-coast\" data-to=\"saltmere-coast\">Saltmere Coast\u003c/a>: \u003ci>&quot;The shrines shall close when the war is won.&quot;\u003c/i>\u003c/li>\u003cli>Nobody knows where Vale is buried, and the Emberhall's Enchanter Vale is &quot;very old, some say older than the Guild&quot;.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-when-players-learn-it\">When players learn it\u003c/h3>\n\u003cp>Hopefuls only hear the official story. Players piece the truth together through quests, books and Memory Echoes, and get the whole of it on the day they're invited into the Emberguard. That's when they choose a side (see \u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a>).\u003c/p>\u003c/div>","src":["wiki/pages/emberfall-disaster.md"],"w":true,"r":false},{"s":"the-emberguard","t":"The Emberguard","c":"Factions","i":"🛡️","sum":"Noble protectors of the ember shrines. Only the worthy are let in.","a":["Emberguard","Lightkeepers"],"ib":[["Home","\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>, \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>"],["Leader","The hooded High Keeper"],["Runs","\u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a>"],["Old name","The Lightkeepers"]],"h":"\u003cp>\u003cb>The Emberguard\u003c/b> keep \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a> lit across the land. They describe themselves as &quot;keepers of the shrines that saved us after the Emberfall&quot;. Their temple is \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a> in \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>, built right over the place the Emberfall began. Only the worthy are let in: new \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> start as \u003ca href=\"#hopefuls\" data-to=\"hopefuls\">Hopefuls\u003c/a> and have to earn their way through the Emberguard's trials.\u003c/p>\n\u003cp>Most members are honest and believe every word of it.\u003c/p>\n\u003ch2 id=\"s-their-rule\">Their rule\u003c/h2>\n\u003cp>Their order's rule (from a book in the Emberhall library):\u003c/p>\n\u003col>\u003cli>Welcome every Emberborn who wakes.\u003c/li>\u003cli>Keep every shrine lit.\u003c/li>\u003cli>Write down every deed, so the light remembers.\u003c/li>\u003cli>Ask nothing of \u003ca href=\"#the-rooted\" data-to=\"the-rooted\">The Rooted\u003c/a> (the ordinary folk) but their trust.\u003c/li>\u003cli>Honour the worthy with Radiance.\u003c/li>\u003cli>The ledgers are for the Keepers alone. (Someone has underlined this one twice.)\u003c/li>\u003c/ol>\n\u003ch2 id=\"s-people\">People\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a> welcomes every new Emberborn and decides who's ready for the trials.\u003c/li>\u003cli>\u003ca href=\"#sister-celene\" data-to=\"sister-celene\">Sister Celene\u003c/a>, the shrine healer.\u003c/li>\u003cli>\u003ca href=\"#enchanter-vale\" data-to=\"enchanter-vale\">Enchanter Vale\u003c/a>, the gentle enchanter.\u003c/li>\u003cli>\u003ca href=\"#brother-oren\" data-to=\"brother-oren\">Brother Oren\u003c/a>, \u003ca href=\"#sister-lisette\" data-to=\"sister-lisette\">Sister Lisette\u003c/a>, \u003ca href=\"#brother-tomas\" data-to=\"brother-tomas\">Brother Tomas\u003c/a> and \u003ca href=\"#sister-wynne\" data-to=\"sister-wynne\">Sister Wynne\u003c/a>, the Emberhall's staff.\u003c/li>\u003cli>The four \u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwardens\u003c/a>, each running a region's great shrine.\u003c/li>\u003c/ul>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The Emberguard's leaders are \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a>, the dark mages who caused \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">the Emberfall\u003c/a>. They never died: they became \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>, living on ember the shrines steal from the land and from every Emberborn. Over 500 years they rewrote the history books and took \u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">The Mages' Guild\u003c/a>'s old records, until everyone believed the opposite of the truth.\u003c/p>\u003c/div>","src":["wiki/pages/emberguard.md"],"w":true,"r":false},{"s":"the-emberhall","t":"The Emberhall","c":"Places","i":"🏛️","sum":"The Emberguard's great white temple, where you wake.","a":["Emberhall","Lighthall","The Lighthall"],"ib":[["Owner","\u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>"],["Kind","Indoors"],["Danger","Safe"],["Size","37 × 27 tiles"]],"h":"\u003cp>\u003cb>The Emberhall\u003c/b> is \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>'s great white temple in \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>, and where every new \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> wakes, on the steps of \u003ca href=\"#the-heart-shrine\" data-to=\"the-heart-shrine\">The Heart Shrine\u003c/a>. Inside are the statues of \u003ca href=\"#the-extinguished\" data-to=\"the-extinguished\">The Extinguished\u003c/a>, a library (\u003ca href=\"#sister-lisette\" data-to=\"sister-lisette\">Sister Lisette\u003c/a>), a dormitory (\u003ca href=\"#sister-wynne\" data-to=\"sister-wynne\">Sister Wynne\u003c/a>), a locked ledger room (\u003ca href=\"#brother-tomas\" data-to=\"brother-tomas\">Brother Tomas\u003c/a>), and \u003ca href=\"#enchanter-vale\" data-to=\"enchanter-vale\">Enchanter Vale\u003c/a>'s corner.\u003c/p>\n\u003cp>A ring-of-fire mark is carved over its front door.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>It's built right over \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a>'s old shaft. Its sealed stair leads down to the Undying's Sanctum. At the Joining, players go down that stair.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"lighthall\">\u003c/figure>\n\u003cp>\u003cb>People here:\u003c/b> \u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>, \u003ca href=\"#sister-celene\" data-to=\"sister-celene\">Sister Celene\u003c/a>, \u003ca href=\"#enchanter-vale\" data-to=\"enchanter-vale\">Enchanter Vale\u003c/a>, \u003ca href=\"#brother-oren\" data-to=\"brother-oren\">Brother Oren\u003c/a>, \u003ca href=\"#sister-lisette\" data-to=\"sister-lisette\">Sister Lisette\u003c/a>, \u003ca href=\"#brother-tomas\" data-to=\"brother-tomas\">Brother Tomas\u003c/a>, \u003ca href=\"#sister-wynne\" data-to=\"sister-wynne\">Sister Wynne\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Things to use:\u003c/b> The Heart Shrine, Empty plinth, Halric the Dawnbringer, Ida of the Saltmere, Tilda Ashwalker, Orla the Kind.\u003c/p>","src":["wiki/pages/lighthall.md","shared/world.ts","shared/npcs.ts"],"w":true,"r":false},{"s":"the-emberheart","t":"The Emberheart","c":"Lore","i":"❤️‍🔥","sum":"The living fire deep under Heartvale. The land's heart.","a":["Emberheart","Heartfire","The Heartfire"],"ib":[["Kind","The land's heart"],["Where","Deep under \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>, in \u003ca href=\"#the-hollow-heart\" data-to=\"the-hollow-heart\">The Hollow Heart\u003c/a>"],["Beats","About once a minute"],["Old name","The Heartfire (before that, the Wellspring)"]],"h":"\u003cp>\u003cb>The Emberheart\u003c/b> is the land's heart: a fire that has always burned deep under \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>. It beats slowly, about once a minute, and every beat sends warmth up through the rock and soil. That warmth is \u003ca href=\"#the-ember\" data-to=\"the-ember\">the ember\u003c/a>. It's why seeds sprout, springs run warm, and animals have the strength to live.\u003c/p>\n\u003cp>The closest you can get to it on foot is the \u003ca href=\"#the-crystal-cave\" data-to=\"the-crystal-cave\">Crystal Cave\u003c/a>, where you can hear it beat in the rock. It burns in \u003ca href=\"#the-hollow-heart\" data-to=\"the-hollow-heart\">The Hollow Heart\u003c/a>, a lake of living fire with thousands of thin threads rising from it, one for every \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-is-it-alive\">Is it alive?\u003c/h2>\n\u003cp>Nobody knows for sure.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>It's alive in the way a tree is alive. It can't think or talk, but it can be hurt, and it is weakening, because \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a> have been draining it for 460 years. If the Emberheart goes out, the whole land goes cold and dies. \u003ca href=\"#frostfell\" data-to=\"frostfell\">Frostfell\u003c/a>'s ice is already creeping south, and the heartbeat in the Crystal Cave is slower than it was when \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a> was a girl.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-in-the-game-today\">In the game today\u003c/h2>","src":["wiki/pages/emberheart.md"],"w":true,"r":false},{"s":"the-extinguished","t":"The Extinguished","c":"People","i":"🕯️","sum":"The great heroes of the past, who &quot;gave their ember back so new heroes could wake&quot;. Their statues stand in the Emberhall.","a":["Extinguished","Radiants","The Radiants","Hall of Champions"],"ib":[["Who","The greatest Emberborn champions"],["How","A \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a>, every few decades"],["Statues","In \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>"],["Old name","The Radiants"]],"h":"\u003cp>\u003cb>The Extinguished\u003c/b> are the greatest \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> heroes of the past. Each one was honoured with a \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a>, where they burned brighter than ever and then went out like a candle. Their statues stand in \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>, where \u003ca href=\"#brother-oren\" data-to=\"brother-oren\">Brother Oren\u003c/a> tells their stories. One plinth stands empty, its name scratched off.\u003c/p>\n\u003cp>They used to be called the Radiants, and their statues had a room of their own, the Hall of Champions. The next game update moves the statues into the main hall.\u003c/p>\n\u003ch2 id=\"s-the-official-story\">The official story\u003c/h2>\n\u003cp>This is what the Emberguard teach, and what every Hopeful hears on their first day.\u003c/p>\n\u003cul>\u003cli>\u003cb>Ember is precious.\u003c/b> The Heart Shrine can only raise new heroes with ember, and there's only so much to go round.\u003c/li>\u003cli>\u003cb>The best heroes give theirs back.\u003c/b> When an Emberborn has done enough, they're invited to a Radiance Ceremony. They lay their hands on the Heart Shrine, blaze up one last time, and let their ember flow back into it. They go out gently, \u003ci>&quot;like falling asleep by the fire&quot;\u003c/i>.\u003c/li>\u003cli>\u003cb>One flame goes out so a hundred can be lit.\u003c/b> Their ember raises the heroes who come after. Every new Emberborn, the Emberguard say, carries a little of the Extinguished inside them.\u003c/li>\u003cli>\u003cb>It's a choice, and the highest honour.\u003c/b> Nobody is forced. To be invited is the greatest reward an Emberborn can earn: a statue in the Emberhall, their name in the great ledger, and a pension for any family they left.\u003c/li>\u003cli>\u003cb>That's why there's no body.\u003c/b> There's nothing left to bury. They're &quot;resting in the Emberheart&quot;, and their families are told to be proud.\u003c/li>\u003c/ul>\n\u003cp>The Emberguard's sayings: \u003ci>&quot;Burn bright, go out kind.&quot;\u003c/i> \u003ci>&quot;One flame goes out so a hundred can be lit.&quot;\u003c/i>\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003ch2 id=\"s-the-true-story\">The true story\u003c/h2>\n\u003cp>The Extinguished didn't give their ember back to anyone. They were drained to feed \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a>, who rule the Emberguard as \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>.\u003c/p>\n\u003cul>\u003cli>\u003cb>Their ember didn't raise new heroes.\u003c/b> It went down the Heart Shrine's thread to the Undying. One Ceremony keeps them alive and strong for years.\u003c/li>\u003cli>\u003cb>They were chosen for how much ember they held, not for their deeds.\u003c/b> Every level an Emberborn gains makes their ember stronger. The Emberguard praise and reward the brightest heroes because those are the ones worth draining. &quot;Doing enough&quot; really means &quot;ripe&quot;.\u003c/li>\u003cli>\u003cb>It wasn't a choice.\u003c/b> The invitation can't be refused. On the day, the champion is given a calming draught brewed for the Emberhall and led down the stair under the Heart Shrine. Few understood what was happening until it was too late.\u003c/li>\u003cli>\u003cb>It isn't gentle.\u003c/b> The thread pulls everything out at once. Most are gone in moments. A few fought back, and the Ceremony calendar marks them \u003ci>&quot;spark flawed&quot;\u003c/i>.\u003c/li>\u003cli>\u003cb>Some of them aren't gone.\u003c/b> A few sparks are still trapped in old refined emberstones. The ghosts in \u003ca href=\"#the-graveyard\" data-to=\"the-graveyard\">The Graveyard\u003c/a> are drained Emberborn still tied to the old shrine.\u003c/li>\u003cli>\u003cb>One survived.\u003c/b> \u003ca href=\"#sable\" data-to=\"sable\">Sable\u003c/a>, the brightest of them all, was drained in year 460 and lived. Hers is the empty plinth. She founded \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>.\u003c/li>\u003cli>\u003cb>Tilda knew.\u003c/b> Tilda Ashwalker found out the truth before her Ceremony. Her last cairn in the Barrens says \u003ci>&quot;Don't go down the stair.&quot;\u003c/i>\u003c/li>\u003c/ul>\n\u003cp>Why it matters: every Hopeful is being raised to become one of the Extinguished. The more a player levels up, the brighter they burn, and the closer they are to their own invitation. That's the question at the Joining (see \u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a>).\u003c/p>\u003c/div>\n\u003ch2 id=\"s-the-statues\">The statues\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Hero\u003c/th>\u003cth>Known for\u003c/th>\u003cth>🔒 What really happened\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Halric the Dawnbringer\u003c/td>\u003ctd>Held the Greyspine pass alone for three days. Fell and rose eleven times.\u003c/td>\u003ctd>One of the first Emberborn. Drained to feed the Circle, who were still weak from the Emberfall.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ida of the Saltmere\u003c/td>\u003ctd>Rowed the Saltmere coast lighting dark shrines. The fisherfolk still leave shells at her feet.\u003c/td>\u003ctd>Her family was told she &quot;went into the Emberheart&quot;, and never got a body.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tilda Ashwalker\u003c/td>\u003ctd>Walked into the Withering and led two hundred people home.\u003c/td>\u003ctd>Learned the truth and left warnings in stone piles across the Barrens. Drained anyway.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#orla-the-kind\" data-to=\"orla-the-kind\">Orla the Kind\u003c/a>\u003c/td>\u003ctd>Nursed the sick through the Grey Fever, rising nine times.\u003c/td>\u003ctd>Each rising skimmed her a little; by the end she was &quot;almost see-through&quot;.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>(the empty plinth)\u003c/td>\u003ctd>One letter is left under the dust: S.\u003c/td>\u003ctd>\u003ca href=\"#sable\" data-to=\"sable\">Sable\u003c/a>, the only one who survived.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["wiki/pages/extinguished.md"],"w":true,"r":false},{"s":"the-first-tithe","t":"The First Tithe","c":"Quests","i":"📜","sum":"Act 1 from Keeper Aldric.","a":[],"ib":[["Part of","Act 1"],["Given by","Keeper Aldric"],["Where","in the Emberhall, the great white temple in the town square"],["Steps","1"]],"h":"\u003cp>\u003cb>The First Tithe\u003c/b> is part of the Act 1 from \u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>, found in the Emberhall, the great white temple in the town square.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#lantern-rounds\" data-to=\"lantern-rounds\">Lantern Rounds\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Keeper Aldric about the Tithe \u003ci>(you get: 2 × \u003ca href=\"#potions\" data-to=\"potions\">Tithe tonic\u003c/a>)\u003c/i>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#potions\" data-to=\"potions\">Tithe tonic\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> I promised I'd explain the tithe. Sit down a moment. When an Emberborn falls, the shrine raises them. That takes light. So, after the Oath, each time you're knocked out the shrine puts a Tithe mark on you: a gold link by your health bar. You can have up to five. While you carry marks, a fifth of what you learn goes to the shrine, to keep it bright for the next hero. Once it's had enough, the mark fades on its own. You never lose a level, or a single thing you own. A small tithe, so the shrines can keep raising heroes. And if you're in a hurry, a Tithe tonic clears a mark at once. Here, take two.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"the-general-store","t":"The General Store","c":"Places","i":"🏠","sum":"","a":[],"ib":[["Kind","Indoors"],["Danger","Safe"],["Size","11 × 8 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"tam\">\u003c/figure>\n\u003cp>\u003cb>People here:\u003c/b> \u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>.\u003c/p>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"the-graveyard","t":"The Graveyard","c":"Places","i":"🪦","sum":"Night herbs and ghosts, deep in the Thornwood.","a":[],"ib":[],"h":"\u003cp>\u003cb>The Graveyard\u003c/b> lies in \u003ca href=\"#the-thornwood\" data-to=\"the-thornwood\">The Thornwood\u003c/a>. It's a place for night herbs, and ghosts.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The ghosts are drained \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a>, still tied to the old Thornwood shrine. One counts to eleven over and over: she was Halric the Dawnbringer's friend (see \u003ca href=\"#the-extinguished\" data-to=\"the-extinguished\">The Extinguished\u003c/a>).\u003c/p>\u003c/div>","src":["wiki/pages/graveyard.md"],"w":true,"r":false},{"s":"the-hall-of-light","t":"The Hall of Light","c":"Quests","i":"📜","sum":"Prologue from Keeper Aldric.","a":[],"ib":[["Part of","Prologue"],["Given by","Keeper Aldric"],["Where","in the Emberhall, the great white temple in the town square"],["Steps","4"]],"h":"\u003cp>\u003cb>The Hall of Light\u003c/b> is part of the Prologue from \u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>, found in the Emberhall, the great white temple in the town square.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#awakening\" data-to=\"awakening\">Awakening\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Keeper Aldric\u003c/li>\u003cli>Take Brother Oren's tour of the Hall of Champions (east): Oren, the 4 Extinguished and the empty plinth\u003c/li>\u003cli>Meet three more Emberguard: Lisette, Tomas and Wynne\u003c/li>\u003cli>Go back to Keeper Aldric\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Rewards:\u003c/b> 30 bronze.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> Let me show you our home. The Emberhall is the Emberguard's temple, built round the Heart Shrine: the brightest shrine in all Embervale. Brother Oren will show you round first. He keeps the Hall of Champions, through the east arch, and he's waiting for you now. Then meet the rest of my brothers and sisters: Sister Lisette keeps the library, Brother Tomas the stores, and Sister Wynne the beds. Come back to me when you've met them all.\u003c/p>\n\u003cp>\u003cb>Step 4.\u003c/b> You've met everyone? Good, good. And you found the empty plinth, I see. Every family has its black sheep, friend. Here, a little something to start you off. The Emberhall pays its own.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":true},{"s":"the-heart-shrine","t":"The Heart Shrine","c":"Places","i":"⛩️","sum":"The brightest shrine, in the Emberhall. Where new Emberborn wake and come back to.","a":[],"ib":[],"h":"\u003cp>\u003cb>The Heart Shrine\u003c/b> is the brightest of \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a>, inside \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>. New \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> wake on its steps, and fallen ones come back to it. \u003ca href=\"#sister-celene\" data-to=\"sister-celene\">Sister Celene\u003c/a> tends it.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>Every shrine's thread runs here, and from here down to \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>.\u003c/p>\u003c/div>","src":["wiki/pages/heart-shrine.md"],"w":true,"r":false},{"s":"the-hearthstone-inn","t":"The Hearthstone Inn","c":"Places","i":"🏠","sum":"","a":[],"ib":[["Kind","Indoors"],["Danger","Safe"],["Size","13 × 9 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"inn\">\u003c/figure>\n\u003cp>\u003cb>Things to use:\u003c/b> Enchanted chest.\u003c/p>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"the-hearthwise","t":"The Hearthwise","c":"Lore","i":"🏺","sum":"The old folk who lived by the rule: take only what the land gives back.","a":["Hearthwise"],"ib":[],"h":"\u003cp>\u003cb>The Hearthwise\u003c/b> were the old folk of the \u003ca href=\"#old-kingdom\" data-to=\"old-kingdom\">Old Kingdom\u003c/a> who lived by the one rule of \u003ca href=\"#the-ember\" data-to=\"the-ember\">The ember\u003c/a>: \u003ci>&quot;Take only what the land gives back.&quot;\u003c/i> Their saying is still painted over a few old doorways.\u003c/p>\n\u003cp>Their ways live on in odd places. The goblins of \u003ca href=\"#greyspine-peaks\" data-to=\"greyspine-peaks\">Greyspine Peaks\u003c/a> sing a Hearthwise song to keep the grey sickness away, and \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a> build hearths that burn without a shrine, the Hearthwise way.\u003c/p>","src":["wiki/pages/hearthwise.md"],"w":true,"r":false},{"s":"the-hollow-heart","t":"The Hollow Heart","c":"Places","i":"🌋","sum":"The cavern under the land where the Emberheart burns. The end of the main story.","a":[],"ib":[["Levels","65+"]],"h":"\u003cp>\u003cb>The Hollow Heart\u003c/b> is a cavern deep under the land, and the end of the main story. It's where \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a> burns: a lake of living fire with thousands of thin threads rising from it, one for every \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a>.\u003c/p>\n\u003cp>In the planned quest \u003ci>The Heartbeat\u003c/i>, you put your hand in the flame and feel the land's heart beat, slow and tired.\u003c/p>","src":["wiki/pages/hollow-heart.md"],"w":true,"r":false},{"s":"the-hollow-wolves","t":"The Hollow Wolves","c":"Quests","i":"📜","sum":"Act 1 from Huntmaster Kael.","a":[],"ib":[["Part of","Act 1"],["Given by","Huntmaster Kael"],["Where","in the lodge by the gate"],["Steps","3"]],"h":"\u003cp>\u003cb>The Hollow Wolves\u003c/b> is part of the Act 1 from \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>, found in the lodge by the gate.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#oath-of-the-flame\" data-to=\"oath-of-the-flame\">Oath of the Flame\u003c/a>, \u003ca href=\"#standing-your-ground\" data-to=\"standing-your-ground\">Standing your ground\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Huntmaster Kael\u003c/li>\u003cli>Defeat 5 hollow wolves at Wolf Hollow (Thornwood, south-west)\u003c/li>\u003cli>Go back to Huntmaster Kael\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Rewards:\u003c/b> 2 silver.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> You've heard about the grey wolves? Blighted, the Emberguard call them. Hollow-eyed, glowing, and mean. There's a pack of them at Wolf Hollow, south-west through the Thornwood. Clear 5. Take a friend if you can. And here's a funny thing. The Blight is always worst downhill of a shrine. Always.\u003c/p>\n\u003cp>\u003cb>Step 3.\u003c/b> Five! You've earned this. It was mine, when I was a Warden of the Thornwood, before the Emberhall took the Wardens over. Look after it. And keep your eyes open out there.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"the-mages-guild","t":"The Mages' Guild","c":"Factions","i":"🔮","sum":"Scholars of magic and emberstone, south-west of Emberhold's square.","a":["Mages' Guild","Mages Guild"],"ib":[["Head","\u003ca href=\"#archmage-rowan\" data-to=\"archmage-rowan\">Archmage Rowan\u003c/a>"],["Where","\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>, south-west of the square"],["Kind","Indoors"],["Danger","Safe"],["Size","19 × 11 tiles"]],"h":"\u003cp>\u003cb>The Mages' Guild\u003c/b> are scholars of magic and emberstone. Their hall in \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a> has the enchanting altar, the alchemy table, enchanted chests you can rent, and a board of magic jobs (see \u003ca href=\"#bounties\" data-to=\"bounties\">Bounties\u003c/a>). \u003ca href=\"#archmage-rowan\" data-to=\"archmage-rowan\">Archmage Rowan\u003c/a> runs it and teaches \u003ca href=\"#enchanting\" data-to=\"enchanting\">Enchanting\u003c/a>; \u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">Alchemist Moss\u003c/a> teaches \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> there.\u003c/p>\n\u003cp>Its records about \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a> stop around year 200. Scholars find that odd.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The Guild is honest, but the emberstone it sells ends up feeding \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>. Its missing records were taken by the Emberguard.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"guild\">\u003c/figure>\n\u003cp>\u003cb>People here:\u003c/b> \u003ca href=\"#archmage-rowan\" data-to=\"archmage-rowan\">Archmage Rowan\u003c/a>, \u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">Alchemist Moss\u003c/a>, \u003ca href=\"#repairer-oswin\" data-to=\"repairer-oswin\">Repairer Oswin\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Things to use:\u003c/b> Alchemy table, Enchanting altar, Guild board, Enchanted chest.\u003c/p>","src":["wiki/pages/mages-guild.md","shared/world.ts","shared/npcs.ts"],"w":true,"r":false},{"s":"the-old-mine","t":"The old mine","c":"Places","i":"🕳️","sum":"","a":[],"ib":[["Kind","Cave"],["Danger","Safe"],["Size","32 × 16 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"old_mine\">\u003c/figure>\n\u003cp>\u003cb>Monsters:\u003c/b> \u003ca href=\"#rat\" data-to=\"rat\">Rat\u003c/a> (3).\u003c/p>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"the-old-sweeper","t":"The Old Sweeper","c":"Quests","i":"📜","sum":"Prologue from Keeper Aldric.","a":[],"ib":[["Part of","Prologue"],["Given by","Keeper Aldric"],["Where","in the Emberhall, the great white temple in the town square"],["Steps","1"]],"h":"\u003cp>\u003cb>The Old Sweeper\u003c/b> is part of the Prologue from \u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>, found in the Emberhall, the great white temple in the town square.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#light-the-way\" data-to=\"light-the-way\">Light the Way\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Keeper Aldric\u003c/li>\u003c/ol>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> One more thing. You'll need to feed yourself, and earn your way. Old Maren can teach you that. She lives in the little cottage on the lake shore, west along the road. Harmless. She's been here forever, and she teaches every new hero the basics. The Emberguard pay every trainer in town to teach the Emberborn, so every lesson is a gift from the Emberhall. Off you go: out of the great doors, then west along the road to the lake. Your 🗺️ map shows her ❗.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"the-rooted","t":"The Rooted","c":"Factions","i":"🌳","sum":"Ordinary townsfolk who can't come back from death.","a":["Rooted"],"ib":[],"h":"\u003cp>\u003cb>The Rooted\u003c/b> are the ordinary folk of the land: people born the usual way, who can't come back from death. Most of Emberhold's townsfolk are Rooted, and they trust \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a> completely. \u003ca href=\"#sister-celene\" data-to=\"sister-celene\">Sister Celene\u003c/a>, \u003ca href=\"#repairer-oswin\" data-to=\"repairer-oswin\">Repairer Oswin\u003c/a> and \u003ca href=\"#tamsin\" data-to=\"tamsin\">Tamsin\u003c/a> are Rooted.\u003c/p>","src":["wiki/pages/rooted.md"],"w":true,"r":false},{"s":"the-shrines","t":"The shrines","c":"Lore","i":"⛩️","sum":"Where Emberborn wake and come back to. Everyone believes they keep the Blight back.","a":["Shrines","Shrine","The siphon","Siphon"],"ib":[],"h":"\u003cp>\u003cb>The shrines\u003c/b> stand all across the land, kept lit by \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>. New \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> wake at them, and fallen Emberborn come back at the nearest one. A dark shrine raises no one. Every child is taught that the shrines saved the land after the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>, and that they keep \u003ca href=\"#the-blight\" data-to=\"the-blight\">The Blight\u003c/a> back.\u003c/p>\n\u003cp>The brightest is \u003ca href=\"#the-heart-shrine\" data-to=\"the-heart-shrine\">The Heart Shrine\u003c/a> in \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>. Out in \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a> there's the Westroad shrine and the Thornwood shrine, both relit in Act 1. Each region has a great shrine run by an \u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwarden\u003c/a>.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>Each shrine is a tap. It quietly draws \u003ca href=\"#the-ember\" data-to=\"the-ember\">ember\u003c/a> out of the land around it and sends it along an invisible thread to the Heart Shrine, and from there down to \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>. That stolen ember keeps them alive. The shrines don't keep the Blight back: \u003cb>they cause it\u003c/b>.\u003c/p>\n\u003cp>The shrines were meant to close when the war was won. The Drowned Shrine off \u003ca href=\"#saltmere-coast\" data-to=\"saltmere-coast\">Saltmere Coast\u003c/a> sank with its carving: \u003ci>&quot;The shrines shall close when the war is won.&quot;\u003c/i>\u003c/p>\n\u003cp>The shrines also shape stolen ember into bodies: that's what Emberborn are. Each time an Emberborn falls and comes back, the shrine skims a little ember off them (\u003ca href=\"#the-tithe\" data-to=\"the-tithe\">The Tithe\u003c/a>).\u003c/p>\u003c/div>","src":["wiki/pages/shrines.md"],"w":true,"r":false},{"s":"the-spider-cave","t":"The spider cave","c":"Places","i":"🕳️","sum":"","a":[],"ib":[["Kind","Cave"],["Danger","Monsters attack on sight"],["Size","28 × 15 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"spider_cave\">\u003c/figure>\n\u003cp>\u003cb>Monsters:\u003c/b> \u003ca href=\"#cave-spider\" data-to=\"cave-spider\">Cave spider\u003c/a> (3).\u003c/p>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"the-sundered-crown","t":"The Sundered Crown","c":"Places","i":"🌑","sum":"The endgame zone: a crater of ruins in the far west.","a":[],"ib":[["Levels","70+"]],"h":"\u003cp>\u003cb>The Sundered Crown\u003c/b> is the endgame zone, a crater of ruins in the far west. It's what's left of \u003ca href=\"#brightcrown\" data-to=\"brightcrown\">Brightcrown\u003c/a>, where the \u003ca href=\"#ember-crown\" data-to=\"ember-crown\">Ember Crown\u003c/a> went off in the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>Half of the Ember Crown and the \u003ca href=\"#ember-seed\" data-to=\"ember-seed\">Ember Seed\u003c/a> are hidden in its Crown Vault. Both sides search the ruins: the Emberguard for the Crown, the Ashbound for the Seed.\u003c/p>\u003c/div>","src":["wiki/pages/sundered-crown.md"],"w":true,"r":false},{"s":"the-thornwood","t":"The Thornwood","c":"Places","i":"🌲","sum":"Deep forest south of town, slowly going dark.","a":["Thornwood","Dark Forest"],"ib":[["Levels","15 to 30"]],"h":"\u003cp>\u003cb>The Thornwood\u003c/b> is the deep forest south of \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>, behind the fenced gate. In the game its edge is the danger zone: monsters there attack on sight. It holds the Goblin camp, Spider hollow, Wolf Hollow, an Ashbound camp and \u003ca href=\"#the-graveyard\" data-to=\"the-graveyard\">The Graveyard\u003c/a>.\u003c/p>\n\u003cp>Its old trees glowed with \u003ca href=\"#the-ember\" data-to=\"the-ember\">ember\u003c/a> at night. Now the woods are going dark: the Dark Forest is spreading toward \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a> a few steps a day. \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a> remembers when it still glowed. Its great shrine is run by Warden Crowe (see \u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwardens\u003c/a>); in Act 1 you relight the Thornwood shrine (\u003ci>\u003ca href=\"#a-light-in-the-thornwood\" data-to=\"a-light-in-the-thornwood\">A Light in the Thornwood\u003c/a>\u003c/i>).\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The shrines pull the glow away, and where it's gone the bark turns black. That's the Dark Forest.\u003c/p>\u003c/div>","src":["wiki/pages/thornwood.md"],"w":true,"r":false},{"s":"the-tithe","t":"The Tithe","c":"Lore","i":"🕯️","sum":"The bit of ember a shrine keeps each time an Emberborn falls and comes back.","a":["Ember Debt","Tithe marks","Soul Debt"],"ib":[],"h":"\u003cp>\u003cb>The Tithe\u003c/b> (also called Ember Debt) is what an \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> pays each time they fall and come back. The Emberguard teach that it's a small, fair price for being made again, and \u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">Alchemist Moss\u003c/a> brews &quot;Tithe tonics&quot; for \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a> to clear it.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The Tithe is the shrine skimming a little ember off you, sending it down to \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>. Ashbound players who cut their thread stop paying it.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>After the Oath, each time you're knocked out you get a Tithe mark (at most 5). While you have marks, 20% of the XP you earn goes to the shrine instead. Each mark clears once the shrine has taken enough XP (52 at level 1, 640 at level 50). You never lose levels or items. A \u003ca href=\"#tithe-tonic\" data-to=\"tithe-tonic\">Tithe tonic\u003c/a> clears one mark at once.\u003c/p>","src":["wiki/pages/tithe.md","shared/story.ts"],"w":true,"r":false},{"s":"the-totem","t":"The Totem","c":"Quests","i":"📜","sum":"Act 1 from Woodworker Rook.","a":[],"ib":[["Part of","Act 1"],["Given by","Woodworker Rook"],["Where","in the workshop just west of the square"],["Steps","5"]],"h":"\u003cp>\u003cb>The Totem\u003c/b> is part of the Act 1 from \u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>, found in the workshop just west of the square.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#oath-of-the-flame\" data-to=\"oath-of-the-flame\">Oath of the Flame\u003c/a>, \u003ca href=\"#handy-work\" data-to=\"handy-work\">Handy work\u003c/a>, \u003ca href=\"#the-woodcutters-start\" data-to=\"the-woodcutters-start\">The woodcutter's start\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Woodworker Rook\u003c/li>\u003cli>Chop 5 oak logs (Woodcutting 5)\u003c/li>\u003cli>Bring the oak logs to Woodworker Rook \u003ci>(you get: \u003ca href=\"#shrine-totems\" data-to=\"shrine-totems\">Shrine totems\u003c/a>, \u003ca href=\"#folded-note\" data-to=\"folded-note\">Folded note\u003c/a>)\u003c/i>\u003c/li>\u003cli>Deliver the totem to Keeper Aldric\u003c/li>\u003cli>Go back to Woodworker Rook \u003ci>(you get: \u003ca href=\"#axe\" data-to=\"axe\">Bronze axe (Oak)\u003c/a>)\u003c/i>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#shrine-totems\" data-to=\"shrine-totems\">Shrine totems\u003c/a>, \u003ca href=\"#folded-note\" data-to=\"folded-note\">Folded note\u003c/a>, \u003ca href=\"#axe\" data-to=\"axe\">Bronze axe (Oak)\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> Ember, eh? Then you can fetch for the Emberhall same as I carve for it. They want a shrine totem. Oak, nothing less. Bring me 5 oak logs (the round trees: you need Woodcutting 5) and I'll carve it.\u003c/p>\n\u003cp>\u003cb>Step 3.\u003c/b> Good wood. Give me a moment. ...There. A shrine totem. Take it to Keeper Aldric. Oh, and I've tucked a little note inside, for luck. Old carver's habit. Don't you go reading it, mind.\u003c/p>\n\u003cp>\u003cb>Step 4.\u003c/b> Rook's work! Lovely. He's carved for us for thirty years. This one will go up in a shrine on the Westroad, once we've dealt with the Ashbound. Go back to Rook and thank him for me, would you?\u003c/p>\n\u003cp>\u003cb>Step 5.\u003c/b> Delivered, was it? Good. Here: I put an oak handle on a bronze axe for you. Oak's tougher than pine, and it shows.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"the-undying","t":"The Undying","c":"Factions","i":"💀","sum":"The secret leaders of the Emberguard, who live on the siphon.","a":["Undying"],"ib":[],"h":"\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>\u003cb>The Undying\u003c/b> are the leaders of \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>: the original \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">Ember Circle\u003c/a>, who caused \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">the Emberfall\u003c/a> 500 years ago and have lived on stolen ember ever since. They live below \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>, down its sealed stair, in the Undying's Sanctum.\u003c/p>\n\u003cp>Known members: \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a> (as \u003ca href=\"#enchanter-vale\" data-to=\"enchanter-vale\">Enchanter Vale\u003c/a> and the hooded High Keeper), \u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>, and the four \u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwardens\u003c/a>.\u003c/p>\n\u003cp>Emberguard players who choose to join become Undying at the end of Act 4B.\u003c/p>\u003c/div>","src":["wiki/pages/undying.md"],"w":true,"r":false},{"s":"the-wardens","t":"The Wardens","c":"Factions","i":"🏹","sum":"Huntmaster Kael's rangers, guarding the borders against the Blight.","a":["Wardens"],"ib":[],"h":"\u003cp>\u003cb>The Wardens\u003c/b> are \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>'s rangers. They guard the borders against \u003ca href=\"#the-blight\" data-to=\"the-blight\">The Blight\u003c/a>. They're honest. Kael distrusts the Emberguard, but can't say why. Not to be confused with the \u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwardens\u003c/a>.\u003c/p>","src":["wiki/pages/wardens.md"],"w":true,"r":false},{"s":"the-westroad","t":"The Westroad","c":"Places","i":"🛤️","sum":"The road west out of town, with a roadside shrine.","a":["Westroad"],"ib":[],"h":"\u003cp>\u003cb>The Westroad\u003c/b> is the road west out of \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>, with a roadside shrine. Ashbound scouts watch it. In Act 1 you rebuild its shrine (\u003ci>\u003ca href=\"#rebuild-the-shrine\" data-to=\"rebuild-the-shrine\">Rebuild the Shrine\u003c/a>\u003c/i>), and find \u003ci>\u003ca href=\"#ash-on-the-road\" data-to=\"ash-on-the-road\">Ash on the Road\u003c/a>\u003c/i>. The road on toward the Barrens is closed for now.\u003c/p>\n\u003cp>\u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a> smash its shrine first, because it's closest to Emberhold.\u003c/p>","src":["wiki/pages/westroad.md"],"w":true,"r":false},{"s":"the-withering","t":"The Withering","c":"Lore","i":"🥀","sum":"What happens where the ember is taken: things turn grey, sick and dark.","a":["The Dark Forest","Withering"],"ib":[],"h":"\u003cp>\u003cb>The Withering\u003c/b> is what happens to land that has lost its \u003ca href=\"#the-ember\" data-to=\"the-ember\">ember\u003c/a>. Grass goes brown, trees turn black, and animals become \u003ca href=\"#the-blight\" data-to=\"the-blight\">Blighted\u003c/a>. In \u003ca href=\"#the-thornwood\" data-to=\"the-thornwood\">The Thornwood\u003c/a> it shows as the Dark Forest, which is spreading toward \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a> a few steps a day.\u003c/p>\n\u003cp>It started in \u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a>, burned in the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>.\u003c/p>\n\u003cp>People say the Blight is just bad luck, and that \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a> make it worse by smashing shrines.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The Withering spreads out from \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a>. The shrines pull ember out of the land around them, and the land goes cold. Trees die nearest the shrines first, \u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a>'s maps show the Withering spreading from them, and \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a> says the Blight is always worst downhill of a shrine.\u003c/p>\u003c/div>","src":["wiki/pages/withering.md"],"w":true,"r":false},{"s":"the-wolf-den","t":"The wolf den","c":"Places","i":"🕳️","sum":"","a":[],"ib":[["Kind","Cave"],["Danger","Monsters attack on sight"],["Size","20 × 13 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"wolf_den\">\u003c/figure>\n\u003cp>\u003cb>Monsters:\u003c/b> \u003ca href=\"#alpha-wolf\" data-to=\"alpha-wolf\">Alpha wolf\u003c/a> (1), \u003ca href=\"#wolf\" data-to=\"wolf\">Wolf\u003c/a> (4).\u003c/p>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"the-wolf-hunt","t":"The Wolf Hunt","c":"Quests","i":"📜","sum":"Side quest from Huntmaster Kael.","a":[],"ib":[["Part of","Side quest"],["Given by","Huntmaster Kael"],["Where","in the lodge by the gate"],["Steps","4"],["Needs","Hunting 5"]],"h":"\u003cp>\u003cb>The Wolf Hunt\u003c/b> is a side quest from \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>, found in the lodge by the gate.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Huntmaster Kael about the wolf den\u003c/li>\u003cli>Defeat 4 wolves at the den (south-west of the gate path)\u003c/li>\u003cli>Defeat the alpha wolf\u003c/li>\u003cli>Go back to Huntmaster Kael \u003ci>(you get: \u003ca href=\"#platebody\" data-to=\"platebody\">Leather jerkin\u003c/a>)\u003c/i>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#leadership\" data-to=\"leadership\">Leadership\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#platebody\" data-to=\"platebody\">Leather jerkin\u003c/a>, 15 silver.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> You've got the hang of hunting. Now I need help with something bigger. A pack has dug a den in the Dark Forest, south-west of the gate path, and its alpha is the biggest wolf I've ever seen. It's too much for one hunter. Get some friends together: click another player to invite them to a party. Whoever leads learns Leadership, part of Charisma. Kills count for everyone in the party who's close by. Clear 4 wolves from the den, then bring down the alpha. You can try it alone, but take every potion you have.\u003c/p>\n\u003cp>\u003cb>Step 4.\u003c/b> The alpha's down? The farm and the road will be safer for it. Well hunted! Everyone who hunted it with you gets the same from me: here's a leather jerkin and your pay. The pack will find a new alpha in time, so keep your bow strung. That alpha was Blighted, did you see? Grey, and glowing. I've never seen one that big.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"the-woodcutters-start","t":"The woodcutter's start","c":"Quests","i":"📜","sum":"Lessons from Forester Holt.","a":[],"ib":[["Part of","Lessons"],["Given by","Forester Holt"],["Where","on Trainer Row, east of the square"],["Steps","7"]],"h":"\u003cp>\u003cb>The woodcutter's start\u003c/b> is a lesson from \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>, found on Trainer Row, east of the square.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Forester Holt on Trainer Row\u003c/li>\u003cli>Chop 3 logs by hand (no axe on your belt)\u003c/li>\u003cli>Go back to Forester Holt \u003ci>(you get: \u003ca href=\"#axe\" data-to=\"axe\">Bronze axe (Pine)\u003c/a>)\u003c/i>\u003c/li>\u003cli>Equip the bronze axe\u003c/li>\u003cli>Chop 10 logs with your axe\u003c/li>\u003cli>Sell some logs to Forester Holt\u003c/li>\u003cli>Go back to Forester Holt for your reward \u003ci>(you get: \u003ca href=\"#axe\" data-to=\"axe\">Bronze axe (Oak)\u003c/a>)\u003c/i>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#axe\" data-to=\"axe\">Bronze axe (Pine)\u003c/a>, \u003ca href=\"#axe\" data-to=\"axe\">Bronze axe (Oak)\u003c/a>, 1 silver.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> Come in, come in! Holt's the name, and trees are the game. I'll teach you Woodcutting. Woodcutting is part of Endurance, like Fishing and Mining. Every kind of log has its own Mastery, so the more of one you chop, the faster it goes. Let's start the hard way: chop 3 logs by hand. The pointy pine trees grow in the meadow just north of Trainer Row.\u003c/p>\n\u003cp>\u003cb>Step 3.\u003c/b> Sore hands? Good. Now you know why folks use tools. Here's my old bronze axe. Equip it and chop 10 logs. Chopping costs 10 stamina a log, so keep some food handy. Logs are heavy too (2 kg each): the ⚖️ bar under your bag shows how much more you can carry.\u003c/p>\n\u003cp>\u003cb>Step 7.\u003c/b> Look at you, a proper woodcutter! Here's a new bronze axe with a good oak handle: it chops faster and lasts longer than my old one. Better trees need a higher Woodcutting level: oaks at 5, and finer woods after that. Funny thing. The trees nearest the shrine always die first. Nobody listens to an old forester, though.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"thread","t":"Thread","c":"Items","i":"🧵","sum":"Materials and food. Sells for 37 bronze.","a":["spool of thread"],"ib":[["Kind","Materials and food"],["Shop pays","37 bronze"],["Game id","\u003ccode>thread\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#spider-silk\" data-to=\"spider-silk\">Spider silk\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#cloth\" data-to=\"cloth\">Cloth\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"tin-ore","t":"Tin ore","c":"Items","i":"🪨","sum":"Ore. Sells for 5 bronze.","a":[],"ib":[["Kind","Ore"],["Shop pays","5 bronze"],["Game id","\u003ccode>tin_ore\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a> level 1 from a tin rock (5 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#hammer-and-fire\" data-to=\"hammer-and-fire\">Hammer and fire\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#bronze-bar\" data-to=\"bronze-bar\">Bronze bar\u003c/a>.\u003c/li>\u003cli>Smelted into \u003ca href=\"#bronze-bar\" data-to=\"bronze-bar\">Bronze bar\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"tithe-tonic","t":"Tithe tonic","c":"Items","i":"🧪","sum":"Clears one Tithe mark.","a":[],"ib":[["Alchemy level","2"],["Ingredients","Red cap mushrooms + Wild roots"],["XP","10"],["First tries work","70%"]],"h":"\u003cp>Clears one Tithe mark. Brew it with \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> level 2 from \u003ca href=\"#red-cap-mushrooms\" data-to=\"red-cap-mushrooms\">Red cap mushrooms\u003c/a> and \u003ca href=\"#wild-roots\" data-to=\"wild-roots\">Wild roots\u003c/a> in a vial. It isn't listed at the table until you've brewed one: someone has to tell you the recipe. It clears one Tithe mark (see \u003ca href=\"#the-tithe\" data-to=\"the-tithe\">The Tithe\u003c/a>). See \u003ca href=\"#potions\" data-to=\"potions\">Potions\u003c/a>.\u003c/p>","src":["shared/alchemy.ts"],"w":false,"r":false},{"s":"tithe-tonics","t":"Tithe Tonics","c":"Quests","i":"📜","sum":"Act 1 from Alchemist Moss.","a":[],"ib":[["Part of","Act 1"],["Given by","Alchemist Moss"],["Where","at the Mages' Guild, south-west of town"],["Steps","3"]],"h":"\u003cp>\u003cb>Tithe Tonics\u003c/b> is part of the Act 1 from \u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">Alchemist Moss\u003c/a>, found at the Mages' Guild, south-west of town.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#oath-of-the-flame\" data-to=\"oath-of-the-flame\">Oath of the Flame\u003c/a>, \u003ca href=\"#a-drop-of-something\" data-to=\"a-drop-of-something\">A drop of something\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Alchemist Moss\u003c/li>\u003cli>Brew 5 Tithe tonics (red cap + wild root + a vial)\u003c/li>\u003cli>Bring the tonics to Alchemist Moss\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Rewards:\u003c/b> 50 bronze.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> Ah, an Ember! Just who I need. The Emberhall has ordered a mountain of Tithe tonics, and my hands are full. The recipe's a secret, but you're one of theirs, so: one red cap mushroom and one wild root, in a vial, at the alchemy table. You'll dig both up from the glinting patches. Brew me five. The Emberhall sells them to heroes, to clear their debt faster. Good business, eh? Here are some vials to start you off.\u003c/p>\n\u003cp>\u003cb>Step 3.\u003c/b> Five! Lovely. The Emberhall pays well for these, and so do I. Keep the recipe: it's yours now. Funny, isn't it? They sell the cure for a debt they put on you. Still. Business is business.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"tongs","t":"Tongs","c":"Items","i":"🛠️","sum":"A tool for Smelting.","a":[],"ib":[["Helps","Smelting"],["Effect","Fewer failures"]],"h":"\u003cp>The tongs helps \u003ca href=\"#smelting\" data-to=\"smelting\">Smelting\u003c/a>: your tries fail less often. Better metal and better wood make it stronger and last longer. See \u003ca href=\"#tools\" data-to=\"tools\">Tools\u003c/a> for every metal and wood. Smiths make them at the anvil with \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>.\u003c/p>","src":["shared/tools.ts"],"w":false,"r":false},{"s":"tools","t":"Tools","c":"Items","i":"🪓","sum":"Axes, pickaxes, shovels, rods, hammers, tongs and pots.","a":[],"ib":[],"h":"\u003cp>A tool is a metal head (or none, for a rod) on a wooden handle. Gathering tools make you faster; crafting tools make your tries work more often. Every use wears it down a little; Repairer Oswin or the \u003ca href=\"#mend\" data-to=\"mend\">Mend\u003c/a> spell fixes it.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tool\u003c/th>\u003cth>Helps\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#axe\" data-to=\"axe\">Axe\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a>\u003c/td>\u003ctd>Faster gathering\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Pickaxe\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a>\u003c/td>\u003ctd>Faster gathering\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#shovel\" data-to=\"shovel\">Shovel\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a>\u003c/td>\u003ctd>Faster gathering\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#fishing-rod\" data-to=\"fishing-rod\">Fishing rod\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a>\u003c/td>\u003ctd>Faster gathering\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#hammer\" data-to=\"hammer\">Hammer\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>\u003c/td>\u003ctd>Fewer failed tries\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#tongs\" data-to=\"tongs\">Tongs\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#smelting\" data-to=\"smelting\">Smelting\u003c/a>\u003c/td>\u003ctd>Fewer failed tries\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#pot\" data-to=\"pot\">Pot\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>\u003c/td>\u003ctd>Fewer failed tries\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Without the right gathering tool, gathering takes 3 times as long.\u003c/p>\n\u003ch2 id=\"s-metals\">Metals\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Metal\u003c/th>\u003cth>Level\u003c/th>\u003cth>Bonus\u003c/th>\u003cth>Uses\u003c/th>\u003cth>Smelted from\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#bronze-bar\" data-to=\"bronze-bar\">Bronze bar\u003c/a>\u003c/td>\u003ctd>1\u003c/td>\u003ctd>5%\u003c/td>\u003ctd>150\u003c/td>\u003ctd>\u003ca href=\"#copper-ore\" data-to=\"copper-ore\">Copper ore\u003c/a> + \u003ca href=\"#tin-ore\" data-to=\"tin-ore\">Tin ore\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#iron-bar\" data-to=\"iron-bar\">Iron bar\u003c/a>\u003c/td>\u003ctd>15\u003c/td>\u003ctd>10%\u003c/td>\u003ctd>300\u003c/td>\u003ctd>\u003ca href=\"#iron-ore\" data-to=\"iron-ore\">Iron ore\u003c/a> + \u003ca href=\"#iron-ore\" data-to=\"iron-ore\">Iron ore\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#steel-bar\" data-to=\"steel-bar\">Steel bar\u003c/a>\u003c/td>\u003ctd>30\u003c/td>\u003ctd>15%\u003c/td>\u003ctd>500\u003c/td>\u003ctd>\u003ca href=\"#iron-ore\" data-to=\"iron-ore\">Iron ore\u003c/a> + \u003ca href=\"#coal\" data-to=\"coal\">Coal\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#mithril-bar\" data-to=\"mithril-bar\">Mithril bar\u003c/a>\u003c/td>\u003ctd>60\u003c/td>\u003ctd>25%\u003c/td>\u003ctd>900\u003c/td>\u003ctd>\u003ca href=\"#mithril-ore\" data-to=\"mithril-ore\">Mithril ore\u003c/a> + \u003ca href=\"#coal\" data-to=\"coal\">Coal\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-woods-handles\">Woods (handles)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Wood\u003c/th>\u003cth>Bonus\u003c/th>\u003cth>Lasts\u003c/th>\u003cth>Handicraft level\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>\u003c/td>\u003ctd>5%\u003c/td>\u003ctd>×1\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#oak-logs\" data-to=\"oak-logs\">Oak logs\u003c/a>\u003c/td>\u003ctd>7%\u003c/td>\u003ctd>×1.15\u003c/td>\u003ctd>8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#birch-logs\" data-to=\"birch-logs\">Birch logs\u003c/a>\u003c/td>\u003ctd>9%\u003c/td>\u003ctd>×1.3\u003c/td>\u003ctd>16\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#maple-logs\" data-to=\"maple-logs\">Maple logs\u003c/a>\u003c/td>\u003ctd>12%\u003c/td>\u003ctd>×1.5\u003c/td>\u003ctd>25\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#yew-logs\" data-to=\"yew-logs\">Yew logs\u003c/a>\u003c/td>\u003ctd>15%\u003c/td>\u003ctd>×1.75\u003c/td>\u003ctd>35\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#ironwood-logs\" data-to=\"ironwood-logs\">Ironwood logs\u003c/a>\u003c/td>\u003ctd>20%\u003c/td>\u003ctd>×2.1\u003c/td>\u003ctd>50\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#elderwood-logs\" data-to=\"elderwood-logs\">Elderwood logs\u003c/a>\u003c/td>\u003ctd>25%\u003c/td>\u003ctd>×2.5\u003c/td>\u003ctd>65\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/tools.ts"],"w":false,"r":false},{"s":"trading","t":"Trading","c":"Skills","i":"💰","sum":"Trained by selling things to any shop (the more it's worth, the more XP). Each level makes prices a little better, and trainers sell you rarer things as it goes up.","a":[],"ib":[["Discipline","🤝 Charisma"],["Taught by","\u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>"],["Max level","99"]],"h":"\u003cp>💰 \u003cb>Trading\u003c/b> is a skill in \u003ca href=\"#charisma\" data-to=\"charisma\">Charisma\u003c/a>. Trained by selling things to any shop (the more it's worth, the more XP). Each level makes prices a little better, and trainers sell you rarer things as it goes up.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#buying-and-selling\" data-to=\"buying-and-selling\">Buying and selling\u003c/a>, from \u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>📖 Quick learner\u003c/td>\u003ctd>10% more XP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"trial-marks","t":"Trial marks","c":"Mechanics","i":"🔥","sum":"","a":["Ranks"],"ib":[],"h":"\u003cp>The game today has these ranks: Hopeful, Ember, Flame. Ember and Flame wear coloured cloaks. In the lore, these become trial marks: Ember, Flame, Blaze and Radiant (see \u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a>).\u003c/p>","src":["shared/story.ts"],"w":false,"r":false},{"s":"trout","t":"Trout","c":"Items","i":"🐟","sum":"Fish. Sells for 5 bronze.","a":[],"ib":[["Kind","Fish"],["Shop pays","5 bronze"],["Game id","\u003ccode>trout\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a> level 5 from a trout spot (4 XP each).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (fish): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"truffles","t":"Truffles","c":"Items","i":"🟤","sum":"Herbs, roots and crop. Sells for 30 bronze.","a":["truffle"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","30 bronze"],["Game id","\u003ccode>truffle\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dug up with \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> level 15 (14 XP).\u003c/li>\u003cli>Sold by \u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a> once your \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a> is 35.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (vegetables): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"tuna","t":"Tuna","c":"Items","i":"🐡","sum":"Fish. Sells for 40 bronze.","a":[],"ib":[["Kind","Fish"],["Shop pays","40 bronze"],["Game id","\u003ccode>tuna\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a> level 45 from a tuna spot (24 XP each).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (fish): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"two-handed-sword","t":"Two-handed sword","c":"Items","i":"⚔️","sum":"A melee weapon.","a":[],"ib":[["Style","Melee"],["Level","20"],["Biggest hit","8 + metal"],["Attacks every","3.6s"],["Range","1 tile"],["Hands","Two (no shield)"]],"h":"\u003cp>⚔️ The two-handed sword needs \u003ca href=\"#melee\" data-to=\"melee\">Melee\u003c/a> level 20. Its biggest hit is 8, plus its metal's bonus. It attacks every 3.6s and reaches 1 tile. It takes both hands, so no shield. See \u003ca href=\"#weapons\" data-to=\"weapons\">Weapons\u003c/a> and \u003ca href=\"#combat\" data-to=\"combat\">Combat\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"venom-sacs","t":"Venom sacs","c":"Items","i":"🧪","sum":"Monster drop. Sells for 35 bronze.","a":["venom sac"],"ib":[["Kind","Monster drops"],["Shop pays","35 bronze"],["Game id","\u003ccode>venom_sac\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#cave-spider\" data-to=\"cave-spider\">Cave spider\u003c/a> (30%).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Half of the recipe for the \u003ca href=\"#ember-trap-potion\" data-to=\"ember-tr
