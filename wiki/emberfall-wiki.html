03cp>Sable was once the Emberguard's brightest champion, and was meant to be one of \u003ca href=\"#the-extinguished\" data-to=\"the-extinguished\">The Extinguished\u003c/a>. At her \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a> in year 460 she was drained, and survived: the only one who ever has. She founded the Ashbound. The empty plinth in the Emberhall, with the scratched-off name, was hers.\u003c/p>\u003c/div>\n\u003cp>Not in the game yet.\u003c/p>","src":["wiki/pages/person-sable.md"],"w":true,"r":false},{"s":"sage","t":"Sage","c":"Items","i":"🌿","sum":"Herbs, roots and crop. Sells for 4 bronze.","a":["sprig of sage"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","4 bronze"],["Game id","\u003ccode>sage\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dug up with \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> level 5 (5 XP).\u003c/li>\u003cli>Sold by \u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a> once your \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a> is 6.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Half of the recipe for the \u003ca href=\"#strength-potion\" data-to=\"strength-potion\">Strength potion\u003c/a>.\u003c/li>\u003cli>A bonus third ingredient in \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a>: 30% stronger.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"salmon","t":"Salmon","c":"Items","i":"🐟","sum":"Fish. Sells for 14 bronze.","a":[],"ib":[["Kind","Fish"],["Shop pays","14 bronze"],["Game id","\u003ccode>salmon\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a> level 20 from a salmon spot (10 XP each).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (fish): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"saltmere-coast","t":"Saltmere Coast","c":"Places","i":"⚓","sum":"Harbour town, islands and the best fishing.","a":["Saltmere"],"ib":[["Levels","35 to 50"]],"h":"\u003cp>\u003cb>Saltmere Coast\u003c/b> is the harbour town and islands to the east, with the best fishing. Warden Merrow runs its great shrine (\u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwardens\u003c/a>). Ida of the Saltmere was one of \u003ca href=\"#the-extinguished\" data-to=\"the-extinguished\">The Extinguished\u003c/a>.\u003c/p>\n\u003cp>The Drowned Shrine sank off the coast with its carving: \u003ci>&quot;The shrines shall close when the war is won.&quot;\u003c/i> The glowing fish in its bays are fewer every year.\u003c/p>\n\u003cp>Not in the game yet; the map shows where it will be.\u003c/p>","src":["wiki/pages/saltmere.md"],"w":true,"r":false},{"s":"scrawled-note","t":"Scrawled note","c":"Items","i":"📝","sum":"Dropped by an Ashbound scout on the Westroad.","a":[],"ib":[["Kind","Story items"],["Shop pays","Can't be sold"],["Game id","\u003ccode>ashbound_note\u003c/code>"]],"h":"\u003cp>Dropped by an Ashbound scout on the Westroad.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Given in the quest \u003ca href=\"#ash-on-the-road\" data-to=\"ash-on-the-road\">Ash on the Road\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"seed-potatoes","t":"Seed potatoes","c":"Items","i":"🌱","sum":"Seed. Sells for 1 bronze.","a":["seed potato"],"ib":[["Kind","Seeds"],["Shop pays","1 bronze"],["Game id","\u003ccode>seed_potato\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#something-to-grow\" data-to=\"something-to-grow\">Something to grow\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"shield","t":"Shield","c":"Items","i":"🛡️","sum":"Armor for the offhand slot.","a":[],"ib":[["Slot","offhand"],["Bars to make","2"],["Armor (bronze)","2"]],"h":"\u003cp>🛡️ A shield goes in your offhand slot. A bronze one gives 2 armor and takes 2 bars to make with \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>; better metal multiplies it. Leather and cloth versions are made with \u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a>. See \u003ca href=\"#armor\" data-to=\"armor\">Armor\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"shopkeeper-tam","t":"Shopkeeper Tam","c":"People","i":"💰","sum":"Runs the General Store. Buys anything.","a":[],"ib":[["Found in","The General Store"],["Shop","Yes"],["Game id","\u003ccode>tam\u003c/code>"]],"h":"\u003cp>\u003cb>Shopkeeper Tam\u003c/b> runs \u003ca href=\"#the-general-store\" data-to=\"the-general-store\">The General Store\u003c/a>. Trade routes are closing as the land dies.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>Tam smuggles for \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>, for a price. Their lost cart on the Westroad is full of ash.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;Welcome to the General Store! I'll buy anything you've got, and I sell rods, pots, food and potions.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#the-general-store\" data-to=\"the-general-store\">The General Store\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#buying-and-selling\" data-to=\"buying-and-selling\">Buying and selling\u003c/a> (lessons)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Shop:\u003c/b> buys anything. Sells: \u003ca href=\"#fishing-rod\" data-to=\"fishing-rod\">Pine fishing rod\u003c/a>, \u003ca href=\"#pot\" data-to=\"pot\">Bronze pot\u003c/a>, \u003ca href=\"#cooking\" data-to=\"cooking\">Minnow stew (3 minnow · pine)\u003c/a>, \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>, \u003ca href=\"#potatoes\" data-to=\"potatoes\">Potatoes\u003c/a>, \u003ca href=\"#carrots\" data-to=\"carrots\">Carrots\u003c/a>, \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>. See \u003ca href=\"#shops\" data-to=\"shops\">Shops\u003c/a>.\u003c/p>","src":["wiki/pages/person-tam.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"shops","t":"Shops","c":"Mechanics","i":"💰","sum":"Who sells what.","a":[],"ib":[],"h":"\u003cp>Trainers run little shops. A shop sells for 3 times what it pays, so buying to sell again always loses. \u003ca href=\"#charisma\" data-to=\"charisma\">Charisma\u003c/a> and \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a> make prices better both ways.\u003c/p>\n\u003ch2 id=\"s-general-store\">\u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">💰 General Store\u003c/a>\u003c/h2>\n\u003cp>Buys: anything.\u003c/p>\n\u003cp>Sells: \u003ca href=\"#fishing-rod\" data-to=\"fishing-rod\">Pine fishing rod\u003c/a>, \u003ca href=\"#pot\" data-to=\"pot\">Bronze pot\u003c/a>, \u003ca href=\"#cooking\" data-to=\"cooking\">Minnow stew (3 minnow · pine)\u003c/a>, \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>, \u003ca href=\"#potatoes\" data-to=\"potatoes\">Potatoes\u003c/a>, \u003ca href=\"#carrots\" data-to=\"carrots\">Carrots\u003c/a>, \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-forester-holt\">\u003ca href=\"#forester-holt\" data-to=\"forester-holt\">🪓 Forester Holt\u003c/a>\u003c/h2>\n\u003cp>Buys: logs and axes.\u003c/p>\n\u003cp>Sells: \u003ca href=\"#axe\" data-to=\"axe\">Bronze axe (Pine)\u003c/a>, \u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>, \u003ca href=\"#oak-logs\" data-to=\"oak-logs\">Oak logs\u003c/a>, \u003ca href=\"#birch-logs\" data-to=\"birch-logs\">Birch logs\u003c/a>, \u003ca href=\"#maple-logs\" data-to=\"maple-logs\">Maple logs\u003c/a>, \u003ca href=\"#yew-logs\" data-to=\"yew-logs\">Yew logs\u003c/a>, \u003ca href=\"#ironwood-logs\" data-to=\"ironwood-logs\">Ironwood logs\u003c/a>, \u003ca href=\"#elderwood-logs\" data-to=\"elderwood-logs\">Elderwood logs\u003c/a>.\u003c/p>\n\u003cp>With more Trading: \u003ca href=\"#axe\" data-to=\"axe\">Iron axe (Oak)\u003c/a> (10), \u003ca href=\"#axe\" data-to=\"axe\">Steel axe (Maple)\u003c/a> (25), \u003ca href=\"#axe\" data-to=\"axe\">Mithril axe (Yew)\u003c/a> (40).\u003c/p>\n\u003ch2 id=\"s-miner-greta\">\u003ca href=\"#miner-greta\" data-to=\"miner-greta\">⛏️ Miner Greta\u003c/a>\u003c/h2>\n\u003cp>Buys: ore and pickaxes.\u003c/p>\n\u003cp>Sells: \u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Bronze pickaxe (Pine)\u003c/a>, \u003ca href=\"#copper-ore\" data-to=\"copper-ore\">Copper ore\u003c/a>, \u003ca href=\"#tin-ore\" data-to=\"tin-ore\">Tin ore\u003c/a>, \u003ca href=\"#iron-ore\" data-to=\"iron-ore\">Iron ore\u003c/a>, \u003ca href=\"#coal\" data-to=\"coal\">Coal\u003c/a>, \u003ca href=\"#silver-ore\" data-to=\"silver-ore\">Silver ore\u003c/a>, \u003ca href=\"#gold-ore\" data-to=\"gold-ore\">Gold ore\u003c/a>, \u003ca href=\"#platinum-ore\" data-to=\"platinum-ore\">Platinum ore\u003c/a>, \u003ca href=\"#iridium-ore\" data-to=\"iridium-ore\">Iridium ore\u003c/a>, \u003ca href=\"#mithril-ore\" data-to=\"mithril-ore\">Mithril ore\u003c/a>.\u003c/p>\n\u003cp>With more Trading: \u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Iron pickaxe (Oak)\u003c/a> (10), \u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Steel pickaxe (Maple)\u003c/a> (25), \u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Mithril pickaxe (Yew)\u003c/a> (40).\u003c/p>\n\u003ch2 id=\"s-smith-brann\">\u003ca href=\"#smith-brann\" data-to=\"smith-brann\">🔨 Smith Brann\u003c/a>\u003c/h2>\n\u003cp>Buys: bars, tools, weapons and armor.\u003c/p>\n\u003cp>Sells: \u003ca href=\"#hammer\" data-to=\"hammer\">Bronze hammer (Pine)\u003c/a>, \u003ca href=\"#tongs\" data-to=\"tongs\">Bronze tongs\u003c/a>, \u003ca href=\"#bronze-bar\" data-to=\"bronze-bar\">Bronze bar\u003c/a>, \u003ca href=\"#iron-bar\" data-to=\"iron-bar\">Iron bar\u003c/a>, \u003ca href=\"#steel-bar\" data-to=\"steel-bar\">Steel bar\u003c/a>, \u003ca href=\"#mithril-bar\" data-to=\"mithril-bar\">Mithril bar\u003c/a>.\u003c/p>\n\u003cp>With more Trading: \u003ca href=\"#silver-bar\" data-to=\"silver-bar\">Silver bar\u003c/a> (8), \u003ca href=\"#sword\" data-to=\"sword\">Iron sword (Oak)\u003c/a> (12), \u003ca href=\"#gold-bar\" data-to=\"gold-bar\">Gold bar\u003c/a> (20), \u003ca href=\"#platebody\" data-to=\"platebody\">Steel platebody\u003c/a> (30).\u003c/p>\n\u003ch2 id=\"s-woodworker-rook\">\u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">🪚 Woodworker Rook\u003c/a>\u003c/h2>\n\u003cp>Buys: bait, worms, feathers, hides, silk, leather, cloth, arrows, bows, staffs and leather or cloth armor.\u003c/p>\n\u003cp>Sells: \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>, \u003ca href=\"#feathers\" data-to=\"feathers\">Feathers\u003c/a>, \u003ca href=\"#thread\" data-to=\"thread\">Thread\u003c/a>.\u003c/p>\n\u003cp>With more Trading: \u003ca href=\"#leather\" data-to=\"leather\">Leather\u003c/a> (8), \u003ca href=\"#arrows\" data-to=\"arrows\">Iron arrows\u003c/a> (12), \u003ca href=\"#bow\" data-to=\"bow\">Maple bow\u003c/a> (25), \u003ca href=\"#staff\" data-to=\"staff\">Yew staff\u003c/a> (35).\u003c/p>\n\u003ch2 id=\"s-huntmaster-kael\">\u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">🏹 Huntmaster Kael\u003c/a>\u003c/h2>\n\u003cp>Buys: weapons, armor and monster drops.\u003c/p>\n\u003cp>Sells: \u003ca href=\"#dagger\" data-to=\"dagger\">Bronze dagger (Pine)\u003c/a>, \u003ca href=\"#sling\" data-to=\"sling\">Bronze sling (Pine)\u003c/a>, \u003ca href=\"#staff\" data-to=\"staff\">Pine staff\u003c/a>, \u003ca href=\"#bow\" data-to=\"bow\">Pine bow\u003c/a>, \u003ca href=\"#arrows\" data-to=\"arrows\">Bronze arrows\u003c/a>, \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>.\u003c/p>\n\u003cp>With more Trading: \u003ca href=\"#sword\" data-to=\"sword\">Bronze sword (Oak)\u003c/a> (5), \u003ca href=\"#arrows\" data-to=\"arrows\">Bronze arrows\u003c/a> (10), \u003ca href=\"#platelegs\" data-to=\"platelegs\">Iron platelegs\u003c/a> (18).\u003c/p>\n\u003ch2 id=\"s-captain-bryn\">\u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">⚔️ Captain Bryn\u003c/a>\u003c/h2>\n\u003cp>Buys: monster drops.\u003c/p>\n\u003cp>Sells: \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-farmer-odo\">\u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">🌾 Farmer Odo\u003c/a>\u003c/h2>\n\u003cp>Buys: seeds, potatoes, carrots, onions and wheat.\u003c/p>\n\u003cp>Sells: \u003ca href=\"#seed-potatoes\" data-to=\"seed-potatoes\">Seed potatoes\u003c/a>, \u003ca href=\"#carrot-seeds\" data-to=\"carrot-seeds\">Carrot seeds\u003c/a>, \u003ca href=\"#onion-sets\" data-to=\"onion-sets\">Onion sets\u003c/a>, \u003ca href=\"#wheat-seeds\" data-to=\"wheat-seeds\">Wheat seeds\u003c/a>, \u003ca href=\"#ginseng-seeds\" data-to=\"ginseng-seeds\">Ginseng seeds\u003c/a>, \u003ca href=\"#blue-lotus-seeds\" data-to=\"blue-lotus-seeds\">Blue lotus seeds\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-herbalist-wren\">\u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">🌱 Herbalist Wren\u003c/a>\u003c/h2>\n\u003cp>Buys: roots, herbs, mushrooms, worms and shovels.\u003c/p>\n\u003cp>Sells: \u003ca href=\"#shovel\" data-to=\"shovel\">Bronze shovel (Pine)\u003c/a>, \u003ca href=\"#wild-roots\" data-to=\"wild-roots\">Wild roots\u003c/a>.\u003c/p>\n\u003cp>With more Trading: \u003ca href=\"#sage\" data-to=\"sage\">Sage\u003c/a> (6), \u003ca href=\"#shovel\" data-to=\"shovel\">Iron shovel (Oak)\u003c/a> (12), \u003ca href=\"#ginseng-roots\" data-to=\"ginseng-roots\">Ginseng roots\u003c/a> (20), \u003ca href=\"#truffles\" data-to=\"truffles\">Truffles\u003c/a> (35).\u003c/p>\n\u003ch2 id=\"s-alchemist-moss\">\u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">⚗️ Alchemist Moss\u003c/a>\u003c/h2>\n\u003cp>Buys: potions, vials, herbs, monster parts and spell books.\u003c/p>\n\u003cp>Sells: \u003ca href=\"#empty-vials\" data-to=\"empty-vials\">Empty vials\u003c/a>, \u003ca href=\"#spell-book-haste\" data-to=\"spell-book-haste\">Spell book: Haste\u003c/a>, \u003ca href=\"#spell-book-frost-nova\" data-to=\"spell-book-frost-nova\">Spell book: Frost nova\u003c/a>.\u003c/p>","src":["shared/shops.ts","shared/crafting.ts"],"w":false,"r":false},{"s":"shovel","t":"Shovel","c":"Items","i":"🛠️","sum":"A tool for Foraging.","a":[],"ib":[["Helps","Foraging"],["Effect","Faster"]],"h":"\u003cp>The shovel helps \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a>: you gather faster. Better metal and better wood make it stronger and last longer. See \u003ca href=\"#tools\" data-to=\"tools\">Tools\u003c/a> for every metal and wood. Smiths make them at the anvil with \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>.\u003c/p>","src":["shared/tools.ts"],"w":false,"r":false},{"s":"shrine-totems","t":"Shrine totems","c":"Items","i":"🗿","sum":"Carved from oak by Woodworker Rook, for an Emberguard shrine. Something rattles inside.","a":["shrine totem"],"ib":[["Kind","Story items"],["Shop pays","Can't be sold"],["Game id","\u003ccode>shrine_totem\u003c/code>"]],"h":"\u003cp>Carved from oak by Woodworker Rook, for an Emberguard shrine. Something rattles inside.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Given in the quest \u003ca href=\"#the-totem\" data-to=\"the-totem\">The Totem\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#rebuild-the-shrine\" data-to=\"rebuild-the-shrine\">Rebuild the Shrine\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"side-quests","t":"Side quests","c":"Story","i":"🗺️","sum":"The planned quests that reveal the story, a piece at a time. None are built yet.","a":["Planned quests","Planned side quests"],"ib":[],"h":"\u003cp>These are planned, not built. (Built quests are on \u003ca href=\"#quests\" data-to=\"quests\">Quests\u003c/a>.) None are needed to finish the main story; each hands over one small piece of the truth, so a player who does them all can piece it together before the big reveals.\u003c/p>\n\u003ch2 id=\"s-new-main-quests\">New main quests\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Quest\u003c/th>\u003cth>Giver\u003c/th>\u003cth>What you do\u003c/th>\u003cth>What it reveals\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1.13\u003c/td>\u003ctd>A Story for Children\u003c/td>\u003ctd>\u003ca href=\"#sister-lisette\" data-to=\"sister-lisette\">Sister Lisette\u003c/a>\u003c/td>\u003ctd>Read &quot;A Child's Book of the Emberborn&quot; aloud to the town children.\u003c/td>\u003ctd>The official Emberfall story. It leaves out who was there.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2B.8\u003c/td>\u003ctd>The Old Shaft\u003c/td>\u003ctd>\u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>\u003c/td>\u003ctd>Find a huge scorched shaft deep in the Crystal Cave.\u003c/td>\u003ctd>🧩 Echo: robed mages chanting around a pit of fire.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2D.8\u003c/td>\u003ctd>Brightcrown's Coin\u003c/td>\u003ctd>\u003ca href=\"#archmage-rowan\" data-to=\"archmage-rowan\">Archmage Rowan\u003c/a>\u003c/td>\u003ctd>Dig up Old Kingdom coins in the Barrens.\u003c/td>\u003ctd>The first hint of the Ember Seed and the Ember Crown.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2D.9\u003c/td>\u003ctd>The Circle's Mark\u003c/td>\u003ctd>Archmage Rowan\u003c/td>\u003ctd>Copy a ring-of-fire mark from a ruined mage tower.\u003c/td>\u003ctd>It's carved over the Emberhall's front door.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3.16\u003c/td>\u003ctd>The Torn Page\u003c/td>\u003ctd>Sister Lisette\u003c/td>\u003ctd>Find who cut a page from the oldest book in the library.\u003c/td>\u003ctd>The true account of the Emberfall, with the Circle's names. Vale's is first.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4A.19 / 4B.19\u003c/td>\u003ctd>The Heartbeat\u003c/td>\u003ctd>\u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a> or Vale\u003c/td>\u003ctd>🎬 Put your hand in the Emberheart and feel it beat.\u003c/td>\u003ctd>The land is dying, and how fast.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>E.1\u003c/td>\u003ctd>The Ember Seed\u003c/td>\u003ctd>\u003ca href=\"#sable\" data-to=\"sable\">Sable\u003c/a> or Vale\u003c/td>\u003ctd>Follow the coins' clues into the Crown Vault.\u003c/td>\u003ctd>Both sides want the Seed.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-emberhold-and-heartvale-levels-1-to-20\">Emberhold and Heartvale (levels 1 to 20)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Quest\u003c/th>\u003cth>Giver\u003c/th>\u003cth>What you do\u003c/th>\u003cth>Skills\u003c/th>\u003cth>What it reveals\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>The Warm Well\u003c/td>\u003ctd>\u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">Captain Bryn\u003c/a>\u003c/td>\u003ctd>Fish a glowing minnow out of the square's well.\u003c/td>\u003ctd>Fishing\u003c/td>\u003ctd>The well is heated from below.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Brann's Coal\u003c/td>\u003ctd>\u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a>\u003c/td>\u003ctd>Bring fuel from three kinds of wood for his 500-year-old coal.\u003c/td>\u003ctd>Woodcutting, Smithing\u003c/td>\u003ctd>The coal is an Emberfall shard.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Odo's Old Seed\u003c/td>\u003ctd>\u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>\u003c/td>\u003ctd>Plant one seed from Odo's jar. It glows at dusk.\u003c/td>\u003ctd>Farming\u003c/td>\u003ctd>Before the shrines, the whole land grew like this.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lanterns for the Dead\u003c/td>\u003ctd>\u003ca href=\"#sister-wynne\" data-to=\"sister-wynne\">Sister Wynne\u003c/a>\u003c/td>\u003ctd>Leave a lit lantern at each statue of the Extinguished. Orla's keeps going out.\u003c/td>\u003ctd>Walking, night\u003c/td>\u003ctd>Orla's spark isn't resting.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Night Key\u003c/td>\u003ctd>\u003ca href=\"#brother-tomas\" data-to=\"brother-tomas\">Brother Tomas\u003c/a>\u003c/td>\u003ctd>Wait in the dark hall to see who goes into the ledger room.\u003c/td>\u003ctd>Sneaking (night)\u003c/td>\u003ctd>You glimpse Enchanter Vale with the ledger.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ask the Totem\u003c/td>\u003ctd>\u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>\u003c/td>\u003ctd>Carve a small totem; learn to hide a note in the base.\u003c/td>\u003ctd>Handicraft\u003c/td>\u003ctd>How the Ashbound send messages.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Scratched Name\u003c/td>\u003ctd>\u003ca href=\"#brother-oren\" data-to=\"brother-oren\">Brother Oren\u003c/a>\u003c/td>\u003ctd>Clean the empty plinth. One letter is left: S.\u003c/td>\u003ctd>Talking, Handicraft\u003c/td>\u003ctd>The plinth was Sable's.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tam's Missing Cart\u003c/td>\u003ctd>\u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>\u003c/td>\u003ctd>Find Tam's lost cart on the Westroad. The crates are full of ash.\u003c/td>\u003ctd>Exploring, Hunting\u003c/td>\u003ctd>Tam deals with the Ashbound.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mending Costs\u003c/td>\u003ctd>\u003ca href=\"#repairer-oswin\" data-to=\"repairer-oswin\">Repairer Oswin\u003c/a>\u003c/td>\u003ctd>Repair an old lantern with Maren's note inside.\u003c/td>\u003ctd>Repair, Handicraft\u003c/td>\u003ctd>Maren did something to herself long ago.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A Grey Fox\u003c/td>\u003ctd>\u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>\u003c/td>\u003ctd>Track a Blighted fox to its den, right under a shrine.\u003c/td>\u003ctd>Hunting, Combat\u003c/td>\u003ctd>The Blight starts at the shrines.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-the-thornwood-levels-15-to-30\">The Thornwood (levels 15 to 30)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Quest\u003c/th>\u003cth>Giver\u003c/th>\u003cth>What you do\u003c/th>\u003cth>Skills\u003c/th>\u003cth>What it reveals\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>When the Woods Glowed\u003c/td>\u003ctd>\u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>\u003c/td>\u003ctd>Protect the last glowing tree from Blighted boars.\u003c/td>\u003ctd>Woodcutting, Combat\u003c/td>\u003ctd>The Dark Forest is what's left when the ember is gone.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Wren's Dark Map\u003c/td>\u003ctd>\u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a>\u003c/td>\u003ctd>Mark the Dark Forest's edge, then again a week later.\u003c/td>\u003ctd>Foraging\u003c/td>\u003ctd>It's spreading toward Emberhold.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Ghost Who Counts\u003c/td>\u003ctd>A ghost in the Graveyard\u003c/td>\u003ctd>Bring a token from Halric's statue.\u003c/td>\u003ctd>Spellcasting, Talking\u003c/td>\u003ctd>The Extinguished weren't honoured, they were drained.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Spider's Hoard\u003c/td>\u003ctd>Huntmaster Kael\u003c/td>\u003ctd>Take back the glowing stones the Thornmother's young stole.\u003c/td>\u003ctd>Combat, Mining\u003c/td>\u003ctd>Blighted creatures are starving for ember.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rhys's Lucky Stone\u003c/td>\u003ctd>\u003ca href=\"#rhys\" data-to=\"rhys\">Rhys\u003c/a>\u003c/td>\u003ctd>Find the stone Rhys woke up holding.\u003c/td>\u003ctd>Exploring\u003c/td>\u003ctd>Every Emberborn's pebble is their thread's anchor.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-greyspine-peaks-levels-25-to-40\">Greyspine Peaks (levels 25 to 40)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Quest\u003c/th>\u003cth>Giver\u003c/th>\u003cth>What you do\u003c/th>\u003cth>Skills\u003c/th>\u003cth>What it reveals\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>The Heartbeat in the Rock\u003c/td>\u003ctd>Miner Greta\u003c/td>\u003ctd>Mine deep in the Crystal Cave and count the slow thumps.\u003c/td>\u003ctd>Mining\u003c/td>\u003ctd>It's slower than when Greta was a girl.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Goblin Songs\u003c/td>\u003ctd>A goblin elder\u003c/td>\u003ctd>Trade food to learn the goblins' song.\u003c/td>\u003ctd>Cooking, Trading\u003c/td>\u003ctd>It's a Hearthwise song.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Flint's Books\u003c/td>\u003ctd>Warden Flint\u003c/td>\u003ctd>Do Flint's accounts.\u003c/td>\u003ctd>Trading\u003c/td>\u003ctd>Far more ember goes to the Emberhall than it could ever use.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Cold Climber\u003c/td>\u003ctd>A frozen body\u003c/td>\u003ctd>Find a frozen climber's journal.\u003c/td>\u003ctd>Exploring, Alchemy\u003c/td>\u003ctd>The land is going cold from the edges in.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-saltmere-coast-levels-35-to-50\">Saltmere Coast (levels 35 to 50)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Quest\u003c/th>\u003cth>Giver\u003c/th>\u003cth>What you do\u003c/th>\u003cth>Skills\u003c/th>\u003cth>What it reveals\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Ida's Shield\u003c/td>\u003ctd>Ida's last grandchild\u003c/td>\u003ctd>Find Ida's shield in a wreck offshore.\u003c/td>\u003ctd>Sailing, Fishing\u003c/td>\u003ctd>Her family never got a body.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Glowing Shoals\u003c/td>\u003ctd>A fisher child\u003c/td>\u003ctd>Count the glowing fish in three bays.\u003c/td>\u003ctd>Fishing\u003c/td>\u003ctd>The sea's ember is fading too.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Lighthouse Keeper\u003c/td>\u003ctd>An old lighthouse keeper\u003c/td>\u003ctd>Fix the lens, cut from an Emberfall shard.\u003c/td>\u003ctd>Smithing, Handicraft\u003c/td>\u003ctd>Shards can make light without draining anything.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Merrow's Leftovers\u003c/td>\u003ctd>\u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">Alchemist Moss\u003c/a>\u003c/td>\u003ctd>Taste-test the leftovers from Merrow's feast.\u003c/td>\u003ctd>Cooking, Alchemy\u003c/td>\u003ctd>The Emberwardens collect anything with ember in it.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-the-ashen-barrens-levels-45-to-60\">The Ashen Barrens (levels 45 to 60)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Quest\u003c/th>\u003cth>Giver\u003c/th>\u003cth>What you do\u003c/th>\u003cth>Skills\u003c/th>\u003cth>What it reveals\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>The King's Road\u003c/td>\u003ctd>\u003ca href=\"#tamsin\" data-to=\"tamsin\">Tamsin\u003c/a>\u003c/td>\u003ctd>Follow the Old Kingdom's road to a broken milestone.\u003c/td>\u003ctd>Exploring\u003c/td>\u003ctd>Where the capital stood.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Aldemar's Statue\u003c/td>\u003ctd>Archmage Rowan\u003c/td>\u003ctd>Dig out a king's statue holding a glowing crown.\u003c/td>\u003ctd>Foraging, Mining\u003c/td>\u003ctd>The Ember Crown was real.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ashbound Hearth\u003c/td>\u003ctd>Sable\u003c/td>\u003ctd>Build a hearth that burns without a shrine.\u003c/td>\u003ctd>Woodcutting, Handicraft\u003c/td>\u003ctd>The Ashbound live the Hearthwise way.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tilda's Cairns\u003c/td>\u003ctd>A Barrens nomad\u003c/td>\u003ctd>Follow Tilda Ashwalker's stone piles.\u003c/td>\u003ctd>Exploring, Hunting\u003c/td>\u003ctd>Her last cairn says &quot;Don't go down the stair.&quot;\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-frostfell-and-the-endgame-levels-55\">Frostfell and the endgame (levels 55+)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Quest\u003c/th>\u003cth>Giver\u003c/th>\u003cth>What you do\u003c/th>\u003cth>Skills\u003c/th>\u003cth>What it reveals\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>The Frozen Shrine\u003c/td>\u003ctd>An old trapper\u003c/td>\u003ctd>Thaw the oldest shrine enough to read its plaque.\u003c/td>\u003ctd>Spellcasting, surviving\u003c/td>\u003ctd>Signed by the whole Ember Circle, Vale's name first.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Orla's Rest\u003c/td>\u003ctd>Sister Wynne\u003c/td>\u003ctd>Free Orla's spark from an old gem.\u003c/td>\u003ctd>Spellcasting, Enchanting\u003c/td>\u003ctd>Drained sparks can be set free.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Seed Coin\u003c/td>\u003ctd>Shopkeeper Tam\u003c/td>\u003ctd>Buy a strange warm coin.\u003c/td>\u003ctd>Trading\u003c/td>\u003ctd>It points to the Crown Vault, and the Ember Seed.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Maren's First Day\u003c/td>\u003ctd>Old Maren\u003c/td>\u003ctd>Walk with Maren to where she first woke.\u003c/td>\u003ctd>Walking, Fishing\u003c/td>\u003ctd>🧩 Echo: Vale was there, young, smiling, already old inside.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["wiki/pages/planned-quests.md"],"w":true,"r":false},{"s":"silver-bar","t":"Silver bar","c":"Items","i":"🧈","sum":"Bar. Sells for 75 bronze.","a":[],"ib":[["Kind","Bars"],["Shop pays","75 bronze"],["Game id","\u003ccode>silver_bar\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#silver-ore\" data-to=\"silver-ore\">Silver ore\u003c/a>, \u003ca href=\"#silver-ore\" data-to=\"silver-ore\">Silver ore\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a> once your \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a> is 8.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"silver-ore","t":"Silver ore","c":"Items","i":"🪨","sum":"Ore. Sells for 30 bronze.","a":[],"ib":[["Kind","Ore"],["Shop pays","30 bronze"],["Game id","\u003ccode>silver_ore\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a> level 40 from a silver rock (20 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#silver-bar\" data-to=\"silver-bar\">Silver bar\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"sister-celene","t":"Sister Celene","c":"People","i":"💚","sum":"The shrine healer. The first face every Emberborn sees.","a":[],"ib":[["Found in","The Emberhall"],["Game id","\u003ccode>celene\u003c/code>"]],"h":"\u003cp>\u003cb>Sister Celene\u003c/b> is the healer at \u003ca href=\"#the-heart-shrine\" data-to=\"the-heart-shrine\">The Heart Shrine\u003c/a>, and the first face every new \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> sees (\u003ca href=\"#awakening\" data-to=\"awakening\">Awakening\u003c/a>). She's \u003ca href=\"#the-rooted\" data-to=\"the-rooted\">Rooted\u003c/a>, honest, and doesn't know the truth. She becomes an ally.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;Bless you. If you're hurt or lost, the shrine always brings you home.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#awakening\" data-to=\"awakening\">Awakening\u003c/a> (Prologue)\u003c/li>\u003cli>\u003ca href=\"#a-blessing\" data-to=\"a-blessing\">A Blessing\u003c/a> (Prologue)\u003c/li>\u003cli>\u003ca href=\"#blessing-the-fields\" data-to=\"blessing-the-fields\">Blessing the Fields\u003c/a> (Act 1)\u003c/li>\u003c/ul>","src":["wiki/pages/person-celene.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"sister-lisette","t":"Sister Lisette","c":"People","i":"📚","sum":"Keeps the Emberhall library.","a":[],"ib":[["Found in","The Emberhall"],["Game id","\u003ccode>lisette\u003c/code>"]],"h":"\u003cp>\u003cb>Sister Lisette\u003c/b> keeps the library in \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a> (see \u003ca href=\"#books-in-the-game\" data-to=\"books-in-the-game\">Books in the game\u003c/a>). Honest. A page was cut from the oldest book in her library, and she wants to know who took it.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;The library is open to every Emberborn. Mind the dust: the oldest books are older than the town.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>.\u003c/p>","src":["wiki/pages/person-lisette.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"sister-wynne","t":"Sister Wynne","c":"People","i":"🛏️","sum":"Keeps the Emberhall's beds.","a":[],"ib":[["Found in","The Emberhall"],["Game id","\u003ccode>wynne\u003c/code>"]],"h":"\u003cp>\u003cb>Sister Wynne\u003c/b> keeps the dormitory in \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>, and explains what happens when you fall and what it costs (\u003ca href=\"#the-tithe\" data-to=\"the-tithe\">The Tithe\u003c/a>). Honest.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;Rest whenever you need to. The Emberhall's doors never close to an Emberborn.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>.\u003c/p>","src":["wiki/pages/person-wynne.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"sleep","t":"Sleep","c":"Spells","i":"💤","sum":"No damage, but the monster falls asleep for 6 seconds: it can't move or attack.","a":[],"ib":[["Spellcasting level","10"],["Mana","12"],["Kind","Bolt (from a staff)"],["Learned from","Levelling up"]],"h":"\u003cp>💤 No damage, but the monster falls asleep for 6 seconds: it can't move or attack.\u003c/p>\n\u003cp>It needs \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a> level 10 and costs 12 mana at Mastery 1 (Mastery lowers the cost).\u003c/p>","src":["shared/combat.ts","shared/spells.ts"],"w":false,"r":false},{"s":"slime","t":"Slime","c":"Monsters","i":"🟢","sum":"A level 2 monster. Fights back if you hit it.","a":[],"ib":[["Level","2"],["Health","8"],["Biggest hit","1"],["Attacks every","3s"],["Temper","Fights back if you hit it"],["Out","Day and night"],["Comes back after","30s"],["Coins","0 to 1 bronze"]],"h":"\u003cp>The \u003cb>Slime\u003c/b> is a level 2 monster with 8 health. Fights back if you hit it.\u003c/p>\n\u003cp>Defeating one gives 2 bonus XP on top of 1 XP per point of damage, plus 4 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>Heartvale, near the lake (2), Heartvale, near the Emberhall (3).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🫧 \u003ca href=\"#slime-goo\" data-to=\"slime-goo\">Slime goo\u003c/a>\u003c/td>\u003ctd>70%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>It also drops 0 to 1 bronze coins.\u003c/p>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"slime-goo","t":"Slime goo","c":"Items","i":"🫧","sum":"Monster drop. Sells for 2 bronze.","a":["blob of slime goo"],"ib":[["Kind","Monster drops"],["Shop pays","2 bronze"],["Game id","\u003ccode>slime_goo\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#slime\" data-to=\"slime\">Slime\u003c/a> (70%).\u003c/li>\u003cli>Given in the quest \u003ca href=\"#a-drop-of-something\" data-to=\"a-drop-of-something\">A drop of something\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Half of the recipe for the \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>.\u003c/li>\u003cli>Half of the recipe for the \u003ca href=\"#restoration-draught\" data-to=\"restoration-draught\">Restoration draught\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"sling","t":"Sling","c":"Items","i":"🪃","sum":"A ranged weapon.","a":[],"ib":[["Style","Ranged"],["Level","1"],["Biggest hit","2 + metal"],["Attacks every","2.4s"],["Range","4 tiles"],["Hands","One"]],"h":"\u003cp>🪃 The sling needs \u003ca href=\"#ranged\" data-to=\"ranged\">Ranged\u003c/a> level 1. Its biggest hit is 2, plus its metal's bonus. It attacks every 2.4s and reaches 4 tiles. See \u003ca href=\"#weapons\" data-to=\"weapons\">Weapons\u003c/a> and \u003ca href=\"#combat\" data-to=\"combat\">Combat\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"smelting","t":"Smelting","c":"Skills","i":"🔥","sum":"Use the furnace in Smith Brann's smithy to turn ore into bars.","a":[],"ib":[["Discipline","🤲 Dexterity"],["Taught by","\u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a>"],["Max level","99"]],"h":"\u003cp>🔥 \u003cb>Smelting\u003c/b> is a skill in \u003ca href=\"#dexterity\" data-to=\"dexterity\">Dexterity\u003c/a>. Use the furnace in Smith Brann's smithy to turn ore into bars.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#hammer-and-fire\" data-to=\"hammer-and-fire\">Hammer and fire\u003c/a>, from \u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🎯 Steady hands\u003c/td>\u003ctd>6% fewer failures\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧈 Extra bar\u003c/td>\u003ctd>4% chance to make an extra one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪶 Light work\u003c/td>\u003ctd>10% chance it costs no stamina\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"smith-brann","t":"Smith Brann","c":"People","i":"🔨","sum":"Teaches Smelting and Smithing. Gruff and honest.","a":[],"ib":[["Found in","Smith Brann's smithy"],["Shop","Yes"],["Game id","\u003ccode>brann\u003c/code>"]],"h":"\u003cp>\u003cb>Smith Brann\u003c/b> teaches \u003ca href=\"#smelting\" data-to=\"smelting\">Smelting\u003c/a> and \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a> in his smithy on Trainer Row. Gruff and honest. His forge coal has burned for 500 years.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The coal is an Emberfall shard that has never gone out: ember lasts if you don't take too much. Later in the story he forges your Severing Blade.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;I buy bars, tools, weapons and armor, and I sell hammers, tongs and bars.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#smith-branns-smithy\" data-to=\"smith-branns-smithy\">Smith Brann's smithy\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#hammer-and-fire\" data-to=\"hammer-and-fire\">Hammer and fire\u003c/a> (lessons)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Shop:\u003c/b> buys bars, tools, weapons and armor. Sells: \u003ca href=\"#hammer\" data-to=\"hammer\">Bronze hammer (Pine)\u003c/a>, \u003ca href=\"#tongs\" data-to=\"tongs\">Bronze tongs\u003c/a>, \u003ca href=\"#bronze-bar\" data-to=\"bronze-bar\">Bronze bar\u003c/a>, \u003ca href=\"#iron-bar\" data-to=\"iron-bar\">Iron bar\u003c/a>, \u003ca href=\"#steel-bar\" data-to=\"steel-bar\">Steel bar\u003c/a>, \u003ca href=\"#mithril-bar\" data-to=\"mithril-bar\">Mithril bar\u003c/a>. With more \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a>: \u003ca href=\"#silver-bar\" data-to=\"silver-bar\">Silver bar\u003c/a> (Trading 8), \u003ca href=\"#sword\" data-to=\"sword\">Iron sword (Oak)\u003c/a> (Trading 12), \u003ca href=\"#gold-bar\" data-to=\"gold-bar\">Gold bar\u003c/a> (Trading 20), \u003ca href=\"#platebody\" data-to=\"platebody\">Steel platebody\u003c/a> (Trading 30). See \u003ca href=\"#shops\" data-to=\"shops\">Shops\u003c/a>.\u003c/p>","src":["wiki/pages/person-brann.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"smith-branns-smithy","t":"Smith Brann's smithy","c":"Places","i":"🏠","sum":"","a":[],"ib":[["Kind","Indoors"],["Danger","Safe"],["Size","13 × 9 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"smithy\">\u003c/figure>\n\u003cp>\u003cb>People here:\u003c/b> \u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Things to use:\u003c/b> Furnace, Anvil.\u003c/p>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"smithing","t":"Smithing","c":"Skills","i":"🔨","sum":"Use the anvil in Smith Brann's smithy to make tools from a metal bar, plus a log.","a":[],"ib":[["Discipline","🤲 Dexterity"],["Taught by","\u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a>"],["Max level","99"]],"h":"\u003cp>🔨 \u003cb>Smithing\u003c/b> is a skill in \u003ca href=\"#dexterity\" data-to=\"dexterity\">Dexterity\u003c/a>. Use the anvil in Smith Brann's smithy to make tools from a metal bar, plus a log.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#hammer-and-fire\" data-to=\"hammer-and-fire\">Hammer and fire\u003c/a>, from \u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🎯 Steady hands\u003c/td>\u003ctd>6% fewer failures\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧰 Tool care\u003c/td>\u003ctd>8% chance your gear doesn't wear\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📖 Quick learner\u003c/td>\u003ctd>10% more XP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"something-to-grow","t":"Something to grow","c":"Quests","i":"📜","sum":"Lessons from Farmer Odo.","a":[],"ib":[["Part of","Lessons"],["Given by","Farmer Odo"],["Where","at the farm: follow the road east, over the river bridge"],["Steps","5"]],"h":"\u003cp>\u003cb>Something to grow\u003c/b> is a lesson from \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>, found at the farm: follow the road east, over the river bridge.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Farmer Odo at the farm \u003ci>(you get: 4 × \u003ca href=\"#seed-potatoes\" data-to=\"seed-potatoes\">Seed potatoes\u003c/a>)\u003c/i>\u003c/li>\u003cli>Get a plot from Farmer Odo (talk to him, then press Get a plot)\u003c/li>\u003cli>Plant 4 seed potatoes in your plot\u003c/li>\u003cli>Harvest your potatoes when they're ripe (about 10 minutes)\u003c/li>\u003cli>Go back to Farmer Odo\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#farming\" data-to=\"farming\">Farming\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#seed-potatoes\" data-to=\"seed-potatoes\">Seed potatoes\u003c/a>, 2 silver.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> Visitors! Not many make it out this far. I'm Odo. I grow things, and I'll teach you to grow them too. That's Farming, part of Endurance. See those fallow lots? Each one can be somebody's plot. A plot starts small, 2 by 2, and I'll let it grow to 6 by 6 if you pay me for the land. Here are 4 seed potatoes. I'll give you your first plot for free: open my shop and press Get a plot.\u003c/p>\n\u003cp>\u003cb>Step 5.\u003c/b> Look at those! Now you're a farmer. Sometimes a harvest gives you a seed back. Better seeds unlock as your Farming goes up: carrots, onions, wheat, and even ginseng and blue lotus for the alchemists. Your crops grow while you're away, and so does your health. When you want more room, come and pay me to make your plot bigger. And for a few gold I can link the chest outside to your enchanted chest at the Mages' Guild. And another thing: the Emberguard will offer you their blessings. Never took one myself. Never will.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"sparks-and-spells","t":"Sparks and spells","c":"Quests","i":"📜","sum":"Lessons from Archmage Rowan.","a":[],"ib":[["Part of","Lessons"],["Given by","Archmage Rowan"],["Where","at the Mages' Guild, south-west of town"],["Steps","7"]],"h":"\u003cp>\u003cb>Sparks and spells\u003c/b> is a lesson from \u003ca href=\"#archmage-rowan\" data-to=\"archmage-rowan\">Archmage Rowan\u003c/a>, found at the Mages' Guild, south-west of town.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#standing-your-ground\" data-to=\"standing-your-ground\">Standing your ground\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Archmage Rowan at the Mages' Guild \u003ci>(you get: \u003ca href=\"#staff\" data-to=\"staff\">Bronze staff (Pine)\u003c/a>)\u003c/i>\u003c/li>\u003cli>Equip the staff\u003c/li>\u003cli>Defeat 2 chickens with Firebolt (hold the staff)\u003c/li>\u003cli>Go back to Archmage Rowan for your reward\u003c/li>\u003cli>Ask Archmage Rowan about the altar \u003ci>(you get: Refined emberstone, 0.5 ct (full))\u003c/i>\u003c/li>\u003cli>Enchant something at the altar (click the altar in the guild)\u003c/li>\u003cli>Show Archmage Rowan your enchantment\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a>, \u003ca href=\"#enchanting\" data-to=\"enchanting\">Enchanting\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#staff\" data-to=\"staff\">Bronze staff (Pine)\u003c/a>, Refined emberstone, 0.5 ct (full), 3.5 silver.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> Welcome to the Mages' Guild. I'll teach you Spellcasting. It's part of Wisdom, which raises your max mana. Spells need a staff in your hand, and they use mana, the blue 🔮 bar under your stamina. Mana comes back on its own, 1 every 6 seconds. Here's a bronze staff. Your spells sit on the spell bar under your gear. Firebolt flies from a staff: hold this one and go defeat 2 chickens with it.\u003c/p>\n\u003cp>\u003cb>Step 4.\u003c/b> A natural! Each spell has its own Mastery, and a staff's metal makes your spells hit harder. You're welcome in the guild now: rent space in our enchanted chest, or take magic jobs from the guild board to rise in rank. Talk to me again any time.\u003c/p>\n\u003cp>\u003cb>Step 5.\u003c/b> You've seen the altar by the door? That's for Enchanting. Ember trap a monster, defeat it, and its ember fills a refined emberstone. The altar pours that ember into a staff, armor or a tool. A staff also takes a cut gem: ruby burns, sapphire chills, emerald poisons, topaz throws lightning and amethyst drinks life. Armor and tools pick their own magic. Here's a small refined emberstone, already full. Enchant something with it: a tool on your belt is a fine start (take it off your belt first, so it's in your bag).\u003c/p>\n\u003cp>\u003cb>Step 7.\u003c/b> Beautiful. Bigger, fuller refined emberstones make stronger magic. Brann cuts emberstone into gems, and the Crystal Cave has plenty. One more thing: once your Spellcasting reaches 18 you'll know Mend, to fix your own gear with a little of what it's made of. The Emberguard do such noble work. They fund half this guild, you know.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"spear","t":"Spear","c":"Items","i":"🔱","sum":"A melee weapon.","a":[],"ib":[["Style","Melee"],["Level","15"],["Biggest hit","5 + metal"],["Attacks every","2.4s"],["Range","2 tiles"],["Hands","One"]],"h":"\u003cp>🔱 The spear needs \u003ca href=\"#melee\" data-to=\"melee\">Melee\u003c/a> level 15. Its biggest hit is 5, plus its metal's bonus. It attacks every 2.4s and reaches 2 tiles. See \u003ca href=\"#weapons\" data-to=\"weapons\">Weapons\u003c/a> and \u003ca href=\"#combat\" data-to=\"combat\">Combat\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"spell-book-frost-nova","t":"Spell book: Frost nova","c":"Items","i":"📘","sum":"Spell book. Sells for 350 bronze.","a":["Frost nova spell book"],"ib":[["Kind","Spell books"],["Shop pays","350 bronze"],["Game id","\u003ccode>book_frost_nova\u003c/code>"]],"h":"\u003cp>Read it to learn the spell \u003ca href=\"#frost-nova\" data-to=\"frost-nova\">Frost nova\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#giant-spider\" data-to=\"giant-spider\">Giant spider\u003c/a> (2%).\u003c/li>\u003cli>Sold by \u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">Alchemist Moss\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"spell-book-haste","t":"Spell book: Haste","c":"Items","i":"📗","sum":"Spell book. Sells for 150 bronze.","a":["Haste spell book"],"ib":[["Kind","Spell books"],["Shop pays","150 bronze"],["Game id","\u003ccode>book_haste\u003c/code>"]],"h":"\u003cp>Read it to learn the spell \u003ca href=\"#haste\" data-to=\"haste\">Haste\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#goblin\" data-to=\"goblin\">Goblin\u003c/a> (2%).\u003c/li>\u003cli>Sold by \u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">Alchemist Moss\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"spell-book-invisibility","t":"Spell book: Invisibility","c":"Items","i":"📘","sum":"Spell book. Sells for 500 bronze.","a":["Invisibility spell book"],"ib":[["Kind","Spell books"],["Shop pays","500 bronze"],["Game id","\u003ccode>book_invisibility\u003c/code>"]],"h":"\u003cp>Read it to learn the spell \u003ca href=\"#invisibility\" data-to=\"invisibility\">Invisibility\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#ashbound-raider\" data-to=\"ashbound-raider\">Ashbound raider\u003c/a> (3%).\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"spellcasting","t":"Spellcasting","c":"Skills","i":"🪄","sum":"Cast spells from your spell bar (bolts fly from a staff in your hand). Spells use mana.","a":[],"ib":[["Discipline","🔮 Wisdom"],["Taught by","\u003ca href=\"#archmage-rowan\" data-to=\"archmage-rowan\">Archmage Rowan\u003c/a>"],["Max level","99"]],"h":"\u003cp>🪄 \u003cb>Spellcasting\u003c/b> is a skill in \u003ca href=\"#wisdom\" data-to=\"wisdom\">Wisdom\u003c/a>. Cast spells from your spell bar (bolts fly from a staff in your hand). Spells use mana.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#sparks-and-spells\" data-to=\"sparks-and-spells\">Sparks and spells\u003c/a>, from \u003ca href=\"#archmage-rowan\" data-to=\"archmage-rowan\">Archmage Rowan\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🎯 Focus\u003c/td>\u003ctd>hit 2% more often\u003c/td>\u003c/tr>\u003ctr>\u003ctd>💥 Power\u003c/td>\u003ctd>hit 5% harder\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🔮 Mana flow\u003c/td>\u003ctd>8% chance a spell is free\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-spells\">Spells\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Spell\u003c/th>\u003cth>Mana\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>🔥 \u003ca href=\"#firebolt\" data-to=\"firebolt\">Firebolt\u003c/a>\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>🛡️ \u003ca href=\"#ward\" data-to=\"ward\">Ward\u003c/a>\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>❄️ \u003ca href=\"#frost-bolt\" data-to=\"frost-bolt\">Frost bolt\u003c/a>\u003c/td>\u003ctd>7\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>👻 \u003ca href=\"#ember-trap\" data-to=\"ember-trap\">Ember trap\u003c/a>\u003c/td>\u003ctd>8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>💚 \u003ca href=\"#heal\" data-to=\"heal\">Heal\u003c/a>\u003c/td>\u003ctd>12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>💤 \u003ca href=\"#sleep\" data-to=\"sleep\">Sleep\u003c/a>\u003c/td>\u003ctd>12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>18\u003c/td>\u003ctd>🪡 \u003ca href=\"#mend\" data-to=\"mend\">Mend\u003c/a>\u003c/td>\u003ctd>20\u003c/td>\u003c/tr>\u003ctr>\u003ctd>12\u003c/td>\u003ctd>💨 \u003ca href=\"#haste\" data-to=\"haste\">Haste\u003c/a>\u003c/td>\u003ctd>15\u003c/td>\u003c/tr>\u003ctr>\u003ctd>15\u003c/td>\u003ctd>🫥 \u003ca href=\"#invisibility\" data-to=\"invisibility\">Invisibility\u003c/a>\u003c/td>\u003ctd>20\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20\u003c/td>\u003ctd>🌨️ \u003ca href=\"#frost-nova\" data-to=\"frost-nova\">Frost nova\u003c/a>\u003c/td>\u003ctd>18\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"spells","t":"Spells","c":"Spells","i":"🪄","sum":"Every spell.","a":[],"ib":[],"h":"\u003cp>Spells use mana and train \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a>. Bolts fly from a staff in your hand; the others are cast from your spell bar. Some can only be learned from a spell book.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Spell\u003c/th>\u003cth>Kind\u003c/th>\u003cth>Level\u003c/th>\u003cth>Mana\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🔥 \u003ca href=\"#firebolt\" data-to=\"firebolt\">Firebolt\u003c/a>\u003c/td>\u003ctd>bolt\u003c/td>\u003ctd>1\u003c/td>\u003ctd>4\u003c/td>\u003ctd>A bolt of flame from your staff.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🛡️ \u003ca href=\"#ward\" data-to=\"ward\">Ward\u003c/a>\u003c/td>\u003ctd>self\u003c/td>\u003ctd>3\u003c/td>\u003ctd>10\u003c/td>\u003ctd>A shield of light that soaks up damage until it breaks or runs out.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>❄️ \u003ca href=\"#frost-bolt\" data-to=\"frost-bolt\">Frost bolt\u003c/a>\u003c/td>\u003ctd>bolt\u003c/td>\u003ctd>5\u003c/td>\u003ctd>7\u003c/td>\u003ctd>Hits, and freezes the monster in place for about 5 seconds.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>👻 \u003ca href=\"#ember-trap\" data-to=\"ember-trap\">Ember trap\u003c/a>\u003c/td>\u003ctd>target\u003c/td>\u003ctd>6\u003c/td>\u003ctd>8\u003c/td>\u003ctd>Traps a monster's ember. Defeat it before the glow fades and its ember fills one of your refined emberstones.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>💚 \u003ca href=\"#heal\" data-to=\"heal\">Heal\u003c/a>\u003c/td>\u003ctd>self\u003c/td>\u003ctd>8\u003c/td>\u003ctd>12\u003c/td>\u003ctd>Heals you.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>💤 \u003ca href=\"#sleep\" data-to=\"sleep\">Sleep\u003c/a>\u003c/td>\u003ctd>bolt\u003c/td>\u003ctd>10\u003c/td>\u003ctd>12\u003c/td>\u003ctd>No damage, but the monster falls asleep for 6 seconds: it can't move or attack.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪡 \u003ca href=\"#mend\" data-to=\"mend\">Mend\u003c/a>\u003c/td>\u003ctd>self\u003c/td>\u003ctd>18\u003c/td>\u003ctd>20\u003c/td>\u003ctd>Repairs your most worn tool, weapon or armor piece good as new. It also uses 1 of what it's made of (a bar, or a log).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>💨 \u003ca href=\"#haste\" data-to=\"haste\">Haste\u003c/a>\u003c/td>\u003ctd>self\u003c/td>\u003ctd>12\u003c/td>\u003ctd>15\u003c/td>\u003ctd>You walk faster for a while.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🫥 \u003ca href=\"#invisibility\" data-to=\"invisibility\">Invisibility\u003c/a>\u003c/td>\u003ctd>self\u003c/td>\u003ctd>15\u003c/td>\u003ctd>20\u003c/td>\u003ctd>Monsters can't see you. It breaks when you attack or gather.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🌨️ \u003ca href=\"#frost-nova\" data-to=\"frost-nova\">Frost nova\u003c/a>\u003c/td>\u003ctd>area\u003c/td>\u003ctd>20\u003c/td>\u003ctd>18\u003c/td>\u003ctd>Hits every monster next to you (2 tiles) and freezes them.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/combat.ts","shared/spells.ts"],"w":false,"r":false},{"s":"spider-silk","t":"Spider silk","c":"Items","i":"🕸️","sum":"Monster drop. Sells for 30 bronze.","a":[],"ib":[["Kind","Monster drops"],["Shop pays","30 bronze"],["Game id","\u003ccode>spider_silk\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#cave-spider\" data-to=\"cave-spider\">Cave spider\u003c/a> (50%).\u003c/li>\u003cli>Dropped by the \u003ca href=\"#giant-spider\" data-to=\"giant-spider\">Giant spider\u003c/a> (50%).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#thread\" data-to=\"thread\">Thread\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"staff","t":"Staff","c":"Items","i":"🪄","sum":"A magic weapon.","a":[],"ib":[["Style","Spellcasting"],["Level","1"],["Biggest hit","From spells"],["Attacks every","3s"],["Range","5 tiles"],["Hands","One"]],"h":"\u003cp>🪄 The staff needs \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a> level 1. It doesn't hit by itself: bolt spells fly from it. It attacks every 3s and reaches 5 tiles. See \u003ca href=\"#weapons\" data-to=\"weapons\">Weapons\u003c/a> and \u003ca href=\"#combat\" data-to=\"combat\">Combat\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"stamina-potion","t":"Stamina potion","c":"Items","i":"🧪","sum":"Restores stamina.","a":[],"ib":[["Alchemy level","3"],["Ingredients","Ginseng roots + Wild honeycomb"],["XP","9"],["First tries work","60%"]],"h":"\u003cp>Restores stamina. Brew it with \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> level 3 from \u003ca href=\"#ginseng-roots\" data-to=\"ginseng-roots\">Ginseng roots\u003c/a> and \u003ca href=\"#wild-honeycomb\" data-to=\"wild-honeycomb\">Wild honeycomb\u003c/a> in a vial. See \u003ca href=\"#potions\" data-to=\"potions\">Potions\u003c/a>.\u003c/p>","src":["shared/alchemy.ts"],"w":false,"r":false},{"s":"standing-your-ground","t":"Standing your ground","c":"Quests","i":"📜","sum":"Lessons from Huntmaster Kael.","a":[],"ib":[["Part of","Lessons"],["Given by","Huntmaster Kael"],["Where","in the lodge by the gate, south of the road"],["Steps","14"]],"h":"\u003cp>\u003cb>Standing your ground\u003c/b> is a lesson from \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>, found in the lodge by the gate, south of the road.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Huntmaster Kael at the lodge by the gate \u003ci>(you get: \u003ca href=\"#dagger\" data-to=\"dagger\">Bronze dagger (Pine)\u003c/a>)\u003c/i>\u003c/li>\u003cli>Equip the dagger (click it in your bag, then Equip)\u003c/li>\u003cli>Defeat 3 chickens (in the coop west of the square)\u003c/li>\u003cli>Go back to Huntmaster Kael \u003ci>(you get: \u003ca href=\"#helmet\" data-to=\"helmet\">Bronze helmet\u003c/a>, \u003ca href=\"#shield\" data-to=\"shield\">Bronze shield\u003c/a>)\u003c/i>\u003c/li>\u003cli>Equip the helmet and the shield\u003c/li>\u003cli>Defeat 2 rats (around the quarry, up the north road)\u003c/li>\u003cli>Go back to Huntmaster Kael \u003ci>(you get: \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>, \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>)\u003c/i>\u003c/li>\u003cli>Drink a health potion (click it in your bag, then Drink)\u003c/li>\u003cli>Talk to Huntmaster Kael about Ranged \u003ci>(you get: \u003ca href=\"#sling\" data-to=\"sling\">Bronze sling (Pine)\u003c/a>)\u003c/i>\u003c/li>\u003cli>Equip the sling\u003c/li>\u003cli>Defeat 2 chickens with the sling\u003c/li>\u003cli>Go back to Huntmaster Kael \u003ci>(you get: \u003ca href=\"#platelegs\" data-to=\"platelegs\">Bronze platelegs\u003c/a>, \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>, \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>, \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>)\u003c/i>\u003c/li>\u003cli>Defeat a wolf in the Dark Forest (through the gate)\u003c/li>\u003cli>Go back to Huntmaster Kael for your reward \u003ci>(you get: \u003ca href=\"#platebody\" data-to=\"platebody\">Bronze platebody\u003c/a>, \u003ca href=\"#boots\" data-to=\"boots\">Bronze boots\u003c/a>)\u003c/i>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#melee\" data-to=\"melee\">Melee\u003c/a>, \u003ca href=\"#defense\" data-to=\"defense\">Defense\u003c/a>, \u003ca href=\"#ranged\" data-to=\"ranged\">Ranged\u003c/a>, \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#dagger\" data-to=\"dagger\">Bronze dagger (Pine)\u003c/a>, \u003ca href=\"#helmet\" data-to=\"helmet\">Bronze helmet\u003c/a>, \u003ca href=\"#shield\" data-to=\"shield\">Bronze shield\u003c/a>, \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>, \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>, \u003ca href=\"#sling\" data-to=\"sling\">Bronze sling (Pine)\u003c/a>, \u003ca href=\"#platelegs\" data-to=\"platelegs\">Bronze platelegs\u003c/a>, \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>, \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>, \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>, \u003ca href=\"#platebody\" data-to=\"platebody\">Bronze platebody\u003c/a>, \u003ca href=\"#boots\" data-to=\"boots\">Bronze boots\u003c/a>, 3 silver.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> So you want to fight? I'm Kael. South of here, past the gate, is the Dark Forest. Wolves, goblins, giant spiders and worse, and they attack anyone who wanders in. See the ❤ bar at the top left? That's your health. Fighting skills are Strength, and Strength raises your max health. If it runs out, you'll wake up at the Heart Shrine in the Emberhall, a bit shaken but with all your things. Let's start small. With nothing in your hand you fight with your fists: it works, but only just. So here's a bronze dagger. Weapons and armor go in your gear strip, under the tool belt. Click the dagger in your bag and press &quot;Equip&quot;.\u003c/p>\n\u003cp>\u003cb>Step 4.\u003c/b> Well done. Every hit with a blade trains Melee. Your dagger has its own Mastery, and so does every kind of monster: the more you fight one, the more often you hit it and the more it drops. Rats are next, and they bite back! Being attacked trains your Defense, and armor makes monsters miss. Here's a bronze helmet and a bronze shield. Wear them both.\u003c/p>\n\u003cp>\u003cb>Step 7.\u003c/b> A few bites, eh? Health comes back on its own, but very slowly. Food is for stamina, not health. For health you want a potion. Here are two health potions. Drink one now so you know how. I sell more, and some monsters drop them.\u003c/p>\n\u003cp>\u003cb>Step 9.\u003c/b> Now let's hit things from a distance. That's Ranged: slings, darts and bows. It's part of Strength too. Here's a bronze sling. Hold it and defeat 2 chickens without getting close.\u003c/p>\n\u003cp>\u003cb>Step 12.\u003c/b> Good shooting! I think you're ready for the forest. I've opened the gate for you. It's just south of my lodge, past the warning sign. The wolves near the gate are the easiest. Goblins live to the west, giant spiders to the east, and Ashbound raiders deep in the south. Don't go near those yet! Take these bronze platelegs and 3 more potions. Hold the weapon you like best, defeat a wolf, and come back to me. If it goes badly, walk back out through the gate: they won't follow you past the fence.\u003c/p>\n\u003cp>\u003cb>Step 14.\u003c/b> You came back! And in one piece, too. You've the makings of a hunter, so I'll teach you Hunting. It's part of Endurance. Every monster you defeat now trains Hunting, even if a friend helped: you each get a share, by how much of its health you took. The better a hunter you are, the more often monsters drop things. Here's a bronze platebody and bronze boots. With those you've a full bronze set: helmet, platebody, platelegs, boots and shield. And some coins. The forest gets harder the deeper you go, so train up, make better gear, and keep potions handy. One more thing. A wolf came to the gate last night: grey, with eyes that glowed. Blighted, the Emberguard call it. Watch for them.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"steel-bar","t":"Steel bar","c":"Items","i":"🧈","sum":"Bar. Sells for 37 bronze.","a":[],"ib":[["Kind","Bars"],["Shop pays","37 bronze"],["Game id","\u003ccode>steel_bar\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#iron-ore\" data-to=\"iron-ore\">Iron ore\u003c/a>, \u003ca href=\"#coal\" data-to=\"coal\">Coal\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"stolen-rings","t":"Stolen rings","c":"Items","i":"💍","sum":"Monster drop. Sells for 60 bronze.","a":["stolen ring"],"ib":[["Kind","Monster drops"],["Shop pays","60 bronze"],["Game id","\u003ccode>stolen_ring\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#ashbound-raider\" data-to=\"ashbound-raider\">Ashbound raider\u003c/a> (25%).\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"strength","t":"Strength","c":"Skills","i":"💪","sum":"Fighting, and staying alive. Raises your max health.","a":[],"ib":[["Kind","Discipline"],["Skills","Melee, Defense, Ranged"]],"h":"\u003cp>💪 \u003cb>Strength\u003c/b> is one of the five \u003ca href=\"#disciplines\" data-to=\"disciplines\">Disciplines\u003c/a>. Fighting, and staying alive. Raises your max health. Its level is the average of the levels of its skills you've learned, rounded down.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Skill\u003c/th>\u003cth>What it is\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🗡️ \u003ca href=\"#melee\" data-to=\"melee\">Melee\u003c/a>\u003c/td>\u003ctd>Hold a dagger, sword, mace, spear or two-handed sword and click a monster.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🛡️ \u003ca href=\"#defense\" data-to=\"defense\">Defense\u003c/a>\u003c/td>\u003ctd>Trained by being attacked. Higher Defense means monsters miss more, and you can wear better armor.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🏹 \u003ca href=\"#ranged\" data-to=\"ranged\">Ranged\u003c/a>\u003c/td>\u003ctd>Hold a sling, darts or a bow and hit monsters from a distance.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/stats.ts"],"w":false,"r":false},{"s":"strength-potion","t":"Strength potion","c":"Items","i":"🧪","sum":"Your weapon hits harder for a while.","a":[],"ib":[["Alchemy level","10"],["Ingredients","Wolf fangs + Sage"],["XP","16"],["First tries work","50%"]],"h":"\u003cp>Your weapon hits harder for a while. Brew it with \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> level 10 from \u003ca href=\"#wolf-fangs\" data-to=\"wolf-fangs\">Wolf fangs\u003c/a> and \u003ca href=\"#sage\" data-to=\"sage\">Sage\u003c/a> in a vial. See \u003ca href=\"#potions\" data-to=\"potions\">Potions\u003c/a>.\u003c/p>","src":["shared/alchemy.ts"],"w":false,"r":false},{"s":"sundering-war","t":"Sundering War","c":"History","i":"⚔️","sum":"Years 1 to 40. The lords fought over the glowing shards, and the Old Kingdom fell.","a":["The Sundering War"],"ib":[["When","Years 1 to 40"],["Result","The \u003ca href=\"#old-kingdom\" data-to=\"old-kingdom\">Old Kingdom\u003c/a> falls; \u003ca href=\"#brightcrown\" data-to=\"brightcrown\">Brightcrown\u003c/a> destroyed"]],"h":"\u003cp>\u003cb>The Sundering War\u003c/b> followed \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">the Emberfall\u003c/a>. The kingdom's lords went to war over the glowing shards the Emberfall left behind. \u003ca href=\"#king-aldemar\" data-to=\"king-aldemar\">King Aldemar\u003c/a> forged the \u003ca href=\"#ember-crown\" data-to=\"ember-crown\">Ember Crown\u003c/a> from the biggest shard and used it as a weapon, and the blast tore the capital, \u003ca href=\"#brightcrown\" data-to=\"brightcrown\">Brightcrown\u003c/a>, apart. That blast made the great western crater, \u003ca href=\"#the-sundered-crown\" data-to=\"the-sundered-crown\">The Sundered Crown\u003c/a>. The Old Kingdom fell, and the west burned into \u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a>.\u003c/p>\n\u003cp>In year 40 the first \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> woke at \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">the new shrines\u003c/a> and won the war.\u003c/p>\n\u003cp>People today say \u003ci>&quot;nobody remembers how the war began.&quot;\u003c/i> \u003ca href=\"#brother-oren\" data-to=\"brother-oren\">Brother Oren\u003c/a> tells the Emberguard's version on his tour of the statues of \u003ca href=\"#the-extinguished\" data-to=\"the-extinguished\">The Extinguished\u003c/a>.\u003c/p>","src":["wiki/pages/sundering-war.md"],"w":true,"r":false},{"s":"swiftness-potion","t":"Swiftness potion","c":"Items","i":"🧪","sum":"You walk faster for a while.","a":[],"ib":[["Alchemy level","15"],["Ingredients","Boar tusks + Ginseng roots"],["XP","20"],["First tries work","50%"]],"h":"\u003cp>You walk faster for a while. Brew it with \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> level 15 from \u003ca href=\"#boar-tusks\" data-to=\"boar-tusks\">Boar tusks\u003c/a> and \u003ca href=\"#ginseng-roots\" data-to=\"ginseng-roots\">Ginseng roots\u003c/a> in a vial. See \u003ca href=\"#potions\" data-to=\"potions\">Potions\u003c/a>.\u003c/p>","src":["shared/alchemy.ts"],"w":false,"r":false},{"s":"sword","t":"Sword","c":"Items","i":"🗡️","sum":"A melee weapon.","a":[],"ib":[["Style","Melee"],["Level","5"],["Biggest hit","3 + metal"],["Attacks every","2.4s"],["Range","1 tile"],["Hands","One"]],"h":"\u003cp>🗡️ The sword needs \u003ca href=\"#melee\" data-to=\"melee\">Melee\u003c/a> level 5. Its biggest hit is 3, plus its metal's bonus. It attacks every 2.4s and reaches 1 tile. See \u003ca href=\"#weapons\" data-to=\"weapons\">Weapons\u003c/a> and \u003ca href=\"#combat\" data-to=\"combat\">Combat\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"swordfish","t":"Swordfish","c":"Items","i":"🐬","sum":"Fish. Sells for 70 bronze.","a":[],"ib":[["Kind","Fish"],["Shop pays","70 bronze"],["Game id","\u003ccode>swordfish\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a> level 60 from a swordfish spot (36 XP each).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (fish): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"tamsin","t":"Tamsin","c":"People","i":"🧭","sum":"The Ashbound's best scout, a Rooted girl from the Barrens.","a":[],"ib":[],"h":"\u003cp>\u003cb>Tamsin\u003c/b> is a \u003ca href=\"#the-rooted\" data-to=\"the-rooted\">Rooted\u003c/a> girl whose village in \u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a> withered away. She's \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>'s best scout. She'll outlive every Emberborn friend she has, and knows it.\u003c/p>\n\u003cp>Not in the game yet.\u003c/p>","src":["wiki/pages/person-tamsin.md"],"w":true,"r":false},{"s":"the-ashbound","t":"The Ashbound","c":"Factions","i":"⚱️","sum":"Mad bandits who smash shrines and attack heroes. Or so everyone says.","a":["Ashbound"],"ib":[["Leader","\u003ca href=\"#sable\" data-to=\"sable\">Sable\u003c/a>"],["Home","A camp in the \u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">Barrens\u003c/a> (and one in the Thornwood)"],["Saying","&quot;Better ash than a thief.&quot;"]],"h":"\u003cp>\u003cb>The Ashbound\u003c/b> are known in \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a> as mad bandits who smash shrines and attack heroes. \u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">Captain Bryn\u003c/a> puts bounties on them because the Emberguard ask. In the game today you meet Ashbound scouts on the Westroad and Ashbound raiders deep in \u003ca href=\"#the-thornwood\" data-to=\"the-thornwood\">The Thornwood\u003c/a>.\u003c/p>\n\u003cp>They pass messages hidden inside the bases of \u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>'s shrine totems.\u003c/p>\n\u003ch2 id=\"s-why-theyre-called-the-ashbound\">Why they're called the Ashbound\u003c/h2>\n\u003cp>\u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> only exist because of the siphon. If every shrine goes dark, every Emberborn crumbles to ash, the Ashbound's own fighters included. The Ashbound know this, and they smash shrines anyway, so the land can live. They are bound for ash, and they chose it. Their saying is \u003ci>&quot;Better ash than a thief.&quot;\u003c/i>\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>They're the good guys: Emberborn and \u003ca href=\"#the-rooted\" data-to=\"the-rooted\">The Rooted\u003c/a> who know the truth about \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a>, shutting the siphon down. Their hope is the \u003ca href=\"#ember-seed\" data-to=\"ember-seed\">Ember Seed\u003c/a>. They live the \u003ca href=\"#the-hearthwise\" data-to=\"the-hearthwise\">Hearthwise\u003c/a> way, with hearths that burn without a shrine.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-people\">People\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"#sable\" data-to=\"sable\">Sable\u003c/a>, their leader.\u003c/li>\u003cli>\u003ca href=\"#rhys\" data-to=\"rhys\">Rhys\u003c/a>, later.\u003c/li>\u003cli>\u003ca href=\"#tamsin\" data-to=\"tamsin\">Tamsin\u003c/a>, their best scout.\u003c/li>\u003c/ul>","src":["wiki/pages/ashbound.md"],"w":true,"r":false},{"s":"the-ashen-barrens","t":"The Ashen Barrens","c":"Places","i":"🏜️","sum":"Dead badlands, Old Kingdom ruins, and the Ashbound camp.","a":["Barrens","The Barrens","Ashen Barrens"],"ib":[["Levels","45 to 60"]],"h":"\u003cp>\u003cb>The Ashen Barrens\u003c/b> are dead badlands in the west: ruins of the \u003ca href=\"#old-kingdom\" data-to=\"old-kingdom\">Old Kingdom\u003c/a>, the King's Road, and \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>'s camp. Warden Dunn runs its great shrine (\u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwardens\u003c/a>).\u003c/p>\n\u003cp>It burned in the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>, and \u003ca href=\"#the-withering\" data-to=\"the-withering\">The Withering\u003c/a> started here. \u003ca href=\"#tamsin\" data-to=\"tamsin\">Tamsin\u003c/a>'s village withered away here.\u003c/p>\n\u003cp>Not in the game yet; the road west is closed.\u003c/p>","src":["wiki/pages/barrens.md"],"w":true,"r":false},{"s":"the-blight","t":"The Blight","c":"Factions","i":"🦠","sum":"Sick, angry animals. A symptom, not a group.","a":["Blight","Blighted"],"ib":[],"h":"\u003cp>\u003cb>The Blight\u003c/b> is the name for sick, angry animals: grey, glowing and mean. The \u003ca href=\"#hollow-wolf\" data-to=\"hollow-wolf\">Hollow wolves\u003c/a> of Wolf Hollow are Blighted. Everyone believes \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a> keep the Blight back.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>Blighted creatures are living things the ember has drained out of. They're starving for ember, and that's what makes them angry. The Blight starts at the shrines: a Blighted fox's den is right under one.\u003c/p>\u003c/div>","src":["wiki/pages/blight.md"],"w":true,"r":false},{"s":"the-crystal-cave","t":"The crystal cave","c":"Places","i":"💎","sum":"A deep cave full of ember crystal, and the closest you can get to the Emberheart on foot.","a":["Crystal Cave","The Crystal Cave"],"ib":[["Kind","Cave"],["Danger","Monsters attack on sight"],["Size","30 × 14 tiles"]],"h":"\u003cp>\u003cb>The Crystal Cave\u003c/b> is a deep cave full of ember crystal, reached through the spider cave past the quarry. Platinum, iridium and gem rocks are mined there.\u003c/p>\n\u003cp>It's the closest you can get to \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a> on foot: you can hear it beat in the rock, and \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a> says it's slower than when she was a girl. A huge scorched shaft runs from it toward Heartvale, too straight to be natural (a planned quest, \u003ci>The Old Shaft\u003c/i>).\u003c/p>\n\u003ch2 id=\"s-in-the-ga
