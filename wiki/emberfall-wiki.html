d","\u003ccode>copper_ore\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a> level 1 from a copper rock (4 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#hammer-and-fire\" data-to=\"hammer-and-fire\">Hammer and fire\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#bronze-bar\" data-to=\"bronze-bar\">Bronze bar\u003c/a>.\u003c/li>\u003cli>Smelted into \u003ca href=\"#bronze-bar\" data-to=\"bronze-bar\">Bronze bar\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"cow","t":"Cow","c":"Monsters","i":"🐄","sum":"A level 3 monster. Never fights back.","a":[],"ib":[["Level","3"],["Health","12"],["Biggest hit","0"],["Attacks every","2.4s"],["Temper","Never fights back"],["Out","Day and night"],["Comes back after","42s"],["Coins","None"]],"h":"\u003cp>The \u003cb>Cow\u003c/b> is a level 3 monster with 12 health. Never fights back.\u003c/p>\n\u003cp>Defeating one gives 4 bonus XP on top of 1 XP per point of damage, plus 7 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>Heartvale, near Pasture (5).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🐮 \u003ca href=\"#cowhides\" data-to=\"cowhides\">Cowhides\u003c/a>\u003c/td>\u003ctd>60%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🥩 \u003ca href=\"#raw-beef\" data-to=\"raw-beef\">Raw beef\u003c/a>\u003c/td>\u003ctd>70%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"cowhides","t":"Cowhides","c":"Items","i":"🐮","sum":"Monster drop. Sells for 4 bronze.","a":["cowhide"],"ib":[["Kind","Monster drops"],["Shop pays","4 bronze"],["Game id","\u003ccode>cowhide\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#cow\" data-to=\"cow\">Cow\u003c/a> (60%).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#leather\" data-to=\"leather\">Leather\u003c/a>.\u003c/li>\u003cli>Tanned into \u003ca href=\"#leather\" data-to=\"leather\">Leather\u003c/a> at Woodworker Rook's rack (\u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a> level 3).\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"crops","t":"Crops","c":"Items","i":"🌾","sum":"What you can grow at the farm.","a":[],"ib":[],"h":"\u003cp>Plant Farmer Odo's seeds on your plot. Crops grow even while you're logged out. See \u003ca href=\"#farming\" data-to=\"farming\">Farming\u003c/a>.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Crop\u003c/th>\u003cth>Farming level\u003c/th>\u003cth>Ripe after\u003c/th>\u003cth>Harvest\u003c/th>\u003cth>Seed price\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#potatoes\" data-to=\"potatoes\">Potatoes\u003c/a>\u003c/td>\u003ctd>1\u003c/td>\u003ctd>10 min\u003c/td>\u003ctd>3–5\u003c/td>\u003ctd>1 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#carrots\" data-to=\"carrots\">Carrots\u003c/a>\u003c/td>\u003ctd>4\u003c/td>\u003ctd>15 min\u003c/td>\u003ctd>3–5\u003c/td>\u003ctd>1 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#onions\" data-to=\"onions\">Onions\u003c/a>\u003c/td>\u003ctd>8\u003c/td>\u003ctd>25 min\u003c/td>\u003ctd>2–4\u003c/td>\u003ctd>2 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#wheat\" data-to=\"wheat\">Wheat\u003c/a>\u003c/td>\u003ctd>12\u003c/td>\u003ctd>40 min\u003c/td>\u003ctd>3–5\u003c/td>\u003ctd>2 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#ginseng-roots\" data-to=\"ginseng-roots\">Ginseng roots\u003c/a>\u003c/td>\u003ctd>20\u003c/td>\u003ctd>120 min\u003c/td>\u003ctd>1–2\u003c/td>\u003ctd>8 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#blue-lotus\" data-to=\"blue-lotus\">Blue lotus\u003c/a>\u003c/td>\u003ctd>30\u003c/td>\u003ctd>180 min\u003c/td>\u003ctd>1–2\u003c/td>\u003ctd>12 bronze\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-plot-sizes\">Plot sizes\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Size\u003c/th>\u003cth>Price\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>2 × 2\u003c/td>\u003ctd>2 gold\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3 × 2\u003c/td>\u003ctd>3 gold\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3 × 3\u003c/td>\u003ctd>5 gold\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4 × 4\u003c/td>\u003ctd>8 gold\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5 × 5\u003c/td>\u003ctd>12 gold\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6 × 5\u003c/td>\u003ctd>18 gold\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6 × 6\u003c/td>\u003ctd>25 gold\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/farming.ts"],"w":false,"r":false},{"s":"dagger","t":"Dagger","c":"Items","i":"🔪","sum":"A melee weapon.","a":[],"ib":[["Style","Melee"],["Level","1"],["Biggest hit","2 + metal"],["Attacks every","1.8s"],["Range","1 tile"],["Hands","One"]],"h":"\u003cp>🔪 The dagger needs \u003ca href=\"#melee\" data-to=\"melee\">Melee\u003c/a> level 1. Its biggest hit is 2, plus its metal's bonus. It attacks every 1.8s and reaches 1 tile. See \u003ca href=\"#weapons\" data-to=\"weapons\">Weapons\u003c/a> and \u003ca href=\"#combat\" data-to=\"combat\">Combat\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"darts","t":"Darts","c":"Items","i":"🎯","sum":"A ranged weapon.","a":[],"ib":[["Style","Ranged"],["Level","5"],["Biggest hit","2 + metal"],["Attacks every","1.2s"],["Range","3 tiles"],["Hands","One"]],"h":"\u003cp>🎯 The darts needs \u003ca href=\"#ranged\" data-to=\"ranged\">Ranged\u003c/a> level 5. Its biggest hit is 2, plus its metal's bonus. It attacks every 1.2s and reaches 3 tiles. See \u003ca href=\"#weapons\" data-to=\"weapons\">Weapons\u003c/a> and \u003ca href=\"#combat\" data-to=\"combat\">Combat\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"day-and-night","t":"Day and night","c":"Mechanics","i":"🌙","sum":"A day lasts 40 minutes, a night 10.","a":[],"ib":[],"h":"\u003cp>A full day is 40 minutes of daylight and 10 minutes of night, with 2 minutes of dusk and dawn between. Some monsters (like the \u003ca href=\"#giant-bat\" data-to=\"giant-bat\">Giant bat\u003c/a>) and some finds (like \u003ca href=\"#moonpetal\" data-to=\"moonpetal\">Moonpetal\u003c/a>) only come out at night. Your \u003ca href=\"#your-lantern\" data-to=\"your-lantern\">lantern\u003c/a> makes nights less dark.\u003c/p>","src":["shared/daynight.ts"],"w":false,"r":false},{"s":"defense","t":"Defense","c":"Skills","i":"🛡️","sum":"Trained by being attacked. Higher Defense means monsters miss more, and you can wear better armor.","a":[],"ib":[["Discipline","💪 Strength"],["Taught by","\u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>"],["Max level","99"]],"h":"\u003cp>🛡️ \u003cb>Defense\u003c/b> is a skill in \u003ca href=\"#strength\" data-to=\"strength\">Strength\u003c/a>. Trained by being attacked. Higher Defense means monsters miss more, and you can wear better armor.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#standing-your-ground\" data-to=\"standing-your-ground\">Standing your ground\u003c/a>, from \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>❤️ Toughness\u003c/td>\u003ctd>+5 max health\u003c/td>\u003c/tr>\u003ctr>\u003ctd>💨 Footwork\u003c/td>\u003ctd>monsters hit you 2% less\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📖 Quick learner\u003c/td>\u003ctd>10% more XP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"dexterity","t":"Dexterity","c":"Skills","i":"🤲","sum":"Making things. Raises how much you can carry and how fast you walk.","a":[],"ib":[["Kind","Discipline"],["Skills","Cooking, Handicraft, Smithing, Smelting"]],"h":"\u003cp>🤲 \u003cb>Dexterity\u003c/b> is one of the five \u003ca href=\"#disciplines\" data-to=\"disciplines\">Disciplines\u003c/a>. Making things. Raises how much you can carry and how fast you walk. Its level is the average of the levels of its skills you've learned, rounded down.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Skill\u003c/th>\u003cth>What it is\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🍲 \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>\u003c/td>\u003ctd>Use the stove in the town square, by Old Maren on the Emberhall's steps, to cook meals (stew, stir fry, curry, roast) from fish, meat and vegetables. Meals give back lots of stamina.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧵 \u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a>\u003c/td>\u003ctd>Use Woodworker Rook's workshop: fishing bait, bows, arrows and staffs at the workbench, leather at the tanning rack (outside), thread and cloth at the spinning wheel, and leather and cloth armor.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🔨 \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>\u003c/td>\u003ctd>Use the anvil in Smith Brann's smithy to make tools from a metal bar, plus a log.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🔥 \u003ca href=\"#smelting\" data-to=\"smelting\">Smelting\u003c/a>\u003c/td>\u003ctd>Use the furnace in Smith Brann's smithy to turn ore into bars.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/stats.ts"],"w":false,"r":false},{"s":"disciplines","t":"Disciplines","c":"Mechanics","i":"📊","sum":"The five big areas you level up, and what each raises.","a":[],"ib":[],"h":"\u003cp>There are five disciplines. Each holds skills, and each raises one of your stats. A discipline's level is the average of the skills in it that you've learned (rounded down), so it rises as they do.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Discipline\u003c/th>\u003cth>Raises\u003c/th>\u003cth>Skills\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>💪 \u003ca href=\"#strength\" data-to=\"strength\">Strength\u003c/a>\u003c/td>\u003ctd>Raises your max health.\u003c/td>\u003ctd>\u003ca href=\"#melee\" data-to=\"melee\">Melee\u003c/a>, \u003ca href=\"#defense\" data-to=\"defense\">Defense\u003c/a>, \u003ca href=\"#ranged\" data-to=\"ranged\">Ranged\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🌿 \u003ca href=\"#endurance\" data-to=\"endurance\">Endurance\u003c/a>\u003c/td>\u003ctd>Raises your max stamina.\u003c/td>\u003ctd>\u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a>, \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a>, \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a>, \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a>, \u003ca href=\"#farming\" data-to=\"farming\">Farming\u003c/a>, \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🔮 \u003ca href=\"#wisdom\" data-to=\"wisdom\">Wisdom\u003c/a>\u003c/td>\u003ctd>Raises your max mana.\u003c/td>\u003ctd>\u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a>, \u003ca href=\"#enchanting\" data-to=\"enchanting\">Enchanting\u003c/a>, \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🤲 \u003ca href=\"#dexterity\" data-to=\"dexterity\">Dexterity\u003c/a>\u003c/td>\u003ctd>Raises how much you can carry and how fast you walk.\u003c/td>\u003ctd>\u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>, \u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a>, \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>, \u003ca href=\"#smelting\" data-to=\"smelting\">Smelting\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🤝 \u003ca href=\"#charisma\" data-to=\"charisma\">Charisma\u003c/a>\u003c/td>\u003ctd>Better shop prices.\u003c/td>\u003ctd>\u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a>, \u003ca href=\"#leadership\" data-to=\"leadership\">Leadership\u003c/a>, \u003ca href=\"#renown\" data-to=\"renown\">Renown\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-stats-at-each-level\">Stats at each level\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Health (Strength)\u003c/th>\u003cth>Stamina (Endurance)\u003c/th>\u003cth>Mana (Wisdom)\u003c/th>\u003cth>Carry (Dexterity)\u003c/th>\u003cth>Walk speed (Dexterity)\u003c/th>\u003cth>Prices (Charisma)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>50\u003c/td>\u003ctd>100\u003c/td>\u003ctd>50\u003c/td>\u003ctd>45 kg\u003c/td>\u003ctd>+0%\u003c/td>\u003ctd>0% better\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>95\u003c/td>\u003ctd>145\u003c/td>\u003ctd>95\u003c/td>\u003ctd>54 kg\u003c/td>\u003ctd>+9%\u003c/td>\u003ctd>2.7% better\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20\u003c/td>\u003ctd>145\u003c/td>\u003ctd>195\u003c/td>\u003ctd>145\u003c/td>\u003ctd>64 kg\u003c/td>\u003ctd>+19%\u003c/td>\u003ctd>5.7% better\u003c/td>\u003c/tr>\u003ctr>\u003ctd>31\u003c/td>\u003ctd>200\u003c/td>\u003ctd>250\u003c/td>\u003ctd>200\u003c/td>\u003ctd>75 kg\u003c/td>\u003ctd>+30%\u003c/td>\u003ctd>9% better\u003c/td>\u003c/tr>\u003ctr>\u003ctd>50\u003c/td>\u003ctd>295\u003c/td>\u003ctd>345\u003c/td>\u003ctd>295\u003c/td>\u003ctd>94 kg\u003c/td>\u003ctd>+30%\u003c/td>\u003ctd>14.7% better\u003c/td>\u003c/tr>\u003ctr>\u003ctd>75\u003c/td>\u003ctd>420\u003c/td>\u003ctd>470\u003c/td>\u003ctd>420\u003c/td>\u003ctd>119 kg\u003c/td>\u003ctd>+30%\u003c/td>\u003ctd>22.2% better\u003c/td>\u003c/tr>\u003ctr>\u003ctd>99\u003c/td>\u003ctd>540\u003c/td>\u003ctd>590\u003c/td>\u003ctd>540\u003c/td>\u003ctd>143 kg\u003c/td>\u003ctd>+30%\u003c/td>\u003ctd>29.4% better\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a> adds another 0.2% better prices per level above 1.\u003c/p>","src":["shared/disciplines.ts","shared/stats.ts"],"w":false,"r":false},{"s":"eel","t":"Eel","c":"Items","i":"🐍","sum":"Fish. Sells for 120 bronze.","a":[],"ib":[["Kind","Fish"],["Shop pays","120 bronze"],["Game id","\u003ccode>eel\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a> level 75 from a eel spot (50 XP each).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (fish): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"elderwood-logs","t":"Elderwood logs","c":"Items","i":"🪵","sum":"Log. Sells for 100 bronze.","a":["elderwood log"],"ib":[["Kind","Logs"],["Shop pays","100 bronze"],["Game id","\u003ccode>elderwood_logs\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a> level 70 from a elderwood tree (45 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Used for tool handles, bows, staffs and arrows, and burned as cooking fuel.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"ember-crown","t":"Ember Crown","c":"History","i":"👑","sum":"King Aldemar's crown, forged from the biggest Emberfall shard. The relic the Emberguard want.","a":["The Ember Crown","Crown of Aurel"],"ib":[],"h":"\u003cp>\u003cb>The Ember Crown\u003c/b> was forged by \u003ca href=\"#king-aldemar\" data-to=\"king-aldemar\">King Aldemar\u003c/a> from the biggest shard of \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">the Emberfall\u003c/a>. He used it as a weapon in the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>, and its blast destroyed \u003ca href=\"#brightcrown\" data-to=\"brightcrown\">Brightcrown\u003c/a>.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The Crown is in two halves. One half lies in the Crown Vault under \u003ca href=\"#the-sundered-crown\" data-to=\"the-sundered-crown\">The Sundered Crown\u003c/a>. The other is set in \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a>'s staff (he never lets anyone touch it). Whole, it would let \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a> command \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a> itself. It's what the Emberguard search for in the endgame.\u003c/p>\u003c/div>","src":["wiki/pages/ember-crown.md"],"w":true,"r":false},{"s":"ember-seed","t":"Ember Seed","c":"Lore","i":"🌱","sum":"A pure ember from before the Emberfall. The Ashbound's one hope.","a":["The Ember Seed","Heart Seed","The Heart Seed","Aurel Seed"],"ib":[],"h":"\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>\u003cb>The Ember Seed\u003c/b> is a pure ember from before \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">the Emberfall\u003c/a>, hidden in the Crown Vault under \u003ca href=\"#the-sundered-crown\" data-to=\"the-sundered-crown\">The Sundered Crown\u003c/a>. Planted in \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a>, it might let \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> live on their own fire, without the siphon. It's \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>'s one hope, and the Emberguard want it so nothing ever replaces the siphon.\u003c/p>\n\u003cp>Hints: \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>'s jar of seed from before the Emberfall, and Old Kingdom coins showing a seed under a crown.\u003c/p>\u003c/div>","src":["wiki/pages/ember-seed.md"],"w":true,"r":false},{"s":"ember-trap","t":"Ember trap","c":"Spells","i":"👻","sum":"Traps a monster's ember. Defeat it before the glow fades and its ember fills one of your refined emberstones.","a":[],"ib":[["Spellcasting level","6"],["Mana","8"],["Kind","On a monster"],["Learned from","Levelling up"]],"h":"\u003cp>👻 Traps a monster's ember. Defeat it before the glow fades and its ember fills one of your refined emberstones.\u003c/p>\n\u003cp>It needs \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a> level 6 and costs 8 mana at Mastery 1 (Mastery lowers the cost). It lasts 60 seconds at Mastery 1.\u003c/p>","src":["shared/combat.ts","shared/spells.ts"],"w":false,"r":false},{"s":"ember-trap-potion","t":"Ember trap potion","c":"Items","i":"🧪","sum":"Your Ember trap spell lasts longer, for a while.","a":[],"ib":[["Alchemy level","25"],["Ingredients","Venom sacs + Moonpetal"],["XP","32"],["First tries work","40%"]],"h":"\u003cp>Your Ember trap spell lasts longer, for a while. Brew it with \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> level 25 from \u003ca href=\"#venom-sacs\" data-to=\"venom-sacs\">Venom sacs\u003c/a> and \u003ca href=\"#moonpetal\" data-to=\"moonpetal\">Moonpetal\u003c/a> in a vial. See \u003ca href=\"#potions\" data-to=\"potions\">Potions\u003c/a>.\u003c/p>","src":["shared/alchemy.ts"],"w":false,"r":false},{"s":"emberborn","t":"Emberborn","c":"Factions","i":"🔥","sum":"Heroes the shrines make from ember. No past, no family, and they come back when they fall. The players.","a":["The Emberborn","Kindled","Players"],"ib":[["Who","Every player character"],["Made at","\u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a>"],["First","\u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>, year 40"],["Old name","Kindled"]],"h":"\u003cp>\u003cb>Emberborn\u003c/b> are heroes \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a> make from \u003ca href=\"#the-ember\" data-to=\"the-ember\">ember\u003c/a>. They wake on a shrine's steps with no past and no family, and when they fall they come back at a shrine. Every player is one. There are hundreds of them.\u003c/p>\n\u003cp>Every Emberborn wakes holding a pebble of emberstone.\u003c/p>\n\u003cp>New Emberborn start as \u003ca href=\"#hopefuls\" data-to=\"hopefuls\">Hopefuls\u003c/a>: they aren't members of \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>, and have to prove themselves worthy through the Emberguard's trials.\u003c/p>\n\u003cp>The ordinary folk who can't come back from death are called \u003ca href=\"#the-rooted\" data-to=\"the-rooted\">The Rooted\u003c/a>.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>Emberborn are made of stolen ember, and farmed for it. Each time one falls, the shrine skims a little ember off them (\u003ca href=\"#the-tithe\" data-to=\"the-tithe\">The Tithe\u003c/a>). A strong Emberborn can be drained all at once in a \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a>, which feeds \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a> for years. And if the siphon stops, every Emberborn turns to ash. The emberstone pebble they wake holding is their thread's anchor.\u003c/p>\n\u003cp>The first Emberborn were made in year 40 as soldiers to end the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>. \u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a> was one of them.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-how-it-looks-in-play\">How it looks in play\u003c/h2>\n\u003cp>After the final choice, Ashbound players get grey ash marks that slowly spread up their hands, and rise at Ashbound hearths instead of shrines. Emberguard players get a faint gold glow in their eyes. (Planned; not in the game yet.)\u003c/p>","src":["wiki/pages/emberborn.md"],"w":true,"r":false},{"s":"emberhold","t":"Emberhold","c":"Places","i":"🏘️","sum":"The capital town on the edge of Heartvale, and where every player starts.","a":[],"ib":[["Levels","1 to 10"],["Region","\u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>"]],"h":"\u003cp>\u003cb>Emberhold\u003c/b> is the capital, on the edge of \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>: the town square with its well and the bounty board, Trainer Row, the lake, the farm to the east, and \u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">The Mages' Guild\u003c/a> to the south-west. It grew up around \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a> after the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>.\u003c/p>\n\u003cp>The well in the square is warm, because it's heated from below.\u003c/p>\n\u003ch2 id=\"s-buildings\">Buildings\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>, the Emberguard's temple, where you wake.\u003c/li>\u003cli>\u003ca href=\"#the-general-store\" data-to=\"the-general-store\">The General Store\u003c/a> (\u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>).\u003c/li>\u003cli>\u003ca href=\"#smith-branns-smithy\" data-to=\"smith-branns-smithy\">Smith Brann's smithy\u003c/a> and the trainers' houses on Trainer Row.\u003c/li>\u003cli>\u003ca href=\"#woodworker-rooks-workshop\" data-to=\"woodworker-rooks-workshop\">Woodworker Rook's workshop\u003c/a>, just west of the square.\u003c/li>\u003cli>\u003ca href=\"#old-marens-cottage\" data-to=\"old-marens-cottage\">Old Maren's cottage\u003c/a> on the lake shore.\u003c/li>\u003cli>\u003ca href=\"#herbalist-wrens-hut\" data-to=\"herbalist-wrens-hut\">Herbalist Wren's hut\u003c/a> by the lake.\u003c/li>\u003cli>\u003ca href=\"#huntmaster-kaels-lodge\" data-to=\"huntmaster-kaels-lodge\">Huntmaster Kael's lodge\u003c/a> by the gate.\u003c/li>\u003cli>\u003ca href=\"#the-hearthstone-inn\" data-to=\"the-hearthstone-inn\">The Hearthstone Inn\u003c/a>.\u003c/li>\u003cli>\u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">The Mages' Guild\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-people\">People\u003c/h2>\n\u003cp>Everyone in town: see \u003ca href=\"#people-in-the-game\" data-to=\"people-in-the-game\">People in the game\u003c/a>.\u003c/p>\n\u003cp>People in the game call it Emberhold, and the town history book is &quot;Emberhold: a Town History&quot;.\u003c/p>","src":["wiki/pages/emberhold.md"],"w":true,"r":false},{"s":"embervale","t":"Embervale","c":"Lore","i":"🔥","sum":"The land the game is set in.","a":["The land","Emberfall (the land)","Elderra"],"ib":[["Kind","The land"],["Old name","Elderra"],["Capital","\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>"],["Year","500 After the Fall"],["Ruled by","Nobody; \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a> run the shrines"]],"h":"\u003cp>\u003cb>Embervale\u003c/b> is the land the game is set in. The game itself is called \u003cb>Emberfall\u003c/b>, after \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">the Emberfall\u003c/a>, the disaster 500 years ago that rained fire across Embervale and broke the \u003ca href=\"#old-kingdom\" data-to=\"old-kingdom\">Old Kingdom\u003c/a>.\u003c/p>\n\u003cp>Deep under the land burns its own heart, a living fire called \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a>. Its warmth, \u003ca href=\"#the-ember\" data-to=\"the-ember\">the ember\u003c/a>, is in everything that grows.\u003c/p>\n\u003ch2 id=\"s-the-story-in-one-paragraph\">The story in one paragraph\u003c/h2>\n\u003cp>Long ago a circle of dark mages broke the earth open to drink the Emberheart and live forever. They caused the Emberfall, then slowly rewrote history until everyone believed they were the land's protectors: \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>.\u003c/p>\n\u003cp>Players are \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a>, heroes made from that stolen ember. They start as \u003ca href=\"#hopefuls\" data-to=\"hopefuls\">Hopefuls\u003c/a>, trying to prove themselves worthy of joining the Emberguard. On the day they're invited in, they learn the truth and choose: join the Emberguard and live forever on stolen fire, or join \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>, who are shutting the siphon down even though every Emberborn, themselves included, will turn to ash when it stops.\u003c/p>\n\u003cblockquote>\u003cp>Would you live forever on something stolen, or give up your life so the land can live?\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"s-the-regions\">The regions\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Region\u003c/th>\u003cth>Levels\u003c/th>\u003cth>What it is\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>\u003c/td>\u003ctd>1 to 20\u003c/td>\u003ctd>Green valley, farms, rivers, and the capital \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-thornwood\" data-to=\"the-thornwood\">The Thornwood\u003c/a>\u003c/td>\u003ctd>15 to 30\u003c/td>\u003ctd>Deep forest, slowly going dark\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#greyspine-peaks\" data-to=\"greyspine-peaks\">Greyspine Peaks\u003c/a>\u003c/td>\u003ctd>25 to 40\u003c/td>\u003ctd>Mountains, quarry, the \u003ca href=\"#the-crystal-cave\" data-to=\"the-crystal-cave\">Crystal Cave\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#saltmere-coast\" data-to=\"saltmere-coast\">Saltmere Coast\u003c/a>\u003c/td>\u003ctd>35 to 50\u003c/td>\u003ctd>Harbour town, islands, the best fishing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a>\u003c/td>\u003ctd>45 to 60\u003c/td>\u003ctd>Dead badlands and Old Kingdom ruins\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#frostfell\" data-to=\"frostfell\">Frostfell\u003c/a>\u003c/td>\u003ctd>55 to 70\u003c/td>\u003ctd>Frozen tundra, with ice creeping south\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-hollow-heart\" data-to=\"the-hollow-heart\">The Hollow Heart\u003c/a>\u003c/td>\u003ctd>65+\u003c/td>\u003ctd>The cavern where the Emberheart burns\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-sundered-crown\" data-to=\"the-sundered-crown\">The Sundered Crown\u003c/a>\u003c/td>\u003ctd>70+\u003c/td>\u003ctd>The endgame crater in the far west\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Only Heartvale (with Emberhold and the edge of the Thornwood) is in the game so far.\u003c/p>","src":["wiki/pages/embervale.md"],"w":true,"r":false},{"s":"emberwardens","t":"Emberwardens","c":"Factions","i":"🏰","sum":"The four Emberguard leaders who each run a region's great shrine.","a":["Emberwarden","Lightwardens"],"ib":[],"h":"\u003cp>The four \u003cb>Emberwardens\u003c/b> each run a region's great shrine, and each sets the player a trial in Act 2 (see \u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a>).\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Emberwarden\u003c/th>\u003cth>Region\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Warden Crowe\u003c/td>\u003ctd>\u003ca href=\"#the-thornwood\" data-to=\"the-thornwood\">The Thornwood\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Warden Flint\u003c/td>\u003ctd>\u003ca href=\"#greyspine-peaks\" data-to=\"greyspine-peaks\">Greyspine Peaks\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Warden Merrow\u003c/td>\u003ctd>\u003ca href=\"#saltmere-coast\" data-to=\"saltmere-coast\">Saltmere Coast\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Warden Dunn\u003c/td>\u003ctd>\u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>All four are secretly \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>. They collect anything with ember in it: every glowing fish was taken from Warden Merrow's feast before cooking, and Warden Flint's emberstone carts to the Emberhall don't add up.\u003c/p>\u003c/div>\n\u003cp>None of them are in the game yet.\u003c/p>","src":["wiki/pages/emberwardens.md"],"w":true,"r":false},{"s":"empty-vials","t":"Empty vials","c":"Items","i":"🫙","sum":"Materials and food. Sells for 2 bronze.","a":["empty vial"],"ib":[["Kind","Materials and food"],["Shop pays","2 bronze"],["Game id","\u003ccode>vial\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">Alchemist Moss\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#a-drop-of-something\" data-to=\"a-drop-of-something\">A drop of something\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"enchanter-vale","t":"Enchanter Vale","c":"People","i":"✨","sum":"The gentle enchanter in the Emberhall, named after the great Archmage.","a":[],"ib":[["Found in","The Emberhall"],["Game id","\u003ccode>vale\u003c/code>"]],"h":"\u003cp>\u003cb>Enchanter Vale\u003c/b> is the gentle enchanter in \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>. People say he was named after the great \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a>. He never lets anyone touch his staff.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>He \u003cb>is\u003c/b> Archmage Vale, over 500 years old, hiding in plain sight. He's also the hooded High Keeper who leads \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>. Half of the \u003ca href=\"#ember-crown\" data-to=\"ember-crown\">Ember Crown\u003c/a> is set in his staff.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;Hm? Oh, a new spark. How bright you are. Come back when you know a little magic.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>.\u003c/p>","src":["wiki/pages/person-vale.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"enchanting","t":"Enchanting","c":"Skills","i":"✨","sum":"Use the enchanting altar in the Mages' Guild: a refined emberstone with ember in it adds magic to a staff, a piece of armor or a tool. Archmage Rowan teaches it.","a":[],"ib":[["Discipline","🔮 Wisdom"],["Taught by","\u003ca href=\"#archmage-rowan\" data-to=\"archmage-rowan\">Archmage Rowan\u003c/a>"],["Max level","99"]],"h":"\u003cp>✨ \u003cb>Enchanting\u003c/b> is a skill in \u003ca href=\"#wisdom\" data-to=\"wisdom\">Wisdom\u003c/a>. Use the enchanting altar in the Mages' Guild: a refined emberstone with ember in it adds magic to a staff, a piece of armor or a tool. Archmage Rowan teaches it.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#sparks-and-spells\" data-to=\"sparks-and-spells\">Sparks and spells\u003c/a>, from \u003ca href=\"#archmage-rowan\" data-to=\"archmage-rowan\">Archmage Rowan\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 1 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>➕ Second slot\u003c/td>\u003ctd>a second enchantment\u003c/td>\u003c/tr>\u003ctr>\u003ctd>💥 Potency\u003c/td>\u003ctd>10% stronger enchantments\u003c/td>\u003c/tr>\u003ctr>\u003ctd>♻️ Re-enchant\u003c/td>\u003ctd>enchant again after taking one off\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Enchantments you can put on things at the altar in the Mages' Guild, using a refined emberstone with ember in it (trap ember with \u003ca href=\"#ember-trap\" data-to=\"ember-trap\">Ember trap\u003c/a>). Staff enchantments also need a cut gem of the right kind.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Enchantment\u003c/th>\u003cth>Goes on\u003c/th>\u003cth>Gem\u003c/th>\u003cth>Does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🔥 Fire\u003c/td>\u003ctd>staff\u003c/td>\u003ctd>Ruby\u003c/td>\u003ctd>bolts burn for +5 damage, +4 hit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>❄️ Frost\u003c/td>\u003ctd>staff\u003c/td>\u003ctd>Sapphire\u003c/td>\u003ctd>bolts slow the monster for 4.8s, +4 hit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>☠️ Poison\u003c/td>\u003ctd>staff\u003c/td>\u003ctd>Emerald\u003c/td>\u003ctd>bolts poison for 3 damage 4 times, +4 hit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>⚡ Lightning\u003c/td>\u003ctd>staff\u003c/td>\u003ctd>Topaz\u003c/td>\u003ctd>bolts jump to a second monster for 60% damage, +4 hit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🩸 Life steal\u003c/td>\u003ctd>staff\u003c/td>\u003ctd>Amethyst\u003c/td>\u003ctd>bolts heal you 34% of the damage, +4 hit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>❤️ Vitality\u003c/td>\u003ctd>armor\u003c/td>\u003ctd>—\u003c/td>\u003ctd>+10 max health\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🔮 Mana flow\u003c/td>\u003ctd>armor\u003c/td>\u003ctd>—\u003c/td>\u003ctd>mana comes back 20% faster\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🛡️ Guard\u003c/td>\u003ctd>armor\u003c/td>\u003ctd>—\u003c/td>\u003ctd>7% less damage\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🌵 Thorns\u003c/td>\u003ctd>armor\u003c/td>\u003ctd>—\u003c/td>\u003ctd>monsters that hit you take 4 damage\u003c/td>\u003c/tr>\u003ctr>\u003ctd>⏩ Swiftness\u003c/td>\u003ctd>tool (gathering only)\u003c/td>\u003ctd>—\u003c/td>\u003ctd>20% faster gathering\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍀 Bounty\u003c/td>\u003ctd>tool\u003c/td>\u003ctd>—\u003c/td>\u003ctd>10% chance of an extra one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪶 Tireless\u003c/td>\u003ctd>tool\u003c/td>\u003ctd>—\u003c/td>\u003ctd>20% chance it costs no stamina\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📖 Wisdom\u003c/td>\u003ctd>tool\u003c/td>\u003ctd>—\u003c/td>\u003ctd>+10% XP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The numbers shown are for power 20 and a 3 carat gem.\u003c/p>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts","shared/enchanting.ts"],"w":false,"r":false},{"s":"endurance","t":"Endurance","c":"Skills","i":"🌿","sum":"Gathering from the wild. Raises your max stamina.","a":[],"ib":[["Kind","Discipline"],["Skills","Fishing, Woodcutting, Mining, Foraging, Farming, Hunting"]],"h":"\u003cp>🌿 \u003cb>Endurance\u003c/b> is one of the five \u003ca href=\"#disciplines\" data-to=\"disciplines\">Disciplines\u003c/a>. Gathering from the wild. Raises your max stamina. Its level is the average of the levels of its skills you've learned, rounded down.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Skill\u003c/th>\u003cth>What it is\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🎣 \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a>\u003c/td>\u003ctd>Click the water's edge to fish.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪓 \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a>\u003c/td>\u003ctd>Click a tree to chop logs.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>⛏️ \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a>\u003c/td>\u003ctd>Click a rock to mine ore.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🌱 \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a>\u003c/td>\u003ctd>Click a glinting dig patch to dig it up with a shovel: roots, mushrooms, worms, herbs, old bones, truffles, and moonpetal at night. Herbalist Wren teaches it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🌾 \u003ca href=\"#farming\" data-to=\"farming\">Farming\u003c/a>\u003c/td>\u003ctd>Buy a plot at the farm (east of the island, over the second bridge) from Farmer Odo, plant his seeds, and come back to harvest. Crops grow even while you're logged out. Farmer Odo teaches it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🐾 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a>\u003c/td>\u003ctd>Trained by defeating monsters. Everyone who hurt it shares the XP by how much damage they did. Higher Hunting makes monsters drop things more often.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/stats.ts"],"w":false,"r":false},{"s":"farmer-odo","t":"Farmer Odo","c":"People","i":"🌾","sum":"Teaches Farming. His fields stay green.","a":[],"ib":[["Found in","Heartvale"],["Shop","Yes"],["Game id","\u003ccode>odo\u003c/code>"]],"h":"\u003cp>\u003cb>Farmer Odo\u003c/b> teaches \u003ca href=\"#farming\" data-to=\"farming\">Farming\u003c/a> and sells seeds and plots at the farm east of town. His fields stay green because he never took a blessing (\u003ca href=\"#odos-stubborn-field\" data-to=\"odos-stubborn-field\">Odo's Stubborn Field\u003c/a>). He keeps a jar of seed from before the Emberfall.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;Seeds for sale, and land if you want it. Everyone's crops grow while they sleep!&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#something-to-grow\" data-to=\"something-to-grow\">Something to grow\u003c/a> (lessons)\u003c/li>\u003cli>\u003ca href=\"#odos-stubborn-field\" data-to=\"odos-stubborn-field\">Odo's Stubborn Field\u003c/a> (Act 1)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Shop:\u003c/b> buys seeds, potatoes, carrots, onions and wheat. Sells: \u003ca href=\"#seed-potatoes\" data-to=\"seed-potatoes\">Seed potatoes\u003c/a>, \u003ca href=\"#carrot-seeds\" data-to=\"carrot-seeds\">Carrot seeds\u003c/a>, \u003ca href=\"#onion-sets\" data-to=\"onion-sets\">Onion sets\u003c/a>, \u003ca href=\"#wheat-seeds\" data-to=\"wheat-seeds\">Wheat seeds\u003c/a>, \u003ca href=\"#ginseng-seeds\" data-to=\"ginseng-seeds\">Ginseng seeds\u003c/a>, \u003ca href=\"#blue-lotus-seeds\" data-to=\"blue-lotus-seeds\">Blue lotus seeds\u003c/a>. See \u003ca href=\"#shops\" data-to=\"shops\">Shops\u003c/a>.\u003c/p>","src":["wiki/pages/person-odo.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"farming","t":"Farming","c":"Skills","i":"🌾","sum":"Buy a plot at the farm (east of the island, over the second bridge) from Farmer Odo, plant his seeds, and come back to harvest. Crops grow even while you're logged out. Farmer Odo teaches it.","a":[],"ib":[["Discipline","🌿 Endurance"],["Taught by","\u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>"],["Max level","99"]],"h":"\u003cp>🌾 \u003cb>Farming\u003c/b> is a skill in \u003ca href=\"#endurance\" data-to=\"endurance\">Endurance\u003c/a>. Buy a plot at the farm (east of the island, over the second bridge) from Farmer Odo, plant his seeds, and come back to harvest. Crops grow even while you're logged out. Farmer Odo teaches it.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#something-to-grow\" data-to=\"something-to-grow\">Something to grow\u003c/a>, from \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🌱 Green thumb\u003c/td>\u003ctd>crops ripen 5% sooner\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍀 Bumper crop\u003c/td>\u003ctd>5% chance of an extra one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪶 Light work\u003c/td>\u003ctd>10% chance it costs no stamina\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>See \u003ca href=\"#crops\" data-to=\"crops\">Crops\u003c/a> for what grows, and how long it takes.\u003c/p>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"feathers","t":"Feathers","c":"Items","i":"🪶","sum":"Monster drop. Sells for 1 bronze.","a":["feather"],"ib":[["Kind","Monster drops"],["Shop pays","1 bronze"],["Game id","\u003ccode>feather\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#chicken\" data-to=\"chicken\">Chicken\u003c/a> (60%).\u003c/li>\u003cli>Sold by \u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#glow-bait\" data-to=\"glow-bait\">Glow bait\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"firebolt","t":"Firebolt","c":"Spells","i":"🔥","sum":"A bolt of flame from your staff.","a":[],"ib":[["Spellcasting level","1"],["Mana","4"],["Kind","Bolt (from a staff)"],["Learned from","Levelling up"]],"h":"\u003cp>🔥 A bolt of flame from your staff.\u003c/p>\n\u003cp>It needs \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a> level 1 and costs 4 mana at Mastery 1 (Mastery lowers the cost). Its biggest hit is 4, plus your staff's bonus.\u003c/p>","src":["shared/combat.ts","shared/spells.ts"],"w":false,"r":false},{"s":"fishing","t":"Fishing","c":"Skills","i":"🎣","sum":"Click the water's edge to fish.","a":[],"ib":[["Discipline","🌿 Endurance"],["Taught by","\u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>"],["Max level","99"]],"h":"\u003cp>🎣 \u003cb>Fishing\u003c/b> is a skill in \u003ca href=\"#endurance\" data-to=\"endurance\">Endurance\u003c/a>. Click the water's edge to fish.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#living-off-the-land\" data-to=\"living-off-the-land\">Living off the land\u003c/a>, from \u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>⏩ Quick hands\u003c/td>\u003ctd>5% faster\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍀 Lucky find\u003c/td>\u003ctd>4% chance of an extra one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📖 Quick learner\u003c/td>\u003ctd>10% more XP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-what-you-can-gather\">What you can gather\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>From\u003c/th>\u003cth>Gives\u003c/th>\u003cth>XP\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Shallow water\u003c/td>\u003ctd>\u003ca href=\"#minnow\" data-to=\"minnow\">Minnow\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Trout spot\u003c/td>\u003ctd>\u003ca href=\"#trout\" data-to=\"trout\">Trout\u003c/a>\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>Perch spot\u003c/td>\u003ctd>\u003ca href=\"#perch\" data-to=\"perch\">Perch\u003c/a>\u003c/td>\u003ctd>6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20\u003c/td>\u003ctd>Salmon spot\u003c/td>\u003ctd>\u003ca href=\"#salmon\" data-to=\"salmon\">Salmon\u003c/a>\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>30\u003c/td>\u003ctd>Pike spot\u003c/td>\u003ctd>\u003ca href=\"#pike\" data-to=\"pike\">Pike\u003c/a>\u003c/td>\u003ctd>15\u003c/td>\u003c/tr>\u003ctr>\u003ctd>45\u003c/td>\u003ctd>Tuna spot\u003c/td>\u003ctd>\u003ca href=\"#tuna\" data-to=\"tuna\">Tuna\u003c/a>\u003c/td>\u003ctd>24\u003c/td>\u003c/tr>\u003ctr>\u003ctd>60\u003c/td>\u003ctd>Swordfish spot\u003c/td>\u003ctd>\u003ca href=\"#swordfish\" data-to=\"swordfish\">Swordfish\u003c/a>\u003c/td>\u003ctd>36\u003c/td>\u003c/tr>\u003ctr>\u003ctd>75\u003c/td>\u003ctd>Eel spot\u003c/td>\u003ctd>\u003ca href=\"#eel\" data-to=\"eel\">Eel\u003c/a>\u003c/td>\u003ctd>50\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"fishing-rod","t":"Fishing rod","c":"Items","i":"🎣","sum":"A tool for Fishing.","a":[],"ib":[["Helps","Fishing"],["Effect","Faster"]],"h":"\u003cp>The fishing rod helps \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a>: you gather faster. Better metal and better wood make it stronger and last longer. See \u003ca href=\"#tools\" data-to=\"tools\">Tools\u003c/a> for every metal and wood. Smiths make them at the anvil with \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>.\u003c/p>","src":["shared/tools.ts"],"w":false,"r":false},{"s":"folded-note","t":"Folded note","c":"Items","i":"✉️","sum":"It fell out of Rook's totem. It's sealed with a blob of wax.","a":[],"ib":[["Kind","Story items"],["Shop pays","Can't be sold"],["Game id","\u003ccode>rooks_note\u003c/code>"]],"h":"\u003cp>It fell out of Rook's totem. It's sealed with a blob of wax.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Given in the quest \u003ca href=\"#the-totem\" data-to=\"the-totem\">The Totem\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"food-scraps","t":"Food scraps","c":"Items","i":"🦴","sum":"Materials and food. Sells for 1 bronze.","a":[],"ib":[["Kind","Materials and food"],["Shop pays","1 bronze"],["Game id","\u003ccode>food_scraps\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cp>Nowhere in the game yet.\u003c/p>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#chum-bait\" data-to=\"chum-bait\">Chum bait\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"foraging","t":"Foraging","c":"Skills","i":"🌱","sum":"Click a glinting dig patch to dig it up with a shovel: roots, mushrooms, worms, herbs, old bones, truffles, and moonpetal at night. Herbalist Wren teaches it.","a":[],"ib":[["Discipline","🌿 Endurance"],["Taught by","\u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a>"],["Max level","99"]],"h":"\u003cp>🌱 \u003cb>Foraging\u003c/b> is a skill in \u003ca href=\"#endurance\" data-to=\"endurance\">Endurance\u003c/a>. Click a glinting dig patch to dig it up with a shovel: roots, mushrooms, worms, herbs, old bones, truffles, and moonpetal at night. Herbalist Wren teaches it.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#what-the-ground-gives\" data-to=\"what-the-ground-gives\">What the ground gives\u003c/a>, from \u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>⏩ Quick hands\u003c/td>\u003ctd>5% faster\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍀 Lucky find\u003c/td>\u003ctd>4% chance of an extra one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪶 Light work\u003c/td>\u003ctd>8% chance it costs no stamina\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-what-you-can-gather\">What you can gather\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>From\u003c/th>\u003cth>Gives\u003c/th>\u003cth>XP\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Dig patch\u003c/td>\u003ctd>\u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-what-you-can-dig-up\">What you can dig up\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Find\u003c/th>\u003cth>XP\u003c/th>\u003cth>Note\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003ca href=\"#wild-roots\" data-to=\"wild-roots\">Wild roots\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003ca href=\"#red-cap-mushrooms\" data-to=\"red-cap-mushrooms\">Red cap mushrooms\u003c/a>\u003c/td>\u003ctd>3\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003ca href=\"#mushrooms\" data-to=\"mushrooms\">Mushrooms\u003c/a>\u003c/td>\u003ctd>3\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>\u003ca href=\"#sage\" data-to=\"sage\">Sage\u003c/a>\u003c/td>\u003ctd>5\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>\u003ca href=\"#ginseng-roots\" data-to=\"ginseng-roots\">Ginseng roots\u003c/a>\u003c/td>\u003ctd>6\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>\u003ca href=\"#wild-honeycomb\" data-to=\"wild-honeycomb\">Wild honeycomb\u003c/a>\u003c/td>\u003ctd>7\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>\u003ca href=\"#old-bones\" data-to=\"old-bones\">Old bones\u003c/a>\u003c/td>\u003ctd>7\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>\u003ca href=\"#blue-lotus\" data-to=\"blue-lotus\">Blue lotus\u003c/a>\u003c/td>\u003ctd>8\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>\u003ca href=\"#moonpetal\" data-to=\"moonpetal\">Moonpetal\u003c/a>\u003c/td>\u003ctd>9\u003c/td>\u003ctd>Night only\u003c/td>\u003c/tr>\u003ctr>\u003ctd>15\u003c/td>\u003ctd>\u003ca href=\"#truffles\" data-to=\"truffles\">Truffles\u003c/a>\u003c/td>\u003ctd>14\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"forester-holt","t":"Forester Holt","c":"People","i":"🪓","sum":"Teaches Woodcutting. Remembers when the Thornwood glowed.","a":[],"ib":[["Found in","Forester Holt's house"],["Shop","Yes"],["Game id","\u003ccode>holt\u003c/code>"]],"h":"\u003cp>\u003cb>Forester Holt\u003c/b> teaches \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a> on Trainer Row. The trees nearest the shrines go dark first, and he's been counting them (\u003ca href=\"#what-holt-saw\" data-to=\"what-holt-saw\">What Holt Saw\u003c/a>). He remembers when \u003ca href=\"#the-thornwood\" data-to=\"the-thornwood\">The Thornwood\u003c/a> still glowed at night.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;I buy logs and axes, and I sell bronze axes and logs.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#forester-holts-house\" data-to=\"forester-holts-house\">Forester Holt's house\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#the-woodcutters-start\" data-to=\"the-woodcutters-start\">The woodcutter's start\u003c/a> (lessons)\u003c/li>\u003cli>\u003ca href=\"#what-holt-saw\" data-to=\"what-holt-saw\">What Holt Saw\u003c/a> (Act 1)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Shop:\u003c/b> buys logs and axes. Sells: \u003ca href=\"#axe\" data-to=\"axe\">Bronze axe (Pine)\u003c/a>, \u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>, \u003ca href=\"#oak-logs\" data-to=\"oak-logs\">Oak logs\u003c/a>, \u003ca href=\"#birch-logs\" data-to=\"birch-logs\">Birch logs\u003c/a>, \u003ca href=\"#maple-logs\" data-to=\"maple-logs\">Maple logs\u003c/a>, \u003ca href=\"#yew-logs\" data-to=\"yew-logs\">Yew logs\u003c/a>, \u003ca href=\"#ironwood-logs\" data-to=\"ironwood-logs\">Ironwood logs\u003c/a>, \u003ca href=\"#elderwood-logs\" data-to=\"elderwood-logs\">Elderwood logs\u003c/a>. With more \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a>: \u003ca href=\"#axe\" data-to=\"axe\">Iron axe (Oak)\u003c/a> (Trading 10), \u003ca href=\"#axe\" data-to=\"axe\">Steel axe (Maple)\u003c/a> (Trading 25), \u003ca href=\"#axe\" data-to=\"axe\">Mithril axe (Yew)\u003c/a> (Trading 40). See \u003ca href=\"#shops\" data-to=\"shops\">Shops\u003c/a>.\u003c/p>","src":["wiki/pages/person-holt.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"forester-holts-house","t":"Forester Holt's house","c":"Places","i":"🏠","sum":"","a":[],"ib":[["Kind","Indoors"],["Danger","Safe"],["Size","9 × 8 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"holt\">\u003c/figure>\n\u003cp>\u003cb>People here:\u003c/b> \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>.\u003c/p>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"frost-bolt","t":"Frost bolt","c":"Spells","i":"❄️","sum":"Hits, and freezes the monster in place for about 5 seconds.","a":[],"ib":[["Spellcasting level","5"],["Mana","7"],["Kind","Bolt (from a staff)"],["Learned from","Levelling up"]],"h":"\u003cp>❄️ Hits, and freezes the monster in place for about 5 seconds.\u003c/p>\n\u003cp>It needs \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a> level 5 and costs 7 mana at Mastery 1 (Mastery lowers the cost). Its biggest hit is 5, plus your staff's bonus.\u003c/p>","src":["shared/combat.ts","shared/spells.ts"],"w":false,"r":false},{"s":"frost-nova","t":"Frost nova","c":"Spells","i":"🌨️","sum":"Hits every monster next to you (2 tiles) and freezes them.","a":[],"ib":[["Spellcasting level","20"],["Mana","18"],["Kind","All around you"],["Learned from","A spell book"]],"h":"\u003cp>🌨️ Hits every monster next to you (2 tiles) and freezes them.\u003c/p>\n\u003cp>It needs \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a> level 20 and costs 18 mana at Mastery 1 (Mastery lowers the cost). Its biggest hit is 6.\u003c/p>\n\u003cp>Learn it by reading \u003ca href=\"#spell-book-frost-nova\" data-to=\"spell-book-frost-nova\">Spell book: Frost nova\u003c/a>, which \u003ca href=\"#giant-spider\" data-to=\"giant-spider\">Giant spider\u003c/a> sometimes drop.\u003c/p>","src":["shared/combat.ts","shared/spells.ts"],"w":false,"r":false},{"s":"frostfell","t":"Frostfell","c":"Places","i":"❄️","sum":"Frozen tundra and ice, with the oldest shrine frozen solid.","a":[],"ib":[["Levels","55 to 70"]],"h":"\u003cp>\u003cb>Frostfell\u003c/b> is frozen tundra in the far north, with the oldest shrine frozen solid.\u003c/p>\n\u003cp>It's the farthest place from \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a>, so it's the first to go cold as the fire weakens. Its ice is spreading south.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The frozen shrine's plaque is signed by the whole \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">Ember Circle\u003c/a>, Vale's name first, and dated year 40.\u003c/p>\u003c/div>","src":["wiki/pages/frostfell.md"],"w":true,"r":false},{"s":"gems-and-jewelry","t":"Gems and jewelry","c":"Items","i":"💎","sum":"Gems, rings and amulets.","a":[],"ib":[],"h":"\u003cp>Gem rocks give rough gems of different sizes (carats). Cut them, set them in a ring or amulet, and wear it for a bonus. Emberstone becomes refined emberstones for \u003ca href=\"#enchanting\" data-to=\"enchanting\">Enchanting\u003c/a>.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Gem\u003c/th>\u003cth>Cut at level\u003c/th>\u003cth>Gives (per carat)\u003c/th>\u003cth>Shop pays per carat (rough)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Amethyst\u003c/td>\u003ctd>5\u003c/td>\u003ctd>+1 armor\u003c/td>\u003ctd>15 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Topaz\u003c/td>\u003ctd>10\u003c/td>\u003ctd>+0.5 hit chance\u003c/td>\u003ctd>25 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Emerald\u003c/td>\u003ctd>15\u003c/td>\u003ctd>+3 max stamina\u003c/td>\u003ctd>40 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sapphire\u003c/td>\u003ctd>20\u003c/td>\u003ctd>+2 max mana\u003c/td>\u003ctd>60 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ruby\u003c/td>\u003ctd>25\u003c/td>\u003ctd>+2 max health\u003c/td>\u003ctd>90 bronze\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-settings-page\">Settings\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Metal\u003c/th>\u003cth>Bars\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Bronze\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Silver\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Gold\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Platinum\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Iridium\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Pieces: 💍 Ring (1 bar), 📿 Amulet (2 bars).\u003c/p>","src":["shared/jewelry.ts"],"w":false,"r":false},{"s":"giant-bat","t":"Giant bat","c":"Monsters","i":"🦇","sum":"A level 6 monster. Attacks on sight.","a":[],"ib":[["Level","6"],["Health","14"],["Biggest hit","2"],["Attacks every","1.8s"],["Temper","Attacks on sight"],["Out","Night only"],["Comes back after","48s"],["Coins","0 to 3 bronze"]],"h":"\u003cp>The \u003cb>Giant bat\u003c/b> is a level 6 monster with 14 health. Attacks on sight. It's only out at night: it vanishes at sunrise and comes back at dusk.\u003c/p>\n\u003cp>Defeating one gives 6 bonus XP on top of 1 XP per point of damage, plus 12 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>Heartvale, near the lake (3), Heartvale, near the Emberhall (1), Heartvale, near Pasture (2), The Thornwood, near Graveyard (2), The Thornwood (1).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🦇 \u003ca href=\"#bat-wings\" data-to=\"bat-wings\">Bat wings\u003c/a>\u003c/td>\u003ctd>60%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>It also drops 0 to 3 bronze coins.\u003c/p>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"giant-spider","t":"Giant spider","c":"Monsters","i":"🕷️","sum":"A level 18 monster. Attacks on sight.","a":[],"ib":[["Level","18"],["Health","42"],["Biggest hit","6"],["Attacks every","1.8s"],["Temper","Attacks on sight"],["Out","Day and night"],["Comes back after","72s"],["Coins","5 to 15 bronze"]],"h":"\u003cp>The \u003cb>Giant spider\u003c/b> is a level 18 monster with 42 health. Attacks on sight.\u003c/p>\n\u003cp>Defeating one gives 18 bonus XP on top of 1 XP per point of damage, plus 36 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>The Thornwood, near Spider hollow (4).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🕸️ \u003ca href=\"#spider-silk\" data-to=\"spider-silk\">Spider silk\u003c/a>\u003c/td>\u003ctd>50%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧪 \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>\u003c/td>\u003ctd>10%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📘 \u003ca href=\"#spell-book-frost-nova\" data-to=\"spell-book-frost-nova\">Spell book: Frost nova\u003c/a>\u003c/td>\u003ctd>2%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>It also drops 5 to 15 bronze coins.\u003c/p>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"ginseng-roots","t":"Ginseng roots","c":"Items","i":"🫚","sum":"Herbs, roots and crop. Sells for 6 bronze.","a":["ginseng root"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","6 bronze"],["Game id","\u003ccode>ginseng\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dug up with \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> level 6 (6 XP).\u003c/li>\u003cli>Grown with \u003ca href=\"#farming\" data-to=\"farming\">Farming\u003c/a> level 20: ripe after 120 minutes, 1 to 2 a tile.\u003c/li>\u003cli>Sold by \u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a> once your \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a> is 20.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Half of the recipe for the \u003ca href=\"#stamina-potion\" data-to=\"stamina-potion\">Stamina potion\u003c/a>.\u003c/li>\u003cli>Half of the recipe for the \u003ca href=\"#swiftness-potion\" data-to=\"swiftness-potion\">Swiftness potion\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"ginseng-seeds","t":"Ginseng seeds","c":"Items","i":"🌱","sum":"Seed. Sells for 8 bronze.","a":["ginseng seed"],"ib":[["Kind","Seeds"],["Shop pays","8 bronze"],["Game id","\u003ccode>seed_ginseng\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"glow-bait","t":"Glow bait","c":"Items","i":"✨","sum":"Materials and food. Sells for 3 bronze.","a":[],"ib":[["Kind","Materials and food"],["Shop pays","3 bronze"],["Game id","\u003ccode>bait_glow\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>, \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>, \u003ca href=\"#feathers\" data-to=\"feathers\">Feathers\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cp>Nowhere in the game yet.\u003c/p>","src":["shared/items.ts"],"w":false,"r":false},{"s":"goblin","t":"Goblin","c":"Monsters","i":"👺","sum":"A level 12 monster. Attacks on sight.","a":[],"ib":[["Level","12"],["Health","30"],["Biggest hit","4"],["Attacks every","2.4s"],["Temper","Attacks on sight"],["Out","Day and night"],["Comes back after","60s"],["Coins","3 to 12 bronze"]],"h":"\u003cp>The \u003cb>Goblin\u003c/b> is a level 12 monster with 30 health. Attacks on sight.\u003c/p>\n\u003cp>Defeating one gives 12 bonus XP on top of 1 XP per point of damage, plus 24 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>The Thornwood, near Goblin camp (5).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🧿 \u003ca href=\"#goblin-charms\" data-to=\"goblin-charms\">Goblin charms\u003c/a>\u003c/td>\u003ctd>35%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧪 \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>\u003c/td>\u003ctd>10%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📗 \u003ca href=\"#spell-book-haste\" data-to=\"spell-book-haste\">Spell book: Haste\u003c/a>\u003c/td>\u003ctd>2%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>It also drops 3 to 12 bronze coins.\u003c/p>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"goblin-charms","t":"Goblin charms","c":"Items","i":"🧿","sum":"Monster drop. Sells for 20 bronze.","a":["goblin charm"],"ib":[["Kind","Monster drops"],["Shop pays","20 bronze"],["Game id","\u003ccode>goblin_charm\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#goblin\" data-to=\"goblin\">Goblin\u003c/a> (35%).\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"gold-bar","t":"Gold bar","c":"Items","i":"🧈","sum":"Bar. Sells for 150 bronze.","a":[],"ib":[["Kind","Bars"],["Shop pays","150 bronze"],["Game id","\u003ccode>gold_bar\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#gold-ore\" data-to=\"gold-ore\">Gold ore\u003c/a>, \u003ca href=\"#gold-ore\" data-to=\"gold-ore\">Gold ore\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a> once your \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a> is 20.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"gold-ore","t":"Gold ore","c":"Items","i":"🪨","sum":"Ore. Sells for 60 bronze.","a":[],"ib":[["Kind","Ore"],["Shop pays","60 bronze"],["Game id","\u003ccode>gold_ore\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a> level 55 from a gold rock (30 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#gold-bar\" data-to=\"gold-bar\">Gold bar\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"greyspine-peaks","t":"Greyspine Peaks","c":"Places","i":"🏔️","sum":"Mountains, quarry, the Crystal Cave and goblin tunnels.","a":["Greyspine"],"ib":[["Levels","25 to 40"]],"h":"\u003cp>\u003cb>Greyspine Peaks\u003c/b> are the mountains north of \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>: the quarry, \u003ca href=\"#the-crystal-cave\" data-to=\"the-crystal-cave\">the Crystal Cave\u003c/a> and goblin tunnels. Warden Flint runs its great shrine (\u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwardens\u003c/a>). Goblins there sing an old \u003ca href=\"#the-hearthwise\" data-to=\"the-hearthwise\">Hearthwise\u003c/a> song to keep the grey sickness away.\u003c/p>\n\u003cp>Emberstone veins run like rivers toward the shrines. The snow line drops every year.\u003c/p>\n\u003cp>Only the quarry, the spider cave and the crystal cave are in the game so far.\u003c/p>","src":["wiki/pages/greyspine.md"],"w":true,"r":false},{"s":"groups-and-people","t":"Groups and people","c":"People","i":"👥","sum":"Every group and character in the story, including ones not in the game yet.","a":[],"ib":[],"h":"\u003ch2 id=\"s-groups\">Groups\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Group\u003c/th>\u003cth>What everyone thinks\u003c/th>\u003cth>🔒 The truth\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>\u003c/td>\u003ctd>Noble protectors of the ember shrines.\u003c/td>\u003ctd>Most are honest. The leaders are \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> (the players)\u003c/td>\u003ctd>Heroes the shrines make from ember.\u003c/td>\u003ctd>Made of stolen ember, and farmed for it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-rooted\" data-to=\"the-rooted\">The Rooted\u003c/a>\u003c/td>\u003ctd>Ordinary townsfolk.\u003c/td>\u003ctd>Exactly that.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>\u003c/td>\u003ctd>Mad bandits who smash shrines.\u003c/td>\u003ctd>They know the truth, and are shutting the siphon down.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">The Mages' Guild\u003c/a>\u003c/td>\u003ctd>Scholars of magic and emberstone.\u003c/td>\u003ctd>Honest, but their emberstone feeds the Undying.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-wardens\" data-to=\"the-wardens\">The Wardens\u003c/a>\u003c/td>\u003ctd>Kael's rangers.\u003c/td>\u003ctd>Honest.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-blight\" data-to=\"the-blight\">The Blight\u003c/a>\u003c/td>\u003ctd>Sick, angry animals.\u003c/td>\u003ctd>Living things the ember has drained out of.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-the-emberguards-people\">The Emberguard's people\u003c/h2>\n\u003cp>\u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>, \u003ca href=\"#sister-celene\" data-to=\"sister-celene\">Sister Celene\u003c/a>, \u003ca href=\"#enchanter-vale\" data-to=\"enchanter-vale\">Enchanter Vale\u003c/a>, \u003ca href=\"#brother-oren\" data-to=\"brother-oren\">Brother Oren\u003c/a>, \u003ca href=\"#sister-lisette\" data-to=\"sister-lisette\">Sister Lisette\u003c/a>, \u003ca href=\"#brother-tomas\" data-to=\"brother-tomas\">Brother Tomas\u003c/a>, \u003ca href=\"#sister-wynne\" data-to=\"sister-wynne\">Sister Wynne\u003c/a>, and the four \u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwardens\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-the-ashbounds-people\">The Ashbound's people\u003c/h2>\n\u003cp>\u003ca href=\"#sable\" data-to=\"sable\">Sable\u003c/a>, \u003ca href=\"#rhys\" data-to=\"rhys\">Rhys\u003c/a> (later), \u003ca href=\"#tamsin\" data-to=\"tamsin\">Tamsin\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-emberholds-townsfolk\">Emberhold's townsfolk\u003c/h2>\n\u003cp>\u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>, \u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">Captain Bryn\u003c/a>, \u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>, \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>, \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>, \u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a>, \u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>, \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>, \u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a>, \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>, \u003ca href=\"#archmage-rowan\" data-to=\"archmage-rowan\">Archmage Rowan\u003c/a>, \u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">Alchemist Moss\u003c/a>, \u003ca href=\"#repairer-oswin\" data-to=\"repairer-oswin\">Repairer Oswin\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-the-past\">The past\u003c/h2>\n\u003cp>\u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a>, \u003ca href=\"#king-aldemar\" data-to=\"king-aldemar\">King Aldemar\u003c/a>, \u003ca href=\"#the-extinguished\" data-to=\"the-extinguished\">The Extinguished\u003c/a>, \u003ca href=\"#orla-the-kind\" data-to=\"orla-the-kind\">Orla the Kind\u003c/a>.\u003c/p>\n\u003cp>See also \u003ca href=\"#people-in-the-game\" data-to=\"people-in-the-game\">People in the game\u003c/a> for everyone you can talk to today.\u003c/p>","src":["wiki/pages/groups-and-people.md"],"w":true,"r":false},{"s":"hammer","t":"Hammer","c":"Items","i":"🔨","sum":"A tool for Smithing.","a":[],"ib":[["Helps","Smithing"],["Effect","Fewer failures"]],"h":"\u003cp>The hammer helps \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>: your tries fail less often. Better metal and better wood make it stronger and last longer. See \u003ca href=\"#tools\" data-to=\"tools\">Tools\u003c/a> for every metal and wood. Smiths make them at the anvil with \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>.\u003c/p>","src":["shared/tools.ts"],"w":false,"r":false},{"s":"hammer-and-fire","t":"Hammer and fire","c":"Quests","i":"📜","sum":"Lessons from Smith Brann.","a":[],"ib":[["Part of","Lessons"],["Given by","Smith Brann"],["Where","in the smithy on Trainer Row"],["Steps","7"]],"h":"\u003cp>\u003cb>Hammer and fire\u003c/b> is a lesson from \u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a>, found in the smithy on Trainer Row.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#into-the-rocks\" data-to=\"into-the-rocks\">Into the rocks\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Smith Brann at the smithy \u003ci>(you get: \u003ca href=\"#bronze-bar\" data-to=\"bronze-bar\">Bronze bar\u003c/a>, \u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>)\u003c/i>\u003c/li>\u003cli>Make a bronze hammer at the anvil (1 bronze bar + 1 log)\u003c/li>\u003cli>Equip the hammer\u003c/li>\u003cli>Go back to Smith Brann \u003ci>(you get: 2 × \u003ca href=\"#copper-ore\" data-to=\"copper-ore\">Copper ore\u003c/a>, 2 × \u003ca href=\"#tin-ore\" data-to=\"tin-ore\">Tin ore\u003c/a>)\u003c/i>\u003c/li>\u003cli>Smelt 2 bronze bars at the furnace\u003c/li>\u003cli>Make bronze platelegs at the anvil (2 bars)\u003c/li>\u003cli>Show Smith Brann your platelegs \u003ci>(you get: \u003ca href=\"#tongs\" data-to=\"tongs\">Bronze tongs\u003c/a>, \u003ca href=\"#hammer\" data-to=\"hammer\">Bronze hammer (Oak)\u003c/a>)\u003c/i>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>, \u003ca href=\"#smelting\" data-to=\"smelting\">Smelting\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#bronze-bar\" data-to=\"bronze-bar\">Bronze bar\u003c/a>, \u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>, \u003ca href=\"#copper-ore\" data-to=\"copper-ore\">Copper ore\u003c/a>, \u003ca href=\"#tin-ore\" data-to=\"tin-ore\">Tin ore\u003c/a>, \u003ca href=\"#tongs\" data-to=\"tongs\">Bronze tongs\u003c/a>, \u003ca href=\"#hammer\" data-to=\"hammer\">Bronze hammer (Oak)\u003c/a>, 1.5 silver.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> Mind the sparks! I'm Brann. I'll teach you Smithing at the anvil and Smelting at the furnace. Both are part of Dexterity. A tool is a head and a handle: 1 metal bar for the head, and 1 log for the handle. A hammer on your belt helps you smith, the way a pot helps you cook. Here's a bronze bar and a log. Make yourself a bronze hammer at the anvil.\u003c/p>\n\u003cp>\u003cb>Step 4.\u003c/b> Now for the fire. Every bar takes 2 ores: a bronze bar is 1 copper and 1 tin. Tongs on your belt help you smelt. Here's 2 copper and 2 tin. Smelt 2 bronze bars at the furnace, then make bronze platelegs at the anvil from both bars. I'll guide your hand.\u003c/p>\n\u003cp>\u003cb>Step 7.\u003c/b> Fine work! Weapons and armor are made just like tools, and they wear out like tools too, so keep a spare. Take these bronze tongs and a bronze hammer with a good oak handle. With those on your belt, you'll fail much less at the furnace and the anvil. You Emberborn wear out my tools faster than anyone. Not that I'm complaining about the business.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"handicraft","t":"Handicraft","c":"Skills","i":"🧵","sum":"Use Woodworker Rook's workshop: fishing bait, bows, arrows and staffs at the workbench, leather at the tanning rack (outside), thread and cloth at the spinning wheel, and leather and cloth armor.","a":[],"ib":[["Discipline","🤲 Dexterity"],["Taught by","\u003ca
