d note","c":"Items","i":"✉️","sum":"It fell out of Rook's totem. It's sealed with a blob of wax.","a":[],"ib":[["Kind","Story items"],["Shop pays","Can't be sold"],["Game id","\u003ccode>rooks_note\u003c/code>"]],"h":"\u003cp>It fell out of Rook's totem. It's sealed with a blob of wax.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Given in the quest \u003ca href=\"#the-totem\" data-to=\"the-totem\">The Totem\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"food-scraps","t":"Food scraps","c":"Items","i":"🦴","sum":"Materials and food. Sells for 1 bronze.","a":[],"ib":[["Kind","Materials and food"],["Shop pays","1 bronze"],["Game id","\u003ccode>food_scraps\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cp>Nowhere in the game yet.\u003c/p>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#chum-bait\" data-to=\"chum-bait\">Chum bait\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"foraging","t":"Foraging","c":"Skills","i":"🌱","sum":"Click a glinting dig patch to dig it up with a shovel: roots, mushrooms, worms, herbs, old bones, truffles, and moonpetal at night. Herbalist Wren teaches it.","a":[],"ib":[["Discipline","🌿 Endurance"],["Taught by","\u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a>"],["Max level","99"]],"h":"\u003cp>🌱 \u003cb>Foraging\u003c/b> is a skill in \u003ca href=\"#endurance\" data-to=\"endurance\">Endurance\u003c/a>. Click a glinting dig patch to dig it up with a shovel: roots, mushrooms, worms, herbs, old bones, truffles, and moonpetal at night. Herbalist Wren teaches it.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#what-the-ground-gives\" data-to=\"what-the-ground-gives\">What the ground gives\u003c/a>, from \u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>⏩ Quick hands\u003c/td>\u003ctd>5% faster\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍀 Lucky find\u003c/td>\u003ctd>4% chance of an extra one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪶 Light work\u003c/td>\u003ctd>8% chance it costs no stamina\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-what-you-can-gather\">What you can gather\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>From\u003c/th>\u003cth>Gives\u003c/th>\u003cth>XP\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Dig patch\u003c/td>\u003ctd>\u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-what-you-can-dig-up\">What you can dig up\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Find\u003c/th>\u003cth>XP\u003c/th>\u003cth>Note\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003ca href=\"#wild-roots\" data-to=\"wild-roots\">Wild roots\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003ca href=\"#red-cap-mushrooms\" data-to=\"red-cap-mushrooms\">Red cap mushrooms\u003c/a>\u003c/td>\u003ctd>3\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003ca href=\"#mushrooms\" data-to=\"mushrooms\">Mushrooms\u003c/a>\u003c/td>\u003ctd>3\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>\u003ca href=\"#sage\" data-to=\"sage\">Sage\u003c/a>\u003c/td>\u003ctd>5\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>\u003ca href=\"#ginseng-roots\" data-to=\"ginseng-roots\">Ginseng roots\u003c/a>\u003c/td>\u003ctd>6\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>\u003ca href=\"#wild-honeycomb\" data-to=\"wild-honeycomb\">Wild honeycomb\u003c/a>\u003c/td>\u003ctd>7\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>\u003ca href=\"#old-bones\" data-to=\"old-bones\">Old bones\u003c/a>\u003c/td>\u003ctd>7\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>\u003ca href=\"#blue-lotus\" data-to=\"blue-lotus\">Blue lotus\u003c/a>\u003c/td>\u003ctd>8\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>\u003ca href=\"#moonpetal\" data-to=\"moonpetal\">Moonpetal\u003c/a>\u003c/td>\u003ctd>9\u003c/td>\u003ctd>Night only\u003c/td>\u003c/tr>\u003ctr>\u003ctd>15\u003c/td>\u003ctd>\u003ca href=\"#truffles\" data-to=\"truffles\">Truffles\u003c/a>\u003c/td>\u003ctd>14\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"forester-holt","t":"Forester Holt","c":"People","i":"🪓","sum":"Teaches Woodcutting. Remembers when the Thornwood glowed.","a":[],"ib":[["Found in","Emberhold"],["Shop","Yes"],["Game id","\u003ccode>holt\u003c/code>"]],"h":"\u003cp>\u003cb>Forester Holt\u003c/b> teaches \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a> in the \u003ca href=\"#emberhall-training-ground\" data-to=\"emberhall-training-ground\">Emberhall Training Ground\u003c/a>. The trees out at the valley's edge are dying, the dead line creeps closer every year, and he's been counting them (\u003ca href=\"#what-holt-saw\" data-to=\"what-holt-saw\">What Holt Saw\u003c/a>). He remembers when \u003ca href=\"#the-thornwood\" data-to=\"the-thornwood\">The Thornwood\u003c/a> still glowed at night.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;I buy logs and axes, and I sell bronze axes and logs.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#the-woodcutters-start\" data-to=\"the-woodcutters-start\">The woodcutter's start\u003c/a> (lessons)\u003c/li>\u003cli>\u003ca href=\"#what-holt-saw\" data-to=\"what-holt-saw\">What Holt Saw\u003c/a> (Act 1)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Shop:\u003c/b> buys logs and axes. Sells: \u003ca href=\"#axe\" data-to=\"axe\">Bronze axe (Pine)\u003c/a>, \u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>, \u003ca href=\"#oak-logs\" data-to=\"oak-logs\">Oak logs\u003c/a>, \u003ca href=\"#birch-logs\" data-to=\"birch-logs\">Birch logs\u003c/a>, \u003ca href=\"#maple-logs\" data-to=\"maple-logs\">Maple logs\u003c/a>, \u003ca href=\"#yew-logs\" data-to=\"yew-logs\">Yew logs\u003c/a>, \u003ca href=\"#ironwood-logs\" data-to=\"ironwood-logs\">Ironwood logs\u003c/a>, \u003ca href=\"#elderwood-logs\" data-to=\"elderwood-logs\">Elderwood logs\u003c/a>. With more \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a>: \u003ca href=\"#axe\" data-to=\"axe\">Iron axe (Oak)\u003c/a> (Trading 10), \u003ca href=\"#axe\" data-to=\"axe\">Steel axe (Maple)\u003c/a> (Trading 25), \u003ca href=\"#axe\" data-to=\"axe\">Mithril axe (Yew)\u003c/a> (Trading 40). See \u003ca href=\"#shops\" data-to=\"shops\">Shops\u003c/a>.\u003c/p>","src":["wiki/pages/person-holt.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"forester-holts-house","t":"Forester Holt's house","c":"Places","i":"🏠","sum":"","a":[],"ib":[["Kind","Indoors"],["Danger","Safe"],["Size","9 × 8 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"holt\">\u003c/figure>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"frost-bolt","t":"Frost bolt","c":"Spells","i":"❄️","sum":"Hits, and freezes the monster in place for about 5 seconds.","a":[],"ib":[["Spellcasting level","5"],["Mana","7"],["Kind","Bolt (from a staff)"],["Learned from","Levelling up"]],"h":"\u003cp>❄️ Hits, and freezes the monster in place for about 5 seconds.\u003c/p>\n\u003cp>It needs \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a> level 5 and costs 7 mana at Mastery 1 (Mastery lowers the cost). Its biggest hit is 5, plus your staff's bonus.\u003c/p>","src":["shared/combat.ts","shared/spells.ts"],"w":false,"r":false},{"s":"frost-nova","t":"Frost nova","c":"Spells","i":"🌨️","sum":"Hits every monster next to you (2 tiles) and freezes them.","a":[],"ib":[["Spellcasting level","20"],["Mana","18"],["Kind","All around you"],["Learned from","A spell book"]],"h":"\u003cp>🌨️ Hits every monster next to you (2 tiles) and freezes them.\u003c/p>\n\u003cp>It needs \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a> level 20 and costs 18 mana at Mastery 1 (Mastery lowers the cost). Its biggest hit is 6.\u003c/p>\n\u003cp>Learn it by reading \u003ca href=\"#spell-book-frost-nova\" data-to=\"spell-book-frost-nova\">Spell book: Frost nova\u003c/a>, which \u003ca href=\"#giant-spider\" data-to=\"giant-spider\">Giant spider\u003c/a> sometimes drop.\u003c/p>","src":["shared/combat.ts","shared/spells.ts"],"w":false,"r":false},{"s":"frostfell","t":"Frostfell","c":"Places","i":"❄️","sum":"Frozen tundra, with Wick's great shrine frozen solid.","a":[],"ib":[["Levels","60 to 70 (opens in Act 4)"],["Home of","Mithril, sapphires and thick furs (see \u003ca href=\"#resources-by-region\" data-to=\"resources-by-region\">Resources by region\u003c/a>)"]],"h":"\u003cp>\u003cb>Frostfell\u003c/b> is frozen tundra in the far north. Its great shrine, raised by \u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a> after the Emberfall, has been frozen solid since the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>, and it has no city around it any more, only trappers and ruins under the snow.\u003c/p>\n\u003cp>The Emberguard teach that Wick's curse froze it when he fled. Its ice is spreading south.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The victors of the Sundering War took Wick's shrine and cut him off from it, and with no keeper, the region froze. In Act 4, Frostfell is the last stop before Vale: players thaw Wick's shrine and free it, giving Wick back enough strength to face Vale. The frozen shrine's plaque still has all nine names of \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a> carved on it, Wick's included and unscratched: the one place the Undying never got to.\u003c/p>\u003c/div>","src":["wiki/pages/frostfell.md"],"w":true,"r":false},{"s":"gems-and-jewelry","t":"Gems and jewelry","c":"Items","i":"💎","sum":"Gems, rings and amulets.","a":[],"ib":[],"h":"\u003cp>Gem rocks give rough gems of different sizes (carats). Cut them, set them in a ring or amulet, and wear it for a bonus. Emberstone becomes refined emberstones for \u003ca href=\"#enchanting\" data-to=\"enchanting\">Enchanting\u003c/a>.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Gem\u003c/th>\u003cth>Cut at level\u003c/th>\u003cth>Gives (per carat)\u003c/th>\u003cth>Shop pays per carat (rough)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Amethyst\u003c/td>\u003ctd>5\u003c/td>\u003ctd>+1 armor\u003c/td>\u003ctd>15 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Topaz\u003c/td>\u003ctd>10\u003c/td>\u003ctd>+0.5 hit chance\u003c/td>\u003ctd>25 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Emerald\u003c/td>\u003ctd>15\u003c/td>\u003ctd>+3 max stamina\u003c/td>\u003ctd>40 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sapphire\u003c/td>\u003ctd>20\u003c/td>\u003ctd>+2 max mana\u003c/td>\u003ctd>60 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ruby\u003c/td>\u003ctd>25\u003c/td>\u003ctd>+2 max health\u003c/td>\u003ctd>90 bronze\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-settings-page\">Settings\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Metal\u003c/th>\u003cth>Bars\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Bronze\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Silver\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Gold\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Platinum\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Iridium\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Pieces: 💍 Ring (1 bar), 📿 Amulet (2 bars).\u003c/p>","src":["shared/jewelry.ts"],"w":false,"r":false},{"s":"giant-bat","t":"Giant bat","c":"Monsters","i":"🦇","sum":"A level 6 monster. Attacks on sight.","a":[],"ib":[["Level","6"],["Health","14"],["Biggest hit","2"],["Attacks every","1.8s"],["Temper","Attacks on sight"],["Out","Night only"],["Comes back after","48s"],["Coins","0 to 3 bronze"]],"h":"\u003cp>The \u003cb>Giant bat\u003c/b> is a level 6 monster with 14 health. Attacks on sight. It's only out at night: it vanishes at sunrise and comes back at dusk.\u003c/p>\n\u003cp>Defeating one gives 6 bonus XP on top of 1 XP per point of damage, plus 12 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>Heartvale, near the lake (3), Heartvale, near the Emberhall (1), Heartvale, near Pasture (2), The Thornwood, near Graveyard (2), The Thornwood (1).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🦇 \u003ca href=\"#bat-wings\" data-to=\"bat-wings\">Bat wings\u003c/a>\u003c/td>\u003ctd>60%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>It also drops 0 to 3 bronze coins.\u003c/p>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"giant-spider","t":"Giant spider","c":"Monsters","i":"🕷️","sum":"A level 18 monster. Attacks on sight.","a":[],"ib":[["Level","18"],["Health","42"],["Biggest hit","6"],["Attacks every","1.8s"],["Temper","Attacks on sight"],["Out","Day and night"],["Comes back after","72s"],["Coins","5 to 15 bronze"]],"h":"\u003cp>The \u003cb>Giant spider\u003c/b> is a level 18 monster with 42 health. Attacks on sight.\u003c/p>\n\u003cp>Defeating one gives 18 bonus XP on top of 1 XP per point of damage, plus 36 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>The Thornwood, near Spider hollow (4).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🕸️ \u003ca href=\"#spider-silk\" data-to=\"spider-silk\">Spider silk\u003c/a>\u003c/td>\u003ctd>50%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧪 \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>\u003c/td>\u003ctd>10%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📘 \u003ca href=\"#spell-book-frost-nova\" data-to=\"spell-book-frost-nova\">Spell book: Frost nova\u003c/a>\u003c/td>\u003ctd>2%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>It also drops 5 to 15 bronze coins.\u003c/p>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"ginseng-roots","t":"Ginseng roots","c":"Items","i":"🫚","sum":"Herbs, roots and crop. Sells for 6 bronze.","a":["ginseng root"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","6 bronze"],["Game id","\u003ccode>ginseng\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dug up with \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> level 6 (6 XP).\u003c/li>\u003cli>Grown with \u003ca href=\"#farming\" data-to=\"farming\">Farming\u003c/a> level 20: ripe after 120 minutes, 1 to 2 a tile.\u003c/li>\u003cli>Sold by \u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a> once your \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a> is 20.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Half of the recipe for the \u003ca href=\"#stamina-potion\" data-to=\"stamina-potion\">Stamina potion\u003c/a>.\u003c/li>\u003cli>Half of the recipe for the \u003ca href=\"#swiftness-potion\" data-to=\"swiftness-potion\">Swiftness potion\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"ginseng-seeds","t":"Ginseng seeds","c":"Items","i":"🌱","sum":"Seed. Sells for 8 bronze.","a":["ginseng seed"],"ib":[["Kind","Seeds"],["Shop pays","8 bronze"],["Game id","\u003ccode>seed_ginseng\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"glow-bait","t":"Glow bait","c":"Items","i":"✨","sum":"Materials and food. Sells for 3 bronze.","a":[],"ib":[["Kind","Materials and food"],["Shop pays","3 bronze"],["Game id","\u003ccode>bait_glow\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>, \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>, \u003ca href=\"#feathers\" data-to=\"feathers\">Feathers\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cp>Nowhere in the game yet.\u003c/p>","src":["shared/items.ts"],"w":false,"r":false},{"s":"goblin","t":"Goblin","c":"Monsters","i":"👺","sum":"A level 12 monster. Attacks on sight.","a":[],"ib":[["Level","12"],["Health","30"],["Biggest hit","4"],["Attacks every","2.4s"],["Temper","Attacks on sight"],["Out","Day and night"],["Comes back after","60s"],["Coins","3 to 12 bronze"]],"h":"\u003cp>The \u003cb>Goblin\u003c/b> is a level 12 monster with 30 health. Attacks on sight.\u003c/p>\n\u003cp>Defeating one gives 12 bonus XP on top of 1 XP per point of damage, plus 24 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>The Thornwood, near Goblin camp (5).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🧿 \u003ca href=\"#goblin-charms\" data-to=\"goblin-charms\">Goblin charms\u003c/a>\u003c/td>\u003ctd>35%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧪 \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>\u003c/td>\u003ctd>10%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📗 \u003ca href=\"#spell-book-haste\" data-to=\"spell-book-haste\">Spell book: Haste\u003c/a>\u003c/td>\u003ctd>2%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>It also drops 3 to 12 bronze coins.\u003c/p>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"goblin-charms","t":"Goblin charms","c":"Items","i":"🧿","sum":"Monster drop. Sells for 20 bronze.","a":["goblin charm"],"ib":[["Kind","Monster drops"],["Shop pays","20 bronze"],["Game id","\u003ccode>goblin_charm\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#goblin\" data-to=\"goblin\">Goblin\u003c/a> (35%).\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"gold-bar","t":"Gold bar","c":"Items","i":"🧈","sum":"Bar. Sells for 150 bronze.","a":[],"ib":[["Kind","Bars"],["Shop pays","150 bronze"],["Game id","\u003ccode>gold_bar\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#gold-ore\" data-to=\"gold-ore\">Gold ore\u003c/a>, \u003ca href=\"#gold-ore\" data-to=\"gold-ore\">Gold ore\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a> once your \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a> is 20.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"gold-ore","t":"Gold ore","c":"Items","i":"🪨","sum":"Ore. Sells for 60 bronze.","a":[],"ib":[["Kind","Ore"],["Shop pays","60 bronze"],["Game id","\u003ccode>gold_ore\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a> level 55 from a gold rock (30 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#gold-bar\" data-to=\"gold-bar\">Gold bar\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"greyspine-peaks","t":"Greyspine Peaks","c":"Places","i":"🏔️","sum":"Volcanic mountains: quarry, the Crystal Cave and goblin tunnels.","a":["Greyspine"],"ib":[["Levels","20 to 60 (easy near the city, harder further out)"],["Home of","Mining: iron, coal, silver, emberstone and rubies (see \u003ca href=\"#resources-by-region\" data-to=\"resources-by-region\">Resources by region\u003c/a>)"]],"h":"\u003cp>\u003cb>Greyspine Peaks\u003c/b> are the volcanic mountains north of \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>: the quarry, \u003ca href=\"#the-crystal-cave\" data-to=\"the-crystal-cave\">the Crystal Cave\u003c/a> and goblin tunnels. Warden Flint keeps its great shrine (\u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwardens\u003c/a>). Goblins there sing an old \u003ca href=\"#the-tenders\" data-to=\"the-tenders\">Tender\u003c/a> song to keep the grey sickness away.\u003c/p>\n\u003cp>Far from the shrine, the mountains are waking up: old vents smoke, and every few years one erupts.\u003c/p>\n\u003cp>Emberstone veins run like rivers toward the shrines. The snow line drops every year.\u003c/p>\n\u003cp>Only the quarry, the spider cave and the crystal cave are in the game so far.\u003c/p>","src":["wiki/pages/greyspine.md"],"w":true,"r":false},{"s":"groups-and-people","t":"Groups and people","c":"People","i":"👥","sum":"Every group and character in the story, including ones not in the game yet.","a":[],"ib":[],"h":"\u003ch2 id=\"s-groups\">Groups\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Group\u003c/th>\u003cth>What everyone thinks\u003c/th>\u003cth>🔒 The truth\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a>\u003c/td>\u003ctd>The great mages of Aldmera, long passed into legend. All but Wick were heroes.\u003c/td>\u003ctd>Vale caused the Emberfall. Most of the rest are still alive as \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>\u003c/td>\u003ctd>Noble protectors of the ember shrines.\u003c/td>\u003ctd>Most are honest. The leaders are \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> (the players)\u003c/td>\u003ctd>Heroes the shrines make from ember.\u003c/td>\u003ctd>Made to protect the land, and farmed for their ember.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-rooted\" data-to=\"the-rooted\">The Rooted\u003c/a>\u003c/td>\u003ctd>Ordinary townsfolk.\u003c/td>\u003ctd>Exactly that.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>\u003c/td>\u003ctd>Mad bandits who smash shrines, led by Sable.\u003c/td>\u003ctd>Wick's resistance. They know the truth, and are cutting Vale off from the shrines.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">The Mages' Guild\u003c/a>\u003c/td>\u003ctd>Scholars of magic and emberstone.\u003c/td>\u003ctd>Honest, but their emberstone feeds the Undying.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-wardens\" data-to=\"the-wardens\">The Wardens\u003c/a>\u003c/td>\u003ctd>Kael's rangers.\u003c/td>\u003ctd>Honest.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-blight\" data-to=\"the-blight\">The Blight\u003c/a>\u003c/td>\u003ctd>Sick, angry animals.\u003c/td>\u003ctd>Living things the ember has drained out of.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-the-emberguards-people\">The Emberguard's people\u003c/h2>\n\u003cp>\u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>, \u003ca href=\"#sister-celene\" data-to=\"sister-celene\">Sister Celene\u003c/a>, \u003ca href=\"#enchanter-vale\" data-to=\"enchanter-vale\">Enchanter Vale\u003c/a>, \u003ca href=\"#brother-oren\" data-to=\"brother-oren\">Brother Oren\u003c/a>, \u003ca href=\"#sister-lisette\" data-to=\"sister-lisette\">Sister Lisette\u003c/a>, \u003ca href=\"#brother-tomas\" data-to=\"brother-tomas\">Brother Tomas\u003c/a>, \u003ca href=\"#sister-wynne\" data-to=\"sister-wynne\">Sister Wynne\u003c/a>, and the six \u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwardens\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-the-ashbounds-people\">The Ashbound's people\u003c/h2>\n\u003cp>\u003ca href=\"#sable\" data-to=\"sable\">Sable\u003c/a>, 🔒 \u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a> (in hiding), \u003ca href=\"#rhys\" data-to=\"rhys\">Rhys\u003c/a> (later), \u003ca href=\"#tamsin\" data-to=\"tamsin\">Tamsin\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-emberholds-townsfolk\">Emberhold's townsfolk\u003c/h2>\n\u003cp>\u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>, \u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">Captain Bryn\u003c/a>, \u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>, \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>, \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>, \u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a>, \u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>, \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>, \u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a>, \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>, \u003ca href=\"#archmage-rowan\" data-to=\"archmage-rowan\">Archmage Rowan\u003c/a>, \u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">Alchemist Moss\u003c/a>, \u003ca href=\"#repairer-oswin\" data-to=\"repairer-oswin\">Repairer Oswin\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-the-past\">The past\u003c/h2>\n\u003cp>\u003ca href=\"#king-aldemar-xviii\" data-to=\"king-aldemar-xviii\">King Aldemar XVIII\u003c/a>, \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a>, \u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a>, \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a>, \u003ca href=\"#the-tenders\" data-to=\"the-tenders\">The Tenders\u003c/a>, \u003ca href=\"#the-extinguished\" data-to=\"the-extinguished\">The Extinguished\u003c/a>, \u003ca href=\"#orla-the-kind\" data-to=\"orla-the-kind\">Orla the Kind\u003c/a>.\u003c/p>\n\u003cp>See also \u003ca href=\"#people-in-the-game\" data-to=\"people-in-the-game\">People in the game\u003c/a> for everyone you can talk to today.\u003c/p>","src":["wiki/pages/groups-and-people.md"],"w":true,"r":false},{"s":"hammer","t":"Hammer","c":"Items","i":"🔨","sum":"A tool for Smithing.","a":[],"ib":[["Helps","Smithing"],["Effect","Fewer failures"]],"h":"\u003cp>The hammer helps \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>: your tries fail less often. Better metal and better wood make it stronger and last longer. See \u003ca href=\"#tools\" data-to=\"tools\">Tools\u003c/a> for every metal and wood. Smiths make them at the anvil with \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>.\u003c/p>","src":["shared/tools.ts"],"w":false,"r":false},{"s":"hammer-and-fire","t":"Hammer and fire","c":"Quests","i":"📜","sum":"Lessons from Smith Brann.","a":[],"ib":[["Part of","Lessons"],["Given by","Smith Brann"],["Where","at the furnace and anvil in the Emberhall Training Ground"],["Steps","7"]],"h":"\u003cp>\u003cb>Hammer and fire\u003c/b> is a lesson from \u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a>, found at the furnace and anvil in the Emberhall Training Ground.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#into-the-rocks\" data-to=\"into-the-rocks\">Into the rocks\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-smith-brann-by-the-furnace-in-the-training-ground\">Step 1: Talk to Smith Brann by the furnace in the training ground\u003c/h3>\n\u003cp>\u003cb>Smith Brann:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Mind the sparks! I'm Brann. I'll teach you Smithing at the anvil and Smelting at the furnace. Both are part of Dexterity.\u003c/p>\u003cp>A tool is a head and a handle: 1 metal bar for the head, and 1 log for the handle. A hammer on your belt helps you smith, the way a pot helps you cook.\u003c/p>\u003cp>Here's a bronze bar and a log. Make yourself a bronze hammer at the anvil.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> \u003ca href=\"#bronze-bar\" data-to=\"bronze-bar\">Bronze bar\u003c/a>, \u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>, the \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a> skill, the \u003ca href=\"#smelting\" data-to=\"smelting\">Smelting\u003c/a> skill.\u003c/p>\n\u003ch3 id=\"s-step-2-make-a-bronze-hammer-at-the-anvil-1-bronze-bar-1-log\">Step 2: Make a bronze hammer at the anvil (1 bronze bar + 1 log)\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Click the anvil, pick Hammer, Bronze and Pine, then press Make 1. I'll guide your hand this first time.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-3-equip-the-hammer\">Step 3: Equip the hammer\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Click the hammer in your bag and press &quot;Equip&quot;.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-4-go-back-to-smith-brann\">Step 4: Go back to Smith Brann\u003c/h3>\n\u003cp>\u003cb>Smith Brann:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Now for the fire. Every bar takes 2 ores: a bronze bar is 1 copper and 1 tin. Tongs on your belt help you smelt.\u003c/p>\u003cp>Here's 2 copper and 2 tin. Smelt 2 bronze bars at the furnace, then make bronze platelegs at the anvil from both bars. I'll guide your hand.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> 2 × \u003ca href=\"#copper-ore\" data-to=\"copper-ore\">Copper ore\u003c/a>, 2 × \u003ca href=\"#tin-ore\" data-to=\"tin-ore\">Tin ore\u003c/a>.\u003c/p>\n\u003ch3 id=\"s-step-5-smelt-2-bronze-bars-at-the-furnace\">Step 5: Smelt 2 bronze bars at the furnace\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Click the furnace, pick Bronze, and press Make all.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-6-make-bronze-platelegs-at-the-anvil-2-bars\">Step 6: Make bronze platelegs at the anvil (2 bars)\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Click the anvil, pick Armor, then Platelegs and Bronze, and press Make 1.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-7-show-smith-brann-your-platelegs\">Step 7: Show Smith Brann your platelegs\u003c/h3>\n\u003cul>\u003cli>\u003cb>Needs:\u003c/b> Where are your platelegs? Make them at the anvil from 2 bronze bars.\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Smith Brann:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Fine work! Weapons and armor are made just like tools, and they wear out like tools too, so keep a spare.\u003c/p>\u003cp>Take these bronze tongs and a bronze hammer with a good oak handle. With those on your belt, you'll fail much less at the furnace and the anvil.\u003c/p>\u003cp>You Emberborn wear out my tools faster than anyone. Not that I'm complaining about the business.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> \u003ca href=\"#tongs\" data-to=\"tongs\">Bronze tongs\u003c/a>, \u003ca href=\"#hammer\" data-to=\"hammer\">Bronze hammer (Oak)\u003c/a>, 1.5 silver.\u003c/p>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>, \u003ca href=\"#smelting\" data-to=\"smelting\">Smelting\u003c/a>.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> \u003ca href=\"#bronze-bar\" data-to=\"bronze-bar\">Bronze bar\u003c/a>, \u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>, 2 × \u003ca href=\"#copper-ore\" data-to=\"copper-ore\">Copper ore\u003c/a>, 2 × \u003ca href=\"#tin-ore\" data-to=\"tin-ore\">Tin ore\u003c/a>, \u003ca href=\"#tongs\" data-to=\"tongs\">Bronze tongs\u003c/a>, \u003ca href=\"#hammer\" data-to=\"hammer\">Bronze hammer (Oak)\u003c/a>, 1.5 silver.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#into-the-rocks\" data-to=\"into-the-rocks\">Into the rocks\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#handy-work\" data-to=\"handy-work\">Handy work\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"handicraft","t":"Handicraft","c":"Skills","i":"🧵","sum":"Use Woodworker Rook's workshop: fishing bait, bows, arrows and staffs at the workbench, leather at the tanning rack (outside), thread and cloth at the spinning wheel, and leather and cloth armor.","a":[],"ib":[["Discipline","🤲 Dexterity"],["Taught by","\u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>"],["Max level","99"]],"h":"\u003cp>🧵 \u003cb>Handicraft\u003c/b> is a skill in \u003ca href=\"#dexterity\" data-to=\"dexterity\">Dexterity\u003c/a>. Use Woodworker Rook's workshop: fishing bait, bows, arrows and staffs at the workbench, leather at the tanning rack (outside), thread and cloth at the spinning wheel, and leather and cloth armor.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#handy-work\" data-to=\"handy-work\">Handy work\u003c/a>, from \u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🎯 Steady hands\u003c/td>\u003ctd>6% fewer failures\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪱 Bait bundle\u003c/td>\u003ctd>10% chance to make an extra one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📖 Quick learner\u003c/td>\u003ctd>10% more XP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"handy-work","t":"Handy work","c":"Quests","i":"📜","sum":"Lessons from Woodworker Rook.","a":[],"ib":[["Part of","Lessons"],["Given by","Woodworker Rook"],["Where","at the workbench in the Emberhall Training Ground"],["Steps","3"]],"h":"\u003cp>\u003cb>Handy work\u003c/b> is a lesson from \u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>, found at the workbench in the Emberhall Training Ground.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#the-woodcutters-start\" data-to=\"the-woodcutters-start\">The woodcutter's start\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-woodworker-rook-at-the-workbench-in-the-training-ground\">Step 1: Talk to Woodworker Rook at the workbench in the training ground\u003c/h3>\n\u003cp>\u003cb>Woodworker Rook:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Hello there! I'm Rook. I make the little things that make life easier. Handicraft is part of Dexterity.\u003c/p>\u003cp>For now that's fishing bait: worms, food scraps and feathers turn into bait that makes fish bite sooner. Worms turn up while you chop and mine, and cooking leaves scraps.\u003c/p>\u003cp>Here are 2 worms. Make some worm bait at my workbench.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>, \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>, the \u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a> skill.\u003c/p>\n\u003ch3 id=\"s-step-2-make-worm-bait-at-the-workbench\">Step 2: Make worm bait at the workbench\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Click the workbench, pick Worm bait, and press Make 1.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-3-go-back-to-woodworker-rook-for-your-reward\">Step 3: Go back to Woodworker Rook for your reward\u003c/h3>\n\u003cp>\u003cb>Woodworker Rook:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Lovely! Bait goes in your bag, and it's used up as you fish. Better bait comes with a higher Handicraft level.\u003c/p>\u003cp>Here are a few more worms and some coins. Come and sell me your feathers and hides any time.\u003c/p>\u003cp>I'm carving a shrine totem for the Emberguard next. Oak, always oak for them.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> 4 × \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>, 50 bronze.\u003c/p>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a>.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>, \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>, 4 × \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>, 50 bronze.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#hammer-and-fire\" data-to=\"hammer-and-fire\">Hammer and fire\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#standing-your-ground\" data-to=\"standing-your-ground\">Standing your ground\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"haste","t":"Haste","c":"Spells","i":"💨","sum":"You walk faster for a while.","a":[],"ib":[["Spellcasting level","12"],["Mana","15"],["Kind","On yourself"],["Learned from","A spell book"]],"h":"\u003cp>💨 You walk faster for a while.\u003c/p>\n\u003cp>It needs \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a> level 12 and costs 15 mana at Mastery 1 (Mastery lowers the cost). It lasts 60 seconds at Mastery 1.\u003c/p>\n\u003cp>Learn it by reading \u003ca href=\"#spell-book-haste\" data-to=\"spell-book-haste\">Spell book: Haste\u003c/a>, which \u003ca href=\"#goblin\" data-to=\"goblin\">Goblin\u003c/a> sometimes drop.\u003c/p>","src":["shared/combat.ts","shared/spells.ts"],"w":false,"r":false},{"s":"heal","t":"Heal","c":"Spells","i":"💚","sum":"Heals you.","a":[],"ib":[["Spellcasting level","8"],["Mana","12"],["Kind","On yourself"],["Learned from","Levelling up"]],"h":"\u003cp>💚 Heals you.\u003c/p>\n\u003cp>It needs \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a> level 8 and costs 12 mana at Mastery 1 (Mastery lowers the cost).\u003c/p>","src":["shared/combat.ts","shared/spells.ts"],"w":false,"r":false},{"s":"health-potion","t":"Health potion","c":"Items","i":"🧪","sum":"Restores health.","a":[],"ib":[["Alchemy level","1"],["Ingredients","Red cap mushrooms + Slime goo"],["XP","6"],["First tries work","65%"],["Kind","Monster drops"],["Shop pays","10 bronze"],["Game id","\u003ccode>health_potion\u003c/code>"]],"h":"\u003cp>Restores health. Brew it with \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> level 1 from \u003ca href=\"#red-cap-mushrooms\" data-to=\"red-cap-mushrooms\">Red cap mushrooms\u003c/a> and \u003ca href=\"#slime-goo\" data-to=\"slime-goo\">Slime goo\u003c/a> in a vial. See \u003ca href=\"#potions\" data-to=\"potions\">Potions\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#goblin\" data-to=\"goblin\">Goblin\u003c/a> (10%).\u003c/li>\u003cli>Dropped by the \u003ca href=\"#giant-spider\" data-to=\"giant-spider\">Giant spider\u003c/a> (10%).\u003c/li>\u003cli>Dropped by the \u003ca href=\"#alpha-wolf\" data-to=\"alpha-wolf\">Alpha wolf\u003c/a> (30%).\u003c/li>\u003cli>Dropped by the \u003ca href=\"#ashbound-scout\" data-to=\"ashbound-scout\">Ashbound scout\u003c/a> (8%).\u003c/li>\u003cli>Dropped by the \u003ca href=\"#ashbound-raider\" data-to=\"ashbound-raider\">Ashbound raider\u003c/a> (25%).\u003c/li>\u003cli>Sold by \u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>.\u003c/li>\u003cli>Sold by \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>.\u003c/li>\u003cli>Sold by \u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">Captain Bryn\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#standing-your-ground\" data-to=\"standing-your-ground\">Standing your ground\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#rebuild-the-shrine\" data-to=\"rebuild-the-shrine\">Rebuild the Shrine\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/alchemy.ts","shared/items.ts"],"w":false,"r":false},{"s":"heartvale","t":"Heartvale","c":"Places","i":"🌾","sum":"Grassland at the heart of the land: farms, rivers, and the capital Emberhold.","a":[],"ib":[["Levels","1 to 20"],["Home of","The starter tier of every gathering skill, and the best farming (see \u003ca href=\"#resources-by-region\" data-to=\"resources-by-region\">Resources by region\u003c/a>)"],["Kind","Outdoors"],["Danger","Safe"],["Size","240 × 160 tiles"]],"h":"\u003cp>\u003cb>Heartvale\u003c/b> is a round valley of open grassland, farms and rivers, and the first region players see. Its great shrine is \u003ca href=\"#the-heart-shrine\" data-to=\"the-heart-shrine\">The Heart Shrine\u003c/a>, in the Emberhall. \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a> sits on its edge; \u003ca href=\"#the-thornwood\" data-to=\"the-thornwood\">The Thornwood\u003c/a> lies to the south behind a fenced gate, \u003ca href=\"#greyspine-peaks\" data-to=\"greyspine-peaks\">Greyspine Peaks\u003c/a> to the north.\u003c/p>\n\u003cp>It's round because the ground fell in at \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">the Emberfall\u003c/a>. \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a> burns far below it, in \u003ca href=\"#the-hollow-heart\" data-to=\"the-hollow-heart\">The Hollow Heart\u003c/a>, the main story's final area. Out at the valley's edges, far from the Heart Shrine, the grass is turning to grey dust.\u003c/p>\n\u003cp>Heartvale is the big outdoor map: the old village, the lake, the pasture, the farm, the quarry and the edge of the Thornwood. Since version 0.18 players start inside the walls of \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>, and Heartvale lies past its gates, which are shut for now.\u003c/p>\n\u003cp>Out here (and in the houses, shops and caves) the music is &quot;Realm of Exploration&quot;, the world song Mike chose. It repeats without a break. Only the \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">Emberhall\u003c/a> has music of its own.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"heartvale\">\u003c/figure>\n\u003cp>\u003cb>People here:\u003c/b> \u003ca href=\"#rhys\" data-to=\"rhys\">Rhys\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Things to use:\u003c/b> Enchanted chest, Shrine lantern, Westroad shrine, Thornwood shrine.\u003c/p>\n\u003cp>\u003cb>Monsters:\u003c/b> \u003ca href=\"#chicken\" data-to=\"chicken\">Chicken\u003c/a> (6), \u003ca href=\"#cow\" data-to=\"cow\">Cow\u003c/a> (5), \u003ca href=\"#boar\" data-to=\"boar\">Boar\u003c/a> (3), \u003ca href=\"#slime\" data-to=\"slime\">Slime\u003c/a> (5), \u003ca href=\"#giant-bat\" data-to=\"giant-bat\">Giant bat\u003c/a> (9), \u003ca href=\"#rat\" data-to=\"rat\">Rat\u003c/a> (6), \u003ca href=\"#ashbound-scout\" data-to=\"ashbound-scout\">Ashbound scout\u003c/a> (4), \u003ca href=\"#wolf\" data-to=\"wolf\">Wolf\u003c/a> (7), \u003ca href=\"#goblin\" data-to=\"goblin\">Goblin\u003c/a> (5), \u003ca href=\"#giant-spider\" data-to=\"giant-spider\">Giant spider\u003c/a> (4), \u003ca href=\"#ashbound-raider\" data-to=\"ashbound-raider\">Ashbound raider\u003c/a> (3), \u003ca href=\"#hollow-wolf\" data-to=\"hollow-wolf\">Hollow wolf\u003c/a> (5).\u003c/p>\n\u003cp>\u003cb>On the map:\u003c/b> The Greyspine Peaks, Quarry, The lake, The Emberhall, Trainer Row, Pasture, The farm, Saltmere Coast, To the Barrens (closed), The Thornwood (Dark Forest), Goblin camp, Spider hollow, Wolf Hollow, Ashbound camp, Graveyard.\u003c/p>","src":["wiki/pages/heartvale.md","shared/world.ts","shared/npcs.ts"],"w":true,"r":false},{"s":"helmet","t":"Helmet","c":"Items","i":"⛑️","sum":"Armor for the head slot.","a":[],"ib":[["Slot","head"],["Bars to make","1"],["Armor (bronze)","1"]],"h":"\u003cp>⛑️ A helmet goes in your head slot. A bronze one gives 1 armor and takes 1 bar to make with \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>; better metal multiplies it. Leather and cloth versions are made with \u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a>. See \u003ca href=\"#armor\" data-to=\"armor\">Armor\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"herbalist-wren","t":"Herbalist Wren","c":"People","i":"🌿","sum":"Teaches Foraging. Her maps show the Withering spreading.","a":[],"ib":[["Found in","Emberhold"],["Shop","Yes"],["Game id","\u003ccode>wren\u003c/code>"]],"h":"\u003cp>\u003cb>Herbalist Wren\u003c/b> teaches \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> from her hut by the lake. She redraws her map of \u003ca href=\"#the-withering\" data-to=\"the-withering\">The Withering\u003c/a> every ten years. Each one shows the grey ring a little tighter around \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;I buy roots, herbs, mushrooms and shovels, and I sell bronze shovels.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#what-the-ground-gives\" data-to=\"what-the-ground-gives\">What the ground gives\u003c/a> (lessons)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Shop:\u003c/b> buys roots, herbs, mushrooms, worms and shovels. Sells: \u003ca href=\"#shovel\" data-to=\"shovel\">Bronze shovel (Pine)\u003c/a>, \u003ca href=\"#wild-roots\" data-to=\"wild-roots\">Wild roots\u003c/a>. With more \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a>: \u003ca href=\"#sage\" data-to=\"sage\">Sage\u003c/a> (Trading 6), \u003ca href=\"#shovel\" data-to=\"shovel\">Iron shovel (Oak)\u003c/a> (Trading 12), \u003ca href=\"#ginseng-roots\" data-to=\"ginseng-roots\">Ginseng roots\u003c/a> (Trading 20), \u003ca href=\"#truffles\" data-to=\"truffles\">Truffles\u003c/a> (Trading 35). See \u003ca href=\"#shops\" data-to=\"shops\">Shops\u003c/a>.\u003c/p>","src":["wiki/pages/person-wren.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"herbalist-wrens-hut","t":"Herbalist Wren's hut","c":"Places","i":"🏠","sum":"","a":[],"ib":[["Kind","Indoors"],["Danger","Safe"],["Size","8 × 7 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"wren\">\u003c/figure>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"highway-robbery","t":"Highway robbery","c":"Quests","i":"📜","sum":"Side quest from Captain Bryn.","a":[],"ib":[["Part of","Side quest"],["Given by","Captain Bryn"],["Where","by the bounty board in Market Square"],["Steps","4"],["Needs","Renown 10"]],"h":"\u003cp>\u003cb>Highway robbery\u003c/b> is a side quest from \u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">Captain Bryn\u003c/a>, found by the bounty board in Market Square.\u003c/p>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-captain-bryn-about-the-ashbound-raiders\">Step 1: Talk to Captain Bryn about the Ashbound raiders\u003c/h3>\n\u003cp>\u003cb>Captain Bryn:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>You've made a name for yourself, so I've a job I wouldn't give just anyone.\u003c/p>\u003cp>Ashbound raiders deep in the Dark Forest, far south, have been robbing the carts on their way to town. The Emberhall wants them gone. They hit hard, so go well armed and take potions.\u003c/p>\u003cp>Defeat 4 of them, and bring me 2 of the rings they've stolen.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-step-2-defeat-4-ashbound-raiders-deep-in-the-dark-forest-far-south\">Step 2: Defeat 4 Ashbound raiders (deep in the Dark Forest, far south)\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> The Ashbound raiders are deep in the south of the Dark Forest. They hit hard: wear your best armor and keep potions handy.\u003c/li>\u003cli>\u003cb>Fight with:\u003c/b> any weapon.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-3-get-2-stolen-rings-from-ashbound-raiders\">Step 3: Get 2 stolen rings from Ashbound raiders\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> The raiders sometimes drop the rings they've stolen. Keep at it!\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-4-go-back-to-captain-bryn\">Step 4: Go back to Captain Bryn\u003c/h3>\n\u003cp>\u003cb>Captain Bryn:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Two rings! The merchants will sleep easier tonight. Keep the rings: they've been paid out by the guild already.\u003c/p>\u003cp>Here's a steel helmet from the watch's own stores, and your pay.\u003c/p>\u003cp>One of those Ashbound raiders shouted something as he ran: &quot;Every time you rise, the land falls!&quot; Madness.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> \u003ca href=\"#helmet\" data-to=\"helmet\">Steel helmet\u003c/a>, 30 silver.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> \u003ca href=\"#helmet\" data-to=\"helmet\">Steel helmet\u003c/a>, 30 silver.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#the-wolf-hunt\" data-to=\"the-wolf-hunt\">The Wolf Hunt\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#a-blessing\" data-to=\"a-blessing\">A Blessing\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"history","t":"History","c":"History","i":"⏳","sum":"Eight hundred years, oldest first: what really happened, and what people believe today.","a":["Timeline"],"ib":[],"h":"\u003cp>The game takes place in \u003cb>year 800 After the Fall\u003c/b>. Oldest first. For the official story of the Fall next to the true one, see \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">The Emberfall (disaster)\u003c/a>.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Year\u003c/th>\u003cth>What really happened\u003c/th>\u003cth>What people believe today\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Before 0\u003c/td>\u003ctd>\u003ca href=\"#aldmera\" data-to=\"aldmera\">Aldmera\u003c/a>, the kingdom of the \u003ca href=\"#aldmera\" data-to=\"aldmera\">Aldmere\u003c/a>, covers the whole land, ruled from \u003ca href=\"#whitestone\" data-to=\"whitestone\">Whitestone\u003c/a>. Its roads, towers and bridges stand everywhere. Country folk called \u003ca href=\"#the-tenders\" data-to=\"the-tenders\">The Tenders\u003c/a> live by one rule: &quot;take only what the land gives back.&quot;\u003c/td>\u003ctd>&quot;A golden age.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The last years before 0\u003c/td>\u003ctd>\u003ca href=\"#king-aldemar-xviii\" data-to=\"king-aldemar-xviii\">King Aldemar XVIII\u003c/a> leads \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a> in a great working to harness \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a> for all Aldmera. \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a> and \u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a> are his two highest.\u003c/td>\u003ctd>&quot;The Circle was the pride of the kingdom.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>\u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">The Emberfall\u003c/a>. 🔒 As the work concludes, Vale kills the king and twists the working. It breaks loose, embers rain down for a year, and Aldmera falls. Every member of the Circle is filled with power and stops ageing, Vale most of all. Only Vale knows what he did.\u003c/td>\u003ctd>&quot;Wick murdered the king and broke the working.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0 to 10\u003c/td>\u003ctd>Each member of the Circle raises a great shrine in their own region to pin the torrent down (see \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a>).\u003c/td>\u003ctd>&quot;The great mages saved what was left.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>About 30\u003c/td>\u003ctd>The shrines raise the first \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> from the wild ember, protectors to stabilize and guard the ruined land.\u003c/td>\u003ctd>Same.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>About 50\u003c/td>\u003ctd>The Circle founds \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a> to keep the shrines and train the Emberborn.\u003c/td>\u003ctd>Same.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0 to 200\u003c/td>\u003ctd>\u003ca href=\"#the-rebuilding\" data-to=\"the-rebuilding\">The Rebuilding\u003c/a>. It takes two centuries to take back control of the land. Cities grow up around the great shrines, \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a> around the Heart Shrine.\u003c/td>\u003ctd>&quot;The age of heroes.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>About 200\u003c/td>\u003ctd>The first Emberborn begin to fade (\u003ca href=\"#the-fading\" data-to=\"the-fading\">The Fading\u003c/a>). Vale creates the \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a> so a weary Emberborn can retire. 🔒 The ember goes to Vale. Halric the Dawnbringer is the first of \u003ca href=\"#the-extinguished\" data-to=\"the-extinguished\">The Extinguished\u003c/a>.\u003c/td>\u003ctd>&quot;One flame goes out so a hundred can be lit.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>200 to 400\u003c/td>\u003ctd>Ceremonies become normal and honoured. 🔒 Vale grows stronger. The rest of the Circle slowly grows greedy on the power their shrines pull in. Small shrines spread along every road. Vale and the others drink more from the threads, the shrines' warmth reaches less far, and the land furthest from them starts to wither.\u003c/td>\u003ctd>&quot;The Emberguard keep us safe.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>About 400\u003c/td>\u003ctd>🔒 Wick grows suspicious, and finds out what the Ceremony really does.\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>400 to 500\u003c/td>\u003ctd>The \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>, the Circle against itself. 🔒 Vale's side (Crowe, Flint, Merrow, Dunn) wins. Wick's allies, Ivy and Reed, are killed. Impostors chosen from the corrupt Emberguard and Emberborn take their names and shrines, and nobody ever knows. The victors take Wick's shrine, and \u003ca href=\"#frostfell\" data-to=\"frostfell\">Frostfell\u003c/a> freezes.\u003c/td>\u003ctd>&quot;Wick turned half the Circle against the rest and tried to tear the shrines down.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>About 500\u003c/td>\u003ctd>🔒 Vale fakes his death and rewrites history, making Wick the villain of the Emberfall too. The Undying hide in plain sight as the \u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwardens\u003c/a>. The Emberguard take \u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">The Mages' Guild\u003c/a>'s records about the Emberheart.\u003c/td>\u003ctd>&quot;Vale died winning the war. The Emberwardens carry the old Circle names as titles.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>500 to 800\u003c/td>\u003ctd>🔒 Wick hides, cut off from the shrines: still immortal, but far weaker than the Undying. He spends three centuries researching how to heal the land. The Withering keeps spreading. A Ceremony every few decades.\u003c/td>\u003ctd>&quot;The Long Watch.&quot; Wick is a monster in children's stories.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>About 650\u003c/td>\u003ctd>Tilda Ashwalker walks into the Withering in \u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a> and leads two hundred people home. She learns the truth before her Ceremony.\u003c/td>\u003ctd>&quot;Tilda was a hero.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>760\u003c/td>\u003ctd>\u003ca href=\"#orla-the-kind\" data-to=\"orla-the-kind\">Orla the Kind\u003c/a> rises nine times through the Grey Fever, and is honoured at her Ceremony the next year.\u003c/td>\u003ctd>&quot;Orla was a saint.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>About 780\u003c/td>\u003ctd>\u003ca href=\"#sable\" data-to=\"sable\">Sable\u003c/a>, the Emberguard's brightest champion, is chosen for her Ceremony. 🔒 Wick reaches her first, and she vanishes the night before. Together they found \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>.\u003c/td>\u003ctd>&quot;Sable fled her honour and went mad.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>780 to 800\u003c/td>\u003ctd>The Ashbound grow from a handful to a few camps. The Emberguard call them bandits, and lately blame them for the Withering.\u003c/td>\u003ctd>&quot;The Ashbound are poisoning the land.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>800\u003c/td>\u003ctd>Now. The Dark Forest spreads toward Emberhold. Frostfell's ice creeps south. You wake at \u003ca href=\"#the-heart-shrine\" data-to=\"the-heart-shrine\">The Heart Shrine\u003c/a>.\u003c/td>\u003ctd>&quot;The Withering is bad luck, and the Ashbound make it worse.&quot;\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>🔒 marks secrets. Players piece them together through quests, books and Memory Echoes.\u003c/p>\n\u003ch2 id=\"s-what-the-game-still-says\">What the game still says\u003c/h2>\n\u003cp>This timeline was settled after the latest game update. Until Mike's next update, the game's own text still follows the older story:\u003c/p>\n\u003cul>\u003cli>The books and quest text say the game is set \u003cb>500 years\u003c/b> after the Fall, and talk about the &quot;Old Kingdom&quot; and a war over shards.\u003c/li>\u003cli>The empty plinth in the Emberhall shows the letter \u003cb>S\u003c/b>. In the new story it's Wick's plinth, so it will become a \u003cb>W\u003c/b>.\u003c/li>\u003cli>\u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a> is the fishing teacher. In the new story she's a kindly old woman who helps the Emberborn, and not an Emberborn herself.\u003c/li>\u003cli>There are no floating embers in the Emberhall yet.\u003c/li>\u003cli>The Act 1 clues still say the shrines kill the land near them: Holt counts 28 dead trees near shrines and 2 far away, the rebuilt Westroad shrine browns the grass, Kael says the Blight is worst downhill of a shrine, and Odo says the ground got tired once the shrines came. Two books say the same (\u003ci>The Withering: notes from the Barrens\u003c/i> and \u003ci>Herbs of the Valley\u003c/i>). In the new story the shrines are good, and the land dies far from them because Vale drains them (see \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a>).\u003c/li>\u003c/ul>","src":["wiki/pages/history.md"],"w":true,"r":false},{"s":"hollow-wolf","t":"Hollow wolf","c":"Monsters","i":"🐺","sum":"A level 13 monster. Attacks on sight.","a":[],"ib":[["Level","13"],["Health","32"],["Biggest hit","4"],["Attacks every","2.4s"],["Temper","Attacks on sight"],["Out","Day and night"],["Comes back after","48s"],["Coins","3 to 9 bronze"]],"h":"\u003cp>The \u003cb>Hollow wolf\u003c/b> is a level 13 monster with 32 health. Attacks on sight, and it runs in a pack: when one goes for you, the others nearby join in.\u003c/p>\n\u003cp>Defeating one gives 14 bonus XP on top of 1 XP per point of damage, plus 27 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>The Thornwood, near Wolf Hollow (5).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🐺 \u003ca href=\"#wolf-pelts\" data-to=\"wolf-pelts\">Wolf pelts\u003c/a>\u003c/td>\u003ctd>50%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🦷 \u003ca href=\"#wolf-fangs\" data-to=\"wolf-fangs\">Wolf fangs\u003c/a>\u003c/td>\u003ctd>60%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>It also drops 3 to 9 bronze coins.\u003c/p>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"holts-notes","t":"Holt's notes","c":"Items","i":"📒","sum":"Forester Holt's count of dead trees, near shrines and far from them.","a":["page of Holt's notes"],"ib":[["Kind","Story items"],["Shop pays","Can't be sold"],["Game id","\u003ccode>holts_notes\u003c/code>"]],"h":"\u003cp>Forester Holt's count of dead trees, near shrines and far from them.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Given in the quest \u003ca href=\"#what-holt-saw\" data-to=\"what-holt-saw\">What Holt Saw\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"hopefuls","t":"Hopefuls","c":"Factions","i":"🌟","sum":"What new Emberborn are: not members of the Emberguard yet, trying to prove themselves worthy.","a":["Hopeful"],"ib":[],"h":"\u003cp>Every player starts as a \u003cb>Hopeful\u003c/b>: a new \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> who isn't a member of \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a> yet. The Emberguard welcome Hopefuls kindly, but each is one of hundreds. To be allowed to try for the Emberguard, a Hopeful swears the Oath of the Flame, then earns trial marks across the land: Ember, Flame, Blaze and Radiant (see \u003ca href=\"#trial-marks\" data-to=\"trial-marks\">Trial marks\u003c/a>).\u003c/p>\n\u003cp>When a Hopeful has proven themselves, the Emberguard invite them to join. That's the day they learn the truth (see \u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a>).\u003c/p>","src":["wiki/pages/hopefuls.md"],"w":true,"r":false},{"s":"how-to-update-the-wiki","t":"How to update the wiki","c":"Wiki","i":"🛠️","sum":"Every game update should update the wiki too. Most of it updates itself.","a":["Updating the wiki"],"ib":[],"h":"\u003cp>The wiki lives in the game's repository, in the \u003ccode>wiki\u003c/code> folder. It's one web page, \u003ccode>wiki/emberfall-wiki.html\u003c/code>, built from two things.\u003c/p>\n\u003ch2 id=\"s-1-facts-from-the-game-automatic\">1. Facts from the game (automatic)\u003c/h2>\n\u003cp>Maps, monsters, items, skills, spells, quests, shops, books, the version history and the numbers on the mechanics pages are read straight from the game's code (the \u003ccode>shared\u003c/code> folder). After any change to the game, rebuild the wiki and those pages match the game again. Nobody has to remember to copy numbers across.\u003c/p>\n\u003cp>To rebuild, run this in the game's folder:\u003c/p>\n\u003cp>\u003ccode>npm run wiki\u003c/code>\u003c/p>\n\u003cp>It prints how many pages it made, and lists any links that point to a page that doesn't exist yet.\u003c/p>\n\u003ch2 id=\"s-2-the-story-written-by-hand\">2. The story (written by hand)\u003c/h2>\n\u003cp>Lore, history, places, factions and people are plain text files in \u003ccode>wiki/pages\u003c/code>, one per page. Open one and change the words. The top of each file says the page's title, category and fact box, then a line with three dashes, then the page.\u003c/p>\n\u003cul>\u003cli>\u003ccode>\u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a>\u003c/code> links to another page. \u003ccode>\u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">the land's heart\u003c/a>\u003c/code> shows different words.\u003c/li>\u003cli>\u003ccode>## Heading\u003c/code> starts a section.\u003c/li>\u003cli>A line starting with \u003ccode>- \u003c/code> is a bullet.\u003c/li>\u003cli>Put a twist between \u003ccode>::: secret\u003c/code> and \u003ccode>:::\u003c/code> to make a red secret box.\u003c/li>\u003c/ul>\n\u003cp>If a written page has the same title as a page made from the game (like \u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>), they're joined: the story first, then an &quot;In the game&quot; section with the facts.\u003c/p>\n\u003ch2 id=\"s-3-publishing-it\">3. Publishing it\u003c/h2>\n\u003cp>After rebuilding, Claude publishes \u003ccode>wiki/emberfall-wiki.html\u003c/code> to the same Emberfall Wiki link (https://claude.ai/artifact/VCLVMsiJ1uVzdFApngjWJP), so the link never changes. The full guide is \u003ccode>wiki/README.md\u003c/code> in the repository.\u003c/p>\n\u003ch2 id=\"s-the-rule\">The rule\u003c/h2>\n\u003cp>Every game update that changes something in the world (a new item, monster, quest, person, place, or a change to the story) updates the wiki in the same pull request, the same way it adds a line to the \u003ca href=\"#version-history\" data-to=\"version-history\">Version history\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-names\">Names\u003c/h2>\n\u003cp>Since version 0.10 the game uses the lore bible's names too. When a name changes, change it in the game's text and in the wiki together, and add the old name to the \u003ca href=\"#names\" data-to=\"names\">Names\u003c/a> list. Ids inside the code keep their old spelling so saved games keep working.\u003c/p>","src":["wiki/pages/how-to-update.md"],"w":true,"r":false},{"s":"hunters-brew","t":"Hunter's brew","c":"Items","i":"⚗️","sum":"A little stronger and a little faster, for a while.","a":[],"ib":[["Alchemy level","18"],["Ingredients","Wolf fangs + Boar tusks"],["XP","24"],["First tries work","45%"]],"h":"\u003cp>A little stronger and a little faster, for a while. Brew it with \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> level 18 from \u003ca href=\"#wolf-fangs\" data-to=\"wolf-fangs\">Wolf fangs\u003c/a> and \u003ca href=\"#boar-tusks\" data-to=\"boar-tusks\">Boar tusks\u003c/a> in a vial. It isn't listed at the table until you've brewed one: someone has to tell you the recipe. See \u003ca href=\"#potions\" data-to=\"potions\">Potions\u003c/a>.\u003c/p>","src":["shared/alchemy.ts"],"w":false,"r":false},{"s":"hunting","t":"Hunting","c":"Skills","i":"🐾","sum":"Trained by defeating monsters. Everyone who hurt it shares the XP by how much damage they did. Higher Hunting makes monsters drop things more often.","a":[],"ib":[["Discipline","🌿 Endurance"],["Taught by","\u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>"],["Max level","99"]],"h":"\u003cp>🐾 \u003cb>Hunting\u003c/b> is a skill in \u003ca href=\"#endurance\" data-to=\"endurance\">Endurance\u003c/a>. Trained by defeating monsters. Everyone who hurt it shares the XP by how much damage they did. Higher Hunting makes monsters drop things more often.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#standing-your-ground\" data-to=\"standing-your-ground\">Standing your ground\u003c/a>, from \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>📖 Quick learner\u003c/td>\u003ctd>10% more XP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"huntmaster-kael","t":"Huntmaster Kael","c":"People","i":"🏹","sum":"Teaches combat. Leads the Wardens.","a":[],"ib":[["Found in","Emberhold"],["Shop","Yes"],["Game id","\u003ccode>kael\u003c/code>"]],"h":"\u003cp>\u003cb>Huntmaster Kael\u003c/b> teaches fighting from his lodge by the gate, and leads \u003ca href=\"#the-wardens\" data-to=\"the-wardens\">The Wardens\u003c/a>, the rangers who guard the borders against \u003ca href=\"#the-blight\" data-to=\"the-blight\">The Blight\u003c/a>. He says the Blight is always worst furthest from a shrine, and the line gets closer every year. He distrusts the Emberguard, but can't say why.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;I buy weapons, armor and what monsters drop, and I sell starter weapons and potions.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#standing-your-ground\" data-to=\"standing-your-ground\">Standing your ground\u003c/a> (lessons)\u003c/li>\u003cli>\u003ca href=\"#the-wolf-hunt\" data-to=\"the-wolf-hunt\">The Wolf Hunt\u003c/a> (side quest)\u003c/li>\u003cli>\u003ca href=\"#the-hollow-wolves\" data-to=\"the-hollow-wolves\">The Hollow Wolves\u003c/a> (Act 1)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Shop:\u003c/b> buys weapons, armor and monster drops. Sells: \u003ca href=\"#dagger\" data-to=\"dagger\">Bronze dagger (Pine)\u003c/a>, \u003ca href=\"#sling\" data-to=\"sling\">Bronze sling (Pine)\u003c/a>, \u003ca href=\"#staff\" data-to=\"staff\">Pine staff\u003c/a>, \u003ca href=\"#bow\" data-to=\"bow\">Pine bow\u003c/a>, \u003ca href=\"#arrows\" data-to=\"arrows\">Bronze arrows\u003c/a>, \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>. With more \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a>: \u003ca href=\"#sword\" data-to=\"sword\">Bronze sword (Oak)\u003c/a> (Trading 5), \u003ca href=\"#arrows\" data-to=\"arrows\">Bronze arrows\u003c/a> (Trading 10), \u003ca href=\"#platelegs\" data-to=\"platelegs\">Iron platelegs\u003c/a> (Trading 18). See \u003ca href=\"#shops\" data-to=\"shops\">Shops\u003c/a>.\u003c/p>","src":["wiki/pages/person-kael.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"huntmaster-kaels-lodge","t":"Huntmaster Kael's lodge","c":"Places","i":"🏠","sum":"","a":[],"ib":[["Kind","Indoors"],["Danger","Safe"],["Size","9 × 8 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"kael\">\u003c/figure>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"into-the-rocks","t":"Into the rocks","c":"Quests","i":"📜","sum":"Lessons from Miner Greta.","a":[],"ib":[["Part of","Lessons"],["Given by","Miner Greta"],["Where","by the practice rocks in the Emberhall Training Ground"],["Steps","6"]],"h":"\u003cp>\u003cb>Into the rocks\u003c/b> is a lesson from \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>, found by the practice rocks in the Emberhall Training Ground.\u003c/p>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-miner-greta-in-the-training-ground\">Step 1: Talk to Miner Greta in the training ground\u003c/h3>\n\u003cp>\u003cb>Miner Greta:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>You want to learn Mining? Good. It's hard work, but rocks don't run away. Mining is part of Endurance.\u003c/p>\u003cp>These practice rocks were hauled in from the quarry, just for Hopefuls like you. Here's a worn bronze pickaxe. Equip it, then mine 2 copper ore from the orange-flecked rocks. Eat when you get tired.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> \u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Bronze pickaxe (Pine)\u003c/a>, the \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a> skill.\u003c/p>\n\u003ch3 id=\"s-step-2-equip-the-pickaxe\">Step 2: Equip the pickaxe\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Click the pickaxe in your bag and press &quot;Equip&quot;.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-3-mine-2-copper-ore-the-orange-flecked-practice-rocks\">Step 3: Mine 2 copper ore (the orange-flecked practice rocks)\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Click a copper rock (grey with orange flecks) by Greta in the training ground, with the pickaxe on your belt.\u003c/li>\u003cli>\u003cb>You need:\u003c/b> a pickaxe.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-4-show-miner-greta-your-copper-ore\">Step 4: Show Miner Greta your copper ore\u003c/h3>\n\u003cul>\u003cli>\u003cb>Needs:\u003c/b> Where's your copper? Mine some from the practice rocks and bring it here.\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Miner Greta:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Good copper! Tools are made of metal, and the first metal is bronze: 1 copper ore and 1 tin ore make a bronze bar.\u003c/p>\u003cp>Now get 2 tin ore to go with it. Tin rocks are the pale, silvery ones right next to the copper. Or if you're in a hurry, buy them from my Buy tab.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-step-5-get-2-tin-ore-to-go-with-your-copper-mine-it-or-buy-it-from-greta\">Step 5: Get 2 tin ore to go with your copper (mine it, or buy it from Greta)\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Mine the pale, silvery tin rocks by Greta, or click her, open the Buy tab, and buy tin ore. You need 2 copper ore too.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-6-go-back-to-miner-greta-for-your-reward\">Step 6: Go back to Miner Greta for your reward\u003c/h3>\n\u003cp>\u003cb>Miner Greta:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>That's the makings of two bronze bars. Take them to Smith Brann if you haven't learned Smelting yet.\u003c/p>\u003cp>And here's a new bronze pickaxe of my own making, with an oak handle. Faster mining, and it lasts.\u003c/p>\u003cp>The emberstone veins in the quarry are dimmer every year. Used to light up the whole pit at night.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> \u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Bronze pickaxe (Oak)\u003c/a>, 1 silver.\u003c/p>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a>.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> \u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Bronze pickaxe (Pine)\u003c/a>, \u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Bronze pickaxe (Oak)\u003c/a>, 1 silver.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#the-woodcutters-start\" data-to=\"the-woodcutters-start\">The woodcutter's start\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#hammer-and-fire\" data-to=\"hammer-and-fire\">Hammer and fire\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"invisibility","t":"Invisibility","c":"Spells","i":"🫥","sum":"Monsters can't see you. It breaks when you attack or gather.","a":[],"ib":[["Spellcasting level","15"],["Mana","20"],["Kind","On yourself"],["Learned from","A spell book"]],"h":"\u003cp>🫥 Monsters can't see you. It breaks when you attack or gather.\u003c/p>\n\u003cp>It needs \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a> level 15 and costs 20 mana at Mastery 1 (Mastery lowers the cost). It lasts 15 seconds at Mastery 1.\u003c/p>\n\u003cp>Learn it by reading \u003ca href=\"#spell-book-invisibility\" data-to=\"spell-book-invisibility\">Spell book: Invisibility\u003c/a>, which \u003ca href=\"#ashbound-raider\" data-to=\"ashbound-raider\">Ashbound raider\u003c/a> sometimes drop.\u003c/p>","src":["shared/combat.ts","shared/spells.ts"],"w":false,"r":false},{"s":"iridium-bar","t":"Iridium bar","c":"Items","i":"🧈","sum":"Bar. Sells for 572 bronze.","a":[],"ib":[["Kind","Bars"],["Shop pays","572 bronze"],["Game id","\u003ccode>iridium_bar\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#iridium-ore\" data-to=\"iridium-ore\">Iridium ore\u003c/a>, \u003ca href=\"#iridium-ore\" data-to=\"iridium-ore\">Iridium ore\u003c/a>, \u003ca href=\"#coal\" data-to=\"coal\">Coal\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cp>Nowhere in the game yet.\u003c/p>","src":["shared/items.ts"],"w":false,"r":false},{"s":"iridium-ore","t":"Iridium ore","c":"Items","i":"🪨","sum":"Ore. Sells for 220 bronze.","a":[],"ib":[["Kind","Ore"],["Shop pays","220 bronze"],["Game id","\u003ccode>iridium_ore\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a> level 85 from a iridium rock (70 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#iridium-bar\" data-to=\"iridium-bar\">Iridium bar\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"iron-bar","t":"Iron bar","c":"Items","i":"🧈","sum":"Bar. Sells for 30 bronze.","a":[],"ib":[["Kind","Bars"],["Shop pays","30 bronze"],["Game id","\u003ccode>iron_bar\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#iron-ore\" data-to=\"iron-ore\">Iron ore\u003c/a>, \u003ca href=\"#iron-ore\" data-to=\"iron-ore\">Iron ore\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"iron-ore","t":"Iron ore","c":"Items","i":"🪨","sum":"Ore. Sells for 12 bronze.","a":[]
