u003c/li>\u003cli>Old Maren now lives in her own cottage by the lake, with her stove inside, instead of cooking out in the square. \u003ci>(report #13)\u003c/i>\u003c/li>\u003cli>Hedges and bushes are rounder, tighter clumps, with no green box showing. \u003ci>(report #14)\u003c/i>\u003c/li>\u003cli>Trees no longer look cut through; the stump only shows once a tree is chopped down. \u003ci>(report #15)\u003c/i>\u003c/li>\u003cli>The fishing line comes from the tip of the rod. \u003ci>(report #16)\u003c/i>\u003c/li>\u003cli>When a fish bites, the rod bends and you pull the fish out of the water. \u003ci>(report #17)\u003c/i>\u003c/li>\u003cli>No fighting until Huntmaster Kael has taught you combat. With no weapon you fight with your fists. \u003ci>(report #18)\u003c/i>\u003c/li>\u003cli>Running: tap 🏃 or hold Shift. It uses up your breath while you run, and your breath comes back a few seconds after you stop. \u003ci>(report #19)\u003c/i>\u003c/li>\u003cli>Meals that give a lot of stamina are harder to cook without burning. \u003ci>(report #20)\u003c/i>\u003c/li>\u003cli>The General Store has goods on its shelves and things for sale on its tables. \u003ci>(report #21)\u003c/i>\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-2-2026-11-23-robes-that-move-and-phones-that-fit\">0.2 · 2026-11-23 · Robes that move, and phones that fit\u003c/h2>\n\u003cul>\u003cli>Robes and long skirts now stretch around the legs when you walk, so legs no longer poke out through the cloth. \u003ci>(report #1)\u003c/i>\u003c/li>\u003cli>Making your character works on phones: the options scroll, and Start my adventure always stays on screen. \u003ci>(report #2)\u003c/i>\u003c/li>\u003cli>Phones held sideways: the bag scrolls instead of running off the top of the screen. \u003ci>(report #2)\u003c/i>\u003c/li>\u003cli>The game's version now shows at the bottom of Settings, and every bug report records it.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-1-2026-11-23-where-we-start-counting\">0.1 · 2026-11-23 · Where we start counting\u003c/h2>\n\u003cul>\u003cli>Everything built so far: the 3D world, skills, quests, shops, armor and the 🐞 report button.\u003c/li>\u003c/ul>","src":["shared/version.ts"],"w":false,"r":false},{"s":"walking","t":"Walking","c":"Mechanics","i":"🚶","sum":"Smooth, free movement: walk anywhere, any direction.","a":["Movement","WASD"],"ib":[],"h":"\u003cp>You can stand anywhere, not just in the middle of a tile, and walk in any direction. You walk about 1.7 tiles a second; \u003ca href=\"#dexterity\" data-to=\"dexterity\">Dexterity\u003c/a>, swiftness potions and \u003ca href=\"#running\" data-to=\"running\">Running\u003c/a> make you faster.\u003c/p>\n\u003cul>\u003cli>\u003cb>Click\u003c/b> the ground to walk straight to that exact spot. The game finds a way round walls, trees and water, then cuts the corners so you head straight there instead of zig-zagging.\u003c/li>\u003cli>\u003cb>W A S D\u003c/b> walks the way the camera faces, at any angle (turn the camera with Q / E or by dragging, and you turn with it). Walking into a wall at an angle slides you along it, and walking at the edge of a doorway or a gap between trees eases you into it.\u003c/li>\u003cli>People are about 0.56 tiles wide, so you don't clip into walls and trees.\u003c/li>\u003cli>The tile you're standing on is what counts for talking, gathering, fighting, doors and quests. Walking onto a door takes you through it.\u003c/li>\u003cli>Everyone else sees you glide smoothly too.\u003c/li>\u003c/ul>","src":["shared/pathfinding.ts","server/src/WorldRoom.ts"],"w":false,"r":false},{"s":"ward","t":"Ward","c":"Spells","i":"🛡️","sum":"A shield of light that soaks up damage until it breaks or runs out.","a":[],"ib":[["Spellcasting level","3"],["Mana","10"],["Kind","On yourself"],["Learned from","Levelling up"]],"h":"\u003cp>🛡️ A shield of light that soaks up damage until it breaks or runs out.\u003c/p>\n\u003cp>It needs \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a> level 3 and costs 10 mana at Mastery 1 (Mastery lowers the cost). It lasts 120 seconds at Mastery 1.\u003c/p>","src":["shared/combat.ts","shared/spells.ts"],"w":false,"r":false},{"s":"weapons","t":"Weapons","c":"Items","i":"🗡️","sum":"Melee, ranged and magic weapons.","a":[],"ib":[],"h":"\u003cp>Hold a weapon in your gear strip's Weapon slot. With nothing in your hand you punch. Better metal adds to the biggest hit.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Weapon\u003c/th>\u003cth>Style\u003c/th>\u003cth>Level\u003c/th>\u003cth>Biggest hit\u003c/th>\u003cth>Speed\u003c/th>\u003cth>Range\u003c/th>\u003cth>Hands\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🔪 \u003ca href=\"#dagger\" data-to=\"dagger\">Dagger\u003c/a>\u003c/td>\u003ctd>Melee\u003c/td>\u003ctd>1\u003c/td>\u003ctd>2\u003c/td>\u003ctd>1.8s\u003c/td>\u003ctd>1\u003c/td>\u003ctd>One\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🗡️ \u003ca href=\"#sword\" data-to=\"sword\">Sword\u003c/a>\u003c/td>\u003ctd>Melee\u003c/td>\u003ctd>5\u003c/td>\u003ctd>3\u003c/td>\u003ctd>2.4s\u003c/td>\u003ctd>1\u003c/td>\u003ctd>One\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🏏 \u003ca href=\"#mace\" data-to=\"mace\">Mace\u003c/a>\u003c/td>\u003ctd>Melee\u003c/td>\u003ctd>10\u003c/td>\u003ctd>5\u003c/td>\u003ctd>3s\u003c/td>\u003ctd>1\u003c/td>\u003ctd>One\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🔱 \u003ca href=\"#spear\" data-to=\"spear\">Spear\u003c/a>\u003c/td>\u003ctd>Melee\u003c/td>\u003ctd>15\u003c/td>\u003ctd>5\u003c/td>\u003ctd>2.4s\u003c/td>\u003ctd>2\u003c/td>\u003ctd>One\u003c/td>\u003c/tr>\u003ctr>\u003ctd>⚔️ \u003ca href=\"#two-handed-sword\" data-to=\"two-handed-sword\">Two-handed sword\u003c/a>\u003c/td>\u003ctd>Melee\u003c/td>\u003ctd>20\u003c/td>\u003ctd>8\u003c/td>\u003ctd>3.6s\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Two\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪃 \u003ca href=\"#sling\" data-to=\"sling\">Sling\u003c/a>\u003c/td>\u003ctd>Ranged\u003c/td>\u003ctd>1\u003c/td>\u003ctd>2\u003c/td>\u003ctd>2.4s\u003c/td>\u003ctd>4\u003c/td>\u003ctd>One\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🎯 \u003ca href=\"#darts\" data-to=\"darts\">Darts\u003c/a>\u003c/td>\u003ctd>Ranged\u003c/td>\u003ctd>5\u003c/td>\u003ctd>2\u003c/td>\u003ctd>1.2s\u003c/td>\u003ctd>3\u003c/td>\u003ctd>One\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🏹 \u003ca href=\"#bow\" data-to=\"bow\">Bow\u003c/a>\u003c/td>\u003ctd>Ranged\u003c/td>\u003ctd>10\u003c/td>\u003ctd>4\u003c/td>\u003ctd>3s\u003c/td>\u003ctd>6\u003c/td>\u003ctd>Two\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪄 \u003ca href=\"#staff\" data-to=\"staff\">Staff\u003c/a>\u003c/td>\u003ctd>Magic\u003c/td>\u003ctd>1\u003c/td>\u003ctd>spells\u003c/td>\u003ctd>3s\u003c/td>\u003ctd>5\u003c/td>\u003ctd>One\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-metal-bonus\">Metal bonus\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Metal\u003c/th>\u003cth>Adds to biggest hit\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Bronze\u003c/td>\u003ctd>+1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Iron\u003c/td>\u003ctd>+2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Steel\u003c/td>\u003ctd>+3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mithril\u003c/td>\u003ctd>+5\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Bows and staffs are wooden: their wood adds damage instead: Pine +0, Oak +1, Birch +2, Maple +3, Yew +4, Ironwood +6, Elderwood +8.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"what-holt-saw","t":"What Holt Saw","c":"Quests","i":"📜","sum":"Act 1 from Forester Holt.","a":[],"ib":[["Part of","Act 1"],["Given by","Forester Holt"],["Where","on Trainer Row, east of the square"],["Steps","3"]],"h":"\u003cp>\u003cb>What Holt Saw\u003c/b> is part of the Act 1 from \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>, found on Trainer Row, east of the square.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#oath-of-the-flame\" data-to=\"oath-of-the-flame\">Oath of the Flame\u003c/a>, \u003ca href=\"#the-woodcutters-start\" data-to=\"the-woodcutters-start\">The woodcutter's start\u003c/a>.\u003c/p>\n\u003cdiv class=\"box note\">\u003cdiv class=\"box-label\">Planned change\u003c/div>\u003cp>Flip the numbers. Move the Thornwood gate and Greyspine foothill spots to Heartvale: three near shrines, three at the valley's edge.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-forester-holt\">Step 1: Talk to Forester Holt\u003c/h3>\n\u003cp>\u003cb>Forester Holt:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>You've got the Emberhall's ear now. Can I ask you something, quiet-like?\u003c/p>\u003cp>I've been a forester forty years, and I swear the trees nearest the shrines die first. Nobody believes me.\u003c/p>\u003cp>Count the dead trees in six places for me: three near shrines (the Emberhall's garden, the Westroad shrine and the Thornwood gate) and three far from any (north of the lake, the Greyspine foothills, and the north coast woods). The 🗺️ map marks them.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-step-2-count-dead-trees-in-6-places\">Step 2: Count dead trees in 6 places\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Three near shrines: the Emberhall's garden, the Westroad shrine, the Thornwood gate. Three far away: north of the lake, the Greyspine foothills, the north coast woods. The 🗺️ map marks them.\u003c/li>\u003c/ul>\n\u003cp>\u003cb>What you find:\u003c/b>\u003c/p>\n\u003cul>\u003cli>By the Emberhall: 9 dead trees out of 12.\u003c/li>\u003cli>By the Westroad shrine: 11 dead trees out of 13.\u003c/li>\u003cli>By the Thornwood gate: 8 dead trees out of 10.\u003c/li>\u003cli>North of the lake: 1 dead tree out of 14.\u003c/li>\u003cli>In the foothills: none dead out of 9.\u003c/li>\u003cli>In the coast woods: 1 dead tree out of 11.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-3-go-back-to-forester-holt\">Step 3: Go back to Forester Holt\u003c/h3>\n\u003cp>\u003cb>Forester Holt:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Twenty-eight dead near the shrines, and two far away? I knew it. I knew it!\u003c/p>\u003cp>Now, it could be the Ashbound, poisoning the ground round the shrines to spite the Emberhall. That's what the Keepers would say.\u003c/p>\u003cp>Keep those notes. And keep it under your hat, eh?\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> \u003ca href=\"#holts-notes\" data-to=\"holts-notes\">Holt's notes\u003c/a>, 150 Woodcutting XP.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> \u003ca href=\"#holts-notes\" data-to=\"holts-notes\">Holt's notes\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#rebuild-the-shrine\" data-to=\"rebuild-the-shrine\">Rebuild the Shrine\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#odos-stubborn-field\" data-to=\"odos-stubborn-field\">Odo's Stubborn Field\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"what-the-ground-gives","t":"What the ground gives","c":"Quests","i":"📜","sum":"Lessons from Herbalist Wren.","a":[],"ib":[["Part of","Lessons"],["Given by","Herbalist Wren"],["Where","by the dig patches in the Emberhall Training Ground"],["Steps","4"]],"h":"\u003cp>\u003cb>What the ground gives\u003c/b> is a lesson from \u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a>, found by the dig patches in the Emberhall Training Ground.\u003c/p>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-herbalist-wren-in-the-training-ground\">Step 1: Talk to Herbalist Wren in the training ground\u003c/h3>\n\u003cp>\u003cb>Herbalist Wren:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Oh! Mind the drying herbs. I'm Wren. Everyone else round here chops and mines and fishes, but the best things grow under your feet.\u003c/p>\u003cp>See the little patches of turned earth that glint in the grass? Those are dig patches. Dig one with a shovel and you'll turn up roots, worms and mushrooms, and herbs once you know what to look for. That's Foraging, part of Endurance.\u003c/p>\u003cp>Here's a bronze shovel. Equip it like any other tool.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> \u003ca href=\"#shovel\" data-to=\"shovel\">Bronze shovel (Pine)\u003c/a>, the \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> skill.\u003c/p>\n\u003ch3 id=\"s-step-2-equip-the-shovel-click-it-in-your-bag-then-equip\">Step 2: Equip the shovel (click it in your bag, then Equip)\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Click the shovel in your bag, then press &quot;Equip&quot;.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-3-dig-up-3-things-from-glinting-dig-patches\">Step 3: Dig up 3 things from glinting dig patches\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> The dig patches are all round me in the training ground. Click one that glints. Once it's dug out, it glints again after a while.\u003c/li>\u003cli>\u003cb>You need:\u003c/b> a shovel.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-4-show-herbalist-wren-what-you-found\">Step 4: Show Herbalist Wren what you found\u003c/h3>\n\u003cp>\u003cb>Herbalist Wren:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Not bad for a first dig! Worms make good bait, and roots and mushrooms go in the pot.\u003c/p>\u003cp>The better you get, the better the finds: sage, ginseng, wild honeycomb, blue lotus, even truffles. And moonpetal only opens at night, so dig after dark.\u003c/p>\u003cp>I'll buy anything you dig up, and I sell shovels. Smith Brann can make you a better one, just like an axe.\u003c/p>\u003cp>I've been marking the dying patches on my map. There are more every season, and they spread out from the shrines like spilled ink.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> 1 silver.\u003c/p>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a>.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> \u003ca href=\"#shovel\" data-to=\"shovel\">Bronze shovel (Pine)\u003c/a>, 1 silver.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#standing-your-ground\" data-to=\"standing-your-ground\">Standing your ground\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#sparks-and-spells\" data-to=\"sparks-and-spells\">Sparks and spells\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"wheat","t":"Wheat","c":"Items","i":"🌾","sum":"Herbs, roots and crop. Sells for 2 bronze.","a":["sheaf of wheat"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","2 bronze"],["Game id","\u003ccode>wheat\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Grown with \u003ca href=\"#farming\" data-to=\"farming\">Farming\u003c/a> level 12: ripe after 40 minutes, 3 to 5 a tile.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"wheat-seeds","t":"Wheat seeds","c":"Items","i":"🌱","sum":"Seed. Sells for 2 bronze.","a":["wheat seed"],"ib":[["Kind","Seeds"],["Shop pays","2 bronze"],["Game id","\u003ccode>seed_wheat\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"whitestone","t":"Whitestone","c":"Places","i":"🏛️","sum":"Aldmera's white capital, destroyed in the Emberfall. Its ruins are the Sundered Crown.","a":["Brightcrown"],"ib":[],"h":"\u003cp>\u003cb>Whitestone\u003c/b> was the capital of \u003ca href=\"#aldmera\" data-to=\"aldmera\">Aldmera\u003c/a>, a city of white stone in the west, seat of the Aldemar kings. The torrent of \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">the Emberfall\u003c/a> tore across the land and broke it, and the farmland around it burned into \u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a>. Its ruins are called \u003ca href=\"#the-sundered-crown\" data-to=\"the-sundered-crown\">The Sundered Crown\u003c/a>. A broken milestone on the King's Road still reads \u003ci>&quot;Whitestone, 40 miles.&quot;\u003c/i>\u003c/p>\n\u003cp>It used to be called Brightcrown in the wiki.\u003c/p>","src":["wiki/pages/whitestone.md"],"w":true,"r":false},{"s":"wick","t":"Wick","c":"People","i":"🕯️","sum":"The Circle's traitor, who murdered the king and caused the Emberfall. Or so everyone is taught.","a":["Wick the Betrayer","The Snuffed One"],"ib":[["Once","One of the two highest of \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a>"],["Shrine","\u003ca href=\"#frostfell\" data-to=\"frostfell\">Frostfell\u003c/a> (lost)"],["Plinth","The empty one in \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>, with a W left"]],"h":"\u003cp>\u003cb>Wick\u003c/b> was one of the two highest members of \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a>, beside \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a>. Every child in Embervale knows his name as the worst in history. The Emberguard call him Wick the Betrayer, or the Snuffed One.\u003c/p>\n\u003ch2 id=\"s-what-everyone-is-taught\">What everyone is taught\u003c/h2>\n\u003cul>\u003cli>On the night of the great working, Wick struck down \u003ca href=\"#king-aldemar-xviii\" data-to=\"king-aldemar-xviii\">King Aldemar XVIII\u003c/a> and seized the working for himself. That was \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">the Emberfall\u003c/a>.\u003c/li>\u003cli>He hid his crime for four hundred years. When the Circle found him out, he started the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a> and tried to tear the shrines down.\u003c/li>\u003cli>Vale defeated him and died doing it. Wick fled, and his curse froze \u003ca href=\"#frostfell\" data-to=\"frostfell\">Frostfell\u003c/a>, where his shrine stood.\u003c/li>\u003cli>Nobody has seen him since. Parents tell children he's still out in the cold, waiting.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-the-empty-plinth\">The empty plinth\u003c/h2>\n\u003cp>His statue once stood in the great hall of \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>, a gift of thanks from the city. After the war it was pulled down and his name scratched off the plinth, very carefully, letter by letter. Only the first letter is left under the dust: \u003cb>W\u003c/b>. \u003ca href=\"#brother-oren\" data-to=\"brother-oren\">Brother Oren\u003c/a> ends his tour there: \u003ci>this is what betrayal earns.\u003c/i>\u003c/p>\n\u003cp>In the game today the letter is still an S, from the older story. It becomes a W in Mike's next update.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003ch2 id=\"s-the-truth\">The truth\u003c/h2>\n\u003cp>Wick didn't kill the king, and he didn't know who did. For four hundred years he believed, like the rest of the Circle, that the working had simply gone wrong.\u003c/p>\n\u003cp>\u003cb>The war:\u003c/b> around year 400 he found out what the \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a> really does, and tried to stop it. Ivy and Reed stood with him. They lost the Sundering War; Ivy and Reed were killed, and Wick was cut off from his shrine.\u003c/p>\n\u003cp>\u003cb>Three hundred years in hiding:\u003c/b> Wick is still immortal, but without a shrine he can't siphon, so he's far weaker than \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>. He has spent three centuries researching and experimenting, trying to find a way to heal the land and undo the damage. That's why it's taken him so long. Somewhere along the way he began to suspect that Vale killed the king, but he can't prove it.\u003c/p>\n\u003cp>\u003cb>The Ashbound:\u003c/b> about twenty years ago he finally made his move. He reached \u003ca href=\"#sable\" data-to=\"sable\">Sable\u003c/a>, the Emberguard's brightest champion, before her Ceremony and showed her the truth. She vanished the night before, and together they started \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>. Sable is its public face. Wick stays hidden.\u003c/p>\n\u003cp>\u003cb>In the story:\u003c/b> players meet him at the end of Act 3, after Rhys is drained. In Act 4 he cuts their thread from the Heart Shrine, teaches them to free the great shrines, and gets his strength back when they thaw his own shrine in Frostfell. He fights Vale beside them.\u003c/p>\n\u003cp>His hope is the \u003ca href=\"#ember-seed\" data-to=\"ember-seed\">Ember Seed\u003c/a>: the thing the Circle's working was meant to make, and in the endgame, the only way to save the Emberborn for good.\u003c/p>\u003c/div>","src":["wiki/pages/wick.md"],"w":true,"r":false},{"s":"wild-honeycomb","t":"Wild honeycomb","c":"Items","i":"🍯","sum":"Herbs, roots and crop. Sells for 7 bronze.","a":["piece of wild honeycomb"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","7 bronze"],["Game id","\u003ccode>honey\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dug up with \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> level 8 (7 XP).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Half of the recipe for the \u003ca href=\"#stamina-potion\" data-to=\"stamina-potion\">Stamina potion\u003c/a>.\u003c/li>\u003cli>A bonus third ingredient in \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a>: also gives 15 stamina.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"wild-roots","t":"Wild roots","c":"Items","i":"🥕","sum":"Herbs, roots and crop. Sells for 2 bronze.","a":["wild root"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","2 bronze"],["Game id","\u003ccode>wild_root\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dug up with \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> level 1 (2 XP).\u003c/li>\u003cli>Sold by \u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Half of the recipe for the \u003ca href=\"#tithe-tonic\" data-to=\"tithe-tonic\">Tithe tonic\u003c/a>.\u003c/li>\u003cli>A cooking ingredient (vegetables): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"wisdom","t":"Wisdom","c":"Skills","i":"🔮","sum":"Magic. Raises your max mana.","a":[],"ib":[["Kind","Discipline"],["Skills","Spellcasting, Enchanting, Alchemy"]],"h":"\u003cp>🔮 \u003cb>Wisdom\u003c/b> is one of the five \u003ca href=\"#disciplines\" data-to=\"disciplines\">Disciplines\u003c/a>. Magic. Raises your max mana. Its level is the average of the levels of its skills you've learned, rounded down.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Skill\u003c/th>\u003cth>What it is\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🪄 \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a>\u003c/td>\u003ctd>Cast spells from your spell bar (bolts fly from a staff in your hand). Spells use mana.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>✨ \u003ca href=\"#enchanting\" data-to=\"enchanting\">Enchanting\u003c/a>\u003c/td>\u003ctd>Use the enchanting altar in the Mages' Guild: a refined emberstone with ember in it adds magic to a staff, a piece of armor or a tool. Archmage Rowan teaches it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>⚗️ \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a>\u003c/td>\u003ctd>Brew potions at the alchemy table in the Mages' Guild: pick 2 ingredients (and maybe a third for a bonus) and an empty vial. Alchemist Moss teaches it.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/stats.ts"],"w":false,"r":false},{"s":"wolf","t":"Wolf","c":"Monsters","i":"🐺","sum":"A level 8 monster. Attacks on sight.","a":[],"ib":[["Level","8"],["Health","20"],["Biggest hit","3"],["Attacks every","2.4s"],["Temper","Attacks on sight"],["Out","Day and night"],["Comes back after","60s"],["Coins","1 to 5 bronze"]],"h":"\u003cp>The \u003cb>Wolf\u003c/b> is a level 8 monster with 20 health. Attacks on sight, and it runs in a pack: when one goes for you, the others nearby join in.\u003c/p>\n\u003cp>Defeating one gives 8 bonus XP on top of 1 XP per point of damage, plus 16 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>The Thornwood (7), The wolf den (4).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🐺 \u003ca href=\"#wolf-pelts\" data-to=\"wolf-pelts\">Wolf pelts\u003c/a>\u003c/td>\u003ctd>50%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🦷 \u003ca href=\"#wolf-fangs\" data-to=\"wolf-fangs\">Wolf fangs\u003c/a>\u003c/td>\u003ctd>40%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>It also drops 1 to 5 bronze coins.\u003c/p>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"wolf-fangs","t":"Wolf fangs","c":"Items","i":"🦷","sum":"Monster drop. Sells for 10 bronze.","a":["wolf fang"],"ib":[["Kind","Monster drops"],["Shop pays","10 bronze"],["Game id","\u003ccode>wolf_fang\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#wolf\" data-to=\"wolf\">Wolf\u003c/a> (40%).\u003c/li>\u003cli>Dropped by the \u003ca href=\"#alpha-wolf\" data-to=\"alpha-wolf\">Alpha wolf\u003c/a> (100%).\u003c/li>\u003cli>Dropped by the \u003ca href=\"#hollow-wolf\" data-to=\"hollow-wolf\">Hollow wolf\u003c/a> (60%).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Half of the recipe for the \u003ca href=\"#strength-potion\" data-to=\"strength-potion\">Strength potion\u003c/a>.\u003c/li>\u003cli>Half of the recipe for the \u003ca href=\"#hunters-brew\" data-to=\"hunters-brew\">Hunter's brew\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"wolf-pelts","t":"Wolf pelts","c":"Items","i":"🐺","sum":"Monster drop. Sells for 12 bronze.","a":["wolf pelt"],"ib":[["Kind","Monster drops"],["Shop pays","12 bronze"],["Game id","\u003ccode>wolf_pelt\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#wolf\" data-to=\"wolf\">Wolf\u003c/a> (50%).\u003c/li>\u003cli>Dropped by the \u003ca href=\"#hollow-wolf\" data-to=\"hollow-wolf\">Hollow wolf\u003c/a> (50%).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Tanned into \u003ca href=\"#leather\" data-to=\"leather\">Leather\u003c/a> at Woodworker Rook's rack (\u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a> level 10).\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"woodcutting","t":"Woodcutting","c":"Skills","i":"🪓","sum":"Click a tree to chop logs.","a":[],"ib":[["Discipline","🌿 Endurance"],["Taught by","\u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>"],["Max level","99"]],"h":"\u003cp>🪓 \u003cb>Woodcutting\u003c/b> is a skill in \u003ca href=\"#endurance\" data-to=\"endurance\">Endurance\u003c/a>. Click a tree to chop logs.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#the-woodcutters-start\" data-to=\"the-woodcutters-start\">The woodcutter's start\u003c/a>, from \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>⏩ Quick hands\u003c/td>\u003ctd>5% faster\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍀 Lucky find\u003c/td>\u003ctd>4% chance of an extra one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪶 Light work\u003c/td>\u003ctd>8% chance it costs no stamina\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-what-you-can-gather\">What you can gather\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>From\u003c/th>\u003cth>Gives\u003c/th>\u003cth>XP\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Pine tree\u003c/td>\u003ctd>\u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Oak tree\u003c/td>\u003ctd>\u003ca href=\"#oak-logs\" data-to=\"oak-logs\">Oak logs\u003c/a>\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>Birch tree\u003c/td>\u003ctd>\u003ca href=\"#birch-logs\" data-to=\"birch-logs\">Birch logs\u003c/a>\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20\u003c/td>\u003ctd>Maple tree\u003c/td>\u003ctd>\u003ca href=\"#maple-logs\" data-to=\"maple-logs\">Maple logs\u003c/a>\u003c/td>\u003ctd>9\u003c/td>\u003c/tr>\u003ctr>\u003ctd>35\u003c/td>\u003ctd>Yew tree\u003c/td>\u003ctd>\u003ca href=\"#yew-logs\" data-to=\"yew-logs\">Yew logs\u003c/a>\u003c/td>\u003ctd>16\u003c/td>\u003c/tr>\u003ctr>\u003ctd>50\u003c/td>\u003ctd>Ironwood tree\u003c/td>\u003ctd>\u003ca href=\"#ironwood-logs\" data-to=\"ironwood-logs\">Ironwood logs\u003c/a>\u003c/td>\u003ctd>28\u003c/td>\u003c/tr>\u003ctr>\u003ctd>70\u003c/td>\u003ctd>Elderwood tree\u003c/td>\u003ctd>\u003ca href=\"#elderwood-logs\" data-to=\"elderwood-logs\">Elderwood logs\u003c/a>\u003c/td>\u003ctd>45\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"woodworker-rook","t":"Woodworker Rook","c":"People","i":"🪚","sum":"Teaches Handicraft. Carves shrine totems for the Emberguard.","a":[],"ib":[["Found in","Emberhold"],["Shop","Yes"],["Game id","\u003ccode>rook\u003c/code>"]],"h":"\u003cp>\u003cb>Woodworker Rook\u003c/b> teaches \u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a> in his workshop west of the square. He carves shrine totems for the Emberguard (\u003ca href=\"#the-totem\" data-to=\"the-totem\">The Totem\u003c/a>).\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>He hides \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>'s notes inside the totems' bases. One note says \u003ci>&quot;The W was never his crime.&quot;\u003c/i>\u003c/p>\u003c/div>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;Bows, arrows, staffs, leather and cloth: it all starts at my bench. I buy hides, silk and what you make, and sell worms, feathers and thread.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#handy-work\" data-to=\"handy-work\">Handy work\u003c/a> (lessons)\u003c/li>\u003cli>\u003ca href=\"#the-totem\" data-to=\"the-totem\">The Totem\u003c/a> (Act 1)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Shop:\u003c/b> buys bait, worms, feathers, hides, silk, leather, cloth, arrows, bows, staffs and leather or cloth armor. Sells: \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>, \u003ca href=\"#feathers\" data-to=\"feathers\">Feathers\u003c/a>, \u003ca href=\"#thread\" data-to=\"thread\">Thread\u003c/a>. With more \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a>: \u003ca href=\"#leather\" data-to=\"leather\">Leather\u003c/a> (Trading 8), \u003ca href=\"#arrows\" data-to=\"arrows\">Iron arrows\u003c/a> (Trading 12), \u003ca href=\"#bow\" data-to=\"bow\">Maple bow\u003c/a> (Trading 25), \u003ca href=\"#staff\" data-to=\"staff\">Yew staff\u003c/a> (Trading 35). See \u003ca href=\"#shops\" data-to=\"shops\">Shops\u003c/a>.\u003c/p>","src":["wiki/pages/person-rook.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"woodworker-rooks-workshop","t":"Woodworker Rook's workshop","c":"Places","i":"🏠","sum":"","a":[],"ib":[["Kind","Indoors"],["Danger","Safe"],["Size","11 × 8 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"rook\">\u003c/figure>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"world-map","t":"World map","c":"Places","i":"🗺️","sum":"The whole land of Embervale, and how people travel between the regions.","a":["Map of Embervale","Travel","Travelling"],"ib":[],"h":"\u003cfigure class=\"art\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1000 720\" role=\"img\" aria-label=\"Map of Embervale\" style=\"width:100%;height:auto;display:block;border-radius:10px\">\n\u003cdefs>\n\u003cradialGradient id=\"wm-sea\" cx=\"50%\" cy=\"50%\" r=\"75%\">\u003cstop offset=\"0\" stop-color=\"#e9dcb8\"/>\u003cstop offset=\"1\" stop-color=\"#cdb98a\"/>\u003c/radialGradient>\n\u003cpattern id=\"wm-sand\" width=\"8\" height=\"8\" patternUnits=\"userSpaceOnUse\">\u003crec 03ctext x=\"500\" y=\"75\" fill=\"#24485c\">Frostfell\u003c/text>\n\u003ctext x=\"420\" y=\"205\">Greyspine Peaks\u003c/text>\n\u003ctext x=\"235\" y=\"420\">The Ashen Barrens\u003c/text>\n\u003ctext x=\"86\" y=\"460\" font-size=\"15\">The Sundered\u003c/text>\u003ctext x=\"86\" y=\"478\" font-size=\"15\">Crown\u003c/text>\n\u003ctext x=\"790\" y=\"390\">Saltmere\u003c/text>\u003ctext x=\"790\" y=\"412\">Coast\u003c/text>\n\u003ctext x=\"470\" y=\"600\">The Thornwood\u003c/text>\n\u003ctext x=\"735\" y=\"615\">The Tangle\u003c/text>\n\u003ctext x=\"240\" y=\"610\">Blackfen\u003c/text>\n\u003c/g>\n\u003cg font-family=\"Georgia,serif\" text-anchor=\"middle\" font-size=\"12\" fill=\"#2b2118\" stroke=\"#fff8e6\" stroke-width=\"3\" paint-order=\"stroke\">\n\u003ctext x=\"500\" y=\"440\" fill=\"#8e2a1e\">The Hollow Heart lies below\u003c/text>\n\u003ctext x=\"500\" y=\"122\" fill=\"#24485c\">Wick's frozen shrine\u003c/text>\n\u003ctext x=\"575\" y=\"272\">Crystal Cave\u003c/text>\n\u003ctext x=\"160\" y=\"352\">Whitestone road\u003c/text>\n\u003ctext x=\"930\" y=\"470\" fill=\"#24485c\">by boat\u003c/text>\n\u003c/g>\n\u003c!-- cave markers for the Deeps -->\n\u003cg fill=\"#2b2118\">\u003cpath d=\"M560 248 a10 8 0 0 1 20 0z\"/>\u003cpath d=\"M300 300 a10 8 0 0 1 20 0z\"/>\u003cpath d=\"M420 520 a10 8 0 0 1 20 0z\"/>\u003cpath d=\"M640 205 a10 8 0 0 1 20 0z\"/>\u003c/g>\n\u003c!-- legend -->\n\u003cg font-family=\"Georgia,serif\" font-size=\"12\" fill=\"#2b2118\">\n\u003crect x=\"12\" y=\"10\" width=\"220\" height=\"100\" rx=\"8\" fill=\"#fff8e6\" opacity=\".9\" stroke=\"#8a5a2b\"/>\n\u003ccircle cx=\"30\" cy=\"30\" r=\"6\" fill=\"#f6c453\" stroke=\"#7a4a12\"/>\u003ctext x=\"44\" y=\"34\">Great shrine and its city\u003c/text>\n\u003cpath d=\"M22 52 h18\" stroke=\"#8a5a2b\" stroke-width=\"3\"/>\u003ctext x=\"44\" y=\"56\">King's Road (shrine road)\u003c/text>\n\u003cpath d=\"M22 74 h18\" stroke=\"#8a5a2b\" stroke-width=\"3\" stroke-dasharray=\"3 5\"/>\u003ctext x=\"44\" y=\"78\">Closed until Act 4\u003c/text>\n\u003cpath d=\"M24 100 a8 6 0 0 1 16 0z\" fill=\"#2b2118\"/>\u003ctext x=\"44\" y=\"100\">The Deeps (caves)\u003c/text>\n\u003c/g>\n\u003c/svg>\n\u003c/figure>\n\u003cp>\u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a> sits in the middle, with \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a> and \u003ca href=\"#the-heart-shrine\" data-to=\"the-heart-shrine\">The Heart Shrine\u003c/a> on its western edge, and \u003ca href=\"#the-hollow-heart\" data-to=\"the-hollow-heart\">The Hollow Heart\u003c/a> deep below it. Around it:\u003c/p>\n\u003cul>\u003cli>\u003cb>North:\u003c/b> \u003ca href=\"#greyspine-peaks\" data-to=\"greyspine-peaks\">Greyspine Peaks\u003c/a>, and beyond them \u003ca href=\"#frostfell\" data-to=\"frostfell\">Frostfell\u003c/a> with Wick's frozen shrine.\u003c/li>\u003cli>\u003cb>East:\u003c/b> \u003ca href=\"#saltmere-coast\" data-to=\"saltmere-coast\">Saltmere Coast\u003c/a> and the sea.\u003c/li>\u003cli>\u003cb>South:\u003c/b> \u003ca href=\"#the-thornwood\" data-to=\"the-thornwood\">The Thornwood\u003c/a>, with \u003ca href=\"#the-tangle\" data-to=\"the-tangle\">The Tangle\u003c/a> to the south-east and \u003ca href=\"#blackfen\" data-to=\"blackfen\">Blackfen\u003c/a> to the south-west.\u003c/li>\u003cli>\u003cb>West:\u003c/b> \u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a>, and past their far edge \u003ca href=\"#the-sundered-crown\" data-to=\"the-sundered-crown\">The Sundered Crown\u003c/a>, the ruins of Whitestone.\u003c/li>\u003cli>\u003cb>Underneath:\u003c/b> \u003ca href=\"#the-deeps\" data-to=\"the-deeps\">The Deeps\u003c/a>, caves that run under every region.\u003c/li>\u003c/ul>\n\u003cp>Each gold dot is a great shrine with a city around it. This is a sketch of where things are, not the final game map. Only Heartvale is in the game so far.\u003c/p>\n\u003ch2 id=\"s-travelling-between-regions\">Travelling between regions\u003c/h2>\n\u003cp>The land between the cities is where \u003ca href=\"#the-withering\" data-to=\"the-withering\">The Withering\u003c/a> is worst, so nobody wanders it lightly. There are three ways to get around.\u003c/p>\n\u003ch3 id=\"s-1-the-kings-roads\">1. The King's Roads\u003c/h3>\n\u003cp>\u003ca href=\"#aldmera\" data-to=\"aldmera\">Aldmera\u003c/a> built roads everywhere, and the main ones still run from Emberhold out to every great shrine city. The Emberguard keep \u003cb>small shrines\u003c/b> all along them, a few miles apart, so the roads stay warm and fairly safe, and an Emberborn who falls on the road wakes at the nearest one. Off the road, the wilds get dangerous fast.\u003c/p>\n\u003cp>The first time you go to a region (its \u003ci>Arrival\u003c/i> stage, in Act 2), you walk or ride its King's Road. The journey is part of the quest: escorting a caravan, relighting a roadside shrine that's gone dark, clearing an ambush.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The roadside shrines warm a strip of land along each road, which is why the roads are safe. That strip gets narrower every year, because Vale drinks from every shrine's thread. Old travellers say the green verge used to reach out of sight. Now it's a stone's throw.\u003c/p>\u003c/div>\n\u003ch3 id=\"s-2-shrine-walking\">2. Shrine-walking\u003c/h3>\n\u003cp>Once you've reached a great shrine and it knows you, you can \u003cb>shrine-walk\u003c/b>: step into one great shrine and out of another, along the threads that link them. It's the game's fast travel. The Emberguard teach it as a gift of the Heart Shrine to its heroes.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>You're travelling along the same threads that carry stolen ember to the Undying. In Act 4, after Wick cuts your thread, shrine-walking stops working until you've freed a great shrine. You can then walk between the shrines you've freed, and Ashbound hearths.\u003c/p>\u003c/div>\n\u003ch3 id=\"s-3-boats-and-caravans\">3. Boats and caravans\u003c/h3>\n\u003cul>\u003cli>A \u003cb>ferry\u003c/b> runs from Saltmere's harbour down the coast to \u003ca href=\"#the-tangle\" data-to=\"the-tangle\">The Tangle\u003c/a>.\u003c/li>\u003cli>\u003cb>Caravans\u003c/b> cross the Barrens on the Whitestone road, as far as it's safe.\u003c/li>\u003cli>The roads to \u003ca href=\"#frostfell\" data-to=\"frostfell\">Frostfell\u003c/a> and \u003ca href=\"#the-sundered-crown\" data-to=\"the-sundered-crown\">The Sundered Crown\u003c/a> are closed, by snow and by the Emberguard, until the story opens them.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-story-gating\">Story gating\u003c/h3>\n\u003cp>All six outer regions open at the end of Act 1 (see \u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a>). Frostfell opens in Act 4, the Hollow Heart at the end of Act 4, and the Sundered Crown in the endgame.\u003c/p>","src":["wiki/pages/world-map.md"],"w":true,"r":false},{"s":"worm-bait","t":"Worm bait","c":"Items","i":"🪱","sum":"Materials and food. Sells for 2 bronze.","a":[],"ib":[["Kind","Materials and food"],["Shop pays","2 bronze"],["Game id","\u003ccode>bait_worm\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>, \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cp>Nowhere in the game yet.\u003c/p>","src":["shared/items.ts"],"w":false,"r":false},{"s":"worms","t":"Worms","c":"Items","i":"🪱","sum":"Herbs, roots and crop. Sells for 1 bronze.","a":["worm"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","1 bronze"],["Game id","\u003ccode>worm\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dug up with \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> level 1 (2 XP).\u003c/li>\u003cli>Sold by \u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>.\u003c/li>\u003cli>Sold by \u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#handy-work\" data-to=\"handy-work\">Handy work\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#worm-bait\" data-to=\"worm-bait\">Worm bait\u003c/a>.\u003c/li>\u003cli>Goes into \u003ca href=\"#chum-bait\" data-to=\"chum-bait\">Chum bait\u003c/a>.\u003c/li>\u003cli>Goes into \u003ca href=\"#glow-bait\" data-to=\"glow-bait\">Glow bait\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"yew-logs","t":"Yew logs","c":"Items","i":"🪵","sum":"Log. Sells for 25 bronze.","a":["yew log"],"ib":[["Kind","Logs"],["Shop pays","25 bronze"],["Game id","\u003ccode>yew_logs\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a> level 35 from a yew tree (16 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Used for tool handles, bows, staffs and arrows, and burned as cooking fuel.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"your-lantern","t":"Your lantern","c":"Items","i":"🏮","sum":"Keeper Aldric's gift. While it's in your bag, nights are less dark for you.","a":["lantern"],"ib":[["Kind","Story items"],["Shop pays","Can't be sold"],["Game id","\u003ccode>lantern\u003c/code>"]],"h":"\u003cp>Keeper Aldric's gift. While it's in your bag, nights are less dark for you.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Given in the quest \u003ca href=\"#light-the-way\" data-to=\"light-the-way\">Light the Way\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false}]};
const bySlug = new Map(WIKI.pages.map((p) => [p.s, p]));
const CAT_ICONS = { Wiki: "📖", Lore: "🔥", History: "⏳", Story: "🎭", Places: "🗺️", Factions: "⚜️", People: "🧑", Quests: "📜", Skills: "📊", Spells: "🪄", Monsters: "🐺", Items: "🎒", Mechanics: "⚙️", Books: "📚", Updates: "🆕" };
const CAT_BLURBS = {
  Wiki: "About this wiki, and how to keep it current.", Lore: "The Emberheart, the ember, and what's really going on.", History: "Five hundred years, as it happened and as people tell it.",
  Story: "The main story, the twists, and the quests still to build.", Places: "Every region, town, building and cave.", Factions: "The Emberguard, the Ashbound and everyone between.",
  People: "Everyone in Emberhold, and the story's other characters.", Quests: "Every quest in the game today, step by step.", Skills: "Disciplines and skills, with their skill trees.",
  Spells: "Every spell, its level and its mana.", Monsters: "Every monster, where it lives and what it drops.", Items: "Everything you can carry, where to get it, and what it's for.",
  Mechanics: "The numbers behind the game.", Books: "The books on the game's shelves.", Updates: "Every game update, by version.",
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const strip = (h) => h.replace(/<[^>]+>/g, " ").replace(/&amp;/g, "&").replace(/&quot;/g, '"').replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/\s+/g, " ").trim();
const catSlug = (c) => "cat-" + c.toLowerCase();

// Links between pages, for "What links here".
const backlinks = new Map();
for (const p of WIKI.pages) for (const m of p.h.matchAll(/data-to="([^"]+)"/g)) { if (m[1] === p.s) continue; if (!backlinks.has(m[1])) backlinks.set(m[1], new Set()); backlinks.get(m[1]).add(p.s); }
const textOf = new Map(WIKI.pages.map((p) => [p.s, (p.t + " " + p.a.join(" ") + " " + strip(p.sum) + " " + strip(p.h)).toLowerCase()]));

// ---- sidebar ----
const side = document.getElementById("side");
function drawSide(current) {
  const counts = {}; for (const p of WIKI.pages) counts[p.c] = (counts[p.c] || 0) + 1;
  side.innerHTML = `<h3>Start</h3><a href="#main-page" class="${current === "main-page" ? "on" : ""}"><span>Main page</span></a><a href="#maps" class="${current === "maps" ? "on" : ""}"><span>🗺️ Maps</span></a><a href="#random"><span>Random page</span></a>` +
    `<h3>Categories</h3>` + WIKI.categories.map((c) => `<a href="#${catSlug(c)}" class="${current === catSlug(c) ? "on" : ""}"><span>${CAT_ICONS[c] || ""} ${esc(c)}</span><span>${counts[c]}</span></a>`).join("") +
    `<h3>This wiki</h3>${notesDb ? `<a href="#notes" class="${current === "notes" ? "on" : ""}"><span>📝 Change notes</span><span>${openCount() || ""}</span></a>` : ""}<a href="#how-to-update-the-wiki"><span>How to update it</span></a><a href="#names"><span>Names</span></a><a href="#version-history"><span>Game version ${esc(WIKI.version)}</span></a>`;
}

// ---- pages ----
const view = document.getElementById("page");
function infobox(p) {
  if (!p.ib.length) return "";
  return `<aside class="infobox"><div class="ib-head">${p.i ? `<div class="ib-icon">${p.i}</div>` : ""}<div class="ib-title">${esc(p.t)}</div><div class="ib-cat">${esc(p.c)}</div></div>` +
    (p.ib.length ? `<dl>${p.ib.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>` : "") + `</aside>`;
}
function toc(html) {
  const hs = [...html.matchAll(/<h2 id="([^"]+)">(.*?)<\/h2>/g)];
  if (hs.length < 3) return "";
  return `<nav class="toc" aria-label="Contents"><b>Contents</b><ol>${hs.map((h) => `<li><a href="#" data-jump="${h[1]}">${strip(h[2])}</a></li>`).join("")}</ol></nav>`;
}
function showPage(p) {
  const links = [...(backlinks.get(p.s) || [])].map((s) => bySlug.get(s)).filter(Boolean).sort((a, b) => a.t.localeCompare(b.t));
  const made = p.w
    ? `<span class="made written">✍️ Written page</span> Edit <code>${esc(p.src[0])}</code>${p.src.length > 1 ? `; the "In the game" part comes from ${p.src.slice(1).map((s) => `<code>${esc(s)}</code>`).join(", ")}` : ""}.`
    : `<span class="made game">⚙️ Made from the game's code</span> ${p.src.map((s) => `<code>${esc(s)}</code>`).join(", ")}. Change the game, then rebuild the wiki.`;
  let extra = "";
  if (p.s === "main-page") extra = mainExtras();
  view.innerHTML = `<div class="crumb"><a href="#${catSlug(p.c)}">${CAT_ICONS[p.c] || ""} ${esc(p.c)}</a></div><h1>${esc(p.t)}</h1>` +
    (p.sum ? `<p class="lede">${p.sum}</p>` : `<div class="lede"></div>`) + noteBar(p) +
    `<div class="content">${infobox(p)}${toc(p.h)}${p.h}${extra}</div>` +
    `<div class="foot"><div>${made}${p.r ? ` Some names here were swapped from the game's old ones (see <a href="#names">Names</a>).` : ""}</div>` +
    `<div class="chips">Category: <a class="chip" href="#${catSlug(p.c)}">${esc(p.c)}</a></div>` +
    (links.length ? `<div><b>What links here:</b> ${links.map((l) => `<a href="#${l.s}">${esc(l.t)}</a>`).join(", ")}</div>` : "") + `</div>`;
  document.title = p.s === "main-page" ? "Emberfall Wiki" : `${p.t} · Emberfall Wiki`;
}
function mainExtras() {
  const counts = {}; for (const p of WIKI.pages) counts[p.c] = (counts[p.c] || 0) + 1;
  return `<h2 id="s-browse">Browse</h2><div class="cats">` + WIKI.categories.filter((c) => c !== "Wiki").map((c) =>
    `<a class="cat" href="#${catSlug(c)}"><h3>${CAT_ICONS[c] || ""} ${esc(c)} <span>${counts[c]}</span></h3><p>${esc(CAT_BLURBS[c] || "")}</p></a>`).join("") + `</div>` +
    `<p style="color:var(--muted);font-size:14px">${WIKI.pages.length} pages. Built ${esc(WIKI.built)} from game version ${esc(WIKI.version)}.</p>`;
}
function rows(list, q) {
  let letter = "";
  return `<div class="list">` + list.map((p) => {
    const L = p.t.replace(/^(The|A) /, "")[0].toUpperCase();
    const head = !q && L !== letter ? `<div class="letter">${(letter = L)}</div>` : "";
    return `${head}<div class="row"><a href="#${p.s}">${p.i ? p.i + " " : ""}${esc(p.t)}</a>${p.sum ? `<small>${q ? snippet(p, q) : strip(p.sum)}</small>` : q ? `<small>${snippet(p, q)}</small>` : ""}</div>`;
  }).join("") + `</div>`;
}
function showCategory(c) {
  const list = WIKI.pages.filter((p) => p.c === c).sort((a, b) => a.t.replace(/^(The|A) /, "").localeCompare(b.t.replace(/^(The|A) /, "")));
  view.innerHTML = `<div class="crumb"><a href="#main-page">Main page</a></div><h1>${CAT_ICONS[c] || ""} ${esc(c)}</h1><p class="lede">${esc(CAT_BLURBS[c] || "")} ${list.length} pages.</p><div class="content">${rows(list)}</div>`;
  document.title = `${c} · Emberfall Wiki`;
}
function snippet(p, q) {
  const t = strip(p.sum + " " + p.h); const i = t.toLowerCase().indexOf(q);
  if (i < 0) return esc(t.slice(0, 120));
  const s = Math.max(0, i - 50);
  return `<span class="hit">${s ? "…" : ""}${esc(t.slice(s, i))}<mark>${esc(t.slice(i, i + q.length))}</mark>${esc(t.slice(i + q.length, i + q.length + 80))}…</span>`;
}
function search(q) {
  q = q.trim().toLowerCase(); if (!q) return [];
  const scored = [];
  for (const p of WIKI.pages) {
    const t = p.t.toLowerCase();
    let s = t === q ? 100 : t.startsWith(q) ? 80 : t.includes(q) ? 60 : p.a.some((a) => a.toLowerCase().includes(q)) ? 50 : 0;
    if (!s) { const n = textOf.get(p.s).split(q).length - 1; if (n) s = Math.min(40, 10 + n * 3); }
    if (s) scored.push([s, p]);
  }
  return scored.sort((a, b) => b[0] - a[0] || a[1].t.localeCompare(b[1].t)).map((x) => x[1]);
}
let lastQuery = "";
function showSearch(q) {
  const list = search(q);
  view.innerHTML = `<div class="crumb"><a href="#main-page">Main page</a></div><h1>Search: ${esc(q)}</h1><p class="lede">${list.length ? `${list.length} page${list.length > 1 ? "s" : ""} mention it.` : "No page mentions that yet."}</p><div class="content">${rows(list, q.trim().toLowerCase())}</div>`;
}


// ---- maps: drawn tile by tile from the game's own map ----
const MARK_STYLE = { person: ["#ffffff", "#1b2029"], monster: ["#ff5a5a", "#3a0d0d"], door: ["#ffd84a", "#3a2a00"] };
function drawMaps() {
  for (const fig of view.querySelectorAll(".map[data-area]")) {
    const m = WIKI.maps[fig.dataset.area];
    if (!m) continue;
    const px = Math.max(4, Math.min(24, Math.floor(1200 / m.w)));
    const c = document.createElement("canvas");
    c.width = m.w * px; c.height = m.h * px;
    const g = c.getContext("2d");
    for (let y = 0; y < m.h; y++) {
      const row = m.rows[y];
      for (let x = 0; x < m.w; x++) { g.fillStyle = m.palette[row.charCodeAt(x) - 48]; g.fillRect(x * px, y * px, px, px); }
    }
    const r = Math.max(3, px * 0.45);
    const dots = m.marks.filter((k) => MARK_STYLE[k.kind]);
    for (const k of dots) {
      const [fill, ring] = MARK_STYLE[k.kind];
      g.beginPath(); g.arc((k.x + .5) * px, (k.y + .5) * px, r, 0, Math.PI * 2);
      g.fillStyle = fill; g.fill(); g.lineWidth = Math.max(1.5, px / 6); g.strokeStyle = ring; g.stroke();
    }
    g.textAlign = "center"; g.textBaseline = "middle"; g.lineJoin = "round";
    const text = (t, x, y, size, color) => { g.font = `600 ${size}px "Source Sans 3", sans-serif`; g.lineWidth = Math.max(3, size / 4); g.strokeStyle = "rgba(0,0,0,.85)"; g.strokeText(t, x, y); g.fillStyle = color; g.fillText(t, x, y); };
    for (const k of m.marks) if (k.kind === "label" || k.kind === "big") text(k.text, k.x * px, k.y * px, k.kind === "big" ? px * 4.2 : px * 3.2, k.kind === "big" ? "#ffe9a8" : "#ffffff");
    if (px >= 10) for (const k of dots) if (k.kind !== "monster") text(k.text, (k.x + .5) * px, (k.y - .6) * px, Math.max(11, px * .75), k.kind === "door" ? "#ffe9a8" : "#ffffff");
    if (m.w < 120) c.style.maxWidth = m.w * 16 + "px"; // small rooms stay small
    const wrap = document.createElement("div"); wrap.className = "mw"; wrap.appendChild(c);
    const cap = document.createElement("figcaption");
    cap.innerHTML = `<span>${esc(m.name)}: ${m.w} × ${m.h} tiles</span><span>⚪ people</span><span>🔴 monsters</span><span>🟡 doors</span><span>Tap to zoom; tap a dot to open its page.</span>`;
    fig.replaceChildren(wrap, cap);
    const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; fig.appendChild(tip);
    const hit = (e) => {
      const b = c.getBoundingClientRect(), s = b.width / c.width;
      const tx = (e.clientX - b.left) / s / px, ty = (e.clientY - b.top) / s / px;
      let best = null, bd = Infinity;
      for (const k of dots) { const d = Math.hypot(k.x + .5 - tx, k.y + .5 - ty); if (d < bd) { bd = d; best = k; } }
      const reach = Math.max(1.2, 10 / (s * px));
      return bd <= reach ? best : null;
    };
    c.addEventListener("mousemove", (e) => { const k = hit(e); tip.hidden = !k; if (k) { tip.textContent = k.text; tip.style.left = e.clientX + 12 + "px"; tip.style.top = e.clientY + 12 + "px"; } c.style.cursor = k ? "pointer" : ""; });
    c.addEventListener("mouseleave", () => { tip.hidden = true; });
    c.addEventListener("click", (e) => { const k = hit(e); if (k && k.to && bySlug.has(k.to)) location.hash = k.to; else fig.classList.toggle("zoomed"); });
  }
}

// ---- routing (plain #slug links) ----
function route() {
  let h = decodeURIComponent(location.hash.slice(1)) || "main-page";
  if (h === "random") { const p = WIKI.pages[Math.floor(Math.random() * WIKI.pages.length)]; location.replace("#" + p.s); return; }
  if (h === "search") { showSearch(lastQuery); drawSide(h); return; }
  if (h === "notes") { showNotes(); drawSide(h); window.scrollTo(0, 0); return; }
  const cat = WIKI.categories.find((c) => catSlug(c) === h);
  if (cat) showCategory(cat); else showPage(bySlug.get(h) || bySlug.get("main-page"));
  drawSide(h);
  drawMaps();
  document.body.classList.remove("menu-open");
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
view.addEventListener("click", (e) => {
  const j = e.target.closest("[data-jump]");
  if (j) { e.preventDefault(); document.getElementById(j.dataset.jump)?.scrollIntoView({ behavior: "smooth", block: "start" }); }
});

// ---- search box ----
const q = document.getElementById("q"), results = document.getElementById("results");
let sel = -1;
function drawResults() {
  const list = search(q.value).slice(0, 8);
  sel = -1;
  if (!q.value.trim()) { results.hidden = true; return; }
  results.innerHTML = list.map((p) => `<a href="#${p.s}"><span class="ri">${p.i || "📄"}</span><span class="rt">${esc(p.t)}</span><span class="rc">${esc(p.c)}</span></a>`).join("") +
    `<a href="#search" data-all="1"><span class="ri">🔎</span><span>Every page that mentions “${esc(q.value.trim())}”</span></a>`;
  results.hidden = false;
}
q.addEventListener("input", drawResults);
q.addEventListener("keydown", (e) => {
  const items = [...results.querySelectorAll("a")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; items.forEach((a, i) => a.classList.toggle("on", i === sel)); }
  else if (e.key === "Enter") { e.preventDefault(); const a = items[sel] || items[items.length - 1]; if (a) a.click(); }
  else if (e.key === "Escape") { results.hidden = true; q.blur(); }
});
results.addEventListener("click", (e) => {
  const a = e.target.closest("a"); if (!a) return;
  lastQuery = q.value;
  if (a.dataset.all) { e.preventDefault(); if (location.hash === "#search") route(); else location.hash = "search"; }
  results.hidden = true; q.value = ""; q.blur();
});
document.addEventListener("click", (e) => { if (!e.target.closest(".search")) results.hidden = true; if (!e.target.closest(".side, #menuBtn")) document.body.classList.remove("menu-open"); });
document.addEventListener("keydown", (e) => { if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); } });
document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.toggle("menu-open"));

// ---- secrets toggle (remembered in this browser only) ----
const secrets = document.getElementById("secrets");
try { if (localStorage.getItem("emberfall-wiki-secrets") === "off") secrets.checked = false; } catch {}
const applySecrets = () => { document.body.classList.toggle("no-secrets", !secrets.checked); try { localStorage.setItem("emberfall-wiki-secrets", secrets.checked ? "on" : "off"); } catch {} };
secrets.addEventListener("change", applySecrets);
applySecrets();
route();
// ---- change notes (saved in the artifact's shared store, so Claude can read them) ----
var notesDb = null, notes = [], notesErr = "";
var NOTE_KEY = "wiki-note-draft";
const pageNotes = (slug) => notes.filter((n) => n.page === slug);
const openCount = () => notes.filter((n) => n.status !== "done").length;
function whenStr(t) { try { return new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); } catch { return ""; } }
function noteBar(p) {
  if (!notesDb) return "";
  const n = pageNotes(p.s).filter((x) => x.status !== "done").length;
  return `<div class="notebar"><button class="btn-note" data-note-open>✏️ Suggest a change</button>` +
    (n ? `<a class="note-count" href="#notes">${n} open note${n > 1 ? "s" : ""} on this page</a>` : "") + `</div><div id="noteSlot"></div>`;
}
function openNoteForm(p) {
  const slot = document.getElementById("noteSlot"); if (!slot) return;
  const heads = [...p.h.matchAll(/<h[23] id="[^"]+">(.*?)<\/h[23]>/g)].map((m) => strip(m[1]));
  let draft = ""; try { draft = sessionStorage.getItem(NOTE_KEY + p.s) || ""; } catch {}
  slot.innerHTML = `<form class="note-form"><label>Which part?</label><select name="part"><option>The whole page</option>${heads.map((h) => `<option>${esc(h)}</option>`).join("")}</select>` +
    `<label>What should change?</label><textarea name="text" placeholder="For example: Holt should count trees at the valley's edge, not the Thornwood."></textarea>` +
    `<div class="row"><button class="btn-go" type="submit">Save note</button><button class="btn-plain" type="button" data-note-cancel>Cancel</button><span class="msg"></span></div></form>`;
  const form = slot.querySelector("form"), ta = form.text, msg = form.querySelector(".msg");
  ta.value = draft; ta.focus();
  ta.addEventListener("input", () => { try { sessionStorage.setItem(NOTE_KEY + p.s, ta.value); } catch {} });
  form.querySelector("[data-note-cancel]").onclick = () => { slot.innerHTML = ""; };
  form.onsubmit = async (e) => {
    e.preventDefault();
    const text = ta.value.trim(); if (!text) { msg.textContent = "Type a note first."; return; }
    form.querySelector("button[type=submit]").disabled = true; msg.textContent = "Saving…";
    try {
      await notesDb.collection("notes").add({ page: p.s, title: p.t, part: form.part.value, text, status: "open", reply: "", created: new Date().toISOString() });
      try { sessionStorage.removeItem(NOTE_KEY + p.s); } catch {}
      slot.innerHTML = `<p class="note-count">✅ Saved. You'll find it under <a href="#notes">Change notes</a>. Tell Claude when you've left a batch.</p>`;
    } catch (err) {
      form.querySelector("button[type=submit]").disabled = false;
      msg.textContent = "Couldn't save it (" + (err && err.code || "error") + "). Your text is kept; try again.";
    }
  };
}
function showNotes() {
  const list = [...notes].sort((a, b) => (a.status === "done") - (b.status === "done") || String(b.created).localeCompare(String(a.created)));
  const card = (n) => `<div class="note-card ${n.status === "done" ? "done" : ""}"><div class="meta"><span class="tag ${n.status === "done" ? "" : "open"}">${n.status === "done" ? "Done" : "Open"}</span>` +
    `<a href="#${esc(n.page)}">${esc(n.title || n.page)}</a>${n.part && n.part !== "The whole page" ? `<span>· ${esc(n.part)}</span>` : ""}<span>· ${esc(whenStr(n.created))}</span>` +
    `<span style="margin-left:auto;display:flex;gap:6px"><button class="btn-plain" data-note-toggle="${esc(n.id)}">${n.status === "done" ? "Reopen" : "Mark done"}</button><button class="btn-plain" data-note-del="${esc(n.id)}">Delete</button></span></div>` +
    `<div class="text">${esc(n.text)}</div>${n.reply ? `<div class="reply">Claude: ${esc(n.reply)}</div>` : ""}</div>`;
  view.innerHTML = `<div class="crumb"><a href="#main-page">Main page</a></div><h1>📝 Change notes</h1>` +
    `<p class="lede">Notes left with the ✏️ Suggest a change button on any page. Claude reads them, makes the changes, marks them done and replies under each one.</p><div class="content">` +
    (!notesDb ? `<p>${notesErr || "Change notes only work when the wiki is opened on claude.ai while signed in."}</p>` :
      list.length ? `<div class="notes-list">${list.map(card).join("")}</div>` : `<p>No notes yet. Open any page and press ✏️ Suggest a change.</p>`) + `</div>`;
  document.title = "Change notes · Emberfall Wiki";
}
view.addEventListener("click", async (e) => {
  if (e.target.closest("[data-note-open]")) { const p = bySlug.get(decodeURIComponent(location.hash.slice(1)) || "main-page") || bySlug.get("main-page"); openNoteForm(p); return; }
  const t = e.target.closest("[data-note-toggle]"), d = e.target.closest("[data-note-del]");
  if (!notesDb || !(t || d)) return;
  const id = (t || d).dataset.noteToggle || (t || d).dataset.noteDel;
  const n = notes.find((x) => x.id === id); if (!n) return;
  try {
    if (t) await notesDb.doc("notes/" + id).update({ status: n.status === "done" ? "open" : "done" });
    else if (d.dataset.armed) await notesDb.doc("notes/" + id).delete();
    else { d.dataset.armed = "1"; d.textContent = "Sure? Delete"; }
  } catch (err) { (t || d).textContent = "Couldn't change it"; }
});
(async () => {
  try {
    notesDb = window.claude && typeof window.claude.use === "function" ? await window.claude.use("db") : null;
  } catch { notesDb = null; }
  if (!notesDb) { notesErr = ""; return; }
  const timer = setTimeout(() => { notesErr = "The notes are taking a while to load."; }, 10000);
  notesDb.collection("notes").onSnapshot((snap) => {
    clearTimeout(timer);
    notes = snap.docs.map((d) => ({ id: d.id, ...(d.data() || {}) }));
    const h = decodeURIComponent(location.hash.slice(1));
    if (h === "notes") showNotes(); else refreshBar();
    drawSide(h || "main-page");
  }, (err) => { clearTimeout(timer); notesErr = "Couldn't load the notes (" + (err && err.code || "error") + ")."; });
  refreshBar(); drawSide(decodeURIComponent(location.hash.slice(1)) || "main-page");
})();
/** Put the note button on the page being shown (or update its count) without re-drawing the page. */
function refreshBar() {
  const h = decodeURIComponent(location.hash.slice(1)) || "main-page";
  const p = bySlug.get(h); if (!p || !notesDb) return;
  const tmp = document.createElement("div"); tmp.innerHTML = noteBar(p);
  const nb = view.querySelector(".notebar");
  if (nb) nb.replaceWith(tmp.firstElementChild);
  else { const c = view.querySelector(".content"); if (c) c.before(...tmp.childNodes); }
}

</script>
