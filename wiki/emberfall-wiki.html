. New \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> wake at them, and fallen Emberborn come back at the nearest one. A dark shrine raises no one. Every child is taught that the shrines hold back the torrent of \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">the Emberfall\u003c/a>, and that without them it would break loose again.\u003c/p>\n\u003ch2 id=\"s-great-shrines-and-small-ones\">Great shrines and small ones\u003c/h2>\n\u003cp>Right after the Fall, each member of \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a> raised a \u003cb>great shrine\u003c/b> in their own region, bound to it, to pin the wild ember down. The land around each great shrine is warm and rich, so survivors gathered there, and each one became the heart of a city.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Great shrine\u003c/th>\u003cth>Region\u003c/th>\u003cth>Raised by\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#the-heart-shrine\" data-to=\"the-heart-shrine\">The Heart Shrine\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a> (in \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>)\u003c/td>\u003ctd>\u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Thornwood great shrine\u003c/td>\u003ctd>\u003ca href=\"#the-thornwood\" data-to=\"the-thornwood\">The Thornwood\u003c/a>\u003c/td>\u003ctd>Crowe\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Greyspine great shrine\u003c/td>\u003ctd>\u003ca href=\"#greyspine-peaks\" data-to=\"greyspine-peaks\">Greyspine Peaks\u003c/a>\u003c/td>\u003ctd>Flint\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Tangle great shrine\u003c/td>\u003ctd>\u003ca href=\"#the-tangle\" data-to=\"the-tangle\">The Tangle\u003c/a>\u003c/td>\u003ctd>Ivy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Saltmere great shrine\u003c/td>\u003ctd>\u003ca href=\"#saltmere-coast\" data-to=\"saltmere-coast\">Saltmere Coast\u003c/a>\u003c/td>\u003ctd>Merrow\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Barrens great shrine\u003c/td>\u003ctd>\u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a>\u003c/td>\u003ctd>Dunn\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Blackfen great shrine\u003c/td>\u003ctd>\u003ca href=\"#blackfen\" data-to=\"blackfen\">Blackfen\u003c/a>\u003c/td>\u003ctd>Reed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The frozen shrine\u003c/td>\u003ctd>\u003ca href=\"#frostfell\" data-to=\"frostfell\">Frostfell\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a>. Frozen since the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Over the centuries the Emberguard built \u003cb>small shrines\u003c/b> along every road, so an Emberborn is never far from one. In \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a> there's the Westroad shrine, rebuilt in Act 1, and a new shrine at the valley's edge, lit at the end of Act 1 (the game today puts it at the Thornwood's edge). Each region's great shrine is kept by an \u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwarden\u003c/a>.\u003c/p>\n\u003cp>The Drowned Shrine off \u003ca href=\"#saltmere-coast\" data-to=\"saltmere-coast\">Saltmere Coast\u003c/a>, one of the oldest small shrines, sank with a carving that still reads: \u003ci>&quot;The shrines shall close when the land is healed.&quot;\u003c/i>\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003ch2 id=\"s-whats-really-wrong\">What's really wrong\u003c/h2>\n\u003cp>\u003cb>The shrines are good.\u003c/b> They do what the Circle built them to do: draw warmth up from \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a>, spread it out over the land, and give Emberborn their bodies. Land near a shrine is warm and green, and always has been.\u003c/p>\n\u003cp>The problem is what's tied to them.\u003c/p>\n\u003cul>\u003cli>\u003cb>Every shrine has a thread.\u003c/b> Each small shrine is threaded to its great shrine, and each great shrine is threaded to \u003ca href=\"#the-heart-shrine\" data-to=\"the-heart-shrine\">The Heart Shrine\u003c/a>. The threads were meant to share warmth between them.\u003c/li>\u003cli>\u003cb>Vale drinks from the threads.\u003c/b> Over the centuries Vale, and the rest of \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a> on a smaller scale, learned to pull ember back down the threads to live on. Vale takes far more than is healthy, and more every century.\u003c/li>\u003cli>\u003cb>So every shrine has less to give.\u003c/b> A shrine still warms the land, but its warmth doesn't reach as far as it used to. The land at the very edge of a shrine's reach goes cold first. That's \u003ca href=\"#the-withering\" data-to=\"the-withering\">The Withering\u003c/a>, and it creeps \u003cb>inward\u003c/b> from the far edges toward the shrines, a little closer every year.\u003c/li>\u003cli>\u003cb>The cities see only the warmth.\u003c/b> They're right next to the great shrines, so they feel nothing missing. The people who notice are the ones who live or work at the edges: foresters, farmers, hunters, herbalists.\u003c/li>\u003c/ul>\n\u003cp>Each time an Emberborn falls and comes back, the shrine skims a little ember off them and sends it down the thread (\u003ca href=\"#the-tithe\" data-to=\"the-tithe\">The Tithe\u003c/a>). Every \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a> sends a whole champion's ember down the Heart Shrine's thread to Vale.\u003c/p>\n\u003cp>In Act 4, players learn from Wick how to \u003cb>free\u003c/b> a great shrine: cut its thread to the Heart Shrine, so everything it draws goes back out to the land. A freed shrine's warmth spreads outward again, and the region starts to heal from the shrine toward the edges.\u003c/p>\u003c/div>","src":["wiki/pages/shrines.md"],"w":true,"r":false},{"s":"the-spider-cave","t":"The spider cave","c":"Places","i":"🕳️","sum":"","a":[],"ib":[["Kind","Cave"],["Danger","Monsters attack on sight"],["Size","28 × 15 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"spider_cave\">\u003c/figure>\n\u003cp>\u003cb>Monsters:\u003c/b> \u003ca href=\"#cave-spider\" data-to=\"cave-spider\">Cave spider\u003c/a> (3).\u003c/p>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"the-sundered-crown","t":"The Sundered Crown","c":"Places","i":"🌑","sum":"The endgame: the ruins of Whitestone, Aldmera's old capital, in the far west.","a":[],"ib":[["Levels","75+"],["Region","Its own, west of \u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a>"],["Home of","Ancient Aldmeran seeds and royal treasure (see \u003ca href=\"#resources-by-region\" data-to=\"resources-by-region\">Resources by region\u003c/a>)"]],"h":"\u003cp>\u003cb>The Sundered Crown\u003c/b> is what's left of \u003ca href=\"#whitestone\" data-to=\"whitestone\">Whitestone\u003c/a>, the capital of \u003ca href=\"#aldmera\" data-to=\"aldmera\">Aldmera\u003c/a>: a broken city of white stone, half buried in glass and ash, past the far western edge of \u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a>. It's the biggest ruin in the land, the most dangerous place in it, and the game's endgame, for after the main story is done. People call it the Sundered Crown because the kingdom's crown city was split apart in the Emberfall.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The royal Crown Vault under its ruins holds the \u003ca href=\"#ember-seed\" data-to=\"ember-seed\">Ember Seed\u003c/a> and the other half of the \u003ca href=\"#ember-crown\" data-to=\"ember-crown\">Ember Crown\u003c/a>. In the endgame, players search the ruins for the Seed, while the impostor wardens Ivy and Reed hunt the Crown half to bring Vale back (see \u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a>).\u003c/p>\u003c/div>","src":["wiki/pages/sundered-crown.md"],"w":true,"r":false},{"s":"the-tangle","t":"The Tangle","c":"Places","i":"🌴","sum":"Jungle, with a city in the canopy around its great shrine. Far from it, the vines strangle everything.","a":["Tangle"],"ib":[["Levels","20 to 60 (easy near the city, harder further out)"],["Great shrine","Kept by Warden Ivy"],["Home of","Foraging and Hunting: ironwood, rare jungle herbs, emeralds and big game hides (see \u003ca href=\"#resources-by-region\" data-to=\"resources-by-region\">Resources by region\u003c/a>)"]],"h":"\u003cp>\u003cb>The Tangle\u003c/b> is a hot, wet jungle: giant trees, rivers, waterfalls and old \u003ca href=\"#aldmera\" data-to=\"aldmera\">Aldmeran\u003c/a> bridges swallowed by roots. Its great shrine stands in a city built up into the canopy. Warden Ivy keeps it (\u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwardens\u003c/a>).\u003c/p>\n\u003cp>Far from the shrine, the jungle withers by growing too much: vines thicken until they strangle the trees, choke the rivers and pull down whole ruins.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>Warden Ivy is an impostor. The real Ivy, who raised the shrine, sided with \u003ca href=\"#wick\" data-to=\"wick\">Wick\u003c/a> in the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a> and was killed.\u003c/p>\u003c/div>\n\u003cp>The name is a placeholder. Not in the game yet.\u003c/p>","src":["wiki/pages/tangle.md"],"w":true,"r":false},{"s":"the-tenders","t":"The Tenders","c":"Lore","i":"🏺","sum":"The old country folk of Aldmera, who lived by the rule: take only what the land gives back.","a":["Tenders","Hearthwise","The Hearthwise"],"ib":[],"h":"\u003cp>\u003cb>The Tenders\u003c/b> were the country folk of \u003ca href=\"#aldmera\" data-to=\"aldmera\">Aldmera\u003c/a> who lived by the one rule of \u003ca href=\"#the-ember\" data-to=\"the-ember\">The ember\u003c/a>: \u003ci>&quot;Take only what the land gives back.&quot;\u003c/i> They tended the land like a hearth: a little fuel in, a little warmth out, never more. Their saying is still painted over a few old doorways.\u003c/p>\n\u003cp>Their ways live on in odd places. The goblins of \u003ca href=\"#greyspine-peaks\" data-to=\"greyspine-peaks\">Greyspine Peaks\u003c/a> sing a Tender song to keep the grey sickness away, and \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a> build hearths that burn without a shrine, the Tender way.\u003c/p>\n\u003cp>They used to be called the Hearthwise in the wiki.\u003c/p>","src":["wiki/pages/tenders.md"],"w":true,"r":false},{"s":"the-thornwood","t":"The Thornwood","c":"Places","i":"🌲","sum":"Deep forest south of town, slowly going dark.","a":["Thornwood","Dark Forest"],"ib":[["Levels","20 to 60 (easy near the city, harder further out)"],["Home of","Woodcutting: maple, yew and elderwood, plus truffles and night mushrooms (see \u003ca href=\"#resources-by-region\" data-to=\"resources-by-region\">Resources by region\u003c/a>)"]],"h":"\u003cp>\u003cb>The Thornwood\u003c/b> is the deep forest south of \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>, behind the fenced gate. In the game its edge is the danger zone: monsters there attack on sight. It holds the Goblin camp, Spider hollow, Wolf Hollow, an Ashbound camp and \u003ca href=\"#the-graveyard\" data-to=\"the-graveyard\">The Graveyard\u003c/a>.\u003c/p>\n\u003cp>Its old trees glowed with \u003ca href=\"#the-ember\" data-to=\"the-ember\">ember\u003c/a> at night. Now the woods are going dark: the Dark Forest is spreading toward \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a> a few steps a day. \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a> remembers when it still glowed. Its great shrine, with a forest town around it, is kept by Warden Crowe (see \u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwardens\u003c/a>); in the game today, Act 1 ends with lighting a new shrine at the forest's edge (\u003ci>\u003ca href=\"#a-flame-in-the-thornwood\" data-to=\"a-flame-in-the-thornwood\">A Flame in the Thornwood\u003c/a>\u003c/i>). The plan moves that quest inside Heartvale (see \u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a>).\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The glow is ember. The shrines have less of it to give every year, because Vale drinks from their threads, so the glow is dying from the far side of the forest inward. Where it's gone, the bark turns black. That's the Dark Forest.\u003c/p>\u003c/div>","src":["wiki/pages/thornwood.md"],"w":true,"r":false},{"s":"the-tithe","t":"The Tithe","c":"Lore","i":"🕯️","sum":"The bit of ember a shrine keeps each time an Emberborn falls and comes back.","a":["Ember Debt","Tithe marks","Soul Debt"],"ib":[],"h":"\u003cp>\u003cb>The Tithe\u003c/b> (also called Ember Debt) is what an \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> pays each time they fall and come back. The Emberguard teach that it's a small, fair price for being made again, and \u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">Alchemist Moss\u003c/a> brews &quot;Tithe tonics&quot; for \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a> to clear it.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>The Tithe is the shrine skimming a little ember off you, sending it on to \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>. Players stop paying it in Act 4, when Wick cuts their thread.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>After the Oath, each time you're knocked out you get a Tithe mark (at most 5). While you have marks, 20% of the XP you earn goes to the shrine instead. Each mark clears once the shrine has taken enough XP (52 at level 1, 640 at level 50). You never lose levels or items. A \u003ca href=\"#tithe-tonic\" data-to=\"tithe-tonic\">Tithe tonic\u003c/a> clears one mark at once.\u003c/p>","src":["wiki/pages/tithe.md","shared/story.ts"],"w":true,"r":false},{"s":"the-totem","t":"The Totem","c":"Quests","i":"📜","sum":"Act 1 from Woodworker Rook.","a":[],"ib":[["Part of","Act 1"],["Given by","Woodworker Rook"],["Where","in the workshop just west of the square"],["Steps","5"]],"h":"\u003cp>\u003cb>The Totem\u003c/b> is part of the Act 1 from \u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>, found in the workshop just west of the square.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#oath-of-the-flame\" data-to=\"oath-of-the-flame\">Oath of the Flame\u003c/a>, \u003ca href=\"#handy-work\" data-to=\"handy-work\">Handy work\u003c/a>, \u003ca href=\"#the-woodcutters-start\" data-to=\"the-woodcutters-start\">The woodcutter's start\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-woodworker-rook\">Step 1: Talk to Woodworker Rook\u003c/h3>\n\u003cp>\u003cb>Woodworker Rook:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Ember, eh? Then you can fetch for the Emberhall same as I carve for it.\u003c/p>\u003cp>They want a shrine totem. Oak, nothing less. Bring me 5 oak logs (the round trees: you need Woodcutting 5) and I'll carve it.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-step-2-chop-5-oak-logs-woodcutting-5\">Step 2: Chop 5 oak logs (Woodcutting 5)\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Oaks are the round trees. You need Woodcutting level 5 to chop them. There are some round the meadows north of town.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-3-bring-the-oak-logs-to-woodworker-rook\">Step 3: Bring the oak logs to Woodworker Rook\u003c/h3>\n\u003cul>\u003cli>\u003cb>Bring:\u003c/b> 5 × \u003ca href=\"#oak-logs\" data-to=\"oak-logs\">Oak logs\u003c/a>.\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Woodworker Rook:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Good wood. Give me a moment.\u003c/p>\u003cp>...There. A shrine totem. Take it to Keeper Aldric.\u003c/p>\u003cp>Oh, and I've tucked a little note inside, for luck. Old carver's habit. Don't you go reading it, mind.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> \u003ca href=\"#shrine-totems\" data-to=\"shrine-totems\">Shrine totems\u003c/a>, \u003ca href=\"#folded-note\" data-to=\"folded-note\">Folded note\u003c/a>.\u003c/p>\n\u003ch3 id=\"s-step-4-deliver-the-totem-to-keeper-aldric\">Step 4: Deliver the totem to Keeper Aldric\u003c/h3>\n\u003cul>\u003cli>\u003cb>Talk to:\u003c/b> Keeper Aldric.\u003c/li>\u003cli>\u003cb>Bring:\u003c/b> \u003ca href=\"#shrine-totems\" data-to=\"shrine-totems\">Shrine totems\u003c/a>.\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Keeper Aldric:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Rook's work! Lovely. He's carved for us for thirty years. This one will go up in a shrine on the Westroad, once we've dealt with the Ashbound.\u003c/p>\u003cp>Go back to Rook and thank him for me, would you?\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-step-5-go-back-to-woodworker-rook\">Step 5: Go back to Woodworker Rook\u003c/h3>\n\u003cp>\u003cb>Woodworker Rook:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Delivered, was it? Good.\u003c/p>\u003cp>Here: I put an oak handle on a bronze axe for you. Oak's tougher than pine, and it shows.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> \u003ca href=\"#axe\" data-to=\"axe\">Bronze axe (Oak)\u003c/a>, 40 Handicraft XP.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> \u003ca href=\"#shrine-totems\" data-to=\"shrine-totems\">Shrine totems\u003c/a>, \u003ca href=\"#folded-note\" data-to=\"folded-note\">Folded note\u003c/a>, \u003ca href=\"#axe\" data-to=\"axe\">Bronze axe (Oak)\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#tithe-tonics\" data-to=\"tithe-tonics\">Tithe Tonics\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#ash-on-the-road\" data-to=\"ash-on-the-road\">Ash on the Road\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"the-training-ground","t":"The Training Ground","c":"Quests","i":"📜","sum":"Prologue from Keeper Aldric.","a":[],"ib":[["Part of","Prologue"],["Given by","Keeper Aldric"],["Where","in the Emberhall, the great white temple on Ember Hill, in the middle of Emberhold"],["Steps","1"]],"h":"\u003cp>\u003cb>The Training Ground\u003c/b> is part of the Prologue from \u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>, found in the Emberhall, the great white temple on Ember Hill, in the middle of Emberhold.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#light-the-way\" data-to=\"light-the-way\">Light the Way\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-keeper-aldric\">Step 1: Talk to Keeper Aldric\u003c/h3>\n\u003cp>\u003cb>Keeper Aldric:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>One more thing. You'll need to feed yourself, and earn your way. Old Maren can teach you that.\u003c/p>\u003cp>You'll find her in the Emberhall Training Ground, just east of the hall, behind the green hedge. She's been here forever, and she teaches every new hero the basics.\u003c/p>\u003cp>Every trainer in the city works there too: woodcutting, mining, smithing, cooking, fighting, magic, farming, all of it. The Emberguard pay them to teach the Emberborn, so every lesson is a gift from the Emberhall.\u003c/p>\u003cp>Learn from all of them, then come back to me and swear the Oath. Off you go: out of the great doors, then east across the plaza. Your 🗺️ map shows Maren's ❗.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#light-the-way\" data-to=\"light-the-way\">Light the Way\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#living-off-the-land\" data-to=\"living-off-the-land\">Living off the land\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"the-undying","t":"The Undying","c":"Factions","i":"💀","sum":"The secret leaders of the Emberguard, who live on the siphon.","a":["Undying"],"ib":[],"h":"\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>\u003cb>The Undying\u003c/b> are the secret leaders of \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>: what's left of \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a> after the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>, and the people Vale has raised to join them. They've lived on the ember their shrines pull in for eight hundred years. They meet below \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>, down its sealed stair, in the Undying's Sanctum.\u003c/p>\n\u003cp>Members:\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a>, as \u003ca href=\"#enchanter-vale\" data-to=\"enchanter-vale\">Enchanter Vale\u003c/a> and the hooded High Keeper. The strongest by far, fed by every \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a>.\u003c/li>\u003cli>Crowe, Flint, Merrow and Dunn: the Circle members who sided with Vale. Today they're four of the \u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwardens\u003c/a>.\u003c/li>\u003cli>Warden Ivy and Warden Reed: impostors wearing the names of the members killed on Wick's side.\u003c/li>\u003cli>\u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a> and a few others Vale rewarded after the war.\u003c/li>\u003c/ul>\n\u003cp>Only Vale knows he killed \u003ca href=\"#king-aldemar-xviii\" data-to=\"king-aldemar-xviii\">King Aldemar XVIII\u003c/a>. The others believe the Emberfall was an accident, and that the land would fall apart without them. They tell themselves the shrines are the only thing holding the torrent back.\u003c/p>\n\u003cp>In Act 4, players hunt down all six Emberwardens and then Vale.\u003c/p>\u003c/div>","src":["wiki/pages/undying.md"],"w":true,"r":false},{"s":"the-wardens","t":"The Wardens","c":"Factions","i":"🏹","sum":"Huntmaster Kael's rangers, guarding the borders against the Blight.","a":["Wardens"],"ib":[],"h":"\u003cp>\u003cb>The Wardens\u003c/b> are \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>'s rangers. They guard the borders against \u003ca href=\"#the-blight\" data-to=\"the-blight\">The Blight\u003c/a>. They're honest. Kael distrusts the Emberguard, but can't say why. Not to be confused with the \u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwardens\u003c/a>.\u003c/p>","src":["wiki/pages/wardens.md"],"w":true,"r":false},{"s":"the-westroad","t":"The Westroad","c":"Places","i":"🛤️","sum":"The road west out of town, with a roadside shrine.","a":["Westroad"],"ib":[],"h":"\u003cp>\u003cb>The Westroad\u003c/b> is the road west out of \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>, with a roadside shrine. Ashbound scouts watch it. In Act 1 you rebuild its shrine (\u003ci>\u003ca href=\"#rebuild-the-shrine\" data-to=\"rebuild-the-shrine\">Rebuild the Shrine\u003c/a>\u003c/i>), and find \u003ci>\u003ca href=\"#ash-on-the-road\" data-to=\"ash-on-the-road\">Ash on the Road\u003c/a>\u003c/i>. The road on toward the Barrens is closed for now.\u003c/p>\n\u003cp>\u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a> smash its shrine first, because it's closest to Emberhold.\u003c/p>","src":["wiki/pages/westroad.md"],"w":true,"r":false},{"s":"the-withering","t":"The Withering","c":"Lore","i":"🥀","sum":"What happens where the ember runs out: the land far from the shrines goes cold, and each region withers in its own way.","a":["The Dark Forest","Withering"],"ib":[],"h":"\u003cp>\u003cb>The Withering\u003c/b> is what happens to land that has lost its \u003ca href=\"#the-ember\" data-to=\"the-ember\">ember\u003c/a>. The cities around the great \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">shrines\u003c/a> are warm and thriving, but out in the wild, far from them, the land is going cold, and animals become \u003ca href=\"#the-blight\" data-to=\"the-blight\">Blighted\u003c/a>. Each region withers in its own way:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Region\u003c/th>\u003cth>How it withers\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>\u003c/td>\u003ctd>Grass turns to grey dust\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-thornwood\" data-to=\"the-thornwood\">The Thornwood\u003c/a>\u003c/td>\u003ctd>The forest rots and goes dark: the Dark Forest, spreading toward \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a> a few steps a day\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#greyspine-peaks\" data-to=\"greyspine-peaks\">Greyspine Peaks\u003c/a>\u003c/td>\u003ctd>Eruptions, and the grey sickness\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-tangle\" data-to=\"the-tangle\">The Tangle\u003c/a>\u003c/td>\u003ctd>Vines that strangle everything\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#saltmere-coast\" data-to=\"saltmere-coast\">Saltmere Coast\u003c/a>\u003c/td>\u003ctd>Drowning tides\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a>\u003c/td>\u003ctd>Glass and sand\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#blackfen\" data-to=\"blackfen\">Blackfen\u003c/a>\u003c/td>\u003ctd>Black water and fog\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#frostfell\" data-to=\"frostfell\">Frostfell\u003c/a>\u003c/td>\u003ctd>Ice, creeping south\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>People say the Withering is just bad luck, and lately the Emberguard say \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a> are spreading it.\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>\u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a> aren't the cause. They still warm the land around them, but \u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Archmage Vale\u003c/a> pulls far too much ember down their threads, so each shrine has less to give and its warmth reaches less far every year. The Withering starts at the far edges, furthest from any shrine, and creeps inward toward them. The cities, right beside the great shrines, feel nothing.\u003c/p>\n\u003cp>The clues all point the same way: something is taking the warmth before it can reach the edges.\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>'s count: the trees near the shrines are fine, almost every tree out at the valley's edge is dead, and his father's count forty years ago found the edge still green.\u003c/li>\u003cli>\u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a>'s maps, drawn every ten years, show the grey ring tightening around the shrines.\u003c/li>\u003cli>\u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>: the Blight is always worst furthest from a shrine, and the line moves closer every year.\u003c/li>\u003cli>\u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>: a blessing lasted a whole season in his gran's day, and barely a week now.\u003c/li>\u003cli>A relit shrine's warmth is pulled back down its thread toward \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a> (see \u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a>).\u003c/li>\u003c/ul>\n\u003cp>It began centuries before the Ashbound existed.\u003c/p>\u003c/div>","src":["wiki/pages/withering.md"],"w":true,"r":false},{"s":"the-wolf-den","t":"The wolf den","c":"Places","i":"🕳️","sum":"","a":[],"ib":[["Kind","Cave"],["Danger","Monsters attack on sight"],["Size","20 × 13 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"wolf_den\">\u003c/figure>\n\u003cp>\u003cb>Monsters:\u003c/b> \u003ca href=\"#alpha-wolf\" data-to=\"alpha-wolf\">Alpha wolf\u003c/a> (1), \u003ca href=\"#wolf\" data-to=\"wolf\">Wolf\u003c/a> (4).\u003c/p>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"the-wolf-hunt","t":"The Wolf Hunt","c":"Quests","i":"📜","sum":"Side quest from Huntmaster Kael.","a":[],"ib":[["Part of","Side quest"],["Given by","Huntmaster Kael"],["Where","in his lodge in the Lower Town"],["Steps","4"],["Needs","Hunting 5"]],"h":"\u003cp>\u003cb>The Wolf Hunt\u003c/b> is a side quest from \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>, found in his lodge in the Lower Town.\u003c/p>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-huntmaster-kael-about-the-wolf-den\">Step 1: Talk to Huntmaster Kael about the wolf den\u003c/h3>\n\u003cp>\u003cb>Huntmaster Kael:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>You've got the hang of hunting. Now I need help with something bigger.\u003c/p>\u003cp>A pack has dug a den in the Dark Forest, south-west of the gate path, and its alpha is the biggest wolf I've ever seen. It's too much for one hunter.\u003c/p>\u003cp>Get some friends together: click another player to invite them to a party. Whoever leads learns Leadership, part of Charisma. Kills count for everyone in the party who's close by.\u003c/p>\u003cp>Clear 4 wolves from the den, then bring down the alpha. You can try it alone, but take every potion you have.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> the \u003ca href=\"#leadership\" data-to=\"leadership\">Leadership\u003c/a> skill.\u003c/p>\n\u003ch3 id=\"s-step-2-defeat-4-wolves-at-the-den-south-west-of-the-gate-path\">Step 2: Defeat 4 wolves at the den (south-west of the gate path)\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> The den is south-west of the path through the Dark Forest. Bring friends: party kills count for everyone close by.\u003c/li>\u003cli>\u003cb>Fight with:\u003c/b> any weapon.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-3-defeat-the-alpha-wolf\">Step 3: Defeat the alpha wolf\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> The alpha's in the middle of the den. It hits hard and takes a lot of beating, so go with a party if you can, and keep potions handy.\u003c/li>\u003cli>\u003cb>Fight with:\u003c/b> any weapon.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-4-go-back-to-huntmaster-kael\">Step 4: Go back to Huntmaster Kael\u003c/h3>\n\u003cp>\u003cb>Huntmaster Kael:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>The alpha's down? The farm and the road will be safer for it. Well hunted!\u003c/p>\u003cp>Everyone who hunted it with you gets the same from me: here's a leather jerkin and your pay. The pack will find a new alpha in time, so keep your bow strung.\u003c/p>\u003cp>That alpha was Blighted, did you see? Grey, and glowing. I've never seen one that big.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> \u003ca href=\"#platebody\" data-to=\"platebody\">Leather jerkin\u003c/a>, 15 silver.\u003c/p>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#leadership\" data-to=\"leadership\">Leadership\u003c/a>.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> \u003ca href=\"#platebody\" data-to=\"platebody\">Leather jerkin\u003c/a>, 15 silver.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#something-to-grow\" data-to=\"something-to-grow\">Something to grow\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#highway-robbery\" data-to=\"highway-robbery\">Highway robbery\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"the-woodcutters-start","t":"The woodcutter's start","c":"Quests","i":"📜","sum":"Lessons from Forester Holt.","a":[],"ib":[["Part of","Lessons"],["Given by","Forester Holt"],["Where","by the practice trees in the Emberhall Training Ground"],["Steps","7"]],"h":"\u003cp>\u003cb>The woodcutter's start\u003c/b> is a lesson from \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>, found by the practice trees in the Emberhall Training Ground.\u003c/p>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-forester-holt-in-the-training-ground\">Step 1: Talk to Forester Holt in the training ground\u003c/h3>\n\u003cp>\u003cb>Forester Holt:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Come in, come in! Holt's the name, and trees are the game. I'll teach you Woodcutting.\u003c/p>\u003cp>Woodcutting is part of Endurance, like Fishing and Mining. Every kind of log has its own Mastery, so the more of one you chop, the faster it goes.\u003c/p>\u003cp>Let's start the hard way: chop 3 logs by hand. The pointy pine trees are the practice grove, right behind me.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> the \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a> skill.\u003c/p>\n\u003ch3 id=\"s-step-2-chop-3-logs-by-hand-no-axe-on-your-belt\">Step 2: Chop 3 logs by hand (no axe on your belt)\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Click a tree to chop it. Pine trees are the pointy ones, in the practice grove behind me.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-3-go-back-to-forester-holt\">Step 3: Go back to Forester Holt\u003c/h3>\n\u003cp>\u003cb>Forester Holt:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Sore hands? Good. Now you know why folks use tools.\u003c/p>\u003cp>Here's my old bronze axe. Equip it and chop 5 logs. Chopping costs 10 stamina a log, so keep some food handy. Logs are heavy too (2 kg each): the ⚖️ bar under your bag shows how much more you can carry.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> \u003ca href=\"#axe\" data-to=\"axe\">Bronze axe (Pine)\u003c/a>.\u003c/p>\n\u003ch3 id=\"s-step-4-equip-the-bronze-axe\">Step 4: Equip the bronze axe\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Click the axe in your bag and press &quot;Equip&quot;.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-5-chop-5-logs-with-your-axe\">Step 5: Chop 5 logs with your axe\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Chop trees with the axe on your belt. Remember to eat if you get tired.\u003c/li>\u003cli>\u003cb>You need:\u003c/b> a axe.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-6-sell-some-logs-to-forester-holt\">Step 6: Sell some logs to Forester Holt\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> Click me, then click logs in your bag to sell them. I buy logs and axes.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-7-go-back-to-forester-holt-for-your-reward\">Step 7: Go back to Forester Holt for your reward\u003c/h3>\n\u003cp>\u003cb>Forester Holt:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Look at you, a proper woodcutter!\u003c/p>\u003cp>Here's a new bronze axe with a good oak handle: it chops faster and lasts longer than my old one. Better trees need a higher Woodcutting level: oaks at 5, and finer woods after that.\u003c/p>\u003cp>Funny thing. The trees nearest the shrine always die first. Nobody listens to an old forester, though.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> \u003ca href=\"#axe\" data-to=\"axe\">Bronze axe (Oak)\u003c/a>, 1 silver.\u003c/p>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a>.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> \u003ca href=\"#axe\" data-to=\"axe\">Bronze axe (Pine)\u003c/a>, \u003ca href=\"#axe\" data-to=\"axe\">Bronze axe (Oak)\u003c/a>, 1 silver.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#buying-and-selling\" data-to=\"buying-and-selling\">Buying and selling\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#into-the-rocks\" data-to=\"into-the-rocks\">Into the rocks\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"thread","t":"Thread","c":"Items","i":"🧵","sum":"Materials and food. Sells for 37 bronze.","a":["spool of thread"],"ib":[["Kind","Materials and food"],["Shop pays","37 bronze"],["Game id","\u003ccode>thread\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#spider-silk\" data-to=\"spider-silk\">Spider silk\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#cloth\" data-to=\"cloth\">Cloth\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"tin-ore","t":"Tin ore","c":"Items","i":"🪨","sum":"Ore. Sells for 5 bronze.","a":[],"ib":[["Kind","Ore"],["Shop pays","5 bronze"],["Game id","\u003ccode>tin_ore\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a> level 1 from a tin rock (5 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#hammer-and-fire\" data-to=\"hammer-and-fire\">Hammer and fire\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#bronze-bar\" data-to=\"bronze-bar\">Bronze bar\u003c/a>.\u003c/li>\u003cli>Smelted into \u003ca href=\"#bronze-bar\" data-to=\"bronze-bar\">Bronze bar\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"tithe-tonic","t":"Tithe tonic","c":"Items","i":"🧪","sum":"Clears one Tithe mark.","a":[],"ib":[["Alchemy level","2"],["Ingredients","Red cap mushrooms + Wild roots"],["XP","10"],["First tries work","70%"]],"h":"\u003cp>Clears one Tithe mark. Brew it with \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> level 2 from \u003ca href=\"#red-cap-mushrooms\" data-to=\"red-cap-mushrooms\">Red cap mushrooms\u003c/a> and \u003ca href=\"#wild-roots\" data-to=\"wild-roots\">Wild roots\u003c/a> in a vial. It isn't listed at the table until you've brewed one: someone has to tell you the recipe. It clears one Tithe mark (see \u003ca href=\"#the-tithe\" data-to=\"the-tithe\">The Tithe\u003c/a>). See \u003ca href=\"#potions\" data-to=\"potions\">Potions\u003c/a>.\u003c/p>","src":["shared/alchemy.ts"],"w":false,"r":false},{"s":"tithe-tonics","t":"Tithe Tonics","c":"Quests","i":"📜","sum":"Act 1 from Alchemist Moss.","a":[],"ib":[["Part of","Act 1"],["Given by","Alchemist Moss"],["Where","at the Mages' Guild, south-west of town"],["Steps","3"]],"h":"\u003cp>\u003cb>Tithe Tonics\u003c/b> is part of the Act 1 from \u003ca href=\"#alchemist-moss\" data-to=\"alchemist-moss\">Alchemist Moss\u003c/a>, found at the Mages' Guild, south-west of town.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#oath-of-the-flame\" data-to=\"oath-of-the-flame\">Oath of the Flame\u003c/a>, \u003ca href=\"#a-drop-of-something\" data-to=\"a-drop-of-something\">A drop of something\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-walkthrough\">Walkthrough\u003c/h2>\n\u003ch3 id=\"s-step-1-talk-to-alchemist-moss\">Step 1: Talk to Alchemist Moss\u003c/h3>\n\u003cp>\u003cb>Alchemist Moss:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Ah, an Ember! Just who I need. The Emberhall has ordered a mountain of Tithe tonics, and my hands are full.\u003c/p>\u003cp>The recipe's a secret, but you're one of theirs, so: one red cap mushroom and one wild root, in a vial, at the alchemy table. You'll dig both up from the glinting patches.\u003c/p>\u003cp>Brew me five. The Emberhall sells them to heroes, to clear their debt faster. Good business, eh? Here are some vials to start you off.\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"s-step-2-brew-5-tithe-tonics-red-cap-wild-root-a-vial\">Step 2: Brew 5 Tithe tonics (red cap + wild root + a vial)\u003c/h3>\n\u003cul>\u003cli>\u003cb>How:\u003c/b> At the alchemy table in the Mages' Guild: a red cap mushroom + a wild root, and an empty vial. Dig both from the glinting patches. With me watching, every brew works.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s-step-3-bring-the-tonics-to-alchemist-moss\">Step 3: Bring the tonics to Alchemist Moss\u003c/h3>\n\u003cul>\u003cli>\u003cb>Bring:\u003c/b> 5 × \u003ca href=\"#potions\" data-to=\"potions\">Tithe tonic\u003c/a>.\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Alchemist Moss:\u003c/b>\u003c/p>\n\u003cblockquote>\u003cp>Five! Lovely. The Emberhall pays well for these, and so do I.\u003c/p>\u003cp>Keep the recipe: it's yours now. Funny, isn't it? They sell the cure for a debt they put on you. Still. Business is business.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cb>You get:\u003c/b> 50 bronze, 60 Alchemy XP.\u003c/p>\n\u003cp>\u003cb>All rewards:\u003c/b> 50 bronze.\u003c/p>\n\u003cp>\u003cb>Click through:\u003c/b> ← \u003ca href=\"#blessing-the-fields\" data-to=\"blessing-the-fields\">Blessing the Fields\u003c/a> · \u003ca href=\"#quests\" data-to=\"quests\">all quests\u003c/a> · \u003ca href=\"#the-totem\" data-to=\"the-totem\">The Totem\u003c/a> →\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"tongs","t":"Tongs","c":"Items","i":"🛠️","sum":"A tool for Smelting.","a":[],"ib":[["Helps","Smelting"],["Effect","Fewer failures"]],"h":"\u003cp>The tongs helps \u003ca href=\"#smelting\" data-to=\"smelting\">Smelting\u003c/a>: your tries fail less often. Better metal and better wood make it stronger and last longer. See \u003ca href=\"#tools\" data-to=\"tools\">Tools\u003c/a> for every metal and wood. Smiths make them at the anvil with \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>.\u003c/p>","src":["shared/tools.ts"],"w":false,"r":false},{"s":"tools","t":"Tools","c":"Items","i":"🪓","sum":"Axes, pickaxes, shovels, rods, hammers, tongs and pots.","a":[],"ib":[],"h":"\u003cp>A tool is a metal head (or none, for a rod) on a wooden handle. Gathering tools make you faster; crafting tools make your tries work more often. Every use wears it down a little; Repairer Oswin or the \u003ca href=\"#mend\" data-to=\"mend\">Mend\u003c/a> spell fixes it.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tool\u003c/th>\u003cth>Helps\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#axe\" data-to=\"axe\">Axe\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a>\u003c/td>\u003ctd>Faster gathering\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Pickaxe\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a>\u003c/td>\u003ctd>Faster gathering\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#shovel\" data-to=\"shovel\">Shovel\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a>\u003c/td>\u003ctd>Faster gathering\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#fishing-rod\" data-to=\"fishing-rod\">Fishing rod\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a>\u003c/td>\u003ctd>Faster gathering\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#hammer\" data-to=\"hammer\">Hammer\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>\u003c/td>\u003ctd>Fewer failed tries\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#tongs\" data-to=\"tongs\">Tongs\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#smelting\" data-to=\"smelting\">Smelting\u003c/a>\u003c/td>\u003ctd>Fewer failed tries\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#pot\" data-to=\"pot\">Pot\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>\u003c/td>\u003ctd>Fewer failed tries\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Without the right gathering tool, gathering takes 3 times as long.\u003c/p>\n\u003ch2 id=\"s-metals\">Metals\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Metal\u003c/th>\u003cth>Level\u003c/th>\u003cth>Bonus\u003c/th>\u003cth>Uses\u003c/th>\u003cth>Smelted from\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#bronze-bar\" data-to=\"bronze-bar\">Bronze bar\u003c/a>\u003c/td>\u003ctd>1\u003c/td>\u003ctd>5%\u003c/td>\u003ctd>150\u003c/td>\u003ctd>\u003ca href=\"#copper-ore\" data-to=\"copper-ore\">Copper ore\u003c/a> + \u003ca href=\"#tin-ore\" data-to=\"tin-ore\">Tin ore\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#iron-bar\" data-to=\"iron-bar\">Iron bar\u003c/a>\u003c/td>\u003ctd>15\u003c/td>\u003ctd>10%\u003c/td>\u003ctd>300\u003c/td>\u003ctd>\u003ca href=\"#iron-ore\" data-to=\"iron-ore\">Iron ore\u003c/a> + \u003ca href=\"#iron-ore\" data-to=\"iron-ore\">Iron ore\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#steel-bar\" data-to=\"steel-bar\">Steel bar\u003c/a>\u003c/td>\u003ctd>30\u003c/td>\u003ctd>15%\u003c/td>\u003ctd>500\u003c/td>\u003ctd>\u003ca href=\"#iron-ore\" data-to=\"iron-ore\">Iron ore\u003c/a> + \u003ca href=\"#coal\" data-to=\"coal\">Coal\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#mithril-bar\" data-to=\"mithril-bar\">Mithril bar\u003c/a>\u003c/td>\u003ctd>60\u003c/td>\u003ctd>25%\u003c/td>\u003ctd>900\u003c/td>\u003ctd>\u003ca href=\"#mithril-ore\" data-to=\"mithril-ore\">Mithril ore\u003c/a> + \u003ca href=\"#coal\" data-to=\"coal\">Coal\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-woods-handles\">Woods (handles)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Wood\u003c/th>\u003cth>Bonus\u003c/th>\u003cth>Lasts\u003c/th>\u003cth>Handicraft level\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>\u003c/td>\u003ctd>5%\u003c/td>\u003ctd>×1\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#oak-logs\" data-to=\"oak-logs\">Oak logs\u003c/a>\u003c/td>\u003ctd>7%\u003c/td>\u003ctd>×1.15\u003c/td>\u003ctd>8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#birch-logs\" data-to=\"birch-logs\">Birch logs\u003c/a>\u003c/td>\u003ctd>9%\u003c/td>\u003ctd>×1.3\u003c/td>\u003ctd>16\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#maple-logs\" data-to=\"maple-logs\">Maple logs\u003c/a>\u003c/td>\u003ctd>12%\u003c/td>\u003ctd>×1.5\u003c/td>\u003ctd>25\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#yew-logs\" data-to=\"yew-logs\">Yew logs\u003c/a>\u003c/td>\u003ctd>15%\u003c/td>\u003ctd>×1.75\u003c/td>\u003ctd>35\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#ironwood-logs\" data-to=\"ironwood-logs\">Ironwood logs\u003c/a>\u003c/td>\u003ctd>20%\u003c/td>\u003ctd>×2.1\u003c/td>\u003ctd>50\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#elderwood-logs\" data-to=\"elderwood-logs\">Elderwood logs\u003c/a>\u003c/td>\u003ctd>25%\u003c/td>\u003ctd>×2.5\u003c/td>\u003ctd>65\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/tools.ts"],"w":false,"r":false},{"s":"townsfolk","t":"Townsfolk","c":"People","i":"🚶","sum":"Ordinary people of Emberhold going about their day.","a":[],"ib":[],"h":"\u003cp>Townsfolk are ordinary people of \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a> going about their day, so the town and \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a> feel lived in (since version 0.14). They aren't part of any quest and never block your way. Each walks a loop between a few spots and stops a moment at each. Everyone sees them in the same place, because where they are depends only on the world clock. Click one and they say one of their lines.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Who\u003c/th>\u003cth>Where\u003c/th>\u003cth>About them\u003c/th>\u003cth>What they might say\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🥖 Baker Hanna\u003c/td>\u003ctd>\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>\u003c/td>\u003ctd>Bakes the town's bread, and walks it round the square every morning.\u003c/td>\u003ctd>\u003ci>&quot;Fresh loaves! Well, fresh this morning.&quot;\u003c/i> · \u003ci>&quot;The Emberguard buy half my bread. All those Hopefuls eat like wolves.&quot;\u003c/i> · \u003ci>&quot;If you smell burning, it's not the bakery. Probably.&quot;\u003c/i>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪁 Pip\u003c/td>\u003ctd>\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>\u003c/td>\u003ctd>A little boy who runs round the well all day. He wants to be an Emberborn when he grows up.\u003c/td>\u003ctd>\u003ci>&quot;Are you an Emberborn? Did you really come out of the fire? Does it hurt?&quot;\u003c/i> · \u003ci>&quot;When I grow up I'm going to have a statue in the Emberhall!&quot;\u003c/i> · \u003ci>&quot;Mum says I'm not allowed past the well.&quot;\u003c/i>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧺 Mother Ada\u003c/td>\u003ctd>\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>\u003c/td>\u003ctd>Pip's mother. She keeps one eye on her washing and one on Pip.\u003c/td>\u003ctd>\u003ci>&quot;Have you seen Pip? Small, loud, covered in mud?&quot;\u003c/i> · \u003ci>&quot;Every child in town wants to be an Emberborn. I'd rather he was a baker.&quot;\u003c/i>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🛡️ Guard Dunstan\u003c/td>\u003ctd>\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>\u003c/td>\u003ctd>Walks the long street from the West Gate to the Saltmere Gate, keeping an eye out for trouble.\u003c/td>\u003ctd>\u003ci>&quot;Move along, nothing to see. Unless you've seen Ashbound. Have you?&quot;\u003c/i> · \u003ci>&quot;Quiet day. I like quiet days.&quot;\u003c/i> · \u003ci>&quot;Keep out of the Thornwood till Kael says you're ready.&quot;\u003c/i>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧳 Merchant Lyle\u003c/td>\u003ctd>\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>\u003c/td>\u003ctd>A travelling trader, stuck in town since the roads west closed.\u003c/td>\u003ctd>\u003ci>&quot;I used to sell silk from the west. Now I sell... hope, mostly.&quot;\u003c/i> · \u003ci>&quot;The Barrens road's been shut for a year. A whole year!&quot;\u003c/i>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🦯 Old Pell\u003c/td>\u003ctd>\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>\u003c/td>\u003ctd>The oldest man in Emberhold. He walks slowly up and down outside the inn.\u003c/td>\u003ctd>\u003ci>&quot;In my day the Emberhall's flame was so bright you could read by it from the square.&quot;\u003c/i> · \u003ci>&quot;Eh? Speak up.&quot;\u003c/i> · \u003ci>&quot;I've seen a lot of you Emberborn come and go. Mostly go.&quot;\u003c/i>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🌾 Farmhand Jory\u003c/td>\u003ctd>\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>\u003c/td>\u003ctd>Works for Farmer Odo, and walks between the training ground and the Lower Town allotments all day.\u003c/td>\u003ctd>\u003ci>&quot;Odo says the crops grow better far from the shrines. Don't tell the Emberguard I said that.&quot;\u003c/i> · \u003ci>&quot;Off to market. Again.&quot;\u003c/i>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🎣 Fisher Cole\u003c/td>\u003ctd>\u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>\u003c/td>\u003ctd>Fishes off the docks, like Old Maren used to. He walks the wharf all day.\u003c/td>\u003ctd>\u003ci>&quot;Old Maren taught me to fish. Taught everyone, really.&quot;\u003c/i> · \u003ci>&quot;Trout are biting by the shore today.&quot;\u003c/i>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🧹 Acolyte Bram\u003c/td>\u003ctd>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>\u003c/td>\u003ctd>A young Emberguard acolyte who sweeps the great hall of the Emberhall.\u003c/td>\u003ctd>\u003ci>&quot;Ash, ash, always ash. That flame never stops dropping it.&quot;\u003c/i> · \u003ci>&quot;Mind your feet, I've just swept there.&quot;\u003c/i> · \u003ci>&quot;One day I'll be a proper Brother, like Oren.&quot;\u003c/i>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🕯️ Acolyte Mira\u003c/td>\u003ctd>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>\u003c/td>\u003ctd>Tends the braziers in the great hall, so they never go out.\u003c/td>\u003ctd>\u003ci>&quot;Every brazier is lit from the Heart Shrine's flame. Never from a tinderbox. That's the rule.&quot;\u003c/i> · \u003ci>&quot;If a brazier goes out, Keeper Aldric gets very quiet. I don't like it when he's quiet.&quot;\u003c/i>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🙏 Pilgrim Ennis\u003c/td>\u003ctd>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>\u003c/td>\u003ctd>Came all the way from the Saltmere coast to see the Heart Shrine.\u003c/td>\u003ctd>\u003ci>&quot;I walked here from the coast just to see the flame. It's even brighter than they said.&quot;\u003c/i> · \u003ci>&quot;My grandmother says Ida of the Saltmere lit our village's shrine. Her statue's right there!&quot;\u003c/i>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📖 Scholar Quill\u003c/td>\u003ctd>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>\u003c/td>\u003ctd>Reads in the Emberhall's library from morning to night.\u003c/td>\u003ctd>\u003ci>&quot;Shh. Library.&quot;\u003c/i> · \u003ci>&quot;Have you read the one about the Emberfall? Someone's written in the back of it. Shocking.&quot;\u003c/i>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🩹 Healer Rosa\u003c/td>\u003ctd>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>\u003c/td>\u003ctd>Helps Sister Wynne in the infirmary, going from room to room.\u003c/td>\u003ctd>\u003ci>&quot;Each patient gets their own room now. So much quieter than the old dormitory!&quot;\u003c/i> · \u003ci>&quot;Don't run in the infirmary, please.&quot;\u003c/i>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🍺 Innkeeper Bess\u003c/td>\u003ctd>\u003ca href=\"#the-hearthstone-inn\" data-to=\"the-hearthstone-inn\">The Hearthstone Inn\u003c/a>\u003c/td>\u003ctd>Runs the Hearthstone Inn, and knows everyone's business.\u003c/td>\u003ctd>\u003ci>&quot;Welcome to the Hearthstone! Sit anywhere, mind the dog.&quot;\u003c/i> · \u003ci>&quot;Someone painted words on my wall last week. Red paint. The Emberguard scrubbed it off quick as you like.&quot;\u003c/i>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/townsfolk.ts"],"w":false,"r":false},{"s":"trading","t":"Trading","c":"Skills","i":"💰","sum":"Trained by selling things to any shop (the more it's worth, the more XP). Each level makes prices a little better, and trainers sell you rarer things as it goes up.","a":[],"ib":[["Discipline","🤝 Charisma"],["Taught by","\u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>"],["Max level","99"]],"h":"\u003cp>💰 \u003cb>Trading\u003c/b> is a skill in \u003ca href=\"#charisma\" data-to=\"charisma\">Charisma\u003c/a>. Trained by selling things to any shop (the more it's worth, the more XP). Each level makes prices a little better, and trainers sell you rarer things as it goes up.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#buying-and-selling\" data-to=\"buying-and-selling\">Buying and selling\u003c/a>, from \u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>📖 Quick learner\u003c/td>\u003ctd>10% more XP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"trial-marks","t":"Trial marks","c":"Mechanics","i":"🔥","sum":"","a":["Ranks"],"ib":[],"h":"\u003cp>The game today has these ranks: Hopeful, Ember, Flame. Ember and Flame wear coloured cloaks. In the lore, these become trial marks: Ember, Flame, Blaze and Radiant (see \u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a>).\u003c/p>","src":["shared/story.ts"],"w":false,"r":false},{"s":"trout","t":"Trout","c":"Items","i":"🐟","sum":"Fish. Sells for 5 bronze.","a":[],"ib":[["Kind","Fish"],["Shop pays","5 bronze"],["Game id","\u003ccode>trout\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a> level 5 from a trout spot (4 XP each).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (fish): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"truffles","t":"Truffles","c":"Items","i":"🟤","sum":"Herbs, roots and crop. Sells for 30 bronze.","a":["truffle"],"ib":[["Kind","Herbs, roots and crops"],["Shop pays","30 bronze"],["Game id","\u003ccode>truffle\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dug up with \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> level 15 (14 XP).\u003c/li>\u003cli>Sold by \u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a> once your \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a> is 35.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (vegetables): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"tuna","t":"Tuna","c":"Items","i":"🐡","sum":"Fish. Sells for 40 bronze.","a":[],"ib":[["Kind","Fish"],["Shop pays","40 bronze"],["Game id","\u003ccode>tuna\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a> level 45 from a tuna spot (24 XP each).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>A cooking ingredient (fish): see \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"two-handed-sword","t":"Two-handed sword","c":"Items","i":"⚔️","sum":"A melee weapon.","a":[],"ib":[["Style","Melee"],["Level","20"],["Biggest hit","8 + metal"],["Attacks every","3.6s"],["Range","1 tile"],["Hands","Two (no shield)"]],"h":"\u003cp>⚔️ The two-handed sword needs \u003ca href=\"#melee\" data-to=\"melee\">Melee\u003c/a> level 20. Its biggest hit is 8, plus its metal's bonus. It attacks every 3.6s and reaches 1 tile. It takes both hands, so no shield. See \u003ca href=\"#weapons\" data-to=\"weapons\">Weapons\u003c/a> and \u003ca href=\"#combat\" data-to=\"combat\">Combat\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"venom-sacs","t":"Venom sacs","c":"Items","i":"🧪","sum":"Monster drop. Sells for 35 bronze.","a":["venom sac"],"ib":[["Kind","Monster drops"],["Shop pays","35 bronze"],["Game id","\u003ccode>venom_sac\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#cave-spider\" data-to=\"cave-spider\">Cave spider\u003c/a> (30%).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Half of the recipe for the \u003ca href=\"#ember-trap-potion\" data-to=\"ember-trap-potion\">Ember trap potion\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"version-history","t":"Version history","c":"Updates","i":"🆕","sum":"Every game update. The game is at version 0.18.","a":[],"ib":[],"h":"\u003cp>The game is at \u003cb>version 0.18\u003c/b>. Every update adds 0.1; version 1.0 is saved for the finished game.\u003c/p>\n\u003ch2 id=\"s-0-18-2026-11-27-emberhold-the-walled-city\">0.18 · 2026-11-27 · Emberhold, the walled city\u003c/h2>\n\u003cul>\u003cli>Emberhold, the walled capital, is built (on the dev test server first). A great stone wall with towers runs round the whole city, with four gates: the North Gate, the West Gate, the Saltmere Gate and the River Gate. The gates are shut for now, so the whole game happens inside the walls.\u003c/li>\u003cli>The Emberhall now stands on Ember Hill in the middle of the city, with a spire and a flame you can see from everywhere. Below it is a plaza, then Market Square with stalls, the well, the bell tower, the General Store and the bounty board.\u003c/li>\u003cli>The city has districts: Forge Row to the west (Holt, Greta, the smithy and Rook's workshop), the Glass River and its docks to the east (with a fish market), and the Lower Town to the south (the Hearthstone Inn, the Mages' Guild, Kael's lodge, Wren's hut and the allotments). Hundreds of houses fill the streets, light enough for an iPad.\u003c/li>\u003cli>New: the Emberhall Training Ground, just east of the Emberhall behind a hedge. Every trainer teaches there: Old Maren by the pond, Holt by the practice trees, Greta by the practice rocks, Brann at the furnace and anvil, Rook, Wren, Moss, Archmage Rowan, Kael by the chicken coop and rat pit, and Farmer Odo by his plots.\u003c/li>\u003cli>A shorter prologue that takes you through every skill. Keeper Aldric sends you to the Training Ground, Old Maren's first lessons are shorter (no more selling a fish to Tam, and no Fishing 3 or Cooking 3 at the end), and the Oath of the Flame now opens once you've learned from every trainer. Holt asks for 5 logs instead of 10, and Kael's last lesson is the rat pit instead of a wolf outside.\u003c/li>\u003cli>The townsfolk (Baker Hanna, little Pip, Guard Dunstan and the others) now walk the streets of Emberhold. The old village in Heartvale is still out there, past the closed gates.\u003c/li>\u003cli>Saves from before move along: anyone in the middle of Maren's lessons keeps their place in the shorter list, and everyone starts in Emberhold's plaza.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-17-2026-11-27-automatic-crash-reports\">0.17 · 2026-11-27 · Automatic crash reports\u003c/h2>\n\u003cul>\u003cli>Automatic crash reports. When the game breaks, it now tells the server by itself, with no button to press: a JavaScript error, the 3D drawing being lost (often the device running out of memory), losing the server and not getting back in, or the page stopping without closing (on an iPad that's usually Safari reloading the page because it ran out of memory; it's noticed the next time the game opens).\u003c/li>\u003cli>Each report has the error and where in the code it happened, the game version, the device, how much memory the game was using, how much it was drawing, where the player was, and the last things that happened before it broke.\u003c/li>\u003cli>The server writes down its own errors too, and keeps running instead of stopping. Every time it starts it notes it, and flags a restart that wasn't a new deploy (that usually means it crashed or ran out of memory).\u003c/li>\u003cli>Only the admin can see them, at /admin/crashes on the game's address (the same password as the bug report page and the login log). Each report says which server it came from (live or dev), since they can share a database.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-16-2026-11-26-a-login-log-for-the-admin\">0.16 · 2026-11-26 · A login log for the admin\u003c/h2>\n\u003cul>\u003cli>The server now keeps a login log: who logged in and when, new accounts, wrong passwords, what kind of device they used, and when they logged out (so you can see how long they played).\u003c/li>\u003cli>Only the admin can see it, at /admin/logins on the game's address (the same password as the bug report page). It shows who's playing right now, every login newest first, and a By player view with each player's last login, number of logins and total time played.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-15-2026-11-26-music-for-the-whole-world\">0.15 · 2026-11-26 · Music for the whole world\u003c/h2>\n\u003cul>\u003cli>Music everywhere: Mike's song &quot;Realm of Exploration&quot; now plays softly anywhere that doesn't have its own music (out in Heartvale, in the houses, shops and caves). The Emberhall keeps its chant.\u003c/li>\u003cli>The song repeats forever without a break: its last bar blends into its first, so you can't hear where it starts again.\u003c/li>\u003cli>Walking into the Emberhall fades the world music out and the chant in, and walking out fades them back. ⚙️ Settings &gt; 🎵 Music turns all music on or off and sets the volume.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-14-2026-11-26-the-emberhall-comes-alive\">0.14 · 2026-11-26 · The Emberhall comes alive\u003c/h2>\n\u003cul>\u003cli>A new opening: your character is formed lying on the floor by the Heart Shrine. Sister Celene hurries over, helps you up and starts talking (a Skip button skips the scene).\u003c/li>\u003cli>Before the story goes on, you put on your robe. Celene gives it to you, and talking to Keeper Aldric or Celene walks you through it (open your 🎒 bag, click the robe, press Equip). You can't leave the Emberhall until it's on.\u003c/li>\u003cli>Talking to Keeper Aldric at the start is now one conversation: he carries straight on into the next part instead of making you click him again and again.\u003c/li>\u003cli>At the very start the hint now says to talk to Keeper Aldric, instead of &quot;pick your next lesson&quot;. When nothing is going on it names the next person to see.\u003c/li>\u003cli>Real doors instead of gaps in the walls. Click anywhere on a door, not just the bottom of it, to use it. Doors swing open as people walk up to them.\u003c/li>\u003cli>The Emberhall has a makeover: burning braziers, the statues of the Extinguished line the walls of the great hall (the separate statue room is gone), a library through a door on one side, and an infirmary on the other with a bedroom for each patient. Warmer, ember-coloured light inside.\u003c/li>\u003cli>The Heart Shrine is now a tall, flickering flame in a stone bowl, with embers rising from it. Lit shrines elsewhere show a small flame too.\u003c/li>\u003cli>Townsfolk: 14 ordinary people now walk about town, the Emberhall and the Hearthstone Inn (Baker Hanna, little Pip, Guard Dunstan, Scholar Quill and more). They aren't part of any quest and don't get in your way. Click one and they'll say something.\u003c/li>\u003cli>Music: Kevin MacLeod's &quot;Gregorian Chant&quot; plays softly inside the Emberhall. ⚙️ Settings has a 🎵 Music switch and volume, and a new 🎶 Credits section.\u003c/li>\u003cli>Ember words instead of light words: Keeper Aldric says the Emberheart made you, and every bit of dialogue was checked for leftover &quot;light&quot; wording. The heroes of the past are now called the Extinguished everywhere (no more Radiants or Hall of Champions). Story chapter names changed to match: The Hall of Embers, A Flame in the Thornwood and Act 1: The First Trial.\u003c/li>\u003cli>The 📜 Quests menu only shows quests you can do now or have done. Locked ones are hidden, with a short note saying how many more open up as you go.\u003c/li>\u003cli>Everything people say to you now goes into the message log too, so you can read it again. The log (tap the message box) has filter buttons: 💬 Dialogue, 🚩 Chat, ⭐ Events and ⚠️ Warnings.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-13-2026-11-25-a-faster-smoother-game\">0.13 · 2026-11-25 · A faster, smoother game\u003c/h2>\n\u003cul>\u003cli>The game draws about half as much in town, so it runs smoother, especially on laptops and phones. Nothing looks different: roofs now skip the hidden sides of each roof tile, hair skips the part tucked inside the head, and the Emberhall's stone statues are shaped a little more simply (they look the same).\u003c/li>\u003cli>On slower computers with very sharp screens, the game now draws a little softer when it starts to slow down, and goes back to full sharpness when there's time to spare. Computers that keep up see no change.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-12-2026-11-25-training-the-new-quest-menu-and-fixes\">0.12 · 2026-11-25 · Training, the new quest menu and fixes\u003c/h2>\n\u003cul>\u003cli>Training: new players stay in town until Old Maren's lessons are done. Try to walk out past the lake, the river or the edges of town and you're turned back with a note saying what to do next.\u003c/li>\u003cli>The 📜 Quests menu is new. At the top: what you're on now, then everything you can start right now (who to see, and where). Then 🎓 Training, a master quest with every skill's lesson, the skills each one teaches, and a bar for how many you've done. Then the story, side quests and bounties. Tap a heading to fold it away; finished story chapters fold into one line.\u003c/li>\u003cli>Skill lessons now come in a sensible order: Miner Greta before Smith Brann, Forester Holt before Woodworker Rook, Herbalist Wren before Alchemist Moss, Huntmaster Kael before Archmage Rowan, and Shopkeeper Tam before Captain Bryn. Talk to a trainer too early and they tell you who to see first. A lesson you've already started carries on as normal.\u003c/li>\u003cli>Brother Oren's tour now comes first in The Hall of Light: Keeper Aldric sends you straight to him, then you meet Lisette, Tomas and Wynne. \u003ci>(report #26)\u003c/i>\u003c/li>\u003cli>Cooking has levels that matter: harder meals and better firewood (oak, birch, maple...) need a higher Cooking level, and meals well above your level burn more often. The stove tells you the level you need. \u003ci>(report #25)\u003c/i>\u003c/li>\u003cli>Carrying too much now slows you down instead of stopping you: over your limit you walk at half speed, then a quarter, then an eighth (the 🐢 by your weight shows it). Past four times your limit you can't pick up any more, and you can't run while overloaded. \u003ci>(report #31)\u003c/i>\u003c/li>\u003cli>Little paths now lead from house doors out to the nearest road. \u003ci>(report #28)\u003c/i>\u003c/li>\u003cli>Other players show up as blue dots with their names on the minimap and the big map, and the big map names the key people (quest givers and the repairer) by their doors. \u003ci>(report #29)\u003c/i>\u003c/li>\u003cli>The guide arrow and map marks now point at the next thing for every quest step: the nearest fishing spot, tree or rock you have the level for, the right stove, furnace or anvil, the shop, the board, or the nearest monster to fight. \u003ci>(report #30)\u003c/i>\u003c/li>\u003cli>Every early quest was checked for ways to get stuck. Old Maren now hands you firewood and minnows if you've run out for her cooking lesson, Smith Brann won't let you sell or lose the platelegs he wants to see, and items you've equipped now count when a quest asks for them. \u003ci>(report #32)\u003c/i>\u003c/li>\u003cli>Buttons and quest lines say Equip and Unequip everywhere now (no more Wear, Hold or Put on belt). \u003ci>(report #22)\u003c/i>\u003c/li>\u003cli>Walking through a door shows a short loading sign so the new room doesn't pop in. \u003ci>(report #27)\u003c/i>\u003c/li>\u003cli>Chopped trees fall and sink into the ground instead of shrinking, and the stump shows its rings. Catching a fish has a proper two-handed heave, and the rod bends toward the bobber. \u003ci>(reports #23, #24)\u003c/i>\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-11-2026-11-25-smooth-movement\">0.11 · 2026-11-25 · Smooth movement\u003c/h2>\n\u003cul>\u003cli>Walking is smooth now, not tile by tile. You can stand anywhere and walk in any direction, and you glide instead of hopping from square to square.\u003c/li>\u003cli>Clicking the ground walks you straight to the exact spot you clicked. The path cuts the corners, so you head straight there instead of zig-zagging.\u003c/li>\u003cli>W A S D walks the way the camera faces at any angle, not just 8 directions. Turn the camera while you walk and you turn with it.\u003c/li>\u003cli>Walking into a wall at an angle slides you along it, and walking at the edge of a doorway or a gap between trees eases you into it instead of getting stuck.\u003c/li>\u003cli>Other players glide smoothly too, and footsteps keep an even beat whichever way you walk.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-10-2026-11-25-the-emberguard-embervale-and-the-emberheart\">0.10 · 2026-11-25 · The Emberguard, Embervale and the Emberheart\u003c/h2>\n\u003cul>\u003cli>New names, to match the Emberfall story: the Lighthall is now the Emberhall, the Lightkeepers are the Emberguard, the Kindled are the Emberborn, and the land is Embervale. Its heart, deep under Heartvale, is the Emberheart.\u003c/li>\u003cli>Soul gems are now refined emberstones, the Soul trap spell (and its potion) is now Ember trap, and Soul Debt is now Ember Debt. Gems you already have keep working and keep their ember; only the names changed.\u003c/li>\u003cli>The town is called Emberhold. Archmage Ysolde is now Archmage Rowan, Ysra of the Saltmere is now Ida, and the Archmage of old is Vale.\u003c/li>\u003cli>New players start as Hopefuls, and earn the Ember and Flame ranks from there.\u003c/li>\u003cli>A new book in the Emberhall library tells the Emberfall as every child learns it, and Brother Oren's tour now starts with it. Someone has left a note in the back of the book.\u003c/li>\u003cli>Books about the Emberheart now agree that it burns under Heartvale.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-9-2026-11-25-sound-effects\">0.9 · 2026-11-25 · Sound effects\u003c/h2>\n\u003cul>\u003cli>Sound effects! Chopping, mining, smithing, smelting, cooking and fighting each have their own sounds: a swoosh as you swing, a thunk when the tool lands, and a little reward sound when something goes into your bag.\u003c/li>\u003cli>Cooking makes stirring and chopping sounds, picked at random from three so it never sounds like a loop.\u003c/li>\u003cli>Footsteps change with the ground: grass, dirt paths, wooden floors and bridges, stone, and carpet.\u003c/li>\u003cli>Level ups play a 16-bit treasure fanfare (once, even when a skill and its mastery go up together), and finishing a quest plays a victory tune.\u003c/li>\u003cli>Hitting a monster, a monster getting hurt, a monster going down, and a monster hitting you all have sounds.\u003c/li>\u003cli>Settings has a new 🔔 Sound effects switch and a volume slider. The game remembers both.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-8-2026-11-25-soul-stone-is-now-called-emberstone\">0.8 · 2026-11-25 · Soul stone is now called emberstone\u003c/h2>\n\u003cul>\u003cli>Soul stone has a new name: emberstone. The rocks in the crystal cave, the raw stones in your bag, and everything people and books say about it all use the new name. Stones you already have keep working; only the name changed. Soul gems keep their name.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-7-2026-11-25-an-emberfall-login-screen\">0.7 · 2026-11-25 · An Emberfall login screen\u003c/h2>\n\u003cul>\u003cli>The login screen matches the title screen: the same night sky with rising embers and falling stars, and an ember-glow login box.\u003c/li>\u003cli>The health bars, bag, buttons and the rest of the game stay hidden until you've logged in.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-6-2026-11-25-emberfall-the-games-name-and-title-screen\">0.6 · 2026-11-25 · Emberfall: the game's name and title screen\u003c/h2>\n\u003cul>\u003cli>The game has a name: Emberfall. It's on the title screen, the login box and the browser tab.\u003c/li>\u003cli>A title screen: the glowing Emberfall logo over a night sky, with embers rising from a burning glow and stars falling across it. Tap it (or press any key) to start.\u003c/li>\u003cli>That first tap also starts Mike's song straight away, so the music is already playing when the login box appears.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-5-2026-11-25-title-music-mikes-own-song\">0.5 · 2026-11-25 · Title music: Mike's own song\u003c/h2>\n\u003cul>\u003cli>The login screen now plays Mike's own song, on a loop. It starts on your first click, tap or key press (browsers don't allow sound before that), and fades out when you log in.\u003c/li>\u003cli>Tap 🔊 at the top right of the login box to turn the music off (🔇) or back on. The game remembers your choice.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-4-2026-11-24-play-by-listening-read-aloud-and-quest-pictures\">0.4 · 2026-11-24 · Play by listening: read-aloud and quest pictures\u003c/h2>\n\u003cul>\u003cli>Read aloud: tap 🔊 next to anything people say, books, your quest, the 📜 Quests list and the chat to hear it spoken. Tap it again to stop.\u003c/li>\u003cli>Turn on 🔊 Read everything out loud for me in ⚙️ Settings, and the game reads what people say, books, gifts, warnings and each new quest step as soon as they appear.\u003c/li>\u003cli>A gold arrow on the ground by your feet points the way to your quest's next ❗ person or 📍 place (or the door that leads there). It goes away when you're close.\u003c/li>\u003cli>The quest box shows pictures of what you need, with how many you have (like 🐟 1 / 3, then ✓ once you have them all), so you can follow a quest without reading.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-0-3-2026-11-23-the-lighthall-tour-running-and-a-minimap\">0.3 · 2026-11-23 · The Lighthall tour, running, and a minimap\u003c/h2>\n\u003cul>\u003cli>The Lighthall carpet is one even, symmetrical rug. \u003ci>(report #3)\u003c/i>\u003c/li>\u003cli>The Lighthall library has proper rows of bookshelves, with books on both sides. \u003ci>(report #4)\u003c/i>\u003c/li>\u003cli>Click a bookshelf to take down a book and read it: the history of Elderra, the shrines, the towns and the people. None of it is needed for a quest; it's there if you're curious. \u003ci>(report #5)\u003c/i>\u003c/li>\u003cli>Brother Oren now gives you a tour of the Hall of Champions: each Radiant's statue, and the empty plinth. It tells the story of the Sundering War and who the Lightkeepers are. \u003ci>(report #6)\u003c/i>\u003c/li>\u003cli>A minimap in the top left, turned the way you're facing. It shows ❗ and 📍 quest targets, and an arrow on its edge points the way to ones further off. Tap it for the big map. \u003ci>(report #7)\u003c/i>\u003c/li>\u003cli>Sister Wynne's dormitory has beds instead of crates, and she explains what happens when you fall and what it costs. \u003ci>(report #8)\u003c/i>\u003c/li>\u003cli>When someone gives you something, the chat says exactly what it was and that it's in your 🎒 bag. \u003ci>(report #9)\u003c/i>\u003c/li>\u003cli>The camera no longer goes inside buildings and walls: it moves in closer instead. \u003ci>(report #10)\u003c/i>\u003c/li>\u003cli>Clicking anywhere on a door works, not just the tile in front of it. \u003ci>(report #11)\u003c/i>\u003c/li>\u003cli>Walls no longer poke through doors. \u003ci>(report #12)\u003c/i>\
