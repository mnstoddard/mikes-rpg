 href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>"],["Max level","99"]],"h":"\u003cp>🧵 \u003cb>Handicraft\u003c/b> is a skill in \u003ca href=\"#dexterity\" data-to=\"dexterity\">Dexterity\u003c/a>. Use Woodworker Rook's workshop: fishing bait, bows, arrows and staffs at the workbench, leather at the tanning rack (outside), thread and cloth at the spinning wheel, and leather and cloth armor.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#handy-work\" data-to=\"handy-work\">Handy work\u003c/a>, from \u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🎯 Steady hands\u003c/td>\u003ctd>6% fewer failures\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪱 Bait bundle\u003c/td>\u003ctd>10% chance to make an extra one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📖 Quick learner\u003c/td>\u003ctd>10% more XP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"handy-work","t":"Handy work","c":"Quests","i":"📜","sum":"Lessons from Woodworker Rook.","a":[],"ib":[["Part of","Lessons"],["Given by","Woodworker Rook"],["Where","in the workshop just west of the square"],["Steps","3"]],"h":"\u003cp>\u003cb>Handy work\u003c/b> is a lesson from \u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a>, found in the workshop just west of the square.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#the-woodcutters-start\" data-to=\"the-woodcutters-start\">The woodcutter's start\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Woodworker Rook at the workshop \u003ci>(you get: \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>, \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>)\u003c/i>\u003c/li>\u003cli>Make worm bait at the workbench\u003c/li>\u003cli>Go back to Woodworker Rook for your reward \u003ci>(you get: 4 × \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>)\u003c/i>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>, \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>, \u003ca href=\"#worms\" data-to=\"worms\">Worms\u003c/a>, 50 bronze.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> Hello there! I'm Rook. I make the little things that make life easier. Handicraft is part of Dexterity. For now that's fishing bait: worms, food scraps and feathers turn into bait that makes fish bite sooner. Worms turn up while you chop and mine, and cooking leaves scraps. Here are 2 worms. Make some worm bait at my workbench.\u003c/p>\n\u003cp>\u003cb>Step 3.\u003c/b> Lovely! Bait goes in your bag, and it's used up as you fish. Better bait comes with a higher Handicraft level. Here are a few more worms and some coins. Come and sell me your feathers and hides any time. I'm carving a shrine totem for the Emberguard next. Oak, always oak for them.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"haste","t":"Haste","c":"Spells","i":"💨","sum":"You walk faster for a while.","a":[],"ib":[["Spellcasting level","12"],["Mana","15"],["Kind","On yourself"],["Learned from","A spell book"]],"h":"\u003cp>💨 You walk faster for a while.\u003c/p>\n\u003cp>It needs \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a> level 12 and costs 15 mana at Mastery 1 (Mastery lowers the cost). It lasts 60 seconds at Mastery 1.\u003c/p>\n\u003cp>Learn it by reading \u003ca href=\"#spell-book-haste\" data-to=\"spell-book-haste\">Spell book: Haste\u003c/a>, which \u003ca href=\"#goblin\" data-to=\"goblin\">Goblin\u003c/a> sometimes drop.\u003c/p>","src":["shared/combat.ts","shared/spells.ts"],"w":false,"r":false},{"s":"heal","t":"Heal","c":"Spells","i":"💚","sum":"Heals you.","a":[],"ib":[["Spellcasting level","8"],["Mana","12"],["Kind","On yourself"],["Learned from","Levelling up"]],"h":"\u003cp>💚 Heals you.\u003c/p>\n\u003cp>It needs \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a> level 8 and costs 12 mana at Mastery 1 (Mastery lowers the cost).\u003c/p>","src":["shared/combat.ts","shared/spells.ts"],"w":false,"r":false},{"s":"health-potion","t":"Health potion","c":"Items","i":"🧪","sum":"Restores health.","a":[],"ib":[["Alchemy level","1"],["Ingredients","Red cap mushrooms + Slime goo"],["XP","6"],["First tries work","65%"],["Kind","Monster drops"],["Shop pays","10 bronze"],["Game id","\u003ccode>health_potion\u003c/code>"]],"h":"\u003cp>Restores health. Brew it with \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> level 1 from \u003ca href=\"#red-cap-mushrooms\" data-to=\"red-cap-mushrooms\">Red cap mushrooms\u003c/a> and \u003ca href=\"#slime-goo\" data-to=\"slime-goo\">Slime goo\u003c/a> in a vial. See \u003ca href=\"#potions\" data-to=\"potions\">Potions\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Dropped by the \u003ca href=\"#goblin\" data-to=\"goblin\">Goblin\u003c/a> (10%).\u003c/li>\u003cli>Dropped by the \u003ca href=\"#giant-spider\" data-to=\"giant-spider\">Giant spider\u003c/a> (10%).\u003c/li>\u003cli>Dropped by the \u003ca href=\"#alpha-wolf\" data-to=\"alpha-wolf\">Alpha wolf\u003c/a> (30%).\u003c/li>\u003cli>Dropped by the \u003ca href=\"#ashbound-scout\" data-to=\"ashbound-scout\">Ashbound scout\u003c/a> (8%).\u003c/li>\u003cli>Dropped by the \u003ca href=\"#ashbound-raider\" data-to=\"ashbound-raider\">Ashbound raider\u003c/a> (25%).\u003c/li>\u003cli>Sold by \u003ca href=\"#shopkeeper-tam\" data-to=\"shopkeeper-tam\">Shopkeeper Tam\u003c/a>.\u003c/li>\u003cli>Sold by \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>.\u003c/li>\u003cli>Sold by \u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">Captain Bryn\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#standing-your-ground\" data-to=\"standing-your-ground\">Standing your ground\u003c/a>.\u003c/li>\u003cli>Given in the quest \u003ca href=\"#rebuild-the-shrine\" data-to=\"rebuild-the-shrine\">Rebuild the Shrine\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/alchemy.ts","shared/items.ts"],"w":false,"r":false},{"s":"heartvale","t":"Heartvale","c":"Places","i":"🌾","sum":"The green valley at the heart of the land: farms, rivers, and the capital Emberhold.","a":[],"ib":[["Levels","1 to 20"],["Kind","Outdoors"],["Danger","Safe"],["Size","240 × 160 tiles"]],"h":"\u003cp>\u003cb>Heartvale\u003c/b> is a green valley of farms and rivers, and the first region players see. \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a> sits on its edge; \u003ca href=\"#the-thornwood\" data-to=\"the-thornwood\">The Thornwood\u003c/a> lies to the south behind a fenced gate, \u003ca href=\"#greyspine-peaks\" data-to=\"greyspine-peaks\">Greyspine Peaks\u003c/a> to the north.\u003c/p>\n\u003cp>It's round because the ground fell in at \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">the Emberfall\u003c/a>. \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a> burns far below it.\u003c/p>\n\u003cp>In the game today, Heartvale is the whole outdoor map: the town, the lake, Trainer Row, the pasture, the farm, the quarry and the edge of the Thornwood.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"heartvale\">\u003c/figure>\n\u003cp>\u003cb>People here:\u003c/b> \u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">Captain Bryn\u003c/a>, \u003ca href=\"#farmer-odo\" data-to=\"farmer-odo\">Farmer Odo\u003c/a>, \u003ca href=\"#rhys\" data-to=\"rhys\">Rhys\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Things to use:\u003c/b> Bounty board, Tanning rack, Enchanted chest, Farm chest, Lantern, Shrine lantern, Westroad shrine, Thornwood shrine.\u003c/p>\n\u003cp>\u003cb>Monsters:\u003c/b> \u003ca href=\"#chicken\" data-to=\"chicken\">Chicken\u003c/a> (6), \u003ca href=\"#cow\" data-to=\"cow\">Cow\u003c/a> (5), \u003ca href=\"#boar\" data-to=\"boar\">Boar\u003c/a> (3), \u003ca href=\"#slime\" data-to=\"slime\">Slime\u003c/a> (5), \u003ca href=\"#giant-bat\" data-to=\"giant-bat\">Giant bat\u003c/a> (9), \u003ca href=\"#rat\" data-to=\"rat\">Rat\u003c/a> (6), \u003ca href=\"#ashbound-scout\" data-to=\"ashbound-scout\">Ashbound scout\u003c/a> (4), \u003ca href=\"#wolf\" data-to=\"wolf\">Wolf\u003c/a> (7), \u003ca href=\"#goblin\" data-to=\"goblin\">Goblin\u003c/a> (5), \u003ca href=\"#giant-spider\" data-to=\"giant-spider\">Giant spider\u003c/a> (4), \u003ca href=\"#ashbound-raider\" data-to=\"ashbound-raider\">Ashbound raider\u003c/a> (3), \u003ca href=\"#hollow-wolf\" data-to=\"hollow-wolf\">Hollow wolf\u003c/a> (5).\u003c/p>\n\u003cp>\u003cb>On the map:\u003c/b> The Greyspine Peaks, Quarry, The lake, The Emberhall, Trainer Row, Pasture, The farm, Saltmere Coast, To the Barrens (closed), The Thornwood (Dark Forest), Goblin camp, Spider hollow, Wolf Hollow, Ashbound camp, Graveyard.\u003c/p>","src":["wiki/pages/heartvale.md","shared/world.ts","shared/npcs.ts"],"w":true,"r":false},{"s":"helmet","t":"Helmet","c":"Items","i":"⛑️","sum":"Armor for the head slot.","a":[],"ib":[["Slot","head"],["Bars to make","1"],["Armor (bronze)","1"]],"h":"\u003cp>⛑️ A helmet goes in your head slot. A bronze one gives 1 armor and takes 1 bar to make with \u003ca href=\"#smithing\" data-to=\"smithing\">Smithing\u003c/a>; better metal multiplies it. Leather and cloth versions are made with \u003ca href=\"#handicraft\" data-to=\"handicraft\">Handicraft\u003c/a>. See \u003ca href=\"#armor\" data-to=\"armor\">Armor\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"herbalist-wren","t":"Herbalist Wren","c":"People","i":"🌿","sum":"Teaches Foraging. Her maps show the Withering spreading.","a":[],"ib":[["Found in","Herbalist Wren's hut"],["Shop","Yes"],["Game id","\u003ccode>wren\u003c/code>"]],"h":"\u003cp>\u003cb>Herbalist Wren\u003c/b> teaches \u003ca href=\"#foraging\" data-to=\"foraging\">Foraging\u003c/a> from her hut by the lake. Her maps show \u003ca href=\"#the-withering\" data-to=\"the-withering\">The Withering\u003c/a> spreading out from \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">The shrines\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;I buy roots, herbs, mushrooms and shovels, and I sell bronze shovels.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#herbalist-wrens-hut\" data-to=\"herbalist-wrens-hut\">Herbalist Wren's hut\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#what-the-ground-gives\" data-to=\"what-the-ground-gives\">What the ground gives\u003c/a> (lessons)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Shop:\u003c/b> buys roots, herbs, mushrooms, worms and shovels. Sells: \u003ca href=\"#shovel\" data-to=\"shovel\">Bronze shovel (Pine)\u003c/a>, \u003ca href=\"#wild-roots\" data-to=\"wild-roots\">Wild roots\u003c/a>. With more \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a>: \u003ca href=\"#sage\" data-to=\"sage\">Sage\u003c/a> (Trading 6), \u003ca href=\"#shovel\" data-to=\"shovel\">Iron shovel (Oak)\u003c/a> (Trading 12), \u003ca href=\"#ginseng-roots\" data-to=\"ginseng-roots\">Ginseng roots\u003c/a> (Trading 20), \u003ca href=\"#truffles\" data-to=\"truffles\">Truffles\u003c/a> (Trading 35). See \u003ca href=\"#shops\" data-to=\"shops\">Shops\u003c/a>.\u003c/p>","src":["wiki/pages/person-wren.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"herbalist-wrens-hut","t":"Herbalist Wren's hut","c":"Places","i":"🏠","sum":"","a":[],"ib":[["Kind","Indoors"],["Danger","Safe"],["Size","8 × 7 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"wren\">\u003c/figure>\n\u003cp>\u003cb>People here:\u003c/b> \u003ca href=\"#herbalist-wren\" data-to=\"herbalist-wren\">Herbalist Wren\u003c/a>.\u003c/p>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"highway-robbery","t":"Highway robbery","c":"Quests","i":"📜","sum":"Side quest from Captain Bryn.","a":[],"ib":[["Part of","Side quest"],["Given by","Captain Bryn"],["Where","by the bounty board in the square"],["Steps","4"],["Needs","Renown 10"]],"h":"\u003cp>\u003cb>Highway robbery\u003c/b> is a side quest from \u003ca href=\"#captain-bryn\" data-to=\"captain-bryn\">Captain Bryn\u003c/a>, found by the bounty board in the square.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Captain Bryn about the Ashbound raiders\u003c/li>\u003cli>Defeat 4 Ashbound raiders (deep in the Dark Forest, far south)\u003c/li>\u003cli>Get 2 stolen rings from Ashbound raiders\u003c/li>\u003cli>Go back to Captain Bryn \u003ci>(you get: \u003ca href=\"#helmet\" data-to=\"helmet\">Steel helmet\u003c/a>)\u003c/i>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#helmet\" data-to=\"helmet\">Steel helmet\u003c/a>, 30 silver.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> You've made a name for yourself, so I've a job I wouldn't give just anyone. Ashbound raiders deep in the Dark Forest, far south, have been robbing the carts on their way to town. The Emberhall wants them gone. They hit hard, so go well armed and take potions. Defeat 4 of them, and bring me 2 of the rings they've stolen.\u003c/p>\n\u003cp>\u003cb>Step 4.\u003c/b> Two rings! The merchants will sleep easier tonight. Keep the rings: they've been paid out by the guild already. Here's a steel helmet from the watch's own stores, and your pay. One of those Ashbound raiders shouted something as he ran: &quot;Every time you rise, the land falls!&quot; Madness.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"history","t":"History","c":"History","i":"⏳","sum":"Five hundred years, oldest first: what really happened, and what people believe today.","a":["Timeline"],"ib":[],"h":"\u003cp>The game takes place in \u003cb>year 500 After the Fall\u003c/b>. Oldest first. For the official story of the Fall next to the true one, see \u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">The Emberfall (disaster)\u003c/a>.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Year\u003c/th>\u003cth>What really happened\u003c/th>\u003cth>What people believe today\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Before 0\u003c/td>\u003ctd>The \u003ca href=\"#old-kingdom\" data-to=\"old-kingdom\">Old Kingdom\u003c/a>. Green and rich, ruled from \u003ca href=\"#brightcrown\" data-to=\"brightcrown\">Brightcrown\u003c/a> in the west. \u003ca href=\"#the-hearthwise\" data-to=\"the-hearthwise\">The Hearthwise\u003c/a> teach &quot;take only what the land gives back&quot;.\u003c/td>\u003ctd>&quot;A golden age.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>\u003ca href=\"#the-emberfall-disaster\" data-to=\"the-emberfall-disaster\">The Emberfall\u003c/a>. \u003ca href=\"#the-ember-circle\" data-to=\"the-ember-circle\">The Ember Circle\u003c/a> breaks open the earth under \u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a> to drink \u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a>. Fire bursts up and embers rain down for a year.\u003c/td>\u003ctd>&quot;The land's fire burst in anger. No one was to blame.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1 to 40\u003c/td>\u003ctd>The \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a>. Lords fight over the glowing shards. \u003ca href=\"#king-aldemar\" data-to=\"king-aldemar\">King Aldemar\u003c/a>'s \u003ca href=\"#ember-crown\" data-to=\"ember-crown\">Ember Crown\u003c/a> destroys Brightcrown and makes the western crater. The kingdom falls and the west burns into the Barrens.\u003c/td>\u003ctd>&quot;Nobody remembers how the war began.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>40\u003c/td>\u003ctd>The first \u003ca href=\"#the-shrines\" data-to=\"the-shrines\">shrines\u003c/a>. The Circle builds the shrines and the first \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> wake, \u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a> among them. They win the war.\u003c/td>\u003ctd>&quot;Archmage Vale built the shrines and saved us.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>60\u003c/td>\u003ctd>🔒 Vale fakes his death. The Circle becomes \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>, and its leaders \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>.\u003c/td>\u003ctd>&quot;Vale died soon after the war. No one knows where he's buried.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>60 to 200\u003c/td>\u003ctd>The shrines should have closed. Instead the Emberguard build more, and \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a> grows up around their temple, \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>.\u003c/td>\u003ctd>&quot;The Emberguard protect us.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>about 200\u003c/td>\u003ctd>\u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">The Mages' Guild\u003c/a>'s records about the Emberheart stop. The Emberguard took them.\u003c/td>\u003ctd>Scholars find it odd.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>200 to 500\u003c/td>\u003ctd>The Emberguard raise hundreds of Emberborn, skim from every death, and drain a champion every few decades in a \u003ca href=\"#radiance-ceremony\" data-to=\"radiance-ceremony\">Radiance Ceremony\u003c/a>. The Emberheart weakens.\u003c/td>\u003ctd>&quot;The Extinguished gave their ember back so new heroes could wake.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>about 430\u003c/td>\u003ctd>🔒 Maren learns the truth and cuts her own thread. Without the siphon feeding her, she starts to age, and slowly to turn to ash.\u003c/td>\u003ctd>&quot;Harmless old Maren, she's been here forever.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>460\u003c/td>\u003ctd>\u003ca href=\"#sable\" data-to=\"sable\">Sable\u003c/a>, the brightest champion, is drained at her Ceremony and survives. She founds \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>. \u003ca href=\"#orla-the-kind\" data-to=\"orla-the-kind\">Orla the Kind\u003c/a> dies of the Grey Fever after rising nine times.\u003c/td>\u003ctd>&quot;Sable went mad. Orla was a saint.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>500\u003c/td>\u003ctd>Now. The Dark Forest spreads toward Emberhold. \u003ca href=\"#frostfell\" data-to=\"frostfell\">Frostfell\u003c/a>'s ice creeps south. You wake at \u003ca href=\"#the-heart-shrine\" data-to=\"the-heart-shrine\">The Heart Shrine\u003c/a>.\u003c/td>\u003ctd>&quot;The Blight is just bad luck, and the Ashbound make it worse.&quot;\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>🔒 rows are secrets. Players piece them together through quests, books and Memory Echoes.\u003c/p>","src":["wiki/pages/history.md"],"w":true,"r":false},{"s":"hollow-wolf","t":"Hollow wolf","c":"Monsters","i":"🐺","sum":"A level 13 monster. Attacks on sight.","a":[],"ib":[["Level","13"],["Health","32"],["Biggest hit","4"],["Attacks every","2.4s"],["Temper","Attacks on sight"],["Out","Day and night"],["Comes back after","48s"],["Coins","3 to 9 bronze"]],"h":"\u003cp>The \u003cb>Hollow wolf\u003c/b> is a level 13 monster with 32 health. Attacks on sight, and it runs in a pack: when one goes for you, the others nearby join in.\u003c/p>\n\u003cp>Defeating one gives 14 bonus XP on top of 1 XP per point of damage, plus 27 \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> XP shared by everyone who hurt it.\u003c/p>\n\u003ch2 id=\"s-where-it-lives\">Where it lives\u003c/h2>\n\u003cp>The Thornwood, near Wolf Hollow (5).\u003c/p>\n\u003ch2 id=\"s-drops\">Drops\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Chance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🐺 \u003ca href=\"#wolf-pelts\" data-to=\"wolf-pelts\">Wolf pelts\u003c/a>\u003c/td>\u003ctd>50%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🦷 \u003ca href=\"#wolf-fangs\" data-to=\"wolf-fangs\">Wolf fangs\u003c/a>\u003c/td>\u003ctd>60%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>It also drops 3 to 9 bronze coins.\u003c/p>\n\u003cp>Higher \u003ca href=\"#hunting\" data-to=\"hunting\">Hunting\u003c/a> and your Mastery of this monster make drops more likely.\u003c/p>","src":["shared/combat.ts","shared/world.ts"],"w":false,"r":false},{"s":"holts-notes","t":"Holt's notes","c":"Items","i":"📒","sum":"Forester Holt's count of dead trees, near shrines and far from them.","a":["page of Holt's notes"],"ib":[["Kind","Story items"],["Shop pays","Can't be sold"],["Game id","\u003ccode>holts_notes\u003c/code>"]],"h":"\u003cp>Forester Holt's count of dead trees, near shrines and far from them.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Given in the quest \u003ca href=\"#what-holt-saw\" data-to=\"what-holt-saw\">What Holt Saw\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"hopefuls","t":"Hopefuls","c":"Factions","i":"🌟","sum":"What new Emberborn are: not members of the Emberguard yet, trying to prove themselves worthy.","a":["Hopeful"],"ib":[],"h":"\u003cp>Every player starts as a \u003cb>Hopeful\u003c/b>: a new \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> who isn't a member of \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a> yet. The Emberguard welcome Hopefuls kindly, but each is one of hundreds. To be allowed to try for the Emberguard, a Hopeful swears the Oath of the Flame, then earns trial marks across the land: Ember, Flame, Blaze and Radiant (see \u003ca href=\"#trial-marks\" data-to=\"trial-marks\">Trial marks\u003c/a>).\u003c/p>\n\u003cp>When a Hopeful has proven themselves, the Emberguard invite them to join. That's the day they learn the truth, and choose (see \u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a>).\u003c/p>","src":["wiki/pages/hopefuls.md"],"w":true,"r":false},{"s":"how-to-update-the-wiki","t":"How to update the wiki","c":"Wiki","i":"🛠️","sum":"Every game update should update the wiki too. Most of it updates itself.","a":["Updating the wiki"],"ib":[],"h":"\u003cp>The wiki lives in the game's repository, in the \u003ccode>wiki\u003c/code> folder. It's one web page, \u003ccode>wiki/emberfall-wiki.html\u003c/code>, built from two things.\u003c/p>\n\u003ch2 id=\"s-1-facts-from-the-game-automatic\">1. Facts from the game (automatic)\u003c/h2>\n\u003cp>Maps, monsters, items, skills, spells, quests, shops, books, the version history and the numbers on the mechanics pages are read straight from the game's code (the \u003ccode>shared\u003c/code> folder). After any change to the game, rebuild the wiki and those pages match the game again. Nobody has to remember to copy numbers across.\u003c/p>\n\u003cp>To rebuild, run this in the game's folder:\u003c/p>\n\u003cp>\u003ccode>npm run wiki\u003c/code>\u003c/p>\n\u003cp>It prints how many pages it made, and lists any links that point to a page that doesn't exist yet.\u003c/p>\n\u003ch2 id=\"s-2-the-story-written-by-hand\">2. The story (written by hand)\u003c/h2>\n\u003cp>Lore, history, places, factions and people are plain text files in \u003ccode>wiki/pages\u003c/code>, one per page. Open one and change the words. The top of each file says the page's title, category and fact box, then a line with three dashes, then the page.\u003c/p>\n\u003cul>\u003cli>\u003ccode>\u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a>\u003c/code> links to another page. \u003ccode>\u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">the land's heart\u003c/a>\u003c/code> shows different words.\u003c/li>\u003cli>\u003ccode>## Heading\u003c/code> starts a section.\u003c/li>\u003cli>A line starting with \u003ccode>- \u003c/code> is a bullet.\u003c/li>\u003cli>Put a twist between \u003ccode>::: secret\u003c/code> and \u003ccode>:::\u003c/code> to make a red secret box.\u003c/li>\u003c/ul>\n\u003cp>If a written page has the same title as a page made from the game (like \u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>), they're joined: the story first, then an &quot;In the game&quot; section with the facts.\u003c/p>\n\u003ch2 id=\"s-3-publishing-it\">3. Publishing it\u003c/h2>\n\u003cp>After rebuilding, Claude publishes \u003ccode>wiki/emberfall-wiki.html\u003c/code> to the same Emberfall Wiki link (https://claude.ai/artifact/VCLVMsiJ1uVzdFApngjWJP), so the link never changes. The full guide is \u003ccode>wiki/README.md\u003c/code> in the repository.\u003c/p>\n\u003ch2 id=\"s-the-rule\">The rule\u003c/h2>\n\u003cp>Every game update that changes something in the world (a new item, monster, quest, person, place, or a change to the story) updates the wiki in the same pull request, the same way it adds a line to the \u003ca href=\"#version-history\" data-to=\"version-history\">Version history\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-names\">Names\u003c/h2>\n\u003cp>Since version 0.10 the game uses the lore bible's names too. When a name changes, change it in the game's text and in the wiki together, and add the old name to the \u003ca href=\"#names\" data-to=\"names\">Names\u003c/a> list. Ids inside the code keep their old spelling so saved games keep working.\u003c/p>","src":["wiki/pages/how-to-update.md"],"w":true,"r":false},{"s":"hunters-brew","t":"Hunter's brew","c":"Items","i":"⚗️","sum":"A little stronger and a little faster, for a while.","a":[],"ib":[["Alchemy level","18"],["Ingredients","Wolf fangs + Boar tusks"],["XP","24"],["First tries work","45%"]],"h":"\u003cp>A little stronger and a little faster, for a while. Brew it with \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> level 18 from \u003ca href=\"#wolf-fangs\" data-to=\"wolf-fangs\">Wolf fangs\u003c/a> and \u003ca href=\"#boar-tusks\" data-to=\"boar-tusks\">Boar tusks\u003c/a> in a vial. It isn't listed at the table until you've brewed one: someone has to tell you the recipe. See \u003ca href=\"#potions\" data-to=\"potions\">Potions\u003c/a>.\u003c/p>","src":["shared/alchemy.ts"],"w":false,"r":false},{"s":"hunting","t":"Hunting","c":"Skills","i":"🐾","sum":"Trained by defeating monsters. Everyone who hurt it shares the XP by how much damage they did. Higher Hunting makes monsters drop things more often.","a":[],"ib":[["Discipline","🌿 Endurance"],["Taught by","\u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>"],["Max level","99"]],"h":"\u003cp>🐾 \u003cb>Hunting\u003c/b> is a skill in \u003ca href=\"#endurance\" data-to=\"endurance\">Endurance\u003c/a>. Trained by defeating monsters. Everyone who hurt it shares the XP by how much damage they did. Higher Hunting makes monsters drop things more often.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#standing-your-ground\" data-to=\"standing-your-ground\">Standing your ground\u003c/a>, from \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>📖 Quick learner\u003c/td>\u003ctd>10% more XP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"huntmaster-kael","t":"Huntmaster Kael","c":"People","i":"🏹","sum":"Teaches combat. Leads the Wardens.","a":[],"ib":[["Found in","Huntmaster Kael's lodge"],["Shop","Yes"],["Game id","\u003ccode>kael\u003c/code>"]],"h":"\u003cp>\u003cb>Huntmaster Kael\u003c/b> teaches fighting from his lodge by the gate, and leads \u003ca href=\"#the-wardens\" data-to=\"the-wardens\">The Wardens\u003c/a>, the rangers who guard the borders against \u003ca href=\"#the-blight\" data-to=\"the-blight\">The Blight\u003c/a>. He says the Blight is always worst downhill of a shrine. He distrusts the Emberguard, but can't say why.\u003c/p>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;I buy weapons, armor and what monsters drop, and I sell starter weapons and potions.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#huntmaster-kaels-lodge\" data-to=\"huntmaster-kaels-lodge\">Huntmaster Kael's lodge\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#standing-your-ground\" data-to=\"standing-your-ground\">Standing your ground\u003c/a> (lessons)\u003c/li>\u003cli>\u003ca href=\"#the-wolf-hunt\" data-to=\"the-wolf-hunt\">The Wolf Hunt\u003c/a> (side quest)\u003c/li>\u003cli>\u003ca href=\"#the-hollow-wolves\" data-to=\"the-hollow-wolves\">The Hollow Wolves\u003c/a> (Act 1)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Shop:\u003c/b> buys weapons, armor and monster drops. Sells: \u003ca href=\"#dagger\" data-to=\"dagger\">Bronze dagger (Pine)\u003c/a>, \u003ca href=\"#sling\" data-to=\"sling\">Bronze sling (Pine)\u003c/a>, \u003ca href=\"#staff\" data-to=\"staff\">Pine staff\u003c/a>, \u003ca href=\"#bow\" data-to=\"bow\">Pine bow\u003c/a>, \u003ca href=\"#arrows\" data-to=\"arrows\">Bronze arrows\u003c/a>, \u003ca href=\"#health-potion\" data-to=\"health-potion\">Health potion\u003c/a>. With more \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a>: \u003ca href=\"#sword\" data-to=\"sword\">Bronze sword (Oak)\u003c/a> (Trading 5), \u003ca href=\"#arrows\" data-to=\"arrows\">Bronze arrows\u003c/a> (Trading 10), \u003ca href=\"#platelegs\" data-to=\"platelegs\">Iron platelegs\u003c/a> (Trading 18). See \u003ca href=\"#shops\" data-to=\"shops\">Shops\u003c/a>.\u003c/p>","src":["wiki/pages/person-kael.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"huntmaster-kaels-lodge","t":"Huntmaster Kael's lodge","c":"Places","i":"🏠","sum":"","a":[],"ib":[["Kind","Indoors"],["Danger","Safe"],["Size","9 × 8 tiles"]],"h":"\u003cfigure class=\"map\" data-area=\"kael\">\u003c/figure>\n\u003cp>\u003cb>People here:\u003c/b> \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>.\u003c/p>","src":["shared/world.ts","shared/npcs.ts"],"w":false,"r":false},{"s":"into-the-rocks","t":"Into the rocks","c":"Quests","i":"📜","sum":"Lessons from Miner Greta.","a":[],"ib":[["Part of","Lessons"],["Given by","Miner Greta"],["Where","on Trainer Row, east of the square"],["Steps","6"]],"h":"\u003cp>\u003cb>Into the rocks\u003c/b> is a lesson from \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>, found on Trainer Row, east of the square.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Miner Greta on Trainer Row \u003ci>(you get: \u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Bronze pickaxe (Pine)\u003c/a>)\u003c/i>\u003c/li>\u003cli>Equip the pickaxe\u003c/li>\u003cli>Mine 2 copper ore (orange-flecked rocks in the quarry)\u003c/li>\u003cli>Show Miner Greta your copper ore\u003c/li>\u003cli>Get 2 tin ore to go with your copper (mine it, or buy it from Greta)\u003c/li>\u003cli>Go back to Miner Greta for your reward \u003ci>(you get: \u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Bronze pickaxe (Oak)\u003c/a>)\u003c/i>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Bronze pickaxe (Pine)\u003c/a>, \u003ca href=\"#pickaxe\" data-to=\"pickaxe\">Bronze pickaxe (Oak)\u003c/a>, 1 silver.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> You want to learn Mining? Good. It's hard work, but rocks don't run away. Mining is part of Endurance. The quarry is up the north road, past the Emberhall: take the road on the Emberhall's west side. Here's a worn bronze pickaxe. Equip it, then mine 2 copper ore from the orange-flecked rocks. Eat when you get tired.\u003c/p>\n\u003cp>\u003cb>Step 4.\u003c/b> Good copper! Tools are made of metal, and the first metal is bronze: 1 copper ore and 1 tin ore make a bronze bar. Now get 2 tin ore to go with it. Tin rocks are the pale, silvery ones right next to the copper. Or if you're in a hurry, buy them from my Buy tab.\u003c/p>\n\u003cp>\u003cb>Step 6.\u003c/b> That's the makings of two bronze bars. Take them to Smith Brann if you haven't learned Smelting yet. And here's a new bronze pickaxe of my own making, with an oak handle. Faster mining, and it lasts. The emberstone veins in the quarry are dimmer every year. Used to light up the whole pit at night.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"invisibility","t":"Invisibility","c":"Spells","i":"🫥","sum":"Monsters can't see you. It breaks when you attack or gather.","a":[],"ib":[["Spellcasting level","15"],["Mana","20"],["Kind","On yourself"],["Learned from","A spell book"]],"h":"\u003cp>🫥 Monsters can't see you. It breaks when you attack or gather.\u003c/p>\n\u003cp>It needs \u003ca href=\"#spellcasting\" data-to=\"spellcasting\">Spellcasting\u003c/a> level 15 and costs 20 mana at Mastery 1 (Mastery lowers the cost). It lasts 15 seconds at Mastery 1.\u003c/p>\n\u003cp>Learn it by reading \u003ca href=\"#spell-book-invisibility\" data-to=\"spell-book-invisibility\">Spell book: Invisibility\u003c/a>, which \u003ca href=\"#ashbound-raider\" data-to=\"ashbound-raider\">Ashbound raider\u003c/a> sometimes drop.\u003c/p>","src":["shared/combat.ts","shared/spells.ts"],"w":false,"r":false},{"s":"iridium-bar","t":"Iridium bar","c":"Items","i":"🧈","sum":"Bar. Sells for 572 bronze.","a":[],"ib":[["Kind","Bars"],["Shop pays","572 bronze"],["Game id","\u003ccode>iridium_bar\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#iridium-ore\" data-to=\"iridium-ore\">Iridium ore\u003c/a>, \u003ca href=\"#iridium-ore\" data-to=\"iridium-ore\">Iridium ore\u003c/a>, \u003ca href=\"#coal\" data-to=\"coal\">Coal\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cp>Nowhere in the game yet.\u003c/p>","src":["shared/items.ts"],"w":false,"r":false},{"s":"iridium-ore","t":"Iridium ore","c":"Items","i":"🪨","sum":"Ore. Sells for 220 bronze.","a":[],"ib":[["Kind","Ore"],["Shop pays","220 bronze"],["Game id","\u003ccode>iridium_ore\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a> level 85 from a iridium rock (70 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#iridium-bar\" data-to=\"iridium-bar\">Iridium bar\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"iron-bar","t":"Iron bar","c":"Items","i":"🧈","sum":"Bar. Sells for 30 bronze.","a":[],"ib":[["Kind","Bars"],["Shop pays","30 bronze"],["Game id","\u003ccode>iron_bar\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#iron-ore\" data-to=\"iron-ore\">Iron ore\u003c/a>, \u003ca href=\"#iron-ore\" data-to=\"iron-ore\">Iron ore\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#smith-brann\" data-to=\"smith-brann\">Smith Brann\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"iron-ore","t":"Iron ore","c":"Items","i":"🪨","sum":"Ore. Sells for 12 bronze.","a":[],"ib":[["Kind","Ore"],["Shop pays","12 bronze"],["Game id","\u003ccode>iron_ore\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#mining\" data-to=\"mining\">Mining\u003c/a> level 20 from a iron rock (10 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#miner-greta\" data-to=\"miner-greta\">Miner Greta\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Goes into \u003ca href=\"#iron-bar\" data-to=\"iron-bar\">Iron bar\u003c/a>.\u003c/li>\u003cli>Goes into \u003ca href=\"#steel-bar\" data-to=\"steel-bar\">Steel bar\u003c/a>.\u003c/li>\u003cli>Smelted into \u003ca href=\"#iron-bar\" data-to=\"iron-bar\">Iron bar\u003c/a>.\u003c/li>\u003cli>Smelted into \u003ca href=\"#steel-bar\" data-to=\"steel-bar\">Steel bar\u003c/a>.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"ironwood-logs","t":"Ironwood logs","c":"Items","i":"🪵","sum":"Log. Sells for 50 bronze.","a":["ironwood log"],"ib":[["Kind","Logs"],["Shop pays","50 bronze"],["Game id","\u003ccode>ironwood_logs\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a> level 50 from a ironwood tree (28 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Used for tool handles, bows, staffs and arrows, and burned as cooking fuel.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"items","t":"Items","c":"Items","i":"🎒","sum":"Every item, grouped.","a":[],"ib":[],"h":"\u003cp>Every item with its own page, grouped by kind, with what a shop pays for one (before Mastery and Charisma). Tools, weapons, armor, meals, potions and gems come in many versions, so each has a page of its own instead: \u003ca href=\"#tools\" data-to=\"tools\">Tools\u003c/a>, \u003ca href=\"#weapons\" data-to=\"weapons\">Weapons\u003c/a>, \u003ca href=\"#armor\" data-to=\"armor\">Armor\u003c/a>, \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>, \u003ca href=\"#potions\" data-to=\"potions\">Potions\u003c/a>, \u003ca href=\"#gems-and-jewelry\" data-to=\"gems-and-jewelry\">Gems and jewelry\u003c/a>, \u003ca href=\"#enchanting\" data-to=\"enchanting\">Enchanting\u003c/a>, \u003ca href=\"#arrows\" data-to=\"arrows\">Arrows\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-logs\">Logs\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Shop pays\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🪵 \u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>\u003c/td>\u003ctd>1 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪵 \u003ca href=\"#oak-logs\" data-to=\"oak-logs\">Oak logs\u003c/a>\u003c/td>\u003ctd>3 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪵 \u003ca href=\"#birch-logs\" data-to=\"birch-logs\">Birch logs\u003c/a>\u003c/td>\u003ctd>5 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪵 \u003ca href=\"#maple-logs\" data-to=\"maple-logs\">Maple logs\u003c/a>\u003c/td>\u003ctd>10 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪵 \u003ca href=\"#yew-logs\" data-to=\"yew-logs\">Yew logs\u003c/a>\u003c/td>\u003ctd>25 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪵 \u003ca href=\"#ironwood-logs\" data-to=\"ironwood-logs\">Ironwood logs\u003c/a>\u003c/td>\u003ctd>50 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪵 \u003ca href=\"#elderwood-logs\" data-to=\"elderwood-logs\">Elderwood logs\u003c/a>\u003c/td>\u003ctd>100 bronze\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-ore\">Ore\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Shop pays\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>🪨 \u003ca href=\"#copper-ore\" data-to=\"copper-ore\">Copper ore\u003c/a>\u003c/td>\u003ctd>4 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪨 \u003ca href=\"#tin-ore\" data-to=\"tin-ore\">Tin ore\u003c/a>\u003c/td>\u003ctd>5 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪨 \u003ca href=\"#iron-ore\" data-to=\"iron-ore\">Iron ore\u003c/a>\u003c/td>\u003ctd>12 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪨 \u003ca href=\"#coal\" data-to=\"coal\">Coal\u003c/a>\u003c/td>\u003ctd>18 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪨 \u003ca href=\"#silver-ore\" data-to=\"silver-ore\">Silver ore\u003c/a>\u003c/td>\u003ctd>30 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪨 \u003ca href=\"#gold-ore\" data-to=\"gold-ore\">Gold ore\u003c/a>\u003c/td>\u003ctd>60 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪨 \u003ca href=\"#platinum-ore\" data-to=\"platinum-ore\">Platinum ore\u003c/a>\u003c/td>\u003ctd>160 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪨 \u003ca href=\"#iridium-ore\" data-to=\"iridium-ore\">Iridium ore\u003c/a>\u003c/td>\u003ctd>220 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪨 \u003ca href=\"#mithril-ore\" data-to=\"mithril-ore\">Mithril ore\u003c/a>\u003c/td>\u003ctd>120 bronze\u003c/td>\u003c/t >\u003c/table>\u003c/div>\n\u003ch2 id=\"s-spell-books\">Spell books\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Shop pays\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>📗 \u003ca href=\"#spell-book-haste\" data-to=\"spell-book-haste\">Spell book: Haste\u003c/a>\u003c/td>\u003ctd>150 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📘 \u003ca href=\"#spell-book-invisibility\" data-to=\"spell-book-invisibility\">Spell book: Invisibility\u003c/a>\u003c/td>\u003ctd>500 bronze\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📘 \u003ca href=\"#spell-book-frost-nova\" data-to=\"spell-book-frost-nova\">Spell book: Frost nova\u003c/a>\u003c/td>\u003ctd>350 bronze\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"s-story-items\">Story items\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Shop pays\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>📜 \u003ca href=\"#blessing-scrolls\" data-to=\"blessing-scrolls\">Blessing scrolls\u003c/a>\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🏮 \u003ca href=\"#your-lantern\" data-to=\"your-lantern\">Your lantern\u003c/a>\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🗿 \u003ca href=\"#shrine-totems\" data-to=\"shrine-totems\">Shrine totems\u003c/a>\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>✉️ \u003ca href=\"#folded-note\" data-to=\"folded-note\">Folded note\u003c/a>\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📝 \u003ca href=\"#scrawled-note\" data-to=\"scrawled-note\">Scrawled note\u003c/a>\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>🪬 \u003ca href=\"#marens-worn-charm\" data-to=\"marens-worn-charm\">Maren's worn charm\u003c/a>\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>📒 \u003ca href=\"#holts-notes\" data-to=\"holts-notes\">Holt's notes\u003c/a>\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/items.ts"],"w":false,"r":false},{"s":"keeper-aldric","t":"Keeper Aldric","c":"People","i":"🕯️","sum":"Welcomes every new Emberborn, and decides who's ready for the trials.","a":[],"ib":[["Found in","The Emberhall"],["Game id","\u003ccode>aldric\u003c/code>"]],"h":"\u003cp>\u003cb>Keeper Aldric\u003c/b> is warm and cheerful. He welcomes every new \u003ca href=\"#emberborn\" data-to=\"emberborn\">Emberborn\u003c/a> at \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>, gives the Prologue and Act 1 quests, and decides who is ready for \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>'s trials. He wrote \u003ci>On the Shrines\u003c/i> (see \u003ca href=\"#books-in-the-game\" data-to=\"books-in-the-game\">Books in the game\u003c/a>).\u003c/p>\n\u003cdiv class=\"box secret\">\u003cdiv class=\"box-label\">🔒 Secret\u003c/div>\u003cp>He's one of \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>.\u003c/p>\u003c/div>\n\u003ch2 id=\"s-in-the-game\">In the game\u003c/h2>\n\u003cp>What they say when you click them: \u003ci>&quot;Welcome, friend! The light made you for a reason. Everything here is yours to learn.&quot;\u003c/i>\u003c/p>\n\u003cp>Found in \u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Quests they give:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"#the-hall-of-light\" data-to=\"the-hall-of-light\">The Hall of Light\u003c/a> (Prologue)\u003c/li>\u003cli>\u003ca href=\"#light-the-way\" data-to=\"light-the-way\">Light the Way\u003c/a> (Prologue)\u003c/li>\u003cli>\u003ca href=\"#the-old-sweeper\" data-to=\"the-old-sweeper\">The Old Sweeper\u003c/a> (Prologue)\u003c/li>\u003cli>\u003ca href=\"#oath-of-the-flame\" data-to=\"oath-of-the-flame\">Oath of the Flame\u003c/a> (Prologue)\u003c/li>\u003cli>\u003ca href=\"#lantern-rounds\" data-to=\"lantern-rounds\">Lantern Rounds\u003c/a> (Act 1)\u003c/li>\u003cli>\u003ca href=\"#the-first-tithe\" data-to=\"the-first-tithe\">The First Tithe\u003c/a> (Act 1)\u003c/li>\u003cli>\u003ca href=\"#rebuild-the-shrine\" data-to=\"rebuild-the-shrine\">Rebuild the Shrine\u003c/a> (Act 1)\u003c/li>\u003cli>\u003ca href=\"#a-light-in-the-thornwood\" data-to=\"a-light-in-the-thornwood\">A Light in the Thornwood\u003c/a> (Act 1)\u003c/li>\u003c/ul>","src":["wiki/pages/person-aldric.md","shared/npcs.ts","shared/quests.ts","shared/story.ts"],"w":true,"r":false},{"s":"king-aldemar","t":"King Aldemar","c":"History","i":"🤴","sum":"The last king of the Old Kingdom, who forged the Ember Crown.","a":[],"ib":[],"h":"\u003cp>\u003cb>King Aldemar\u003c/b> was the last king of the \u003ca href=\"#old-kingdom\" data-to=\"old-kingdom\">Old Kingdom\u003c/a>. In the \u003ca href=\"#sundering-war\" data-to=\"sundering-war\">Sundering War\u003c/a> he forged the \u003ca href=\"#ember-crown\" data-to=\"ember-crown\">Ember Crown\u003c/a> from the biggest Emberfall shard and used it as a weapon. Its blast destroyed his own capital, \u003ca href=\"#brightcrown\" data-to=\"brightcrown\">Brightcrown\u003c/a>.\u003c/p>\n\u003cp>His statue lies buried in \u003ca href=\"#the-ashen-barrens\" data-to=\"the-ashen-barrens\">The Ashen Barrens\u003c/a>. In it he holds a crown with a glowing stone in it (a planned side quest, \u003ci>Aldemar's Statue\u003c/i>).\u003c/p>","src":["wiki/pages/aldemar.md"],"w":true,"r":false},{"s":"lantern-rounds","t":"Lantern Rounds","c":"Quests","i":"📜","sum":"Act 1 from Keeper Aldric.","a":[],"ib":[["Part of","Act 1"],["Given by","Keeper Aldric"],["Where","in the Emberhall, the great white temple in the town square"],["Steps","3"]],"h":"\u003cp>\u003cb>Lantern Rounds\u003c/b> is part of the Act 1 from \u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>, found in the Emberhall, the great white temple in the town square.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#oath-of-the-flame\" data-to=\"oath-of-the-flame\">Oath of the Flame\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Keeper Aldric\u003c/li>\u003cli>Light the 6 shrine lanterns round Heartvale\u003c/li>\u003cli>Go back to Keeper Aldric \u003ci>(you get: \u003ca href=\"#blessing-scrolls\" data-to=\"blessing-scrolls\">Blessing scrolls\u003c/a>)\u003c/i>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#blessing-scrolls\" data-to=\"blessing-scrolls\">Blessing scrolls\u003c/a>, 80 bronze.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> Your first job as an Ember: the lantern rounds. There are six shrine lanterns round Heartvale, and they need lighting. By the quarry road up north, by the lake, by the Hearthstone Inn on Trainer Row, at the farm over the river, on the coast, and by Kael's gate. The 🗺️ map marks them.\u003c/p>\n\u003cp>\u003cb>Step 3.\u003c/b> All six! Well done. And... the inn wall. Yes. I've heard. The Ashbound, I expect. They hate the light. They hate anything that helps people. I've sent Brother Tomas to scrub it off. Don't let it trouble you, friend. Here: your pay, and a blessing scroll for your trouble.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"leadership","t":"Leadership","c":"Skills","i":"🚩","sum":"Trained by leading a party (click another player to invite them): the leader earns it when the party finishes quest steps and defeats monsters together. Party members near the leader get a little extra XP from kills. Huntmaster Kael teaches it in his Wolf Hunt.","a":[],"ib":[["Discipline","🤝 Charisma"],["Taught by","\u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>"],["Max level","99"]],"h":"\u003cp>🚩 \u003cb>Leadership\u003c/b> is a skill in \u003ca href=\"#charisma\" data-to=\"charisma\">Charisma\u003c/a>. Trained by leading a party (click another player to invite them): the leader earns it when the party finishes quest steps and defeats monsters together. Party members near the leader get a little extra XP from kills. Huntmaster Kael teaches it in his Wolf Hunt.\u003c/p>\n\u003cp>You learn it in \u003ca href=\"#the-wolf-hunt\" data-to=\"the-wolf-hunt\">The Wolf Hunt\u003c/a>, from \u003ca href=\"#huntmaster-kael\" data-to=\"huntmaster-kael\">Huntmaster Kael\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-skill-tree\">Skill tree\u003c/h2>\n\u003cp>Spend Mastery points here (see \u003ca href=\"#mastery\" data-to=\"mastery\">Mastery\u003c/a>). Each upgrade has 3 ranks.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Upgrade\u003c/th>\u003cth>Each rank\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>📖 Quick learner\u003c/td>\u003ctd>10% more XP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts","shared/skilltree.ts","shared/quests.ts"],"w":false,"r":false},{"s":"leather","t":"Leather","c":"Items","i":"🟫","sum":"Materials and food. Sells for 5 bronze.","a":["piece of leather"],"ib":[["Kind","Materials and food"],["Shop pays","5 bronze"],["Game id","\u003ccode>leather\u003c/code>"]],"h":"\u003cp>Made from: \u003ca href=\"#cowhides\" data-to=\"cowhides\">Cowhides\u003c/a>. A made thing is worth what goes into it plus 25%.\u003c/p>\n\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Sold by \u003ca href=\"#woodworker-rook\" data-to=\"woodworker-rook\">Woodworker Rook\u003c/a> once your \u003ca href=\"#trading\" data-to=\"trading\">Trading\u003c/a> is 8.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"levels-and-xp","t":"Levels and XP","c":"Mechanics","i":"📈","sum":"Skills go from 1 to 99.","a":[],"ib":[],"h":"\u003cp>Every skill has its own XP and level, up to 99. It gets steeper as you go.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Total XP needed\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>34\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>121\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>521\u003c/td>\u003c/tr>\u003ctr>\u003ctd>15\u003c/td>\u003ctd>1,156\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20\u003c/td>\u003ctd>2,003\u003c/td>\u003c/tr>\u003ctr>\u003ctd>30\u003c/td>\u003ctd>4,288\u003c/td>\u003c/tr>\u003ctr>\u003ctd>40\u003c/td>\u003ctd>7,309\u003c/td>\u003c/tr>\u003ctr>\u003ctd>50\u003c/td>\u003ctd>11,024\u003c/td>\u003c/tr>\u003ctr>\u003ctd>60\u003c/td>\u003ctd>15,400\u003c/td>\u003c/tr>\u003ctr>\u003ctd>70\u003c/td>\u003ctd>20,414\u003c/td>\u003c/tr>\u003ctr>\u003ctd>80\u003c/td>\u003ctd>26,045\u003c/td>\u003c/tr>\u003ctr>\u003ctd>90\u003c/td>\u003ctd>32,277\u003c/td>\u003c/tr>\u003ctr>\u003ctd>99\u003c/td>\u003ctd>38,389\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","src":["shared/disciplines.ts"],"w":false,"r":false},{"s":"light-the-way","t":"Light the Way","c":"Quests","i":"📜","sum":"Prologue from Keeper Aldric.","a":[],"ib":[["Part of","Prologue"],["Given by","Keeper Aldric"],["Where","in the Emberhall, the great white temple in the town square"],["Steps","3"]],"h":"\u003cp>\u003cb>Light the Way\u003c/b> is part of the Prologue from \u003ca href=\"#keeper-aldric\" data-to=\"keeper-aldric\">Keeper Aldric\u003c/a>, found in the Emberhall, the great white temple in the town square.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#the-hall-of-light\" data-to=\"the-hall-of-light\">The Hall of Light\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Keeper Aldric\u003c/li>\u003cli>Light the 6 lanterns on the steps and round the square\u003c/li>\u003cli>Go back to Keeper Aldric \u003ci>(you get: \u003ca href=\"#your-lantern\" data-to=\"your-lantern\">Your lantern\u003c/a>)\u003c/i>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#your-lantern\" data-to=\"your-lantern\">Your lantern\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> Now, a small job, but an important one. Every evening we light the lanterns on the Emberhall's steps and round the square, so no one in town walks in the dark. Walk out through the great doors at the bottom of the hall and light all six: click each lantern. The ❗ marks show you which are still dark.\u003c/p>\n\u003cp>\u003cb>Step 3.\u003c/b> I saw the square light up from here! Beautiful. Light is a gift, friend, and you've just given some. Take this lantern for yourself. With it in your bag, the nights won't be so dark for you.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"living-off-the-land","t":"Living off the land","c":"Quests","i":"📜","sum":"Lessons from Old Maren.","a":[],"ib":[["Part of","Lessons"],["Given by","Old Maren"],["Where","in her cottage on the lake shore, west along the road from the square"],["Steps","23"]],"h":"\u003cp>\u003cb>Living off the land\u003c/b> is a lesson from \u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>, found in her cottage on the lake shore, west along the road from the square.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Old Maren in her cottage by the lake (west along the road from the square)\u003c/li>\u003cli>Catch a minnow by hand at the lake (right outside Maren's cottage)\u003c/li>\u003cli>Bring your minnow back to Old Maren \u003ci>(you get: \u003ca href=\"#fishing-rod\" data-to=\"fishing-rod\">Pine fishing rod\u003c/a>)\u003c/i>\u003c/li>\u003cli>Equip the rod (click it in your bag, then Equip)\u003c/li>\u003cli>Fish until the rod breaks (watch the bar under it)\u003c/li>\u003cli>Tell Old Maren your rod broke\u003c/li>\u003cli>Get your rod repaired at the Mages' Guild (south-west of town)\u003c/li>\u003cli>Bring your mended rod back to Old Maren\u003c/li>\u003cli>Spend a Mastery point (tap 📊, then a 🌳)\u003c/li>\u003cli>Tell Old Maren what you picked \u003ci>(you get: \u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>)\u003c/i>\u003c/li>\u003cli>Cook a stew at the stove (Stew, put in your minnow, Pine log)\u003c/li>\u003cli>Tell Old Maren what happened \u003ci>(you get: \u003ca href=\"#pot\" data-to=\"pot\">Bronze pot\u003c/a>, \u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>)\u003c/i>\u003c/li>\u003cli>Equip the pot (click it in your bag, then Equip)\u003c/li>\u003cli>Cook a stew with the pot equipped\u003c/li>\u003cli>Show Old Maren your stew (don't eat it yet!)\u003c/li>\u003cli>Eat your stew (click it in your bag, then Eat)\u003c/li>\u003cli>Sell a fish to Tam at the General Store (catch one if you have none)\u003c/li>\u003cli>Go back to Old Maren for your reward \u003ci>(you get: \u003ca href=\"#fishing-rod\" data-to=\"fishing-rod\">Oak fishing rod\u003c/a>, \u003ca href=\"#pot\" data-to=\"pot\">Bronze pot\u003c/a>, 2 × \u003ca href=\"#cooking\" data-to=\"cooking\">Minnow stew (3 minnow · pine)\u003c/a>)\u003c/i>\u003c/li>\u003cli>Equip the oak rod and the bronze pot\u003c/li>\u003cli>Reach Fishing level 3 (keep fishing)\u003c/li>\u003cli>Talk to Old Maren \u003ci>(you get: 5 × \u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>)\u003c/i>\u003c/li>\u003cli>Reach Cooking level 3 (cook stews)\u003c/li>\u003cli>Go back to Old Maren\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Teaches:\u003c/b> \u003ca href=\"#fishing\" data-to=\"fishing\">Fishing\u003c/a>, \u003ca href=\"#cooking\" data-to=\"cooking\">Cooking\u003c/a>.\u003c/p>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#fishing-rod\" data-to=\"fishing-rod\">Pine fishing rod\u003c/a>, \u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>, \u003ca href=\"#pot\" data-to=\"pot\">Bronze pot\u003c/a>, \u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>, \u003ca href=\"#fishing-rod\" data-to=\"fishing-rod\">Oak fishing rod\u003c/a>, \u003ca href=\"#pot\" data-to=\"pot\">Bronze pot\u003c/a>, \u003ca href=\"#cooking\" data-to=\"cooking\">Minnow stew (3 minnow · pine)\u003c/a>, \u003ca href=\"#pine-logs\" data-to=\"pine-logs\">Pine logs\u003c/a>, 1.3 silver.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> Well now, a fresh face! I'm Maren. I fished these waters for forty years before my knees gave out. Everyone starts with empty hands, so let's begin with the oldest skill there is: fishing. The lake is right outside my door. Click the water's edge. You've no rod, so it'll be slow. Bring me back one minnow.\u003c/p>\n\u003cp>\u003cb>Step 3.\u003c/b> Ha! Took you a while, didn't it? That's fishing by hand. Here, take my old rod. It's nearly worn out, but any tool on your belt makes you much faster at its job: rods for fishing, axes for chopping, pickaxes for mining. Click the rod in your bag and press &quot;Equip&quot;. A tool only works when it's on your belt.\u003c/p>\n\u003cp>\u003cb>Step 6.\u003c/b> Snapped, did it? Every tool wears down a little each time you use it: tools when you use them, weapons when you hit, armor when you get hit. It works just as well right up until it breaks. A broken tool isn't gone, though. It's in your bag, and Oswin the Repairer can fix it. He works at the Mages' Guild, the purple hall south-west of town, past the lake. Walk onto its door to go in. Take my rod to him. He's an old friend, so this first one's free. After that he charges a few coins, more for finer things.\u003c/p>\n\u003cp>\u003cb>Step 8.\u003c/b> Good as new! Better tools last longer: bronze is where everyone starts, iron lasts twice as long, and the finer metals longer still. A better wooden handle helps too. Fishing rods are all wood, so for those, the better the wood, the better the rod. Look at you, though: all that fishing raised your Minnow Mastery. Every kind of fish, log and ore has its own Mastery, and every time one goes up a level, you earn a Mastery point. Spend your points on upgrades, like faster fishing or a bigger cooking pot. Open the 📊 panel (bottom right), tap the 🌳 next to any skill, and pick an upgrade. Go on, spend your first point now.\u003c/p>\n\u003cp>\u003cb>Step 10.\u003c/b> Good choice! And don't fret about picking wrong: resetting a tree is free, and all your points come back. Here's a few coins for learning that. Now, raw minnows won't keep you going for long. Take this pine log to my stove, right here, and cook your fish into a stew. Pick Stew, tap your minnow to put it in the pot, and pick the Pine log to burn.\u003c/p>\n\u003cp>\u003cb>Step 12.\u003c/b> Burned it to a crisp, eh? Don't feel bad: everyone burns their first stew. When you fail, the fish and the log are gone, but you still learn a little. Here's the secret. Some tools make you faster, others make you succeed more often. Rods, axes and pickaxes are about speed. A pot, a hammer and tongs are about success. Cooking without a pot halves your chance. Take my old bronze pot and equip it, just like the rod. It's seen better days, but it'll do. Here's another log.\u003c/p>\n\u003cp>\u003cb>Step 15.\u003c/b> Now that's a stew! Smells like my mother's kitchen. See the ⚡ bar at the top left? That's your stamina. Everything you do costs some: a fish costs 1, cooking 2, and chopping or mining 10. It comes back on its own, 1 every 30 seconds, but food is much faster. A raw minnow gives 2. A stew gives three times what its fish would, plus a bit from the fire. Go on, eat your stew. Then sell a fish to Shopkeeper Tam at the General Store, just west of the square, on the south side of the road. Walk onto the door to go in. Tam buys anything.\u003c/p>\n\u003cp>\u003cb>Step 18.\u003c/b> You've got the hang of living off the land: fish, cook, eat, and sell what you don't need. Here's your reward: an oak fishing rod and a brand new bronze pot. Faster fishing, and they'll last you a good long while. And some coins and a couple of stews for the road. Equip them both. My old pot goes back in your bag when you do.\u003c/p>\n\u003cp>\u003cb>Step 21.\u003c/b> Fishing 3! Every skill belongs to a Discipline. Fishing is part of Endurance, which raises your max stamina. A Discipline's level is the average of the skills you've learned in it. Open the 📊 panel and look: every kind of fish has its own Mastery too. The higher it is, the faster you catch it and the more shops pay for it. One last thing from me: cook stews at the stove until you reach Cooking 3. More ingredients in the pot give more XP. Here's some firewood to get you going.\u003c/p>\n\u003cp>\u003cb>Step 23.\u003c/b> Cooking 3! Cooking is Dexterity, which lets you carry more and walk faster. You've learned all I have to teach. Now it's time you met the trainers. Forester Holt, Miner Greta and Smith Brann live on Trainer Row, east of the square, on the north side of the road. Shopkeeper Tam and Woodworker Rook are just west of the square. Everyone works indoors: walk onto a door to go in. Huntmaster Kael's lodge is down the south road, by the gate to the Dark Forest. Archmage Rowan runs the Mages' Guild to the south-west, and Captain Bryn, by the bounty board in the town square, always has work. Visit them in any order you like. Anyone with a ❗ over their head has a lesson for you, and each one ends with a reward. Your 📜 Quests tab keeps track.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"mace","t":"Mace","c":"Items","i":"🏏","sum":"A melee weapon.","a":[],"ib":[["Style","Melee"],["Level","10"],["Biggest hit","5 + metal"],["Attacks every","3s"],["Range","1 tile"],["Hands","One"]],"h":"\u003cp>🏏 The mace needs \u003ca href=\"#melee\" data-to=\"melee\">Melee\u003c/a> level 10. Its biggest hit is 5, plus its metal's bonus. It attacks every 3s and reaches 1 tile. See \u003ca href=\"#weapons\" data-to=\"weapons\">Weapons\u003c/a> and \u003ca href=\"#combat\" data-to=\"combat\">Combat\u003c/a>.\u003c/p>","src":["shared/gear.ts"],"w":false,"r":false},{"s":"main-page","t":"Main page","c":"Wiki","i":"🔥","sum":"The team's book of everything in Emberfall and its land, Embervale: the story, the world, and how the game actually works.","a":[],"ib":[],"h":"\u003cp>Welcome to the \u003cb>Emberfall Wiki\u003c/b>. It's the place to look things up and keep the game consistent: who someone is, what an item does, where a monster lives, what really happened 500 years ago.\u003c/p>\n\u003cp>Pages come in two kinds, and each page says which it is at the bottom:\u003c/p>\n\u003cul>\u003cli>\u003cb>Written pages\u003c/b> hold the story: the lore, places, factions and people. They follow the lore bible.\u003c/li>\u003cli>\u003cb>Pages made from the game's code\u003c/b> hold the facts: every monster, item, skill, spell, quest, shop and book, with the real numbers. They're rebuilt from the game every time, so they always match what's live.\u003c/li>\u003c/ul>\n\u003cp>Red links are pages that don't exist yet. Secrets (the twists players shouldn't learn early) are in red boxes; turn off 🔒 \u003ci>Show secrets\u003c/i> at the top to read the wiki the way a player would.\u003c/p>\n\u003ch2 id=\"s-start-here\">Start here\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"#embervale\" data-to=\"embervale\">Embervale\u003c/a>: the land, and the one-paragraph story.\u003c/li>\u003cli>\u003ca href=\"#the-emberheart\" data-to=\"the-emberheart\">The Emberheart\u003c/a> and \u003ca href=\"#the-ember\" data-to=\"the-ember\">The ember\u003c/a>: what everything runs on.\u003c/li>\u003cli>\u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a> and \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>: the two sides.\u003c/li>\u003cli>\u003ca href=\"#maps\" data-to=\"maps\">Maps\u003c/a>: the whole world and every building, drawn from the game.\u003c/li>\u003cli>\u003ca href=\"#history\" data-to=\"history\">History\u003c/a>: 500 years, as it happened and as people tell it.\u003c/li>\u003cli>\u003ca href=\"#main-story\" data-to=\"main-story\">Main story\u003c/a>: the acts, from waking up as a Hopeful to the final choice.\u003c/li>\u003cli>\u003ca href=\"#version-history\" data-to=\"version-history\">Version history\u003c/a>: what changed in each game update.\u003c/li>\u003cli>\u003ca href=\"#how-to-update-the-wiki\" data-to=\"how-to-update-the-wiki\">How to update the wiki\u003c/a>: keeping it current.\u003c/li>\u003c/ul>","src":["wiki/pages/main-page.md"],"w":true,"r":false},{"s":"main-story","t":"Main story","c":"Story","i":"🎭","sum":"From waking as a Hopeful to the final choice: the acts of the main quest.","a":["Main quest","Acts"],"ib":[],"h":"\u003cp>You start as a \u003ca href=\"#hopefuls\" data-to=\"hopefuls\">Hopeful\u003c/a>, not a member. \u003ca href=\"#the-emberguard\" data-to=\"the-emberguard\">The Emberguard\u003c/a>'s trials take you across the land, and when you've proven yourself, they invite you to join. That's the day you learn the truth and choose a side.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Act\u003c/th>\u003cth>Where, levels\u003c/th>\u003cth>What happens\u003c/th>\u003cth>What the player learns\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Prologue: Awakening (built)\u003c/td>\u003ctd>\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a> and \u003ca href=\"#emberhold\" data-to=\"emberhold\">Emberhold\u003c/a>, 1 to 10\u003c/td>\u003ctd>You wake at \u003ca href=\"#the-heart-shrine\" data-to=\"the-heart-shrine\">The Heart Shrine\u003c/a>. The Emberguard welcome you kindly, but you're one of hundreds. Learn the trades, then swear the Oath of the Flame to be allowed to try for the Emberguard. Trial mark: Ember.\u003c/td>\u003ctd>The happy story: the land's fire burst long ago, and the Emberguard's shrines keep everyone safe.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Act 1: The First Trial (built)\u003c/td>\u003ctd>\u003ca href=\"#heartvale\" data-to=\"heartvale\">Heartvale\u003c/a>, 5 to 20\u003c/td>\u003ctd>Prove yourself around home: lantern rounds, the first Tithe mark, rebuilding the Westroad shrine, the Hollow Wolves, lighting the Thornwood shrine. Trial mark: Flame.\u003c/td>\u003ctd>Small things feel off. Trees die nearest the shrines. The Dark Forest is growing.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Act 2: The Trials\u003c/td>\u003ctd>Thornwood, Greyspine, Saltmere, Barrens, 15 to 60\u003c/td>\u003ctd>Each \u003ca href=\"#emberwardens\" data-to=\"emberwardens\">Emberwarden\u003c/a> sets you a trial in their region: relight their great shrine, solve a local problem, beat a boss. \u003ca href=\"#rhys\" data-to=\"rhys\">Rhys\u003c/a> is always one trial ahead. Trial marks: Blaze, then Radiant.\u003c/td>\u003ctd>🔒 The shrines pull ember out of the land. The shrines were meant to close. The Emberfall was caused by mages.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Act 3: The Joining\u003c/td>\u003ctd>Emberhold and the Barrens, 55 to 65\u003c/td>\u003ctd>Rhys is invited to join first, and comes back up the Emberhall stair drained. You find Rhys, meet \u003ca href=\"#the-ashbound\" data-to=\"the-ashbound\">The Ashbound\u003c/a>, steal the ledger, and hear \u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>'s story. Then your own invitation comes.\u003c/td>\u003ctd>🔒 The Emberguard are the dark mages who broke the land. Emberborn are made of stolen ember. Stopping the siphon will turn every Emberborn to ash.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Your Joining: the choice\u003c/td>\u003ctd>The Emberhall stair, or the Ashbound camp\u003c/td>\u003ctd>\u003ca href=\"#archmage-vale\" data-to=\"archmage-vale\">Vale\u003c/a> offers you a place among \u003ca href=\"#the-undying\" data-to=\"the-undying\">The Undying\u003c/a>: \u003ci>&quot;Join us, and you'll never fall again.&quot;\u003c/i> \u003ca href=\"#sable\" data-to=\"sable\">Sable\u003c/a> offers you nothing but the truth: \u003ci>&quot;Better ash than a thief.&quot;\u003c/i> You choose.\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Act 4A: Breaking the Thread (Ashbound)\u003c/td>\u003ctd>Everywhere, \u003ca href=\"#frostfell\" data-to=\"frostfell\">Frostfell\u003c/a>, \u003ca href=\"#the-hollow-heart\" data-to=\"the-hollow-heart\">The Hollow Heart\u003c/a>, 60 to 75\u003c/td>\u003ctd>Gather five pieces and cut your own thread, like Maren did. Smash the great shrines one by one, unmask Vale, and fight him at the Emberheart.\u003c/td>\u003ctd>Every shrine you break makes the land warmer, and brings your own end a little closer.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Act 4B: Ascension (Emberguard)\u003c/td>\u003ctd>Everywhere, Frostfell, the Hollow Heart, 60 to 75\u003c/td>\u003ctd>Go down the stair and become a true member. Harvest sparks, hunt the Ashbound, drive off Sable's raid on the Emberheart, and have your thread turned so it feeds you. You become Undying.\u003c/td>\u003ctd>Vale admits the Emberheart is dying, and doesn't care.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Endgame\u003c/td>\u003ctd>\u003ca href=\"#the-sundered-crown\" data-to=\"the-sundered-crown\">The Sundered Crown\u003c/a>, 70+\u003c/td>\u003ctd>Both sides search \u003ca href=\"#brightcrown\" data-to=\"brightcrown\">Brightcrown\u003c/a>'s ruins: the Emberguard for the other half of the \u003ca href=\"#ember-crown\" data-to=\"ember-crown\">Ember Crown\u003c/a>, the Ashbound for the \u003ca href=\"#ember-seed\" data-to=\"ember-seed\">Ember Seed\u003c/a>.\u003c/td>\u003ctd>The Old Kingdom's real history, and the one hope that Emberborn could live without stealing.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The Prologue and Act 1 are in the game: see \u003ca href=\"#quests\" data-to=\"quests\">Quests\u003c/a> for every built quest, step by step.\u003c/p>\n\u003ch2 id=\"s-how-turning-to-ash-works-in-play\">How turning to ash works in play\u003c/h2>\n\u003cp>Ashbound players never really crumble away; it's the story they live under. After you cut your thread, grey ash marks slowly spread up your character's hands, Ember Debt ends, and you rise at Ashbound hearths instead of shrines. Emberguard players get the opposite look: a faint gold glow in the eyes.\u003c/p>\n\u003ch2 id=\"s-changes-still-to-make-in-the-game\">Changes still to make in the game\u003c/h2>\n\u003cul>\u003cli>The Oath of the Flame today says you join and become an Ember. It should become an oath to \u003ci>try\u003c/i> for the Emberguard, with Ember, Flame, Blaze and Radiant as trial marks, not ranks (see \u003ca href=\"#trial-marks\" data-to=\"trial-marks\">Trial marks\u003c/a>).\u003c/li>\u003cli>Act 1's title, &quot;The Light Welcomes You&quot;, should become &quot;The First Trial&quot;.\u003c/li>\u003cli>The old names in the code should be swapped (see \u003ca href=\"#names\" data-to=\"names\">Names\u003c/a>).\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-open-questions\">Open questions\u003c/h2>\n\u003cul>\u003cli>When does your Joining happen? The plan puts it at the end of Act 3. It could come at the end of Act 2 instead.\u003c/li>\u003cli>Can the siphon ever fully stop? As planned, the endgame is a tug of war, and the Ember Seed is the Ashbound's hope. A future update could let them finally plant it.\u003c/li>\u003c/ul>","src":["wiki/pages/main-story.md"],"w":true,"r":false},{"s":"mana-potion","t":"Mana potion","c":"Items","i":"🧪","sum":"Restores mana.","a":[],"ib":[["Alchemy level","5"],["Ingredients","Blue lotus + Bat wings"],["XP","12"],["First tries work","60%"]],"h":"\u003cp>Restores mana. Brew it with \u003ca href=\"#alchemy\" data-to=\"alchemy\">Alchemy\u003c/a> level 5 from \u003ca href=\"#blue-lotus\" data-to=\"blue-lotus\">Blue lotus\u003c/a> and \u003ca href=\"#bat-wings\" data-to=\"bat-wings\">Bat wings\u003c/a> in a vial. See \u003ca href=\"#potions\" data-to=\"potions\">Potions\u003c/a>.\u003c/p>","src":["shared/alchemy.ts"],"w":false,"r":false},{"s":"maple-logs","t":"Maple logs","c":"Items","i":"🪵","sum":"Log. Sells for 10 bronze.","a":["maple log"],"ib":[["Kind","Logs"],["Shop pays","10 bronze"],["Game id","\u003ccode>maple_logs\u003c/code>"]],"h":"\u003ch2 id=\"s-where-to-get-it\">Where to get it\u003c/h2>\n\u003cul>\u003cli>Gathered with \u003ca href=\"#woodcutting\" data-to=\"woodcutting\">Woodcutting\u003c/a> level 20 from a maple tree (9 XP each).\u003c/li>\u003cli>Sold by \u003ca href=\"#forester-holt\" data-to=\"forester-holt\">Forester Holt\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"s-what-its-for\">What it's for\u003c/h2>\n\u003cul>\u003cli>Used for tool handles, bows, staffs and arrows, and burned as cooking fuel.\u003c/li>\u003c/ul>","src":["shared/items.ts"],"w":false,"r":false},{"s":"maps","t":"Maps","c":"Places","i":"🗺️","sum":"Every map in the game, drawn tile by tile from the game itself.","a":["Map","World map"],"ib":[],"h":"\u003cp>These maps are drawn from the game's own map, tile by tile, so they always match the game. Tap a map to zoom in. Tap a dot to open its page: ⚪ people, 🔴 monsters, 🟡 doors into buildings and caves. Darker green is the danger zone, where monsters attack on sight.\u003c/p>\n\u003ch2 id=\"s-heartvale-outdoors\">Heartvale (outdoors)\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"heartvale\">\u003c/figure>\n\u003ch2 id=\"s-the-emberhall\">\u003ca href=\"#the-emberhall\" data-to=\"the-emberhall\">The Emberhall\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"lighthall\">\u003c/figure>\n\u003ch2 id=\"s-old-marens-cottage\">\u003ca href=\"#old-marens-cottage\" data-to=\"old-marens-cottage\">Old Maren's cottage\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"maren\">\u003c/figure>\n\u003ch2 id=\"s-the-general-store\">\u003ca href=\"#the-general-store\" data-to=\"the-general-store\">The General Store\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"tam\">\u003c/figure>\n\u003ch2 id=\"s-forester-holts-house\">\u003ca href=\"#forester-holts-house\" data-to=\"forester-holts-house\">Forester Holt's house\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"holt\">\u003c/figure>\n\u003ch2 id=\"s-miner-gretas-house\">\u003ca href=\"#miner-gretas-house\" data-to=\"miner-gretas-house\">Miner Greta's house\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"greta\">\u003c/figure>\n\u003ch2 id=\"s-smith-branns-smithy\">\u003ca href=\"#smith-branns-smithy\" data-to=\"smith-branns-smithy\">Smith Brann's smithy\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"smithy\">\u003c/figure>\n\u003ch2 id=\"s-woodworker-rooks-workshop\">\u003ca href=\"#woodworker-rooks-workshop\" data-to=\"woodworker-rooks-workshop\">Woodworker Rook's workshop\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"rook\">\u003c/figure>\n\u003ch2 id=\"s-huntmaster-kaels-lodge\">\u003ca href=\"#huntmaster-kaels-lodge\" data-to=\"huntmaster-kaels-lodge\">Huntmaster Kael's lodge\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"kael\">\u003c/figure>\n\u003ch2 id=\"s-herbalist-wrens-hut\">\u003ca href=\"#herbalist-wrens-hut\" data-to=\"herbalist-wrens-hut\">Herbalist Wren's hut\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"wren\">\u003c/figure>\n\u003ch2 id=\"s-the-hearthstone-inn\">\u003ca href=\"#the-hearthstone-inn\" data-to=\"the-hearthstone-inn\">The Hearthstone Inn\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"inn\">\u003c/figure>\n\u003ch2 id=\"s-the-mages-guild\">\u003ca href=\"#the-mages-guild\" data-to=\"the-mages-guild\">The Mages' Guild\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"guild\">\u003c/figure>\n\u003ch2 id=\"s-the-spider-cave\">\u003ca href=\"#the-spider-cave\" data-to=\"the-spider-cave\">The spider cave\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"spider_cave\">\u003c/figure>\n\u003ch2 id=\"s-the-crystal-cave\">\u003ca href=\"#the-crystal-cave\" data-to=\"the-crystal-cave\">The crystal cave\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"crystal_cave\">\u003c/figure>\n\u003ch2 id=\"s-the-old-mine\">\u003ca href=\"#the-old-mine\" data-to=\"the-old-mine\">The old mine\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"old_mine\">\u003c/figure>\n\u003ch2 id=\"s-the-wolf-den\">\u003ca href=\"#the-wolf-den\" data-to=\"the-wolf-den\">The wolf den\u003c/a>\u003c/h2>\n\u003cfigure class=\"map\" data-area=\"wolf_den\">\u003c/figure>","src":["shared/world.ts","shared/npcs.ts","client/src/mapDraw.ts"],"w":false,"r":false},{"s":"marens-question","t":"Maren's Question","c":"Quests","i":"📜","sum":"Act 1 from Old Maren.","a":[],"ib":[["Part of","Act 1"],["Given by","Old Maren"],["Where","in her cottage on the lake shore, west along the road from the square"],["Steps","1"]],"h":"\u003cp>\u003cb>Maren's Question\u003c/b> is part of the Act 1 from \u003ca href=\"#old-maren\" data-to=\"old-maren\">Old Maren\u003c/a>, found in her cottage on the lake shore, west along the road from the square.\u003c/p>\n\u003cp>It opens after: \u003ca href=\"#the-first-tithe\" data-to=\"the-first-tithe\">The First Tithe\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-steps\">Steps\u003c/h2>\n\u003col>\u003cli>Talk to Old Maren \u003ci>(you get: \u003ca href=\"#marens-worn-charm\" data-to=\"marens-worn-charm\">Maren's worn charm\u003c/a>)\u003c/i>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Rewards:\u003c/b> \u003ca href=\"#marens-worn-charm\" data-to=\"marens-worn-charm\">Maren's worn charm\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-what-people-say\">What people say\u003c/h2>\n\u003cp>\u003cb>Step 1.\u003c/b> Come here, child. Closer. Quietly now. Have you died yet? Since the Oath, I mean. Have they put their gold on you? When you woke... did it feel like something was taken? Like you came back a little less? No. Don't answer. Not here, not even with the door shut. Just keep this, and remember I asked.\u003c/p>","src":["shared/quests.ts","shared/story.ts"],"w":false,"r":false},{"s":"marens-worn-charm","t":"Maren's worn charm","c":"Items","i":"🪬","sum":"A little wooden flame, worn sm
