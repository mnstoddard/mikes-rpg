<title>Emberfall Wiki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<!--
  This file is the wiki's look and behaviour. The pages themselves are put in
  where it says WIKI_DATA by wiki/build.ts (npm run wiki). Don't paste page text
  in here: edit wiki/pages/*.md or the game, then rebuild.
-->
<style>
/* Layout: a reference book. Sticky search bar on top, a contents rail on the left, the article in a readable column with its fact box on the right. */
:root {
  --bg: #f5f6f8;
  --paper: #ffffff;
  --ink: #1b2029;
  --muted: #5a6373;
  --line: #dfe3ea;
  --soft: #eef1f5;
  --link: #1d5aa6;
  --link-visited: #5b3fa0;
  --new: #b4232a;
  --ember: #c2410c;
  --ember-soft: #fff1e8;
  --secret-bg: #fbeff0;
  --secret-line: #d9a3a8;
  --secret-ink: #8c1d27;
  --note-bg: #eef5fd;
  --note-line: #a9c6ea;
  --display: "Spectral", "Iowan Old Style", Georgia, serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --paper: #181b22; --ink: #e5e8ee; --muted: #9aa3b2; --line: #2b303b; --soft: #20242d;
    --link: #82b2ff; --link-visited: #b9a2f2; --new: #ff8a8f; --ember: #f39257; --ember-soft: #2a1d16;
    --secret-bg: #2a1a1d; --secret-line: #6b3a41; --secret-ink: #ffb3ba; --note-bg: #172231; --note-line: #2f4a6e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --paper: #181b22; --ink: #e5e8ee; --muted: #9aa3b2; --line: #2b303b; --soft: #20242d;
  --link: #82b2ff; --link-visited: #b9a2f2; --new: #ff8a8f; --ember: #f39257; --ember-soft: #2a1d16;
  --secret-bg: #2a1a1d; --secret-line: #6b3a41; --secret-ink: #ffb3ba; --note-bg: #172231; --note-line: #2f4a6e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font: 16px/1.6 var(--body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; border-radius: 3px; }
a.new { color: var(--new); cursor: help; }

/* ---- top bar ---- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 8px; color: var(--ink); white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand b { font: 700 22px/1 var(--display); letter-spacing: .01em; }
.brand b span { color: var(--ember); }
.brand small { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }
.menu-btn { display: none; }
.search { position: relative; flex: 1; max-width: 520px; margin-left: auto; }
.search input { width: 100%; font: inherit; font-size: 15px; padding: 8px 12px 8px 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; }
.results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.14); overflow: hidden; }
.results a { display: flex; gap: 10px; padding: 8px 12px; color: var(--ink); border-top: 1px solid var(--soft); }
.results a:first-child { border-top: 0; }
.results a.on, .results a:hover { background: var(--soft); text-decoration: none; }
.results .ri { width: 22px; text-align: center; flex: none; }
.results .rt { font-weight: 600; }
.results .rc { color: var(--muted); font-size: 13px; margin-left: auto; white-space: nowrap; }
.toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--ember); }

/* ---- frame ---- */
.frame { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 32px; max-width: 1320px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; max-height: calc(100vh - 96px); overflow: auto; font-size: 14px; }
.side h3 { font: 600 11px/1 var(--body); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin: 18px 0 8px; }
.side h3:first-child { margin-top: 0; }
.side a { display: flex; justify-content: space-between; gap: 8px; padding: 3px 8px; margin: 0 -8px; border-radius: 6px; color: var(--ink); }
.side a:hover { background: var(--soft); text-decoration: none; }
.side a.on { background: var(--ember-soft); color: var(--ember); font-weight: 600; }
.side a span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }

/* ---- article ---- */
article { min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 28px 32px 32px; }
.crumb { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
h1 { font: 600 34px/1.15 var(--display); margin: 0 0 4px; text-wrap: balance; }
.lede { color: var(--muted); margin: 0 0 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.content { display: flow-root; }
.content h2 { font: 600 24px/1.25 var(--display); margin: 30px 0 10px; padding-bottom: 4px; border-bottom: 1px solid var(--line); text-wrap: balance; }
.content h3 { font: 600 19px/1.3 var(--display); margin: 22px 0 6px; }
.content h4 { font-size: 16px; margin: 18px 0 4px; }
.content p, .content ul, .content ol { max-width: 72ch; }
.content p { margin: 0 0 12px; }
.content ul, .content ol { padding-left: 22px; margin: 0 0 12px; }
.content li { margin: 3px 0; }
.content blockquote { margin: 0 0 12px; padding: 4px 0 4px 16px; border-left: 3px solid var(--line); color: var(--muted); font-style: italic; max-width: 70ch; }
.content blockquote p { margin: 6px 0; }
code { font: 500 .86em var(--mono); background: var(--soft); padding: 1px 5px; border-radius: 4px; }
.tw { overflow-x: auto; margin: 0 0 16px; }
.content table { border-collapse: collapse; font-size: 14.5px; min-width: 50%; }
.content th, .content td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; font-variant-numeric: tabular-nums; }
.content th { background: var(--soft); font-weight: 600; }
.content td { min-width: 7em; }
.box { border: 1px solid; border-radius: 8px; padding: 10px 14px 4px; margin: 0 0 14px; max-width: 72ch; }
.box-label { font: 700 11px/1 var(--body); text-transform: uppercase; letter-spacing: .12em; margin: 2px 0 8px; }
.box.secret { background: var(--secret-bg); border-color: var(--secret-line); }
.box.secret .box-label { color: var(--secret-ink); }
.box.note { background: var(--note-bg); border-color: var(--note-line); }
body.no-secrets .box.secret { display: none; }
body.no-secrets .secret-only { display: none; }

.infobox { float: right; width: 290px; margin: 0 0 16px 24px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 14px; overflow: hidden; }
.infobox .ib-head { text-align: center; padding: 14px 12px 10px; border-bottom: 1px solid var(--line); }
.infobox .ib-icon { font-size: 46px; line-height: 1.1; }
.infobox .ib-title { font: 600 18px/1.25 var(--display); margin-top: 4px; }
.infobox .ib-cat { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.infobox dl { margin: 0; display: grid; grid-template-columns: auto 1fr; }
.infobox dt, .infobox dd { margin: 0; padding: 6px 12px; border-top: 1px solid var(--line); }
.infobox dt { font-weight: 600; color: var(--muted); }
.infobox dl > :nth-child(-n+2) { border-top: 0; }

.toc { display: inline-block; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 10px 16px 10px 14px; margin: 0 0 18px; font-size: 14px; }
.toc b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 4px; }
.toc ol { margin: 0; padding-left: 20px; }

.foot { clear: both; margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--muted); display: grid; gap: 8px; }
.foot .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-block; padding: 2px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; background: var(--bg); }
.made { display: inline-flex; gap: 6px; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
.made.game { background: var(--note-bg); color: var(--link); }
.made.written { background: var(--ember-soft); color: var(--ember); }

/* ---- main page and lists ---- */
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin: 10px 0 20px; }
.cat { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--bg); min-width: 0; }
.cat h3 { margin: 0 0 4px; font: 600 18px/1.2 var(--display); display: flex; justify-content: space-between; gap: 8px; }
.cat h3 span { font: 400 13px var(--body); color: var(--muted); }
.cat p { margin: 0; font-size: 14px; color: var(--muted); }
.list { columns: 2 260px; column-gap: 28px; }
.list .letter { font: 600 18px var(--display); color: var(--ember); margin: 8px 0 4px; break-after: avoid; }
.list .row { break-inside: avoid; padding: 3px 0; }
.list .row small { display: block; color: var(--muted); font-size: 13px; line-height: 1.35; }
.hit mark { background: var(--ember-soft); color: inherit; padding: 0 1px; border-radius: 2px; }


/* ---- maps (drawn from the game's map data) ---- */
.map { margin: 0 0 18px; clear: both; }
.map .mw { overflow: auto; width: fit-content; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; background: #000; max-height: 80vh; }
.map canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; cursor: zoom-in; }
.map.zoomed canvas { width: auto; max-width: none; cursor: zoom-out; }
.map figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.map .tip { position: fixed; z-index: 40; pointer-events: none; background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.2); }

@media (max-width: 900px) {
  .frame { grid-template-columns: minmax(0, 1fr); padding-top: 14px; }
  .side { position: fixed; z-index: 25; top: calc(env(safe-area-inset-top, 0px) + 58px); left: 0; bottom: 0; width: min(290px, 85vw); max-height: none; background: var(--paper); border-right: 1px solid var(--line); padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); transform: translateX(-105%); transition: transform .2s; }
  body.menu-open .side { transform: none; box-shadow: 10px 0 30px rgba(0,0,0,.2); }
  .menu-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 18px; cursor: pointer; flex: none; }
  .brand small, .toggle .tl { display: none; }
  article { padding: 18px 16px 22px; }
  h1 { font-size: 28px; }
  .infobox { float: none; width: 100%; margin: 0 0 16px; }
}
@media (max-width: 520px) { .brand b { font-size: 19px; } .top-in { gap: 10px; } }
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }

/* Change notes: a button on each page that saves a note for Claude, and a page listing them. */
.notebar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: -4px 0 14px; }
.btn-note { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--ember); background: var(--ember-soft); color: var(--ember); cursor: pointer; }
.btn-note:hover { filter: brightness(.97); }
.note-count { font-size: 13px; color: var(--muted); }
.note-form { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 12px; margin: 0 0 18px; display: grid; gap: 8px; }
.note-form label { font-size: 13px; color: var(--muted); }
.note-form select, .note-form textarea { font: inherit; font-size: 15px; width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.note-form textarea { min-height: 90px; resize: vertical; }
.note-form .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.note-form .msg { font-size: 13px; color: var(--muted); }
.btn-plain { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); cursor: pointer; }
.btn-go { font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 8px; border: 0; background: var(--ember); color: #fff; cursor: pointer; }
.notes-list { display: grid; gap: 10px; }
.note-card { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 12px; }
.note-card.done { opacity: .65; }
.note-card .meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.note-card .text { margin: 6px 0; white-space: pre-wrap; }
.note-card .reply { font-size: 14px; border-left: 3px solid var(--ember); padding-left: 8px; color: var(--muted); }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--soft); }
.tag.open { background: var(--ember-soft); color: var(--ember); }

/* Main questline view */
.ql-controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; align-items: end; }
.ql-controls label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
.ql-controls select, .ql-controls input { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.ql-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ql-item { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: start; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--paper); }
.ql-item.planned { background: var(--soft); }
.ql-item.moved { border-color: var(--ember); box-shadow: 0 0 0 2px var(--ember-soft); }
.ql-num { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; padding-top: 2px; text-align: right; }
.ql-title { font-weight: 600; }
.ql-meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 2px; }
.ql-what { font-size: 14px; margin-top: 4px; }
.ql-move { display: flex; flex-direction: column; gap: 4px; }
.ql-move button { font: inherit; font-size: 13px; line-height: 1; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); color: var(--ink); cursor: pointer; }
.ql-move button:disabled { opacity: .35; cursor: default; }
.ql-act { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--ember-soft); color: var(--ember); }
.ql-built { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: #e5f4ea; color: #1f6b3a; }
.ql-plan { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); border: 1px dashed var(--line); }
.ql-save { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; padding: 10px; border: 1px solid var(--ember); border-radius: 10px; background: var(--ember-soft); }
.ql-save input { flex: 1 1 220px; font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ql-built { background: #183a26; color: #8fd6a7; } }
</style>

<header class="top">
  <div class="top-in">
    <button class="menu-btn" id="menuBtn" aria-label="Browse the wiki">☰</button>
    <a class="brand" href="#main-page"><b>Ember<span>fall</span></b><small>Wiki</small></a>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="q" type="search" placeholder="Search the wiki" autocomplete="off" aria-label="Search the wiki">
      <div class="results" id="results" hidden></div>
    </div>
    <label class="toggle" title="Secrets are the twists players shouldn't learn early. Turn this off to read the wiki the way a player would.">
      <input type="checkbox" id="secrets" checked><span>🔒</span><span class="tl">Show secrets</span>
    </label>
  </div>
</header>

<div class="frame">
  <nav class="side" id="side" aria-label="Categories"></nav>
  <article id="page" aria-live="polite"></article>
</div>

<script>
const WIKI = /*WIKI_DATA*/null;
const bySlug = new Map(WIKI.pages.map((p) => [p.s, p]));
const CAT_ICONS = { Wiki: "📖", Lore: "🔥", History: "⏳", Story: "🎭", Places: "🗺️", Factions: "⚜️", People: "🧑", Quests: "📜", Skills: "📊", Spells: "🪄", Monsters: "🐺", Items: "🎒", Mechanics: "⚙️", Books: "📚", Updates: "🆕" };
const CAT_BLURBS = {
  Wiki: "About this wiki, and how to keep it current.", Lore: "The Emberheart, the ember, and what's really going on.", History: "Five hundred years, as it happened and as people tell it.",
  Story: "The main story, the twists, and the quests still to build.", Places: "Every region, town, building and cave.", Factions: "The Emberguard, the Ashbound and everyone between.",
  People: "Everyone in Emberhold, and the story's other characters.", Quests: "Every quest in the game today, step by step.", Skills: "Disciplines and skills, with their skill trees.",
  Spells: "Every spell, its level and its mana.", Monsters: "Every monster, where it lives and what it drops.", Items: "Everything you can carry, where to get it, and what it's for.",
  Mechanics: "The numbers behind the game.", Books: "The books on the game's shelves.", Updates: "Every game update, by version.",
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const strip = (h) => h.replace(/<[^>]+>/g, " ").replace(/&amp;/g, "&").replace(/&quot;/g, '"').replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/\s+/g, " ").trim();
const catSlug = (c) => "cat-" + c.toLowerCase();

// Links between pages, for "What links here".
const backlinks = new Map();
for (const p of WIKI.pages) for (const m of p.h.matchAll(/data-to="([^"]+)"/g)) { if (m[1] === p.s) continue; if (!backlinks.has(m[1])) backlinks.set(m[1], new Set()); backlinks.get(m[1]).add(p.s); }
const textOf = new Map(WIKI.pages.map((p) => [p.s, (p.t + " " + p.a.join(" ") + " " + strip(p.sum) + " " + strip(p.h)).toLowerCase()]));

// ---- sidebar ----
const side = document.getElementById("side");
function drawSide(current) {
  const counts = {}; for (const p of WIKI.pages) counts[p.c] = (counts[p.c] || 0) + 1;
  side.innerHTML = `<h3>Start</h3><a href="#main-page" class="${current === "main-page" ? "on" : ""}"><span>Main page</span></a><a href="#maps" class="${current === "maps" ? "on" : ""}"><span>🗺️ Maps</span></a><a href="#main-questline" class="${current === "main-questline" ? "on" : ""}"><span>🧭 Main questline</span></a><a href="#random"><span>Random page</span></a>` +
    `<h3>Categories</h3>` + WIKI.categories.map((c) => `<a href="#${catSlug(c)}" class="${current === catSlug(c) ? "on" : ""}"><span>${CAT_ICONS[c] || ""} ${esc(c)}</span><span>${counts[c]}</span></a>`).join("") +
    `<h3>This wiki</h3>${notesDb ? `<a href="#notes" class="${current === "notes" ? "on" : ""}"><span>📝 Change notes</span><span>${openCount() || ""}</span></a>` : ""}<a href="#how-to-update-the-wiki"><span>How to update it</span></a><a href="#names"><span>Names</span></a><a href="#version-history"><span>Game version ${esc(WIKI.version)}</span></a>`;
}

// ---- pages ----
const view = document.getElementById("page");
function infobox(p) {
  if (!p.ib.length) return "";
  return `<aside class="infobox"><div class="ib-head">${p.i ? `<div class="ib-icon">${p.i}</div>` : ""}<div class="ib-title">${esc(p.t)}</div><div class="ib-cat">${esc(p.c)}</div></div>` +
    (p.ib.length ? `<dl>${p.ib.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>` : "") + `</aside>`;
}
function toc(html) {

// ---- maps: drawn tile by tile from the game's own map ----
const MARK_STYLE = { person: ["#ffffff", "#1b2029"], monster: ["#ff5a5a", "#3a0d0d"], door: ["#ffd84a", "#3a2a00"] };
function drawMaps() {
  for (const fig of view.querySelectorAll(".map[data-area]")) {
    const m = WIKI.maps[fig.dataset.area];
    if (!m) continue;
    const px = Math.max(4, Math.min(24, Math.floor(1200 / m.w)));
    const c = document.createElement("canvas");
    c.width = m.w * px; c.height = m.h * px;
    const g = c.getContext("2d");
    for (let y = 0; y < m.h; y++) {
      const row = m.rows[y];
      for (let x = 0; x < m.w; x++) { g.fillStyle = m.palette[row.charCodeAt(x) - 48]; g.fillRect(x * px, y * px, px, px); }
    }
    const r = Math.max(3, px * 0.45);
    const dots = m.marks.filter((k) => MARK_STYLE[k.kind]);
    for (const k of dots) {
      const [fill, ring] = MARK_STYLE[k.kind];
      g.beginPath(); g.arc((k.x + .5) * px, (k.y + .5) * px, r, 0, Math.PI * 2);
      g.fillStyle = fill; g.fill(); g.lineWidth = Math.max(1.5, px / 6); g.strokeStyle = ring; g.stroke();
    }
    g.textAlign = "center"; g.textBaseline = "middle"; g.lineJoin = "round";
    const text = (t, x, y, size, color) => { g.font = `600 ${size}px "Source Sans 3", sans-serif`; g.lineWidth = Math.max(3, size / 4); g.strokeStyle = "rgba(0,0,0,.85)"; g.strokeText(t, x, y); g.fillStyle = color; g.fillText(t, x, y); };
    for (const k of m.marks) if (k.kind === "label" || k.kind === "big") text(k.text, k.x * px, k.y * px, k.kind === "big" ? px * 4.2 : px * 3.2, k.kind === "big" ? "#ffe9a8" : "#ffffff");
    if (px >= 10) for (const k of dots) if (k.kind !== "monster") text(k.text, (k.x + .5) * px, (k.y - .6) * px, Math.max(11, px * .75), k.kind === "door" ? "#ffe9a8" : "#ffffff");
    if (m.w < 120) c.style.maxWidth = m.w * 16 + "px"; // small rooms stay small
    const wrap = document.createElement("div"); wrap.className = "mw"; wrap.appendChild(c);
    const cap = document.createElement("figcaption");
    cap.innerHTML = `<span>${esc(m.name)}: ${m.w} × ${m.h} tiles</span><span>⚪ people</span><span>🔴 monsters</span><span>🟡 doors</span><span>Tap to zoom; tap a dot to open its page.</span>`;
    fig.replaceChildren(wrap, cap);
    const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; fig.appendChild(tip);
    const hit = (e) => {
      const b = c.getBoundingClientRect(), s = b.width / c.width;
      const tx = (e.clientX - b.left) / s / px, ty = (e.clientY - b.top) / s / px;
      let best = null, bd = Infinity;
      for (const k of dots) { const d = Math.hypot(k.x + .5 - tx, k.y + .5 - ty); if (d < bd) { bd = d; best = k; } }
      const reach = Math.max(1.2, 10 / (s * px));
      return bd <= reach ? best : null;
    };
    c.addEventListener("mousemove", (e) => { const k = hit(e); tip.hidden = !k; if (k) { tip.textContent = k.text; tip.style.left = e.clientX + 12 + "px"; tip.style.top = e.clientY + 12 + "px"; } c.style.cursor = k ? "pointer" : ""; });
    c.addEventListener("mouseleave", () => { tip.hidden = true; });
    c.addEventListener("click", (e) => { const k = hit(e); if (k && k.to && bySlug.has(k.to)) location.hash = k.to; else fig.classList.toggle("zoomed"); });
  }
}

// ---- main questline: filter, sort, and try a new order (saved as a change note) ----
var qlOrder, qlState;

  const card = (n) => `<div class="note-card ${n.status === "done" ? "done" : ""}"><div class="meta"><span class="tag ${n.status === "done" ? "" : "open"}">${n.status === "done" ? "Done" : "Open"}</span>` +
    `<a href="#${esc(n.page)}">${esc(n.title || n.page)}</a>${n.part && n.part !== "The whole page" ? `<span>· ${esc(n.part)}</span>` : ""}<span>· ${esc(whenStr(n.created))}</span>` +
    `<span style="margin-left:auto;display:flex;gap:6px"><button class="btn-plain" data-note-toggle="${esc(n.id)}">${n.status === "done" ? "Reopen" : "Mark done"}</button><button class="btn-plain" data-note-del="${esc(n.id)}">Delete</button></span></div>` +
    `<div class="text">${esc(n.text)}</div>${n.reply ? `<div class="reply">Claude: ${esc(n.reply)}</div>` : ""}</div>`;
  view.innerHTML = `<div class="crumb"><a href="#main-page">Main page</a></div><h1>📝 Change notes</h1>` +
    `<p class="lede">Notes left with the ✏️ Suggest a change button on any page. Claude reads them, makes the changes, marks them done and replies under each one.</p><div class="content">` +
    (!notesDb ? `<p>${notesErr || "Change notes only work when the wiki is opened on claude.ai while signed in."}</p>` :
      list.length ? `<div class="notes-list">${list.map(card).join("")}</div>` : `<p>No notes yet. Open any page and press ✏️ Suggest a change.</p>`) + `</div>`;
  document.title = "Change notes · Emberfall Wiki";
}
view.addEventListener("click", async (e) => {
  if (e.target.closest("[data-note-open]")) { const p = bySlug.get(decodeURIComponent(location.hash.slice(1)) || "main-page") || bySlug.get("main-page"); openNoteForm(p); return; }
  const t = e.target.closest("[data-note-toggle]"), d = e.target.closest("[data-note-del]");
  if (!notesDb || !(t || d)) return;
  const id = (t || d).dataset.noteToggle || (t || d).dataset.noteDel;
  const n = notes.find((x) => x.id === id); if (!n) return;
  try {
    if (t) await notesDb.doc("notes/" + id).update({ status: n.status === "done" ? "open" : "done" });
    else if (d.dataset.armed) await notesDb.doc("notes/" + id).delete();
    else { d.dataset.armed = "1"; d.textContent = "Sure? Delete"; }
  } catch (err) { (t || d).textContent = "Couldn't change it"; }
});
(async () => {
  try {
    notesDb = window.claude && typeof window.claude.use === "function" ? await window.claude.use("db") : null;
  } catch { notesDb = null; }
  if (!notesDb) { notesErr = ""; return; }
  const timer = setTimeout(() => { notesErr = "The notes are taking a while to load."; }, 10000);
  notesDb.collection("notes").onSnapshot((snap) => {
    clearTimeout(timer);
    notes = snap.docs.map((d) => ({ id: d.id, ...(d.data() || {}) }));
    const h = decodeURIComponent(location.hash.slice(1));
    if (h === "notes") showNotes(); else refreshBar();
    drawSide(h || "main-page");
  }, (err) => { clearTimeout(timer); notesErr = "Couldn't load the notes (" + (err && err.code || "error") + ")."; });
  refreshBar(); drawSide(decodeURIComponent(location.hash.slice(1)) || "main-page");
})();
/** Put the note button on the page being shown (or update its count) without re-drawing the page. */
function refreshBar() {
  const h = decodeURIComponent(location.hash.slice(1)) || "main-page";
  const p = bySlug.get(h); if (!p || !notesDb) return;
  if (h === "main-questline") drawQuestline();
  const tmp = document.createElement("div"); tmp.innerHTML = noteBar(p);
  const nb = view.querySelector(".notebar");
  if (nb) nb.replaceWith(tmp.firstElementChild);
  else { const c = view.querySelector(".content"); if (c) c.before(...tmp.childNodes); }
}

</script>
