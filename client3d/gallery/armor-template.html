<title>Armor Gallery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen app like the Tree Gallery. 3D stage (character on a floating island) beside a panel listing every armor set and piece with its review; stacked on phones. */
:root{
  --bg:#e8eeeb; --panel:#f7faf8; --ink:#1b2a2e; --muted:#5a6d6e; --line:#d2dcd8; --chip:#edf2f0;
  --accent:#2a7867; --on-accent:#ffffff; --ok:#2f8a4c; --ok-bg:#dff1e4; --warn:#a55a12; --warn-bg:#fbe9d4; --wait:#5a6d6e; --wait-bg:#e6ecea;
  --hud:rgba(255,255,255,.86); --hud-ink:#1b2a2e; --hud-line:rgba(27,42,46,.14); --hud-on:#1b2a2e; --hud-on-ink:#ffffff;
  --f-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10171a; --panel:#162023; --ink:#e3edea; --muted:#92a6a3; --line:#28383b; --chip:#1d2a2d;
  --accent:#5bc1a7; --on-accent:#0b1a16; --ok:#7fd39a; --ok-bg:#173326; --warn:#f0b070; --warn-bg:#3a2814; --wait:#a9bab7; --wait-bg:#223033;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10171a; --panel:#162023; --ink:#e3edea; --muted:#92a6a3; --line:#28383b; --chip:#1d2a2d;
  --accent:#5bc1a7; --on-accent:#0b1a16; --ok:#7fd39a; --ok-bg:#173326; --warn:#f0b070; --warn-bg:#3a2814; --wait:#a9bab7; --wait-bg:#223033;
  color-scheme:dark }

html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.stage{--sky-top:#8fc9ec;--sky-mid:#cfe6ef;--sky-low:#f4e7c9;position:relative;min-height:0;min-width:0;overflow:hidden;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 55%,var(--sky-low) 100%);transition:background .6s}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#cv:active{cursor:grabbing}

.hud{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;pointer-events:none}
.hud>*{pointer-events:auto}
.hud-top{top:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.hud-bottom{bottom:12px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.nameplate{background:var(--hud);color:var(--hud-ink);border:1px solid var(--hud-line);border-radius:14px;padding:6px 12px 7px;min-width:0;max-width:60%;backdrop-filter:blur(6px)}
.np-kicker{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.65;font-weight:700}
#np-name{display:block;font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-col{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.seg{display:flex;background:var(--hud);border:1px solid var(--hud-line);border-radius:999px;padding:3px;backdrop-filter:blur(6px)}
.seg button{border:0;background:transparent;color:var(--hud-ink);padding:6px 11px;border-radius:999px;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--hud-on);color:var(--hud-on-ink)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill-ctl{display:flex;align-items:center;gap:8px;background:var(--hud);color:var(--hud-ink);border:1px solid var(--hud-line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;backdrop-filter:blur(6px)}
.pill-ctl input[type=range]{width:90px;accent-color:#1b2a2e}
.pill-ctl input[type=checkbox]{accent-color:#1b2a2e;width:16px;height:16px;margin:0}
.ghost{border:1px solid var(--hud-line);background:var(--hud);color:var(--hud-ink);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;backdrop-filter:blur(6px);display:flex;align-items:center;gap:6px}
.ghost svg{width:16px;height:16px}
.big{flex:none;display:flex;align-items:center;gap:8px;border:0;border-radius:16px;padding:11px 18px;background:#f2a83b;color:#2a1a05;font-family:var(--f-display);font-weight:600;font-size:17px;box-shadow:0 3px 0 #b8741a,0 6px 14px rgba(0,0,0,.18);min-width:150px;justify-content:center}
.big:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #b8741a,0 3px 8px rgba(0,0,0,.18)}
.big svg{width:22px;height:22px}

.panel{min-height:0;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line)}
.p-head{padding-block:14px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.p-head h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:22px}
.tally{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:700}
#tally-bar{--p:0;flex:1;height:8px;border-radius:99px;background:var(--chip);overflow:hidden;position:relative}
#tally-bar::after{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--p)*100%);background:var(--ok);border-radius:99px;transition:width .4s}
.p-body{flex:1;min-height:0;overflow-y:auto;padding-block:10px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
#list{display:flex;flex-direction:column;gap:2px}
.set-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:12px 8px 2px;font-family:var(--f-display);font-weight:600;font-size:16px}
.set-head:first-child{margin-top:2px}
.set-head small{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--muted)}
.tag{font-family:var(--f-body);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.set-btn{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.tree-row{display:grid;grid-template-columns:14px minmax(0,1fr) auto;grid-template-areas:"sw name pill" "sw meta pill";column-gap:10px;align-items:center;text-align:left;border:0;background:transparent;border-radius:10px;padding:7px 8px}
.tree-row:hover{background:var(--chip)}
.tree-row[aria-current="true"]{background:var(--chip);box-shadow:inset 0 0 0 2px var(--accent)}
.swatch{grid-area:sw;width:14px;height:14px;border-radius:4px;background:var(--c);transform:rotate(45deg)}
.tr-name{grid-area:name;font-weight:700;line-height:1.2}
.tr-meta{grid-area:meta;font-size:12px;color:var(--muted)}
.pill{grid-area:pill;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.pill[data-s="waiting"]{background:var(--wait-bg);color:var(--wait)}
.pill[data-s="approved"]{background:var(--ok-bg);color:var(--ok)}
.pill[data-s="changes"]{background:var(--warn-bg);color:var(--warn)}

.detail{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.detail h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:24px;text-wrap:balance}
.detail p{margin:0;line-height:1.5}
.label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
#d-grows{color:var(--muted);font-size:14px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
dt{color:var(--muted)}
dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seed-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.seed-row button{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 11px;font-weight:700;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:6px}
.seed-row svg{width:15px;height:15px}

.review{background:var(--chip);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
#verdict{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#verdict button{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 8px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
#verdict button svg{width:17px;height:17px}
#verdict button[data-s="approved"][aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
#verdict button[data-s="changes"][aria-pressed="true"]{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
#note{width:100%;min-height:74px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px 10px;font-size:14px;line-height:1.4}
.review-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
#saved{font-size:12px;color:var(--muted)}
#save-note{border:0;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:7px 14px;font-weight:700;font-size:13px}
#db-note{font-size:12px;color:var(--warn);margin:0}

@media (max-width:820px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:56vh auto;height:auto;min-height:100%}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .p-body{overflow:visible}
  .pill-ctl input[type=range]{width:64px}
  .big{min-width:0}
  .detail{order:-1;border-top:0;padding-top:0}
  #list{order:1;border-top:1px solid var(--line);padding-top:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <section class="stage" id="stage" aria-label="3D armor view">
    <canvas id="cv"></canvas>
    <div class="hud hud-top">
      <div class="nameplate"><span class="np-kicker" id="np-kicker">Armor Gallery</span><span id="np-name">Bronze helmet</span></div>
      <div class="hud-col">
        <div class="seg" id="mode" role="group" aria-label="View">
          <button data-mode="worn" aria-pressed="true">Worn</button>
          <button data-mode="set" aria-pressed="false">Full set</button>
          <button data-mode="stand" aria-pressed="false">On a stand</button>
          <button data-mode="row" aria-pressed="false">All sets</button>
        </div>
        <div class="seg" id="time" role="group" aria-label="Time of day">
          <button data-time="day" aria-pressed="true">Day</button>
          <button data-time="sunset" aria-pressed="false">Sunset</button>
          <button data-time="night" aria-pressed="false">Night</button>
        </div>
      </div>
    </div>
    <div class="hud hud-bottom">
      <div class="tools">
        <div class="seg" id="anim" role="group" aria-label="Animation">
          <button data-anim="idle" aria-pressed="true">Stand</button>
          <button data-anim="walk" aria-pressed="false">Walk</button>
          <button data-anim="pose" aria-pressed="false">Hero pose</button>
        </div>
        <label class="pill-ctl" for="spin"><input id="spin" type="checkbox" checked> Turn</label>
      </div>
      <button class="big" id="next" type="button">
        <span>Next piece</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </section>

  <aside class="panel">
    <div class="p-head">
      <h1>Armor for Embervale</h1>
      <div class="tally"><span id="tally">0 approved</span><span id="tally-bar"></span></div>
    </div>
    <div class="p-body">
      <div id="list" role="list"></div>

      <div class="detail">
        <div>
          <h2 id="d-name">Bronze helmet</h2>
        </div>
        <p id="d-about"></p>
        <dl id="d-stats"></dl>
        <div>
          <p class="label">Style</p>
          <div class="chips" id="d-variants"></div>
        </div>
        <div>
          <p class="label">Try it on</p>
          <div class="chips" id="d-who"></div>
        </div>

        <div class="review">
          <p class="label" style="margin:0">Your review</p>
          <div id="verdict">
            <button data-s="approved" aria-pressed="false" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17 19 7"/></svg>
              Approve
            </button>
            <button data-s="changes" aria-pressed="false" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>
              Needs changes
            </button>
          </div>
          <p id="d-style-note" style="font-size:13px;color:var(--muted);margin:0">Approving saves the style you picked above.</p>
          <label class="label" for="note" style="margin:0">Notes for Claude</label>
          <textarea id="note" placeholder="e.g. make the shoulders bigger, love the Kite shield, more gold on mithril"></textarea>
          <div class="review-foot"><span id="saved"></span><button id="save-note" type="button">Save note</button></div>
          <p id="db-note" hidden>Reviews can't be saved in this view. Open the page on claude.ai, signed in, to save them.</p>
        </div>
      </div>
    </div>
  </aside>
</div>
<!--APP-->
