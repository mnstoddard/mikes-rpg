<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b3a4b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>RPG prototype</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: sans-serif; overflow: hidden;
      overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    /* The game handles all touches itself (tap to walk, pinch to zoom), so the browser must not zoom or scroll. */
    #game { position: fixed; inset: 0; touch-action: none; }
    #game canvas { display: block; }
    .panel { position: fixed; background: rgba(40, 32, 22, .92); border: 2px solid #6b5a3e; border-radius: 4px; }
    #hud { top: calc(8px + env(safe-area-inset-top)); left: calc(8px + env(safe-area-inset-left)); padding: 6px 10px; font-size: 13px; pointer-events: none; }
    #hover { position: fixed; pointer-events: none; font-size: 13px; color: #fff; text-shadow: 1px 1px 0 #000; display: none; }
    #hover b { color: #ffd84a; font-weight: normal; }
    #messages { left: calc(8px + env(safe-area-inset-left)); bottom: calc(8px + env(safe-area-inset-bottom)); width: 380px; padding: 6px 10px; font-size: 13px; line-height: 1.45; pointer-events: none; color: #f2e6c9; }
    #messages div:last-child { color: #fff; }
    #inventory { right: calc(8px + env(safe-area-inset-right)); bottom: calc(8px + env(safe-area-inset-bottom)); padding: 8px; }
    #inventory h3 { margin: 0 0 6px; font-size: 13px; color: #ffd84a; font-weight: normal; text-align: center; }
    #slots { display: grid; grid-template-columns: repeat(4, 40px); grid-auto-rows: 36px; gap: 3px; }
    .slot { background: rgba(0,0,0,.25); border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 24px; user-select: none; }
    .slot.filled { cursor: pointer; }
    .slot.filled:hover { background: rgba(255,255,255,.12); }
    #login { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.45); z-index: 10; }
    #login form { position: static; padding: 18px 20px; width: 260px; display: flex; flex-direction: column; gap: 8px; }
    #login h2 { margin: 0 0 4px; font-size: 18px; color: #ffd84a; font-weight: normal; text-align: center; }
    #login label { font-size: 13px; color: #f2e6c9; display: flex; flex-direction: column; gap: 3px; }
    #login input { font: inherit; font-size: 16px; -webkit-user-select: text; user-select: text; padding: 6px 8px; border: 1px solid #6b5a3e; border-radius: 3px; background: #1d170f; color: #fff; }
    #login .buttons { display: flex; gap: 8px; margin-top: 4px; }
    #login button { flex: 1; font: inherit; font-size: 14px; padding: 7px 0; border: 1px solid #6b5a3e; border-radius: 3px; background: #5a4a2f; color: #fff; cursor: pointer; }
    #login button:hover:not(:disabled) { background: #6e5b3a; }
    #login button:disabled { opacity: .6; cursor: default; }
    #zoom { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); display: flex; flex-direction: column; gap: 4px; }
    .btn { width: 40px; height: 40px; padding: 0; font-size: 22px; line-height: 1; color: #f2e6c9; cursor: pointer; position: static; touch-action: manipulation; }
    #bag { display: none; position: fixed; right: calc(8px + env(safe-area-inset-right)); bottom: calc(8px + env(safe-area-inset-bottom)); width: 52px; height: 52px; font-size: 26px; }
    #bag-count { position: absolute; right: 2px; bottom: 1px; font-size: 12px; color: #ffd84a; }

    /* Phones and other small screens */
    @media (max-width: 640px), (max-height: 500px) {
      #hud { font-size: 12px; padding: 4px 8px; }
      #messages { width: auto; right: calc(72px + env(safe-area-inset-right)); font-size: 12px; padding: 4px 8px; }
      #messages div:nth-last-child(n+4) { display: none; } /* last 3 lines only */
      #bag { display: block; }
      #inventory { display: none; bottom: calc(68px + env(safe-area-inset-bottom)); padding: 6px; }
      body.bag-open #inventory { display: block; }
      #slots { grid-template-columns: repeat(4, 38px); grid-auto-rows: 34px; }
      .slot { font-size: 22px; }
      #login form { width: min(260px, calc(100vw - 48px)); }
    }
    /* Phone held sideways: little height, so put the inventory in 7 columns. */
    @media (max-height: 500px) {
      #slots { grid-template-columns: repeat(7, 34px); grid-auto-rows: 30px; }
      .slot { font-size: 20px; }
    }
    #login-error { min-height: 1.3em; font-size: 13px; color: #ff9a8a; text-align: center; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="hud" class="panel">Connecting…</div>
  <div id="zoom"><button id="zoom-in" class="panel btn" aria-label="Zoom in">+</button><button id="zoom-out" class="panel btn" aria-label="Zoom out">−</button></div>
  <button id="bag" class="panel btn" aria-label="Inventory">🎒<span id="bag-count"></span></button>
  <div id="hover"></div>
  <div id="messages" class="panel"></div>
  <div id="inventory" class="panel"><h3>Inventory</h3><div id="slots"></div></div>
  <div id="login">
    <form class="panel" autocomplete="on">
      <h2>Welcome</h2>
      <label>Username <input id="login-username" name="username" autocomplete="username" maxlength="12" required /></label>
      <label>Password <input id="login-password" name="password" type="password" autocomplete="current-password" minlength="6" maxlength="100" required /></label>
      <div class="buttons">
        <button type="submit" value="login">Log in</button>
        <button type="submit" value="create">Create account</button>
      </div>
      <div id="login-error"></div>
    </form>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
