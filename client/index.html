<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b3a4b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>RPG prototype</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: sans-serif; overflow: hidden;
      overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    /* The game handles all touches itself (tap to walk, pinch to zoom), so the browser must not zoom or scroll. */
    #game { position: fixed; inset: 0; touch-action: none; }
    #game canvas { display: block; }
    .panel { position: fixed; background: rgba(40, 32, 22, .92); border: 2px solid #6b5a3e; border-radius: 4px; }
    #hud { top: calc(8px + env(safe-area-inset-top)); left: calc(8px + env(safe-area-inset-left)); padding: 6px 10px; font-size: 13px; pointer-events: none; }
    #hover { position: fixed; pointer-events: none; font-size: 13px; color: #fff; text-shadow: 1px 1px 0 #000; display: none; }
    #hover b { color: #ffd84a; font-weight: normal; }
    #messages { left: calc(8px + env(safe-area-inset-left)); bottom: calc(8px + env(safe-area-inset-bottom)); width: 380px; padding: 6px 10px; font-size: 13px; line-height: 1.45; pointer-events: none; color: #f2e6c9; }
    #messages div:last-child { color: #fff; }
    #tabs { position: fixed; right: calc(8px + env(safe-area-inset-right)); bottom: calc(8px + env(safe-area-inset-bottom)); display: flex; gap: 6px; }
    .tab { width: 52px; height: 52px; font-size: 26px; position: relative; }
    .tab.active { border-color: #ffd84a; background: rgba(90, 74, 47, .95); }
    .tab-count { position: absolute; right: 3px; bottom: 1px; font-size: 12px; color: #ffd84a; }
    .sidepanel { display: none; right: calc(8px + env(safe-area-inset-right)); bottom: calc(68px + env(safe-area-inset-bottom)); padding: 8px; }
    body[data-panel="inventory"] #inventory, body[data-panel="skills"] #skills { display: block; }
    .sidepanel h3 { margin: 0 0 6px; font-size: 13px; color: #ffd84a; font-weight: normal; text-align: center; }
    #slots { display: grid; grid-template-columns: repeat(4, 40px); grid-auto-rows: 36px; gap: 3px; }
    .slot { background: rgba(0,0,0,.25); border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 24px; user-select: none; }
    .slot.filled { cursor: pointer; }
    .slot.filled:hover { background: rgba(255,255,255,.12); }
    #login { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.45); z-index: 10; }
    #login form { position: static; padding: 18px 20px; width: 260px; display: flex; flex-direction: column; gap: 8px; }
    #login h2 { margin: 0 0 4px; font-size: 18px; color: #ffd84a; font-weight: normal; text-align: center; }
    #login label { font-size: 13px; color: #f2e6c9; display: flex; flex-direction: column; gap: 3px; }
    #login input { font: inherit; font-size: 16px; -webkit-user-select: text; user-select: text; padding: 6px 8px; border: 1px solid #6b5a3e; border-radius: 3px; background: #1d170f; color: #fff; }
    #login .buttons { display: flex; gap: 8px; margin-top: 4px; }
    #login button { flex: 1; font: inherit; font-size: 14px; padding: 7px 0; border: 1px solid #6b5a3e; border-radius: 3px; background: #5a4a2f; color: #fff; cursor: pointer; }
    #login button:hover:not(:disabled) { background: #6e5b3a; }
    #login button:disabled { opacity: .6; cursor: default; }
    #zoom { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); display: flex; flex-direction: column; gap: 4px; }
    .btn { width: 40px; height: 40px; padding: 0; font-size: 22px; line-height: 1; color: #f2e6c9; cursor: pointer; position: static; touch-action: manipulation; }
    #money { display: flex; justify-content: space-around; margin-top: 6px; padding: 5px 4px; background: rgba(0,0,0,.25); border-radius: 3px; font-size: 13px; color: #fff; }
    #money span { display: inline-flex; align-items: center; gap: 4px; }
    .coin { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.6); box-shadow: inset -2px -2px 0 rgba(0,0,0,.25); }
    .coin.gold { background: #f5c542; }
    .coin.silver { background: #c9d1d9; }
    .coin.bronze { background: #c07a3c; }
    #shop { display: none; left: 50%; top: 22%; transform: translateX(-50%); /* above your character, so you can still see the Merchant */ width: min(300px, calc(100vw - 32px)); padding: 12px 14px; z-index: 5; text-align: center; }
    body.shop-open #shop { display: block; }
    #shop h3 { margin: 0 0 8px; font-size: 16px; color: #ffd84a; font-weight: normal; }
    #shop-body { font-size: 14px; line-height: 1.5; color: #f2e6c9; margin-bottom: 10px; }
    #shop-body .price { color: #fff; }
    #shop .buttons { display: flex; gap: 6px; }
    .shop-btn { flex: 1; font: inherit; font-size: 14px; padding: 9px 0; border: 1px solid #6b5a3e; border-radius: 3px; background: #5a4a2f; color: #fff; cursor: pointer; touch-action: manipulation; }
    .shop-btn:hover:not(:disabled) { background: #6e5b3a; }
    .shop-btn:disabled { opacity: .5; cursor: default; }
    #skills { width: 240px; max-height: calc(100vh - 100px); overflow-y: auto; }
    .subskills { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
    .subskill { font-size: 13px; padding: 4px 6px; background: rgba(0,0,0,.18); border-radius: 3px; color: #fff; cursor: pointer; }
    .subskill:hover { background: rgba(255,255,255,.08); }
    .subskill.flash { animation: flash 1.2s ease-out; }
    .ss-head { display: flex; align-items: center; gap: 6px; }
    .mastery { margin: 3px 0 1px 28px; }
    .m-top { display: flex; justify-content: space-between; font-size: 12px; }
    .m-level { color: #ffd84a; }
    .m-speed { color: #9be28a; }
    .m-bar { height: 6px; margin: 2px 0; }
    .m-bar div { background: #4aa3df; }
    .m-info { font-size: 11px; color: #c9bc9c; }
    .m-types { margin-top: 4px; display: flex; flex-direction: column; gap: 1px; }
    .m-type { display: flex; align-items: center; gap: 5px; font-size: 12px; }
    .m-type-icon { width: 18px; text-align: center; }
    .m-type-state { margin-left: auto; color: #9be28a; font-size: 11px; }
    .m-type.locked { color: #8a8070; }
    .m-type.locked .m-type-state { color: #c9a26b; }
    .subskill .ss-icon { font-size: 17px; width: 22px; text-align: center; }
    .subskill .ss-state { margin-left: auto; font-size: 12px; color: #9be28a; }
    .subskill.locked { color: #8a8070; }
    .subskill.locked .ss-icon { filter: grayscale(1); opacity: .6; }
    .subskill.locked .ss-state { color: #c9a26b; }
    #shop-prices { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 6px; margin: 6px 0; font-size: 13px; color: #fff; }
    body.shop-open .slot.filled { outline: 1px solid #ffd84a; }
    .slot { position: relative; }
    .slot .price-tag { position: absolute; right: 2px; bottom: 0; font-size: 10px; color: #ffd84a; text-shadow: 1px 1px 0 #000; display: none; }
    body.shop-open .slot .price-tag { display: block; }
    .skill { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 2px 6px; padding: 6px; background: rgba(0,0,0,.25); border-radius: 3px; }
    .skill-icon { font-size: 24px; grid-row: span 2; text-align: center; }
    .skill-name { font-size: 14px; color: #fff; }
    .skill-level { font-size: 14px; color: #ffd84a; }
    .skill-bar { grid-column: 2 / 4; height: 8px; background: #1d170f; border: 1px solid #6b5a3e; border-radius: 4px; overflow: hidden; }
    .skill-bar div { height: 100%; background: #5fb84a; transition: width .3s; }
    .skill-xp { grid-column: 1 / 4; font-size: 12px; color: #c9bc9c; margin-top: 2px; }
    .skill.flash { animation: flash 1.2s ease-out; }
    @keyframes flash { from { background: rgba(255, 216, 74, .5); } to { background: rgba(0,0,0,.25); } }

    /* Phones and other small screens */
    @media (max-width: 640px), (max-height: 500px) {
      #hud { font-size: 12px; padding: 4px 8px; }
      #messages { width: auto; right: calc(130px + env(safe-area-inset-right)); font-size: 12px; padding: 4px 8px; }
      #messages div:nth-last-child(n+4) { display: none; } /* last 3 lines only */
      .sidepanel { padding: 6px; }
      #slots { grid-template-columns: repeat(4, 38px); grid-auto-rows: 34px; }
      .slot { font-size: 22px; }
      #login form { width: min(260px, calc(100vw - 48px)); }
      /* Shop sits at the top so it doesn't cover the inventory. */
      #shop { top: calc(56px + env(safe-area-inset-top)); padding: 8px 10px; }
      #shop h3 { margin-bottom: 4px; font-size: 15px; }
      #shop-body { font-size: 12px; line-height: 1.4; margin-bottom: 6px; }
      #shop-prices { margin: 4px 0; }
      #shop-prices .price { font-size: 12px; padding: 2px 5px; }
      .shop-btn { padding: 7px 0; }
    }
    /* Phone held sideways: little height, so put the inventory in 7 columns. */
    @media (max-height: 500px) {
      #slots { grid-template-columns: repeat(7, 34px); grid-auto-rows: 30px; }
      .slot { font-size: 20px; }
    }
    /* Locking items: 🔒 button on the inventory, and a lock badge on locked items */
    #inventory h3 { position: relative; }
    #lock-mode { position: absolute; right: 0; top: -4px; width: 28px; height: 24px; padding: 0; font-size: 14px; line-height: 1;
      background: rgba(0,0,0,.25); border: 1px solid #6b5a3e; border-radius: 3px; cursor: pointer; touch-action: manipulation; filter: grayscale(1); opacity: .8; }
    #lock-mode.active { filter: none; opacity: 1; border-color: #ffd84a; background: rgba(90, 74, 47, .95); }
    body.lock-mode #inventory h3 { color: #fff; }
    body.lock-mode .slot.filled { outline: 1px dashed #ffd84a; }
    .slot .lock-badge { position: absolute; left: 1px; top: -1px; font-size: 10px; }
    .slot.locked { background: rgba(255, 216, 74, .12); }
    body.shop-open .slot.locked { outline-color: #6b5a3e; }
    body.shop-open .slot.locked span:first-child { opacity: .55; }
    #shop-prices .price { font: inherit; font-size: 13px; color: #fff; background: rgba(0,0,0,.25); border: 1px solid transparent; border-radius: 3px; padding: 3px 6px; cursor: pointer; touch-action: manipulation; }
    #shop-prices .price.locked { border-color: #ffd84a; color: #ffd84a; }
    #shop-sell-all.armed { background: #8a5a1f; border-color: #ffd84a; }
    #login-error { min-height: 1.3em; font-size: 13px; color: #ff9a8a; text-align: center; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="hud" class="panel">Connecting…</div>
  <div id="zoom"><button id="zoom-in" class="panel btn" aria-label="Zoom in">+</button><button id="zoom-out" class="panel btn" aria-label="Zoom out">−</button></div>
  <div id="tabs">
    <button class="panel btn tab" data-tab="skills" aria-label="Disciplines and Mastery" title="Disciplines and Mastery">📊</button>
    <button class="panel btn tab" data-tab="inventory" aria-label="Inventory" title="Inventory">🎒<span id="bag-count" class="tab-count"></span></button>
  </div>
  <div id="hover"></div>
  <div id="messages" class="panel"></div>
  <div id="inventory" class="panel sidepanel"><h3><span id="inv-title">Inventory</span><button id="lock-mode" aria-label="Lock items" title="Lock items so they can't be sold or dropped">🔒</button></h3><div id="slots"></div><div id="money"></div></div>
  <div id="shop" class="panel">
    <h3 id="shop-title">Merchant</h3>
    <div id="shop-body"></div>
    <div class="buttons">
      <button id="shop-sell-all" class="shop-btn">Sell all</button>
      <button id="shop-close" class="shop-btn">Close</button>
    </div>
  </div>
  <div id="skills" class="panel sidepanel"><h3>Disciplines</h3><div id="skill-list"></div></div>
  <div id="login">
    <form class="panel" autocomplete="on">
      <h2>Welcome</h2>
      <label>Username <input id="login-username" name="username" autocomplete="username" maxlength="12" required /></label>
      <label>Password <input id="login-password" name="password" type="password" autocomplete="current-password" minlength="6" maxlength="100" required /></label>
      <div class="buttons">
        <button type="submit" value="login">Log in</button>
        <button type="submit" value="create">Create account</button>
      </div>
      <div id="login-error"></div>
    </form>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
